arse: no quedar",group_index:3,level:"A2"},{i:32,start:339.683,end:354.504,es:"Cuando se acabe el dinero, volvemos a casa.",group:"acabarse: no quedar",group_index:3,level:"B1"},{i:33,start:356.004,end:366.816,es:"Acabé comprando dos camisas.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:34,start:366.816,end:378.736,es:"Siempre acabamos hablando de trabajo.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:35,start:378.736,end:392.198,es:"Fuimos a pasear y acabamos cenando en la playa.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:36,start:392.198,end:407.759,es:"No quería ir, pero acabé bailando toda la noche.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:37,start:407.759,end:421.105,es:"Ella siempre acaba pagando la cuenta.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:38,start:421.105,end:436.195,es:"Empezó como un juego y acabó siendo su trabajo.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:39,start:436.195,end:450.96,es:"Si no descansas, acabarás durmiéndote en clase.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:40,start:450.96,end:465.661,es:"Al final, acabó riéndose de sus propios errores.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:41,start:467.161,end:476.606,es:"La historia acabó bien.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"A2"},{i:42,start:476.606,end:486.733,es:"La película acaba mal.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"A2"},{i:43,start:486.733,end:496.87,es:"La discusión acabó en pelea.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:44,start:496.87,end:508.001,es:"Esta calle acaba en el río.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:45,start:508.001,end:521.869,es:"Si sigues así, vas a acabar enfermo.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:46,start:521.869,end:533.121,es:"Acabaron por aceptar nuestra oferta.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:47,start:533.121,end:543.362,es:"Todo acabó en una gran fiesta.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:48,start:543.362,end:554.574,es:"El proyecto acabó por cancelarse.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:49,start:556.074,end:567.564,es:"Tenemos que acabar con este problema.",group:"acabar con",group_index:6,level:"B1"},{i:50,start:567.564,end:579.353,es:"Este trabajo va a acabar conmigo.",group:"acabar con",group_index:6,level:"B1"},{i:51,start:579.353,end:590.433,es:"La lluvia acabó con nuestros planes.",group:"acabar con",group_index:6,level:"B1"},{i:52,start:590.433,end:602.008,es:"El gobierno quiere acabar con la pobreza.",group:"acabar con",group_index:6,level:"B1"},{i:53,start:602.008,end:615.748,es:"Hay que acabar con el ruido en el edificio.",group:"acabar con",group_index:6,level:"B1"},{i:54,start:615.748,end:629.247,es:"Esta medicina acabó con mi dolor de cabeza.",group:"acabar con",group_index:6,level:"B1"},{i:55,start:629.247,end:642.927,es:"Quiero acabar con esta situación cuanto antes.",group:"acabar con",group_index:6,level:"B1"},{i:56,start:644.427,end:655.985,es:"¡Se acabó! Nos vamos a casa.",group:"expresiones",group_index:7,level:"A2"},{i:57,start:655.985,end:669.865,es:"Y colorín colorado, este cuento se ha acabado.",group:"expresiones",group_index:7,level:"A2"},{i:58,start:669.865,end:679.336,es:"Esto no acaba nunca.",group:"expresiones",group_index:7,level:"B1"},{i:59,start:679.336,end:689.874,es:"No acabo de entender la pregunta.",group:"expresiones",group_index:7,level:"B1"},{i:60,start:689.874,end:702.321,es:"No acabo de acostumbrarme a esta ciudad.",group:"expresiones",group_index:7,level:"B1"},{i:61,start:702.321,end:711.598,es:"Lo bueno se acaba pronto.",group:"expresiones",group_index:7,level:"B1"},{i:62,start:711.598,end:724.578,es:"No vas a salir esta noche, y se acabó.",group:"expresiones",group_index:7,level:"B1"}],ta={word:aa,slug:oa,kind:ra,hash:sa,duration:na,voice:la,marks:ia},ua="conocer",da="conocer",pa="word",ga="caf4c3f868571eb0",ca=774.864,va="mx-lento",ma=[{i:0,start:.5,end:9.244,es:"Conozco a tu hermano.",group:"conocer a una persona",group_index:0,level:"A1"},{i:1,start:9.244,end:19.176,es:"No conozco a nadie aquí.",group:"conocer a una persona",group_index:0,level:"A1"},{i:2,start:19.176,end:27.635,es:"¿Conoces a mi vecina?",group:"conocer a una persona",group_index:0,level:"A1"},{i:3,start:27.635,end:39.949,es:"Ella conoce a todos en la oficina.",group:"conocer a una persona",group_index:0,level:"A1"},{i:4,start:39.949,end:51.04,es:"Conocemos al profesor de música.",group:"conocer a una persona",group_index:0,level:"A1"},{i:5,start:51.04,end:62.171,es:"Mis padres no conocen a mi jefe.",group:"conocer a una persona",group_index:0,level:"A1"},{i:6,start:62.171,end:74.118,es:"Yo conozco a la dueña del restaurante.",group:"conocer a una persona",group_index:0,level:"A1"},{i:7,start:74.118,end:85.581,es:"Te conozco desde hace muchos años.",group:"conocer a una persona",group_index:0,level:"A2"},{i:8,start:87.081,end:95.829,es:"No conozco esta ciudad.",group:"conocer un lugar",group_index:1,level:"A1"},{i:9,start:95.829,end:107.805,es:"Conozco un buen restaurante cerca de aquí.",group:"conocer un lugar",group_index:1,level:"A1"},{i:10,start:107.805,end:115.81,es:"¿Conoces México?",group:"conocer un lugar",group_index:1,level:"A1"},{i:11,start:115.81,end:125.497,es:"Mi abuela no conoce el mar.",group:"conocer un lugar",group_index:1,level:"A1"},{i:12,start:125.497,end:135.313,es:"Quiero conocer Buenos Aires.",group:"conocer un lugar",group_index:1,level:"A1"},{i:13,start:135.313,end:144.886,es:"Ya conocemos este museo.",group:"conocer un lugar",group_index:1,level:"A1"},{i:14,start:144.886,end:157.147,es:"El taxista conoce todas las calles.",group:"conocer un lugar",group_index:1,level:"A1"},{i:15,start:157.147,end:169.875,es:"Nunca he conocido un lugar tan tranquilo.",group:"conocer un lugar",group_index:1,level:"A2"},{i:16,start:171.375,end:180.564,es:"¿Conoces un buen médico?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:17,start:180.564,end:190.413,es:"¿Conoces algún hotel barato?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:18,start:190.413,end:200.902,es:"¿Conocen una tienda abierta ahora?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:19,start:200.902,end:213.162,es:"¿Conoces una buena película para esta noche?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:20,start:213.162,end:226.857,es:"Si conoces un buen mecánico, avísame.",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:21,start:226.857,end:239.399,es:"¿Conoces alguna receta fácil con pollo?",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:22,start:239.399,end:252.737,es:"Te recomiendo un café que conozco en el centro.",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:23,start:252.737,end:266.173,es:"¿Usted conoce a alguien que hable inglés?",group:"preguntas y recomendaciones",group_index:2,level:"B1"},{i:24,start:267.673,end:277.211,es:"Mucho gusto en conocerte.",group:"conocer por primera vez",group_index:3,level:"A1"},{i:25,start:277.211,end:288.387,es:"Conocí a mi novia en la universidad.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:26,start:288.387,end:298.598,es:"¿Dónde conociste a tu esposo?",group:"conocer por primera vez",group_index:3,level:"A2"},{i:27,start:298.598,end:311.001,es:"Nos conocimos en una fiesta de cumpleaños.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:28,start:311.001,end:323.592,es:"Ayer conocí a los padres de Carlos.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:29,start:323.592,end:336.265,es:"Mañana vas a conocer a mi familia.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:30,start:336.265,end:350.469,es:"Conocí a mi mejor amigo en el autobús.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:31,start:350.469,end:365.531,es:"Me encantaría conocer a tu hermana algún día.",group:"conocer por primera vez",group_index:3,level:"B1"},{i:32,start:367.031,end:375.093,es:"¿Ustedes se conocen?",group:"conocerse",group_index:4,level:"A1"},{i:33,start:375.093,end:386.264,es:"Nosotros nos conocemos desde niños.",group:"conocerse",group_index:4,level:"A2"},{i:34,start:386.264,end:396.728,es:"Ellos se conocieron en el trabajo.",group:"conocerse",group_index:4,level:"A2"},{i:35,start:396.728,end:407.583,es:"Nos conocimos hace diez años.",group:"conocerse",group_index:4,level:"A2"},{i:36,start:407.583,end:418.246,es:"Mis padres se conocieron en un tren.",group:"conocerse",group_index:4,level:"A2"},{i:37,start:418.246,end:433.221,es:"Me conozco muy bien y sé cuándo necesito descansar.",group:"conocerse",group_index:4,level:"B1"},{i:38,start:433.221,end:445.08,es:"Es importante conocerse a uno mismo.",group:"conocerse",group_index:4,level:"B1"},{i:39,start:446.58,end:459.554,es:"Conozco a Ana, pero no sé dónde vive.",group:"conocer y saber",group_index:5,level:"A2"},{i:40,start:459.554,end:473.131,es:"Conozco Madrid, pero no sé dónde está tu hotel.",group:"conocer y saber",group_index:5,level:"A2"},{i:41,start:473.131,end:487.51,es:"Sé su nombre, pero no lo conozco personalmente.",group:"conocer y saber",group_index:5,level:"A2"},{i:42,start:487.51,end:499.764,es:"Conozco la canción, pero no sé la letra.",group:"conocer y saber",group_index:5,level:"A2"},{i:43,start:499.764,end:515.015,es:"No conozco al nuevo director, solo sé que es muy serio.",group:"conocer y saber",group_index:5,level:"B1"},{i:44,start:515.015,end:534.478,es:"Conozco el camino, así que sé cuánto tiempo vamos a tardar.",group:"conocer y saber",group_index:5,level:"B1"},{i:45,start:534.478,end:550.866,es:"Aunque conozco bien el tema, no sé si podré explicarlo.",group:"conocer y saber",group_index:5,level:"B1"},{i:46,start:552.366,end:564.97,es:"Es un cantante muy conocido en su país.",group:"conocido y dar a conocer",group_index:6,level:"A2"},{i:47,start:564.97,end:576.797,es:"Esta ciudad es conocida por su comida.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:48,start:576.797,end:588.515,es:"El pintor es conocido en todo el mundo.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:49,start:588.515,end:599.386,es:"Lo conocen como el rey de la salsa.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:50,start:599.386,end:612.861,es:"La empresa dio a conocer su nuevo producto ayer.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:51,start:612.861,end:627.8,es:"Mañana van a dar a conocer los resultados del examen.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:52,start:627.8,end:640.816,es:"El pueblo es conocido como la capital del café.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:53,start:640.816,end:654.604,es:"El libro ayudó a dar a conocer la historia de la región.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:54,start:656.104,end:667.417,es:"Conozco muy bien a mi hermana.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A1"},{i:55,start:667.417,end:684.802,es:"Mi vecina me conoce de vista porque paso por su calle todos los días.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A2"},{i:56,start:684.802,end:699.478,es:"Lo conozco de vista, pero nunca hemos hablado.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A2"},{i:57,start:699.478,end:711.487,es:"Ella conoce el tema a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:58,start:711.487,end:726.232,es:"Antes de decidir, quiero conocer el proyecto a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:59,start:726.232,end:741.244,es:"No lo conocía bien, pero parecía una buena persona.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:60,start:741.244,end:757.719,es:"Para trabajar aquí, es necesario que conozcas bien el sistema.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:61,start:757.719,end:774.811,es:"Después de tantos viajes, conoce el país a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"}],xa={word:ua,slug:da,kind:pa,hash:ga,duration:ca,voice:va,marks:ma},_a="dar",Aa="dar",ha="word",ba="7b01431b44a24445",fa=707.976,qa="mx-lento",ya=[{i:0,start:.5,end:10.157,es:"Te doy mi número de teléfono.",group:"dar, entregar",group_index:0,level:"A1"},{i:1,start:10.157,end:19.414,es:"¿Me das un vaso de agua?",group:"dar, entregar",group_index:0,level:"A1"},{i:2,start:19.414,end:30.97,es:"Mi abuela me da dinero en mi cumpleaños.",group:"dar, entregar",group_index:0,level:"A1"},{i:3,start:30.97,end:41.867,es:"El profesor nos da mucha tarea.",group:"dar, entregar",group_index:0,level:"A1"},{i:4,start:41.867,end:51.276,es:"¿Le das de comer al gato?",group:"dar, entregar",group_index:0,level:"A1"},{i:5,start:51.276,end:58.568,es:"Dame la mano.",group:"dar, entregar",group_index:0,level:"A1"},{i:6,start:58.568,end:70.147,es:"Los vecinos nos dan fruta de su jardín.",group:"dar, entregar",group_index:0,level:"A1"},{i:7,start:70.147,end:78.408,es:"¿Qué le damos a mamá?",group:"dar, entregar",group_index:0,level:"A1"},{i:8,start:78.408,end:87.842,es:"¿Me das la sal, por favor?",group:"dar, entregar",group_index:0,level:"A1"},{i:9,start:89.342,end:99.112,es:"Te doy las gracias por todo.",group:"dar las gracias",group_index:1,level:"A1"},{i:10,start:99.112,end:111.466,es:"Siempre damos las gracias al conductor.",group:"dar las gracias",group_index:1,level:"A1"},{i:11,start:111.466,end:122.837,es:"Quiero darle las gracias a tu madre.",group:"dar las gracias",group_index:1,level:"A1"},{i:12,start:122.837,end:131.586,es:"Hay que dar las gracias.",group:"dar las gracias",group_index:1,level:"A1"},{i:13,start:131.586,end:141.893,es:"Le di las gracias por el regalo.",group:"dar las gracias",group_index:1,level:"A2"},{i:14,start:141.893,end:152.315,es:"Los niños no dieron las gracias.",group:"dar las gracias",group_index:1,level:"A2"},{i:15,start:153.815,end:165.999,es:"Le di un beso a mi abuela.",group:"di, dio, daba",group_index:2,level:"A2"},{i:16,start:165.999,end:176.522,es:"Mi jefe me dio el día libre.",group:"di, dio, daba",group_index:2,level:"A2"},{i:17,start:176.522,end:185.572,es:"¿Quién te dio esa noticia?",group:"di, dio, daba",group_index:2,level:"A2"},{i:18,start:185.572,end:199.392,es:"Nos dieron una habitación con vista al mar.",group:"di, dio, daba",group_index:2,level:"A2"},{i:19,start:199.392,end:212.369,es:"Mi padre siempre me daba buenos consejos.",group:"di, dio, daba",group_index:2,level:"A2"},{i:20,start:212.369,end:222.572,es:"El médico me dio una receta.",group:"di, dio, daba",group_index:2,level:"A2"},{i:21,start:222.572,end:234.181,es:"Le dimos un regalo a nuestra profesora.",group:"di, dio, daba",group_index:2,level:"A2"},{i:22,start:235.681,end:248.118,es:"Después de comer, damos un paseo.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A1"},{i:23,start:248.118,end:260.566,es:"Mis abuelos dan un paseo cada tarde.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A1"},{i:24,start:260.566,end:271.702,es:"Vamos a dar una vuelta por el centro.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:25,start:271.702,end:283.248,es:"¿Quieres dar una vuelta en bicicleta?",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:26,start:283.248,end:294.815,es:"Ayer dimos un paseo por la playa.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:27,start:294.815,end:305.857,es:"Voy a dar una vuelta con el perro.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:28,start:305.857,end:319.84,es:"Dimos una vuelta por el mercado antes de cenar.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:29,start:321.34,end:330.392,es:"Me dan miedo las arañas.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:30,start:330.392,end:344.66,es:"A mi hijo le da miedo la oscuridad.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:31,start:344.66,end:355.918,es:"Me da vergüenza hablar en público.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:32,start:355.918,end:367.278,es:"¿No te da vergüenza llegar tan tarde?",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:33,start:367.278,end:378.178,es:"Me da pena ver a ese perro solo.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:34,start:378.178,end:389.164,es:"Nos dio mucha pena dejar la ciudad.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:35,start:389.164,end:400.023,es:"Esa película me dio mucho miedo.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:36,start:400.023,end:411.851,es:"Le da vergüenza bailar delante de todos.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:37,start:413.351,end:420.963,es:"Me da igual.",group:"dar igual",group_index:5,level:"A1"},{i:38,start:420.963,end:432.153,es:"¿Pizza o pasta? Me da igual.",group:"dar igual",group_index:5,level:"A1"},{i:39,start:432.153,end:446.366,es:"Nos da igual el precio, queremos un buen hotel.",group:"dar igual",group_index:5,level:"A2"},{i:40,start:446.366,end:456.206,es:"¿Te da igual si vamos mañana?",group:"dar igual",group_index:5,level:"A2"},{i:41,start:456.206,end:471.389,es:"Antes me importaba, pero ahora me da igual.",group:"dar igual",group_index:5,level:"A2"},{i:42,start:471.389,end:481.943,es:"Da igual, no pasa nada.",group:"dar igual",group_index:5,level:"A2"},{i:43,start:481.943,end:496.664,es:"A ella le da igual lo que piensen los demás.",group:"dar igual",group_index:5,level:"B1"},{i:44,start:498.164,end:505.438,es:"¡Date prisa!",group:"darse prisa",group_index:6,level:"A1"},{i:45,start:505.438,end:517.992,es:"Dense prisa, el tren sale ahora.",group:"darse prisa",group_index:6,level:"A2"},{i:46,start:517.992,end:531.663,es:"Si no nos damos prisa, vamos a llegar tarde.",group:"darse prisa",group_index:6,level:"A2"},{i:47,start:531.663,end:542.252,es:"Me di prisa y llegué a tiempo.",group:"darse prisa",group_index:6,level:"A2"},{i:48,start:542.252,end:552.683,es:"No hace falta que te des prisa.",group:"darse prisa",group_index:6,level:"B1"},{i:49,start:554.183,end:563.291,es:"No me di cuenta de la hora.",group:"darse cuenta",group_index:7,level:"A2"},{i:50,start:563.291,end:572.964,es:"¿Te diste cuenta de que no estaba?",group:"darse cuenta",group_index:7,level:"A2"},{i:51,start:572.964,end:583.081,es:"Me di cuenta demasiado tarde.",group:"darse cuenta",group_index:7,level:"A2"},{i:52,start:583.081,end:598.652,es:"De repente me di cuenta de que había perdido las llaves.",group:"darse cuenta",group_index:7,level:"B1"},{i:53,start:598.652,end:608.691,es:"Nadie se dio cuenta del error.",group:"darse cuenta",group_index:7,level:"B1"},{i:54,start:608.691,end:621.321,es:"Cuando te des cuenta, ya será tarde.",group:"darse cuenta",group_index:7,level:"B1"},{i:55,start:621.321,end:633.711,es:"Es importante que se den cuenta del problema.",group:"darse cuenta",group_index:7,level:"B1"},{i:56,start:633.711,end:644.95,es:"Por fin me he dado cuenta de lo que quiero.",group:"darse cuenta",group_index:7,level:"B1"},{i:57,start:646.45,end:656.478,es:"La ventana da al mar.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:58,start:656.478,end:669.426,es:"Mi habitación da a un patio tranquilo.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:59,start:669.426,end:683.344,es:"Queremos una habitación que dé a la calle.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:60,start:683.344,end:694.616,es:"La puerta de la cocina da al jardín.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:61,start:694.616,end:707.915,es:"El balcón daba a una plaza muy bonita.",group:"dar a, mirar hacia",group_index:8,level:"B1"}],ja={word:_a,slug:Aa,kind:ha,hash:ba,duration:fa,voice:qa,marks:ya},Ba="dejar",za="dejar",Ma="word",Ea="deceac92e5a29233",ka=633,$a="mx-lento",wa=[{i:0,start:.5,end:10.242,es:"Deja tu abrigo aquí.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:1,start:10.242,end:19.254,es:"¿Dónde dejo las llaves?",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:2,start:19.254,end:29.075,es:"Dejo el auto en la calle.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:3,start:29.075,end:40.124,es:"Siempre dejo la ventana abierta.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:4,start:40.124,end:50.472,es:"Deja los zapatos en la puerta.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:5,start:50.472,end:61.167,es:"Dejé el teléfono en casa.",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:6,start:61.167,end:70.318,es:"¿Dónde dejaste mi libro?",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:7,start:70.318,end:82.989,es:"Te dejé un poco de pastel en la cocina.",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:8,start:84.489,end:93.206,es:"¿Me dejas ir al baño?",group:"dejar, permitir",group_index:1,level:"A1"},{i:9,start:93.206,end:100.383,es:"Déjame ver.",group:"dejar, permitir",group_index:1,level:"A1"},{i:10,start:100.383,end:110.125,es:"Mi madre no me deja salir.",group:"dejar, permitir",group_index:1,level:"A1"},{i:11,start:110.125,end:118.24,es:"Déjame ayudarte.",group:"dejar, permitir",group_index:1,level:"A1"},{i:12,start:118.24,end:127.866,es:"El ruido no me deja dormir.",group:"dejar, permitir",group_index:1,level:"A1"},{i:13,start:127.866,end:138.401,es:"¿Me dejas usar tu computadora?",group:"dejar, permitir",group_index:1,level:"A1"},{i:14,start:138.401,end:152.575,es:"Mis padres nunca me dejaban ver televisión de noche.",group:"dejar, permitir",group_index:1,level:"A2"},{i:15,start:152.575,end:162.992,es:"No me dejaron entrar sin entrada.",group:"dejar, permitir",group_index:1,level:"A2"},{i:16,start:164.492,end:172.413,es:"No me dejes solo.",group:"dejar a alguien",group_index:2,level:"A1"},{i:17,start:172.413,end:181.004,es:"Te dejo en la esquina.",group:"dejar a alguien",group_index:2,level:"A1"},{i:18,start:181.004,end:188.663,es:"Mi novia me dejó.",group:"dejar a alguien",group_index:2,level:"A2"},{i:19,start:188.663,end:199.334,es:"Dejé a los niños con mi madre.",group:"dejar a alguien",group_index:2,level:"A2"},{i:20,start:199.334,end:209.468,es:"Mi padre me dejó en la estación.",group:"dejar a alguien",group_index:2,level:"A2"},{i:21,start:209.468,end:222.923,es:"Él la dejó después de cinco años juntos.",group:"dejar a alguien",group_index:2,level:"A2"},{i:22,start:222.923,end:234.142,es:"Nunca voy a dejar a mis amigos.",group:"dejar a alguien",group_index:2,level:"A2"},{i:23,start:235.642,end:243.138,es:"¡Deja de gritar!",group:"dejar de + infinitivo",group_index:3,level:"A1"},{i:24,start:243.138,end:253.907,es:"Dejé de fumar el año pasado.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:25,start:253.907,end:263.134,es:"Por fin ha dejado de llover.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:26,start:263.134,end:275.317,es:"Mi hermano dejó de trabajar en el banco.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:27,start:275.317,end:287.115,es:"Tienes que dejar de comer tanto azúcar.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:28,start:287.115,end:302.469,es:"Cuando nació mi hijo, dejé de salir por la noche.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:29,start:302.469,end:314.142,es:"Quiero dejar de preocuparme por todo.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:30,start:314.142,end:324.071,es:"El reloj dejó de funcionar.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:31,start:325.571,end:336.975,es:"Dejé mi trabajo en marzo.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:32,start:336.975,end:346.363,es:"Ella dejó la universidad.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:33,start:346.363,end:355.21,es:"Quiero dejar el café.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:34,start:355.21,end:368.02,es:"Dejamos el gimnasio porque era muy caro.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:35,start:368.02,end:381.438,es:"Mi abuelo dejó el tabaco hace diez años.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:36,start:381.438,end:391.613,es:"No pienso dejar mis estudios.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:37,start:393.113,end:402.193,es:"El bebé no deja de llorar.",group:"no dejar de",group_index:5,level:"A2"},{i:38,start:402.193,end:415.015,es:"Mi vecino no dejó de hablar en toda la cena.",group:"no dejar de",group_index:5,level:"A2"},{i:39,start:415.015,end:425.653,es:"No dejes de visitar el mercado.",group:"no dejar de",group_index:5,level:"B1"},{i:40,start:425.653,end:434.483,es:"No dejo de pensar en ti.",group:"no dejar de",group_index:5,level:"B1"},{i:41,start:434.483,end:446.188,es:"No dejen de probar la sopa de la casa.",group:"no dejar de",group_index:5,level:"B1"},{i:42,start:446.188,end:457.349,es:"No dejes de llamarme cuando llegues.",group:"no dejar de",group_index:5,level:"B1"},{i:43,start:457.349,end:471.659,es:"Aunque esté cansado, no deja de ir al gimnasio.",group:"no dejar de",group_index:5,level:"B1"},{i:44,start:473.159,end:485.21,es:"Deja la puerta cerrada, por favor.",group:"dejar + participio o adjetivo",group_index:6,level:"A2"},{i:45,start:485.21,end:494.385,es:"Dejé la cena preparada.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:46,start:494.385,end:504.668,es:"La noticia me dejó preocupado.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:47,start:504.668,end:515.78,es:"Dejamos todo listo para el viaje.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:48,start:515.78,end:525.717,es:"El examen me dejó agotado.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:49,start:525.717,end:536.631,es:"El viaje nos dejó muy contentos.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:50,start:536.631,end:547.516,es:"Ya dejé pagada la cuenta del hotel.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:51,start:549.016,end:560.321,es:"Sin querer, dejé caer el plato.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:52,start:560.321,end:570.316,es:"Déjalo, no importa.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:53,start:570.316,end:580.3,es:"Deja eso para mañana.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:54,start:580.3,end:587.73,es:"Déjame en paz.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:55,start:587.73,end:598.736,es:"Deja que lo piense un poco.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:56,start:598.736,end:611.047,es:"Dejemos el tema para otro día.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:57,start:611.047,end:623.254,es:"No dejes para mañana lo que puedas hacer hoy.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:58,start:623.254,end:632.948,es:"Eso deja mucho que desear.",group:"expresiones con dejar",group_index:7,level:"B1"}],Na={word:Ba,slug:za,kind:Ma,hash:Ea,duration:ka,voice:$a,marks:wa},Sa="echar",La="echar",Ta="word",Pa="83c786b8d951e169",Ca=705.816,Ha="mx-lento",Qa=[{i:0,start:.5,end:10.596,es:"Echa la pelota al perro.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:1,start:10.596,end:19.978,es:"Echo la carta en el buzón.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:2,start:19.978,end:31.31,es:"Los niños echan piedras al río.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:3,start:31.31,end:41.008,es:"¿Puedes echar esto a la basura?",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:4,start:41.008,end:51.219,es:"Ella echa pan a los patos.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:5,start:51.219,end:60.906,es:"No eches papeles al suelo.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:6,start:60.906,end:71.527,es:"Echamos una moneda a la fuente.",group:"echar, lanzar algo",group_index:0,level:"A2"},{i:7,start:73.027,end:83.963,es:"Echa un poco de sal a la sopa.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:8,start:83.963,end:93.623,es:"¿Le echas azúcar al café?",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:9,start:93.623,end:102.59,es:"Yo no echo leche al té.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:10,start:102.59,end:112.13,es:"Echa más agua a la olla.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:11,start:112.13,end:125.578,es:"Mi abuela echa mucho ajo a todo.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:12,start:125.578,end:139.015,es:"Echa un poco de hielo a la limonada.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:13,start:139.015,end:149.815,es:"¿Cuánto aceite le echo a la ensalada?",group:"echar en la comida y la bebida",group_index:1,level:"A2"},{i:14,start:149.815,end:161.537,es:"Le eché demasiada pimienta a la carne.",group:"echar en la comida y la bebida",group_index:1,level:"A2"},{i:15,start:163.037,end:174.288,es:"¿Me echas una mano con estas cajas?",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:16,start:174.288,end:187.16,es:"Mi vecino siempre me echa una mano.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:17,start:187.16,end:197.134,es:"Te echo una mano con la cena.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:18,start:197.134,end:212.208,es:"Ayer le eché una mano a mi hermano con la mudanza.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:19,start:212.208,end:223.166,es:"¿Puedes echar un vistazo a mi trabajo?",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:20,start:223.166,end:234.064,es:"Voy a echar un vistazo a la tienda.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:21,start:234.064,end:247.829,es:"Echa un vistazo al bebé, por favor.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:22,start:247.829,end:261.201,es:"El mecánico le echó un vistazo al motor.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:23,start:262.701,end:272.752,es:"El perro se echa en el sofá.",group:"echarse, acostarse",group_index:3,level:"A1"},{i:24,start:272.752,end:285.665,es:"Estoy cansado, voy a echarme un rato.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:25,start:285.665,end:299.546,es:"Después de comer, me eché en la cama.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:26,start:299.546,end:313.219,es:"Mi padre se echa en la hamaca todas las tardes.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:27,start:313.219,end:324.789,es:"Nos echamos en la arena a tomar el sol.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:28,start:324.789,end:338.227,es:"Échate un momento si te duele la cabeza.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:29,start:338.227,end:349.275,es:"El gato se echó al lado de la ventana.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:30,start:350.775,end:358.439,es:"¿Me echas de menos?",group:"echar de menos",group_index:4,level:"A1"},{i:31,start:358.439,end:368.375,es:"Echo de menos a mi familia.",group:"echar de menos",group_index:4,level:"A2"},{i:32,start:368.375,end:379.658,es:"Echamos de menos la comida de casa.",group:"echar de menos",group_index:4,level:"A2"},{i:33,start:379.658,end:393.927,es:"Cuando vivía lejos, echaba de menos el mar.",group:"echar de menos",group_index:4,level:"A2"},{i:34,start:393.927,end:403.605,es:"Te he echado mucho de menos.",group:"echar de menos",group_index:4,level:"A2"},{i:35,start:403.605,end:418.298,es:"Mi hija echa de menos a sus amigos del colegio.",group:"echar de menos",group_index:4,level:"A2"},{i:36,start:418.298,end:428.963,es:"Voy a echar de menos esta ciudad.",group:"echar de menos",group_index:4,level:"A2"},{i:37,start:428.963,end:443.932,es:"Nadie echó de menos la televisión durante las vacaciones.",group:"echar de menos",group_index:4,level:"A2"},{i:38,start:445.432,end:457.073,es:"Mi madre echó a los niños de la cocina.",group:"echar a alguien",group_index:5,level:"A2"},{i:39,start:457.073,end:468.734,es:"Lo echaron del trabajo por llegar tarde.",group:"echar a alguien",group_index:5,level:"B1"},{i:40,start:468.734,end:481.603,es:"El dueño nos echó del restaurante a medianoche.",group:"echar a alguien",group_index:5,level:"B1"},{i:41,start:481.603,end:495.506,es:"Si no pagas el alquiler, te van a echar.",group:"echar a alguien",group_index:5,level:"B1"},{i:42,start:495.506,end:506.88,es:"Echaron a dos jugadores del partido.",group:"echar a alguien",group_index:5,level:"B1"},{i:43,start:506.88,end:520.377,es:"Me echaron de la biblioteca por hablar por teléfono.",group:"echar a alguien",group_index:5,level:"B1"},{i:44,start:520.377,end:534.185,es:"No creo que te echen por un error tan pequeño.",group:"echar a alguien",group_index:5,level:"B1"},{i:45,start:535.685,end:548.764,es:"Cuando vio al perro, el niño echó a correr.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:46,start:548.764,end:560.85,es:"Al oír la noticia, se echó a llorar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:47,start:560.85,end:573.063,es:"De repente, todos se echaron a reír.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:48,start:573.063,end:582.064,es:"El pájaro echó a volar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:49,start:582.064,end:595.928,es:"Cuando abrieron la puerta, la gente echó a andar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:50,start:595.928,end:608.229,es:"Si le dices eso, se va a echar a llorar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:51,start:608.229,end:623.737,es:"Empezó a llover y echamos a correr hacia la casa.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:52,start:625.237,end:637.831,es:"Siempre me echa la culpa a mí.",group:"expresiones con echar",group_index:7,level:"B1"},{i:53,start:637.831,end:648.473,es:"El calor echó a perder la fruta.",group:"expresiones con echar",group_index:7,level:"B1"},{i:54,start:648.473,end:659.376,es:"No eches a perder esta oportunidad.",group:"expresiones con echar",group_index:7,level:"B1"},{i:55,start:659.376,end:671.118,es:"Siempre me echa en cara mis errores.",group:"expresiones con echar",group_index:7,level:"B1"},{i:56,start:671.118,end:682.898,es:"Estaba tan furioso que echaba humo.",group:"expresiones con echar",group_index:7,level:"B1"},{i:57,start:682.898,end:694.936,es:"Me gustaría echar raíces en este pueblo.",group:"expresiones con echar",group_index:7,level:"B1"},{i:58,start:694.936,end:705.753,es:"No le eches más leña al fuego.",group:"expresiones con echar",group_index:7,level:"B1"}],Da={word:Sa,slug:La,kind:Ta,hash:Pa,duration:Ca,voice:Ha,marks:Qa},Ya="faltar / hacer falta",Va="faltar_hacer_falta",Oa="word",Ia="7798f940d0fed6ed",Fa=653.064,Ra="mx-lento",Ua=[{i:0,start:.5,end:8.55,es:"Me falta dinero.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:1,start:8.55,end:15.987,es:"¿Qué te falta?",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:2,start:15.987,end:25.087,es:"A la sopa le falta sal.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:3,start:25.087,end:33.884,es:"Nos faltan dos sillas.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:4,start:33.884,end:47.21,es:"A mi camisa le falta un botón.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:5,start:47.21,end:57.166,es:"Te falta una firma aquí.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:6,start:57.166,end:67.935,es:"Me faltan tres páginas del libro.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:7,start:67.935,end:79.586,es:"A este equipo le falta un jugador.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:8,start:81.086,end:90.613,es:"Falta poco para llegar.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:9,start:90.613,end:101.95,es:"Faltan dos días para mi cumpleaños.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:10,start:101.95,end:111.273,es:"¿Cuánto falta para el verano?",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:11,start:111.273,end:122.703,es:"Faltan cinco minutos para las nueve.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:12,start:122.703,end:132.391,es:"Ya falta poco, niños.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:13,start:132.391,end:146.277,es:"Todavía faltan tres semanas para las vacaciones.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:14,start:146.277,end:155.723,es:"¿Cuántas estaciones faltan?",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:15,start:155.723,end:167.424,es:"Solo falta una semana para la boda.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:16,start:168.924,end:178.489,es:"En la fiesta faltó comida.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:17,start:178.489,end:191.013,es:"Me faltó tiempo para terminar el examen.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:18,start:191.013,end:202.372,es:"Cuando llegamos, faltaba el postre.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:19,start:202.372,end:214.031,es:"Siempre nos faltaba dinero a fin de mes.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:20,start:214.031,end:223.078,es:"¿Quién faltó a la reunión?",group:"faltó, faltaba",group_index:2,level:"A2"},{i:21,start:223.078,end:236.077,es:"Faltó agua en el barrio toda la semana.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:22,start:236.077,end:248.286,es:"Faltaban diez minutos para la medianoche.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:23,start:249.786,end:261.474,es:"Hoy falto a clase porque estoy enfermo.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A1"},{i:24,start:261.474,end:270.617,es:"Nunca falto al trabajo.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A1"},{i:25,start:270.617,end:281.674,es:"Mi hijo faltó a clase dos días.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:26,start:281.674,end:290.692,es:"¿Por qué faltaste ayer?",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:27,start:290.692,end:303.481,es:"Si faltas mucho, vas a perder el curso.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:28,start:303.481,end:315.796,es:"Ella nunca ha faltado a una cita.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:29,start:315.796,end:325.901,es:"No quiero faltar a tu fiesta.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:30,start:327.401,end:336.314,es:"Hace falta paciencia.",group:"hace falta + nombre",group_index:4,level:"A1"},{i:31,start:336.314,end:344.694,es:"¿Te hace falta algo?",group:"hace falta + nombre",group_index:4,level:"A1"},{i:32,start:344.694,end:355.455,es:"Me hace falta un abrigo nuevo.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:33,start:355.455,end:365.758,es:"Nos hacen falta más platos.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:34,start:365.758,end:378.445,es:"Para este trabajo hace falta experiencia.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:35,start:378.445,end:390.754,es:"En esta casa hace falta más luz.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:36,start:390.754,end:401.711,es:"Te hacen falta unas vacaciones.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:37,start:401.711,end:412.428,es:"Le hacía falta un amigo.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:38,start:413.928,end:423.633,es:"Hace falta estudiar más.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:39,start:423.633,end:433.54,es:"No hace falta pagar ahora.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:40,start:433.54,end:443.676,es:"¿Hace falta reservar mesa?",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:41,start:443.676,end:454.27,es:"No hace falta llevar paraguas.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:42,start:454.27,end:468.069,es:"Para viajar allí hace falta tener pasaporte.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:43,start:468.069,end:481.923,es:"Gracias, pero no hacía falta traer nada.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:44,start:481.923,end:495.957,es:"Hará falta comprar más comida para el sábado.",group:"hace falta + infinitivo",group_index:5,level:"B1"},{i:45,start:497.457,end:507.354,es:"No hace falta que vengas.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:46,start:507.354,end:517.736,es:"No hace falta que me esperes.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:47,start:517.736,end:528.585,es:"No hace falta que traigan nada.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:48,start:528.585,end:537.942,es:"¿Hace falta que lo repita?",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:49,start:537.942,end:551.863,es:"Hace falta que alguien hable con el director.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:50,start:551.863,end:563.052,es:"No hacía falta que te molestaras.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:51,start:563.052,end:576.025,es:"No hace falta que me lo expliques otra vez.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:52,start:577.525,end:585.06,es:"¡Lo que faltaba!",group:"expresiones",group_index:7,level:"A2"},{i:53,start:585.06,end:594.625,es:"Me haces mucha falta.",group:"expresiones",group_index:7,level:"B1"},{i:54,start:594.625,end:606.112,es:"No le faltes el respeto a tu abuela.",group:"expresiones",group_index:7,level:"B1"},{i:55,start:606.112,end:620.11,es:"Vivo lejos y me hace mucha falta mi familia.",group:"expresiones",group_index:7,level:"B1"},{i:56,start:620.11,end:632.388,es:"Faltó poco para que perdiéramos el avión.",group:"expresiones",group_index:7,level:"B1"},{i:57,start:632.388,end:643.723,es:"No faltaría más, pase usted.",group:"expresiones",group_index:7,level:"B1"},{i:58,start:643.723,end:652.993,es:"Aquí no nos falta nada.",group:"expresiones",group_index:7,level:"B1"}],Ga={word:Ya,slug:Va,kind:Oa,hash:Ia,duration:Fa,voice:Ra,marks:Ua},Ka="haber",Xa="haber",Ja="word",Wa="f0d7ef64b0167a53",Za=673.056,eo="mx-lento",ao=[{i:0,start:.5,end:11.269,es:"Hay un perro en el jardín.",group:"hay",group_index:0,level:"A1"},{i:1,start:11.269,end:21.097,es:"¿Hay leche en el refrigerador?",group:"hay",group_index:0,level:"A1"},{i:2,start:21.097,end:28.265,es:"No hay pan.",group:"hay",group_index:0,level:"A1"},{i:3,start:28.265,end:38.825,es:"Hay muchas personas en la calle.",group:"hay",group_index:0,level:"A1"},{i:4,start:38.825,end:49.543,es:"En mi clase hay veinte estudiantes.",group:"hay",group_index:0,level:"A1"},{i:5,start:49.543,end:59.56,es:"¿Hay un banco cerca de aquí?",group:"hay",group_index:0,level:"A1"},{i:6,start:59.56,end:67.591,es:"Hoy no hay clase.",group:"hay",group_index:0,level:"A1"},{i:7,start:67.591,end:77.664,es:"Hay dos camas en la habitación.",group:"hay",group_index:0,level:"A1"},{i:8,start:77.664,end:85.709,es:"¿Qué hay para comer?",group:"hay",group_index:0,level:"A1"},{i:9,start:87.209,end:95.273,es:"Hay que comer bien.",group:"hay que",group_index:1,level:"A1"},{i:10,start:95.273,end:104.161,es:"Hay que llegar temprano.",group:"hay que",group_index:1,level:"A1"},{i:11,start:104.161,end:113.211,es:"Hay que tener paciencia.",group:"hay que",group_index:1,level:"A1"},{i:12,start:113.211,end:122.563,es:"Hay que lavar los platos.",group:"hay que",group_index:1,level:"A1"},{i:13,start:122.563,end:132.368,es:"Hay que hablar con ella hoy.",group:"hay que",group_index:1,level:"A1"},{i:14,start:132.368,end:145.399,es:"Para entrar, hay que comprar una entrada.",group:"hay que",group_index:1,level:"A2"},{i:15,start:145.399,end:154.376,es:"No hay que pagar nada.",group:"hay que",group_index:1,level:"A2"},{i:16,start:154.376,end:163.426,es:"No hay que preocuparse.",group:"hay que",group_index:1,level:"A2"},{i:17,start:164.926,end:173.562,es:"He comido demasiado.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:18,start:173.562,end:182.442,es:"¿Has visto mi teléfono?",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:19,start:182.442,end:195.503,es:"Hemos vivido aquí durante cinco años.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:20,start:195.503,end:204.732,es:"Todavía no he terminado.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:21,start:204.732,end:215.498,es:"Ya ha llegado el tren.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:22,start:215.498,end:226.3,es:"¿Alguna vez has estado en México?",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:23,start:226.3,end:237.309,es:"Nunca he probado el mole.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:24,start:237.309,end:248.302,es:"Esta semana ha llovido mucho.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:25,start:248.302,end:259.172,es:"Mis padres han vuelto de su viaje.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:26,start:260.672,end:272.458,es:"Había mucha gente en la fiesta.",group:"había, hubo",group_index:3,level:"A2"},{i:27,start:272.458,end:285.699,es:"Antes había un cine en esta calle.",group:"había, hubo",group_index:3,level:"A2"},{i:28,start:285.699,end:297.057,es:"No había nadie en casa.",group:"había, hubo",group_index:3,level:"A2"},{i:29,start:297.057,end:308.797,es:"¿Había agua caliente en el hotel?",group:"había, hubo",group_index:3,level:"A2"},{i:30,start:308.797,end:320.966,es:"Ayer hubo un accidente en la autopista.",group:"había, hubo",group_index:3,level:"A2"},{i:31,start:320.966,end:333.438,es:"Hubo un problema con mi tarjeta.",group:"había, hubo",group_index:3,level:"A2"},{i:32,start:333.438,end:345.386,es:"Anoche hubo una tormenta muy fuerte.",group:"había, hubo",group_index:3,level:"A2"},{i:33,start:345.386,end:356.837,es:"Cuando era niño, no había internet.",group:"había, hubo",group_index:3,level:"A2"},{i:34,start:358.337,end:372.841,es:"Cuando llegué, la película ya había empezado.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:35,start:372.841,end:383.688,es:"Nunca había visto tanta nieve.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:36,start:383.688,end:397.871,es:"Me dijo que había perdido las llaves.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:37,start:397.871,end:409.355,es:"Ya habíamos cenado cuando llamaste.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:38,start:409.355,end:420.717,es:"No sabía que habías vuelto.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:39,start:420.717,end:431.746,es:"Pensé que te habías olvidado de mí.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:40,start:431.746,end:445.845,es:"Mis amigos ya habían salido cuando empezó a llover.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:41,start:447.345,end:457.765,es:"Mañana habrá mucho tráfico.",group:"habrá, habría",group_index:5,level:"B1"},{i:42,start:457.765,end:466.94,es:"¿Habrá tiempo para comer?",group:"habrá, habría",group_index:5,level:"B1"},{i:43,start:466.94,end:477.438,es:"No contesta. Habrá salido.",group:"habrá, habría",group_index:5,level:"B1"},{i:44,start:477.438,end:490.891,es:"Para el viernes ya habré terminado el informe.",group:"habrá, habría",group_index:5,level:"B1"},{i:45,start:490.891,end:501.384,es:"Yo habría hecho lo mismo.",group:"habrá, habría",group_index:5,level:"B1"},{i:46,start:501.384,end:516.002,es:"Habría más trabajo si la tienda abriera los domingos.",group:"habrá, habría",group_index:5,level:"B1"},{i:47,start:516.002,end:528.388,es:"Me dijeron que habría una reunión.",group:"habrá, habría",group_index:5,level:"B1"},{i:48,start:529.888,end:541.866,es:"Espero que haya mesas libres.",group:"haya, hubiera",group_index:6,level:"B1"},{i:49,start:541.866,end:553.54,es:"No creo que haya llegado todavía.",group:"haya, hubiera",group_index:6,level:"B1"},{i:50,start:553.54,end:563.814,es:"Me alegro de que hayas venido.",group:"haya, hubiera",group_index:6,level:"B1"},{i:51,start:563.814,end:575.019,es:"Cuando hayas terminado, llámame.",group:"haya, hubiera",group_index:6,level:"B1"},{i:52,start:575.019,end:586.441,es:"Ojalá haya buen tiempo mañana.",group:"haya, hubiera",group_index:6,level:"B1"},{i:53,start:586.441,end:596.849,es:"No creo que hayas entendido.",group:"haya, hubiera",group_index:6,level:"B1"},{i:54,start:596.849,end:607.498,es:"Me sorprendió que no hubiera nadie.",group:"haya, hubiera",group_index:6,level:"B1"},{i:55,start:608.998,end:616.272,es:"No hay de qué.",group:"expresiones",group_index:7,level:"A1"},{i:56,start:616.272,end:623.871,es:"¿Qué hay de nuevo?",group:"expresiones",group_index:7,level:"A2"},{i:57,start:623.871,end:631.559,es:"No hay prisa.",group:"expresiones",group_index:7,level:"A2"},{i:58,start:631.559,end:642.496,es:"Ha habido un cambio de planes.",group:"expresiones",group_index:7,level:"B1"},{i:59,start:642.496,end:651.067,es:"No hay nada que hacer.",group:"expresiones",group_index:7,level:"B1"},{i:60,start:651.067,end:662.129,es:"No hay mal que por bien no venga.",group:"expresiones",group_index:7,level:"B1"},{i:61,start:662.129,end:673.001,es:"No hay manera de abrir esta puerta.",group:"expresiones",group_index:7,level:"B1"}],oo={word:Ka,slug:Xa,kind:Ja,hash:Wa,duration:Za,voice:eo,marks:ao},ro="hacer",so="hacer",no="word",lo="c49c8dbd80e822e7",io=669.744,to="mx-lento",uo=[{i:0,start:.5,end:7.031,es:"¿Qué haces?",group:"hacer, actividades",group_index:0,level:"A1"},{i:1,start:7.031,end:16.927,es:"Hago la tarea después de cenar.",group:"hacer, actividades",group_index:0,level:"A1"},{i:2,start:16.927,end:28.147,es:"Mi padre hace la comida los domingos.",group:"hacer, actividades",group_index:0,level:"A1"},{i:3,start:28.147,end:41.433,es:"¿Qué hacen ustedes los fines de semana?",group:"hacer, actividades",group_index:0,level:"A1"},{i:4,start:41.433,end:54.253,es:"Hago ejercicio todas las mañanas.",group:"hacer, actividades",group_index:0,level:"A1"},{i:5,start:54.253,end:65.308,es:"Siempre hago la cama.",group:"hacer, actividades",group_index:0,level:"A1"},{i:6,start:65.308,end:77.865,es:"Mi madre hace un pastel muy rico.",group:"hacer, actividades",group_index:0,level:"A1"},{i:7,start:77.865,end:87.347,es:"No hago nada los sábados.",group:"hacer, actividades",group_index:0,level:"A1"},{i:8,start:87.347,end:97.056,es:"¿Qué vas a hacer esta noche?",group:"hacer, actividades",group_index:0,level:"A1"},{i:9,start:98.556,end:107.582,es:"Hoy hace mucho frío.",group:"el tiempo",group_index:1,level:"A1"},{i:10,start:107.582,end:116.838,es:"En verano hace calor.",group:"el tiempo",group_index:1,level:"A1"},{i:11,start:116.838,end:127.312,es:"Hace sol, vamos al parque.",group:"el tiempo",group_index:1,level:"A1"},{i:12,start:127.312,end:135.853,es:"Hace viento en la playa.",group:"el tiempo",group_index:1,level:"A1"},{i:13,start:135.853,end:145.438,es:"¿Qué tiempo hace en tu ciudad?",group:"el tiempo",group_index:1,level:"A1"},{i:14,start:145.438,end:155.692,es:"Hace buen tiempo para caminar.",group:"el tiempo",group_index:1,level:"A1"},{i:15,start:155.692,end:165.403,es:"Hoy hace un día precioso.",group:"el tiempo",group_index:1,level:"A1"},{i:16,start:165.403,end:174.695,es:"Ayer hizo mucho calor.",group:"el tiempo",group_index:1,level:"A2"},{i:17,start:176.195,end:184.871,es:"¿Puedo hacer una pregunta?",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A1"},{i:18,start:184.871,end:196.946,es:"Los estudiantes hacen muchas preguntas.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A1"},{i:19,start:196.946,end:207.548,es:"Tenemos que hacer fila para entrar.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:20,start:207.548,end:218.571,es:"Hicimos fila durante una hora.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:21,start:218.571,end:229.792,es:"Todavía no he hecho la maleta.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:22,start:229.792,end:246.09,es:"Siempre hago la maleta la noche antes del viaje.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:23,start:246.09,end:259.279,es:"El periodista le hizo una pregunta difícil.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:24,start:260.779,end:268.925,es:"¿Qué hiciste ayer?",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:25,start:268.925,end:279.474,es:"No hice nada el fin de semana.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:26,start:279.474,end:291.486,es:"Mi hermano hizo la cena anoche.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:27,start:291.486,end:303.066,es:"De niños hacíamos castillos de arena.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:28,start:303.066,end:311.921,es:"¿Ya has hecho la tarea?",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:29,start:311.921,end:323.758,es:"Hemos hecho un viaje increíble.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:30,start:323.758,end:331.867,es:"Lo hice sin pensar.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:31,start:331.867,end:341.313,es:"¿Qué hacías a esa hora?",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:32,start:342.813,end:352.1,es:"Llegué hace dos horas.",group:"hace, pasado",group_index:4,level:"A2"},{i:33,start:352.1,end:364.798,es:"Hace un año que nos conocimos en Madrid.",group:"hace, pasado",group_index:4,level:"A2"},{i:34,start:364.798,end:373.526,es:"La vi hace poco.",group:"hace, pasado",group_index:4,level:"A2"},{i:35,start:373.526,end:386.268,es:"Hace tres días que hablamos por teléfono.",group:"hace, pasado",group_index:4,level:"A2"},{i:36,start:386.268,end:398.577,es:"Mis abuelos se casaron hace cincuenta años.",group:"hace, pasado",group_index:4,level:"A2"},{i:37,start:398.577,end:412.112,es:"Hace mucho tiempo vivía en el campo.",group:"hace, pasado",group_index:4,level:"A2"},{i:38,start:412.112,end:422.029,es:"¿Cuánto tiempo hace que llegaste?",group:"hace, pasado",group_index:4,level:"A2"},{i:39,start:422.029,end:434.012,es:"Terminé la universidad hace diez años.",group:"hace, pasado",group_index:4,level:"A2"},{i:40,start:435.512,end:447.678,es:"Hace dos años que estudio español.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:41,start:447.678,end:458.176,es:"Hace mucho tiempo que no te veo.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:42,start:458.176,end:468.831,es:"¿Cuánto tiempo hace que vives aquí?",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:43,start:468.831,end:480.118,es:"Hace una hora que espero el autobús.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:44,start:480.118,end:489.418,es:"Hace meses que no llueve.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:45,start:489.418,end:500.334,es:"Hace tiempo que quiero visitar Perú.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:46,start:500.334,end:511.78,es:"Hace una semana que no duermo bien.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:47,start:513.28,end:520.664,es:"Hazme caso.",group:"hacer caso",group_index:6,level:"A2"},{i:48,start:520.664,end:530.972,es:"Los niños no me hacen caso.",group:"hacer caso",group_index:6,level:"A2"},{i:49,start:530.972,end:542.343,es:"Nunca haces caso a tus padres.",group:"hacer caso",group_index:6,level:"A2"},{i:50,start:542.343,end:553.018,es:"Debí hacerle caso al médico.",group:"hacer caso",group_index:6,level:"B1"},{i:51,start:553.018,end:566.016,es:"Te lo dije, pero no me hiciste caso.",group:"hacer caso",group_index:6,level:"B1"},{i:52,start:566.016,end:579.058,es:"No le hagas caso, está de mal humor.",group:"hacer caso",group_index:6,level:"B1"},{i:53,start:579.058,end:590.477,es:"Quiero que me hagas caso esta vez.",group:"hacer caso",group_index:6,level:"B1"},{i:54,start:591.977,end:600.97,es:"Se está haciendo tarde.",group:"hacerse",group_index:7,level:"B1"},{i:55,start:600.97,end:611.131,es:"Mi hermana se hizo médica.",group:"hacerse",group_index:7,level:"B1"},{i:56,start:611.131,end:622.014,es:"Nos hicimos amigos en el colegio.",group:"hacerse",group_index:7,level:"B1"},{i:57,start:622.014,end:634.448,es:"Con los años, se hizo más paciente.",group:"hacerse",group_index:7,level:"B1"},{i:58,start:634.448,end:645.445,es:"Quiere hacerse rico muy rápido.",group:"hacerse",group_index:7,level:"B1"},{i:59,start:645.445,end:658.303,es:"Se hace de noche muy temprano en invierno.",group:"hacerse",group_index:7,level:"B1"},{i:60,start:658.303,end:669.672,es:"Ojalá nos hagamos buenos amigos.",group:"hacerse",group_index:7,level:"B1"}],po={word:ro,slug:so,kind:no,hash:lo,duration:io,voice:to,marks:uo},go="igual",co="igual",vo="word",mo="9b20e04cfe221106",xo=737.616,_o="mx-lento",Ao=[{i:0,start:.5,end:12.137,es:"Mi camisa es igual a la tuya.",group:"igual e iguales",group_index:0,level:"A1"},{i:1,start:12.137,end:21.872,es:"Las dos casas son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:2,start:21.872,end:31.628,es:"Tu bolso es igual al mío.",group:"igual e iguales",group_index:0,level:"A1"},{i:3,start:31.628,end:42.414,es:"Los gemelos son casi iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:4,start:42.414,end:52.859,es:"Estos zapatos no son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:5,start:52.859,end:62.833,es:"Todos los días son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:6,start:62.833,end:75.682,es:"Mi teléfono es igual al de mi hermano.",group:"igual e iguales",group_index:0,level:"A1"},{i:7,start:75.682,end:85.197,es:"Las dos tazas son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:8,start:86.697,end:96.283,es:"Hablas igual que tu madre.",group:"igual que",group_index:1,level:"A1"},{i:9,start:96.283,end:107.728,es:"Ella canta igual que su abuela.",group:"igual que",group_index:1,level:"A1"},{i:10,start:107.728,end:117.484,es:"Mi hijo come igual que yo.",group:"igual que",group_index:1,level:"A1"},{i:11,start:117.484,end:129.112,es:"Hoy hace frío, igual que ayer.",group:"igual que",group_index:1,level:"A1"},{i:12,start:129.112,end:137.412,es:"Pienso igual que tú.",group:"igual que",group_index:1,level:"A1"},{i:13,start:137.412,end:148.285,es:"Él trabaja igual que siempre.",group:"igual que",group_index:1,level:"A1"},{i:14,start:148.285,end:160.167,es:"La casa está igual que hace diez años.",group:"igual que",group_index:1,level:"A2"},{i:15,start:160.167,end:172.192,es:"Lo hice igual que la última vez.",group:"igual que",group_index:1,level:"A2"},{i:16,start:173.692,end:185.131,es:"Las dos películas son igual de largas.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:17,start:185.131,end:196.63,es:"Mi hermano es igual de alto que yo.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:18,start:196.63,end:208.76,es:"Este restaurante es igual de caro que el otro.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:19,start:208.76,end:221.194,es:"Los dos exámenes fueron igual de difíciles.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:20,start:221.194,end:236.446,es:"Ella es igual de simpática que su hermana.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:21,start:236.446,end:250.945,es:"El tren y el autobús son igual de rápidos.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:22,start:250.945,end:263.167,es:"Hoy el tráfico está igual de mal que ayer.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:23,start:263.167,end:275.58,es:"Los dos trabajos son igual de importantes.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:24,start:277.08,end:284.69,es:"Me da igual.",group:"me da igual y es igual",group_index:3,level:"A1"},{i:25,start:284.69,end:293.521,es:"Me da igual el color.",group:"me da igual y es igual",group_index:3,level:"A1"},{i:26,start:293.521,end:304.635,es:"Da igual, mañana lo hacemos.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:27,start:304.635,end:318.61,es:"A mi padre le da igual la música.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:28,start:318.61,end:329.748,es:"¿Te da igual comer en casa o fuera?",group:"me da igual y es igual",group_index:3,level:"A2"},{i:29,start:329.748,end:340.02,es:"Es igual, no pasa nada.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:30,start:340.02,end:348.974,es:"Nos da igual el lugar.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:31,start:348.974,end:359.582,es:"A ellos les da igual el precio.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:32,start:359.582,end:371.97,es:"Ese día me daba igual perder el partido.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:33,start:371.97,end:381.021,es:"A mí no me da igual.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:34,start:381.021,end:393.314,es:"Da igual si llueve, vamos a salir.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:35,start:394.814,end:406.412,es:"La madre quiere a sus hijos por igual.",group:"por igual",group_index:4,level:"A2"},{i:36,start:406.412,end:416.484,es:"Dividimos la cuenta por igual.",group:"por igual",group_index:4,level:"A2"},{i:37,start:416.484,end:428.954,es:"En casa repartimos las tareas por igual.",group:"por igual",group_index:4,level:"B1"},{i:38,start:428.954,end:439.486,es:"La ley es para todos por igual.",group:"por igual",group_index:4,level:"B1"},{i:39,start:439.486,end:452.662,es:"Las ganancias se reparten por igual entre los socios.",group:"por igual",group_index:4,level:"B1"},{i:40,start:452.662,end:464.111,es:"El calor afecta a todos por igual.",group:"por igual",group_index:4,level:"B1"},{i:41,start:465.611,end:477.449,es:"Al igual que tú, prefiero el campo.",group:"al igual que",group_index:5,level:"B1"},{i:42,start:477.449,end:489.671,es:"Al igual que su padre, es médico.",group:"al igual que",group_index:5,level:"B1"},{i:43,start:489.671,end:507.247,es:"Al igual que el año pasado, vamos a la playa en agosto.",group:"al igual que",group_index:5,level:"B1"},{i:44,start:507.247,end:523.437,es:"Ella, al igual que su hermano, habla tres idiomas.",group:"al igual que",group_index:5,level:"B1"},{i:45,start:523.437,end:538.68,es:"Al igual que muchas personas, trabajo desde casa.",group:"al igual que",group_index:5,level:"B1"},{i:46,start:538.68,end:551.706,es:"Al igual que ayer, el tren llegó tarde.",group:"al igual que",group_index:5,level:"B1"},{i:47,start:551.706,end:567.809,es:"Al igual que en otros países, aquí la comida es cara.",group:"al igual que",group_index:5,level:"B1"},{i:48,start:569.309,end:577.738,es:"Igual llueve mañana.",group:"igual: quizás",group_index:6,level:"B1"},{i:49,start:577.738,end:588.489,es:"Igual vamos al cine esta noche.",group:"igual: quizás",group_index:6,level:"B1"},{i:50,start:588.489,end:597.85,es:"Igual no viene a la fiesta.",group:"igual: quizás",group_index:6,level:"B1"},{i:51,start:597.85,end:609.454,es:"Llámalo, igual está en casa.",group:"igual: quizás",group_index:6,level:"B1"},{i:52,start:609.454,end:618.149,es:"Igual tienes razón.",group:"igual: quizás",group_index:6,level:"B1"},{i:53,start:618.149,end:628.761,es:"Igual llegamos un poco tarde.",group:"igual: quizás",group_index:6,level:"B1"},{i:54,start:628.761,end:640.662,es:"No sé, igual me quedo en casa.",group:"igual: quizás",group_index:6,level:"B1"},{i:55,start:640.662,end:654.443,es:"Pregunta en la tienda, igual lo tienen.",group:"igual: quizás",group_index:6,level:"B1"},{i:56,start:655.943,end:667.364,es:"Es un lugar de una belleza sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:57,start:667.364,end:679.7,es:"Tiene un talento sin igual para la música.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:58,start:679.7,end:690.173,es:"Esta comida no tiene igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:59,start:690.173,end:700.723,es:"Fue una experiencia sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:60,start:700.723,end:715.002,es:"Mi abuela tenía una paciencia sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:61,start:715.002,end:724.506,es:"Es un cantante sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:62,start:724.506,end:737.546,es:"La vista desde esta montaña no tiene igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"}],ho={word:go,slug:co,kind:vo,hash:mo,duration:xo,voice:_o,marks:Ao},bo="llevar",fo="llevar",qo="word",yo="2133c8daa62671ee",jo=670.608,Bo="mx-lento",zo=[{i:0,start:.5,end:12.235,es:"Llevo una mochila muy pesada.",group:"llevar, cargar",group_index:0,level:"A1"},{i:1,start:12.235,end:19.822,es:"¿Llevas dinero?",group:"llevar, cargar",group_index:0,level:"A1"},{i:2,start:19.822,end:28.413,es:"Yo llevo las bolsas.",group:"llevar, cargar",group_index:0,level:"A1"},{i:3,start:28.413,end:39.115,es:"Siempre llevo agua en el auto.",group:"llevar, cargar",group_index:0,level:"A1"},{i:4,start:39.115,end:49.489,es:"¿Puedes llevar la sopa a la mesa?",group:"llevar, cargar",group_index:0,level:"A1"},{i:5,start:49.489,end:60.66,es:"Mi padre lleva la maleta grande.",group:"llevar, cargar",group_index:0,level:"A1"},{i:6,start:60.66,end:71.323,es:"Llevé el pastel a la fiesta.",group:"llevar, cargar",group_index:0,level:"A2"},{i:7,start:71.323,end:83.079,es:"No llevaba el pasaporte encima.",group:"llevar, cargar",group_index:0,level:"A2"},{i:8,start:84.579,end:94.083,es:"Hoy llevo un vestido rojo.",group:"llevar ropa",group_index:1,level:"A1"},{i:9,start:94.083,end:108.09,es:"Mi abuelo lleva una corbata azul.",group:"llevar ropa",group_index:1,level:"A1"},{i:10,start:108.09,end:118.139,es:"¿Qué vas a llevar a la boda?",group:"llevar ropa",group_index:1,level:"A1"},{i:11,start:118.139,end:130.238,es:"Ella siempre lleva sombrero.",group:"llevar ropa",group_index:1,level:"A1"},{i:12,start:130.238,end:142.296,es:"Llevas una camisa muy bonita.",group:"llevar ropa",group_index:1,level:"A1"},{i:13,start:142.296,end:152.732,es:"El niño lleva zapatos nuevos.",group:"llevar ropa",group_index:1,level:"A1"},{i:14,start:152.732,end:163.09,es:"En verano llevo ropa ligera.",group:"llevar ropa",group_index:1,level:"A1"},{i:15,start:163.09,end:174.84,es:"Ayer llevaba una chaqueta negra.",group:"llevar ropa",group_index:1,level:"A2"},{i:16,start:176.34,end:184.354,es:"Te llevo a casa.",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:17,start:184.354,end:195.218,es:"Llevo a mis hijos a la escuela.",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:18,start:195.218,end:204.072,es:"¿Me llevas al aeropuerto?",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:19,start:204.072,end:214.698,es:"Este autobús te lleva al centro.",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:20,start:214.698,end:224.488,es:"Mi madre me llevó al médico.",group:"llevar a alguien a un lugar",group_index:2,level:"A2"},{i:21,start:224.488,end:236.83,es:"Te voy a llevar a un restaurante muy bueno.",group:"llevar a alguien a un lugar",group_index:2,level:"A2"},{i:22,start:236.83,end:252.357,es:"Llevamos al perro al parque todas las mañanas.",group:"llevar a alguien a un lugar",group_index:2,level:"A2"},{i:23,start:253.857,end:262.998,es:"Llevo dos años aquí.",group:"llevar tiempo",group_index:3,level:"A2"},{i:24,start:262.998,end:273.905,es:"¿Cuánto tiempo llevas en esta ciudad?",group:"llevar tiempo",group_index:3,level:"A2"},{i:25,start:273.905,end:284.675,es:"Llevamos una hora en la fila.",group:"llevar tiempo",group_index:3,level:"A2"},{i:26,start:284.675,end:297.691,es:"Mis padres llevan treinta años casados.",group:"llevar tiempo",group_index:3,level:"A2"},{i:27,start:297.691,end:308.944,es:"Ella lleva tres meses en la empresa.",group:"llevar tiempo",group_index:3,level:"A2"},{i:28,start:308.944,end:320.279,es:"Este trabajo lleva mucho tiempo.",group:"llevar tiempo",group_index:3,level:"A2"},{i:29,start:320.279,end:332.418,es:"Preparar la cena me llevó toda la tarde.",group:"llevar tiempo",group_index:3,level:"A2"},{i:30,start:333.918,end:343.7,es:"Llevo una hora esperando.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:31,start:343.7,end:356.605,es:"Llevamos todo el día caminando.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:32,start:356.605,end:368.683,es:"¿Cuánto tiempo llevas estudiando español?",group:"llevar + gerundio",group_index:4,level:"A2"},{i:33,start:368.683,end:379.736,es:"Lleva tres días lloviendo sin parar.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:34,start:379.736,end:390.225,es:"Llevo meses buscando trabajo.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:35,start:390.225,end:405.204,es:"Mi vecino lleva toda la mañana haciendo ruido.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:36,start:405.204,end:420.603,es:"Cuando lo conocí, llevaba dos años viviendo solo.",group:"llevar + gerundio",group_index:4,level:"B1"},{i:37,start:422.103,end:433.17,es:"Me llevo muy bien con mi hermana.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:38,start:433.17,end:442.426,es:"Mis padres se llevan bien.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:39,start:442.426,end:452.448,es:"No me llevo bien con mi jefe.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:40,start:452.448,end:464.709,es:"Los dos gatos no se llevan nada bien.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:41,start:464.709,end:475.33,es:"¿Te llevas bien con tus compañeros?",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:42,start:475.33,end:486.59,es:"De niños nos llevábamos muy mal.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:43,start:486.59,end:497.439,es:"Espero que te lleves bien con ellos.",group:"llevarse bien o mal",group_index:5,level:"B1"},{i:44,start:498.939,end:507.143,es:"¿Me lo llevo o lo dejo?",group:"llevarse algo",group_index:6,level:"A2"},{i:45,start:507.143,end:519.328,es:"Me llevo esta camisa, por favor.",group:"llevarse algo",group_index:6,level:"A2"},{i:46,start:519.328,end:528.811,es:"Alguien se llevó mi paraguas.",group:"llevarse algo",group_index:6,level:"A2"},{i:47,start:528.811,end:539.868,es:"Me llevé una sorpresa enorme.",group:"llevarse algo",group_index:6,level:"B1"},{i:48,start:539.868,end:549.594,es:"El viento se llevó las hojas.",group:"llevarse algo",group_index:6,level:"B1"},{i:49,start:549.594,end:561.8,es:"Nos llevamos un buen susto con la tormenta.",group:"llevarse algo",group_index:6,level:"B1"},{i:50,start:561.8,end:574.786,es:"No te lleves mi cargador, que lo necesito.",group:"llevarse algo",group_index:6,level:"B1"},{i:51,start:574.786,end:586.817,es:"El ladrón se llevó todas las joyas.",group:"llevarse algo",group_index:6,level:"B1"},{i:52,start:588.317,end:600.421,es:"Mi hermano siempre me lleva la contraria.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:53,start:600.421,end:610.819,es:"Ella lleva la cuenta de los gastos.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:54,start:610.819,end:624.917,es:"Mi abuela lleva una vida muy tranquila.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:55,start:624.917,end:637.195,es:"Este camino no lleva a ninguna parte.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:56,start:637.195,end:648.193,es:"No te dejes llevar por los nervios.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:57,start:648.193,end:657.279,es:"Yo te llevo tres años.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:58,start:657.279,end:670.543,es:"Ellos llevan la empresa juntos desde hace años.",group:"expresiones con llevar",group_index:7,level:"B1"}],Mo={word:bo,slug:fo,kind:qo,hash:yo,duration:jo,voice:Bo,marks:zo},Eo="lo",ko="lo",$o="word",wo="39da8687bf80b301",No=648.912,So="mx-lento",Lo=[{i:0,start:.5,end:14.618,es:"¿Conoces a Pedro? Sí, lo conozco del trabajo.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:1,start:14.618,end:25.822,es:"¿El café? Lo tomo sin azúcar.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:2,start:25.822,end:39.446,es:"Mi hermano está en casa, lo llamo ahora.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:3,start:39.446,end:52.437,es:"Este vestido es bonito, lo compro.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:4,start:52.437,end:65.545,es:"No encuentro mi teléfono, ¿lo tienes tú?",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:5,start:65.545,end:79.621,es:"El pan está aquí, lo pongo en la mesa.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:6,start:79.621,end:94.255,es:"Mi abuelo vive lejos, pero lo visito los domingos.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:7,start:94.255,end:106.785,es:"El auto está sucio, lo lavo mañana.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:8,start:106.785,end:117.492,es:"¿Dónde está el perro? No lo veo.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:9,start:118.992,end:125.57,es:"No lo sé.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:10,start:125.57,end:132.333,es:"Ya lo sé.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:11,start:132.333,end:142.165,es:"Lo sé, tienes razón.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:12,start:142.165,end:154.935,es:"¿Sabes dónde vive Ana? No, no lo sé.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:13,start:154.935,end:161.617,es:"No lo creo.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:14,start:161.617,end:169.422,es:"Lo siento mucho.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:15,start:169.422,end:176.223,es:"¿Lo entiendes?",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:16,start:176.223,end:183.118,es:"Te lo prometo.",group:"lo sé, no lo sé",group_index:1,level:"A2"},{i:17,start:184.618,end:194.255,es:"Voy a comprarlo mañana.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:18,start:194.255,end:203.934,es:"¿Puedes repetirlo, por favor?",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:19,start:203.934,end:212.612,es:"Quiero verlo otra vez.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:20,start:212.612,end:221.832,es:"Tómalo, es para ti.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:21,start:221.832,end:232.825,es:"Pruébalo, está muy rico.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:22,start:232.825,end:240.916,es:"Estoy pensándolo.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:23,start:240.916,end:252.532,es:"Tengo que terminarlo antes del viernes.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:24,start:252.532,end:260.827,es:"Ábrelo con cuidado.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:25,start:260.827,end:270.678,es:"Necesito leerlo dos veces.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:26,start:272.178,end:281.458,es:"Lo que necesito es dormir.",group:"lo que",group_index:3,level:"A2"},{i:27,start:281.458,end:290.056,es:"No entiendo lo que dices.",group:"lo que",group_index:3,level:"A2"},{i:28,start:290.056,end:300.28,es:"Esto es lo que compré ayer.",group:"lo que",group_index:3,level:"A2"},{i:29,start:300.28,end:312.752,es:"Lo que más me gusta es la playa.",group:"lo que",group_index:3,level:"A2"},{i:30,start:312.752,end:320.559,es:"Dime lo que pasó.",group:"lo que",group_index:3,level:"A2"},{i:31,start:320.559,end:331.051,es:"Lo que pasa es que estoy cansado.",group:"lo que",group_index:3,level:"A2"},{i:32,start:331.051,end:341.019,es:"Gracias por todo lo que hiciste.",group:"lo que",group_index:3,level:"A2"},{i:33,start:341.019,end:350.443,es:"No sé lo que voy a hacer.",group:"lo que",group_index:3,level:"A2"},{i:34,start:350.443,end:361.016,es:"Todo lo que dijo era verdad.",group:"lo que",group_index:3,level:"A2"},{i:35,start:361.016,end:368.996,es:"Haz lo que quieras.",group:"lo que",group_index:3,level:"B1"},{i:36,start:370.496,end:378.72,es:"Yo quiero lo mismo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A1"},{i:37,start:378.72,end:388.041,es:"A lo mejor llueve mañana.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:38,start:388.041,end:397.376,es:"A lo mejor tienes razón.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:39,start:397.376,end:406.455,es:"Siempre dice lo mismo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:40,start:406.455,end:413.763,es:"Me da lo mismo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:41,start:413.763,end:422.885,es:"Por lo menos come algo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:42,start:422.885,end:436.705,es:"Llegamos tarde, pero por lo menos llegamos.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:43,start:436.705,end:447.266,es:"Necesito por lo menos dos horas.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:44,start:447.266,end:459.763,es:"Por lo general, desayuno en casa.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:45,start:461.263,end:469.976,es:"Lo bueno es que hace sol.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:46,start:469.976,end:478.445,es:"Lo malo es el precio.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:47,start:478.445,end:490.851,es:"Lo importante es estar juntos.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:48,start:490.851,end:501.627,es:"Lo mejor del viaje fue la comida.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:49,start:501.627,end:509.815,es:"Lo peor ya pasó.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:50,start:509.815,end:518.693,es:"Lo difícil es empezar.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:51,start:518.693,end:530.886,es:"Lo más importante es la salud.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:52,start:530.886,end:540.613,es:"Lo raro es que nadie contestó.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:53,start:540.613,end:551.747,es:"Lo bueno de esta ciudad es el clima.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:54,start:553.247,end:566.001,es:"No sabes lo rápido que corre mi hija.",group:"lo rápido que",group_index:6,level:"B1"},{i:55,start:566.001,end:577.388,es:"Me sorprende lo bien que hablas español.",group:"lo rápido que",group_index:6,level:"B1"},{i:56,start:577.388,end:587.573,es:"Mira lo grande que está tu hijo.",group:"lo rápido que",group_index:6,level:"B1"},{i:57,start:587.573,end:598.888,es:"No te imaginas lo cansada que estoy.",group:"lo rápido que",group_index:6,level:"B1"},{i:58,start:598.888,end:611.874,es:"Ya ves lo difícil que es encontrar trabajo.",group:"lo rápido que",group_index:6,level:"B1"},{i:59,start:611.874,end:622.87,es:"Es increíble lo caro que está todo.",group:"lo rápido que",grou
