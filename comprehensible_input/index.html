,{i:47,start:556.918,end:575.125,es:"Antes solíamos escribirnos cartas, y hoy todo es por mensaje.",group:"antes y ahora",group_index:5,level:"B1"},{i:48,start:575.125,end:593.151,es:"Este barrio solía ser tranquilo, pero ahora hay mucho ruido.",group:"antes y ahora",group_index:5,level:"B1"},{i:49,start:593.151,end:605.662,es:"Ya no suelo acostarme tarde como antes.",group:"antes y ahora",group_index:5,level:"B1"},{i:50,start:607.162,end:620.332,es:"Eso no suele pasar en un lugar tan tranquilo.",group:"no suele pasar",group_index:6,level:"B1"},{i:51,start:620.332,end:633.291,es:"Como suele pasar, el vuelo salió tarde.",group:"no suele pasar",group_index:6,level:"B1"},{i:52,start:633.291,end:648.157,es:"Como solía decir mi abuelo, el tiempo es oro.",group:"no suele pasar",group_index:6,level:"B1"},{i:53,start:648.157,end:659.631,es:"Esto no suele ocurrir en esta empresa.",group:"no suele pasar",group_index:6,level:"B1"},{i:54,start:659.631,end:675.021,es:"Lo que suele pasar es que nadie lee las instrucciones.",group:"no suele pasar",group_index:6,level:"B1"},{i:55,start:675.021,end:686.803,es:"Los problemas suelen resolverse hablando.",group:"no suele pasar",group_index:6,level:"B1"},{i:56,start:686.803,end:699.081,es:"Es raro, porque él no suele equivocarse.",group:"no suele pasar",group_index:6,level:"B1"},{i:57,start:699.081,end:713.736,es:"Como se suele decir, más vale tarde que nunca.",group:"no suele pasar",group_index:6,level:"B1"}],ms={word:ts,slug:us,kind:ds,hash:ps,duration:gs,voice:cs,marks:vs},xs="tener",_s="tener",As="word",hs="729e7510fa6917ce",bs=681.576,fs="mx-lento",qs=[{i:0,start:.5,end:8.881,es:"Tengo dos hermanos.",group:"tener, poseer",group_index:0,level:"A1"},{i:1,start:8.881,end:17.405,es:"¿Tienes un bolígrafo?",group:"tener, poseer",group_index:0,level:"A1"},{i:2,start:17.405,end:29.323,es:"Mi abuela tiene un gato negro.",group:"tener, poseer",group_index:0,level:"A1"},{i:3,start:29.323,end:37.363,es:"No tenemos auto.",group:"tener, poseer",group_index:0,level:"A1"},{i:4,start:37.363,end:48.778,es:"Esta casa tiene tres habitaciones.",group:"tener, poseer",group_index:0,level:"A1"},{i:5,start:48.778,end:58.662,es:"¿Tiene usted una mesa para dos?",group:"tener, poseer",group_index:0,level:"A1"},{i:6,start:58.662,end:69.339,es:"Ellos tienen una tienda en el centro.",group:"tener, poseer",group_index:0,level:"A1"},{i:7,start:69.339,end:77.962,es:"Hoy no tengo tiempo.",group:"tener, poseer",group_index:0,level:"A1"},{i:8,start:77.962,end:88.858,es:"Mi hermana tiene el pelo largo.",group:"tener, poseer",group_index:0,level:"A1"},{i:9,start:90.358,end:101.242,es:"Aquí tienes las llaves.",group:"aquí tienes",group_index:1,level:"A1"},{i:10,start:101.242,end:112.939,es:"Aquí tiene su café, señora.",group:"aquí tienes",group_index:1,level:"A1"},{i:11,start:112.939,end:121.348,es:"Aquí tienen el menú.",group:"aquí tienes",group_index:1,level:"A1"},{i:12,start:121.348,end:130.337,es:"Aquí tienes tu cambio.",group:"aquí tienes",group_index:1,level:"A1"},{i:13,start:131.837,end:140.574,es:"Tengo treinta años.",group:"tener años",group_index:2,level:"A1"},{i:14,start:140.574,end:149.123,es:"¿Cuántos años tienes?",group:"tener años",group_index:2,level:"A1"},{i:15,start:149.123,end:159.914,es:"Mi hijo tiene cinco años.",group:"tener años",group_index:2,level:"A1"},{i:16,start:159.914,end:170.763,es:"Mi abuelo tiene noventa años.",group:"tener años",group_index:2,level:"A1"},{i:17,start:170.763,end:181.083,es:"El perro ya tiene diez años.",group:"tener años",group_index:2,level:"A1"},{i:18,start:181.083,end:195.486,es:"Cuando tenía veinte años, vivía en Lima.",group:"tener años",group_index:2,level:"A2"},{i:19,start:196.986,end:206.004,es:"Tengo mucha hambre.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:20,start:206.004,end:212.874,es:"¿Tienes sed?",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:21,start:212.874,end:221.882,es:"Los niños tienen frío.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:22,start:221.882,end:232.37,es:"En verano siempre tengo calor.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:23,start:232.37,end:243.752,es:"Tengo sueño, me voy a dormir.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:24,start:243.752,end:254.369,es:"Mi hija tiene miedo de los perros.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:25,start:254.369,end:263.581,es:"Lo siento, tengo prisa.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:26,start:263.581,end:272.885,es:"¿No tienen hambre todavía?",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:27,start:272.885,end:282.639,es:"Anoche tuve mucho miedo.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A2"},{i:28,start:284.139,end:294.254,es:"Tengo que trabajar mañana.",group:"tener que",group_index:4,level:"A1"},{i:29,start:294.254,end:302.654,es:"Tienes que descansar.",group:"tener que",group_index:4,level:"A1"},{i:30,start:302.654,end:311.857,es:"Tenemos que comprar pan.",group:"tener que",group_index:4,level:"A1"},{i:31,start:311.857,end:321.312,es:"¿A qué hora tienes que salir?",group:"tener que",group_index:4,level:"A1"},{i:32,start:321.312,end:331.404,es:"Los niños tienen que estudiar.",group:"tener que",group_index:4,level:"A1"},{i:33,start:331.404,end:341.764,es:"No tienes que venir si no quieres.",group:"tener que",group_index:4,level:"A1"},{i:34,start:341.764,end:352.033,es:"Ayer tuve que ir al médico.",group:"tener que",group_index:4,level:"A2"},{i:35,start:352.033,end:364.612,es:"Tuvimos que esperar dos horas en el aeropuerto.",group:"tener que",group_index:4,level:"A2"},{i:36,start:366.112,end:376.318,es:"Tengo ganas de ir a la playa.",group:"tener ganas de",group_index:5,level:"A2"},{i:37,start:376.318,end:386.503,es:"No tengo ganas de cocinar hoy.",group:"tener ganas de",group_index:5,level:"A2"},{i:38,start:386.503,end:397.18,es:"¿Tienes ganas de salir esta noche?",group:"tener ganas de",group_index:5,level:"A2"},{i:39,start:397.18,end:407.352,es:"Tengo muchas ganas de verte.",group:"tener ganas de",group_index:5,level:"A2"},{i:40,start:407.352,end:418.166,es:"Los niños tienen ganas de jugar.",group:"tener ganas de",group_index:5,level:"A2"},{i:41,start:418.166,end:429.185,es:"Hoy no tenía ganas de levantarme.",group:"tener ganas de",group_index:5,level:"A2"},{i:42,start:429.185,end:441.469,es:"Tenemos ganas de conocer tu nueva casa.",group:"tener ganas de",group_index:5,level:"A2"},{i:43,start:442.969,end:450.509,es:"Tienes razón.",group:"tener razón, tener cuidado",group_index:6,level:"A1"},{i:44,start:450.509,end:461.703,es:"Creo que mi madre tenía razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:45,start:461.703,end:471.194,es:"No siempre tienes razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:46,start:471.194,end:480.079,es:"Ten cuidado con el perro.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:47,start:480.079,end:493.279,es:"Tengan cuidado, el suelo está mojado.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:48,start:493.279,end:505.863,es:"Tienes que tener cuidado al cruzar la calle.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:49,start:505.863,end:516.2,es:"Al final, tuviste razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:50,start:517.7,end:531.349,es:"De niño tenía una bicicleta roja.",group:"tenía, tuve",group_index:7,level:"A2"},{i:51,start:531.349,end:544.182,es:"Antes no teníamos computadora en casa.",group:"tenía, tuve",group_index:7,level:"A2"},{i:52,start:544.182,end:555.907,es:"Ayer tuve una reunión muy larga.",group:"tenía, tuve",group_index:7,level:"A2"},{i:53,start:555.907,end:566.518,es:"El año pasado tuvieron un bebé.",group:"tenía, tuve",group_index:7,level:"A2"},{i:54,start:566.518,end:578.048,es:"Tuvimos un problema con el hotel.",group:"tenía, tuve",group_index:7,level:"A2"},{i:55,start:578.048,end:587.124,es:"¿Tuviste un buen viaje?",group:"tenía, tuve",group_index:7,level:"A2"},{i:56,start:587.124,end:599.259,es:"La semana pasada tuve mucho trabajo.",group:"tenía, tuve",group_index:7,level:"A2"},{i:57,start:600.759,end:610.444,es:"Eso no tiene nada que ver.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:58,start:610.444,end:622.303,es:"Su trabajo tiene que ver con la música.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:59,start:622.303,end:633.877,es:"¿Qué tiene que ver eso con nuestro problema?",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:60,start:633.877,end:644.329,es:"Espero que tengas un buen día.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:61,start:644.329,end:660.23,es:"Si tuviera más tiempo, aprendería a tocar la guitarra.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:62,start:660.23,end:669.87,es:"No creo que tengan razón.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:63,start:669.87,end:681.507,es:"Me alegra que tengas tantos amigos.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"}],ys={word:xs,slug:_s,kind:As,hash:hs,duration:bs,voice:fs,marks:qs},js="tocar",Bs="tocar",zs="word",Ms="8a4467b615a94725",Es=664.704,ks="mx-lento",$s=[{i:0,start:.5,end:11.719,es:"No toques el horno, está caliente.",group:"tocar con la mano",group_index:0,level:"A1"},{i:1,start:11.719,end:20.373,es:"¿Puedo tocar al perro?",group:"tocar con la mano",group_index:0,level:"A1"},{i:2,start:20.373,end:30.227,es:"El bebé me toca la cara.",group:"tocar con la mano",group_index:0,level:"A1"},{i:3,start:30.227,end:40.572,es:"Por favor, no toquen los cuadros.",group:"tocar con la mano",group_index:0,level:"A1"},{i:4,start:40.572,end:49.922,es:"Me gusta tocar la arena.",group:"tocar con la mano",group_index:0,level:"A1"},{i:5,start:49.922,end:63.274,es:"Toca el agua, está muy fría.",group:"tocar con la mano",group_index:0,level:"A1"},{i:6,start:63.274,end:77.108,es:"No te toques los ojos con las manos sucias.",group:"tocar con la mano",group_index:0,level:"A2"},{i:7,start:77.108,end:88.709,es:"Alguien me tocó el hombro en el autobús.",group:"tocar con la mano",group_index:0,level:"A2"},{i:8,start:88.709,end:100.58,es:"Nunca había tocado la nieve.",group:"tocar con la mano",group_index:0,level:"B1"},{i:9,start:102.08,end:113.28,es:"Mi hermana toca el piano.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:10,start:113.28,end:121.466,es:"¿Tocas la guitarra?",group:"tocar un instrumento",group_index:1,level:"A1"},{i:11,start:121.466,end:131.492,es:"Él toca muy bien el violín.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:12,start:131.492,end:142.989,es:"Quiero aprender a tocar la batería.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:13,start:142.989,end:152.743,es:"La banda toca los sábados.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:14,start:152.743,end:162.693,es:"Toca algo para nosotros.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:15,start:162.693,end:176.319,es:"De niño, tocaba la flauta en la escuela.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:16,start:176.319,end:187.861,es:"Anoche tocaron mi canción favorita.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:17,start:187.861,end:200.045,es:"Hace diez años que toco el saxofón.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:18,start:201.545,end:210.356,es:"Alguien toca la puerta.",group:"tocar la puerta, el timbre",group_index:2,level:"A1"},{i:19,start:210.356,end:220.91,es:"Toca el timbre, por favor.",group:"tocar la puerta, el timbre",group_index:2,level:"A1"},{i:20,start:220.91,end:232.574,es:"Toqué la puerta, pero nadie abrió.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:21,start:232.574,end:243.932,es:"El cartero tocó el timbre dos veces.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:22,start:243.932,end:259.155,es:"Toca el timbre otra vez, creo que no te oyeron.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:23,start:259.155,end:271.958,es:"Antes de entrar, hay que tocar la puerta.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:24,start:271.958,end:286.374,es:"Los niños tocaron el timbre y salieron corriendo.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:25,start:287.874,end:296.143,es:"Ahora te toca a ti.",group:"te toca, el turno",group_index:3,level:"A1"},{i:26,start:296.143,end:303.768,es:"¿A quién le toca?",group:"te toca, el turno",group_index:3,level:"A1"},{i:27,start:303.768,end:315.433,es:"Me toca lavar los platos hoy.",group:"te toca, el turno",group_index:3,level:"A2"},{i:28,start:315.433,end:328.722,es:"Mañana le toca cocinar a mi hermano.",group:"te toca, el turno",group_index:3,level:"A2"},{i:29,start:328.722,end:338.901,es:"Te toca elegir la película.",group:"te toca, el turno",group_index:3,level:"A2"},{i:30,start:338.901,end:347.157,es:"¿Cuándo me toca hablar?",group:"te toca, el turno",group_index:3,level:"A2"},{i:31,start:347.157,end:357.707,es:"Ayer le tocó sacar al perro.",group:"te toca, el turno",group_index:3,level:"A2"},{i:32,start:357.707,end:368.413,es:"Nos toca esperar una hora más.",group:"te toca, el turno",group_index:3,level:"A2"},{i:33,start:368.413,end:384.398,es:"La última vez pagué yo, así que hoy te toca a ti.",group:"te toca, el turno",group_index:3,level:"A2"},{i:34,start:384.398,end:396.583,es:"Al abuelo le toca ir al médico el lunes.",group:"te toca, el turno",group_index:3,level:"A2"},{i:35,start:398.083,end:406.321,es:"Me tocó la lotería.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:36,start:406.321,end:416.54,es:"Le tocó un viaje a la playa.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:37,start:416.54,end:427.668,es:"Nunca me toca nada en las rifas.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:38,start:427.668,end:440.459,es:"En el examen me tocó la pregunta más difícil.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:39,start:440.459,end:450.705,es:"Nos tocó un hotel muy bonito.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:40,start:450.705,end:459.535,es:"¿Qué te tocó en el sorteo?",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:41,start:459.535,end:471.198,es:"Me tocó un asiento al lado de la ventana.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:42,start:471.198,end:486.226,es:"A mi amiga le tocó trabajar el domingo.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:43,start:486.226,end:499.268,es:"Ojalá te toque un buen profesor este año.",group:"me tocó, el premio y la suerte",group_index:4,level:"B1"},{i:44,start:500.768,end:511.502,es:"No quiero tocar ese tema ahora.",group:"tocar un tema",group_index:5,level:"B1"},{i:45,start:511.502,end:524.998,es:"En la reunión tocamos varios temas importantes.",group:"tocar un tema",group_index:5,level:"B1"},{i:46,start:524.998,end:539.424,es:"Es mejor no tocar el tema de la política en la cena.",group:"tocar un tema",group_index:5,level:"B1"},{i:47,start:539.424,end:551.101,es:"El libro toca temas muy difíciles.",group:"tocar un tema",group_index:5,level:"B1"},{i:48,start:551.101,end:563.182,es:"¿Por qué siempre tocas temas tan tristes?",group:"tocar un tema",group_index:5,level:"B1"},{i:49,start:563.182,end:577.37,es:"Prefiero que no toques ese asunto delante de mis padres.",group:"tocar un tema",group_index:5,level:"B1"},{i:50,start:577.37,end:589.88,es:"El profesor solo tocó el tema por encima.",group:"tocar un tema",group_index:5,level:"B1"},{i:51,start:589.88,end:603.807,es:"Si tocas ese tema, se va a molestar.",group:"tocar un tema",group_index:5,level:"B1"},{i:52,start:605.307,end:618.129,es:"Nunca he estado enfermo, toco madera.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:53,start:618.129,end:628.444,es:"La película me tocó el corazón.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:54,start:628.444,end:642.336,es:"Después de tocar fondo, empezó a mejorar.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:55,start:642.336,end:653.911,es:"Sus palabras me tocaron mucho.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:56,start:653.911,end:664.654,es:"Ese problema me toca de cerca.",group:"expresiones con tocar",group_index:6,level:"B1"}],ws={word:js,slug:Bs,kind:zs,hash:Ms,duration:Es,voice:ks,marks:$s},Ns="verbos reflexivos",Ss="verbos_reflexivos",Ls="concept",Ts="5e1d023ecf2958c3",Ps=726.288,Cs="mx-lento",Hs=[{i:0,start:.5,end:9.6,es:"Me despierto a las siete.",group:"la rutina diaria",group_index:0,level:"A1"},{i:1,start:9.6,end:21.163,es:"Me levanto temprano todos los días.",group:"la rutina diaria",group_index:0,level:"A1"},{i:2,start:21.163,end:31.918,es:"Mi hermano se ducha por la noche.",group:"la rutina diaria",group_index:0,level:"A1"},{i:3,start:31.918,end:43.044,es:"Nos vestimos rápido por la mañana.",group:"la rutina diaria",group_index:0,level:"A1"},{i:4,start:43.044,end:53.396,es:"Los niños se acuestan a las nueve.",group:"la rutina diaria",group_index:0,level:"A1"},{i:5,start:53.396,end:62.016,es:"¿A qué hora te levantas?",group:"la rutina diaria",group_index:0,level:"A1"},{i:6,start:62.016,end:73.214,es:"Mi padre se afeita cada mañana.",group:"la rutina diaria",group_index:0,level:"A1"},{i:7,start:73.214,end:82.857,es:"Me peino antes de salir.",group:"la rutina diaria",group_index:0,level:"A1"},{i:8,start:82.857,end:94.326,es:"¿Te duchas por la mañana o por la noche?",group:"la rutina diaria",group_index:0,level:"A1"},{i:9,start:95.826,end:106.847,es:"Me lavo las manos antes de comer.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:10,start:106.847,end:119.661,es:"Ella se lava el pelo cada día.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:11,start:119.661,end:131.827,es:"Me cepillo los dientes después del desayuno.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:12,start:131.827,end:141.306,es:"El niño se lava la cara.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:13,start:141.306,end:151.392,es:"Mi madre se pinta las uñas.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:14,start:151.392,end:161.993,es:"Se pone los zapatos en la puerta.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:15,start:161.993,end:172.05,es:"Me quito el abrigo al entrar.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:16,start:172.05,end:182.594,es:"Me corto el pelo una vez al mes.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A2"},{i:17,start:184.094,end:196.329,es:"Me enojo cuando hay mucho tráfico.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:18,start:196.329,end:206.84,es:"Mi madre se preocupa por todo.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:19,start:206.84,end:217.22,es:"Nos alegramos mucho de verte.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:20,start:217.22,end:227.645,es:"Los niños se aburren en el auto.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:21,start:227.645,end:239.703,es:"Me pongo nervioso antes de un examen.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:22,start:239.703,end:251.995,es:"Ella se cansa mucho en el trabajo.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:23,start:251.995,end:261.199,es:"¿Por qué te enojas tanto?",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:24,start:261.199,end:270.831,es:"Hoy me siento mucho mejor.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:25,start:270.831,end:280.774,es:"Él se pone triste cuando llueve.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:26,start:282.274,end:293.383,es:"Levántate, ya es tarde.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:27,start:293.383,end:302.125,es:"Voy a ducharme ahora.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:28,start:302.125,end:311.905,es:"Siéntate aquí, por favor.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:29,start:311.905,end:323.208,es:"No te preocupes, todo está bien.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:30,start:323.208,end:333.846,es:"Tengo que acostarme temprano hoy.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:31,start:333.846,end:346.964,es:"Lávate las manos, la cena está lista.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:32,start:346.964,end:359.161,es:"Ponte el abrigo, hace frío.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:33,start:359.161,end:370.391,es:"Necesito relajarme un poco.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:34,start:370.391,end:381.671,es:"Cálmate, no pasa nada.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:35,start:381.671,end:392.638,es:"Acuérdate de llamarme cuando llegues.",group:"en mandatos e infinitivos",group_index:3,level:"B1"},{i:36,start:394.138,end:404.264,es:"Ayer me levanté muy tarde.",group:"en pasado",group_index:4,level:"A2"},{i:37,start:404.264,end:416.103,es:"Esta mañana me duché con agua fría.",group:"en pasado",group_index:4,level:"A2"},{i:38,start:416.103,end:429.072,es:"Cuando era niño, me acostaba a las ocho.",group:"en pasado",group_index:4,level:"A2"},{i:39,start:429.072,end:440.471,es:"Mi hermana se casó el año pasado.",group:"en pasado",group_index:4,level:"A2"},{i:40,start:440.471,end:449.825,es:"¿A qué hora te despertaste hoy?",group:"en pasado",group_index:4,level:"A2"},{i:41,start:449.825,end:461.995,es:"Los niños se divirtieron mucho en el parque.",group:"en pasado",group_index:4,level:"A2"},{i:42,start:461.995,end:471.334,es:"Me caí en la escalera.",group:"en pasado",group_index:4,level:"A2"},{i:43,start:471.334,end:486.391,es:"Antes nos levantábamos a las seis para ir al trabajo.",group:"en pasado",group_index:4,level:"A2"},{i:44,start:486.391,end:499.041,es:"Ya me había vestido cuando llegó el taxi.",group:"en pasado",group_index:4,level:"B1"},{i:45,start:500.541,end:511.779,es:"Nos conocimos en un viaje a México.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:46,start:511.779,end:521.458,es:"Mis padres se quieren mucho.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:47,start:521.458,end:535.858,es:"Mi hermano y yo nos llamamos cada semana.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:48,start:535.858,end:548.123,es:"Los dos amigos se abrazaron en el aeropuerto.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:49,start:548.123,end:561.073,es:"Ellos se escriben mensajes todos los días.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:50,start:561.073,end:575.473,es:"Ana y Luis se ayudan con las tareas de la casa.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:51,start:575.473,end:586.736,es:"Los vecinos se saludan en la escalera.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:52,start:586.736,end:598.757,es:"Es importante que nos escuchemos más.",group:"acciones recíprocas",group_index:5,level:"B1"},{i:53,start:598.757,end:610.777,es:"Ojalá se entiendan mejor con el tiempo.",group:"acciones recíprocas",group_index:5,level:"B1"},{i:54,start:612.277,end:621.162,es:"¿Cómo se llama tu perro?",group:"cambios de significado",group_index:6,level:"A1"},{i:55,start:621.162,end:632.335,es:"Ya me voy, es muy tarde.",group:"cambios de significado",group_index:6,level:"A2"},{i:56,start:632.335,end:644.326,es:"¿Por qué te fuiste tan temprano de la fiesta?",group:"cambios de significado",group_index:6,level:"A2"},{i:57,start:644.326,end:653.818,es:"El bebé se durmió en el auto.",group:"cambios de significado",group_index:6,level:"A2"},{i:58,start:653.818,end:664.523,es:"Hoy me quedo en casa porque llueve.",group:"cambios de significado",group_index:6,level:"A2"},{i:59,start:664.523,end:680.339,es:"Normalmente duermo bien, pero anoche me dormí muy tarde.",group:"cambios de significado",group_index:6,level:"B1"},{i:60,start:680.339,end:693.997,es:"Me quedé dormido y llegué tarde al trabajo.",group:"cambios de significado",group_index:6,level:"B1"},{i:61,start:693.997,end:705.541,es:"Se quedaron sin dinero al final del viaje.",group:"cambios de significado",group_index:6,level:"B1"},{i:62,start:705.541,end:716.938,es:"Me di cuenta del error demasiado tarde.",group:"cambios de significado",group_index:6,level:"B1"},{i:63,start:716.938,end:726.231,es:"No me acuerdo de su nombre.",group:"cambios de significado",group_index:6,level:"B1"}],Qs={word:Ns,slug:Ss,kind:Ls,hash:Ts,duration:Ps,voice:Cs,marks:Hs},Ds="vez",Ys="vez",Vs="word",Os="56fef447e39faac7",Is=698.832,Fs="mx-lento",Rs=[{i:0,start:.5,end:12.625,es:"Voy al gimnasio tres veces por semana.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:1,start:12.625,end:24.283,es:"Como pescado una vez a la semana.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:2,start:24.283,end:35.966,es:"Llamo a mi madre dos veces al día.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:3,start:35.966,end:45.709,es:"Lee la pregunta dos veces.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:4,start:45.709,end:55.809,es:"Solo lo digo una vez.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:5,start:55.809,end:67.648,es:"Tomo esta medicina tres veces al día.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:6,start:67.648,end:77.724,es:"Fui a París una vez.",group:"una vez, dos veces",group_index:0,level:"A2"},{i:7,start:79.224,end:88.926,es:"A veces trabajo en casa.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:8,start:88.926,end:97.981,es:"A veces llueve en verano.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:9,start:97.981,end:109.877,es:"Mi hermano a veces cocina para todos.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:10,start:109.877,end:121.319,es:"Muchas veces comemos juntos.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:11,start:121.319,end:131.304,es:"A veces no entiendo a mi jefe.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:12,start:131.304,end:142.711,es:"Muchas veces el tren llega tarde.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:13,start:142.711,end:153.545,es:"¿Vas mucho al cine? A veces.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:14,start:155.045,end:163.791,es:"¿Puedes decirlo otra vez?",group:"otra vez",group_index:2,level:"A1"},{i:15,start:163.791,end:171.673,es:"Otra vez llueve.",group:"otra vez",group_index:2,level:"A1"},{i:16,start:171.673,end:183.065,es:"Mañana vamos otra vez a la playa.",group:"otra vez",group_index:2,level:"A1"},{i:17,start:183.065,end:190.168,es:"¡Otra vez tú!",group:"otra vez",group_index:2,level:"A1"},{i:18,start:190.168,end:204.227,es:"El niño quiere ver la película otra vez.",group:"otra vez",group_index:2,level:"A1"},{i:19,start:204.227,end:215.268,es:"Mi teléfono otra vez no funciona.",group:"otra vez",group_index:2,level:"A1"},{i:20,start:215.268,end:225.302,es:"Perdí las llaves otra vez.",group:"otra vez",group_index:2,level:"A2"},{i:21,start:226.802,end:238.075,es:"Es la primera vez que vengo aquí.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A1"},{i:22,start:238.075,end:250.349,es:"La primera vez que la vi, no hablamos.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:23,start:250.349,end:261.846,es:"¿Cuándo fue la última vez que comiste?",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:24,start:261.846,end:276.719,es:"La última vez que fui, el museo estaba cerrado.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:25,start:276.719,end:290.007,es:"Esta es la última vez que te ayudo.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:26,start:290.007,end:303.593,es:"Recuerdo la primera vez que subí a un avión.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:27,start:303.593,end:316.807,es:"La próxima vez, llámame antes.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:28,start:318.307,end:328.504,es:"De vez en cuando como chocolate.",group:"de vez en cuando",group_index:4,level:"A2"},{i:29,start:328.504,end:340.292,es:"Mis primos nos visitan de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:30,start:340.292,end:351.94,es:"De vez en cuando me gusta caminar solo.",group:"de vez en cuando",group_index:4,level:"A2"},{i:31,start:351.94,end:362.667,es:"Vamos al teatro de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:32,start:362.667,end:374.948,es:"De vez en cuando escucho música clásica.",group:"de vez en cuando",group_index:4,level:"A2"},{i:33,start:374.948,end:386.135,es:"Es bueno descansar de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:34,start:387.635,end:395.355,es:"Tal vez mañana.",group:"tal vez",group_index:5,level:"A2"},{i:35,start:395.355,end:404.629,es:"Tal vez voy a la fiesta.",group:"tal vez",group_index:5,level:"A2"},{i:36,start:404.629,end:413.566,es:"Tal vez tienes razón.",group:"tal vez",group_index:5,level:"A2"},{i:37,start:413.566,end:423.358,es:"Tal vez está en la cocina.",group:"tal vez",group_index:5,level:"A2"},{i:38,start:423.358,end:433.425,es:"Tal vez llueva esta tarde.",group:"tal vez",group_index:5,level:"B1"},{i:39,start:433.425,end:444.808,es:"Tal vez Ana no sepa la dirección.",group:"tal vez",group_index:5,level:"B1"},{i:40,start:444.808,end:456.061,es:"Tal vez podamos vernos el sábado.",group:"tal vez",group_index:5,level:"B1"},{i:41,start:457.561,end:468.539,es:"Hoy tomo té en vez de café.",group:"en vez de",group_index:6,level:"A2"},{i:42,start:468.539,end:481.059,es:"Vamos a pie en vez de tomar un taxi.",group:"en vez de",group_index:6,level:"A2"},{i:43,start:481.059,end:494.654,es:"En vez de ver la televisión, lee un libro.",group:"en vez de",group_index:6,level:"A2"},{i:44,start:494.654,end:506.165,es:"Compré pollo en vez de carne.",group:"en vez de",group_index:6,level:"A2"},{i:45,start:506.165,end:518.73,es:"Ella fue a la reunión en vez de su jefe.",group:"en vez de",group_index:6,level:"A2"},{i:46,start:518.73,end:533.697,es:"Prefiero quedarme en casa en vez de salir esta noche.",group:"en vez de",group_index:6,level:"A2"},{i:47,start:533.697,end:546.73,es:"En vez de quejarte, ayúdame un poco.",group:"en vez de",group_index:6,level:"B1"},{i:48,start:548.23,end:559.092,es:"No puedo hacer dos cosas a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:49,start:559.092,end:567.961,es:"Todos hablaban a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:50,start:567.961,end:581.963,es:"Es una película triste y divertida a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:51,start:581.963,end:594.426,es:"Sentí miedo y alegría a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:52,start:594.426,end:606.864,es:"Mi hermana estudia y trabaja a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:53,start:606.864,end:618.927,es:"Los dos llegamos a la puerta a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:54,start:620.427,end:630.499,es:"Hace cada vez más calor.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:55,start:630.499,end:640.791,es:"Cada vez hay menos tiempo.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:56,start:640.791,end:651.979,es:"Mi español es cada vez mejor.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:57,start:651.979,end:664.837,es:"Cada vez más personas trabajan desde casa.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:58,start:664.837,end:676.422,es:"La ciudad está cada vez más cara.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:59,start:676.422,end:686.761,es:"Cada vez leo menos libros.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:60,start:686.761,end:698.784,es:"Tu hijo está cada vez más alto.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"}],Us={word:Ds,slug:Ys,kind:Vs,hash:Os,duration:Is,voice:Fs,marks:Rs},Gs="volver a",Ks="volver_a",Xs="word",Js="3ff8829bd97822e4",Ws=677.688,Zs="mx-lento",en=[{i:0,start:.5,end:9.858,es:"Vuelvo a casa a las seis.",group:"volver, regresar",group_index:0,level:"A1"},{i:1,start:9.858,end:16.943,es:"¿Cuándo vuelves?",group:"volver, regresar",group_index:0,level:"A1"},{i:2,start:16.943,end:26.269,es:"Mi hermano vuelve mañana.",group:"volver, regresar",group_index:0,level:"A1"},{i:3,start:26.269,end:35.527,es:"Volvemos en una hora.",group:"volver, regresar",group_index:0,level:"A1"},{i:4,start:35.527,end:47.199,es:"Ella vuelve del trabajo muy cansada.",group:"volver, regresar",group_index:0,level:"A1"},{i:5,start:47.199,end:57.215,es:"¿A qué hora vuelven los niños?",group:"volver, regresar",group_index:0,level:"A1"},{i:6,start:57.215,end:65.598,es:"Ayer volví tarde.",group:"volver, regresar",group_index:0,level:"A2"},{i:7,start:65.598,end:76.317,es:"Mis padres volvieron de Italia.",group:"volver, regresar",group_index:0,level:"A2"},{i:8,start:77.817,end:86.455,es:"Vuelvo a leer el libro.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:9,start:86.455,end:95.616,es:"Mañana vuelvo a llamar.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:10,start:95.616,end:106.981,es:"Siempre vuelve a perder las llaves.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:11,start:106.981,end:116.185,es:"El bebé vuelve a llorar.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:12,start:116.185,end:124.07,es:"Vuelve a llover.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:13,start:124.07,end:134.66,es:"Hoy volvemos a comer pescado.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:14,start:134.66,end:145.255,es:"Mi computadora vuelve a fallar.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:15,start:145.255,end:155.927,es:"Ella vuelve a preguntar lo mismo.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:16,start:157.427,end:168.396,es:"Volví a ver esa película.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:17,start:168.396,end:176.932,es:"Ayer volvió a nevar.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:18,start:176.932,end:186.806,es:"Volvimos a visitar el museo.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:19,start:186.806,end:200.145,es:"Después de dos años, volvió a trabajar.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:20,start:200.145,end:212.165,es:"Volví a llamar, pero nadie contestó.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:21,start:212.165,end:223.703,es:"El dolor volvió a empezar por la noche.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:22,start:223.703,end:237.884,es:"Mi hermana volvió a estudiar a los cuarenta años.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:23,start:237.884,end:251.591,es:"De niño, volví a leer ese cuento muchas veces.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:24,start:253.091,end:262.809,es:"Voy a volver a intentarlo.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:25,start:262.809,end:274.222,es:"Mañana va a volver a hacer frío.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:26,start:274.222,end:284.604,es:"¿Vas a volver a ese restaurante?",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:27,start:284.604,end:295.529,es:"Vamos a volver a vernos en verano.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:28,start:295.529,end:308.563,es:"Volveré a escribirte la semana que viene.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:29,start:308.563,end:322.647,es:"El año que viene volveremos a viajar juntos.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:30,start:322.647,end:334.416,es:"Te volveré a llamar más tarde.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:31,start:334.416,end:344.801,es:"Pronto volverá a salir el sol.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:32,start:346.301,end:354.967,es:"No vuelvo a comer ahí.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:33,start:354.967,end:364.307,es:"Nunca volví a verlo.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:34,start:364.307,end:374.192,es:"No volvimos a hablar del tema.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:35,start:374.192,end:384.16,es:"No pienso volver a ese hotel.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:36,start:384.16,end:397.67,es:"Después del accidente, no volvió a manejar.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:37,start:397.67,end:409.01,es:"Prometo no volver a llegar tarde.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:38,start:409.01,end:419.755,es:"No ha vuelto a llover desde marzo.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:39,start:419.755,end:428.503,es:"No vuelvas a hacer eso.",group:"no volver a, nunca más",group_index:4,level:"B1"},{i:40,start:430.003,end:438.995,es:"Vuelve a intentarlo.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:41,start:438.995,end:450.77,es:"Vuelva a revisar sus datos, por favor.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:42,start:450.77,end:460.666,es:"Vuelve a leer la pregunta.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:43,start:460.666,end:471.499,es:"Vuelvan a sentarse, por favor.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:44,start:471.499,end:481.221,es:"Vuelve a contar el dinero.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:45,start:481.221,end:494.844,es:"Por favor, vuelva a escribir su contraseña.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:46,start:494.844,end:513.217,es:"Si no funciona, apaga la computadora y vuelve a encenderla.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:47,start:514.717,end:524.657,es:"Lo volví a ver en la fiesta.",group:"con pronombres",group_index:6,level:"B1"},{i:48,start:524.657,end:534.263,es:"Te lo vuelvo a explicar.",group:"con pronombres",group_index:6,level:"B1"},{i:49,start:534.263,end:543.409,es:"Se me volvió a olvidar.",group:"con pronombres",group_index:6,level:"B1"},{i:50,start:543.409,end:554.037,es:"Me volvió a llamar a medianoche.",group:"con pronombres",group_index:6,level:"B1"},{i:51,start:554.037,end:563.273,es:"¿Me lo puedes volver a decir?",group:"con pronombres",group_index:6,level:"B1"},{i:52,start:563.273,end:574.817,es:"Nos volvimos a encontrar en el aeropuerto.",group:"con pronombres",group_index:6,level:"B1"},{i:53,start:574.817,end:585.495,es:"Se volvió a romper la lavadora.",group:"con pronombres",group_index:6,level:"B1"},{i:54,start:585.495,end:596.629,es:"Me lo volví a poner para la boda.",group:"con pronombres",group_index:6,level:"B1"},{i:55,start:598.129,end:607.924,es:"Espero que no vuelva a pasar.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:56,start:607.924,end:618.767,es:"Ojalá volvamos a vernos pronto.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:57,start:618.767,end:632.774,es:"Si pudiera, volvería a estudiar medicina.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:58,start:632.774,end:642.533,es:"Yo no volvería a ese lugar.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:59,start:642.533,end:654.474,es:"Cuando vuelvas a venir, avísame.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:60,start:654.474,end:666.467,es:"Me alegra que hayas vuelto a cantar.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:61,start:666.467,end:677.619,es:"No creo que vuelva a llover hoy.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"}],an={word:Gs,slug:Ks,kind:Xs,hash:Js,duration:Ws,voice:Zs,marks:en},on="ya / todavía",rn="ya_todavia",sn="word",nn="b5106e2310f3c58b",ln=707.64,tn="mx-lento",un=[{i:0,start:.5,end:8.244,es:"Ya es tarde.",group:"ya en presente",group_index:0,level:"A1"},{i:1,start:8.244,end:16.376,es:"Ya sé tu nombre.",group:"ya en presente",group_index:0,level:"A1"},{i:2,start:16.376,end:25.586,es:"Mi hermano ya trabaja.",group:"ya en presente",group_index:0,level:"A1"},{i:3,start:25.586,end:34.794,es:"¿Ya tienes las llaves?",group:"ya en presente",group_index:0,level:"A1"},{i:4,start:34.794,end:43.672,es:"El niño ya lee solo.",group:"ya en presente",group_index:0,level:"A1"},{i:5,start:43.672,end:53.112,es:"Ya estamos en casa.",group:"ya en presente",group_index:0,level:"A1"},{i:6,start:53.112,end:62.897,es:"La cena ya está lista.",group:"ya en presente",group_index:0,level:"A1"},{i:7,start:64.397,end:70.714,es:"¡Ya voy!",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:8,start:70.714,end:77.652,es:"¡Ven ya!",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:9,start:77.652,end:88.728,es:"Ya vengo, espérame aquí.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:10,start:88.728,end:98.428,es:"Hazlo ya, por favor.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:11,start:98.428,end:108.047,es:"Necesito una respuesta ya.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:12,start:108.047,end:118.613,es:"Ya bajo, un momento.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:13,start:118.613,end:131.367,es:"Si quieres llegar a tiempo, sal ya.",group:"ya voy, ahora mismo",group_index:1,level:"A2"},{i:14,start:132.867,end:143.409,es:"Todavía es temprano.",group:"todavía",group_index:2,level:"A1"},{i:15,start:143.409,end:153.935,es:"Mi abuela todavía vive sola.",group:"todavía",group_index:2,level:"A1"},{i:16,start:153.935,end:163.02,es:"¿Todavía tienes hambre?",group:"todavía",group_index:2,level:"A1"},{i:17,start:163.02,end:171.743,es:"Todavía llueve mucho.",group:"todavía",group_index:2,level:"A1"},{i:18,start:171.743,end:181.758,es:"Los niños todavía duermen.",group:"todavía",group_index:2,level:"A1"},{i:19,start:181.758,end:191.821,es:"Todavía estoy en la oficina.",group:"todavía",group_index:2,level:"A1"},{i:20,start:191.821,end:202.229,es:"¿Todavía trabajas en el hospital?",group:"todavía",group_index:2,level:"A1"},{i:21,start:203.729,end:211.809,es:"Todavía no lo sé.",group:"todavía no",group_index:3,level:"A1"},{i:22,start:211.809,end:222.74,es:"El autobús todavía no está aquí.",group:"todavía no",group_index:3,level:"A1"},{i:23,start:222.74,end:232.462,es:"Todavía no tengo trabajo.",group:"todavía no",group_index:3,level:"A1"},{i:24,start:232.462,end:243.081,es:"Mi hija todavía no habla.",group:"todavía no",group_index:3,level:"A1"},{i:25,start:243.081,end:252.974,es:"Todavía no es hora de comer.",group:"todavía no",group_index:3,level:"A1"},{i:26,start:252.974,end:264.097,es:"Todavía no conozco a tus padres.",group:"todavía no",group_index:3,level:"A1"},{i:27,start:264.097,end:273.011,es:"¿Todavía no estás listo?",group:"todavía no",group_index:3,level:"A1"},{i:28,start:274.511,end:284.037,es:"Ya no vivo en esa casa.",group:"ya no",group_index:4,level:"A2"},{i:29,start:284.037,end:292.762,es:"Ya no tengo frío.",group:"ya no",group_index:4,level:"A2"},{i:30,start:292.762,end:301.873,es:"Mi padre ya no fuma.",group:"ya no",group_index:4,level:"A2"},{i:31,start:301.873,end:311.312,es:"Ya no hay pan en la tienda.",group:"ya no",group_index:4,level:"A2"},{i:32,start:311.312,end:324.143,es:"Ya no quiero más café, gracias.",group:"ya no",group_index:4,level:"A2"},{i:33,start:324.143,end:333.704,es:"Ellos ya no son amigos.",group:"ya no",group_index:4,level:"A2"},{i:34,start:333.704,end:349.115,es:"Desde que tengo bicicleta, ya no tomo el autobús.",group:"ya no",group_index:4,level:"A2"},{i:35,start:350.615,end:361.166,es:"Ya he comido, gracias.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:36,start:361.166,end:370.49,es:"¿Ya has terminado la tarea?",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:37,start:370.49,end:381.077,es:"Ya hemos visto esa película.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:38,start:381.077,end:394.294,es:"Mis amigos ya han llegado al restaurante.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:39,start:394.294,end:404.945,es:"¿Ya has hablado con el médico?",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:40,start:404.945,end:416.649,es:"Ya ha empezado el partido.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:41,start:416.649,end:426.347,es:"Ya he leído tu mensaje.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:42,start:426.347,end:436.625,es:"¿Ya han llamado del banco?",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:43,start:438.125,end:449.198,es:"¡Ya está! Funciona otra vez.",group:"¡ya está!",group_index:6,level:"A2"},{i:44,start:449.198,end:461.877,es:"Ya está, la puerta está cerrada.",group:"¡ya está!",group_index:6,level:"A2"},{i:45,start:461.877,end:470.18,es:"¿Ya está el arroz?",group:"¡ya está!",group_index:6,level:"A2"},{i:46,start:470.18,end:479.902,es:"Un minuto más y ya está.",group:"¡ya está!",group_index:6,level:"A2"},{i:47,start:479.902,end:490.207,es:"¡Ya está! Terminé la tarea.",group:"¡ya está!",group_index:6,level:"A2"},{i:48,start:490.207,end:500.974,es:"¡Ya está! Ya podemos salir.",group:"¡ya está!",group_index:6,level:"A2"},{i:49,start:502.474,end:517.256,es:"Ya es de noche, pero todavía hace calor.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:50,start:517.256,end:534.283,es:"Ya terminé el informe, pero todavía tengo que enviarlo.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:51,start:534.283,end:548.75,es:"Mi hijo ya camina, pero todavía no habla.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:52,start:548.75,end:563.988,es:"Ya no llueve, pero las calles todavía están mojadas.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:53,start:563.988,end:580.597,es:"Ya compré los regalos, pero todavía no los he envuelto.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:54,start:580.597,end:595.208,es:"Ya sabía la noticia, pero todavía no lo creo.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:55,start:595.208,end:609.158,es:"Ya son las diez y todavía no ha llegado nadie.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:56,start:610.658,end:624.07,es:"Ya que estás aquí, ayúdame con la mesa.",group:"ya que",group_index:8,level:"B1"},{i:57,start:624.07,end:639.587,es:"Ya que hace buen tiempo, podríamos comer afuera.",group:"ya que",group_index:8,level:"B1"},{i:58,start:639.587,end:652.65,es:"No voy a salir, ya que estoy muy cansado.",group:"ya que",group_index:8,level:"B1"},{i:59,start:652.65,end:666.495,es:"Ya que vas al mercado, compra tomates.",group:"ya que",group_index:8,level:"B1"},{i:60,start:666.495,end:679.795,es:"Ya que no tienes prisa, quédate a cenar.",group:"ya que",group_index:8,level:"B1"},{i:61,start:679.795,end:692.723,es:"Ya que lo mencionas, yo también quiero ir.",group:"ya que",group_index:8,level:"B1"},{i:62,start:692.723,end:707.581,es:"Te llamo mañana, ya que hoy no tengo tiempo.",group:"ya que",group_index:8,level:"B1"}],dn={word:on,slug:rn,kind:sn,hash:nn,duration:ln,voice:tn,marks:un},pn="acabar",gn="acabar",cn="word",vn="c59869b1f7381917",mn=565.2,xn="mx",_n=[{i:0,start:.5,end:8.485,es:"La clase acaba a las tres.",group:"acabar, terminar",group_index:0,level:"A1"},{i:1,start:8.485,end:16.082,es:"¿Cuándo acaba la película?",group:"acabar, terminar",group_index:0,level:"A1"},{i:2,start:16.082,end:24.532,es:"La fiesta acaba muy tarde.",group:"acabar, terminar",group_index:0,level:"A1"},{i:3,start:24.532,end:32.718,es:"Acabo el trabajo a las cinco.",group:"acabar, terminar",group_index:0,level:"A1"},{i:4,start:32.718,end:40.724,es:"El curso acaba en junio.",group:"acabar, terminar",group_index:0,level:"A1"},{i:5,start:40.724,end:49.599,es:"¿Ya acabas la tarea? Te espero.",group:"acabar, terminar",group_index:0,level:"A1"},{i:6,start:49.599,end:57.778,es:"Mi turno acaba a medianoche.",group:"acabar, terminar",group_index:0,level:"A1"},{i:7,start:59.278,end:67.191,es:"Ayer acabé el libro.",group:"acabé, acabó",group_index:1,level:"A2"},{i:8,start:67.191,end:74.43,es:"¿Ya acabaste la tarea?",group:"acabé, acabó",group_index:1,level:"A2"},{i:9,start:74.43,end:82.737,es:"La reunión acabó muy tarde.",group:"acabé, acabó",group_index:1,level:"A2"},{i:10,start:82.737,end:92.415,es:"Anoche acabamos la cena a las once.",group:"acabé, acabó",group_index:1,level:"A2"},{i:11,start:92.415,end:101.561,es:"Todavía no he acabado el informe.",group:"acabé, acabó",group_index:1,level:"A2"},{i:12,start:101.561,end:110.438,es:"El partido acabó empatado.",group:"acabé, acabó",group_index:1,level:"A2"},{i:13,start:110.438,end:117.921,es:"¿Cómo acabó la historia?",group:"acabé, acabó",group_index:1,level:"A2"},{i:14,start:117.921,end:128.528,es:"Cuando acabó el partido, salimos a caminar.",group:"acabé, acabó",group_index:1,level:"A2"},{i:15,start:130.028,end:137.754,es:"Acabo de llegar a casa.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:16,start:137.754,end:144.669,es:"Acabamos de comer.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:17,start:144.669,end:152.07,es:"El tren acaba de salir.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:18,start:152.07,end:159.577,es:"¿Acabas de despertarte?",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:19,start:159.577,end:167.443,es:"Acaba de llamar tu madre.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:20,start:167.443,end:176.725,es:"Acabo de ver a Pedro en la calle.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:21,start:176.725,end:185.671,es:"Mis vecinos acaban de tener un bebé.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:22,start:185.671,end:193.735,es:"Acabo de enviarte el correo.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:23,start:193.735,end:202.599,es:"Cuando llegué, él acababa de salir.",group:"acabar de + infinitivo",group_index:2,level:"B1"},{i:24,start:202.599,end:212.265,es:"Acababa de ducharme cuando sonó el teléfono.",group:"acabar de + infinitivo",group_index:2,level:"B1"},{i:25,start:213.765,end:220.575,es:"Se acabó la leche.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:26,start:220.575,end:228.383,es:"Se acabaron las vacaciones.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:27,start:228.383,end:235.564,es:"Se nos acabó el pan.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:28,start:235.564,end:244.486,es:"Se me acabó la batería del teléfono.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:29,start:244.486,end:251.215,es:"¿Se acabó el café?",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:30,start:251.215,end:259.545,es:"Se acabó el tiempo del examen.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:31,start:259.545,end:267.841,es:"Se están acabando las entradas.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:32,start:267.841,end:278.726,es:"Cuando se acabe el dinero, volvemos a casa.",group:"acabarse: no quedar",group_index:3,level:"B1"},{i:33,start:280.226,end:288.603,es:"Acabé comprando dos camisas.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:34,start:288.603,end:297.755,es:"Siempre acabamos hablando de trabajo.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:35,start:297.755,end:308.048,es:"Fuimos a pasear y acabamos cenando en la playa.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:36,start:308.048,end:319.641,es:"No quería ir, pero acabé bailando toda la noche.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:37,start:319.641,end:329.748,es:"Ella siempre acaba pagando la cuenta.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:38,start:329.748,end:341.016,es:"Empezó como un juego y acabó siendo su trabajo.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:39,start:341.016,end:351.924,es:"Si no descansas, acabarás durmiéndote en clase.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:40,start:351.924,end:362.983,es:"Al final, acabó riéndose de sus propios errores.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:41,start:364.483,end:372.175,es:"La historia acabó bien.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"A2"},{i:42,start:372.175,end:380.212,es:"La película acaba mal.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"A2"},{i:43,start:380.212,end:388.303,es:"La discusión acabó en pelea.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:44,start:388.303,end:396.971,es:"Esta calle acaba en el río.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:45,start:396.971,end:407.101,es:"Si sigues así, vas a acabar enfermo.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:46,start:407.101,end:415.861,es:"Acabaron por aceptar nuestra oferta.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:47,start:415.861,end:424.113,es:"Todo acabó en una gran fiesta.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:48,start:424.113,end:432.804,es:"El proyecto acabó por cancelarse.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:49,start:434.304,end:443.281,es:"Tenemos que acabar con este problema.",group:"acabar con",group_index:6,level:"B1"},{i:50,start:443.281,end:452.443,es:"Este trabajo va a acabar conmigo.",group:"acabar con",group_index:6,level:"B1"},{i:51,start:452.443,end:461.136,es:"La lluvia acabó con nuestros planes.",group:"acabar con",group_index:6,level:"B1"},{i:52,start:461.136,end:470.195,es:"El gobierno quiere acabar con la pobreza.",group:"acabar con",group_index:6,level:"B1"},{i:53,start:470.195,end:480.499,es:"Hay que acabar con el ruido en el edificio.",group:"acabar con",group_index:6,level:"B1"},{i:54,start:480.499,end:491.051,es:"Esta medicina acabó con mi dolor de cabeza.",group:"acabar con",group_index:6,level:"B1"},{i:55,start:491.051,end:501.239,es:"Quiero acabar con esta situación cuanto antes.",group:"acabar con",group_index:6,level:"B1"},{i:56,start:502.739,end:511.568,es:"¡Se acabó! Nos vamos a casa.",group:"expresiones",group_index:7,level:"A2"},{i:57,start:511.568,end:522.105,es:"Y colorín colorado, este cuento se ha acabado.",group:"expresiones",group_index:7,level:"A2"},{i:58,start:522.105,end:529.739,es:"Esto no acaba nunca.",group:"expresiones",group_index:7,level:"B1"},{i:59,start:529.739,end:538.093,es:"No acabo de entender la pregunta.",group:"expresiones",group_index:7,level:"B1"},{i:60,start:538.093,end:547.689,es:"No acabo de acostumbrarme a esta ciudad.",group:"expresiones",group_index:7,level:"B1"},{i:61,start:547.689,end:555.195,es:"Lo bueno se acaba pronto.",group:"expresiones",group_index:7,level:"B1"},{i:62,start:555.195,end:565.146,es:"No vas a salir esta noche, y se acabó.",group:"expresiones",group_index:7,level:"B1"}],An={word:pn,slug:gn,kind:cn,hash:vn,duration:mn,voice:xn,marks:_n},hn="conocer",bn="conocer",fn="word",qn="b6e2a2a475687278",yn=597.576,jn="mx",Bn=[{i:0,start:.5,end:7.507,es:"Conozco a tu hermano.",group:"conocer a una persona",group_index:0,level:"A1"},{i:1,start:7.507,end:15.327,es:"No conozco a nadie aquí.",group:"conocer a una persona",group_index:0,level:"A1"},{i:2,start:15.327,end:22.252,es:"¿Conoces a mi vecina?",group:"conocer a una persona",group_index:0,level:"A1"},{i:3,start:22.252,end:31.628,es:"Ella conoce a todos en la oficina.",group:"conocer a una persona",group_index:0,level:"A1"},{i:4,start:31.628,end:40.324,es:"Conocemos al profesor de música.",group:"conocer a una persona",group_index:0,level:"A1"},{i:5,start:40.324,end:48.968,es:"Mis padres no conocen a mi jefe.",group:"conocer a una persona",group_index:0,level:"A1"},{i:6,start:48.968,end:58.076,es:"Yo conozco a la dueña del restaurante.",group:"conocer a una persona",group_index:0,level:"A1"},{i:7,start:58.076,end:67.045,es:"Te conozco desde hace muchos años.",group:"conocer a una persona",group_index:0,level:"A2"},{i:8,start:68.545,end:75.668,es:"No conozco esta ciudad.",group:"conocer un lugar",group_index:1,level:"A1"},{i:9,start:75.668,end:84.997,es:"Conozco un buen restaurante cerca de aquí.",group:"conocer un lugar",group_index:1,level:"A1"},{i:10,start:84.997,end:91.575,es:"¿Conoces México?",group:"conocer un lugar",group_index:1,level:"A1"},{i:11,start:91.575,end:99.441,es:"Mi abuela no conoce el mar.",group:"conocer un lugar",group_index:1,level:"A1"},{i:12,start:99.441,end:107.4,es:"Quiero conocer Buenos Aires.",group:"conocer un lugar",group_index:1,level:"A1"},{i:13,start:107.4,end:114.976,es:"Ya conocemos este museo.",group:"conocer un lugar",group_index:1,level:"A1"},{i:14,start:114.976,end:124.403,es:"El taxista conoce todas las calles.",group:"conocer un lugar",group_index:1,level:"A1"},{i:15,start:124.403,end:134.15,es:"Nunca he conocido un lugar tan tranquilo.",group:"conocer un lugar",group_index:1,level:"A2"},{i:16,start:135.65,end:143.122,es:"¿Conoces un buen médico?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:17,start:143.122,end:150.883,es:"¿Conoces algún hotel barato?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:18,start:150.883,end:159.249,es:"¿Conocen una tienda abierta ahora?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:19,start:159.249,end:168.903,es:"¿Conoces una buena película para esta noche?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:20,start:168.903,end:179.068,es:"Si conoces un buen mecánico, avísame.",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:21,start:179.068,end:188.664,es:"¿Conoces alguna receta fácil con pollo?",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:22,start:188.664,end:198.91,es:"Te recomiendo un café que conozco en el centro.",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:23,start:198.91,end:209.121,es:"¿Usted conoce a alguien que hable inglés?",group:"preguntas y recomendaciones",group_index:2,level:"B1"},{i:24,start:210.621,end:218.267,es:"Mucho gusto en conocerte.",group:"conocer por primera vez",group_index:3,level:"A1"},{i:25,start:218.267,end:227.068,es:"Conocí a mi novia en la universidad.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:26,start:227.068,end:235.073,es:"¿Dónde conociste a tu esposo?",group:"conocer por primera vez",group_index:3,level:"A2"},{i:27,start:235.073,end:244.774,es:"Nos conocimos en una fiesta de cumpleaños.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:28,start:244.774,end:254.288,es:"Ayer conocí a los padres de Carlos.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:29,start:254.288,end:263.803,es:"Mañana vas a conocer a mi familia.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:30,start:263.803,end:274.567,es:"Conocí a mi mejor amigo en el autobús.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:31,start:274.567,end:285.614,es:"Me encantaría conocer a tu hermana algún día.",group:"conocer por primera vez",group_index:3,level:"B1"},{i:32,start:287.114,end:293.854,es:"¿Ustedes se conocen?",group:"conocerse",group_index:4,level:"A1"},{i:33,start:293.854,end:302.678,es:"Nosotros nos conocemos desde niños.",group:"conocerse",group_index:4,level:"A2"},{i:34,start:302.678,end:310.811,es:"Ellos se conocieron en el trabajo.",group:"conocerse",group_index:4,level:"A2"},{i:35,start:310.811,end:319.305,es:"Nos conocimos hace diez años.",group:"conocerse",group_index:4,level:"A2"},{i:36,start:319.305,end:327.798,es:"Mis padres se conocieron en un tren.",group:"conocerse",group_index:4,level:"A2"},{i:37,start:327.798,end:338.938,es:"Me conozco muy bien y sé cuándo necesito descansar.",group:"conocerse",group_index:4,level:"B1"},{i:38,start:338.938,end:347.953,es:"Es importante conocerse a uno mismo.",group:"conocerse",group_index:4,level:"B1"},{i:39,start:349.453,end:359.595,es:"Conozco a Ana, pero no sé dónde vive.",group:"conocer y saber",group_index:5,level:"A2"},{i:40,start:359.595,end:369.957,es:"Conozco Madrid, pero no sé dónde está tu hotel.",group:"conocer y saber",group_index:5,level:"A2"},{i:41,start:369.957,end:380.761,es:"Sé su nombre, pero no lo conozco personalmente.",group:"conocer y saber",group_index:5,level:"A2"},{i:42,start:380.761,end:390.287,es:"Conozco la canción, pero no sé la letra.",group:"conocer y saber",group_index:5,level:"A2"},{i:43,start:390.287,end:401.787,es:"No conozco al nuevo director, solo sé que es muy serio.",group:"conocer y saber",group_index:5,level:"B1"},{i:44,start:401.787,end:415.668,es:"Conozco el camino, así que sé cuánto tiempo vamos a tardar.",group:"conocer y saber",group_index:5,level:"B1"},{i:45,start:415.668,end:427.771,es:"Aunque conozco bien el tema, no sé si podré explicarlo.",group:"conocer y saber",group_index:5,level:"B1"},{i:46,start:429.271,end:438.817,es:"Es un cantante muy conocido en su país.",group:"conocido y dar a conocer",group_index:6,level:"A2"},{i:47,start:438.817,end:447.946,es:"Esta ciudad es conocida por su comida.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:48,start:447.946,end:456.938,es:"El pintor es conocido en todo el mundo.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:49,start:456.938,end:465.443,es:"Lo conocen como el rey de la salsa.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:50,start:465.443,end:475.712,es:"La empresa dio a conocer su nuevo producto ayer.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:51,start:475.712,end:487.026,es:"Mañana van a dar a conocer los resultados del examen.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:52,start:487.026,end:497.04,es:"El pueblo es conocido como la capital del café.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:53,start:497.04,end:507.588,es:"El libro ayudó a dar a conocer la historia de la región.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:54,start:509.088,end:517.756,es:"Conozco muy bien a mi hermana.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A1"},{i:55,start:517.756,end:530.637,es:"Mi vecina me conoce de vista porque paso por su calle todos los días.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A2"},{i:56,start:530.637,end:541.615,es:"Lo conozco de vista, pero nunca hemos hablado.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A2"},{i:57,start:541.615,end:550.642,es:"Ella conoce el tema a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:58,start:550.642,end:561.724,es:"Antes de decidir, quiero conocer el proyecto a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:59,start:561.724,end:572.957,es:"No lo conocía bien, pero parecía una buena persona.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:60,start:572.957,end:585.084,es:"Para trabajar aquí, es necesario que conozcas bien el sistema.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:61,start:585.084,end:597.525,es:"Después de tantos viajes, conoce el país a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"}],zn={word:hn,slug:bn,kind:fn,hash:qn,duration:yn,voice:jn,marks:Bn},Mn="dar",En="dar",kn="word",$n="9b215d662685b715",wn=556.08,Nn="mx",Sn=[{i:0,start:.5,end:8.275,es:"Te doy mi número de teléfono.",group:"dar, entregar",group_index:0,level:"A1"},{i:1,start:8.275,end:15.78,es:"¿Me das un vaso de agua?",group:"dar, entregar",group_index:0,level:"A1"},{i:2,start:15.78,end:24.912,es:"Mi abuela me da dinero en mi cumpleaños.",group:"dar, entregar",group_index:0,level:"A1"},{i:3,start:24.912,end:33.323,es:"El profesor nos da mucha tarea.",group:"dar, entregar",group_index:0,level:"A1"},{i:4,start:33.323,end:40.89,es:"¿Le das de comer al gato?",group:"dar, entregar",group_index:0,level:"A1"},{i:5,start:40.89,end:47.049,es:"Dame la mano.",group:"dar, entregar",group_index:0,level:"A1"},{i:6,start:47.049,end:56.214,es:"Los vecinos nos dan fruta de su jardín.",group:"dar, entregar",group_index:0,level:"A1"},{i:7,start:56.214,end:63.035,es:"¿Qué le damos a mamá?",group:"dar, entregar",group_index:0,level:"A1"},{i:8,start:63.035,end:70.695,es:"¿Me das la sal, por favor?",group:"dar, entregar",group_index:0,level:"A1"},{i:9,start:72.195,end:79.992,es:"Te doy las gracias por todo.",group:"dar las gracias",group_index:1,level:"A1"},{i:10,start:79.992,end:89.484,es:"Siempre damos las gracias al conductor.",group:"dar las gracias",group_index:1,level:"A1"},{i:11,start:89.484,end:98.29,es:"Quiero darle las gracias a tu madre.",group:"dar las gracias",group_index:1,level:"A1"},{i:12,start:98.29,end:105.448,es:"Hay que dar las gracias.",group:"dar las gracias",group_index:1,level:"A1"},{i:13,start:105.448,end:113.712,es:"Le di las gracias por el regalo.",group:"dar las gracias",group_index:1,level:"A2"},{i:14,start:113.712,end:121.918,es:"Los niños no dieron las gracias.",group:"dar las gracias",group_index:1,level:"A2"},{i:15,start:123.418,end:132.75,es:"Le di un beso a mi abuela.",group:"di, dio, daba",group_index:2,level:"A2"},{i:16,start:132.75,end:141.161,es:"Mi jefe me dio el día libre.",group:"di, dio, daba",group_index:2,level:"A2"},{i:17,start:141.161,end:148.517,es:"¿Quién te dio esa noticia?",group:"di, dio, daba",group_index:2,level:"A2"},{i:18,start:148.517,end:158.993,es:"Nos dieron una habitación con vista al mar.",group:"di, dio, daba",group_index:2,level:"A2"},{i:19,start:158.993,end:168.879,es:"Mi padre siempre me daba buenos consejos.",group:"di, dio, daba",group_index:2,level:"A2"},{i:20,start:168.879,end:176.989,es:"El médico me dio una receta.",group:"di, dio, daba",group_index:2,level:"A2"},{i:21,start:176.989,end:186.121,es:"Le dimos un regalo a nuestra profesora.",group:"di, dio, daba",group_index:2,level:"A2"},{i:22,start:187.621,end:197.171,es:"Después de comer, damos un paseo.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A1"},{i:23,start:197.171,end:206.65,es:"Mis abuelos dan un paseo cada tarde.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A1"},{i:24,start:206.65,end:215.573,es:"Vamos a dar una vuelta por el centro.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:25,start:215.573,end:224.426,es:"¿Quieres dar una vuelta en bicicleta?",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:26,start:224.426,end:233.314,es:"Ayer dimos un paseo por la playa.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:27,start:233.314,end:241.923,es:"Voy a dar una vuelta con el perro.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:28,start:241.923,end:252.541,es:"Dimos una vuelta por el mercado antes de cenar.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:29,start:254.041,end:261.477,es:"Me dan miedo las arañas.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:30,start:261.477,end:272.171,es:"A mi hijo le da miedo la oscuridad.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:31,start:272.171,end:280.804,es:"Me da vergüenza hablar en público.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:32,start:280.804,end:289.517,es:"¿No te da vergüenza llegar tan tarde?",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:33,start:289.517,end:298.073,es:"Me da pena ver a ese perro solo.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:34,start:298.073,end:306.762,es:"Nos dio mucha pena dejar la ciudad.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:35,start:306.762,end:315.197,es:"Esa película me dio mucho miedo.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:36,start:315.197,end:324.435,es:"Le da vergüenza bailar delante de todos.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:37,start:325.935,end:332.25,es:"Me da igual.",group:"dar igual",group_index:5,level:"A1"},{i:38,start:332.25,end:340.975,es:"¿Pizza o pasta? Me da igual.",group:"dar igual",group_index:5,level:"A1"},{i:39,start:340.975,end:351.651,es:"Nos da igual el precio, queremos un buen hotel.",group:"dar igual",group_index:5,level:"A2"},{i:40,start:351.651,end:359.644,es:"¿Te da igual si vamos mañana?",group:"dar igual",group_index:5,level:"A2"},{i:41,start:359.644,end:370.773,es:"Antes me importaba, pero ahora me da igual.",group:"dar igual",group_index:5,level:"A2"},{i:42,start:370.773,end:379.115,es:"Da igual, no pasa nada.",group:"dar igual",group_index:5,level:"A2"},{i:43,start:379.115,end:389.965,es:"A ella le da igual lo que piensen los demás.",group:"dar igual",group_index:5,level:"B1"},{i:44,start:391.465,end:397.625,es:"¡Date prisa!",group:"darse prisa",group_index:6,level:"A1"},{i:45,start:397.625,end:407.163,es:"Dense prisa, el tren sale ahora.",group:"darse prisa",group_index:6,level:"A2"},{i:46,start:407.163,end:417.525,es:"Si no nos damos prisa, vamos a llegar tarde.",group:"darse prisa",group_index:6,level:"A2"},{i:47,start:417.525,end:425.904,es:"Me di prisa y llegué a tiempo.",group:"darse prisa",group_index:6,level:"A2"},{i:48,start:425.904,end:434.211,es:"No hace falta que te des prisa.",group:"darse prisa",group_index:6,level:"B1"},{i:49,start:435.711,end:443.09,es:"No me di cuenta de la hora.",group:"darse cuenta",group_index:7,level:"A2"},{i:50,start:443.09,end:451.159,es:"¿Te diste cuenta de que no estaba?",group:"darse cuenta",group_index:7,level:"A2"},{i:51,start:451.159,end:459.296,es:"Me di cuenta demasiado tarde.",group:"darse cuenta",group_index:7,level:"A2"},{i:52,start:459.296,end:471.015,es:"De repente me di cuenta de que había perdido las llaves.",group:"darse cuenta",group_index:7,level:"B1"},{i:53,start:471.015,end:479.067,es:"Nadie se dio cuenta del error.",group:"darse cuenta",group_index:7,level:"B1"},{i:54,start:479.067,end:488.849,es:"Cuando te des cuenta, ya será tarde.",group:"darse cuenta",group_index:7,level:"B1"},{i:55,start:488.849,end:498.491,es:"Es importante que se den cuenta del problema.",group:"darse cuenta",group_index:7,level:"B1"},{i:56,start:498.491,end:507.452,es:"Por fin me he dado cuenta de lo que quiero.",group:"darse cuenta",group_index:7,level:"B1"},{i:57,start:508.952,end:516.929,es:"La ventana da al mar.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:58,start:516.929,end:526.793,es:"Mi habitación da a un patio tranquilo.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:59,start:526.793,end:537.085,es:"Queremos una habitación que dé a la calle.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:60,start:537.085,end:545.927,es:"La puerta de la cocina da al jardín.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:61,start:545.927,end:556.025,es:"El balcón daba a una plaza muy bonita.",group:"dar a, mirar hacia",group_index:8,level:"B1"}],Ln={word:Mn,slug:En,kind:kn,hash:$n,duration:wn,voice:Nn,marks:Sn},Tn="dejar",Pn="dejar",Cn="word",Hn="8288734d65c2b27c",Qn=503.016,Dn="mx",Yn=[{i:0,start:.5,end:8.157,es:"Deja tu abrigo aquí.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:1,start:8.157,end:15.42,es:"¿Dónde dejo las llaves?",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:2,start:15.42,end:23.193,es:"Dejo el auto en la calle.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:3,start:23.193,end:31.86,es:"Siempre dejo la ventana abierta.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:4,start:31.86,end:40.008,es:"Deja los zapatos en la puerta.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:5,start:40.008,end:48.42,es:"Dejé el teléfono en casa.",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:6,start:48.42,end:55.741,es:"¿Dónde dejaste mi libro?",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:7,start:55.741,end:65.476,es:"Te dejé un poco de pastel en la cocina.",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:8,start:66.976,end:74.127,es:"¿Me dejas ir al baño?",group:"dejar, permitir",group_index:1,level:"A1"},{i:9,start:74.127,end:80.191,es:"Déjame ver.",group:"dejar, permitir",group_index:1,level:"A1"},{i:10,start:80.191,end:88.384,es:"Mi madre no me deja salir.",group:"dejar, permitir",group_index:1,level:"A1"},{i:11,start:88.384,end:95.135,es:"Déjame ayudarte.",group:"dejar, permitir",group_index:1,level:"A1"},{i:12,start:95.135,end:102.942,es:"El ruido no me deja dormir.",group:"dejar, permitir",group_index:1,level:"A1"},{i:13,start:102.942,end:111.181,es:"¿Me dejas usar tu computadora?",group:"dejar, permitir",group_index:1,level:"A1"},{i:14,start:111.181,end:121.972,es:"Mis padres nunca me dejaban ver televisión de noche.",group:"dejar, permitir",group_index:1,level:"A2"},{i:15,start:121.972,end:130.291,es:"No me dejaron entrar sin entrada.",group:"dejar, permitir",group_index:1,level:"A2"},{i:16,start:131.791,end:138.427,es:"No me dejes solo.",group:"dejar a alguien",group_index:2,level:"A1"},{i:17,start:138.427,end:145.413,es:"Te dejo en la esquina.",group:"dejar a alguien",group_index:2,level:"A1"},{i:18,start:145.413,end:151.92,es:"Mi novia me dejó.",group:"dejar a alguien",group_index:2,level:"A2"},{i:19,start:151.92,end:160.309,es:"Dejé a los niños con mi madre.",group:"dejar a alguien",group_index:2,level:"A2"},{i:20,start:160.309,end:168.663,es:"Mi padre me dejó en la estación.",group:"dejar a alguien",group_index:2,level:"A2"},{i:21,start:168.663,end:178.828,es:"Él la dejó después de cinco años juntos.",group:"dejar a alguien",group_index:2,level:"A2"},{i:22,start:178.828,end:187.612,es:"Nunca voy a dejar a mis amigos.",group:"dejar a alguien",group_index:2,level:"A2"},{i:23,start:189.112,end:195.478,es:"¡Deja de gritar!",group:"dejar de + infinitivo",group_index:3,level:"A1"},{i:24,start:195.478,end:203.925,es:"Dejé de fumar el año pasado.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:25,start:203.925,end:211.527,es:"Por fin ha dejado de llover.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:26,start:211.527,end:220.865,es:"Mi hermano dejó de trabajar en el banco.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:27,start:220.865,end:230.218,es:"Tienes que dejar de comer tanto azúcar.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:28,start:230.218,end:241.683,es:"Cuando nació mi hijo, dejé de salir por la noche.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:29,start:241.683,end:250.571,es:"Quiero dejar de preocuparme por todo.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:30,start:250.571,end:258.457,es:"El reloj dejó de funcionar.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:31,start:259.957,end:268.857,es:"Dejé mi trabajo en marzo.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:32,start:268.857,end:276.422,es:"Ella dejó la universidad.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:33,start:276.422,end:283.545,es:"Quiero dejar el café.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:34,start:283.545,end:293.466,es:"Dejamos el gimnasio porque era muy caro.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:35,start:293.466,end:303.642,es:"Mi abuelo dejó el tabaco hace diez años.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:36,start:303.642,end:311.729,es:"No pienso dejar mis estudios.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:37,start:313.229,end:320.596,es:"El bebé no deja de llorar.",group:"no dejar de",group_index:5,level:"A2"},{i:38,start:320.596,end:330.436,es:"Mi vecino no dejó de hablar en toda la cena.",group:"no dejar de",group_index:5,level:"A2"},{i:39,start:330.436,end:338.732,es:"No dejes de visitar el mercado.",group:"no dejar de",group_index:5,level:"B1"},{i:40,start:338.732,end:346.041,es:"No dejo de pensar en ti.",group:"no dejar de",group_index:5,level:"B1"},{i:41,start:346.041,end:355.091,es:"No dejen de probar la sopa de la casa.",group:"no dejar de",group_index:5,level:"B1"},{i:42,start:355.091,end:363.803,es:"No dejes de llamarme cuando llegues.",group:"no dejar de",group_index:5,level:"B1"},{i:43,start:363.803,end:374.722,es:"Aunque esté cansado, no deja de ir al gimnasio.",group:"no dejar de",group_index:5,level:"B1"},{i:44,start:376.222,end:385.549,es:"Deja la puerta cerrada, por favor.",group:"dejar + participio o adjetivo",group_index:6,level:"A2"},{i:45,start:385.549,end:393.113,es:"Dejé la cena preparada.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:46,start:393.113,end:401.327,es:"La noticia me dejó preocupado.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:47,start:401.327,end:410.11,es:"Dejamos todo listo para el viaje.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:48,start:410.11,end:418.043,es:"El examen me dejó agotado.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:49,start:418.043,end:426.652,es:"El viaje nos dejó muy contentos.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:50,start:426.652,end:435.145,es:"Ya dejé pagada la cuenta del hotel.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:51,start:436.645,end:445.487,es:"Sin querer, dejé caer el plato.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:52,start:445.487,end:453.353,es:"Déjalo, no importa.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:53,start:453.353,end:461.437,es:"Deja eso para mañana.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:54,start:461.437,end:467.849,es:"Déjame en paz.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:55,start:467.849,end:476.295,es:"Deja que lo piense un poco.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:56,start:476.295,end:485.647,es:"Dejemos el tema para otro día.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:57,start:485.647,end:495.232,es:"No dejes para mañana lo que puedas hacer hoy.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:58,start:495.232,end:502.947,es:"Eso deja mucho que desear.",group:"expresiones con dejar",group_index:7,level:"B1"}],Vn={word:Tn,slug:Pn,kind:Cn,hash:Hn,duration:Qn,voice:Dn,marks:Yn},On="echar",In="echar",Fn="word",Rn="2ccdaf8e6b005ad0",Un=548.832,Gn="mx",Kn=[{i:0,start:.5,end:8.331,es:"Echa la pelota al perro.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:1,start:8.331,end:15.896,es:"Echo la carta en el buzón.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:2,start:15.896,end:24.826,es:"Los niños echan piedras al río.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:3,start:24.826,end:32.691,es:"¿Puedes echar esto a la basura?",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:4,start:32.691,end:40.732,es:"Ella echa pan a los patos.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:5,start:40.732,end:48.517,es:"No eches papeles al suelo.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:6,start:48.517,end:56.905,es:"Echamos una moneda a la fuente.",group:"echar, lanzar algo",group_index:0,level:"A2"},{i:7,start:58.405,
