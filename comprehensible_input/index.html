arse: no quedar",group_index:3,level:"A2"},{i:32,start:338.855,end:353.839,es:"Cuando se acabe el dinero, volvemos a casa.",group:"acabarse: no quedar",group_index:3,level:"B1"},{i:33,start:355.339,end:365.984,es:"Acabé comprando dos camisas.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:34,start:365.984,end:377.858,es:"Siempre acabamos hablando de trabajo.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:35,start:377.858,end:391.479,es:"Fuimos a pasear y acabamos cenando en la playa.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:36,start:391.479,end:406.973,es:"No quería ir, pero acabé bailando toda la noche.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:37,start:406.973,end:420.355,es:"Ella siempre acaba pagando la cuenta.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:38,start:420.355,end:435.221,es:"Empezó como un juego y acabó siendo su trabajo.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:39,start:435.221,end:449.824,es:"Si no descansas, acabarás durmiéndote en clase.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:40,start:449.824,end:464.512,es:"Al final, acabó riéndose de sus propios errores.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:41,start:466.012,end:475.585,es:"La historia acabó bien.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"A2"},{i:42,start:475.585,end:485.738,es:"La película acaba mal.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"A2"},{i:43,start:485.738,end:495.855,es:"La discusión acabó en pelea.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:44,start:495.855,end:507.069,es:"Esta calle acaba en el río.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:45,start:507.069,end:520.775,es:"Si sigues así, vas a acabar enfermo.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:46,start:520.775,end:532.14,es:"Acabaron por aceptar nuestra oferta.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:47,start:532.14,end:542.369,es:"Todo acabó en una gran fiesta.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:48,start:542.369,end:553.492,es:"El proyecto acabó por cancelarse.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:49,start:554.992,end:566.487,es:"Tenemos que acabar con este problema.",group:"acabar con",group_index:6,level:"B1"},{i:50,start:566.487,end:578.302,es:"Este trabajo va a acabar conmigo.",group:"acabar con",group_index:6,level:"B1"},{i:51,start:578.302,end:589.17,es:"La lluvia acabó con nuestros planes.",group:"acabar con",group_index:6,level:"B1"},{i:52,start:589.17,end:600.961,es:"El gobierno quiere acabar con la pobreza.",group:"acabar con",group_index:6,level:"B1"},{i:53,start:600.961,end:614.946,es:"Hay que acabar con el ruido en el edificio.",group:"acabar con",group_index:6,level:"B1"},{i:54,start:614.946,end:629.397,es:"Esta medicina acabó con mi dolor de cabeza.",group:"acabar con",group_index:6,level:"B1"},{i:55,start:629.397,end:642.798,es:"Quiero acabar con esta situación cuanto antes.",group:"acabar con",group_index:6,level:"B1"},{i:56,start:644.298,end:655.96,es:"¡Se acabó! Nos vamos a casa.",group:"expresiones",group_index:7,level:"A2"},{i:57,start:655.96,end:669.91,es:"Y colorín colorado, este cuento se ha acabado.",group:"expresiones",group_index:7,level:"A2"},{i:58,start:669.91,end:679.31,es:"Esto no acaba nunca.",group:"expresiones",group_index:7,level:"B1"},{i:59,start:679.31,end:689.834,es:"No acabo de entender la pregunta.",group:"expresiones",group_index:7,level:"B1"},{i:60,start:689.834,end:702.202,es:"No acabo de acostumbrarme a esta ciudad.",group:"expresiones",group_index:7,level:"B1"},{i:61,start:702.202,end:711.572,es:"Lo bueno se acaba pronto.",group:"expresiones",group_index:7,level:"B1"},{i:62,start:711.572,end:724.707,es:"No vas a salir esta noche, y se acabó.",group:"expresiones",group_index:7,level:"B1"}],ua= up:"conocer un lugar",group_index:1,level:"A2"},{i:16,start:172.201,end:181.308,es:"¿Conoces un buen médico?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:17,start:181.308,end:191.224,es:"¿Conoces algún hotel barato?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:18,start:191.224,end:201.722,es:"¿Conocen una tienda abierta ahora?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:19,start:201.722,end:214.181,es:"¿Conoces una buena película para esta noche?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:20,start:214.181,end:227.783,es:"Si conoces un buen mecánico, avísame.",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:21,start:227.783,end:240.361,es:"¿Conoces alguna receta fácil con pollo?",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:22,start:240.361,end:253.812,es:"Te recomiendo un café que conozco en el centro.",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:23,start:253.812,end:267.041,es:"¿Usted conoce a alguien que hable inglés?",group:"preguntas y recomendaciones",group_index:2,level:"B1"},{i:24,start:268.541,end:278.16,es:"Mucho gusto en conocerte.",group:"conocer por primera vez",group_index:3,level:"A1"},{i:25,start:278.16,end:289.174,es:"Conocí a mi novia en la universidad.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:26,start:289.174,end:299.351,es:"¿Dónde conociste a tu esposo?",group:"conocer por primera vez",group_index:3,level:"A2"},{i:27,start:299.351,end:311.779,es:"Nos conocimos en una fiesta de cumpleaños.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:28,start:311.779,end:324.577,es:"Ayer conocí a los padres de Carlos.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:29,start:324.577,end:336.889,es:"Mañana vas a conocer a mi familia.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:30,start:336.889,end:351.406,es:"Conocí a mi mejor amigo en el autobús.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:31,start:351.406,end:366.402,es:"Me encantaría conocer a tu hermana algún día.",group:"conocer por primera vez",group_index:3,level:"B1"},{i:32,start:367.902,end:376.009,es:"¿Ustedes se conocen?",group:"conocerse",group_index:4,level:"A1"},{i:33,start:376.009,end:387.154,es:"Nosotros nos conocemos desde niños.",group:"conocerse",group_index:4,level:"A2"},{i:34,start:387.154,end:397.342,es:"Ellos se conocieron en el trabajo.",group:"conocerse",group_index:4,level:"A2"},{i:35,start:397.342,end:408.169,es:"Nos conocimos hace diez años.",group:"conocerse",group_index:4,level:"A2"},{i:36,start:408.169,end:418.959,es:"Mis padres se conocieron en un tren.",group:"conocerse",group_index:4,level:"A2"},{i:37,start:418.959,end:433.988,es:"Me conozco muy bien y sé cuándo necesito descansar.",group:"conocerse",group_index:4,level:"B1"},{i:38,start:433.988,end:445.748,es:"Es importante conocerse a uno mismo.",group:"conocerse",group_index:4,level:"B1"},{i:39,start:447.248,end:460.223,es:"Conozco a Ana, pero no sé dónde vive.",group:"conocer y saber",group_index:5,level:"A2"},{i:40,start:460.223,end:473.731,es:"Conozco Madrid, pero no sé dónde está tu hotel.",group:"conocer y saber",group_index:5,level:"A2"},{i:41,start:473.731,end:488.017,es:"Sé su nombre, pero no lo conozco personalmente.",group:"conocer y saber",group_index:5,level:"A2"},{i:42,start:488.017,end:500.57,es:"Conozco la canción, pero no sé la letra.",group:"conocer y saber",group_index:5,level:"A2"},{i:43,start:500.57,end:515.948,es:"No conozco al nuevo director, solo sé que es muy serio.",group:"conocer y saber",group_index:5,level:"B1"},{i:44,start:515.948,end:535.306,es:"Conozco el camino, así que sé cuánto tiempo vamos a tardar.",group:"conocer y saber",group_index:5,level:"B1"},{i:45,start:535.306,end:551.612,es:"Aunque conozco bien el tema, no sé si podré explicarlo.",group:"conocer y saber",group_index:5,level:"B1"},{i:46,start:553.112,end:565.621,es:"Es un cantante muy conocido en su país.",group:"conocido y dar a conocer",group_index:6,level:"A2"},{i:47,start:565.621,end:577.377,es:"Esta ciudad es conocida por su comida.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:48,start:577.377,end:589.014,es:"El pintor es conocido en todo el mundo.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:49,start:589.014,end:599.652,es:"Lo conocen como el rey de la salsa.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:50,start:599.652,end:613.137,es:"La empresa dio a conocer su nuevo producto ayer.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:51,start:613.137,end:628.048,es:"Mañana van a dar a conocer los resultados del examen.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:52,start:628.048,end:641.052,es:"El pueblo es conocido como la capital del café.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:53,start:641.052,end:654.773,es:"El libro ayudó a dar a conocer la historia de la región.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:54,start:656.273,end:667.471,es:"Conozco muy bien a mi hermana.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A1"},{i:55,start:667.471,end:684.775,es:"Mi vecina me conoce de vista porque paso por su calle todos los días.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A2"},{i:56,start:684.775,end:699.645,es:"Lo conozco de vista, pero nunca hemos hablado.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A2"},{i:57,start:699.645,end:711.608,es:"Ella conoce el tema a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:58,start:711.608,end:726.435,es:"Antes de decidir, quiero conocer el proyecto a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:59,start:726.435,end:741.567,es:"No lo conocía bien, pero parecía una buena persona.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:60,start:741.567,end:757.984,es:"Para trabajar aquí, es necesario que conozcas bien el sistema.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:61,start:757.984,end:775.233,es:"Después de tantos viajes, conoce el país a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"}],_a={word:da,slug:pa,kind:ga,hash:ca,duration:va,voice:ma,marks:xa},Aa="dar",ha="dar",ba="word",fa="ec036a990f2ce043",qa=707.496,ya="mx-lento",ja=[{i:0,start:.5,end:10.018,es:"Te doy mi número de teléfono.",group:"dar, entregar",group_index:0,level:"A1"},{i:1,start:10.018,end:19.125,es:"¿Me das un vaso de agua?",group:"dar, entregar",group_index:0,level:"A1"},{i:2,start:19.125,end:30.697,es:"Mi abuela me da dinero en mi cumpleaños.",group:"dar, entregar",group_index:0,level:"A1"},{i:3,start:30.697,end:41.547,es:"El profesor nos da mucha tarea.",group:"dar, entregar",group_index:0,level:"A1"},{i:4,start:41.547,end:50.816,es:"¿Le das de comer al gato?",group:"dar, entregar",group_index:0,level:"A1"},{i:5,start:50.816,end:58.051,es:"Dame la mano.",group:"dar, entregar",group_index:0,level:"A1"},{i:6,start:58.051,end:69.641,es:"Los vecinos nos dan fruta de su jardín.",group:"dar, entregar",group_index:0,level:"A1"},{i:7,start:69.641,end:77.913,es:"¿Qué le damos a mamá?",group:"dar, entregar",group_index:0,level:"A1"},{i:8,start:77.913,end:87.482,es:"¿Me das la sal, por favor?",group:"dar, entregar",group_index:0,level:"A1"},{i:9,start:88.982,end:98.799,es:"Te doy las gracias por todo.",group:"dar las gracias",group_index:1,level:"A1"},{i:10,start:98.799,end:111.202,es:"Siempre damos las gracias al conductor.",group:"dar las gracias",group_index:1,level:"A1"},{i:11,start:111.202,end:122.492,es:"Quiero darle las gracias a tu madre.",group:"dar las gracias",group_index:1,level:"A1"},{i:12,start:122.492,end:131.345,es:"Hay que dar las gracias.",group:"dar las gracias",group_index:1,level:"A1"},{i:13,start:131.345,end:141.789,es:"Le di las gracias por el regalo.",group:"dar las gracias",group_index:1,level:"A2"},{i:14,start:141.789,end:152.128,es:"Los niños no dieron las gracias.",group:"dar las gracias",group_index:1,level:"A2"},{i:15,start:153.628,end:165.648,es:"Le di un beso a mi abuela.",group:"di, dio, daba",group_index:2,level:"A2"},{i:16,start:165.648,end:176.269,es:"Mi jefe me dio el día libre.",group:"di, dio, daba",group_index:2,level:"A2"},{i:17,start:176.269,end:185.387,es:"¿Quién te dio esa noticia?",group:"di, dio, daba",group_index:2,level:"A2"},{i:18,start:185.387,end:199.033,es:"Nos dieron una habitación con vista al mar.",group:"di, dio, daba",group_index:2,level:"A2"},{i:19,start:199.033,end:211.971,es:"Mi padre siempre me daba buenos consejos.",group:"di, dio, daba",group_index:2,level:"A2"},{i:20,start:211.971,end:222.197,es:"El médico me dio una receta.",group:"di, dio, daba",group_index:2,level:"A2"},{i:21,start:222.197,end:233.704,es:"Le dimos un regalo a nuestra profesora.",group:"di, dio, daba",group_index:2,level:"A2"},{i:22,start:235.204,end:247.684,es:"Después de comer, damos un paseo.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A1"},{i:23,start:247.684,end:260.103,es:"Mis abuelos dan un paseo cada tarde.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A1"},{i:24,start:260.103,end:271.241,es:"Vamos a dar una vuelta por el centro.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:25,start:271.241,end:282.799,es:"¿Quieres dar una vuelta en bicicleta?",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:26,start:282.799,end:294.286,es:"Ayer dimos un paseo por la playa.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:27,start:294.286,end:305.286,es:"Voy a dar una vuelta con el perro.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:28,start:305.286,end:319.455,es:"Dimos una vuelta por el mercado antes de cenar.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:29,start:320.955,end:330.05,es:"Me dan miedo las arañas.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:30,start:330.05,end:344.331,es:"A mi hijo le da miedo la oscuridad.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:31,start:344.331,end:355.37,es:"Me da vergüenza hablar en público.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:32,start:355.37,end:366.522,es:"¿No te da vergüenza llegar tan tarde?",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:33,start:366.522,end:377.334,es:"Me da pena ver a ese perro solo.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:34,start:377.334,end:388.347,es:"Nos dio mucha pena dejar la ciudad.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:35,start:388.347,end:399.122,es:"Esa película me dio mucho miedo.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:36,start:399.122,end:410.889,es:"Le da vergüenza bailar delante de todos.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:37,start:412.389,end:420.042,es:"Me da igual.",group:"dar igual",group_index:5,level:"A1"},{i:38,start:420.042,end:431.231,es:"¿Pizza o pasta? Me da igual.",group:"dar igual",group_index:5,level:"A1"},{i:39,start:431.231,end:445.234,es:"Nos da igual el precio, queremos un buen hotel.",group:"dar igual",group_index:5,level:"A2"},{i:40,start:445.234,end:455.116,es:"¿Te da igual si vamos mañana?",group:"dar igual",group_index:5,level:"A2"},{i:41,start:455.116,end:470.268,es:"Antes me importaba, pero ahora me da igual.",group:"dar igual",group_index:5,level:"A2"},{i:42,start:470.268,end:481.065,es:"Da igual, no pasa nada.",group:"dar igual",group_index:5,level:"A2"},{i:43,start:481.065,end:495.788,es:"A ella le da igual lo que piensen los demás.",group:"dar igual",group_index:5,level:"B1"},{i:44,start:497.288,end:504.609,es:"¡Date prisa!",group:"darse prisa",group_index:6,level:"A1"},{i:45,start:504.609,end:517.198,es:"Dense prisa, el tren sale ahora.",group:"darse prisa",group_index:6,level:"A2"},{i:46,start:517.198,end:530.892,es:"Si no nos damos prisa, vamos a llegar tarde.",group:"darse prisa",group_index:6,level:"A2"},{i:47,start:530.892,end:541.522,es:"Me di prisa y llegué a tiempo.",group:"darse prisa",group_index:6,level:"A2"},{i:48,start:541.522,end:552.056,es:"No hace falta que te des prisa.",group:"darse prisa",group_index:6,level:"B1"},{i:49,start:553.556,end:562.844,es:"No me di cuenta de la hora.",group:"darse cuenta",group_index:7,level:"A2"},{i:50,start:562.844,end:572.672,es:"¿Te diste cuenta de que no estaba?",group:"darse cuenta",group_index:7,level:"A2"},{i:51,start:572.672,end:582.706,es:"Me di cuenta demasiado tarde.",group:"darse cuenta",group_index:7,level:"A2"},{i:52,start:582.706,end:598.355,es:"De repente me di cuenta de que había perdido las llaves.",group:"darse cuenta",group_index:7,level:"B1"},{i:53,start:598.355,end:608.427,es:"Nadie se dio cuenta del error.",group:"darse cuenta",group_index:7,level:"B1"},{i:54,start:608.427,end:621.169,es:"Cuando te des cuenta, ya será tarde.",group:"darse cuenta",group_index:7,level:"B1"},{i:55,start:621.169,end:633.59,es:"Es importante que se den cuenta del problema.",group:"darse cuenta",group_index:7,level:"B1"},{i:56,start:633.59,end:644.919,es:"Por fin me he dado cuenta de lo que quiero.",group:"darse cuenta",group_index:7,level:"B1"},{i:57,start:646.419,end:656.328,es:"La ventana da al mar.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:58,start:656.328,end:669.02,es:"Mi habitación da a un patio tranquilo.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:59,start:669.02,end:682.893,es:"Queremos una habitación que dé a la calle.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:60,start:682.893,end:694.23,es:"La puerta de la cocina da al jardín.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:61,start:694.23,end:707.439,es:"El balcón daba a una plaza muy bonita.",group:"dar a, mirar hacia",group_index:8,level:"B1"}],Ba={word:Aa,slug:ha,kind:ba,hash:fa,duration:qa,voice:ya,marks:ja},za="dejar",Ma="dejar",Ea="word",ka="1df55a6f0f83ddcd",$a=633.096,wa="mx-lento",Na=[{i:0,start:.5,end:10.196,es:"Deja tu abrigo aquí.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:1,start:10.196,end:19.011,es:"¿Dónde dejo las llaves?",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:2,start:19.011,end:28.766,es:"Dejo el auto en la calle.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:3,start:28.766,end:39.93,es:"Siempre dejo la ventana abierta.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:4,start:39.93,end:50.254,es:"Deja los zapatos en la puerta.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:5,start:50.254,end:60.965,es:"Dejé el teléfono en casa.",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:6,start:60.965,end:70.131,es:"¿Dónde dejaste mi libro?",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:7,start:70.131,end:82.636,es:"Te dejé un poco de pastel en la cocina.",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:8,start:84.136,end:92.861,es:"¿Me dejas ir al baño?",group:"dejar, permitir",group_index:1,level:"A1"},{i:9,start:92.861,end:99.923,es:"Déjame ver.",group:"dejar, permitir",group_index:1,level:"A1"},{i:10,start:99.923,end:109.856,es:"Mi madre no me deja salir.",group:"dejar, permitir",group_index:1,level:"A1"},{i:11,start:109.856,end:118.123,es:"Déjame ayudarte.",group:"dejar, permitir",group_index:1,level:"A1"},{i:12,start:118.123,end:127.763,es:"El ruido no me deja dormir.",group:"dejar, permitir",group_index:1,level:"A1"},{i:13,start:127.763,end:138.183,es:"¿Me dejas usar tu computadora?",group:"dejar, permitir",group_index:1,level:"A1"},{i:14,start:138.183,end:152.4,es:"Mis padres nunca me dejaban ver televisión de noche.",group:"dejar, permitir",group_index:1,level:"A2"},{i:15,start:152.4,end:162.899,es:"No me dejaron entrar sin entrada.",group:"dejar, permitir",group_index:1,level:"A2"},{i:16,start:164.399,end:172.285,es:"No me dejes solo.",group:"dejar a alguien",group_index:2,level:"A1"},{i:17,start:172.285,end:180.807,es:"Te dejo en la esquina.",group:"dejar a alguien",group_index:2,level:"A1"},{i:18,start:180.807,end:188.419,es:"Mi novia me dejó.",group:"dejar a alguien",group_index:2,level:"A2"},{i:19,start:188.419,end:199.009,es:"Dejé a los niños con mi madre.",group:"dejar a alguien",group_index:2,level:"A2"},{i:20,start:199.009,end:209.092,es:"Mi padre me dejó en la estación.",group:"dejar a alguien",group_index:2,level:"A2"},{i:21,start:209.092,end:222.313,es:"Él la dejó después de cinco años juntos.",group:"dejar a alguien",group_index:2,level:"A2"},{i:22,start:222.313,end:233.602,es:"Nunca voy a dejar a mis amigos.",group:"dejar a alguien",group_index:2,level:"A2"},{i:23,start:235.102,end:242.625,es:"¡Deja de gritar!",group:"dejar de + infinitivo",group_index:3,level:"A1"},{i:24,start:242.625,end:253.325,es:"Dejé de fumar el año pasado.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:25,start:253.325,end:262.472,es:"Por fin ha dejado de llover.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:26,start:262.472,end:274.691,es:"Mi hermano dejó de trabajar en el banco.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:27,start:274.691,end:286.71,es:"Tienes que dejar de comer tanto azúcar.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:28,start:286.71,end:302.273,es:"Cuando nació mi hijo, dejé de salir por la noche.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:29,start:302.273,end:313.878,es:"Quiero dejar de preocuparme por todo.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:30,start:313.878,end:323.702,es:"El reloj dejó de funcionar.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:31,start:325.202,end:336.58,es:"Dejé mi trabajo en marzo.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:32,start:336.58,end:346.024,es:"Ella dejó la universidad.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:33,start:346.024,end:354.871,es:"Quiero dejar el café.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:34,start:354.871,end:367.852,es:"Dejamos el gimnasio porque era muy caro.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:35,start:367.852,end:381.169,es:"Mi abuelo dejó el tabaco hace diez años.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:36,start:381.169,end:391.334,es:"No pienso dejar mis estudios.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:37,start:392.834,end:401.787,es:"El bebé no deja de llorar.",group:"no dejar de",group_index:5,level:"A2"},{i:38,start:401.787,end:414.553,es:"Mi vecino no dejó de hablar en toda la cena.",group:"no dejar de",group_index:5,level:"A2"},{i:39,start:414.553,end:424.98,es:"No dejes de visitar el mercado.",group:"no dejar de",group_index:5,level:"B1"},{i:40,start:424.98,end:433.949,es:"No dejo de pensar en ti.",group:"no dejar de",group_index:5,level:"B1"},{i:41,start:433.949,end:445.468,es:"No dejen de probar la sopa de la casa.",group:"no dejar de",group_index:5,level:"B1"},{i:42,start:445.468,end:456.709,es:"No dejes de llamarme cuando llegues.",group:"no dejar de",group_index:5,level:"B1"},{i:43,start:456.709,end:471.158,es:"Aunque esté cansado, no deja de ir al gimnasio.",group:"no dejar de",group_index:5,level:"B1"},{i:44,start:472.658,end:484.697,es:"Deja la puerta cerrada, por favor.",group:"dejar + participio o adjetivo",group_index:6,level:"A2"},{i:45,start:484.697,end:493.996,es:"Dejé la cena preparada.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:46,start:493.996,end:504.356,es:"La noticia me dejó preocupado.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:47,start:504.356,end:515.473,es:"Dejamos todo listo para el viaje.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:48,start:515.473,end:525.421,es:"El examen me dejó agotado.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:49,start:525.421,end:536.315,es:"El viaje nos dejó muy contentos.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:50,start:536.315,end:546.979,es:"Ya dejé pagada la cuenta del hotel.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:51,start:548.479,end:559.956,es:"Sin querer, dejé caer el plato.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:52,start:559.956,end:569.961,es:"Déjalo, no importa.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:53,start:569.961,end:580.173,es:"Deja eso para mañana.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:54,start:580.173,end:587.758,es:"Déjame en paz.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:55,start:587.758,end:598.637,es:"Deja que lo piense un poco.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:56,start:598.637,end:610.946,es:"Dejemos el tema para otro día.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:57,start:610.946,end:623.303,es:"No dejes para mañana lo que puedas hacer hoy.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:58,start:623.303,end:633.033,es:"Eso deja mucho que desear.",group:"expresiones con dejar",group_index:7,level:"B1"}],Sa={word:za,slug:Ma,kind:Ea,hash:ka,duration:$a,voice:wa,marks:Na},La="echar",Ta="echar",Pa="word",Ca="b4000541f296ccfa",Ha=705.984,Qa="mx-lento",Da=[{i:0,start:.5,end:10.363,es:"Echa la pelota al perro.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:1,start:10.363,end:19.734,es:"Echo la carta en el buzón.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:2,start:19.734,end:31.124,es:"Los niños echan piedras al río.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:3,start:31.124,end:40.868,es:"¿Puedes echar esto a la basura?",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:4,start:40.868,end:51.174,es:"Ella echa pan a los patos.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:5,start:51.174,end:60.769,es:"No eches papeles al suelo.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:6,start:60.769,end:71.401,es:"Echamos una moneda a la fuente.",group:"echar, lanzar algo",group_index:0,level:"A2"},{i:7,start:72.901,end:83.918,es:"Echa un poco de sal a la sopa.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:8,start:83.918,end:93.451,es:"¿Le echas azúcar al café?",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:9,start:93.451,end:102.371,es:"Yo no echo leche al té.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:10,start:102.371,end:112.083,es:"Echa más agua a la olla.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:11,start:112.083,end:125.568,es:"Mi abuela echa mucho ajo a todo.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:12,start:125.568,end:138.917,es:"Echa un poco de hielo a la limonada.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:13,start:138.917,end:149.499,es:"¿Cuánto aceite le echo a la ensalada?",group:"echar en la comida y la bebida",group_index:1,level:"A2"},{i:14,start:149.499,end:161.065,es:"Le eché demasiada pimienta a la carne.",group:"echar en la comida y la bebida",group_index:1,level:"A2"},{i:15,start:162.565,end:173.806,es:"¿Me echas una mano con estas cajas?",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:16,start:173.806,end:186.64,es:"Mi vecino siempre me echa una mano.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:17,start:186.64,end:196.547,es:"Te echo una mano con la cena.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:18,start:196.547,end:211.607,es:"Ayer le eché una mano a mi hermano con la mudanza.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:19,start:211.607,end:222.659,es:"¿Puedes echar un vistazo a mi trabajo?",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:20,start:222.659,end:233.584,es:"Voy a echar un vistazo a la tienda.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:21,start:233.584,end:247.445,es:"Echa un vistazo al bebé, por favor.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:22,start:247.445,end:260.794,es:"El mecánico le echó un vistazo al motor.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:23,start:262.294,end:272.339,es:"El perro se echa en el sofá.",group:"echarse, acostarse",group_index:3,level:"A1"},{i:24,start:272.339,end:285.31,es:"Estoy cansado, voy a echarme un rato.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:25,start:285.31,end:299.19,es:"Después de comer, me eché en la cama.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:26,start:299.19,end:312.892,es:"Mi padre se echa en la hamaca todas las tardes.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:27,start:312.892,end:324.461,es:"Nos echamos en la arena a tomar el sol.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:28,start:324.461,end:337.782,es:"Échate un momento si te duele la cabeza.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:29,start:337.782,end:348.876,es:"El gato se echó al lado de la ventana.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:30,start:350.376,end:358.194,es:"¿Me echas de menos?",group:"echar de menos",group_index:4,level:"A1"},{i:31,start:358.194,end:368.159,es:"Echo de menos a mi familia.",group:"echar de menos",group_index:4,level:"A2"},{i:32,start:368.159,end:379.441,es:"Echamos de menos la comida de casa.",group:"echar de menos",group_index:4,level:"A2"},{i:33,start:379.441,end:393.822,es:"Cuando vivía lejos, echaba de menos el mar.",group:"echar de menos",group_index:4,level:"A2"},{i:34,start:393.822,end:403.459,es:"Te he echado mucho de menos.",group:"echar de menos",group_index:4,level:"A2"},{i:35,start:403.459,end:417.968,es:"Mi hija echa de menos a sus amigos del colegio.",group:"echar de menos",group_index:4,level:"A2"},{i:36,start:417.968,end:428.658,es:"Voy a echar de menos esta ciudad.",group:"echar de menos",group_index:4,level:"A2"},{i:37,start:428.658,end:443.86,es:"Nadie echó de menos la televisión durante las vacaciones.",group:"echar de menos",group_index:4,level:"A2"},{i:38,start:445.36,end:456.848,es:"Mi madre echó a los niños de la cocina.",group:"echar a alguien",group_index:5,level:"A2"},{i:39,start:456.848,end:468.502,es:"Lo echaron del trabajo por llegar tarde.",group:"echar a alguien",group_index:5,level:"B1"},{i:40,start:468.502,end:481.443,es:"El dueño nos echó del restaurante a medianoche.",group:"echar a alguien",group_index:5,level:"B1"},{i:41,start:481.443,end:495.392,es:"Si no pagas el alquiler, te van a echar.",group:"echar a alguien",group_index:5,level:"B1"},{i:42,start:495.392,end:506.788,es:"Echaron a dos jugadores del partido.",group:"echar a alguien",group_index:5,level:"B1"},{i:43,start:506.788,end:520.355,es:"Me echaron de la biblioteca por hablar por teléfono.",group:"echar a alguien",group_index:5,level:"B1"},{i:44,start:520.355,end:534.012,es:"No creo que te echen por un error tan pequeño.",group:"echar a alguien",group_index:5,level:"B1"},{i:45,start:535.512,end:548.672,es:"Cuando vio al perro, el niño echó a correr.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:46,start:548.672,end:560.771,es:"Al oír la noticia, se echó a llorar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:47,start:560.771,end:572.902,es:"De repente, todos se echaron a reír.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:48,start:572.902,end:581.977,es:"El pájaro echó a volar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:49,start:581.977,end:596.064,es:"Cuando abrieron la puerta, la gente echó a andar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:50,start:596.064,end:608.539,es:"Si le dices eso, se va a echar a llorar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:51,start:608.539,end:623.803,es:"Empezó a llover y echamos a correr hacia la casa.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:52,start:625.303,end:638.179,es:"Siempre me echa la culpa a mí.",group:"expresiones con echar",group_index:7,level:"B1"},{i:53,start:638.179,end:648.932,es:"El calor echó a perder la fruta.",group:"expresiones con echar",group_index:7,level:"B1"},{i:54,start:648.932,end:659.872,es:"No eches a perder esta oportunidad.",group:"expresiones con echar",group_index:7,level:"B1"},{i:55,start:659.872,end:671.32,es:"Siempre me echa en cara mis errores.",group:"expresiones con echar",group_index:7,level:"B1"},{i:56,start:671.32,end:682.986,es:"Estaba tan furioso que echaba humo.",group:"expresiones con echar",group_index:7,level:"B1"},{i:57,start:682.986,end:695.139,es:"Me gustaría echar raíces en este pueblo.",group:"expresiones con echar",group_index:7,level:"B1"},{i:58,start:695.139,end:705.923,es:"No le eches más leña al fuego.",group:"expresiones con echar",group_index:7,level:"B1"}],Ya={word:La,slug:Ta,kind:Pa,hash:Ca,duration:Ha,voice:Qa,marks:Da},Va="faltar / hacer falta",Oa="faltar_hacer_falta",Ia="word",Fa="3f27981284c7d028",Ra=652.56,Ua="mx-lento",Ga=[{i:0,start:.5,end:8.492,es:"Me falta dinero.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:1,start:8.492,end:15.929,es:"¿Qué te falta?",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:2,start:15.929,end:25.172,es:"A la sopa le falta sal.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:3,start:25.172,end:33.819,es:"Nos faltan dos sillas.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:4,start:33.819,end:47.101,es:"A mi camisa le falta un botón.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:5,start:47.101,end:57.123,es:"Te falta una firma aquí.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:6,start:57.123,end:67.871,es:"Me faltan tres páginas del libro.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:7,start:67.871,end:79.511,es:"A este equipo le falta un jugador.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:8,start:81.011,end:90.491,es:"Falta poco para llegar.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:9,start:90.491,end:101.95,es:"Faltan dos días para mi cumpleaños.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:10,start:101.95,end:111.411,es:"¿Cuánto falta para el verano?",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:11,start:111.411,end:122.784,es:"Faltan cinco minutos para las nueve.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:12,start:122.784,end:132.541,es:"Ya falta poco, niños.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:13,start:132.541,end:146.288,es:"Todavía faltan tres semanas para las vacaciones.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:14,start:146.288,end:155.745,es:"¿Cuántas estaciones faltan?",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:15,start:155.745,end:167.53,es:"Solo falta una semana para la boda.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:16,start:169.03,end:178.641,es:"En la fiesta faltó comida.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:17,start:178.641,end:191.105,es:"Me faltó tiempo para terminar el examen.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:18,start:191.105,end:202.761,es:"Cuando llegamos, faltaba el postre.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:19,start:202.761,end:214.361,es:"Siempre nos faltaba dinero a fin de mes.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:20,start:214.361,end:223.281,es:"¿Quién faltó a la reunión?",group:"faltó, faltaba",group_index:2,level:"A2"},{i:21,start:223.281,end:236.174,es:"Faltó agua en el barrio toda la semana.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:22,start:236.174,end:248.347,es:"Faltaban diez minutos para la medianoche.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:23,start:249.847,end:261.513,es:"Hoy falto a clase porque estoy enfermo.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A1"},{i:24,start:261.513,end:270.62,es:"Nunca falto al trabajo.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A1"},{i:25,start:270.62,end:281.766,es:"Mi hijo faltó a clase dos días.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:26,start:281.766,end:290.526,es:"¿Por qué faltaste ayer?",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:27,start:290.526,end:303.245,es:"Si faltas mucho, vas a perder el curso.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:28,start:303.245,end:315.629,es:"Ella nunca ha faltado a una cita.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:29,start:315.629,end:325.919,es:"No quiero faltar a tu fiesta.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:30,start:327.419,end:336.531,es:"Hace falta paciencia.",group:"hace falta + nombre",group_index:4,level:"A1"},{i:31,start:336.531,end:344.956,es:"¿Te hace falta algo?",group:"hace falta + nombre",group_index:4,level:"A1"},{i:32,start:344.956,end:355.806,es:"Me hace falta un abrigo nuevo.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:33,start:355.806,end:365.973,es:"Nos hacen falta más platos.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:34,start:365.973,end:378.603,es:"Para este trabajo hace falta experiencia.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:35,start:378.603,end:390.945,es:"En esta casa hace falta más luz.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:36,start:390.945,end:401.916,es:"Te hacen falta unas vacaciones.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:37,start:401.916,end:412.483,es:"Le hacía falta un amigo.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:38,start:413.983,end:423.624,es:"Hace falta estudiar más.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:39,start:423.624,end:433.393,es:"No hace falta pagar ahora.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:40,start:433.393,end:443.489,es:"¿Hace falta reservar mesa?",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:41,start:443.489,end:454.207,es:"No hace falta llevar paraguas.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:42,start:454.207,end:467.991,es:"Para viajar allí hace falta tener pasaporte.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:43,start:467.991,end:481.844,es:"Gracias, pero no hacía falta traer nada.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:44,start:481.844,end:495.855,es:"Hará falta comprar más comida para el sábado.",group:"hace falta + infinitivo",group_index:5,level:"B1"},{i:45,start:497.355,end:507.193,es:"No hace falta que vengas.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:46,start:507.193,end:517.635,es:"No hace falta que me esperes.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:47,start:517.635,end:528.405,es:"No hace falta que traigan nada.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:48,start:528.405,end:537.695,es:"¿Hace falta que lo repita?",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:49,start:537.695,end:551.495,es:"Hace falta que alguien hable con el director.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:50,start:551.495,end:562.727,es:"No hacía falta que te molestaras.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:51,start:562.727,end:575.77,es:"No hace falta que me lo expliques otra vez.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:52,start:577.27,end:584.879,es:"¡Lo que faltaba!",group:"expresiones",group_index:7,level:"A2"},{i:53,start:584.879,end:594.363,es:"Me haces mucha falta.",group:"expresiones",group_index:7,level:"B1"},{i:54,start:594.363,end:605.921,es:"No le faltes el respeto a tu abuela.",group:"expresiones",group_index:7,level:"B1"},{i:55,start:605.921,end:619.83,es:"Vivo lejos y me hace mucha falta mi familia.",group:"expresiones",group_index:7,level:"B1"},{i:56,start:619.83,end:631.98,es:"Faltó poco para que perdiéramos el avión.",group:"expresiones",group_index:7,level:"B1"},{i:57,start:631.98,end:643.233,es:"No faltaría más, pase usted.",group:"expresiones",group_index:7,level:"B1"},{i:58,start:643.233,end:652.5,es:"Aquí no nos falta nada.",group:"expresiones",group_index:7,level:"B1"}],Ka={word:Va,slug:Oa,kind:Ia,hash:Fa,duration:Ra,voice:Ua,marks:Ga},Xa="haber",Ja="haber",Wa="word",Za="de701df82343ee76",eo=671.952,ao="mx-lento",oo=[{i:0,start:.5,end:11.164,es:"Hay un perro en el jardín.",group:"hay",group_index:0,level:"A1"},{i:1,start:11.164,end:21.085,es:"¿Hay leche en el refrigerador?",group:"hay",group_index:0,level:"A1"},{i:2,start:21.085,end:28.207,es:"No hay pan.",group:"hay",group_index:0,level:"A1"},{i:3,start:28.207,end:38.615,es:"Hay muchas personas en la calle.",group:"hay",group_index:0,level:"A1"},{i:4,start:38.615,end:49.184,es:"En mi clase hay veinte estudiantes.",group:"hay",group_index:0,level:"A1"},{i:5,start:49.184,end:59.337,es:"¿Hay un banco cerca de aquí?",group:"hay",group_index:0,level:"A1"},{i:6,start:59.337,end:67.29,es:"Hoy no hay clase.",group:"hay",group_index:0,level:"A1"},{i:7,start:67.29,end:77.536,es:"Hay dos camas en la habitación.",group:"hay",group_index:0,level:"A1"},{i:8,start:77.536,end:85.484,es:"¿Qué hay para comer?",group:"hay",group_index:0,level:"A1"},{i:9,start:86.984,end:95.094,es:"Hay que comer bien.",group:"hay que",group_index:1,level:"A1"},{i:10,start:95.094,end:104.028,es:"Hay que llegar temprano.",group:"hay que",group_index:1,level:"A1"},{i:11,start:104.028,end:112.951,es:"Hay que tener paciencia.",group:"hay que",group_index:1,level:"A1"},{i:12,start:112.951,end:122.222,es:"Hay que lavar los platos.",group:"hay que",group_index:1,level:"A1"},{i:13,start:122.222,end:131.98,es:"Hay que hablar con ella hoy.",group:"hay que",group_index:1,level:"A1"},{i:14,start:131.98,end:145.139,es:"Para entrar, hay que comprar una entrada.",group:"hay que",group_index:1,level:"A2"},{i:15,start:145.139,end:154.186,es:"No hay que pagar nada.",group:"hay que",group_index:1,level:"A2"},{i:16,start:154.186,end:163.191,es:"No hay que preocuparse.",group:"hay que",group_index:1,level:"A2"},{i:17,start:164.691,end:173.464,es:"He comido demasiado.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:18,start:173.464,end:182.322,es:"¿Has visto mi teléfono?",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:19,start:182.322,end:195.366,es:"Hemos vivido aquí durante cinco años.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:20,start:195.366,end:204.58,es:"Todavía no he terminado.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:21,start:204.58,end:215.458,es:"Ya ha llegado el tren.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:22,start:215.458,end:226.235,es:"¿Alguna vez has estado en México?",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:23,start:226.235,end:237.361,es:"Nunca he probado el mole.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:24,start:237.361,end:248.362,es:"Esta semana ha llovido mucho.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:25,start:248.362,end:259.103,es:"Mis padres han vuelto de su viaje.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:26,start:260.603,end:272.724,es:"Había mucha gente en la fiesta.",group:"había, hubo",group_index:3,level:"A2"},{i:27,start:272.724,end:285.873,es:"Antes había un cine en esta calle.",group:"había, hubo",group_index:3,level:"A2"},{i:28,start:285.873,end:296.918,es:"No había nadie en casa.",group:"había, hubo",group_index:3,level:"A2"},{i:29,start:296.918,end:308.552,es:"¿Había agua caliente en el hotel?",group:"había, hubo",group_index:3,level:"A2"},{i:30,start:308.552,end:321.336,es:"Ayer hubo un accidente en la autopista.",group:"había, hubo",group_index:3,level:"A2"},{i:31,start:321.336,end:333.598,es:"Hubo un problema con mi tarjeta.",group:"había, hubo",group_index:3,level:"A2"},{i:32,start:333.598,end:345.581,es:"Anoche hubo una tormenta muy fuerte.",group:"había, hubo",group_index:3,level:"A2"},{i:33,start:345.581,end:356.943,es:"Cuando era niño, no había internet.",group:"había, hubo",group_index:3,level:"A2"},{i:34,start:358.443,end:372.901,es:"Cuando llegué, la película ya había empezado.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:35,start:372.901,end:383.841,es:"Nunca había visto tanta nieve.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:36,start:383.841,end:397.802,es:"Me dijo que había perdido las llaves.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:37,start:397.802,end:409.286,es:"Ya habíamos cenado cuando llamaste.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:38,start:409.286,end:420.439,es:"No sabía que habías vuelto.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:39,start:420.439,end:431.4,es:"Pensé que te habías olvidado de mí.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:40,start:431.4,end:445.465,es:"Mis amigos ya habían salido cuando empezó a llover.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:41,start:446.965,end:457.455,es:"Mañana habrá mucho tráfico.",group:"habrá, habría",group_index:5,level:"B1"},{i:42,start:457.455,end:466.503,es:"¿Habrá tiempo para comer?",group:"habrá, habría",group_index:5,level:"B1"},{i:43,start:466.503,end:476.822,es:"No contesta. Habrá salido.",group:"habrá, habría",group_index:5,level:"B1"},{i:44,start:476.822,end:490.309,es:"Para el viernes ya habré terminado el informe.",group:"habrá, habría",group_index:5,level:"B1"},{i:45,start:490.309,end:500.769,es:"Yo habría hecho lo mismo.",group:"habrá, habría",group_index:5,level:"B1"},{i:46,start:500.769,end:515.204,es:"Habría más trabajo si la tienda abriera los domingos.",group:"habrá, habría",group_index:5,level:"B1"},{i:47,start:515.204,end:527.703,es:"Me dijeron que habría una reunión.",group:"habrá, habría",group_index:5,level:"B1"},{i:48,start:529.203,end:541.03,es:"Espero que haya mesas libres.",group:"haya, hubiera",group_index:6,level:"B1"},{i:49,start:541.03,end:552.611,es:"No creo que haya llegado todavía.",group:"haya, hubiera",group_index:6,level:"B1"},{i:50,start:552.611,end:562.959,es:"Me alegro de que hayas venido.",group:"haya, hubiera",group_index:6,level:"B1"},{i:51,start:562.959,end:574.038,es:"Cuando hayas terminado, llámame.",group:"haya, hubiera",group_index:6,level:"B1"},{i:52,start:574.038,end:585.369,es:"Ojalá haya buen tiempo mañana.",group:"haya, hubiera",group_index:6,level:"B1"},{i:53,start:585.369,end:595.873,es:"No creo que hayas entendido.",group:"haya, hubiera",group_index:6,level:"B1"},{i:54,start:595.873,end:606.484,es:"Me sorprendió que no hubiera nadie.",group:"haya, hubiera",group_index:6,level:"B1"},{i:55,start:607.984,end:615.21,es:"No hay de qué.",group:"expresiones",group_index:7,level:"A1"},{i:56,start:615.21,end:622.809,es:"¿Qué hay de nuevo?",group:"expresiones",group_index:7,level:"A2"},{i:57,start:622.809,end:630.411,es:"No hay prisa.",group:"expresiones",group_index:7,level:"A2"},{i:58,start:630.411,end:641.265,es:"Ha habido un cambio de planes.",group:"expresiones",group_index:7,level:"B1"},{i:59,start:641.265,end:649.643,es:"No hay nada que hacer.",group:"expresiones",group_index:7,level:"B1"},{i:60,start:649.643,end:660.824,es:"No hay mal que por bien no venga.",group:"expresiones",group_index:7,level:"B1"},{i:61,start:660.824,end:671.891,es:"No hay manera de abrir esta puerta.",group:"expresiones",group_index:7,level:"B1"}],ro={word:Xa,slug:Ja,kind:Wa,hash:Za,duration:eo,voice:ao,marks:oo},so="hacer",no="hacer",lo="word",io="59fcfa2904bb69a2",to=668.376,uo="mx-lento",po=[{i:0,start:.5,end:7.136,es:"¿Qué haces?",group:"hacer, actividades",group_index:0,level:"A1"},{i:1,start:7.136,end:17.125,es:"Hago la tarea después de cenar.",group:"hacer, actividades",group_index:0,level:"A1"},{i:2,start:17.125,end:28.427,es:"Mi padre hace la comida los domingos.",group:"hacer, actividades",group_index:0,level:"A1"},{i:3,start:28.427,end:41.721,es:"¿Qué hacen ustedes los fines de semana?",group:"hacer, actividades",group_index:0,level:"A1"},{i:4,start:41.721,end:54.589,es:"Hago ejercicio todas las mañanas.",group:"hacer, actividades",group_index:0,level:"A1"},{i:5,start:54.589,end:65.819,es:"Siempre hago la cama.",group:"hacer, actividades",group_index:0,level:"A1"},{i:6,start:65.819,end:78.644,es:"Mi madre hace un pastel muy rico.",group:"hacer, actividades",group_index:0,level:"A1"},{i:7,start:78.644,end:88.004,es:"No hago nada los sábados.",group:"hacer, actividades",group_index:0,level:"A1"},{i:8,start:88.004,end:97.805,es:"¿Qué vas a hacer esta noche?",group:"hacer, actividades",group_index:0,level:"A1"},{i:9,start:99.305,end:108.396,es:"Hoy hace mucho frío.",group:"el tiempo",group_index:1,level:"A1"},{i:10,start:108.396,end:117.721,es:"En verano hace calor.",group:"el tiempo",group_index:1,level:"A1"},{i:11,start:117.721,end:128.331,es:"Hace sol, vamos al parque.",group:"el tiempo",group_index:1,level:"A1"},{i:12,start:128.331,end:136.837,es:"Hace viento en la playa.",group:"el tiempo",group_index:1,level:"A1"},{i:13,start:136.837,end:146.278,es:"¿Qué tiempo hace en tu ciudad?",group:"el tiempo",group_index:1,level:"A1"},{i:14,start:146.278,end:156.425,es:"Hace buen tiempo para caminar.",group:"el tiempo",group_index:1,level:"A1"},{i:15,start:156.425,end:166.044,es:"Hoy hace un día precioso.",group:"el tiempo",group_index:1,level:"A1"},{i:16,start:166.044,end:175.116,es:"Ayer hizo mucho calor.",group:"el tiempo",group_index:1,level:"A2"},{i:17,start:176.616,end:185.352,es:"¿Puedo hacer una pregunta?",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A1"},{i:18,start:185.352,end:197.476,es:"Los estudiantes hacen muchas preguntas.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A1"},{i:19,start:197.476,end:208.057,es:"Tenemos que hacer fila para entrar.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:20,start:208.057,end:218.962,es:"Hicimos fila durante una hora.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:21,start:218.962,end:230.214,es:"Todavía no he hecho la maleta.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:22,start:230.214,end:246.505,es:"Siempre hago la maleta la noche antes del viaje.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:23,start:246.505,end:259.615,es:"El periodista le hizo una pregunta difícil.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:24,start:261.115,end:269.213,es:"¿Qué hiciste ayer?",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:25,start:269.213,end:279.667,es:"No hice nada el fin de semana.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:26,start:279.667,end:291.573,es:"Mi hermano hizo la cena anoche.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:27,start:291.573,end:303.205,es:"De niños hacíamos castillos de arena.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:28,start:303.205,end:312.005,es:"¿Ya has hecho la tarea?",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:29,start:312.005,end:323.714,es:"Hemos hecho un viaje increíble.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:30,start:323.714,end:331.822,es:"Lo hice sin pensar.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:31,start:331.822,end:341.345,es:"¿Qué hacías a esa hora?",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:32,start:342.845,end:352.037,es:"Llegué hace dos horas.",group:"hace, pasado",group_index:4,level:"A2"},{i:33,start:352.037,end:364.747,es:"Hace un año que nos conocimos en Madrid.",group:"hace, pasado",group_index:4,level:"A2"},{i:34,start:364.747,end:373.267,es:"La vi hace poco.",group:"hace, pasado",group_index:4,level:"A2"},{i:35,start:373.267,end:386.288,es:"Hace tres días que hablamos por teléfono.",group:"hace, pasado",group_index:4,level:"A2"},{i:36,start:386.288,end:398.681,es:"Mis abuelos se casaron hace cincuenta años.",group:"hace, pasado",group_index:4,level:"A2"},{i:37,start:398.681,end:412.252,es:"Hace mucho tiempo vivía en el campo.",group:"hace, pasado",group_index:4,level:"A2"},{i:38,start:412.252,end:422.155,es:"¿Cuánto tiempo hace que llegaste?",group:"hace, pasado",group_index:4,level:"A2"},{i:39,start:422.155,end:434.179,es:"Terminé la universidad hace diez años.",group:"hace, pasado",group_index:4,level:"A2"},{i:40,start:435.679,end:447.532,es:"Hace dos años que estudio español.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:41,start:447.532,end:458.041,es:"Hace mucho tiempo que no te veo.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:42,start:458.041,end:468.575,es:"¿Cuánto tiempo hace que vives aquí?",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:43,start:468.575,end:479.798,es:"Hace una hora que espero el autobús.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:44,start:479.798,end:488.873,es:"Hace meses que no llueve.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:45,start:488.873,end:499.975,es:"Hace tiempo que quiero visitar Perú.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:46,start:499.975,end:511.398,es:"Hace una semana que no duermo bien.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:47,start:512.898,end:520.248,es:"Hazme caso.",group:"hacer caso",group_index:6,level:"A2"},{i:48,start:520.248,end:530.484,es:"Los niños no me hacen caso.",group:"hacer caso",group_index:6,level:"A2"},{i:49,start:530.484,end:541.903,es:"Nunca haces caso a tus padres.",group:"hacer caso",group_index:6,level:"A2"},{i:50,start:541.903,end:552.424,es:"Debí hacerle caso al médico.",group:"hacer caso",group_index:6,level:"B1"},{i:51,start:552.424,end:565.346,es:"Te lo dije, pero no me hiciste caso.",group:"hacer caso",group_index:6,level:"B1"},{i:52,start:565.346,end:578.083,es:"No le hagas caso, está de mal humor.",group:"hacer caso",group_index:6,level:"B1"},{i:53,start:578.083,end:589.496,es:"Quiero que me hagas caso esta vez.",group:"hacer caso",group_index:6,level:"B1"},{i:54,start:590.996,end:599.814,es:"Se está haciendo tarde.",group:"hacerse",group_index:7,level:"B1"},{i:55,start:599.814,end:609.886,es:"Mi hermana se hizo médica.",group:"hacerse",group_index:7,level:"B1"},{i:56,start:609.886,end:620.813,es:"Nos hicimos amigos en el colegio.",group:"hacerse",group_index:7,level:"B1"},{i:57,start:620.813,end:633.188,es:"Con los años, se hizo más paciente.",group:"hacerse",group_index:7,level:"B1"},{i:58,start:633.188,end:644.236,es:"Quiere hacerse rico muy rápido.",group:"hacerse",group_index:7,level:"B1"},{i:59,start:644.236,end:656.955,es:"Se hace de noche muy temprano en invierno.",group:"hacerse",group_index:7,level:"B1"},{i:60,start:656.955,end:668.325,es:"Ojalá nos hagamos buenos amigos.",group:"hacerse",group_index:7,level:"B1"}],go={word:so,slug:no,kind:lo,hash:io,duration:to,voice:uo,marks:po},co="igual",vo="igual",mo="word",xo="5ba9b7fd1aab2290",_o=736.632,Ao="mx-lento",ho=[{i:0,start:.5,end:12.35,es:"Mi camisa es igual a la tuya.",group:"igual e iguales",group_index:0,level:"A1"},{i:1,start:12.35,end:22.131,es:"Las dos casas son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:2,start:22.131,end:31.959,es:"Tu bolso es igual al mío.",group:"igual e iguales",group_index:0,level:"A1"},{i:3,start:31.959,end:42.712,es:"Los gemelos son casi iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:4,start:42.712,end:53.319,es:"Estos zapatos no son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:5,start:53.319,end:63.304,es:"Todos los días son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:6,start:63.304,end:76.329,es:"Mi teléfono es igual al de mi hermano.",group:"igual e iguales",group_index:0,level:"A1"},{i:7,start:76.329,end:85.96,es:"Las dos tazas son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:8,start:87.46,end:97.149,es:"Hablas igual que tu madre.",group:"igual que",group_index:1,level:"A1"},{i:9,start:97.149,end:108.511,es:"Ella canta igual que su abuela.",group:"igual que",group_index:1,level:"A1"},{i:10,start:108.511,end:118.327,es:"Mi hijo come igual que yo.",group:"igual que",group_index:1,level:"A1"},{i:11,start:118.327,end:130.12,es:"Hoy hace frío, igual que ayer.",group:"igual que",group_index:1,level:"A1"},{i:12,start:130.12,end:138.28,es:"Pienso igual que tú.",group:"igual que",group_index:1,level:"A1"},{i:13,start:138.28,end:149.002,es:"Él trabaja igual que siempre.",group:"igual que",group_index:1,level:"A1"},{i:14,start:149.002,end:160.945,es:"La casa está igual que hace diez años.",group:"igual que",group_index:1,level:"A2"},{i:15,start:160.945,end:172.964,es:"Lo hice igual que la última vez.",group:"igual que",group_index:1,level:"A2"},{i:16,start:174.464,end:185.903,es:"Las dos películas son igual de largas.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:17,start:185.903,end:197.495,es:"Mi hermano es igual de alto que yo.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:18,start:197.495,end:209.671,es:"Este restaurante es igual de caro que el otro.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:19,start:209.671,end:222.086,es:"Los dos exámenes fueron igual de difíciles.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:20,start:222.086,end:236.973,es:"Ella es igual de simpática que su hermana.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:21,start:236.973,end:251.238,es:"El tren y el autobús son igual de rápidos.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:22,start:251.238,end:263.691,es:"Hoy el tráfico está igual de mal que ayer.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:23,start:263.691,end:276.197,es:"Los dos trabajos son igual de importantes.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:24,start:277.697,end:285.294,es:"Me da igual.",group:"me da igual y es igual",group_index:3,level:"A1"},{i:25,start:285.294,end:294.161,es:"Me da igual el color.",group:"me da igual y es igual",group_index:3,level:"A1"},{i:26,start:294.161,end:305.412,es:"Da igual, mañana lo hacemos.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:27,start:305.412,end:319.494,es:"A mi padre le da igual la música.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:28,start:319.494,end:330.611,es:"¿Te da igual comer en casa o fuera?",group:"me da igual y es igual",group_index:3,level:"A2"},{i:29,start:330.611,end:340.975,es:"Es igual, no pasa nada.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:30,start:340.975,end:349.918,es:"Nos da igual el lugar.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:31,start:349.918,end:360.68,es:"A ellos les da igual el precio.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:32,start:360.68,end:373.011,es:"Ese día me daba igual perder el partido.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:33,start:373.011,end:382.102,es:"A mí no me da igual.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:34,start:382.102,end:394.484,es:"Da igual si llueve, vamos a salir.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:35,start:395.984,end:407.712,es:"La madre quiere a sus hijos por igual.",group:"por igual",group_index:4,level:"A2"},{i:36,start:407.712,end:417.794,es:"Dividimos la cuenta por igual.",group:"por igual",group_index:4,level:"A2"},{i:37,start:417.794,end:430.185,es:"En casa repartimos las tareas por igual.",group:"por igual",group_index:4,level:"B1"},{i:38,start:430.185,end:440.657,es:"La ley es para todos por igual.",group:"por igual",group_index:4,level:"B1"},{i:39,start:440.657,end:453.798,es:"Las ganancias se reparten por igual entre los socios.",group:"por igual",group_index:4,level:"B1"},{i:40,start:453.798,end:465.119,es:"El calor afecta a todos por igual.",group:"por igual",group_index:4,level:"B1"},{i:41,start:466.619,end:478.327,es:"Al igual que tú, prefiero el campo.",group:"al igual que",group_index:5,level:"B1"},{i:42,start:478.327,end:490.527,es:"Al igual que su padre, es médico.",group:"al igual que",group_index:5,level:"B1"},{i:43,start:490.527,end:507.936,es:"Al igual que el año pasado, vamos a la playa en agosto.",group:"al igual que",group_index:5,level:"B1"},{i:44,start:507.936,end:524.149,es:"Ella, al igual que su hermano, habla tres idiomas.",group:"al igual que",group_index:5,level:"B1"},{i:45,start:524.149,end:539.23,es:"Al igual que muchas personas, trabajo desde casa.",group:"al igual que",group_index:5,level:"B1"},{i:46,start:539.23,end:552.139,es:"Al igual que ayer, el tren llegó tarde.",group:"al igual que",group_index:5,level:"B1"},{i:47,start:552.139,end:568.312,es:"Al igual que en otros países, aquí la comida es cara.",group:"al igual que",group_index:5,level:"B1"},{i:48,start:569.812,end:578.3,es:"Igual llueve mañana.",group:"igual: quizás",group_index:6,level:"B1"},{i:49,start:578.3,end:589.098,es:"Igual vamos al cine esta noche.",group:"igual: quizás",group_index:6,level:"B1"},{i:50,start:589.098,end:598.459,es:"Igual no viene a la fiesta.",group:"igual: quizás",group_index:6,level:"B1"},{i:51,start:598.459,end:610.006,es:"Llámalo, igual está en casa.",group:"igual: quizás",group_index:6,level:"B1"},{i:52,start:610.006,end:618.644,es:"Igual tienes razón.",group:"igual: quizás",group_index:6,level:"B1"},{i:53,start:618.644,end:629.211,es:"Igual llegamos un poco tarde.",group:"igual: quizás",group_index:6,level:"B1"},{i:54,start:629.211,end:641.025,es:"No sé, igual me quedo en casa.",group:"igual: quizás",group_index:6,level:"B1"},{i:55,start:641.025,end:654.597,es:"Pregunta en la tienda, igual lo tienen.",group:"igual: quizás",group_index:6,level:"B1"},{i:56,start:656.097,end:667.413,es:"Es un lugar de una belleza sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:57,start:667.413,end:679.541,es:"Tiene un talento sin igual para la música.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:58,start:679.541,end:689.944,es:"Esta comida no tiene igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:59,start:689.944,end:700.283,es:"Fue una experiencia sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:60,start:700.283,end:714.156,es:"Mi abuela tenía una paciencia sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:61,start:714.156,end:723.636,es:"Es un cantante sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:62,start:723.636,end:736.574,es:"La vista desde esta montaña no tiene igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"}],bo={word:co,slug:vo,kind:mo,hash:xo,duration:_o,voice:Ao,marks:ho},fo="llevar",qo="llevar",yo="word",jo="4dea240b8cba6a1d",Bo=669.336,zo="mx-lento",Mo=[{i:0,start:.5,end:12.305,es:"Llevo una mochila muy pesada.",group:"llevar, cargar",group_index:0,level:"A1"},{i:1,start:12.305,end:19.799,es:"¿Llevas dinero?",group:"llevar, cargar",group_index:0,level:"A1"},{i:2,start:19.799,end:28.47,es:"Yo llevo las bolsas.",group:"llevar, cargar",group_index:0,level:"A1"},{i:3,start:28.47,end:39.014,es:"Siempre llevo agua en el auto.",group:"llevar, cargar",group_index:0,level:"A1"},{i:4,start:39.014,end:49.65,es:"¿Puedes llevar la sopa a la mesa?",group:"llevar, cargar",group_index:0,level:"A1"},{i:5,start:49.65,end:60.682,es:"Mi padre lleva la maleta grande.",group:"llevar, cargar",group_index:0,level:"A1"},{i:6,start:60.682,end:71.215,es:"Llevé el pastel a la fiesta.",group:"llevar, cargar",group_index:0,level:"A2"},{i:7,start:71.215,end:82.776,es:"No llevaba el pasaporte encima.",group:"llevar, cargar",group_index:0,level:"A2"},{i:8,start:84.276,end:93.749,es:"Hoy llevo un vestido rojo.",group:"llevar ropa",group_index:1,level:"A1"},{i:9,start:93.749,end:107.581,es:"Mi abuelo lleva una corbata azul.",group:"llevar ropa",group_index:1,level:"A1"},{i:10,start:107.581,end:117.677,es:"¿Qué vas a llevar a la boda?",group:"llevar ropa",group_index:1,level:"A1"},{i:11,start:117.677,end:129.665,es:"Ella siempre lleva sombrero.",group:"llevar ropa",group_index:1,level:"A1"},{i:12,start:129.665,end:141.779,es:"Llevas una camisa muy bonita.",group:"llevar ropa",group_index:1,level:"A1"},{i:13,start:141.779,end:152.154,es:"El niño lleva zapatos nuevos.",group:"llevar ropa",group_index:1,level:"A1"},{i:14,start:152.154,end:162.466,es:"En verano llevo ropa ligera.",group:"llevar ropa",group_index:1,level:"A1"},{i:15,start:162.466,end:174.496,es:"Ayer llevaba una chaqueta negra.",group:"llevar ropa",group_index:1,level:"A2"},{i:16,start:175.996,end:184.047,es:"Te llevo a casa.",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:17,start:184.047,end:194.877,es:"Llevo a mis hijos a la escuela.",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:18,start:194.877,end:203.824,es:"¿Me llevas al aeropuerto?",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:19,start:203.824,end:214.524,es:"Este autobús te lleva al centro.",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:20,start:214.524,end:224.315,es:"Mi madre me llevó al médico.",group:"llevar a alguien a un lugar",group_index:2,level:"A2"},{i:21,start:224.315,end:236.812,es:"Te voy a llevar a un restaurante muy bueno.",group:"llevar a alguien a un lugar",group_index:2,level:"A2"},{i:22,start:236.812,end:252.103,es:"Llevamos al perro al parque todas las mañanas.",group:"llevar a alguien a un lugar",group_index:2,level:"A2"},{i:23,start:253.603,end:262.779,es:"Llevo dos años aquí.",group:"llevar tiempo",group_index:3,level:"A2"},{i:24,start:262.779,end:273.614,es:"¿Cuánto tiempo llevas en esta ciudad?",group:"llevar tiempo",group_index:3,level:"A2"},{i:25,start:273.614,end:284.414,es:"Llevamos una hora en la fila.",group:"llevar tiempo",group_index:3,level:"A2"},{i:26,start:284.414,end:297.188,es:"Mis padres llevan treinta años casados.",group:"llevar tiempo",group_index:3,level:"A2"},{i:27,start:297.188,end:308.603,es:"Ella lleva tres meses en la empresa.",group:"llevar tiempo",group_index:3,level:"A2"},{i:28,start:308.603,end:320.15,es:"Este trabajo lleva mucho tiempo.",group:"llevar tiempo",group_index:3,level:"A2"},{i:29,start:320.15,end:332.214,es:"Preparar la cena me llevó toda la tarde.",group:"llevar tiempo",group_index:3,level:"A2"},{i:30,start:333.714,end:343.414,es:"Llevo una hora esperando.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:31,start:343.414,end:356.341,es:"Llevamos todo el día caminando.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:32,start:356.341,end:368.534,es:"¿Cuánto tiempo llevas estudiando español?",group:"llevar + gerundio",group_index:4,level:"A2"},{i:33,start:368.534,end:379.597,es:"Lleva tres días lloviendo sin parar.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:34,start:379.597,end:389.969,es:"Llevo meses buscando trabajo.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:35,start:389.969,end:404.728,es:"Mi vecino lleva toda la mañana haciendo ruido.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:36,start:404.728,end:419.956,es:"Cuando lo conocí, llevaba dos años viviendo solo.",group:"llevar + gerundio",group_index:4,level:"B1"},{i:37,start:421.456,end:432.634,es:"Me llevo muy bien con mi hermana.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:38,start:432.634,end:441.893,es:"Mis padres se llevan bien.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:39,start:441.893,end:452.056,es:"No me llevo bien con mi jefe.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:40,start:452.056,end:464.131,es:"Los dos gatos no se llevan nada bien.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:41,start:464.131,end:474.775,es:"¿Te llevas bien con tus compañeros?",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:42,start:474.775,end:485.907,es:"De niños nos llevábamos muy mal.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:43,start:485.907,end:496.71,es:"Espero que te lleves bien con ellos.",group:"llevarse bien o mal",group_index:5,level:"B1"},{i:44,start:498.21,end:506.424,es:"¿Me lo llevo o lo dejo?",group:"llevarse algo",group_index:6,level:"A2"},{i:45,start:506.424,end:518.624,es:"Me llevo esta camisa, por favor.",group:"llevarse algo",group_index:6,level:"A2"},{i:46,start:518.624,end:527.963,es:"Alguien se llevó mi paraguas.",group:"llevarse algo",group_index:6,level:"A2"},{i:47,start:527.963,end:538.937,es:"Me llevé una sorpresa enorme.",group:"llevarse algo",group_index:6,level:"B1"},{i:48,start:538.937,end:548.557,es:"El viento se llevó las hojas.",group:"llevarse algo",group_index:6,level:"B1"},{i:49,start:548.557,end:560.773,es:"Nos llevamos un buen susto con la tormenta.",group:"llevarse algo",group_index:6,level:"B1"},{i:50,start:560.773,end:573.722,es:"No te lleves mi cargador, que lo necesito.",group:"llevarse algo",group_index:6,level:"B1"},{i:51,start:573.722,end:585.544,es:"El ladrón se llevó todas las joyas.",group:"llevarse algo",group_index:6,level:"B1"},{i:52,start:587.044,end:599.29,es:"Mi hermano siempre me lleva la contraria.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:53,start:599.29,end:609.668,es:"Ella lleva la cuenta de los gastos.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:54,start:609.668,end:623.813,es:"Mi abuela lleva una vida muy tranquila.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:55,start:623.813,end:636.099,es:"Este camino no lleva a ninguna parte.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:56,start:636.099,end:647.03,es:"No te dejes llevar por los nervios.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:57,start:647.03,end:655.953,es:"Yo te llevo tres años.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:58,start:655.953,end:669.288,es:"Ellos llevan la empresa juntos desde hace años.",group:"expresiones con llevar",group_index:7,level:"B1"}],Eo={word:fo,slug:qo,kind:yo,hash:jo,duration:Bo,voice:zo,marks:Mo},ko="lo",$o="lo",wo="word",No="11dbc02c99e1b802",So=648.984,Lo="mx-lento",To=[{i:0,start:.5,end:15.002,es:"¿Conoces a Pedro? Sí, lo conozco del trabajo.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:1,start:15.002,end:26.263,es:"¿El café? Lo tomo sin azúcar.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:2,start:26.263,end:39.876,es:"Mi hermano está en casa, lo llamo ahora.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:3,start:39.876,end:52.731,es:"Este vestido es bonito, lo compro.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:4,start:52.731,end:65.786,es:"No encuentro mi teléfono, ¿lo tienes tú?",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:5,start:65.786,end:79.421,es:"El pan está aquí, lo pongo en la mesa.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:6,start:79.421,end:94.302,es:"Mi abuelo vive lejos, pero lo visito los domingos.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:7,start:94.302,end:106.739,es:"El auto está sucio, lo lavo mañana.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:8,start:106.739,end:117.588,es:"¿Dónde está el perro? No lo veo.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:9,start:119.088,end:125.676,es:"No lo sé.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:10,start:125.676,end:132.427,es:"Ya lo sé.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:11,start:132.427,end:142.067,es:"Lo sé, tienes razón.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:12,start:142.067,end:154.745,es:"¿Sabes dónde vive Ana? No, no lo sé.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:13,start:154.745,end:161.485,es:"No lo creo.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:14,start:161.485,end:169.111,es:"Lo siento mucho.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:15,start:169.111,end:175.931,es:"¿Lo entiendes?",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:16,start:175.931,end:182.778,es:"Te lo prometo.",group:"lo sé, no lo sé",group_index:1,level:"A2"},{i:17,start:184.278,end:194.088,es:"Voy a comprarlo mañana.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:18,start:194.088,end:203.668,es:"¿Puedes repetirlo, por favor?",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:19,start:203.668,end:212.333,es:"Quiero verlo otra vez.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:20,start:212.333,end:221.516,es:"Tómalo, es para ti.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:21,start:221.516,end:232.453,es:"Pruébalo, está muy rico.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:22,start:232.453,end:240.476,es:"Estoy pensándolo.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:23,start:240.476,end:252.119,es:"Tengo que terminarlo antes del viernes.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:24,start:252.119,end:260.333,es:"Ábrelo con cuidado.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:25,start:260.333,end:270.177,es:"Necesito leerlo dos veces.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:26,start:271.677,end:280.983,es:"Lo que necesito es dormir.",group:"lo que",group_index:3,level:"A2"},{i:27,start:280.983,end:289.673,es:"No entiendo lo que dices.",group:"lo que",group_index:3,level:"A2"},{i:28,start:289.673,end:300.011,es:"Esto es lo que compré ayer.",group:"lo que",group_index:3,level:"A2"},{i:29,start:300.011,end:312.518,es:"Lo que más me gusta es la playa.",group:"lo que",group_index:3,level:"A2"},{i:30,start:312.518,end:320.3,es:"Dime lo que pasó.",group:"lo que",group_index:3,level:"A2"},{i:31,start:320.3,end:330.881,es:"Lo que pasa es que estoy cansado.",group:"lo que",group_index:3,level:"A2"},{i:32,start:330.881,end:340.802,es:"Gracias por todo lo que hiciste.",group:"lo que",group_index:3,level:"A2"},{i:33,start:340.802,end:350.401,es:"No sé lo que voy a hacer.",group:"lo que",group_index:3,level:"A2"},{i:34,start:350.401,end:360.954,es:"Todo lo que dijo era verdad.",group:"lo que",group_index:3,level:"A2"},{i:35,start:360.954,end:368.838,es:"Haz lo que quieras.",group:"lo que",group_index:3,level:"B1"},{i:36,start:370.338,end:378.375,es:"Yo quiero lo mismo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A1"},{i:37,start:378.375,end:387.572,es:"A lo mejor llueve mañana.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:38,start:387.572,end:396.913,es:"A lo mejor tienes razón.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:39,start:396.913,end:405.877,es:"Siempre dice lo mismo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:40,start:405.877,end:413.234,es:"Me da lo mismo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:41,start:413.234,end:422.395,es:"Por lo menos come algo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:42,start:422.395,end:436.379,es:"Llegamos tarde, pero por lo menos llegamos.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:43,start:436.379,end:447.06,es:"Necesito por lo menos dos horas.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:44,start:447.06,end:459.454,es:"Por lo general, desayuno en casa.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:45,start:460.954,end:469.665,es:"Lo bueno es que hace sol.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:46,start:469.665,end:478.077,es:"Lo malo es el precio.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:47,start:478.077,end:490.361,es:"Lo importante es estar juntos.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:48,start:490.361,end:501.004,es:"Lo mejor del viaje fue la comida.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:49,start:501.004,end:509.23,es:"Lo peor ya pasó.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:50,start:509.23,end:518.114,es:"Lo difícil es empezar.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:51,start:518.114,end:530.328,es:"Lo más importante es la salud.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:52,start:530.328,end:540.084,es:"Lo raro es que nadie contestó.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:53,start:540.084,end:551.347,es:"Lo bueno de esta ciudad es el clima.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:54,start:552.847,end:565.715,es:"No sabes lo rápido que corre mi hija.",group:"lo rápido que",group_index:6,level:"B1"},{i:55,start:565.715,end:577.118,es:"Me sorprende lo bien que hablas español.",group:"lo rápido que",group_index:6,level:"B1"},{i:56,start:577.118,end:587.384,es:"Mira lo grande que está tu hijo.",group:"lo rápido que",group_index:6,level:"B1"},{i:57,start:587.384,end:598.838,es:"No te imaginas lo cansada que estoy.",group:"lo rápido que",group_index:6,level:"B1"},{i:58,start:598.838,end:611.94,es:"Ya ves lo difícil que es encontrar trabajo.",group:"lo rápido que",group_index:6,level:"B1"},{i:59,start:611.94,end:622.872,es:"Es increíble lo caro que está todo.",group:"lo rápido que",group_index:6,level:"B1"},{i:60,start:622.872,end:636.013,es:"Me encanta lo tranquilo que es este barrio.",group:"lo rápido que",group_index:6,level:"B1"},{i:61,start:636.013,end:648.928,es:"Todavía recuerdo lo feliz que estaba ese día.",group:"lo rápido que",group_index:6,level:"B1"}],Po={word:ko,slug:$o,kind:wo,hash:No,duration:So,voice:Lo,marks:To},Co="mismo",Ho="mismo",Qo="word",Do="1af8f01d7326c9a3",Yo=621.936,Vo="mx-lento",Oo=[{i:0,start:.5,end:9.438,es:"Tenemos el mismo libro.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:1,start:9.438,end:19.19,es:"Vivimos en la misma calle.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:2,start:19.19,end:30.833,es:"Siempre como en el mismo restaurante.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:3,start:30.833,end:45.095,es:"Mi hermano y yo tenemos los mismos ojos.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:4,start:45.095,end:56.548,es:"Ellas trabajan en la misma oficina.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:5,start:56.548,end:67.657,es:"Es la misma canción de ayer.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:6,start:67.657,end:79.708,es:"Llevas la misma camisa que yo.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:7,start:79.708,end:89.424,es:"Nacimos el mismo año.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:8,start:90.924,end:99.996,es:"Para mí, lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:9,start:99.996,end:109.404,es:"Siempre dices lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:10,start:109.404,end:119.996,es:"Yo quiero lo mismo, por favor.",group:"lo mismo",group_index:1,level:"A1"},{i:11,start:119.996,end:130.399,es:"Todos los días hago lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:12,start:130.399,end:138.102,es:"No es lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:13,start:138.102,end:146.853,es:"Pienso lo mismo que tú.",group:"lo mismo",group_index:
