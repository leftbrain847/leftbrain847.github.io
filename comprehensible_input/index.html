oup:"tener, poseer",group_index:0,level:"A1"},{i:4,start:37.376,end:48.741,es:"Esta casa tiene tres habitaciones.",group:"tener, poseer",group_index:0,level:"A1"},{i:5,start:48.741,end:58.763,es:"¿Tiene usted una mesa para dos?",group:"tener, poseer",group_index:0,level:"A1"},{i:6,start:58.763,end:69.513,es:"Ellos tienen una tienda en el centro.",group:"tener, poseer",group_index:0,level:"A1"},{i:7,start:69.513,end:78.186,es:"Hoy no tengo tiempo.",group:"tener, poseer",group_index:0,level:"A1"},{i:8,start:78.186,end:89.103,es:"Mi hermana tiene el pelo largo.",group:"tener, poseer",group_index:0,level:"A1"},{i:9,start:90.603,end:101.522,es:"Aquí tienes las llaves.",group:"aquí tienes",group_index:1,level:"A1"},{i:10,start:101.522,end:113.332,es:"Aquí tiene su café, señora.",group:"aquí tienes",group_index:1,level:"A1"},{i:11,start:113.332,end:121.555,es:"Aquí tienen el menú.",group:"aquí tienes",group_index:1,level:"A1"},{i:12,start:121.555,end:130.729,es:"Aquí tienes tu cambio.",group:"aquí tienes",group_index:1,level:"A1"},{i:13,start:132.229,end:140.972,es:"Tengo treinta años.",group:"tener años",group_index:2,level:"A1"},{i:14,start:140.972,end:149.481,es:"¿Cuántos años tienes?",group:"tener años",group_index:2,level:"A1"},{i:15,start:149.481,end:160.156,es:"Mi hijo tiene cinco años.",group:"tener años",group_index:2,level:"A1"},{i:16,start:160.156,end:171.019,es:"Mi abuelo tiene noventa años.",group:"tener años",group_index:2,level:"A1"},{i:17,start:171.019,end:181.337,es:"El perro ya tiene diez años.",group:"tener años",group_index:2,level:"A1"},{i:18,start:181.337,end:195.96,es:"Cuando tenía veinte años, vivía en Lima.",group:"tener años",group_index:2,level:"A2"},{i:19,start:197.46,end:206.607,es:"Tengo mucha hambre.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:20,start:206.607,end:213.393,es:"¿Tienes sed?",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:21,start:213.393,end:222.413,es:"Los niños tienen frío.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:22,start:222.413,end:233.008,es:"En verano siempre tengo calor.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:23,start:233.008,end:244.249,es:"Tengo sueño, me voy a dormir.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:24,start:244.249,end:254.902,es:"Mi hija tiene miedo de los perros.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:25,start:254.902,end:264.164,es:"Lo siento, tengo prisa.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:26,start:264.164,end:273.434,es:"¿No tienen hambre todavía?",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:27,start:273.434,end:283.178,es:"Anoche tuve mucho miedo.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A2"},{i:28,start:284.678,end:294.702,es:"Tengo que trabajar mañana.",group:"tener que",group_index:4,level:"A1"},{i:29,start:294.702,end:303.081,es:"Tienes que descansar.",group:"tener que",group_index:4,level:"A1"},{i:30,start:303.081,end:312.192,es:"Tenemos que comprar pan.",group:"tener que",group_index:4,level:"A1"},{i:31,start:312.192,end:321.53,es:"¿A qué hora tienes que salir?",group:"tener que",group_index:4,level:"A1"},{i:32,start:321.53,end:331.674,es:"Los niños tienen que estudiar.",group:"tener que",group_index:4,level:"A1"},{i:33,start:331.674,end:342.045,es:"No tienes que venir si no quieres.",group:"tener que",group_index:4,level:"A1"},{i:34,start:342.045,end:352.3,es:"Ayer tuve que ir al médico.",group:"tener que",group_index:4,level:"A2"},{i:35,start:352.3,end:364.856,es:"Tuvimos que esperar dos horas en el aeropuerto.",group:"tener que",group_index:4,level:"A2"},{i:36,start:366.356,end:376.504,es:"Tengo ganas de ir a la playa.",group:"tener ganas de",group_index:5,level:"A2"},{i:37,start:376.504,end:386.673,es:"No tengo ganas de cocinar hoy.",group:"tener ganas de",group_index:5,level:"A2"},{i:38,start:386.673,end:397.462,es:"¿Tienes ganas de salir esta noche?",group:"tener ganas de",group_index:5,level:"A2"},{i:39,start:397.462,end:407.791,es:"Tengo muchas ganas de verte.",group:"tener ganas de",group_index:5,level:"A2"},{i:40,start:407.791,end:418.642,es:"Los niños tienen ganas de jugar.",group:"tener ganas de",group_index:5,level:"A2"},{i:41,start:418.642,end:429.649,es:"Hoy no tenía ganas de levantarme.",group:"tener ganas de",group_index:5,level:"A2"},{i:42,start:429.649,end:441.889,es:"Tenemos ganas de conocer tu nueva casa.",group:"tener ganas de",group_index:5,level:"A2"},{i:43,start:443.389,end:450.847,es:"Tienes razón.",group:"tener razón, tener cuidado",group_index:6,level:"A1"},{i:44,start:450.847,end:462.374,es:"Creo que mi madre tenía razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:45,start:462.374,end:471.716,es:"No siempre tienes razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:46,start:471.716,end:480.664,es:"Ten cuidado con el perro.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:47,start:480.664,end:493.678,es:"Tengan cuidado, el suelo está mojado.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:48,start:493.678,end:506.457,es:"Tienes que tener cuidado al cruzar la calle.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:49,start:506.457,end:516.783,es:"Al final, tuviste razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:50,start:518.283,end:532.183,es:"De niño tenía una bicicleta roja.",group:"tenía, tuve",group_index:7,level:"A2"},{i:51,start:532.183,end:544.9,es:"Antes no teníamos computadora en casa.",group:"tenía, tuve",group_index:7,level:"A2"},{i:52,start:544.9,end:556.464,es:"Ayer tuve una reunión muy larga.",group:"tenía, tuve",group_index:7,level:"A2"},{i:53,start:556.464,end:567.061,es:"El año pasado tuvieron un bebé.",group:"tenía, tuve",group_index:7,level:"A2"},{i:54,start:567.061,end:578.264,es:"Tuvimos un problema con el hotel.",group:"tenía, tuve",group_index:7,level:"A2"},{i:55,start:578.264,end:587.338,es:"¿Tuviste un buen viaje?",group:"tenía, tuve",group_index:7,level:"A2"},{i:56,start:587.338,end:599.57,es:"La semana pasada tuve mucho trabajo.",group:"tenía, tuve",group_index:7,level:"A2"},{i:57,start:601.07,end:610.698,es:"Eso no tiene nada que ver.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:58,start:610.698,end:622.546,es:"Su trabajo tiene que ver con la música.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:59,start:622.546,end:634.144,es:"¿Qué tiene que ver eso con nuestro problema?",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:60,start:634.144,end:644.528,es:"Espero que tengas un buen día.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:61,start:644.528,end:660.568,es:"Si tuviera más tiempo, aprendería a tocar la guitarra.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:62,start:660.568,end:670.373,es:"No creo que tengan razón.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:63,start:670.373,end:681.927,es:"Me alegra que tengas tantos amigos.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"}],js={word:_s,slug:As,kind:hs,hash:bs,duration:fs,voice:qs,marks:ys},Bs="tocar",zs="tocar",Ms="word",Es="d2caef8e7ec13b3a",ks=663.096,$s="mx-lento",ws=[{i:0,start:.5,end:11.743,es:"No toques el horno, está caliente.",group:"tocar con la mano",group_index:0,level:"A1"},{i:1,start:11.743,end:20.361,es:"¿Puedo tocar al perro?",group:"tocar con la mano",group_index:0,level:"A1"},{i:2,start:20.361,end:30.402,es:"El bebé me toca la cara.",group:"tocar con la mano",group_index:0,level:"A1"},{i:3,start:30.402,end:40.992,es:"Por favor, no toquen los cuadros.",group:"tocar con la mano",group_index:0,level:"A1"},{i:4,start:40.992,end:50.38,es:"Me gusta tocar la arena.",group:"tocar con la mano",group_index:0,level:"A1"},{i:5,start:50.38,end:63.787,es:"Toca el agua, está muy fría.",group:"tocar con la mano",group_index:0,level:"A1"},{i:6,start:63.787,end:77.354,es:"No te toques los ojos con las manos sucias.",group:"tocar con la mano",group_index:0,level:"A2"},{i:7,start:77.354,end:88.92,es:"Alguien me tocó el hombro en el autobús.",group:"tocar con la mano",group_index:0,level:"A2"},{i:8,start:88.92,end:100.448,es:"Nunca había tocado la nieve.",group:"tocar con la mano",group_index:0,level:"B1"},{i:9,start:101.948,end:113.019,es:"Mi hermana toca el piano.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:10,start:113.019,end:121.133,es:"¿Tocas la guitarra?",group:"tocar un instrumento",group_index:1,level:"A1"},{i:11,start:121.133,end:131.182,es:"Él toca muy bien el violín.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:12,start:131.182,end:142.945,es:"Quiero aprender a tocar la batería.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:13,start:142.945,end:152.779,es:"La banda toca los sábados.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:14,start:152.779,end:162.764,es:"Toca algo para nosotros.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:15,start:162.764,end:176.469,es:"De niño, tocaba la flauta en la escuela.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:16,start:176.469,end:187.989,es:"Anoche tocaron mi canción favorita.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:17,start:187.989,end:199.857,es:"Hace diez años que toco el saxofón.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:18,start:201.357,end:210.118,es:"Alguien toca la puerta.",group:"tocar la puerta, el timbre",group_index:2,level:"A1"},{i:19,start:210.118,end:220.734,es:"Toca el timbre, por favor.",group:"tocar la puerta, el timbre",group_index:2,level:"A1"},{i:20,start:220.734,end:232.388,es:"Toqué la puerta, pero nadie abrió.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:21,start:232.388,end:243.646,es:"El cartero tocó el timbre dos veces.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:22,start:243.646,end:258.798,es:"Toca el timbre otra vez, creo que no te oyeron.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:23,start:258.798,end:271.253,es:"Antes de entrar, hay que tocar la puerta.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:24,start:271.253,end:285.72,es:"Los niños tocaron el timbre y salieron corriendo.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:25,start:287.22,end:295.478,es:"Ahora te toca a ti.",group:"te toca, el turno",group_index:3,level:"A1"},{i:26,start:295.478,end:303.052,es:"¿A quién le toca?",group:"te toca, el turno",group_index:3,level:"A1"},{i:27,start:303.052,end:314.645,es:"Me toca lavar los platos hoy.",group:"te toca, el turno",group_index:3,level:"A2"},{i:28,start:314.645,end:327.776,es:"Mañana le toca cocinar a mi hermano.",group:"te toca, el turno",group_index:3,level:"A2"},{i:29,start:327.776,end:337.862,es:"Te toca elegir la película.",group:"te toca, el turno",group_index:3,level:"A2"},{i:30,start:337.862,end:346.232,es:"¿Cuándo me toca hablar?",group:"te toca, el turno",group_index:3,level:"A2"},{i:31,start:346.232,end:356.804,es:"Ayer le tocó sacar al perro.",group:"te toca, el turno",group_index:3,level:"A2"},{i:32,start:356.804,end:367.616,es:"Nos toca esperar una hora más.",group:"te toca, el turno",group_index:3,level:"A2"},{i:33,start:367.616,end:383.789,es:"La última vez pagué yo, así que hoy te toca a ti.",group:"te toca, el turno",group_index:3,level:"A2"},{i:34,start:383.789,end:395.916,es:"Al abuelo le toca ir al médico el lunes.",group:"te toca, el turno",group_index:3,level:"A2"},{i:35,start:397.416,end:405.577,es:"Me tocó la lotería.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:36,start:405.577,end:415.856,es:"Le tocó un viaje a la playa.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:37,start:415.856,end:426.912,es:"Nunca me toca nada en las rifas.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:38,start:426.912,end:439.848,es:"En el examen me tocó la pregunta más difícil.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:39,start:439.848,end:450.104,es:"Nos tocó un hotel muy bonito.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:40,start:450.104,end:458.794,es:"¿Qué te tocó en el sorteo?",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:41,start:458.794,end:470.339,es:"Me tocó un asiento al lado de la ventana.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:42,start:470.339,end:485.659,es:"A mi amiga le tocó trabajar el domingo.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:43,start:485.659,end:498.817,es:"Ojalá te toque un buen profesor este año.",group:"me tocó, el premio y la suerte",group_index:4,level:"B1"},{i:44,start:500.317,end:511.166,es:"No quiero tocar ese tema ahora.",group:"tocar un tema",group_index:5,level:"B1"},{i:45,start:511.166,end:524.605,es:"En la reunión tocamos varios temas importantes.",group:"tocar un tema",group_index:5,level:"B1"},{i:46,start:524.605,end:538.764,es:"Es mejor no tocar el tema de la política en la cena.",group:"tocar un tema",group_index:5,level:"B1"},{i:47,start:538.764,end:550.374,es:"El libro toca temas muy difíciles.",group:"tocar un tema",group_index:5,level:"B1"},{i:48,start:550.374,end:562.387,es:"¿Por qué siempre tocas temas tan tristes?",group:"tocar un tema",group_index:5,level:"B1"},{i:49,start:562.387,end:576.577,es:"Prefiero que no toques ese asunto delante de mis padres.",group:"tocar un tema",group_index:5,level:"B1"},{i:50,start:576.577,end:589.042,es:"El profesor solo tocó el tema por encima.",group:"tocar un tema",group_index:5,level:"B1"},{i:51,start:589.042,end:602.888,es:"Si tocas ese tema, se va a molestar.",group:"tocar un tema",group_index:5,level:"B1"},{i:52,start:604.388,end:617.013,es:"Nunca he estado enfermo, toco madera.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:53,start:617.013,end:627.256,es:"La película me tocó el corazón.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:54,start:627.256,end:641.124,es:"Después de tocar fondo, empezó a mejorar.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:55,start:641.124,end:652.419,es:"Sus palabras me tocaron mucho.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:56,start:652.419,end:663.037,es:"Ese problema me toca de cerca.",group:"expresiones con tocar",group_index:6,level:"B1"}],Ns={word:Bs,slug:zs,kind:Ms,hash:Es,duration:ks,voice:$s,marks:ws},Ss="verbos reflexivos",Ls="verbos_reflexivos",Ts="concept",Ps="706f99dfa308aa79",Cs=726,Hs="mx-lento",Qs=[{i:0,start:.5,end:9.533,es:"Me despierto a las siete.",group:"la rutina diaria",group_index:0,level:"A1"},{i:1,start:9.533,end:21.163,es:"Me levanto temprano todos los días.",group:"la rutina diaria",group_index:0,level:"A1"},{i:2,start:21.163,end:31.698,es:"Mi hermano se ducha por la noche.",group:"la rutina diaria",group_index:0,level:"A1"},{i:3,start:31.698,end:42.655,es:"Nos vestimos rápido por la mañana.",group:"la rutina diaria",group_index:0,level:"A1"},{i:4,start:42.655,end:53.149,es:"Los niños se acuestan a las nueve.",group:"la rutina diaria",group_index:0,level:"A1"},{i:5,start:53.149,end:61.815,es:"¿A qué hora te levantas?",group:"la rutina diaria",group_index:0,level:"A1"},{i:6,start:61.815,end:73.142,es:"Mi padre se afeita cada mañana.",group:"la rutina diaria",group_index:0,level:"A1"},{i:7,start:73.142,end:82.812,es:"Me peino antes de salir.",group:"la rutina diaria",group_index:0,level:"A1"},{i:8,start:82.812,end:94.373,es:"¿Te duchas por la mañana o por la noche?",group:"la rutina diaria",group_index:0,level:"A1"},{i:9,start:95.873,end:107.096,es:"Me lavo las manos antes de comer.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:10,start:107.096,end:119.956,es:"Ella se lava el pelo cada día.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:11,start:119.956,end:132.051,es:"Me cepillo los dientes después del desayuno.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:12,start:132.051,end:141.498,es:"El niño se lava la cara.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:13,start:141.498,end:151.607,es:"Mi madre se pinta las uñas.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:14,start:151.607,end:162.086,es:"Se pone los zapatos en la puerta.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:15,start:162.086,end:172.073,es:"Me quito el abrigo al entrar.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:16,start:172.073,end:182.428,es:"Me corto el pelo una vez al mes.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A2"},{i:17,start:183.928,end:196.139,es:"Me enojo cuando hay mucho tráfico.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:18,start:196.139,end:206.606,es:"Mi madre se preocupa por todo.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:19,start:206.606,end:216.735,es:"Nos alegramos mucho de verte.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:20,start:216.735,end:227.185,es:"Los niños se aburren en el auto.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:21,start:227.185,end:239.377,es:"Me pongo nervioso antes de un examen.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:22,start:239.377,end:251.655,es:"Ella se cansa mucho en el trabajo.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:23,start:251.655,end:260.873,es:"¿Por qué te enojas tanto?",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:24,start:260.873,end:270.43,es:"Hoy me siento mucho mejor.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:25,start:270.43,end:280.431,es:"Él se pone triste cuando llueve.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:26,start:281.931,end:293.12,es:"Levántate, ya es tarde.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:27,start:293.12,end:301.91,es:"Voy a ducharme ahora.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:28,start:301.91,end:311.717,es:"Siéntate aquí, por favor.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:29,start:311.717,end:323.009,es:"No te preocupes, todo está bien.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:30,start:323.009,end:333.824,es:"Tengo que acostarme temprano hoy.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:31,start:333.824,end:346.979,es:"Lávate las manos, la cena está lista.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:32,start:346.979,end:359.096,es:"Ponte el abrigo, hace frío.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:33,start:359.096,end:370.271,es:"Necesito relajarme un poco.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:34,start:370.271,end:381.554,es:"Cálmate, no pasa nada.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:35,start:381.554,end:392.358,es:"Acuérdate de llamarme cuando llegues.",group:"en mandatos e infinitivos",group_index:3,level:"B1"},{i:36,start:393.858,end:404.008,es:"Ayer me levanté muy tarde.",group:"en pasado",group_index:4,level:"A2"},{i:37,start:404.008,end:415.828,es:"Esta mañana me duché con agua fría.",group:"en pasado",group_index:4,level:"A2"},{i:38,start:415.828,end:428.98,es:"Cuando era niño, me acostaba a las ocho.",group:"en pasado",group_index:4,level:"A2"},{i:39,start:428.98,end:440.41,es:"Mi hermana se casó el año pasado.",group:"en pasado",group_index:4,level:"A2"},{i:40,start:440.41,end:449.794,es:"¿A qué hora te despertaste hoy?",group:"en pasado",group_index:4,level:"A2"},{i:41,start:449.794,end:462.066,es:"Los niños se divirtieron mucho en el parque.",group:"en pasado",group_index:4,level:"A2"},{i:42,start:462.066,end:471.335,es:"Me caí en la escalera.",group:"en pasado",group_index:4,level:"A2"},{i:43,start:471.335,end:486.465,es:"Antes nos levantábamos a las seis para ir al trabajo.",group:"en pasado",group_index:4,level:"A2"},{i:44,start:486.465,end:499.021,es:"Ya me había vestido cuando llegó el taxi.",group:"en pasado",group_index:4,level:"B1"},{i:45,start:500.521,end:511.754,es:"Nos conocimos en un viaje a México.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:46,start:511.754,end:521.2,es:"Mis padres se quieren mucho.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:47,start:521.2,end:535.845,es:"Mi hermano y yo nos llamamos cada semana.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:48,start:535.845,end:548.058,es:"Los dos amigos se abrazaron en el aeropuerto.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:49,start:548.058,end:561.061,es:"Ellos se escriben mensajes todos los días.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:50,start:561.061,end:575.242,es:"Ana y Luis se ayudan con las tareas de la casa.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:51,start:575.242,end:586.594,es:"Los vecinos se saludan en la escalera.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:52,start:586.594,end:598.516,es:"Es importante que nos escuchemos más.",group:"acciones recíprocas",group_index:5,level:"B1"},{i:53,start:598.516,end:610.395,es:"Ojalá se entiendan mejor con el tiempo.",group:"acciones recíprocas",group_index:5,level:"B1"},{i:54,start:611.895,end:620.861,es:"¿Cómo se llama tu perro?",group:"cambios de significado",group_index:6,level:"A1"},{i:55,start:620.861,end:631.908,es:"Ya me voy, es muy tarde.",group:"cambios de significado",group_index:6,level:"A2"},{i:56,start:631.908,end:643.906,es:"¿Por qué te fuiste tan temprano de la fiesta?",group:"cambios de significado",group_index:6,level:"A2"},{i:57,start:643.906,end:653.295,es:"El bebé se durmió en el auto.",group:"cambios de significado",group_index:6,level:"A2"},{i:58,start:653.295,end:664.001,es:"Hoy me quedo en casa porque llueve.",group:"cambios de significado",group_index:6,level:"A2"},{i:59,start:664.001,end:679.945,es:"Normalmente duermo bien, pero anoche me dormí muy tarde.",group:"cambios de significado",group_index:6,level:"B1"},{i:60,start:679.945,end:693.601,es:"Me quedé dormido y llegué tarde al trabajo.",group:"cambios de significado",group_index:6,level:"B1"},{i:61,start:693.601,end:705.15,es:"Se quedaron sin dinero al final del viaje.",group:"cambios de significado",group_index:6,level:"B1"},{i:62,start:705.15,end:716.639,es:"Me di cuenta del error demasiado tarde.",group:"cambios de significado",group_index:6,level:"B1"},{i:63,start:716.639,end:725.93,es:"No me acuerdo de su nombre.",group:"cambios de significado",group_index:6,level:"B1"}],Ds={word:Ss,slug:Ls,kind:Ts,hash:Ps,duration:Cs,voice:Hs,marks:Qs},Ys="vez",Vs="vez",Os="word",Is="6b6745e90662a46e",Fs=697.728,Rs="mx-lento",Us=[{i:0,start:.5,end:12.798,es:"Voy al gimnasio tres veces por semana.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:1,start:12.798,end:24.619,es:"Como pescado una vez a la semana.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:2,start:24.619,end:36.104,es:"Llamo a mi madre dos veces al día.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:3,start:36.104,end:46.084,es:"Lee la pregunta dos veces.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:4,start:46.084,end:56.245,es:"Solo lo digo una vez.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:5,start:56.245,end:68.126,es:"Tomo esta medicina tres veces al día.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:6,start:68.126,end:78.308,es:"Fui a París una vez.",group:"una vez, dos veces",group_index:0,level:"A2"},{i:7,start:79.808,end:89.43,es:"A veces trabajo en casa.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:8,start:89.43,end:98.615,es:"A veces llueve en verano.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:9,start:98.615,end:110.499,es:"Mi hermano a veces cocina para todos.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:10,start:110.499,end:121.964,es:"Muchas veces comemos juntos.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:11,start:121.964,end:131.959,es:"A veces no entiendo a mi jefe.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:12,start:131.959,end:143.343,es:"Muchas veces el tren llega tarde.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:13,start:143.343,end:154.271,es:"¿Vas mucho al cine? A veces.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:14,start:155.771,end:164.577,es:"¿Puedes decirlo otra vez?",group:"otra vez",group_index:2,level:"A1"},{i:15,start:164.577,end:172.552,es:"Otra vez llueve.",group:"otra vez",group_index:2,level:"A1"},{i:16,start:172.552,end:183.997,es:"Mañana vamos otra vez a la playa.",group:"otra vez",group_index:2,level:"A1"},{i:17,start:183.997,end:191.032,es:"¡Otra vez tú!",group:"otra vez",group_index:2,level:"A1"},{i:18,start:191.032,end:204.904,es:"El niño quiere ver la película otra vez.",group:"otra vez",group_index:2,level:"A1"},{i:19,start:204.904,end:216.043,es:"Mi teléfono otra vez no funciona.",group:"otra vez",group_index:2,level:"A1"},{i:20,start:216.043,end:225.773,es:"Perdí las llaves otra vez.",group:"otra vez",group_index:2,level:"A2"},{i:21,start:227.273,end:238.523,es:"Es la primera vez que vengo aquí.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A1"},{i:22,start:238.523,end:250.658,es:"La primera vez que la vi, no hablamos.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:23,start:250.658,end:262.015,es:"¿Cuándo fue la última vez que comiste?",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:24,start:262.015,end:276.81,es:"La última vez que fui, el museo estaba cerrado.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:25,start:276.81,end:289.981,es:"Esta es la última vez que te ayudo.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:26,start:289.981,end:303.576,es:"Recuerdo la primera vez que subí a un avión.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:27,start:303.576,end:316.533,es:"La próxima vez, llámame antes.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:28,start:318.033,end:328.263,es:"De vez en cuando como chocolate.",group:"de vez en cuando",group_index:4,level:"A2"},{i:29,start:328.263,end:340.027,es:"Mis primos nos visitan de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:30,start:340.027,end:351.69,es:"De vez en cuando me gusta caminar solo.",group:"de vez en cuando",group_index:4,level:"A2"},{i:31,start:351.69,end:362.444,es:"Vamos al teatro de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:32,start:362.444,end:374.837,es:"De vez en cuando escucho música clásica.",group:"de vez en cuando",group_index:4,level:"A2"},{i:33,start:374.837,end:385.988,es:"Es bueno descansar de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:34,start:387.488,end:395.312,es:"Tal vez mañana.",group:"tal vez",group_index:5,level:"A2"},{i:35,start:395.312,end:404.679,es:"Tal vez voy a la fiesta.",group:"tal vez",group_index:5,level:"A2"},{i:36,start:404.679,end:413.481,es:"Tal vez tienes razón.",group:"tal vez",group_index:5,level:"A2"},{i:37,start:413.481,end:423.123,es:"Tal vez está en la cocina.",group:"tal vez",group_index:5,level:"A2"},{i:38,start:423.123,end:433.082,es:"Tal vez llueva esta tarde.",group:"tal vez",group_index:5,level:"B1"},{i:39,start:433.082,end:444.47,es:"Tal vez Ana no sepa la dirección.",group:"tal vez",group_index:5,level:"B1"},{i:40,start:444.47,end:455.675,es:"Tal vez podamos vernos el sábado.",group:"tal vez",group_index:5,level:"B1"},{i:41,start:457.175,end:468.13,es:"Hoy tomo té en vez de café.",group:"en vez de",group_index:6,level:"A2"},{i:42,start:468.13,end:480.651,es:"Vamos a pie en vez de tomar un taxi.",group:"en vez de",group_index:6,level:"A2"},{i:43,start:480.651,end:494.12,es:"En vez de ver la televisión, lee un libro.",group:"en vez de",group_index:6,level:"A2"},{i:44,start:494.12,end:505.615,es:"Compré pollo en vez de carne.",group:"en vez de",group_index:6,level:"A2"},{i:45,start:505.615,end:518.101,es:"Ella fue a la reunión en vez de su jefe.",group:"en vez de",group_index:6,level:"A2"},{i:46,start:518.101,end:532.651,es:"Prefiero quedarme en casa en vez de salir esta noche.",group:"en vez de",group_index:6,level:"A2"},{i:47,start:532.651,end:545.578,es:"En vez de quejarte, ayúdame un poco.",group:"en vez de",group_index:6,level:"B1"},{i:48,start:547.078,end:557.881,es:"No puedo hacer dos cosas a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:49,start:557.881,end:566.752,es:"Todos hablaban a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:50,start:566.752,end:580.868,es:"Es una película triste y divertida a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:51,start:580.868,end:593.367,es:"Sentí miedo y alegría a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:52,start:593.367,end:605.712,es:"Mi hermana estudia y trabaja a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:53,start:605.712,end:617.684,es:"Los dos llegamos a la puerta a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:54,start:619.184,end:629.221,es:"Hace cada vez más calor.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:55,start:629.221,end:639.455,es:"Cada vez hay menos tiempo.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:56,start:639.455,end:650.445,es:"Mi español es cada vez mejor.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:57,start:650.445,end:663.548,es:"Cada vez más personas trabajan desde casa.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:58,start:663.548,end:675.243,es:"La ciudad está cada vez más cara.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:59,start:675.243,end:685.686,es:"Cada vez leo menos libros.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:60,start:685.686,end:697.66,es:"Tu hijo está cada vez más alto.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"}],Gs={word:Ys,slug:Vs,kind:Os,hash:Is,duration:Fs,voice:Rs,marks:Us},Ks="volver a",Xs="volver_a",Js="word",Ws="9a247a28b6537d67",Zs=678.288,en="mx-lento",an=[{i:0,start:.5,end:9.896,es:"Vuelvo a casa a las seis.",group:"volver, regresar",group_index:0,level:"A1"},{i:1,start:9.896,end:17.052,es:"¿Cuándo vuelves?",group:"volver, regresar",group_index:0,level:"A1"},{i:2,start:17.052,end:26.39,es:"Mi hermano vuelve mañana.",group:"volver, regresar",group_index:0,level:"A1"},{i:3,start:26.39,end:35.508,es:"Volvemos en una hora.",group:"volver, regresar",group_index:0,level:"A1"},{i:4,start:35.508,end:47.127,es:"Ella vuelve del trabajo muy cansada.",group:"volver, regresar",group_index:0,level:"A1"},{i:5,start:47.127,end:57.065,es:"¿A qué hora vuelven los niños?",group:"volver, regresar",group_index:0,level:"A1"},{i:6,start:57.065,end:65.448,es:"Ayer volví tarde.",group:"volver, regresar",group_index:0,level:"A2"},{i:7,start:65.448,end:76.142,es:"Mis padres volvieron de Italia.",group:"volver, regresar",group_index:0,level:"A2"},{i:8,start:77.642,end:86.361,es:"Vuelvo a leer el libro.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:9,start:86.361,end:95.482,es:"Mañana vuelvo a llamar.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:10,start:95.482,end:106.72,es:"Siempre vuelve a perder las llaves.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:11,start:106.72,end:115.706,es:"El bebé vuelve a llorar.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:12,start:115.706,end:123.584,es:"Vuelve a llover.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:13,start:123.584,end:134.166,es:"Hoy volvemos a comer pescado.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:14,start:134.166,end:144.575,es:"Mi computadora vuelve a fallar.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:15,start:144.575,end:155.459,es:"Ella vuelve a preguntar lo mismo.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:16,start:156.959,end:168.074,es:"Volví a ver esa película.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:17,start:168.074,end:176.622,es:"Ayer volvió a nevar.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:18,start:176.622,end:186.603,es:"Volvimos a visitar el museo.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:19,start:186.603,end:199.75,es:"Después de dos años, volvió a trabajar.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:20,start:199.75,end:212.421,es:"Volví a llamar, pero nadie contestó.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:21,start:212.421,end:224.041,es:"El dolor volvió a empezar por la noche.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:22,start:224.041,end:238.057,es:"Mi hermana volvió a estudiar a los cuarenta años.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:23,start:238.057,end:251.705,es:"De niño, volví a leer ese cuento muchas veces.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:24,start:253.205,end:262.944,es:"Voy a volver a intentarlo.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:25,start:262.944,end:274.327,es:"Mañana va a volver a hacer frío.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:26,start:274.327,end:284.851,es:"¿Vas a t:451.167,end:461.11,es:"Vuelve a leer la pregunta.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:43,start:461.11,end:471.721,es:"Vuelvan a sentarse, por favor.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:44,start:471.721,end:481.732,es:"Vuelve a contar el dinero.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:45,start:481.732,end:495.204,es:"Por favor, vuelva a escribir su contraseña.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:46,start:495.204,end:513.821,es:"Si no funciona, apaga la computadora y vuelve a encenderla.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:47,start:515.321,end:525.479,es:"Lo volví a ver en la fiesta.",group:"con pronombres",group_index:6,level:"B1"},{i:48,start:525.479,end:535.053,es:"Te lo vuelvo a explicar.",group:"con pronombres",group_index:6,level:"B1"},{i:49,start:535.053,end:544.213,es:"Se me volvió a olvidar.",group:"con pronombres",group_index:6,level:"B1"},{i:50,start:544.213,end:554.865,es:"Me volvió a llamar a medianoche.",group:"con pronombres",group_index:6,level:"B1"},{i:51,start:554.865,end:564.127,es:"¿Me lo puedes volver a decir?",group:"con pronombres",group_index:6,level:"B1"},{i:52,start:564.127,end:575.766,es:"Nos volvimos a encontrar en el aeropuerto.",group:"con pronombres",group_index:6,level:"B1"},{i:53,start:575.766,end:586.307,es:"Se volvió a romper la lavadora.",group:"con pronombres",group_index:6,level:"B1"},{i:54,start:586.307,end:597.513,es:"Me lo volví a poner para la boda.",group:"con pronombres",group_index:6,level:"B1"},{i:55,start:599.013,end:608.978,es:"Espero que no vuelva a pasar.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:56,start:608.978,end:619.887,es:"Ojalá volvamos a vernos pronto.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:57,start:619.887,end:633.825,es:"Si pudiera, volvería a estudiar medicina.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:58,start:633.825,end:643.593,es:"Yo no volvería a ese lugar.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:59,start:643.593,end:655.405,es:"Cuando vuelvas a venir, avísame.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:60,start:655.405,end:667.202,es:"Me alegra que hayas vuelto a cantar.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:61,start:667.202,end:678.238,es:"No creo que vuelva a llover hoy.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"}],on={word:Ks,slug:Xs,kind:Js,hash:Ws,duration:Zs,voice:en,marks:an},rn="ya / todavía",sn="ya_todavia",nn="word",ln="ed83af47973cff77",tn=708.768,un="mx-lento",dn=[{i:0,start:.5,end:8.248,es:"Ya es tarde.",group:"ya en presente",group_index:0,level:"A1"},{i:1,start:8.248,end:16.497,es:"Ya sé tu nombre.",group:"ya en presente",group_index:0,level:"A1"},{i:2,start:16.497,end:25.734,es:"Mi hermano ya trabaja.",group:"ya en presente",group_index:0,level:"A1"},{i:3,start:25.734,end:34.924,es:"¿Ya tienes las llaves?",group:"ya en presente",group_index:0,level:"A1"},{i:4,start:34.924,end:43.788,es:"El niño ya lee solo.",group:"ya en presente",group_index:0,level:"A1"},{i:5,start:43.788,end:53.078,es:"Ya estamos en casa.",group:"ya en presente",group_index:0,level:"A1"},{i:6,start:53.078,end:62.841,es:"La cena ya está lista.",group:"ya en presente",group_index:0,level:"A1"},{i:7,start:64.341,end:70.669,es:"¡Ya voy!",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:8,start:70.669,end:77.464,es:"¡Ven ya!",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:9,start:77.464,end:88.694,es:"Ya vengo, espérame aquí.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:10,start:88.694,end:98.467,es:"Hazlo ya, por favor.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:11,start:98.467,end:108.422,es:"Necesito una respuesta ya.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:12,start:108.422,end:118.871,es:"Ya bajo, un momento.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:13,start:118.871,end:131.904,es:"Si quieres llegar a tiempo, sal ya.",group:"ya voy, ahora mismo",group_index:1,level:"A2"},{i:14,start:133.404,end:144.02,es:"Todavía es temprano.",group:"todavía",group_index:2,level:"A1"},{i:15,start:144.02,end:154.611,es:"Mi abuela todavía vive sola.",group:"todavía",group_index:2,level:"A1"},{i:16,start:154.611,end:163.572,es:"¿Todavía tienes hambre?",group:"todavía",group_index:2,level:"A1"},{i:17,start:163.572,end:172.346,es:"Todavía llueve mucho.",group:"todavía",group_index:2,level:"A1"},{i:18,start:172.346,end:182.353,es:"Los niños todavía duermen.",group:"todavía",group_index:2,level:"A1"},{i:19,start:182.353,end:192.386,es:"Todavía estoy en la oficina.",group:"todavía",group_index:2,level:"A1"},{i:20,start:192.386,end:202.809,es:"¿Todavía trabajas en el hospital?",group:"todavía",group_index:2,level:"A1"},{i:21,start:204.309,end:212.338,es:"Todavía no lo sé.",group:"todavía no",group_index:3,level:"A1"},{i:22,start:212.338,end:223.375,es:"El autobús todavía no está aquí.",group:"todavía no",group_index:3,level:"A1"},{i:23,start:223.375,end:233.307,es:"Todavía no tengo trabajo.",group:"todavía no",group_index:3,level:"A1"},{i:24,start:233.307,end:244.005,es:"Mi hija todavía no habla.",group:"todavía no",group_index:3,level:"A1"},{i:25,start:244.005,end:253.799,es:"Todavía no es hora de comer.",group:"todavía no",group_index:3,level:"A1"},{i:26,start:253.799,end:264.991,es:"Todavía no conozco a tus padres.",group:"todavía no",group_index:3,level:"A1"},{i:27,start:264.991,end:273.965,es:"¿Todavía no estás listo?",group:"todavía no",group_index:3,level:"A1"},{i:28,start:275.465,end:285.131,es:"Ya no vivo en esa casa.",group:"ya no",group_index:4,level:"A2"},{i:29,start:285.131,end:293.74,es:"Ya no tengo frío.",group:"ya no",group_index:4,level:"A2"},{i:30,start:293.74,end:302.943,es:"Mi padre ya no fuma.",group:"ya no",group_index:4,level:"A2"},{i:31,start:302.943,end:312.392,es:"Ya no hay pan en la tienda.",group:"ya no",group_index:4,level:"A2"},{i:32,start:312.392,end:325.17,es:"Ya no quiero más café, gracias.",group:"ya no",group_index:4,level:"A2"},{i:33,start:325.17,end:334.794,es:"Ellos ya no son amigos.",group:"ya no",group_index:4,level:"A2"},{i:34,start:334.794,end:350.39,es:"Desde que tengo bicicleta, ya no tomo el autobús.",group:"ya no",group_index:4,level:"A2"},{i:35,start:351.89,end:362.455,es:"Ya he comido, gracias.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:36,start:362.455,end:371.841,es:"¿Ya has terminado la tarea?",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:37,start:371.841,end:382.385,es:"Ya hemos visto esa película.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:38,start:382.385,end:395.497,es:"Mis amigos ya han llegado al restaurante.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:39,start:395.497,end:406.077,es:"¿Ya has hablado con el médico?",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:40,start:406.077,end:418.304,es:"Ya ha empezado el partido.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:41,start:418.304,end:427.981,es:"Ya he leído tu mensaje.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:42,start:427.981,end:438.126,es:"¿Ya han llamado del banco?",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:43,start:439.626,end:450.671,es:"¡Ya está! Funciona otra vez.",group:"¡ya está!",group_index:6,level:"A2"},{i:44,start:450.671,end:463.059,es:"Ya está, la puerta está cerrada.",group:"¡ya está!",group_index:6,level:"A2"},{i:45,start:463.059,end:471.284,es:"¿Ya está el arroz?",group:"¡ya está!",group_index:6,level:"A2"},{i:46,start:471.284,end:480.995,es:"Un minuto más y ya está.",group:"¡ya está!",group_index:6,level:"A2"},{i:47,start:480.995,end:491.412,es:"¡Ya está! Terminé la tarea.",group:"¡ya está!",group_index:6,level:"A2"},{i:48,start:491.412,end:502.126,es:"¡Ya está! Ya podemos salir.",group:"¡ya está!",group_index:6,level:"A2"},{i:49,start:503.626,end:518.559,es:"Ya es de noche, pero todavía hace calor.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:50,start:518.559,end:535.318,es:"Ya terminé el informe, pero todavía tengo que enviarlo.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:51,start:535.318,end:549.856,es:"Mi hijo ya camina, pero todavía no habla.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:52,start:549.856,end:565.44,es:"Ya no llueve, pero las calles todavía están mojadas.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:53,start:565.44,end:581.979,es:"Ya compré los regalos, pero todavía no los he envuelto.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:54,start:581.979,end:596.811,es:"Ya sabía la noticia, pero todavía no lo creo.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:55,start:596.811,end:610.761,es:"Ya son las diez y todavía no ha llegado nadie.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:56,start:612.261,end:625.398,es:"Ya que estás aquí, ayúdame con la mesa.",group:"ya que",group_index:8,level:"B1"},{i:57,start:625.398,end:640.857,es:"Ya que hace buen tiempo, podríamos comer afuera.",group:"ya que",group_index:8,level:"B1"},{i:58,start:640.857,end:654.051,es:"No voy a salir, ya que estoy muy cansado.",group:"ya que",group_index:8,level:"B1"},{i:59,start:654.051,end:667.932,es:"Ya que vas al mercado, compra tomates.",group:"ya que",group_index:8,level:"B1"},{i:60,start:667.932,end:681.045,es:"Ya que no tienes prisa, quédate a cenar.",group:"ya que",group_index:8,level:"B1"},{i:61,start:681.045,end:694.078,es:"Ya que lo mencionas, yo también quiero ir.",group:"ya que",group_index:8,level:"B1"},{i:62,start:694.078,end:708.719,es:"Te llamo mañana, ya que hoy no tengo tiempo.",group:"ya que",group_index:8,level:"B1"}],pn={word:rn,slug:sn,kind:nn,hash:ln,duration:tn,voice:un,marks:dn},gn="acabar",cn="acabar",vn="word",mn="938fc04ea4d62e2d",xn=565.08,_n="mx",An=[{i:0,start:.5,end:8.559,es:"La clase acaba a las tres.",group:"acabar, terminar",group_index:0,level:"A1"},{i:1,start:8.559,end:16.13,es:"¿Cuándo acaba la película?",group:"acabar, terminar",group_index:0,level:"A1"},{i:2,start:16.13,end:24.567,es:"La fiesta acaba muy tarde.",group:"acabar, terminar",group_index:0,level:"A1"},{i:3,start:24.567,end:32.775,es:"Acabo el trabajo a las cinco.",group:"acabar, terminar",group_index:0,level:"A1"},{i:4,start:32.775,end:40.676,es:"El curso acaba en junio.",group:"acabar, terminar",group_index:0,level:"A1"},{i:5,start:40.676,end:49.599,es:"¿Ya acabas la tarea? Te espero.",group:"acabar, terminar",group_index:0,level:"A1"},{i:6,start:49.599,end:57.871,es:"Mi turno acaba a medianoche.",group:"acabar, terminar",group_index:0,level:"A1"},{i:7,start:59.371,end:67.319,es:"Ayer acabé el libro.",group:"acabé, acabó",group_index:1,level:"A2"},{i:8,start:67.319,end:74.535,es:"¿Ya acabaste la tarea?",group:"acabé, acabó",group_index:1,level:"A2"},{i:9,start:74.535,end:82.854,es:"La reunión acabó muy tarde.",group:"acabé, acabó",group_index:1,level:"A2"},{i:10,start:82.854,end:92.902,es:"Anoche acabamos la cena a las once.",group:"acabé, acabó",group_index:1,level:"A2"},{i:11,start:92.902,end:102.143,es:"Todavía no he acabado el informe.",group:"acabé, acabó",group_index:1,level:"A2"},{i:12,start:102.143,end:110.953,es:"El partido acabó empatado.",group:"acabé, acabó",group_index:1,level:"A2"},{i:13,start:110.953,end:118.378,es:"¿Cómo acabó la historia?",group:"acabé, acabó",group_index:1,level:"A2"},{i:14,start:118.378,end:128.868,es:"Cuando acabó el partido, salimos a caminar.",group:"acabé, acabó",group_index:1,level:"A2"},{i:15,start:130.368,end:138.002,es:"Acabo de llegar a casa.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:16,start:138.002,end:144.974,es:"Acabamos de comer.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:17,start:144.974,end:152.352,es:"El tren acaba de salir.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:18,start:152.352,end:159.777,es:"¿Acabas de despertarte?",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:19,start:159.777,end:167.62,es:"Acaba de llamar tu madre.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:20,start:167.62,end:176.856,es:"Acabo de ver a Pedro en la calle.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:21,start:176.856,end:185.814,es:"Mis vecinos acaban de tener un bebé.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:22,start:185.814,end:193.877,es:"Acabo de enviarte el correo.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:23,start:193.877,end:202.707,es:"Cuando llegué, él acababa de salir.",group:"acabar de + infinitivo",group_index:2,level:"B1"},{i:24,start:202.707,end:212.466,es:"Acababa de ducharme cuando sonó el teléfono.",group:"acabar de + infinitivo",group_index:2,level:"B1"},{i:25,start:213.966,end:220.81,es:"Se acabó la leche.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:26,start:220.81,end:228.711,es:"Se acabaron las vacaciones.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:27,start:228.711,end:235.788,es:"Se nos acabó el pan.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:28,start:235.788,end:244.653,es:"Se me acabó la batería del teléfono.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:29,start:244.653,end:251.393,es:"¿Se acabó el café?",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:30,start:251.393,end:259.63,es:"Se acabó el tiempo del examen.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:31,start:259.63,end:267.996,es:"Se están acabando las entradas.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:32,start:267.996,end:278.973,es:"Cuando se acabe el dinero, volvemos a casa.",group:"acabarse: no quedar",group_index:3,level:"B1"},{i:33,start:280.473,end:288.709,es:"Acabé comprando dos camisas.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:34,start:288.709,end:297.887,es:"Siempre acabamos hablando de trabajo.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:35,start:297.887,end:308.307,es:"Fuimos a pasear y acabamos cenando en la playa.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:36,start:308.307,end:319.865,es:"No quería ir, pero acabé bailando toda la noche.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:37,start:319.865,end:330.054,es:"Ella siempre acaba pagando la cuenta.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:38,start:330.054,end:341.2,es:"Empezó como un juego y acabó siendo su trabajo.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:39,start:341.2,end:352.189,es:"Si no descansas, acabarás durmiéndote en clase.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:40,start:352.189,end:363.155,es:"Al final, acabó riéndose de sus propios errores.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:41,start:364.655,end:372.15,es:"La historia acabó bien.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"A2"},{i:42,start:372.15,end:380.138,es:"La película acaba mal.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"A2"},{i:43,start:380.138,end:388.282,es:"La discusión acabó en pelea.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:44,start:388.282,end:396.935,es:"Esta calle acaba en el río.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:45,start:396.935,end:407.007,es:"Si sigues así, vas a acabar enfermo.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:46,start:407.007,end:415.895,es:"Acabaron por aceptar nuestra oferta.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:47,start:415.895,end:424.079,es:"Todo acabó en una gran fiesta.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:48,start:424.079,end:432.839,es:"El proyecto acabó por cancelarse.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:49,start:434.339,end:443.272,es:"Tenemos que acabar con este problema.",group:"acabar con",group_index:6,level:"B1"},{i:50,start:443.272,end:452.345,es:"Este trabajo va a acabar conmigo.",group:"acabar con",group_index:6,level:"B1"},{i:51,start:452.345,end:460.978,es:"La lluvia acabó con nuestros planes.",group:"acabar con",group_index:6,level:"B1"},{i:52,start:460.978,end:470.167,es:"El gobierno quiere acabar con la pobreza.",group:"acabar con",group_index:6,level:"B1"},{i:53,start:470.167,end:480.576,es:"Hay que acabar con el ruido en el edificio.",group:"acabar con",group_index:6,level:"B1"},{i:54,start:480.576,end:491.119,es:"Esta medicina acabó con mi dolor de cabeza.",group:"acabar con",group_index:6,level:"B1"},{i:55,start:491.119,end:501.202,es:"Quiero acabar con esta situación cuanto antes.",group:"acabar con",group_index:6,level:"B1"},{i:56,start:502.702,end:511.474,es:"¡Se acabó! Nos vamos a casa.",group:"expresiones",group_index:7,level:"A2"},{i:57,start:511.474,end:521.976,es:"Y colorín colorado, este cuento se ha acabado.",group:"expresiones",group_index:7,level:"A2"},{i:58,start:521.976,end:529.517,es:"Esto no acaba nunca.",group:"expresiones",group_index:7,level:"B1"},{i:59,start:529.517,end:537.906,es:"No acabo de entender la pregunta.",group:"expresiones",group_index:7,level:"B1"},{i:60,start:537.906,end:547.49,es:"No acabo de acostumbrarme a esta ciudad.",group:"expresiones",group_index:7,level:"B1"},{i:61,start:547.49,end:555.043,es:"Lo bueno se acaba pronto.",group:"expresiones",group_index:7,level:"B1"},{i:62,start:555.043,end:565.01,es:"No vas a salir esta noche, y se acabó.",group:"expresiones",group_index:7,level:"B1"}],hn={word:gn,slug:cn,kind:vn,hash:mn,duration:xn,voice:_n,marks:An},bn="conocer",fn="conocer",qn="word",yn="dbc5218deeca61e4",jn=597.696,Bn="mx",zn=[{i:0,start:.5,end:7.53,es:"Conozco a tu hermano.",group:"conocer a una persona",group_index:0,level:"A1"},{i:1,start:7.53,end:15.327,es:"No conozco a nadie aquí.",group:"conocer a una persona",group_index:0,level:"A1"},{i:2,start:15.327,end:22.218,es:"¿Conoces a mi vecina?",group:"conocer a una persona",group_index:0,level:"A1"},{i:3,start:22.218,end:31.57,es:"Ella conoce a todos en la oficina.",group:"conocer a una persona",group_index:0,level:"A1"},{i:4,start:31.57,end:40.359,es:"Conocemos al profesor de música.",group:"conocer a una persona",group_index:0,level:"A1"},{i:5,start:40.359,end:49.003,es:"Mis padres no conocen a mi jefe.",group:"conocer a una persona",group_index:0,level:"A1"},{i:6,start:49.003,end:58.321,es:"Yo conozco a la dueña del restaurante.",group:"conocer a una persona",group_index:0,level:"A1"},{i:7,start:58.321,end:67.29,es:"Te conozco desde hace muchos años.",group:"conocer a una persona",group_index:0,level:"A2"},{i:8,start:68.79,end:75.948,es:"No conozco esta ciudad.",group:"conocer un lugar",group_index:1,level:"A1"},{i:9,start:75.948,end:85.393,es:"Conozco un buen restaurante cerca de aquí.",group:"conocer un lugar",group_index:1,level:"A1"},{i:10,start:85.393,end:92.098,es:"¿Conoces México?",group:"conocer un lugar",group_index:1,level:"A1"},{i:11,start:92.098,end:100.011,es:"Mi abuela no conoce el mar.",group:"conocer un lugar",group_index:1,level:"A1"},{i:12,start:100.011,end:107.947,es:"Quiero conocer Buenos Aires.",group:"conocer un lugar",group_index:1,level:"A1"},{i:13,start:107.947,end:115.569,es:"Ya conocemos este museo.",group:"conocer un lugar",group_index:1,level:"A1"},{i:14,start:115.569,end:124.998,es:"El taxista conoce todas las calles.",group:"conocer un lugar",group_index:1,level:"A1"},{i:15,start:124.998,end:134.768,es:"Nunca he conocido un lugar tan tranquilo.",group:"conocer un lugar",group_index:1,level:"A2"},{i:16,start:136.268,end:143.728,es:"¿Conoces un buen médico?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:17,start:143.728,end:151.536,es:"¿Conoces algún hotel barato?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:18,start:151.536,end:159.704,es:"¿Conocen una tienda abierta ahora?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:19,start:159.704,end:169.37,es:"¿Conoces una buena película para esta noche?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:20,start:169.37,end:179.5,es:"Si conoces un buen mecánico, avísame.",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:21,start:179.5,end:189.026,es:"¿Conoces alguna receta fácil con pollo?",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:22,start:189.026,end:199.236,es:"Te recomiendo un café que conozco en el centro.",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:23,start:199.236,end:209.32,es:"¿Usted conoce a alguien que hable inglés?",group:"preguntas y recomendaciones",group_index:2,level:"B1"},{i:24,start:210.82,end:218.5,es:"Mucho gusto en conocerte.",group:"conocer por primera vez",group_index:3,level:"A1"},{i:25,start:218.5,end:227.273,es:"Conocí a mi novia en la universidad.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:26,start:227.273,end:235.209,es:"¿Dónde conociste a tu esposo?",group:"conocer por primera vez",group_index:3,level:"A2"},{i:27,start:235.209,end:244.84,es:"Nos conocimos en una fiesta de cumpleaños.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:28,start:244.84,end:254.657,es:"Ayer conocí a los padres de Carlos.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:29,start:254.657,end:264.253,es:"Mañana vas a conocer a mi familia.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:30,start:264.253,end:275.13,es:"Conocí a mi mejor amigo en el autobús.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:31,start:275.13,end:286.038,es:"Me encantaría conocer a tu hermana algún día.",group:"conocer por primera vez",group_index:3,level:"B1"},{i:32,start:287.538,end:294.185,es:"¿Ustedes se conocen?",group:"conocerse",group_index:4,level:"A1"},{i:33,start:294.185,end:302.91,es:"Nosotros nos conocemos desde niños.",group:"conocerse",group_index:4,level:"A2"},{i:34,start:302.91,end:311.125,es:"Ellos se conocieron en el trabajo.",group:"conocerse",group_index:4,level:"A2"},{i:35,start:311.125,end:319.583,es:"Nos conocimos hace diez años.",group:"conocerse",group_index:4,level:"A2"},{i:36,start:319.583,end:328.122,es:"Mis padres se conocieron en un tren.",group:"conocerse",group_index:4,level:"A2"},{i:37,start:328.122,end:339.332,es:"Me conozco muy bien y sé cuándo necesito descansar.",group:"conocerse",group_index:4,level:"B1"},{i:38,start:339.332,end:348.487,es:"Es importante conocerse a uno mismo.",group:"conocerse",group_index:4,level:"B1"},{i:39,start:349.987,end:359.897,es:"Conozco a Ana, pero no sé dónde vive.",group:"conocer y saber",group_index:5,level:"A2"},{i:40,start:359.897,end:370.143,es:"Conozco Madrid, pero no sé dónde está tu hotel.",group:"conocer y saber",group_index:5,level:"A2"},{i:41,start:370.143,end:381.028,es:"Sé su nombre, pero no lo conozco personalmente.",group:"conocer y saber",group_index:5,level:"A2"},{i:42,start:381.028,end:390.589,es:"Conozco la canción, pero no sé la letra.",group:"conocer y saber",group_index:5,level:"A2"},{i:43,start:390.589,end:402.089,es:"No conozco al nuevo director, solo sé que es muy serio.",group:"conocer y saber",group_index:5,level:"B1"},{i:44,start:402.089,end:415.888,es:"Conozco el camino, así que sé cuánto tiempo vamos a tardar.",group:"conocer y saber",group_index:5,level:"B1"},{i:45,start:415.888,end:427.992,es:"Aunque conozco bien el tema, no sé si podré explicarlo.",group:"conocer y saber",group_index:5,level:"B1"},{i:46,start:429.492,end:439.192,es:"Es un cantante muy conocido en su país.",group:"conocido y dar a conocer",group_index:6,level:"A2"},{i:47,start:439.192,end:448.389,es:"Esta ciudad es conocida por su comida.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:48,start:448.389,end:457.44,es:"El pintor es conocido en todo el mundo.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:49,start:457.44,end:465.956,es:"Lo conocen como el rey de la salsa.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:50,start:465.956,end:476.167,es:"La empresa dio a conocer su nuevo producto ayer.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:51,start:476.167,end:487.249,es:"Mañana van a dar a conocer los resultados del examen.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:52,start:487.249,end:497.31,es:"El pueblo es conocido como la capital del café.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:53,start:497.31,end:507.916,es:"El libro ayudó a dar a conocer la historia de la región.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:54,start:509.416,end:518.072,es:"Conozco muy bien a mi hermana.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A1"},{i:55,start:518.072,end:530.907,es:"Mi vecina me conoce de vista porque paso por su calle todos los días.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A2"},{i:56,start:530.907,end:541.803,es:"Lo conozco de vista, pero nunca hemos hablado.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A2"},{i:57,start:541.803,end:550.761,es:"Ella conoce el tema a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:58,start:550.761,end:561.82,es:"Antes de decidir, quiero conocer el proyecto a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:59,start:561.82,end:573.157,es:"No lo conocía bien, pero parecía una buena persona.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:60,start:573.157,end:585.249,es:"Para trabajar aquí, es necesario que conozcas bien el sistema.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:61,start:585.249,end:597.648,es:"Después de tantos viajes, conoce el país a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"}],Mn={word:bn,slug:fn,kind:qn,hash:yn,duration:jn,voice:Bn,marks:zn},En="dar",kn="dar",$n="word",wn="9733ba3ed70c4dd7",Nn=555.36,Sn="mx",Ln=[{i:0,start:.5,end:8.238,es:"Te doy mi número de teléfono.",group:"dar, entregar",group_index:0,level:"A1"},{i:1,start:8.238,end:15.748,es:"¿Me das un vaso de agua?",group:"dar, entregar",group_index:0,level:"A1"},{i:2,start:15.748,end:24.787,es:"Mi abuela me da dinero en mi cumpleaños.",group:"dar, entregar",group_index:0,level:"A1"},{i:3,start:24.787,end:33.233,es:"El profesor nos da mucha tarea.",group:"dar, entregar",group_index:0,level:"A1"},{i:4,start:33.233,end:40.821,es:"¿Le das de comer al gato?",group:"dar, entregar",group_index:0,level:"A1"},{i:5,start:40.821,end:46.969,es:"Dame la mano.",group:"dar, entregar",group_index:0,level:"A1"},{i:6,start:46.969,end:55.961,es:"Los vecinos nos dan fruta de su jardín.",group:"dar, entregar",group_index:0,level:"A1"},{i:7,start:55.961,end:62.794,es:"¿Qué le damos a mamá?",group:"dar, entregar",group_index:0,level:"A1"},{i:8,start:62.794,end:70.501,es:"¿Me das la sal, por favor?",group:"dar, entregar",group_index:0,level:"A1"},{i:9,start:72.001,end:79.877,es:"Te doy las gracias por todo.",group:"dar las gracias",group_index:1,level:"A1"},{i:10,start:79.877,end:89.485,es:"Siempre damos las gracias al conductor.",group:"dar las gracias",group_index:1,level:"A1"},{i:11,start:89.485,end:98.233,es:"Quiero darle las gracias a tu madre.",group:"dar las gracias",group_index:1,level:"A1"},{i:12,start:98.233,end:105.414,es:"Hay que dar las gracias.",group:"dar las gracias",group_index:1,level:"A1"},{i:13,start:105.414,end:113.683,es:"Le di las gracias por el regalo.",group:"dar las gracias",group_index:1,level:"A2"},{i:14,start:113.683,end:121.975,es:"Los niños no dieron las gracias.",group:"dar las gracias",group_index:1,level:"A2"},{i:15,start:123.475,end:132.867,es:"Le di un beso a mi abuela.",group:"di, dio, daba",group_index:2,level:"A2"},{i:16,start:132.867,end:141.209,es:"Mi jefe me dio el día libre.",group:"di, dio, daba",group_index:2,level:"A2"},{i:17,start:141.209,end:148.553,es:"¿Quién te dio esa noticia?",group:"di, dio, daba",group_index:2,level:"A2"},{i:18,start:148.553,end:158.868,es:"Nos dieron una habitación con vista al mar.",group:"di, dio, daba",group_index:2,level:"A2"},{i:19,start:158.868,end:168.719,es:"Mi padre siempre me daba buenos consejos.",group:"di, dio, daba",group_index:2,level:"A2"},{i:20,start:168.719,end:176.829,es:"El médico me dio una receta.",group:"di, dio, daba",group_index:2,level:"A2"},{i:21,start:176.829,end:185.877,es:"Le dimos un regalo a nuestra profesora.",group:"di, dio, daba",group_index:2,level:"A2"},{i:22,start:187.377,end:196.985,es:"Después de comer, damos un paseo.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A1"},{i:23,start:196.985,end:206.558,es:"Mis abuelos dan un paseo cada tarde.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A1"},{i:24,start:206.558,end:215.283,es:"Vamos a dar una vuelta por el centro.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:25,start:215.283,end:224.287,es:"¿Quieres dar una vuelta en bicicleta?",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:26,start:224.287,end:233.325,es:"Ayer dimos un paseo por la playa.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:27,start:233.325,end:242.038,es:"Voy a dar una vuelta con el perro.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:28,start:242.038,end:252.656,es:"Dimos una vuelta por el mercado antes de cenar.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:29,start:254.156,end:261.64,es:"Me dan miedo las arañas.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:30,start:261.64,end:272.416,es:"A mi hijo le da miedo la oscuridad.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:31,start:272.416,end:281.211,es:"Me da vergüenza hablar en público.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:32,start:281.211,end:289.913,es:"¿No te da vergüenza llegar tan tarde?",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:33,start:289.913,end:298.388,es:"Me da pena ver a ese perro solo.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:34,start:298.388,end:307.062,es:"Nos dio mucha pena dejar la ciudad.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:35,start:307.062,end:315.578,es:"Esa película me dio mucho miedo.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:36,start:315.578,end:324.815,es:"Le da vergüenza bailar delante de todos.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:37,start:326.315,end:332.711,es:"Me da igual.",group:"dar igual",group_index:5,level:"A1"},{i:38,start:332.711,end:341.402,es:"¿Pizza o pasta? Me da igual.",group:"dar igual",group_index:5,level:"A1"},{i:39,start:341.402,end:351.95,es:"Nos da igual el precio, queremos un buen hotel.",group:"dar igual",group_index:5,level:"A2"},{i:40,start:351.95,end:359.955,es:"¿Te da igual si vamos mañana?",group:"dar igual",group_index:5,level:"A2"},{i:41,start:359.955,end:370.863,es:"Antes me importaba, pero ahora me da igual.",group:"dar igual",group_index:5,level:"A2"},{i:42,start:370.863,end:379.077,es:"Da igual, no pasa nada.",group:"dar igual",group_index:5,level:"A2"},{i:43,start:379.077,end:389.95,es:"A ella le da igual lo que piensen los demás.",group:"dar igual",group_index:5,level:"B1"},{i:44,start:391.45,end:397.633,es:"¡Date prisa!",group:"darse prisa",group_index:6,level:"A1"},{i:45,start:397.633,end:407.113,es:"Dense prisa, el tren sale ahora.",group:"darse prisa",group_index:6,level:"A2"},{i:46,start:407.113,end:417.51,es:"Si no nos damos prisa, vamos a llegar tarde.",group:"darse prisa",group_index:6,level:"A2"},{i:47,start:417.51,end:425.84,es:"Me di prisa y llegué a tiempo.",group:"darse prisa",group_index:6,level:"A2"},{i:48,start:425.84,end:434.101,es:"No hace falta que te des prisa.",group:"darse prisa",group_index:6,level:"B1"},{i:49,start:435.601,end:443.015,es:"No me di cuenta de la hora.",group:"darse cuenta",group_index:7,level:"A2"},{i:50,start:443.015,end:450.908,es:"¿Te diste cuenta de que no estaba?",group:"darse cuenta",group_index:7,level:"A2"},{i:51,start:450.908,end:459.099,es:"Me di cuenta demasiado tarde.",group:"darse cuenta",group_index:7,level:"A2"},{i:52,start:459.099,end:470.783,es:"De repente me di cuenta de que había perdido las llaves.",group:"darse cuenta",group_index:7,level:"B1"},{i:53,start:470.783,end:478.731,es:"Nadie se dio cuenta del error.",group:"darse cuenta",group_index:7,level:"B1"},{i:54,start:478.731,end:488.385,es:"Cuando te des cuenta, ya será tarde.",group:"darse cuenta",group_index:7,level:"B1"},{i:55,start:488.385,end:498.027,es:"Es importante que se den cuenta del problema.",group:"darse cuenta",group_index:7,level:"B1"},{i:56,start:498.027,end:506.962,es:"Por fin me he dado cuenta de lo que quiero.",group:"darse cuenta",group_index:7,level:"B1"},{i:57,start:508.462,end:516.302,es:"La ventana da al mar.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:58,start:516.302,end:526.002,es:"Mi habitación da a un patio tranquilo.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:59,start:526.002,end:536.272,es:"Queremos una habitación que dé a la calle.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:60,start:536.272,end:545.09,es:"La puerta de la cocina da al jardín.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:61,start:545.09,end:555.29,es:"El balcón daba a una plaza muy bonita.",group:"dar a, mirar hacia",group_index:8,level:"B1"}],Tn={word:En,slug:kn,kind:$n,hash:wn,duration:Nn,voice:Sn,marks:Ln},Pn="dejar",Cn="dejar",Hn="word",Qn="73a0d5844bb43e67",Dn=501.408,Yn="mx",Vn=[{i:0,start:.5,end:8.122,es:"Deja tu abrigo aquí.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:1,start:8.122,end:15.408,es:"¿Dónde dejo las llaves?",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:2,start:15.408,end:23.212,es:"Dejo el auto en la calle.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:3,start:23.212,end:31.972,es:"Siempre dejo la ventana abierta.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:4,start:31.972,end:40.175,es:"Deja los zapatos en la puerta.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:5,start:40.175,end:48.541,es:"Dejé el teléfono en casa.",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:6,start:48.541,end:55.919,es:"¿Dónde dejaste mi libro?",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:7,start:55.919,end:65.762,es:"Te dejé un poco de pastel en la cocina.",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:8,start:67.262,end:74.449,es:"¿Me dejas ir al baño?",group:"dejar, permitir",group_index:1,level:"A1"},{i:9,start:74.449,end:80.527,es:"Déjame ver.",group:"dejar, permitir",group_index:1,level:"A1"},{i:10,start:80.527,end:88.532,es:"Mi madre no me deja salir.",group:"dejar, permitir",group_index:1,level:"A1"},{i:11,start:88.532,end:95.224,es:"Déjame ayudarte.",group:"dejar, permitir",group_index:1,level:"A1"},{i:12,start:95.224,end:102.926,es:"El ruido no me deja dormir.",group:"dejar, permitir",group_index:1,level:"A1"},{i:13,start:102.926,end:111.177,es:"¿Me dejas usar tu computadora?",group:"dejar, permitir",group_index:1,level:"A1"},{i:14,start:111.177,end:121.911,es:"Mis padres nunca me dejaban ver televisión de noche.",group:"dejar, permitir",group_index:1,level:"A2"},{i:15,start:121.911,end:130.241,es:"No me dejaron entrar sin entrada.",group:"dejar, permitir",group_index:1,level:"A2"},{i:16,start:131.741,end:138.319,es:"No me dejes solo.",group:"dejar a alguien",group_index:2,level:"A1"},{i:17,start:138.319,end:145.291,es:"Te dejo en la esquina.",group:"dejar a alguien",group_index:2,level:"A1"},{i:18,start:145.291,end:151.764,es:"Mi novia me dejó.",group:"dejar a alguien",group_index:2,level:"A2"},{i:19,start:151.764,end:160.176,es:"Dejé a los niños con mi madre.",group:"dejar a alguien",group_index:2,level:"A2"},{i:20,start:160.176,end:168.379,es:"Mi padre me dejó en la estación.",group:"dejar a alguien",group_index:2,level:"A2"},{i:21,start:168.379,end:178.393,es:"Él la dejó después de cinco años juntos.",group:"dejar a alguien",group_index:2,level:"A2"},{i:22,start:178.393,end:187.141,es:"Nunca voy a dejar a mis amigos.",group:"dejar a alguien",group_index:2,level:"A2"},{i:23,start:188.641,end:194.963,es:"¡Deja de gritar!",group:"dejar de + infinitivo",group_index:3,level:"A1"},{i:24,start:194.963,end:203.355,es:"Dejé de fumar el año pasado.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:25,start:203.355,end:210.864,es:"Por fin ha dejado de llover.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:26,start:210.864,end:220.333,es:"Mi hermano dejó de trabajar en el banco.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:27,start:220.333,end:229.615,es:"Tienes que dejar de comer tanto azúcar.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:28,start:229.615,end:241.115,es:"Cuando nació mi hijo, dejé de salir por la noche.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:29,start:241.115,end:249.98,es:"Quiero dejar de preocuparme por todo.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:30,start:249.98,end:257.844,es:"El reloj dejó de funcionar.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:31,start:259.344,end:268.178,es:"Dejé mi trabajo en marzo.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:32,start:268.178,end:275.8,es:"Ella dejó la universidad.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:33,start:275.8,end:282.981,es:"Quiero dejar el café.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:34,start:282.981,end:292.694,es:"Dejamos el gimnasio porque era muy caro.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:35,start:292.694,end:302.789,es:"Mi abuelo dejó el tabaco hace diez años.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:36,start:302.789,end:310.899,es:"No pienso dejar mis estudios.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:37,start:312.399,end:319.754,es:"El bebé no deja de llorar.",group:"no dejar de",group_index:5,level:"A2"},{i:38,start:319.754,end:329.641,es:"Mi vecino no dejó de hablar en toda la cena.",group:"no dejar de",group_index:5,level:"A2"},{i:39,start:329.641,end:337.901,es:"No dejes de visitar el mercado.",group:"no dejar de",group_index:5,level:"B1"},{i:40,start:337.901,end:345.326,es:"No dejo de pensar en ti.",group:"no dejar de",group_index:5,level:"B1"},{i:41,start:345.326,end:354.272,es:"No dejen de probar la sopa de la casa.",group:"no dejar de",group_index:5,level:"B1"},{i:42,start:354.272,end:362.905,es:"No dejes de llamarme cuando llegues.",group:"no dejar de",group_index:5,level:"B1"},{i:43,start:362.905,end:373.789,es:"Aunque esté cansado, no deja de ir al gimnasio.",group:"no dejar de",group_index:5,level:"B1"},{i:44,start:375.289,end:384.584,es:"Deja la puerta cerrada, por favor.",group:"dejar + participio o adjetivo",group_index:6,level:"A2"},{i:45,start:384.584,end:392.183,es:"Dejé la cena preparada.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:46,start:392.183,end:400.293,es:"La noticia me dejó preocupado.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:47,start:400.293,end:408.972,es:"Dejamos todo listo para el viaje.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:48,start:408.972,end:416.907,es:"El examen me dejó agotado.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:49,start:416.907,end:425.424,es:"El viaje nos dejó muy contentos.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:50,start:425.424,end:433.952,es:"Ya dejé pagada la cuenta del hotel.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:51,start:435.452,end:444.073,es:"Sin querer, dejé caer el plato.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:52,start:444.073,end:451.962,es:"Déjalo, no importa.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:53,start:451.962,end:459.851,es:"Deja eso para mañana.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:54,start:459.851,end:466.277,es:"Déjame en paz.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:55,start:466.277,end:474.701,es:"Deja que lo piense un poco.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:56,start:474.701,end:484.018,es:"Dejemos el tema para otro día.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:57,start:484.018,end:493.603,es:"No dejes para mañana lo que puedas hacer hoy.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:58,start:493.603,end:501.341,es:"Eso deja mucho que desear.",group:"expresiones con dejar",group_index:7,level:"B1"}],On={word:Pn,slug:Cn,kind:Hn,hash:Qn,duration:Dn,voice:Yn,marks:Vn},In="echar",Fn="echar",Rn="word",Un="bf8889a330bbe83c",Gn=549.048,Kn="mx",Xn=[{i:0,start:.5,end:8.343,es:"Echa la pelota al perro.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:1,start:8.343,end:15.896,es:"Echo la carta en el buzón.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:2,start:15.896,end:24.784,es:"Los niños echan piedras al río.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:3,start:24.784,end:32.659,es:"¿Puedes echar esto a la basura?",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:4,start:32.659,end:40.769,es:"Ella echa pan a los patos.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:5,start:40.769,end:48.519,es:"No eches papeles al suelo.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:6,start:48.519,end:56.78,es:"Echamos una moneda a la fuente.",group:"echar, lanzar algo",group_index:0,level:"A2"},{i:7,start:58.28,end:66.843,es:"Echa un poco de sal a la sopa.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:8,start:66.843,end:74.507,es:"¿Le echas azúcar al café?",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:9,start:74.507,end:81.781,es:"Yo no echo leche al té.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:10,start:81.781,end:89.485,es:"Echa más agua a la olla.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:11,start:89.485,end:99.546,es:"Mi abuela echa mucho ajo a todo.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:12,start:99.546,end:109.432,es:"Echa un poco de hielo a la limonada.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:13,start:109.432,end:117.867,es:"¿Cuánto aceite le echo a la ensalada?",group:"echar en la comida y la bebida",group_index:1,level:"A2"},{i:14,start:117.867,end:126.906,es:"Le eché demasiada pimienta a la carne.",group:"echar en la comida y la bebida",group_index:1,level:"A2"},{i:15,start:128.406,end:137.258,es:"¿Me echas una mano con estas cajas?",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:16,start:137.258,end:147.098,es:"Mi vecino siempre me echa una mano.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:17,start:147.098,end:155.034,es:"Te echo una mano con la cena.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:18,start:155.034,end:166.302,es:"Ayer le eché una mano a mi hermano con la mudanza.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:19,start:166.302,end:174.961,es:"¿Puedes echar un vistazo a mi trabajo?",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:20,start:174.961,end:183.601,es:"Voy a echar un vistazo a la tienda.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:21,start:183.601,end:193.778,es:"Echa un vistazo al bebé, por favor.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:22,start:193.778,end:204.117,es:"El mecánico le echó un vistazo al motor.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:23,start:205.617,end:213.564,es:"El perro se echa en el sofá.",group:"echarse, acostarse",group_index:3,level:"A1"},{i:24,start:213.564,end:223.725,es:"Estoy cansado, voy a echarme un rato.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:25,start:223.725,end:234.016,es:"Después de comer, me eché en la cama.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:26,start:234.016,end:244.341,es:"Mi padre se echa en la hamaca todas las tardes.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:27,start:244.341,end:253.397,es:"Nos echamos en la arena a tomar el sol.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:28,start:253.397,end:263.527,es:"Échate un momento si te duele la cabeza.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:29,start:263.527,end:272.276,es:"El gato se echó al lado de la ventana.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:30,start:273.776,end:280.355,es:"¿Me echas de menos?",group:"echar de menos",group_index:4,level:"A1"},{i:31,start:280.355,end:288.198,es:"Echo de menos a mi familia.",group:"echar de menos",group_index:4,level:"A2"},{i:32,start:288.198,end:297.098,es:"Echamos de menos la comida de casa.",group:"echar de menos",group_index:4,level:"A2"},{i:33,start:297.098,end:307.959,es:"Cuando vivía lejos, echaba de menos el mar.",group:"echar de menos",group_index:4,level:"A2"},{i:34,start:307.959,end:315.776,es:"Te he echado mucho de menos.",group:"echar de menos",group_index:4,level:"A2"},{i:35,start:315.776,end:326.557,es:"Mi hija echa de menos a sus amigos del colegio.",group:"echar de menos",group_index:4,level:"A2"},{i:36,start:326.557,end:334.938,es:"Voy a echar de menos esta ciudad.",group:"echar de menos",group_index:4,level:"A2"},{i:37,start:334.938,end:346.24,es:"Nadie echó de menos la televisión durante las vacaciones.",gr
