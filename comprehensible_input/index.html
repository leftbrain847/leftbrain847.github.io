menos",group_index:8,level:"B1"},{i:58,start:493.929,end:502.58,es:"La ciudad está cada vez más cara.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:59,start:502.58,end:510.356,es:"Cada vez leo menos libros.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:60,start:510.356,end:518.772,es:"Tu hijo está cada vez más alto.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"}],xu={word:du,slug:pu,kind:gu,hash:cu,duration:vu,voice:mu,marks:_u},Au="volver a",hu="volver_a",bu="word",qu="31bf0d15be6be5a5",fu=512.568,yu="dora",ju=[{i:0,start:.5,end:7.785,es:"Vuelvo a casa a las seis.",group:"volver, regresar",group_index:0,level:"A1"},{i:1,start:7.785,end:13.94,es:"¿Cuándo vuelves?",group:"volver, regresar",group_index:0,level:"A1"},{i:2,start:13.94,end:21.503,es:"Mi hermano vuelve mañana.",group:"volver, regresar",group_index:0,level:"A1"},{i:3,start:21.503,end:28.511,es:"Volvemos en una hora.",group:"volver, regresar",group_index:0,level:"A1"},{i:4,start:28.511,end:37.353,es:"Ella vuelve del trabajo muy cansada.",group:"volver, regresar",group_index:0,level:"A1"},{i:5,start:37.353,end:45.023,es:"¿A qué hora vuelven los niños?",group:"volver, regresar",group_index:0,level:"A1"},{i:6,start:45.023,end:51.647,es:"Ayer volví tarde.",group:"volver, regresar",group_index:0,level:"A2"},{i:7,start:51.647,end:59.551,es:"Mis padres volvieron de Italia.",group:"volver, regresar",group_index:0,level:"A2"},{i:8,start:61.051,end:68.037,es:"Vuelvo a leer el libro.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:9,start:68.037,end:75.323,es:"Mañana vuelvo a llamar.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:10,start:75.323,end:83.611,es:"Siempre vuelve a perder las llaves.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:11,start:83.611,end:90.96,es:"El bebé vuelve a llorar.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:12,start:90.96,end:97.371,es:"Vuelve a llover.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:13,start:97.371,end:105.445,es:"Hoy volvemos a comer pescado.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:14,start:105.445,end:113.584,es:"Mi computadora vuelve a fallar.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:15,start:113.584,end:121.979,es:"Ella vuelve a preguntar lo mismo.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:16,start:123.479,end:131.255,es:"Volví a ver esa película.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:17,start:131.255,end:138.092,es:"Ayer volvió a nevar.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:18,start:138.092,end:146.145,es:"Volvimos a visitar el museo.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:19,start:146.145,end:155.372,es:"Después de dos años, volvió a trabajar.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:20,start:155.372,end:164.023,es:"Volví a llamar, pero nadie contestó.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:21,start:164.023,end:172.951,es:"El dolor volvió a empezar por la noche.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:22,start:172.951,end:182.711,es:"Mi hermana volvió a estudiar a los cuarenta años.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:23,start:182.711,end:192.556,es:"De niño, volví a leer ese cuento muchas veces.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:24,start:194.056,end:201.448,es:"Voy a volver a intentarlo.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:25,start:201.448,end:209.885,es:"Mañana va a volver a hacer frío.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:26,start:209.885,end:218.259,es:"¿Vas a volver a ese restaurante?",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:27,start:218.259,end:226.824,es:"Vamos a volver a vernos en verano.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:28,start:226.824,end:235.859,es:"Volveré a escribirte la semana que viene.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:29,start:235.859,end:245.405,es:"El año que viene volveremos a viajar juntos.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:30,start:245.405,end:253.629,es:"Te volveré a llamar más tarde.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:31,start:253.629,end:261.981,es:"Pronto volverá a salir el sol.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:32,start:263.481,end:270.425,es:"No vuelvo a comer ahí.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:33,start:270.425,end:277.412,es:"Nunca volví a verlo.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:34,start:277.412,end:285.508,es:"No volvimos a hablar del tema.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:35,start:285.508,end:293.604,es:"No pienso volver a ese hotel.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:36,start:293.604,end:302.959,es:"Después del accidente, no volvió a manejar.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:37,start:302.959,end:311.567,es:"Prometo no volver a llegar tarde.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:38,start:311.567,end:319.727,es:"No ha vuelto a llover desde marzo.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:39,start:319.727,end:327.14,es:"No vuelvas a hacer eso.",group:"no volver a, nunca más",group_index:4,level:"B1"},{i:40,start:328.64,end:335.328,es:"Vuelve a intentarlo.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:41,start:335.328,end:344.192,es:"Vuelva a revisar sus datos, por favor.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:42,start:344.192,end:351.605,es:"Vuelve a leer la pregunta.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:43,start:351.605,end:359.723,es:"Vuelvan a sentarse, por favor.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:44,start:359.723,end:367.157,es:"Vuelve a contar el dinero.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:45,start:367.157,end:376.427,es:"Por favor, vuelva a escribir su contraseña.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:46,start:376.427,end:387.509,es:"Si no funciona, apaga la computadora y vuelve a encenderla.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:47,start:389.009,end:396.807,es:"Lo volví a ver en la fiesta.",group:"con pronombres",group_index:6,level:"B1"},{i:48,start:396.807,end:403.879,es:"Te lo vuelvo a explicar.",group:"con pronombres",group_index:6,level:"B1"},{i:49,start:403.879,end:411.079,es:"Se me volvió a olvidar.",group:"con pronombres",group_index:6,level:"B1"},{i:50,start:411.079,end:419.367,es:"Me volvió a llamar a medianoche.",group:"con pronombres",group_index:6,level:"B1"},{i:51,start:419.367,end:426.951,es:"¿Me lo puedes volver a decir?",group:"con pronombres",group_index:6,level:"B1"},{i:52,start:426.951,end:436.305,es:"Nos volvimos a encontrar en el aeropuerto.",group:"con pronombres",group_index:6,level:"B1"},{i:53,start:436.305,end:444.508,es:"Se volvió a romper la lavadora.",group:"con pronombres",group_index:6,level:"B1"},{i:54,start:444.508,end:452.625,es:"Me lo volví a poner para la boda.",group:"con pronombres",group_index:6,level:"B1"},{i:55,start:454.125,end:462.072,es:"Espero que no vuelva a pasar.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:56,start:462.072,end:470.531,es:"Ojalá volvamos a vernos pronto.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:57,start:470.531,end:479.885,es:"Si pudiera, volvería a estudiar medicina.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:58,start:479.885,end:487.725,es:"Yo no volvería a ese lugar.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:59,start:487.725,end:495.949,es:"Cuando vuelvas a venir, avísame.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:60,start:495.949,end:504.451,es:"Me alegra que hayas vuelto a cantar.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:61,start:504.451,end:512.504,es:"No creo que vuelva a llover hoy.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"}],Bu={word:Au,slug:hu,kind:bu,hash:qu,duration:fu,voice:yu,marks:ju},zu="ya / todavía",Mu="ya_todavia",Eu="word",$u="4e24dfc4468adc66",ku=510.72,Nu="dora",wu=[{i:0,start:.5,end:6.42,es:"Ya es tarde.",group:"ya en presente",group_index:0,level:"A1"},{i:1,start:6.42,end:12.703,es:"Ya sé tu nombre.",group:"ya en presente",group_index:0,level:"A1"},{i:2,start:12.703,end:19.945,es:"Mi hermano ya trabaja.",group:"ya en presente",group_index:0,level:"A1"},{i:3,start:19.945,end:26.825,es:"¿Ya tienes las llaves?",group:"ya en presente",group_index:0,level:"A1"},{i:4,start:26.825,end:34.047,es:"El niño ya lee solo.",group:"ya en presente",group_index:0,level:"A1"},{i:5,start:34.047,end:41.055,es:"Ya estamos en casa.",group:"ya en presente",group_index:0,level:"A1"},{i:6,start:41.055,end:48.447,es:"La cena ya está lista.",group:"ya en presente",group_index:0,level:"A1"},{i:7,start:49.947,end:55.459,es:"¡Ya voy!",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:8,start:55.459,end:61.102,es:"¡Ven ya!",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:9,start:61.102,end:68.6,es:"Ya vengo, espérame aquí.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:10,start:68.6,end:75.63,es:"Hazlo ya, por favor.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:11,start:75.63,end:83.47,es:"Necesito una respuesta ya.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:12,start:83.47,end:90.584,es:"Ya bajo, un momento.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:13,start:90.584,end:98.808,es:"Si quieres llegar a tiempo, sal ya.",group:"ya voy, ahora mismo",group_index:1,level:"A2"},{i:14,start:100.308,end:107.274,es:"Todavía es temprano.",group:"todavía",group_index:2,level:"A1"},{i:15,start:107.274,end:115.199,es:"Mi abuela todavía vive sola.",group:"todavía",group_index:2,level:"A1"},{i:16,start:115.199,end:122.207,es:"¿Todavía tienes hambre?",group:"todavía",group_index:2,level:"A1"},{i:17,start:122.207,end:129.45,es:"Todavía llueve mucho.",group:"todavía",group_index:2,level:"A1"},{i:18,start:129.45,end:137.119,es:"Los niños todavía duermen.",group:"todavía",group_index:2,level:"A1"},{i:19,start:137.119,end:145.194,es:"Todavía estoy en la oficina.",group:"todavía",group_index:2,level:"A1"},{i:20,start:145.194,end:153.652,es:"¿Todavía trabajas en el hospital?",group:"todavía",group_index:2,level:"A1"},{i:21,start:155.152,end:161.734,es:"Todavía no lo sé.",group:"todavía no",group_index:3,level:"A1"},{i:22,start:161.734,end:170.15,es:"El autobús todavía no está aquí.",group:"todavía no",group_index:3,level:"A1"},{i:23,start:170.15,end:177.926,es:"Todavía no tengo trabajo.",group:"todavía no",group_index:3,level:"A1"},{i:24,start:177.926,end:185.488,es:"Mi hija todavía no habla.",group:"todavía no",group_index:3,level:"A1"},{i:25,start:185.488,end:193.222,es:"Todavía no es hora de comer.",group:"todavía no",group_index:3,level:"A1"},{i:26,start:193.222,end:201.488,es:"Todavía no conozco a tus padres.",group:"todavía no",group_index:3,level:"A1"},{i:27,start:201.488,end:208.987,es:"¿Todavía no estás listo?",group:"todavía no",group_index:3,level:"A1"},{i:28,start:210.487,end:217.986,es:"Ya no vivo en esa casa.",group:"ya no",group_index:4,level:"A2"},{i:29,start:217.986,end:224.652,es:"Ya no tengo frío.",group:"ya no",group_index:4,level:"A2"},{i:30,start:224.652,end:231.639,es:"Mi padre ya no fuma.",group:"ya no",group_index:4,level:"A2"},{i:31,start:231.639,end:239.052,es:"Ya no hay pan en la tienda.",group:"ya no",group_index:4,level:"A2"},{i:32,start:239.052,end:247.084,es:"Ya no quiero más café, gracias.",group:"ya no",group_index:4,level:"A2"},{i:33,start:247.084,end:254.498,es:"Ellos ya no son amigos.",group:"ya no",group_index:4,level:"A2"},{i:34,start:254.498,end:264.599,es:"Desde que tengo bicicleta, ya no tomo el autobús.",group:"ya no",group_index:4,level:"A2"},{i:35,start:266.099,end:273.256,es:"Ya he comido, gracias.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:36,start:273.256,end:280.755,es:"¿Ya has terminado la tarea?",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:37,start:280.755,end:288.744,es:"Ya hemos visto esa película.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:38,start:288.744,end:298.355,es:"Mis amigos ya han llegado al restaurante.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:39,start:298.355,end:306.238,es:"¿Ya has hablado con el médico?",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:40,start:306.238,end:313.694,es:"Ya ha empezado el partido.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:41,start:313.694,end:320.979,es:"Ya he leído tu mensaje.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:42,start:320.979,end:328.478,es:"¿Ya han llamado del banco?",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:43,start:329.978,end:337.583,es:"¡Ya está! Funciona otra vez.",group:"¡ya está!",group_index:6,level:"A2"},{i:44,start:337.583,end:345.743,es:"Ya está, la puerta está cerrada.",group:"¡ya está!",group_index:6,level:"A2"},{i:45,start:345.743,end:352.303,es:"¿Ya está el arroz?",group:"¡ya está!",group_index:6,level:"A2"},{i:46,start:352.303,end:360.015,es:"Un minuto más y ya está.",group:"¡ya está!",group_index:6,level:"A2"},{i:47,start:360.015,end:367.386,es:"¡Ya está! Terminé la tarea.",group:"¡ya está!",group_index:6,level:"A2"},{i:48,start:367.386,end:374.927,es:"¡Ya está! Ya podemos salir.",group:"¡ya está!",group_index:6,level:"A2"},{i:49,start:376.427,end:385.547,es:"Ya es de noche, pero todavía hace calor.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:50,start:385.547,end:396.182,es:"Ya terminé el informe, pero todavía tengo que enviarlo.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:51,start:396.182,end:405.451,es:"Mi hijo ya camina, pero todavía no habla.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:52,start:405.451,end:415.638,es:"Ya no llueve, pero las calles todavía están mojadas.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:53,start:415.638,end:425.995,es:"Ya compré los regalos, pero todavía no los he envuelto.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:54,start:425.995,end:435.755,es:"Ya sabía la noticia, pero todavía no lo creo.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:55,start:435.755,end:445.622,es:"Ya son las diez y todavía no ha llegado nadie.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:56,start:447.122,end:455.943,es:"Ya que estás aquí, ayúdame con la mesa.",group:"ya que",group_index:8,level:"B1"},{i:57,start:455.943,end:465.724,es:"Ya que hace buen tiempo, podríamos comer afuera.",group:"ya que",group_index:8,level:"B1"},{i:58,start:465.724,end:474.631,es:"No voy a salir, ya que estoy muy cansado.",group:"ya que",group_index:8,level:"B1"},{i:59,start:474.631,end:483.516,es:"Ya que vas al mercado, compra tomates.",group:"ya que",group_index:8,level:"B1"},{i:60,start:483.516,end:492.338,es:"Ya que no tienes prisa, quédate a cenar.",group:"ya que",group_index:8,level:"B1"},{i:61,start:492.338,end:501.244,es:"Ya que lo mencionas, yo también quiero ir.",group:"ya que",group_index:8,level:"B1"},{i:62,start:501.244,end:510.663,es:"Te llamo mañana, ya que hoy no tengo tiempo.",group:"ya que",group_index:8,level:"B1"}],Lu={word:zu,slug:Mu,kind:Eu,hash:$u,duration:ku,voice:Nu,marks:wu},Su="acabar",Tu="acabar",Pu="word",Cu="3f89bd99d8dd8c2a",Hu=534.168,Qu="santa",Du=[{i:0,start:.5,end:7.999,es:"La clase acaba a las tres.",group:"acabar, terminar",group_index:0,level:"A1"},{i:1,start:7.999,end:15.497,es:"¿Cuándo acaba la película?",group:"acabar, terminar",group_index:0,level:"A1"},{i:2,start:15.497,end:23.273,es:"La fiesta acaba muy tarde.",group:"acabar, terminar",group_index:0,level:"A1"},{i:3,start:23.273,end:31.007,es:"Acabo el trabajo a las cinco.",group:"acabar, terminar",group_index:0,level:"A1"},{i:4,start:31.007,end:38.463,es:"El curso acaba en junio.",group:"acabar, terminar",group_index:0,level:"A1"},{i:5,start:38.463,end:46.644,es:"¿Ya acabas la tarea? Te espero.",group:"acabar, terminar",group_index:0,level:"A1"},{i:6,start:46.644,end:54.697,es:"Mi turno acaba a medianoche.",group:"acabar, terminar",group_index:0,level:"A1"},{i:7,start:56.197,end:63.227,es:"Ayer acabé el libro.",group:"acabé, acabó",group_index:1,level:"A2"},{i:8,start:63.227,end:70.448,es:"¿Ya acabaste la tarea?",group:"acabé, acabó",group_index:1,level:"A2"},{i:9,start:70.448,end:78.523,es:"La reunión acabó muy tarde.",group:"acabé, acabó",group_index:1,level:"A2"},{i:10,start:78.523,end:87.045,es:"Anoche acabamos la cena a las once.",group:"acabé, acabó",group_index:1,level:"A2"},{i:11,start:87.045,end:95.44,es:"Todavía no he acabado el informe.",group:"acabé, acabó",group_index:1,level:"A2"},{i:12,start:95.44,end:103.365,es:"El partido acabó empatado.",group:"acabé, acabó",group_index:1,level:"A2"},{i:13,start:103.365,end:110.501,es:"¿Cómo acabó la historia?",group:"acabé, acabó",group_index:1,level:"A2"},{i:14,start:110.501,end:119.835,es:"Cuando acabó el partido, salimos a caminar.",group:"acabé, acabó",group_index:1,level:"A2"},{i:15,start:121.335,end:128.833,es:"Acabo de llegar a casa.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:16,start:128.833,end:135.649,es:"Acabamos de comer.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:17,start:135.649,end:143.319,es:"El tren acaba de salir.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:18,start:143.319,end:150.455,es:"¿Acabas de despertarte?",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:19,start:150.455,end:158.039,es:"Acaba de llamar tu madre.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:20,start:158.039,end:166.241,es:"Acabo de ver a Pedro en la calle.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:21,start:166.241,end:175.383,es:"Mis vecinos acaban de tener un bebé.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:22,start:175.383,end:183.009,es:"Acabo de enviarte el correo.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:23,start:183.009,end:191.489,es:"Cuando llegué, él acababa de salir.",group:"acabar de + infinitivo",group_index:2,level:"B1"},{i:24,start:191.489,end:201.292,es:"Acababa de ducharme cuando sonó el teléfono.",group:"acabar de + infinitivo",group_index:2,level:"B1"},{i:25,start:202.792,end:209.544,es:"Se acabó la leche.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:26,start:209.544,end:217.171,es:"Se acabaron las vacaciones.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:27,start:217.171,end:224.008,es:"Se nos acabó el pan.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:28,start:224.008,end:232.744,es:"Se me acabó la batería del teléfono.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:29,start:232.744,end:239.389,es:"¿Se acabó el café?",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:30,start:239.389,end:247.379,es:"Se acabó el tiempo del examen.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:31,start:247.379,end:255.709,es:"Se están acabando las entradas.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:32,start:255.709,end:265.085,es:"Cuando se acabe el dinero, volvemos a casa.",group:"acabarse: no quedar",group_index:3,level:"B1"},{i:33,start:266.585,end:274.745,es:"Acabé comprando dos camisas.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:34,start:274.745,end:283.652,es:"Siempre acabamos hablando de trabajo.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:35,start:283.652,end:293.519,es:"Fuimos a pasear y acabamos cenando en la playa.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:36,start:293.519,end:303.535,es:"No quería ir, pero acabé bailando toda la noche.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:37,start:303.535,end:312.271,es:"Ella siempre acaba pagando la cuenta.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:38,start:312.271,end:322.5,es:"Empezó como un juego y acabó siendo su trabajo.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:39,start:322.5,end:332.687,es:"Si no descansas, acabarás durmiéndote en clase.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:40,start:332.687,end:342.617,es:"Al final, acabó riéndose de sus propios errores.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:41,start:344.117,end:351.445,es:"La historia acabó bien.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"A2"},{i:42,start:351.445,end:358.816,es:"La película acaba mal.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"A2"},{i:43,start:358.816,end:366.848,es:"La discusión acabó en pelea.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:44,start:366.848,end:374.773,es:"Esta calle acaba en el río.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:45,start:374.773,end:383.573,es:"Si sigues así, vas a acabar enfermo.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:46,start:383.573,end:392.352,es:"Acabaron por aceptar nuestra oferta.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:47,start:392.352,end:400.448,es:"Todo acabó en una gran fiesta.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:48,start:400.448,end:409.056,es:"El proyecto acabó por cancelarse.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:49,start:410.556,end:419.1,es:"Tenemos que acabar con este problema.",group:"acabar con",group_index:6,level:"B1"},{i:50,start:419.1,end:427.751,es:"Este trabajo va a acabar conmigo.",group:"acabar con",group_index:6,level:"B1"},{i:51,start:427.751,end:436.039,es:"La lluvia acabó con nuestros planes.",group:"acabar con",group_index:6,level:"B1"},{i:52,start:436.039,end:445.052,es:"El gobierno quiere acabar con la pobreza.",group:"acabar con",group_index:6,level:"B1"},{i:53,start:445.052,end:454.087,es:"Hay que acabar con el ruido en el edificio.",group:"acabar con",group_index:6,level:"B1"},{i:54,start:454.087,end:463.783,es:"Esta medicina acabó con mi dolor de cabeza.",group:"acabar con",group_index:6,level:"B1"},{i:55,start:463.783,end:473.671,es:"Quiero acabar con esta situación cuanto antes.",group:"acabar con",group_index:6,level:"B1"},{i:56,start:475.171,end:482.883,es:"¡Se acabó! Nos vamos a casa.",group:"expresiones",group_index:7,level:"A2"},{i:57,start:482.883,end:492.771,es:"Y colorín colorado, este cuento se ha acabado.",group:"expresiones",group_index:7,level:"A2"},{i:58,start:492.771,end:500.077,es:"Esto no acaba nunca.",group:"expresiones",group_index:7,level:"B1"},{i:59,start:500.077,end:508.365,es:"No acabo de entender la pregunta.",group:"expresiones",group_index:7,level:"B1"},{i:60,start:508.365,end:517.592,es:"No acabo de acostumbrarme a esta ciudad.",group:"expresiones",group_index:7,level:"B1"},{i:61,start:517.592,end:525.005,es:"Lo bueno se acaba pronto.",group:"expresiones",group_index:7,level:"B1"},{i:62,start:525.005,end:534.104,es:"No vas a salir esta noche, y se acabó.",group:"expresiones",group_index:7,level:"B1"}],Yu={word:Su,slug:Tu,kind:Pu,hash:Cu,duration:Hu,voice:Qu,marks:Du},Vu="conocer",Ou="conocer",Iu="word",Fu="6bbb6d374ca9a981",Ru=576.816,Uu="santa",Gu=[{i:0,start:.5,end:7.572,es:"Conozco a tu hermano.",group:"conocer a una persona",group_index:0,level:"A1"},{i:1,start:7.572,end:15.071,es:"No conozco a nadie aquí.",group:"conocer a una persona",group_index:0,level:"A1"},{i:2,start:15.071,end:22.377,es:"¿Conoces a mi vecina?",group:"conocer a una persona",group_index:0,level:"A1"},{i:3,start:22.377,end:31.028,es:"Ella conoce a todos en la oficina.",group:"conocer a una persona",group_index:0,level:"A1"},{i:4,start:31.028,end:39.807,es:"Conocemos al profesor de música.",group:"conocer a una persona",group_index:0,level:"A1"},{i:5,start:39.807,end:48.372,es:"Mis padres no conocen a mi jefe.",group:"conocer a una persona",group_index:0,level:"A1"},{i:6,start:48.372,end:57.428,es:"Yo conozco a la dueña del restaurante.",group:"conocer a una persona",group_index:0,level:"A1"},{i:7,start:57.428,end:66.228,es:"Te conozco desde hace muchos años.",group:"conocer a una persona",group_index:0,level:"A2"},{i:8,start:67.728,end:75.248,es:"No conozco esta ciudad.",group:"conocer un lugar",group_index:1,level:"A1"},{i:9,start:75.248,end:84.581,es:"Conozco un buen restaurante cerca de aquí.",group:"conocer un lugar",group_index:1,level:"A1"},{i:10,start:84.581,end:91.376,es:"¿Conoces México?",group:"conocer un lugar",group_index:1,level:"A1"},{i:11,start:91.376,end:99.28,es:"Mi abuela no conoce el mar.",group:"conocer un lugar",group_index:1,level:"A1"},{i:12,start:99.28,end:107.227,es:"Quiero conocer Buenos Aires.",group:"conocer un lugar",group_index:1,level:"A1"},{i:13,start:107.227,end:115.067,es:"Ya conocemos este museo.",group:"conocer un lugar",group_index:1,level:"A1"},{i:14,start:115.067,end:124.187,es:"El taxista conoce todas las calles.",group:"conocer un lugar",group_index:1,level:"A1"},{i:15,start:124.187,end:133.371,es:"Nunca he conocido un lugar tan tranquilo.",group:"conocer un lugar",group_index:1,level:"A2"},{i:16,start:134.871,end:142.54,es:"¿Conoces un buen médico?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:17,start:142.54,end:150.572,es:"¿Conoces algún hotel barato?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:18,start:150.572,end:159.009,es:"¿Conocen una tienda abierta ahora?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:19,start:159.009,end:168.641,es:"¿Conoces una buena película para esta noche?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:20,start:168.641,end:177.975,es:"Si conoces un buen mecánico, avísame.",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:21,start:177.975,end:187.607,es:"¿Conoces alguna receta fácil con pollo?",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:22,start:187.607,end:197.26,es:"Te recomiendo un café que conozco en el centro.",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:23,start:197.26,end:206.316,es:"¿Usted conoce a alguien que hable inglés?",group:"preguntas y recomendaciones",group_index:2,level:"B1"},{i:24,start:207.816,end:215.592,es:"Mucho gusto en conocerte.",group:"conocer por primera vez",group_index:3,level:"A1"},{i:25,start:215.592,end:224.605,es:"Conocí a mi novia en la universidad.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:26,start:224.605,end:232.637,es:"¿Dónde conociste a tu esposo?",group:"conocer por primera vez",group_index:3,level:"A2"},{i:27,start:232.637,end:242.163,es:"Nos conocimos en una fiesta de cumpleaños.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:28,start:242.163,end:250.621,es:"Ayer conocí a los padres de Carlos.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:29,start:250.621,end:259.4,es:"Mañana vas a conocer a mi familia.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:30,start:259.4,end:268.477,es:"Conocí a mi mejor amigo en el autobús.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:31,start:268.477,end:278.493,es:"Me encantaría conocer a tu hermana algún día.",group:"conocer por primera vez",group_index:3,level:"B1"},{i:32,start:279.993,end:286.788,es:"¿Ustedes se conocen?",group:"conocerse",group_index:4,level:"A1"},{i:33,start:286.788,end:295.823,es:"Nosotros nos conocemos desde niños.",group:"conocerse",group_index:4,level:"A2"},{i:34,start:295.823,end:304.281,es:"Ellos se conocieron en el trabajo.",group:"conocerse",group_index:4,level:"A2"},{i:35,start:304.281,end:312.783,es:"Nos conocimos hace diez años.",group:"conocerse",group_index:4,level:"A2"},{i:36,start:312.783,end:321.497,es:"Mis padres se conocieron en un tren.",group:"conocerse",group_index:4,level:"A2"},{i:37,start:321.497,end:332.239,es:"Me conozco muy bien y sé cuándo necesito descansar.",group:"conocerse",group_index:4,level:"B1"},{i:38,start:332.239,end:341.423,es:"Es importante conocerse a uno mismo.",group:"conocerse",group_index:4,level:"B1"},{i:39,start:342.923,end:351.744,es:"Conozco a Ana, pero no sé dónde vive.",group:"conocer y saber",group_index:5,level:"A2"},{i:40,start:351.744,end:361.76,es:"Conozco Madrid, pero no sé dónde está tu hotel.",group:"conocer y saber",group_index:5,level:"A2"},{i:41,start:361.76,end:371.904,es:"Sé su nombre, pero no lo conozco personalmente.",group:"conocer y saber",group_index:5,level:"A2"},{i:42,start:371.904,end:380.939,es:"Conozco la canción, pero no sé la letra.",group:"conocer y saber",group_index:5,level:"A2"},{i:43,start:380.939,end:391.637,es:"No conozco al nuevo director, solo sé que es muy serio.",group:"conocer y saber",group_index:5,level:"B1"},{i:44,start:391.637,end:403.083,es:"Conozco el camino, así que sé cuánto tiempo vamos a tardar.",group:"conocer y saber",group_index:5,level:"B1"},{i:45,start:403.083,end:413.803,es:"Aunque conozco bien el tema, no sé si podré explicarlo.",group:"conocer y saber",group_index:5,level:"B1"},{i:46,start:415.303,end:424.508,es:"Es un cantante muy conocido en su país.",group:"conocido y dar a conocer",group_index:6,level:"A2"},{i:47,start:424.508,end:433.607,es:"Esta ciudad es conocida por su comida.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:48,start:433.607,end:442.705,es:"El pintor es conocido en todo el mundo.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:49,start:442.705,end:451.249,es:"Lo conocen como el rey de la salsa.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:50,start:451.249,end:461.543,es:"La empresa dio a conocer su nuevo producto ayer.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:51,start:461.543,end:472.689,es:"Mañana van a dar a conocer los resultados del examen.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:52,start:472.689,end:482.812,es:"El pueblo es conocido como la capital del café.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:53,start:482.812,end:493.511,es:"El libro ayudó a dar a conocer la historia de la región.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:54,start:495.011,end:503,es:"Conozco muy bien a mi hermana.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A1"},{i:55,start:503,end:515.811,es:"Mi vecina me conoce de vista porque paso por su calle todos los días.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A2"},{i:56,start:515.811,end:525.507,es:"Lo conozco de vista, pero nunca hemos hablado.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A2"},{i:57,start:525.507,end:533.475,es:"Ella conoce el tema a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:58,start:533.475,end:543.917,es:"Antes de decidir, quiero conocer el proyecto a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:59,start:543.917,end:554.531,es:"No lo conocía bien, pero parecía una buena persona.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:60,start:554.531,end:566.424,es:"Para trabajar aquí, es necesario que conozcas bien el sistema.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:61,start:566.424,end:576.76,es:"Después de tantos viajes, conoce el país a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"}],Ku={word:Vu,slug:Ou,kind:Iu,hash:Fu,duration:Ru,voice:Uu,marks:Gu},Wu="dar",Ju="dar",Xu="word",Zu="235be104f0e6e885",ed=535.32,ad="santa",od=[{i:0,start:.5,end:8.553,es:"Te doy mi número de teléfono.",group:"dar, entregar",group_index:0,level:"A1"},{i:1,start:8.553,end:16.265,es:"¿Me das un vaso de agua?",group:"dar, entregar",group_index:0,level:"A1"},{i:2,start:16.265,end:25.449,es:"Mi abuela me da dinero en mi cumpleaños.",group:"dar, entregar",group_index:0,level:"A1"},{i:3,start:25.449,end:33.929,es:"El profesor nos da mucha tarea.",group:"dar, entregar",group_index:0,level:"A1"},{i:4,start:33.929,end:41.492,es:"¿Le das de comer al gato?",group:"dar, entregar",group_index:0,level:"A1"},{i:5,start:41.492,end:47.647,es:"Dame la mano.",group:"dar, entregar",group_index:0,level:"A1"},{i:6,start:47.647,end:57.193,es:"Los vecinos nos dan fruta de su jardín.",group:"dar, entregar",group_index:0,level:"A1"},{i:7,start:57.193,end:64.201,es:"¿Qué le damos a mamá?",group:"dar, entregar",group_index:0,level:"A1"},{i:8,start:64.201,end:71.657,es:"¿Me das la sal, por favor?",group:"dar, entregar",group_index:0,level:"A1"},{i:9,start:73.157,end:80.976,es:"Te doy las gracias por todo.",group:"dar las gracias",group_index:1,level:"A1"},{i:10,start:80.976,end:90.224,es:"Siempre damos las gracias al conductor.",group:"dar las gracias",group_index:1,level:"A1"},{i:11,start:90.224,end:99.109,es:"Quiero darle las gracias a tu madre.",group:"dar las gracias",group_index:1,level:"A1"},{i:12,start:99.109,end:106.352,es:"Hay que dar las gracias.",group:"dar las gracias",group_index:1,level:"A1"},{i:13,start:106.352,end:114.512,es:"Le di las gracias por el regalo.",group:"dar las gracias",group_index:1,level:"A2"},{i:14,start:114.512,end:122.949,es:"Los niños no dieron las gracias.",group:"dar las gracias",group_index:1,level:"A2"},{i:15,start:124.449,end:132.055,es:"Le di un beso a mi abuela.",group:"di, dio, daba",group_index:2,level:"A2"},{i:16,start:132.055,end:140.108,es:"Mi jefe me dio el día libre.",group:"di, dio, daba",group_index:2,level:"A2"},{i:17,start:140.108,end:147.735,es:"¿Quién te dio esa noticia?",group:"di, dio, daba",group_index:2,level:"A2"},{i:18,start:147.735,end:157.175,es:"Nos dieron una habitación con vista al mar.",group:"di, dio, daba",group_index:2,level:"A2"},{i:19,start:157.175,end:166.487,es:"Mi padre siempre me daba buenos consejos.",group:"di, dio, daba",group_index:2,level:"A2"},{i:20,start:166.487,end:174.433,es:"El médico me dio una receta.",group:"di, dio, daba",group_index:2,level:"A2"},{i:21,start:174.433,end:183.873,es:"Le dimos un regalo a nuestra profesora.",group:"di, dio, daba",group_index:2,level:"A2"},{i:22,start:185.373,end:193.725,es:"Después de comer, damos un paseo.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A1"},{i:23,start:193.725,end:202.931,es:"Mis abuelos dan un paseo cada tarde.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A1"},{i:24,start:202.931,end:211.923,es:"Vamos a dar una vuelta por el centro.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:25,start:211.923,end:220.552,es:"¿Quieres dar una vuelta en bicicleta?",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:26,start:220.552,end:228.989,es:"Ayer dimos un paseo por la playa.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:27,start:228.989,end:237.341,es:"Voy a dar una vuelta con el perro.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:28,start:237.341,end:247.4,es:"Dimos una vuelta por el mercado antes de cenar.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:29,start:248.9,end:256.399,es:"Me dan miedo las arañas.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:30,start:256.399,end:264.687,es:"A mi hijo le da miedo la oscuridad.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:31,start:264.687,end:273.188,es:"Me da vergüenza hablar en público.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:32,start:273.188,end:282.073,es:"¿No te da vergüenza llegar tan tarde?",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:33,start:282.073,end:290.468,es:"Me da pena ver a ese perro solo.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:34,start:290.468,end:299.289,es:"Nos dio mucha pena dejar la ciudad.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:35,start:299.289,end:307.684,es:"Esa película me dio mucho miedo.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:36,start:307.684,end:317.081,es:"Le da vergüenza bailar delante de todos.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:37,start:318.581,end:324.821,es:"Me da igual.",group:"dar igual",group_index:5,level:"A1"},{i:38,start:324.821,end:332.789,es:"¿Pizza o pasta? Me da igual.",group:"dar igual",group_index:5,level:"A1"},{i:39,start:332.789,end:342.592,es:"Nos da igual el precio, queremos un buen hotel.",group:"dar igual",group_index:5,level:"A2"},{i:40,start:342.592,end:350.624,es:"¿Te da igual si vamos mañana?",group:"dar igual",group_index:5,level:"A2"},{i:41,start:350.624,end:360.107,es:"Antes me importaba, pero ahora me da igual.",group:"dar igual",group_index:5,level:"A2"},{i:42,start:360.107,end:367.499,es:"Da igual, no pasa nada.",group:"dar igual",group_index:5,level:"A2"},{i:43,start:367.499,end:377.131,es:"A ella le da igual lo que piensen los demás.",group:"dar igual",group_index:5,level:"B1"},{i:44,start:378.631,end:384.892,es:"¡Date prisa!",group:"darse prisa",group_index:6,level:"A1"},{i:45,start:384.892,end:393.351,es:"Dense prisa, el tren sale ahora.",group:"darse prisa",group_index:6,level:"A2"},{i:46,start:393.351,end:402.833,es:"Si no nos damos prisa, vamos a llegar tarde.",group:"darse prisa",group_index:6,level:"A2"},{i:47,start:402.833,end:410.929,es:"Me di prisa y llegué a tiempo.",group:"darse prisa",group_index:6,level:"A2"},{i:48,start:410.929,end:418.983,es:"No hace falta que te des prisa.",group:"darse prisa",group_index:6,level:"B1"},{i:49,start:420.483,end:427.832,es:"No me di cuenta de la hora.",group:"darse cuenta",group_index:7,level:"A2"},{i:50,start:427.832,end:436.099,es:"¿Te diste cuenta de que no estaba?",group:"darse cuenta",group_index:7,level:"A2"},{i:51,start:436.099,end:444.408,es:"Me di cuenta demasiado tarde.",group:"darse cuenta",group_index:7,level:"A2"},{i:52,start:444.408,end:455.171,es:"De repente me di cuenta de que había perdido las llaves.",group:"darse cuenta",group_index:7,level:"B1"},{i:53,start:455.171,end:463.245,es:"Nadie se dio cuenta del error.",group:"darse cuenta",group_index:7,level:"B1"},{i:54,start:463.245,end:471.981,es:"Cuando te des cuenta, ya será tarde.",group:"darse cuenta",group_index:7,level:"B1"},{i:55,start:471.981,end:481.571,es:"Es importante que se den cuenta del problema.",group:"darse cuenta",group_index:7,level:"B1"},{i:56,start:481.571,end:490.605,es:"Por fin me he dado cuenta de lo que quiero.",group:"darse cuenta",group_index:7,level:"B1"},{i:57,start:492.105,end:499.412,es:"La ventana da al mar.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:58,start:499.412,end:508.169,es:"Mi habitación da a un patio tranquilo.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:59,start:508.169,end:517.311,es:"Queremos una habitación que dé a la calle.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:60,start:517.311,end:526.217,es:"La puerta de la cocina da al jardín.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:61,start:526.217,end:535.252,es:"El balcón daba a una plaza muy bonita.",group:"dar a, mirar hacia",group_index:8,level:"B1"}],rd={word:Wu,slug:Ju,kind:Xu,hash:Zu,duration:ed,voice:ad,marks:od},sd="dejar",nd="dejar",ld="word",id="3cef3f12e6775ada",td=490.152,ud="santa",dd=[{i:0,start:.5,end:7.465,es:"Deja tu abrigo aquí.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:1,start:7.465,end:14.9,es:"¿Dónde dejo las llaves?",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:2,start:14.9,end:22.335,es:"Dejo el auto en la calle.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:3,start:22.335,end:30.751,es:"Siempre dejo la ventana abierta.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:4,start:30.751,end:38.783,es:"Deja los zapatos en la puerta.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:5,start:38.783,end:46.58,es:"Dejé el teléfono en casa.",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:6,start:46.58,end:54.143,es:"¿Dónde dejaste mi libro?",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:7,start:54.143,end:63.135,es:"Te dejé un poco de pastel en la cocina.",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:8,start:64.635,end:71.963,es:"¿Me dejas ir al baño?",group:"dejar, permitir",group_index:1,level:"A1"},{i:9,start:71.963,end:77.989,es:"Déjame ver.",group:"dejar, permitir",group_index:1,level:"A1"},{i:10,start:77.989,end:85.957,es:"Mi madre no me deja salir.",group:"dejar, permitir",group_index:1,level:"A1"},{i:11,start:85.957,end:92.773,es:"Déjame ayudarte.",group:"dejar, permitir",group_index:1,level:"A1"},{i:12,start:92.773,end:100.72,es:"El ruido no me deja dormir.",group:"dejar, permitir",group_index:1,level:"A1"},{i:13,start:100.72,end:109.115,es:"¿Me dejas usar tu computadora?",group:"dejar, permitir",group_index:1,level:"A1"},{i:14,start:109.115,end:120.048,es:"Mis padres nunca me dejaban ver televisión de noche.",group:"dejar, permitir",group_index:1,level:"A2"},{i:15,start:120.048,end:128.549,es:"No me dejaron entrar sin entrada.",group:"dejar, permitir",group_index:1,level:"A2"},{i:16,start:130.049,end:136.759,es:"No me dejes solo.",group:"dejar a alguien",group_index:2,level:"A1"},{i:17,start:136.759,end:143.681,es:"Te dejo en la esquina.",group:"dejar a alguien",group_index:2,level:"A1"},{i:18,start:143.681,end:150.369,es:"Mi novia me dejó.",group:"dejar a alguien",group_index:2,level:"A2"},{i:19,start:150.369,end:158.359,es:"Dejé a los niños con mi madre.",group:"dejar a alguien",group_index:2,level:"A2"},{i:20,start:158.359,end:166.625,es:"Mi padre me dejó en la estación.",group:"dejar a alguien",group_index:2,level:"A2"},{i:21,start:166.625,end:176.065,es:"Él la dejó después de cinco años juntos.",group:"dejar a alguien",group_index:2,level:"A2"},{i:22,start:176.065,end:184.268,es:"Nunca voy a dejar a mis amigos.",group:"dejar a alguien",group_index:2,level:"A2"},{i:23,start:185.768,end:192.264,es:"¡Deja de gritar!",group:"dejar de + infinitivo",group_index:3,level:"A1"},{i:24,start:192.264,end:200.424,es:"Dejé de fumar el año pasado.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:25,start:200.424,end:208.264,es:"Por fin ha dejado de llover.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:26,start:208.264,end:217.597,es:"Mi hermano dejó de trabajar en el banco.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:27,start:217.597,end:226.739,es:"Tienes que dejar de comer tanto azúcar.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:28,start:226.739,end:236.84,es:"Cuando nació mi hijo, dejé de salir por la noche.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:29,start:236.84,end:245.661,es:"Quiero dejar de preocuparme por todo.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:30,start:245.661,end:253.693,es:"El reloj dejó de funcionar.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:31,start:255.193,end:262.905,es:"Dejé mi trabajo en marzo.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:32,start:262.905,end:270.724,es:"Ella dejó la universidad.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:33,start:270.724,end:277.839,es:"Quiero dejar el café.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:34,start:277.839,end:287.279,es:"Dejamos el gimnasio porque era muy caro.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:35,start:287.279,end:296.825,es:"Mi abuelo dejó el tabaco hace diez años.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:36,start:296.825,end:305.113,es:"No pienso dejar mis estudios.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:37,start:306.613,end:314.368,es:"El bebé no deja de llorar.",group:"no dejar de",group_index:5,level:"A2"},{i:38,start:314.368,end:323.872,es:"Mi vecino no dejó de hablar en toda la cena.",group:"no dejar de",group_index:5,level:"A2"},{i:39,start:323.872,end:332.053,es:"No dejes de visitar el mercado.",group:"no dejar de",group_index:5,level:"B1"},{i:40,start:332.053,end:339.573,es:"No dejo de pensar en ti.",group:"no dejar de",group_index:5,level:"B1"},{i:41,start:339.573,end:348.629,es:"No dejen de probar la sopa de la casa.",group:"no dejar de",group_index:5,level:"B1"},{i:42,start:348.629,end:357.003,es:"No dejes de llamarme cuando llegues.",group:"no dejar de",group_index:5,level:"B1"},{i:43,start:357.003,end:366.912,es:"Aunque esté cansado, no deja de ir al gimnasio.",group:"no dejar de",group_index:5,level:"B1"},{i:44,start:368.412,end:376.913,es:"Deja la puerta cerrada, por favor.",group:"dejar + participio o adjetivo",group_index:6,level:"A2"},{i:45,start:376.913,end:384.263,es:"Dejé la cena preparada.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:46,start:384.263,end:392.508,es:"La noticia me dejó preocupado.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:47,start:392.508,end:400.903,es:"Dejamos todo listo para el viaje.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:48,start:400.903,end:408.807,es:"El examen me dejó agotado.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:49,start:408.807,end:417.201,es:"El viaje nos dejó muy contentos.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:50,start:417.201,end:425.916,es:"Ya dejé pagada la cuenta del hotel.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:51,start:427.416,end:435.491,es:"Sin querer, dejé caer el plato.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:52,start:435.491,end:442.605,es:"Déjalo, no importa.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:53,start:442.605,end:449.976,es:"Deja eso para mañana.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:54,start:449.976,end:456.365,es:"Déjame en paz.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:55,start:456.365,end:464.056,es:"Deja que lo piense un poco.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:56,start:464.056,end:472.28,es:"Dejemos el tema para otro día.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:57,start:472.28,end:482.104,es:"No dejes para mañana lo que puedas hacer hoy.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:58,start:482.104,end:490.093,es:"Eso deja mucho que desear.",group:"expresiones con dejar",group_index:7,level:"B1"}],pd={word:sd,slug:nd,kind:ld,hash:id,duration:td,voice:ud,marks:dd},gd="echar",cd="echar",vd="word",md="7da375f15458d999",_d=526.056,xd="santa",Ad=[{i:0,start:.5,end:7.828,es:"Echa la pelota al perro.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:1,start:7.828,end:15.497,es:"Echo la carta en el buzón.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:2,start:15.497,end:24.02,es:"Los niños echan piedras al río.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:3,start:24.02,end:31.967,es:"¿Puedes echar esto a la basura?",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:4,start:31.967,end:39.444,es:"Ella echa pan a los patos.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:5,start:39.444,end:47.071,es:"No eches papeles al suelo.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:6,start:47.071,end:55.401,es:"Echamos una moneda a la fuente.",group:"echar, lanzar algo",group_index:0,level:"A2"},{i:7,start:56.901,end:64.997,es:"Echa un poco de sal a la sopa.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:8,start:64.997,end:72.773,es:"¿Le echas azúcar al café?",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:9,start:72.773,end:80.272,es:"Yo no echo leche al té.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:10,start:80.272,end:87.877,es:"Echa más agua a la olla.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:11,start:87.877,end:96.421,es:"Mi abuela echa mucho ajo a todo.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:12,start:96.421,end:105.072,es:"Echa un poco de hielo a la limonada.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:13,start:105.072,end:113.872,es:"¿Cuánto aceite le echo a la ensalada?",group:"echar en la comida y la bebida",group_index:1,level:"A2"},{i:14,start:113.872,end:122.736,es:"Le eché demasiada pimienta a la carne.",group:"echar en la comida y la bebida",group_index:1,level:"A2"},{i:15,start:124.236,end:132.993,es:"¿Me echas una mano con estas cajas?",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:16,start:132.993,end:141.772,es:"Mi vecino siempre me echa una mano.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:17,start:141.772,end:149.697,es:"Te echo una mano con la cena.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:18,start:149.697,end:159.585,es:"Ayer le eché una mano a mi hermano con la mudanza.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:19,start:159.585,end:168.321,es:"¿Puedes echar un vistazo a mi trabajo?",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:20,start:168.321,end:176.78,es:"Voy a echar un vistazo a la tienda.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:21,start:176.78,end:185.324,es:"Echa un vistazo al bebé, por favor.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:22,start:185.324,end:194.593,es:"El mecánico le echó un vistazo al motor.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:23,start:196.093,end:203.891,es:"El perro se echa en el sofá.",group:"echarse, acostarse",group_index:3,level:"A1"},{i:24,start:203.891,end:212.733,es:"Estoy cansado, voy a echarme un rato.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:25,start:212.733,end:221.192,es:"Después de comer, me eché en la cama.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:26,start:221.192,end:231.037,es:"Mi padre se echa en la hamaca todas las tardes.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:27,start:231.037,end:240.328,es:"Nos echamos en la arena a tomar el sol.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:28,start:240.328,end:249.555,es:"Échate un momento si te duele la cabeza.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:29,start:249.555,end:258.44,es:"El gato se echó al lado de la ventana.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:30,start:259.94,end:266.692,es:"¿Me echas de menos?",group:"echar de menos",group_index:4,level:"A1"},{i:31,start:266.692,end:274.489,es:"Echo de menos a mi familia.",group:"echar de menos",group_index:4,level:"A2"},{i:32,start:274.489,end:283.396,es:"Echamos de menos la comida de casa.",group:"echar de menos",group_index:4,level:"A2"},{i:33,start:283.396,end:293.113,es:"Cuando vivía lejos, echaba de menos el mar.",group:"echar de menos",group_index:4,level:"A2"},{i:34,start:293.113,end:300.911,es:"Te he echado mucho de menos.",group:"echar de menos",group_index:4,level:"A2"},{i:35,start:300.911,end:311.076,es:"Mi hija echa de menos a sus amigos del colegio.",group:"echar de menos",group_index:4,level:"A2"},{i:36,start:311.076,end:319.769,es:"Voy a echar de menos esta ciudad.",group:"echar de menos",group_index:4,level:"A2"},{i:37,start:319.769,end:331.321,es:"Nadie echó de menos la televisión durante las vacaciones.",group:"echar de menos",group_index:4,level:"A2"},{i:38,start:332.821,end:341.899,es:"Mi madre echó a los niños de la cocina.",group:"echar a alguien",group_index:5,level:"A2"},{i:39,start:341.899,end:351.232,es:"Lo echaron del trabajo por llegar tarde.",group:"echar a alguien",group_index:5,level:"B1"},{i:40,start:351.232,end:361.483,es:"El dueño nos echó del restaurante a medianoche.",group:"echar a alguien",group_index:5,level:"B1"},{i:41,start:361.483,end:370.603,es:"Si no pagas el alquiler, te van a echar.",group:"echar a alguien",group_index:5,level:"B1"},{i:42,start:370.603,end:379.445,es:"Echaron a dos jugadores del partido.",group:"echar a alguien",group_index:5,level:"B1"},{i:43,start:379.445,end:389.568,es:"Me echaron de la biblioteca por hablar por teléfono.",group:"echar a alguien",group_index:5,level:"B1"},{i:44,start:389.568,end:399.221,es:"No creo que te echen por un error tan pequeño.",group:"echar a alguien",group_index:5,level:"B1"},{i:45,start:400.721,end:409.905,es:"Cuando vio al perro, el niño echó a correr.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:46,start:409.905,end:418.577,es:"Al oír la noticia, se echó a llorar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:47,start:418.577,end:427.249,es:"De repente, todos se echaron a reír.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:48,start:427.249,end:434.705,es:"El pájaro echó a volar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:49,start:434.705,end:444.743,es:"Cuando abrieron la puerta, la gente echó a andar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:50,start:444.743,end:453.841,es:"Si le dices eso, se va a echar a llorar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:51,start:453.841,end:464.071,es:"Empezó a llover y echamos a correr hacia la casa.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:52,start:465.571,end:473.496,es:"Siempre me echa la culpa a mí.",group:"expresiones con echar",group_index:7,level:"B1"},{i:53,start:473.496,end:481.891,es:"El calor echó a perder la fruta.",group:"expresiones con echar",group_index:7,level:"B1"},{i:54,start:481.891,end:490.819,es:"No eches a perder esta oportunidad.",group:"expresiones con echar",group_index:7,level:"B1"},{i:55,start:490.819,end:499.469,es:"Siempre me echa en cara mis errores.",group:"expresiones con echar",group_index:7,level:"B1"},{i:56,start:499.469,end:508.184,es:"Estaba tan furioso que echaba humo.",group:"expresiones con echar",group_index:7,level:"B1"},{i:57,start:508.184,end:517.581,es:"Me gustaría echar raíces en este pueblo.",group:"expresiones con echar",group_index:7,level:"B1"},{i:58,start:517.581,end:525.997,es:"No le eches más leña al fuego.",group:"expresiones con echar",group_index:7,level:"B1"}],hd={word:gd,slug:cd,kind:vd,hash:md,duration:_d,voice:xd,marks:Ad},bd="faltar / hacer falta",qd="faltar_hacer_falta",fd="word",yd="f09fa2f79ea13a70",jd=495.528,Bd="santa",zd=[{i:0,start:.5,end:7.081,es:"Me falta dinero.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:1,start:7.081,end:13.3,es:"¿Qué te falta?",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:2,start:13.3,end:20.735,es:"A la sopa le falta sal.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:3,start:20.735,end:28.084,es:"Nos faltan dos sillas.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:4,start:28.084,end:36.244,es:"A mi camisa le falta un botón.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:5,start:36.244,end:43.679,es:"Te falta una firma aquí.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:6,start:43.679,end:52.329,es:"Me faltan tres páginas del libro.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:7,start:52.329,end:60.767,es:"A este equipo le falta un jugador.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:8,start:62.267,end:69.701,es:"Falta poco para llegar.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:9,start:69.701,end:78.48,es:"Faltan dos días para mi cumpleaños.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:10,start:78.48,end:86.171,es:"¿Cuánto falta para el verano?",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:11,start:86.171,end:94.992,es:"Faltan cinco minutos para las nueve.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:12,start:94.992,end:102.533,es:"Ya falta poco, niños.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:13,start:102.533,end:112.656,es:"Todavía faltan tres semanas para las vacaciones.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:14,start:112.656,end:120.517,es:"¿Cuántas estaciones faltan?",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:15,start:120.517,end:128.997,es:"Solo falta una semana para la boda.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:16,start:130.497,end:138.017,es:"En la fiesta faltó comida.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:17,start:138.017,end:147.201,es:"Me faltó tiempo para terminar el examen.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:18,start:147.201,end:155.468,es:"Cuando llegamos, faltaba el postre.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:19,start:155.468,end:164.524,es:"Siempre nos faltaba dinero a fin de mes.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:20,start:164.524,end:171.916,es:"¿Quién faltó a la reunión?",group:"faltó, faltaba",group_index:2,level:"A2"},{i:21,start:171.916,end:180.887,es:"Faltó agua en el barrio toda la semana.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:22,start:180.887,end:190.049,es:"Faltaban diez minutos para la medianoche.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:23,start:191.549,end:200.499,es:"Hoy falto a clase porque estoy enfermo.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A1"},{i:24,start:200.499,end:207.869,es:"Nunca falto al trabajo.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A1"},{i:25,start:207.869,end:216.349,es:"Mi hijo faltó a clase dos días.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:26,start:216.349,end:223.656,es:"¿Por qué faltaste ayer?",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:27,start:223.656,end:232.861,es:"Si faltas mucho, vas a perder el curso.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:28,start:232.861,end:241.171,es:"Ella nunca ha faltado a una cita.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:29,start:241.171,end:249.053,es:"No quiero faltar a tu fiesta.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:30,start:250.553,end:257.967,es:"Hace falta paciencia.",group:"hace falta + nombre",group_index:4,level:"A1"},{i:31,start:257.967,end:265.145,es:"¿Te hace falta algo?",group:"hace falta + nombre",group_index:4,level:"A1"},{i:32,start:265.145,end:273.327,es:"Me hace falta un abrigo nuevo.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:33,start:273.327,end:281.252,es:"Nos hacen falta más platos.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:34,start:281.252,end:290.692,es:"Para este trabajo hace falta experiencia.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:35,start:290.692,end:299.663,es:"En esta casa hace falta más luz.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:36,start:299.663,end:308.1,es:"Te hacen falta unas vacaciones.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:37,start:308.1,end:315.705,es:"Le hacía falta un amigo.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:38,start:317.205,end:324.853,es:"Hace falta estudiar más.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:39,start:324.853,end:332.48,es:"No hace falta pagar ahora.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:40,start:332.48,end:340.277,es:"¿Hace falta reservar mesa?",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:41,start:340.277,end:348.395,es:"No hace falta llevar paraguas.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:42,start:348.395,end:358.347,es:"Para viajar allí hace falta tener pasaporte.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:43,start:358.347,end:367.509,es:"Gracias, pero no hacía falta traer nada.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:44,start:367.509,end:377.013,es:"Hará falta comprar más comida para el sábado.",group:"hace falta + infinitivo",group_index:5,level:"B1"},{i:45,start:378.513,end:386.055,es:"No hace falta que vengas.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:46,start:386.055,end:393.895,es:"No hace falta que me esperes.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:47,start:393.895,end:402.14,es:"No hace falta que traigan nada.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:48,start:402.14,end:409.703,es:"¿Hace falta que lo repita?",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:49,start:409.703,end:419.185,es:"Hace falta que alguien hable con el director.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:50,start:419.185,end:427.644,es:"No hacía falta que te molestaras.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:51,start:427.644,end:436.913,es:"No hace falta que me lo expliques otra vez.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:52,start:438.413,end:444.824,es:"¡Lo que faltaba!",group:"expresiones",group_index:7,level:"A2"},{i:53,start:444.824,end:452.152,es:"Me haces mucha falta.",group:"expresiones",group_index:7,level:"B1"},{i:54,start:452.152,end:460.781,es:"No le faltes el respeto a tu abuela.",group:"expresiones",group_index:7,level:"B1"},{i:55,start:460.781,end:470.648,es:"Vivo lejos y me hace mucha falta mi familia.",group:"expresiones",group_index:7,level:"B1"},{i:56,start:470.648,end:479.917,es:"Faltó poco para que perdiéramos el avión.",group:"expresiones",group_index:7,level:"B1"},{i:57,start:479.917,end:488.056,es:"No faltaría más, pase usted.",group:"expresiones",group_index:7,level:"B1"},{i:58,start:488.056,end:495.469,es:"Aquí no nos falta nada.",group:"expresiones",group_index:7,level:"B1"}],Md={word:bd,slug:qd,kind:fd,hash:yd,duration:jd,voice:Bd,marks:zd},Ed="haber",$d="haber",kd="word",Nd="80ba1fe6f2d9be35",wd=502.392,Ld="santa",Sd=[{i:0,start:.5,end:7.849,es:"Hay un perro en el jardín.",group:"hay",group_index:0,level:"A1"},{i:1,start:7.849,end:15.903,es:"¿Hay leche en el refrigerador?",group:"hay",group_index:0,level:"A1"},{i:2,start:15.903,end:21.865,es:"No hay pan.",group:"hay",group_index:0,level:"A1"},{i:3,start:21.865,end:30.025,es:"Hay muchas personas en la calle.",group:"hay",group_index:0,level:"A1"},{i:4,start:30.025,end:38.527,es:"En mi clase hay veinte estudiantes.",group:"hay",group_index:0,level:"A1"},{i:5,start:38.527,end:46.367,es:"¿Hay un banco cerca de aquí?",group:"hay",group_index:0,level:"A1"},{i:6,start:46.367,end:52.969,es:"Hoy no hay clase.",group:"hay",group_index:0,level:"A1"},{i:7,start:52.969,end:61.087,es:"Hay dos camas en la habitación.",group:"hay",group_index:0,level:"A1"},{i:8,start:61.087,end:67.796,es:"¿Qué hay para comer?",group:"hay",group_index:0,level:"A1"},{i:9,start:69.296,end:75.92,es:"Hay que comer bien.",group:"hay que",group_index:1,level:"A1"},{i:10,start:75.92,end:83.013,es:"Hay que llegar temprano.",group:"hay que",group_index:1,level:"A1"},{i:11,start:83.013,end:90.32,es:"Hay que tener paciencia.",group:"hay que",group_index:1,level:"A1"},{i:12,start:90.32,end:97.456,es:"Hay que lavar los platos.",group:"hay que",group_index:1,level:"A1"},{i:13,start:97.456,end:104.805,es:"Hay que hablar con ella hoy.",group:"hay que",group_index:1,level:"A1"},{i:14,start:104.805,end:113.541,es:"Para entrar, hay que comprar una entrada.",group:"hay que",group_index:1,level:"A2"},{i:15,start:113.541,end:120.571,es:"No hay que pagar nada.",group:"hay que",group_index:1,level:"A2"},{i:16,start:120.571,end:127.856,es:"No hay que preocuparse.",group:"hay que",group_index:1,level:"A2"},{i:17,start:129.356,end:136.364,es:"He comido demasiado.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:18,start:136.364,end:143.713,es:"¿Has visto mi teléfono?",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:19,start:143.713,end:152.812,es:"Hemos vivido aquí durante cinco años.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:20,start:152.812,end:160.524,es:"Todavía no he terminado.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:21,start:160.524,end:167.511,es:"Ya ha llegado el tren.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:22,start:167.511,end:175.991,es:"¿Alguna vez has estado en México?",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:23,start:175.991,end:183.447,es:"Nunca he probado el mole.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:24,start:183.447,end:191.5,es:"Esta semana ha llovido mucho.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:25,start:191.5,end:200.151,es:"Mis padres han vuelto de su viaje.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:26,start:201.651,end:209.64,es:"Había mucha gente en la fiesta.",group:"había, hubo",group_index:3,level:"A2"},{i:27,start:209.64,end:218.227,es:"Antes había un cine en esta calle.",group:"había, hubo",group_index:3,level:"A2"},{i:28,start:218.227,end:225.491,es:"No había nadie en casa.",group:"había, hubo",group_index:3,level:"A2"},{i:29,start:225.491,end:233.416,es:"¿Había agua caliente en el hotel?",group:"había, hubo",group_index:3,level:"A2"},{i:30,start:233.416,end:242.024,es:"Ayer hubo un accidente en la autopista.",group:"había, hubo",group_index:3,level:"A2"},{i:31,start:242.024,end:249.971,es:"Hubo un problema con mi tarjeta.",group:"había, hubo",group_index:3,level:"A2"},{i:32,start:249.971,end:258.813,es:"Anoche hubo una tormenta muy fuerte.",group:"había, hubo",group_index:3,level:"A2"},{i:33,start:258.813,end:267.421,es:"Cuando era niño, no había internet.",group:"había, hubo",group_index:3,level:"A2"},{i:34,start:268.921,end:278.532,es:"Cuando llegué, la película ya había empezado.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:35,start:278.532,end:286.777,es:"Nunca había visto tanta nieve.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:36,start:286.777,end:295.513,es:"Me dijo que había perdido las llaves.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:37,start:295.513,end:303.823,es:"Ya habíamos cenado cuando llamaste.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:38,start:303.823,end:311.556,es:"No sabía que habías vuelto.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:39,start:311.556,end:320.185,es:"Pensé que te habías olvidado de mí.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:40,start:320.185,end:330.607,es:"Mis amigos ya habían salido cuando empezó a llover.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:41,start:332.107,end:340.203,es:"Mañana habrá mucho tráfico.",group:"habrá, habría",group_index:5,level:"B1"},{i:42,start:340.203,end:347.616,es:"¿Habrá tiempo para comer?",group:"habrá, habría",group_index:5,level:"B1"},{i:43,start:347.616,end:355.349,es:"No contesta. Habrá salido.",group:"habrá, habría",group_index:5,level:"B1"},{i:44,start:355.349,end:365.323,es:"Para el viernes ya habré terminado el informe.",group:"habrá, habría",group_index:5,level:"B1"},{i:45,start:365.323,end:372.949,es:"Yo habría hecho lo mismo.",group:"habrá, habría",group_index:5,level:"B1"},{i:46,start:372.949,end:383.264,es:"Habría más trabajo si la tienda abriera los domingos.",group:"habrá, habría",group_index:5,level:"B1"},{i:47,start:383.264,end:391.787,es:"Me dijeron que habría una reunión.",group:"habrá, habría",group_index:5,level:"B1"},{i:48,start:393.287,end:401.404,es:"Espero que haya mesas libres.",group:"haya, hubiera",group_index:6,level:"B1"},{i:49,start:401.404,end:409.927,es:"No creo que haya llegado todavía.",group:"haya, hubiera",group_index:6,level:"B1"},{i:50,start:409.927,end:417.852,es:"Me alegro de que hayas venido.",group:"haya, hubiera",group_index:6,level:"B1"},{i:51,start:417.852,end:426.012,es:"Cuando hayas terminado, llámame.",group:"haya, hubiera",group_index:6,level:"B1"},{i:52,start:426.012,end:434.279,es:"Ojalá haya buen tiempo mañana.",group:"haya, hubiera",group_index:6,level:"B1"},{i:53,start:434.279,end:442.247,es:"No creo que hayas entendido.",group:"haya, hubiera",group_index:6,level:"B1"},{i:54,start:442.247,end:450.94,es:"Me sorprendió que no hubiera nadie.",group:"haya, hubiera",group_index:6,level:"B1"},{i:55,start:452.44,end:458.424,es:"No hay de qué.",group:"expresiones",group_index:7,level:"A1"},{i:56,start:458.424,end:465.005,es:"¿Qué hay de nuevo?",group:"expresiones",group_index:7,level:"A2"},{i:57,start:465.005,end:471.181,es:"No hay prisa.",group:"expresiones",group_index:7,level:"A2"},{i:58,start:471.181,end:478.68,es:"Ha habido un cambio de planes.",group:"expresiones",group_index:7,level:"B1"},{i:59,start:478.68,end:485.667,es:"No hay nada que hacer.",group:"expresiones",group_index:7,level:"B1"},{i:60,start:485.667,end:493.827,es:"No hay mal que por bien no venga.",group:"expresiones",group_index:7,level:"B1"},{i:61,start:493.827,end:502.328,es:"No hay manera de abrir esta puerta.",group:"expresiones",group_index:7,level:"B1"}],Td={word:Ed,slug:$d,kind:kd,hash:Nd,duration:wd,voice:Ld,marks:Sd},Pd="hacer",Cd="hacer",Hd="word",Qd="60a1ce9405fc01a5",Dd=506.76,Yd="santa",Vd=[{i:0,start:.5,end:6.313,es:"¿Qué haces?",group:"hacer, actividades",group_index:0,level:"A1"},{i:1,start:6.313,end:14.559,es:"Hago la tarea después de cenar.",group:"hacer, actividades",group_index:0,level:"A1"},{i:2,start:14.559,end:23.38,es:"Mi padre hace la comida los domingos.",group:"hacer, actividades",group_index:0,level:"A1"},{i:3,start:23.38,end:32.159,es:"¿Qué hacen ustedes los fines de semana?",group:"hacer, actividades",group_index:0,level:"A1"},{i:4,start:32.159,end:40.639,es:"Hago ejercicio todas las mañanas.",group:"hacer, actividades",group_index:0,level:"A1"},{i:5,start:40.639,end:47.625,es:"Siempre hago la cama.",group:"hacer, actividades",group_index:0,level:"A1"},{i:6,start:47.625,end:56.041,es:"Mi madre hace un pastel muy rico.",group:"hacer, actividades",group_index:0,level:"A1"},{i:7,start:56.041,end:63.433,es:"No hago nada los sábados.",group:"hacer, actividades",group_index:0,level:"A1"},{i:8,start:63.433,end:71.167,es:"¿Qué vas a hacer esta noche?",group:"hacer, actividades",group_index:0,level:"A1"},{i:9,start:72.667,end:79.845,es:"Hoy hace mucho frío.",group:"el tiempo",group_index:1,level:"A1"},{i:10,start:79.845,end:87.173,es:"En verano hace calor.",group:"el tiempo",group_index:1,level:"A1"},{i:11,start:87.173,end:94.8,es:"Hace sol, vamos al parque.",group:"el tiempo",group_index:1,level:"A1"},{i:12,start:94.8,end:102.043,es:"Hace viento en la playa.",group:"el tiempo",group_index:1,level:"A1"},{i:13,start:102.043,end:109.989,es:"¿Qué tiempo hace en tu ciudad?",group:"el tiempo",group_index:1,level:"A1"},{i:14,start:109.989,end:118.043,es:"Hace buen tiempo para caminar.",group:"el tiempo",group_index:1,level:"A1"},{i:15,start:118.043,end:125.605,es:"Hoy hace un día precioso.",group:"el tiempo",group_index:1,level:"A1"},{i:16,start:125.605,end:132.933,es:"Ayer hizo mucho calor.",group:"el tiempo",group_index:1,level:"A2"},{i:17,start:134.433,end:141.612,es:"¿Puedo hacer una pregunta?",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A1"},{i:18,start:141.612,end:150.86,es:"Los estudiantes hacen muchas preguntas.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A1"},{i:19,start:150.86,end:159.041,es:"Tenemos que hacer fila para entrar.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:20,start:159.041,end:167.073,es:"Hicimos fila durante una hora.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:21,start:167.073,end:175.105,es:"Todavía no he hecho la maleta.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:22,start:175.105,end:185.185,es:"Siempre hago la maleta la noche antes del viaje.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:23,start:185.185,end:194.903,es:"El periodista le hizo una pregunta difícil.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:24,start:196.403,end:203.069,es:"¿Qué hiciste ayer?",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:25,start:203.069,end:211.059,es:"No hice nada el fin de semana.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:26,start:211.059,end:219.197,es:"Mi hermano hizo la cena anoche.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:27,start:219.197,end:228.019,es:"De niños hacíamos castillos de arena.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:28,start:228.019,end:235.24,es:"¿Ya has hecho la tarea?",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:29,start:235.24,end:243.379,es:"Hemos hecho un viaje increíble.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:30,start:243.379,end:250.28,es:"Lo hice sin pensar.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:31,start:250.28,end:257.651,es:"¿Qué hacías a esa hora?",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:32,start:259.151,end:266.415,es:"Llegué hace dos horas.",group:"hace, pasado",group_index:4,level:"A2"},{i:33,start:266.415,end:275.727,es:"Hace un año que nos conocimos en Madrid.",group:"hace, pasado",group_index:4,level:"A2"},{i:34,start:275.727,end:282.5,es:"La vi hace poco.",group:"hace, pasado",group_index:4,level:"A2"},{i:35,start:282.5,end:291.684,es:"Hace tres días que hablamos por teléfono.",group:"hace, pasado",group_index:4,level:"A2"},{i:36,start:291.684,end:301.721,es:"Mis abuelos se casaron hace cincuenta años.",group:"hace, pasado",group_index:4,level:"A2"},{i:37,start:301.721,end:310.479,es:"Hace mucho tiempo vivía en el campo.",group:"hace, pasado",group_index:4,level:"A2"},{i:38,start:310.479,end:318.809,es:"¿Cuánto tiempo hace que llegaste?",group:"hace, pasado",group_index:4,level:"A2"},{i:39,start:318.809,end:328.079,es:"Terminé la universidad hace diez años.",group:"hace, pasado",group_index:4,level:"A2"},{i:40,start:329.579,end:338.293,es:"Hace dos años que estudio español.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:41,start:338.293,end:346.667,es:"Hace mucho tiempo que no te veo.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:42,start:346.667,end:355.168,es:"¿Cuánto tiempo hace que vives aquí?",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:43,start:355.168,end:363.648,es:"Hace una hora que espero el autobús.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:44,start:363.648,end:371.125,es:"Hace meses que no llueve.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:45,start:371.125,end:379.691,es:"Hace tiempo que quiero visitar Perú.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:46,start:379.691,end:388.299,es:"Hace una semana que no duermo bien.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:47,start:389.799,end:396.06,es:"Hazme caso.",group:"hacer caso",group_index:6,level:"A2"},{i:48,start:396.06,end:404.241,es:"Los niños no me hacen caso.",group:"hacer caso",group_index:6,level:"A2"},{i:49,start:404.241,end:412.593,es:"Nunca haces caso a tus padres.",group:"hacer caso",group_index:6,level:"A2"},{i:50,start:412.593,end:420.839,es:"Debí hacerle caso al médico.",group:"hacer caso",group_index:6,level:"B1"},{i:51,start:420.839,end:429.639,es:"Te lo dije, pero no me hiciste caso.",group:"hacer caso",group_index:6,level:"B1"},{i:52,start:429.639,end:438.353,es:"No le hagas caso, está de mal humor.",group:"hacer caso",group_index:6,level:"B1"},{i:53,start:438.353,end:446.727,es:"Quiero que me hagas caso esta vez.",group:"hacer caso",group_index:6,level:"B1"},{i:54,start:448.227,end:455.64,es:"Se está haciendo tarde.",group:"hacerse",group_index:7,level:"B1"},{i:55,start:455.64,end:463.245,es:"Mi hermana se hizo médica.",group:"hacerse",group_index:7,level:"B1"},{i:56,start:463.245,end:471.811,es:"Nos hicimos amigos en el colegio.",group:"hacerse",group_index:7,level:"B1"},{i:57,start:471.811,end:480.397,es:"Con los años, se hizo más paciente.",group:"hacerse",group_index:7,level:"B1"},{i:58,start:480.397,end:488.792,es:"Quiere hacerse rico muy rápido.",group:"hacerse",group_index:7,level:"B1"},{i:59,start:488.792,end:498.125,es:"Se hace de noche muy temprano en invierno.",group:"hacerse",group_index:7,level:"B1"},{i:60,start:498.125,end:506.712,es:"Ojalá nos hagamos buenos amigos.",group:"hacerse",group_index:7,level:"B1"}],Od={word:Pd,slug:Cd,kind:Hd,hash:Qd,duration:Dd,voice:Yd,marks:Vd},Id="igual",Fd="igual",Rd="word",Ud="bf318f1e08b18b86",Gd=545.352,Kd="santa",Wd=[{i:0,start:.5,end:8.809,es:"Mi camisa es igual a la tuya.",group:"igual e iguales",group_index:0,level:"A1"},{i:1,start:8.809,end:16.671,es:"Las dos casas son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:2,start:16.671,end:24.553,es:"Tu bolso es igual al mío.",group:"igual e iguales",group_index:0,level:"A1"},{i:3,start:24.553,end:32.713,es:"Los gemelos son casi iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:4,start:32.713,end:40.873,es:"Estos zapatos no son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:5,start:40.873,end:48.692,es:"Todos los días son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:6,start:48.692,end:57.62,es:"Mi teléfono es igual al de mi hermano.",group:"igual e iguales",group_index:0,level:"A1"},{i:7,start:57.62,end:65.439,es:"Las dos tazas son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:8,start:66.939,end:74.608,es:"Hablas igual que tu madre.",group:"igual que",group_index:1,level:"A1"},{i:9,start:74.608,end:82.789,es:"Ella canta igual que su abuela.",group:"igual que",group_index:1,level:"A1"},{i:10,start:82.789,end:90.48,es:"Mi hijo come igual que yo.",group:"igual que",group_index:1,level:"A1"},{i:11,start:90.48,end:98.469,es:"Hoy hace frío, igual que ayer.",group:"igual que",group_index:1,level:"A1"},{i:12,start:98.469,end:105.52,es:"Pienso igual que tú.",group:"igual que",group_index:1,level:"A1"},{i:13,start:105.52,end:113.488,es:"Él trabaja igual que siempre.",group:"igual que",group_index:1,level:"A1"},{i:14,start:113.488,end:122.757,es:"La casa está igual que hace diez años.",group:"igual que",group_index:1,level:"A2"},{i:15,start:122.757,end:130.96,es:"Lo hice igual que la última vez.",group:"igual que",group_index:1,level:"A2"},{i:16,start:132.46,end:141.345,es:"Las dos películas son igual de largas.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:17,start:141.345,end:150.103,es:"Mi hermano es igual de alto que yo.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:18,start:150.103,end:159.863,es:"Este restaurante es igual de caro que el otro.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:19,start:159.863,end:169.537,es:"Los dos exámenes fueron igual de difíciles.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:20,start:169.537,end:178.892,es:"Ella es igual de simpática que su hermana.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:21,start:178.892,end:188.524,es:"El tren y el autobús son igual de rápidos.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:22,start:188.524,end:197.921,es:"Hoy el tráfico está igual de mal que ayer.",group:"igual de + adjetivo",group_index:2,le
