olos.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:8,start:63.263,end:71.977,es:"Mi madre se peina antes de salir.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:9,start:73.477,end:80.976,es:"Mi jefe se va a las cinco.",group:"se va, se queda",group_index:1,level:"A1"},{i:10,start:80.976,end:87.941,es:"Hoy se queda en casa.",group:"se va, se queda",group_index:1,level:"A1"},{i:11,start:87.941,end:95.931,es:"Se sienta junto a la ventana.",group:"se va, se queda",group_index:1,level:"A1"},{i:12,start:95.931,end:104.091,es:"Mi hijo se enoja fácilmente.",group:"se va, se queda",group_index:1,level:"A1"},{i:13,start:104.091,end:112.677,es:"Se preocupa mucho por su familia.",group:"se va, se queda",group_index:1,level:"A1"},{i:14,start:112.677,end:120.432,es:"Mi amigo se casa en junio.",group:"se va, se queda",group_index:1,level:"A1"},{i:15,start:120.432,end:128.165,es:"Ana se fue sin decir nada.",group:"se va, se queda",group_index:1,level:"A2"},{i:16,start:128.165,end:136.283,es:"Se quedaron en un hotel pequeño.",group:"se va, se queda",group_index:1,level:"A2"},{i:17,start:136.283,end:144.101,es:"Se acordó de mi cumpleaños.",group:"se va, se queda",group_index:1,level:"A2"},{i:18,start:145.601,end:153.271,es:"Mis padres se quieren mucho.",group:"se quieren",group_index:2,level:"A1"},{i:19,start:153.271,end:161.601,es:"Se conocieron en la universidad.",group:"se quieren",group_index:2,level:"A2"},{i:20,start:161.601,end:169.313,es:"Los vecinos no se hablan.",group:"se quieren",group_index:2,level:"A2"},{i:21,start:169.313,end:177.367,es:"Se escriben todas las semanas.",group:"se quieren",group_index:2,level:"A2"},{i:22,start:177.367,end:185.463,es:"Se abrazaron en el aeropuerto.",group:"se quieren",group_index:2,level:"A2"},{i:23,start:185.463,end:193.964,es:"Ana y Luis se ven todos los días.",group:"se quieren",group_index:2,level:"A2"},{i:24,start:193.964,end:202.636,es:"Los dos hermanos se parecen mucho.",group:"se quieren",group_index:2,level:"A2"},{i:25,start:202.636,end:211.137,es:"Se ayudan con las tareas de la casa.",group:"se quieren",group_index:2,level:"A2"},{i:26,start:212.637,end:219.475,es:"Aquí se vive bien.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:27,start:219.475,end:228.232,es:"Se come muy bien en este restaurante.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:28,start:228.232,end:236.179,es:"¿Cómo se dice esto en español?",group:"se vive bien aquí",group_index:3,level:"A2"},{i:29,start:236.179,end:244.424,es:"En esta tienda se habla español.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:30,start:244.424,end:251.816,es:"No se puede fumar aquí.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:31,start:251.816,end:259.315,es:"¿Por dónde se va al centro?",group:"se vive bien aquí",group_index:3,level:"A2"},{i:32,start:259.315,end:267.795,es:"Se trabaja mucho en esta empresa.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:33,start:267.795,end:275.251,es:"Desde aquí se ve el mar.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:34,start:275.251,end:282.536,es:"¿Cómo se escribe tu nombre?",group:"se vive bien aquí",group_index:3,level:"A2"},{i:35,start:284.036,end:292.388,es:"En esta calle se venden casas.",group:"se venden casas",group_index:4,level:"A2"},{i:36,start:292.388,end:301.743,es:"Se alquila un apartamento cerca del parque.",group:"se venden casas",group_index:4,level:"A2"},{i:37,start:301.743,end:310.031,es:"Se necesita ayuda en la cocina.",group:"se venden casas",group_index:4,level:"A2"},{i:38,start:310.031,end:318.148,es:"Aquí se arreglan computadoras.",group:"se venden casas",group_index:4,level:"A2"},{i:39,start:318.148,end:325.775,es:"Aquí se aceptan tarjetas.",group:"se venden casas",group_index:4,level:"A2"},{i:40,start:325.775,end:334.191,es:"Se vendieron todas las entradas.",group:"se venden casas",group_index:4,level:"A2"},{i:41,start:334.191,end:342.457,es:"Este plato se prepara con arroz.",group:"se venden casas",group_index:4,level:"A2"},{i:42,start:342.457,end:351.94,es:"Se construyó un puente nuevo el año pasado.",group:"se venden casas",group_index:4,level:"A2"},{i:43,start:353.44,end:360.107,es:"Se lo doy mañana.",group:"se lo, se la",group_index:5,level:"A2"},{i:44,start:360.107,end:368.139,es:"¿El libro? Se lo presté a Marta.",group:"se lo, se la",group_index:5,level:"A2"},{i:45,start:368.139,end:374.677,es:"Se lo dije ayer.",group:"se lo, se la",group_index:5,level:"A2"},{i:46,start:374.677,end:382.688,es:"¿Le diste la carta? Sí, se la di.",group:"se lo, se la",group_index:5,level:"A2"},{i:47,start:382.688,end:391.872,es:"Mi hijo quería un perro y se lo compramos.",group:"se lo, se la",group_index:5,level:"A2"},{i:48,start:391.872,end:401.12,es:"Si tienes la foto, mándasela a tu madre.",group:"se lo, se la",group_index:5,level:"A2"},{i:49,start:401.12,end:409.131,es:"Se lo explico otra vez, señora.",group:"se lo, se la",group_index:5,level:"A2"},{i:50,start:409.131,end:416.843,es:"Se los regalé a mis sobrinos.",group:"se lo, se la",group_index:5,level:"A2"},{i:51,start:416.843,end:424.405,es:"No se lo digas a nadie.",group:"se lo, se la",group_index:5,level:"B1"},{i:52,start:425.905,end:433.276,es:"Se me olvidó tu nombre.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:53,start:433.276,end:440.135,es:"Se le cayó el vaso.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:54,start:440.135,end:447.271,es:"Se nos acabó la leche.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:55,start:447.271,end:454.748,es:"Se me rompió el teléfono.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:56,start:454.748,end:462.46,es:"Se te olvidaron las llaves.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:57,start:462.46,end:471.537,es:"Se le perdió la tarjeta en el autobús.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:58,start:471.537,end:478.375,es:"Se me quemó el arroz.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:59,start:478.375,end:485.169,es:"Se nos hizo tarde.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:60,start:485.169,end:493.159,es:"Al niño se le cayó un diente.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"}],Ng={word:jg,slug:Bg,kind:zg,hash:Mg,duration:Eg,voice:$g,marks:kg},wg="seguir",Lg="seguir",Sg="word",Tg="13e624b79ff25809",Pg=472.896,Cg="santa",Hg=[{i:0,start:.5,end:7.209,es:"Sígueme, por favor.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:1,start:7.209,end:15.348,es:"El perro me sigue a todas partes.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:2,start:15.348,end:23.572,es:"Sigue esta calle hasta el final.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:3,start:23.572,end:30.111,es:"¿Por qué me sigues?",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:4,start:30.111,end:37.993,es:"Seguimos al guía por el museo.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:5,start:37.993,end:46.004,es:"Los patitos siguen a su madre.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:6,start:46.004,end:53.887,es:"Siga a ese taxi, por favor.",group:"seguir, ir detrás",group_index:0,level:"A2"},{i:7,start:53.887,end:62.303,es:"Alguien nos sigue desde hace un rato.",group:"seguir, ir detrás",group_index:0,level:"A2"},{i:8,start:63.803,end:69.509,es:"¿Seguimos?",group:"seguir, continuar",group_index:1,level:"A1"},{i:9,start:69.509,end:77.157,es:"Sigue, por favor, te escucho.",group:"seguir, continuar",group_index:1,level:"A1"},{i:10,start:77.157,end:86.683,es:"La película sigue después de los anuncios.",group:"seguir, continuar",group_index:1,level:"A1"},{i:11,start:86.683,end:94.224,es:"Si quieres, seguimos mañana.",group:"seguir, continuar",group_index:1,level:"A1"},{i:12,start:94.224,end:102.043,es:"El camino sigue por el bosque.",group:"seguir, continuar",group_index:1,level:"A1"},{i:13,start:102.043,end:110.267,es:"La reunión sigue hasta las cinco.",group:"seguir, continuar",group_index:1,level:"A1"},{i:14,start:110.267,end:118.171,es:"Seguimos con la lección de ayer.",group:"seguir, continuar",group_index:1,level:"A1"},{i:15,start:119.671,end:125.911,es:"Sigue lloviendo.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:16,start:125.911,end:134.711,es:"Sigo trabajando en el mismo lugar.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:17,start:134.711,end:142.273,es:"¿Sigues viviendo en el centro?",group:"sigue lloviendo",group_index:2,level:"A2"},{i:18,start:142.273,end:152.033,es:"Mi abuelo sigue manejando a los noventa años.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:19,start:152.033,end:160.151,es:"Seguimos esperando el autobús.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:20,start:160.151,end:167.841,es:"Los niños siguen durmiendo.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:21,start:167.841,end:176.343,es:"Ella siguió hablando toda la noche.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:22,start:176.343,end:185.313,es:"Sigue intentándolo, ya casi lo tienes.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:23,start:185.313,end:193.985,es:"A pesar del frío, seguimos caminando.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:24,start:195.485,end:202.792,es:"Mi hermana sigue enferma.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:25,start:202.792,end:208.755,es:"¿Sigues aquí?",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:26,start:208.755,end:215.955,es:"La tienda sigue cerrada.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:27,start:215.955,end:223.368,es:"El café sigue caliente.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:28,start:223.368,end:230.995,es:"Seguimos en el aeropuerto.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:29,start:230.995,end:241.907,es:"Mis padres siguen casados después de cuarenta años.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:30,start:241.907,end:248.701,es:"Sigo muy cansado.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:31,start:248.701,end:255.816,es:"¿Sigue abierto el banco?",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:32,start:255.816,end:263.229,es:"El problema sigue igual.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:33,start:264.729,end:271.737,es:"Sigue las instrucciones.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:34,start:271.737,end:279.705,es:"Seguí tu consejo y funcionó.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:35,start:279.705,end:287.012,es:"Hay que seguir las reglas.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:36,start:287.012,end:295.108,es:"No seguiste la receta, ¿verdad?",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:37,start:295.108,end:303.887,es:"Siempre sigo los consejos de mi madre.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:38,start:303.887,end:312.601,es:"Sigue el mapa y no te vas a perder.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:39,start:312.601,end:321.444,es:"Seguimos las señales hasta la salida.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:40,start:321.444,end:330.671,es:"El médico me dijo que siguiera una dieta.",group:"seguir instrucciones y consejos",group_index:4,level:"B1"},{i:41,start:332.171,end:338.944,es:"Sigo sin entender.",group:"seguir sin",group_index:5,level:"B1"},{i:42,start:338.944,end:346.763,es:"Seguimos sin noticias de él.",group:"seguir sin",group_index:5,level:"B1"},{i:43,start:346.763,end:355.669,es:"El vecino sigue sin pagar el alquiler.",group:"seguir sin",group_index:5,level:"B1"},{i:44,start:355.669,end:363.637,es:"Sigo sin encontrar mis llaves.",group:"seguir sin",group_index:5,level:"B1"},{i:45,start:363.637,end:373.632,es:"Llevo una hora en la cama y sigo sin poder dormir.",group:"seguir sin",group_index:5,level:"B1"},{i:46,start:373.632,end:382.133,es:"La computadora sigue sin funcionar.",group:"seguir sin",group_index:5,level:"B1"},{i:47,start:382.133,end:390.528,es:"Siguen sin contestar el teléfono.",group:"seguir sin",group_index:5,level:"B1"},{i:48,start:390.528,end:398.688,es:"Mi hijo sigue sin saber nadar.",group:"seguir sin",group_index:5,level:"B1"},{i:49,start:400.188,end:407.367,es:"Espero que sigas bien.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:50,start:407.367,end:415.804,es:"Ojalá siga haciendo buen tiempo.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:51,start:415.804,end:424.327,es:"Si sigues así, vas a llegar lejos.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:52,start:424.327,end:431.121,es:"¡Que siga la fiesta!",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:53,start:431.121,end:439.58,es:"No creo que siga lloviendo mañana.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:54,start:439.58,end:448.785,es:"Seguiría estudiando si tuviera más tiempo.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:55,start:448.785,end:457.649,es:"Sigue así, lo estás haciendo muy bien.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:56,start:457.649,end:464.721,es:"¿Cómo sigue tu madre?",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:57,start:464.721,end:472.839,es:"Me pidió que siguiera adelante.",group:"sigue así, que sigas bien",group_index:6,level:"B1"}],Qg={word:wg,slug:Lg,kind:Sg,hash:Tg,duration:Pg,voice:Cg,marks:Hg},Dg="soler",Yg="soler",Vg="word",Og="018d363fda74c85b",Ig=524.88,Fg="santa",Rg=[{i:0,start:.5,end:8.191,es:"Suelo desayunar a las siete.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:1,start:8.191,end:16.521,es:"Mi padre suele leer el periódico.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:2,start:16.521,end:23.657,es:"Solemos comer en casa.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:3,start:23.657,end:31.391,es:"Ella suele llegar temprano.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:4,start:31.391,end:38.889,es:"Suelo caminar al trabajo.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:5,start:38.889,end:47.476,es:"Los niños suelen dormir la siesta.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:6,start:47.476,end:56.084,es:"Mis abuelos suelen cenar temprano.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:7,start:56.084,end:64.223,es:"Suelo beber agua con la comida.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:8,start:64.223,end:72.596,es:"Los sábados solemos ir al mercado.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:9,start:74.096,end:81.595,es:"¿Sueles cocinar en casa?",group:"preguntas",group_index:1,level:"A1"},{i:10,start:81.595,end:89.435,es:"¿A qué hora sueles levantarte?",group:"preguntas",group_index:1,level:"A1"},{i:11,start:89.435,end:97.339,es:"¿Dónde suelen comer ustedes?",group:"preguntas",group_index:1,level:"A1"},{i:12,start:97.339,end:105.307,es:"¿Qué sueles hacer los domingos?",group:"preguntas",group_index:1,level:"A1"},{i:13,start:105.307,end:112.72,es:"¿Sueles viajar en verano?",group:"preguntas",group_index:1,level:"A1"},{i:14,start:112.72,end:120.56,es:"¿Cómo sueles ir al trabajo?",group:"preguntas",group_index:1,level:"A1"},{i:15,start:120.56,end:129.829,es:"¿Tu hermana suele llamar los fines de semana?",group:"preguntas",group_index:1,level:"A1"},{i:16,start:129.829,end:137.52,es:"¿Qué suele cenar tu familia?",group:"preguntas",group_index:1,level:"A1"},{i:17,start:139.02,end:146.817,es:"No suelo ver la televisión.",group:"no suelo",group_index:2,level:"A2"},{i:18,start:146.817,end:155.617,es:"Mi madre no suele cocinar los lunes.",group:"no suelo",group_index:2,level:"A2"},{i:19,start:155.617,end:163.351,es:"No solemos salir de noche.",group:"no suelo",group_index:2,level:"A2"},{i:20,start:163.351,end:170.956,es:"Él no suele llegar tarde.",group:"no suelo",group_index:2,level:"A2"},{i:21,start:170.956,end:178.924,es:"No suelo comer carne roja.",group:"no suelo",group_index:2,level:"A2"},{i:22,start:178.924,end:188.151,es:"Los domingos no suelen abrir las tiendas.",group:"no suelo",group_index:2,level:"A2"},{i:23,start:188.151,end:196.737,es:"No suelo dormir bien en los aviones.",group:"no suelo",group_index:2,level:"A2"},{i:24,start:196.737,end:207.777,es:"Mis amigos no suelen contestar los mensajes rápido.",group:"no suelo",group_index:2,level:"A2"},{i:25,start:209.277,end:217.949,es:"En agosto suele hacer mucho calor.",group:"lo normal",group_index:3,level:"A2"},{i:26,start:217.949,end:226.579,es:"En esta ciudad suele llover en abril.",group:"lo normal",group_index:3,level:"A2"},{i:27,start:226.579,end:234.568,es:"El tren suele llegar puntual.",group:"lo normal",group_index:3,level:"A2"},{i:28,start:234.568,end:243.368,es:"Los lunes suele haber mucho tráfico.",group:"lo normal",group_index:3,level:"A2"},{i:29,start:243.368,end:251.891,es:"Este restaurante suele estar lleno.",group:"lo normal",group_index:3,level:"A2"},{i:30,start:251.891,end:260.712,es:"La primera clase suele ser fácil.",group:"lo normal",group_index:3,level:"A2"},{i:31,start:260.712,end:270.003,es:"En invierno suele nevar en las montañas.",group:"lo normal",group_index:3,level:"A2"},{i:32,start:270.003,end:279.677,es:"Las entradas del museo suelen costar poco.",group:"lo normal",group_index:3,level:"A2"},{i:33,start:281.177,end:289.508,es:"De niño, solía jugar en la calle.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:34,start:289.508,end:298.585,es:"Mi abuela solía hacer pan los domingos.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:35,start:298.585,end:306.937,es:"Solíamos ir a la playa en verano.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:36,start:306.937,end:315.695,es:"¿Qué solías hacer después de clase?",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:37,start:315.695,end:323.684,es:"Mi padre solía fumar mucho.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:38,start:323.684,end:332.975,es:"En la universidad, solía estudiar de noche.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:39,start:332.975,end:342.372,es:"Mis primos solían visitarnos en Navidad.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:40,start:342.372,end:351.129,es:"Solía tomar el autobús a las siete.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:41,start:351.129,end:359.993,es:"Ella solía escribir cartas a mano.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:42,start:361.493,end:371.317,es:"Antes solía correr, pero ahora prefiero nadar.",group:"antes y ahora",group_index:5,level:"A2"},{i:43,start:371.317,end:381.056,es:"Solía tomar tres cafés al día, pero ya no.",group:"antes y ahora",group_index:5,level:"A2"},{i:44,start:381.056,end:392.821,es:"Antes solíamos cenar juntos, pero ahora cada uno come a su hora.",group:"antes y ahora",group_index:5,level:"B1"},{i:45,start:392.821,end:403.413,es:"Antes no solía leer, y ahora leo todas las noches.",group:"antes y ahora",group_index:5,level:"B1"},{i:46,start:403.413,end:414.283,es:"Mi hermano solía ser muy tímido, pero ha cambiado mucho.",group:"antes y ahora",group_index:5,level:"B1"},{i:47,start:414.283,end:425.963,es:"Antes solíamos escribirnos cartas, y hoy todo es por mensaje.",group:"antes y ahora",group_index:5,level:"B1"},{i:48,start:425.963,end:437.365,es:"Este barrio solía ser tranquilo, pero ahora hay mucho ruido.",group:"antes y ahora",group_index:5,level:"B1"},{i:49,start:437.365,end:446.656,es:"Ya no suelo acostarme tarde como antes.",group:"antes y ahora",group_index:5,level:"B1"},{i:50,start:448.156,end:457.959,es:"Eso no suele pasar en un lugar tan tranquilo.",group:"no suele pasar",group_index:6,level:"B1"},{i:51,start:457.959,end:467.057,es:"Como suele pasar, el vuelo salió tarde.",group:"no suele pasar",group_index:6,level:"B1"},{i:52,start:467.057,end:476.839,es:"Como solía decir mi abuelo, el tiempo es oro.",group:"no suele pasar",group_index:6,level:"B1"},{i:53,start:476.839,end:485.809,es:"Esto no suele ocurrir en esta empresa.",group:"no suele pasar",group_index:6,level:"B1"},{i:54,start:485.809,end:496.273,es:"Lo que suele pasar es que nadie lee las instrucciones.",group:"no suele pasar",group_index:6,level:"B1"},{i:55,start:496.273,end:505.628,es:"Los problemas suelen resolverse hablando.",group:"no suele pasar",group_index:6,level:"B1"},{i:56,start:505.628,end:514.94,es:"Es raro, porque él no suele equivocarse.",group:"no suele pasar",group_index:6,level:"B1"},{i:57,start:514.94,end:524.828,es:"Como se suele decir, más vale tarde que nunca.",group:"no suele pasar",group_index:6,level:"B1"}],Ug={word:Dg,slug:Yg,kind:Vg,hash:Og,duration:Ig,voice:Fg,marks:Rg},Gg="tener",Kg="tener",Wg="word",Jg="8d2eeaf58c287240",Xg=524.832,Zg="santa",e1=[{i:0,start:.5,end:7.508,es:"Tengo dos hermanos.",group:"tener, poseer",group_index:0,level:"A1"},{i:1,start:7.508,end:14.623,es:"¿Tienes un bolígrafo?",group:"tener, poseer",group_index:0,level:"A1"},{i:2,start:14.623,end:22.868,es:"Mi abuela tiene un gato negro.",group:"tener, poseer",group_index:0,level:"A1"},{i:3,start:22.868,end:29.641,es:"No tenemos auto.",group:"tener, poseer",group_index:0,level:"A1"},{i:4,start:29.641,end:38.441,es:"Esta casa tiene tres habitaciones.",group:"tener, poseer",group_index:0,level:"A1"},{i:5,start:38.441,end:46.687,es:"¿Tiene usted una mesa para dos?",group:"tener, poseer",group_index:0,level:"A1"},{i:6,start:46.687,end:55.017,es:"Ellos tienen una tienda en el centro.",group:"tener, poseer",group_index:0,level:"A1"},{i:7,start:55.017,end:62.047,es:"Hoy no tengo tiempo.",group:"tener, poseer",group_index:0,level:"A1"},{i:8,start:62.047,end:70.079,es:"Mi hermana tiene el pelo largo.",group:"tener, poseer",group_index:0,level:"A1"},{i:9,start:71.579,end:78.864,es:"Aquí tienes las llaves.",group:"aquí tienes",group_index:1,level:"A1"},{i:10,start:78.864,end:86.533,es:"Aquí tiene su café, señora.",group:"aquí tienes",group_index:1,level:"A1"},{i:11,start:86.533,end:93.328,es:"Aquí tienen el menú.",group:"aquí tienes",group_index:1,level:"A1"},{i:12,start:93.328,end:100.357,es:"Aquí tienes tu cambio.",group:"aquí tienes",group_index:1,level:"A1"},{i:13,start:101.857,end:109.079,es:"Tengo treinta años.",group:"tener años",group_index:2,level:"A1"},{i:14,start:109.079,end:116.129,es:"¿Cuántos años tienes?",group:"tener años",group_index:2,level:"A1"},{i:15,start:116.129,end:123.905,es:"Mi hijo tiene cinco años.",group:"tener años",group_index:2,level:"A1"},{i:16,start:123.905,end:132.172,es:"Mi abuelo tiene noventa años.",group:"tener años",group_index:2,level:"A1"},{i:17,start:132.172,end:140.225,es:"El perro ya tiene diez años.",group:"tener años",group_index:2,level:"A1"},{i:18,start:140.225,end:149.473,es:"Cuando tenía veinte años, vivía en Lima.",group:"tener años",group_index:2,level:"A2"},{i:19,start:150.973,end:157.853,es:"Tengo mucha hambre.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:20,start:157.853,end:163.752,es:"¿Tienes sed?",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:21,start:163.752,end:171.016,es:"Los niños tienen frío.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:22,start:171.016,end:179.176,es:"En verano siempre tengo calor.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:23,start:179.176,end:187.165,es:"Tengo sueño, me voy a dormir.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:24,start:187.165,end:195.219,es:"Mi hija tiene miedo de los perros.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:25,start:195.219,end:202.675,es:"Lo siento, tengo prisa.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:26,start:202.675,end:210.365,es:"¿No tienen hambre todavía?",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:27,start:210.365,end:218.035,es:"Anoche tuve mucho miedo.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A2"},{i:28,start:219.535,end:227.268,es:"Tengo que trabajar mañana.",group:"tener que",group_index:4,level:"A1"},{i:29,start:227.268,end:234.319,es:"Tienes que descansar.",group:"tener que",group_index:4,level:"A1"},{i:30,start:234.319,end:241.689,es:"Tenemos que comprar pan.",group:"tener que",group_index:4,level:"A1"},{i:31,start:241.689,end:249.231,es:"¿A qué hora tienes que salir?",group:"tener que",group_index:4,level:"A1"},{i:32,start:249.231,end:257.156,es:"Los niños tienen que estudiar.",group:"tener que",group_index:4,level:"A1"},{i:33,start:257.156,end:265.359,es:"No tienes que venir si no quieres.",group:"tener que",group_index:4,level:"A1"},{i:34,start:265.359,end:273.007,es:"Ayer tuve que ir al médico.",group:"tener que",group_index:4,level:"A2"},{i:35,start:273.007,end:282.959,es:"Tuvimos que esperar dos horas en el aeropuerto.",group:"tener que",group_index:4,level:"A2"},{i:36,start:284.459,end:292.469,es:"Tengo ganas de ir a la playa.",group:"tener ganas de",group_index:5,level:"A2"},{i:37,start:292.469,end:300.949,es:"No tengo ganas de cocinar hoy.",group:"tener ganas de",group_index:5,level:"A2"},{i:38,start:300.949,end:309.493,es:"¿Tienes ganas de salir esta noche?",group:"tener ganas de",group_index:5,level:"A2"},{i:39,start:309.493,end:317.589,es:"Tengo muchas ganas de verte.",group:"tener ganas de",group_index:5,level:"A2"},{i:40,start:317.589,end:326.005,es:"Los niños tienen ganas de jugar.",group:"tener ganas de",group_index:5,level:"A2"},{i:41,start:326.005,end:334.528,es:"Hoy no tenía ganas de levantarme.",group:"tener ganas de",group_index:5,level:"A2"},{i:42,start:334.528,end:344.075,es:"Tenemos ganas de conocer tu nueva casa.",group:"tener ganas de",group_index:5,level:"A2"},{i:43,start:345.575,end:351.772,es:"Tienes razón.",group:"tener razón, tener cuidado",group_index:6,level:"A1"},{i:44,start:351.772,end:359.996,es:"Creo que mi madre tenía razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:45,start:359.996,end:367.473,es:"No siempre tienes razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:46,start:367.473,end:374.823,es:"Ten cuidado con el perro.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:47,start:374.823,end:383.815,es:"Tengan cuidado, el suelo está mojado.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:48,start:383.815,end:393.212,es:"Tienes que tener cuidado al cruzar la calle.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:49,start:393.212,end:400.732,es:"Al final, tuviste razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:50,start:402.232,end:411.352,es:"De niño tenía una bicicleta roja.",group:"tenía, tuve",group_index:7,level:"A2"},{i:51,start:411.352,end:420.685,es:"Antes no teníamos computadora en casa.",group:"tenía, tuve",group_index:7,level:"A2"},{i:52,start:420.685,end:428.995,es:"Ayer tuve una reunión muy larga.",group:"tenía, tuve",group_index:7,level:"A2"},{i:53,start:428.995,end:437.389,es:"El año pasado tuvieron un bebé.",group:"tenía, tuve",group_index:7,level:"A2"},{i:54,start:437.389,end:445.699,es:"Tuvimos un problema con el hotel.",group:"tenía, tuve",group_index:7,level:"A2"},{i:55,start:445.699,end:453.048,es:"¿Tuviste un buen viaje?",group:"tenía, tuve",group_index:7,level:"A2"},{i:56,start:453.048,end:462.125,es:"La semana pasada tuve mucho trabajo.",group:"tenía, tuve",group_index:7,level:"A2"},{i:57,start:463.625,end:471.38,es:"Eso no tiene nada que ver.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:58,start:471.38,end:480.393,es:"Su trabajo tiene que ver con la música.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:59,start:480.393,end:489.556,es:"¿Qué tiene que ver eso con nuestro problema?",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:60,start:489.556,end:497.801,es:"Espero que tengas un buen día.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:61,start:497.801,end:508.479,es:"Si tuviera más tiempo, aprendería a tocar la guitarra.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:62,start:508.479,end:516.063,es:"No creo que tengan razón.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:63,start:516.063,end:524.777,es:"Me alegra que tengas tantos amigos.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"}],a1={word:Gg,slug:Kg,kind:Wg,hash:Jg,duration:Xg,voice:Zg,marks:e1},o1="tocar",r1="tocar",s1="word",n1="30641d266ee4bc9d",l1=492.384,i1="santa",t1=[{i:0,start:.5,end:8.98,es:"No toques el horno, está caliente.",group:"tocar con la mano",group_index:0,level:"A1"},{i:1,start:8.98,end:15.988,es:"¿Puedo tocar al perro?",group:"tocar con la mano",group_index:0,level:"A1"},{i:2,start:15.988,end:23.572,es:"El bebé me toca la cara.",group:"tocar con la mano",group_index:0,level:"A1"},{i:3,start:23.572,end:31.732,es:"Por favor, no toquen los cuadros.",group:"tocar con la mano",group_index:0,level:"A1"},{i:4,start:31.732,end:39.316,es:"Me gusta tocar la arena.",group:"tocar con la mano",group_index:0,level:"A1"},{i:5,start:39.316,end:47.348,es:"Toca el agua, está muy fría.",group:"tocar con la mano",group_index:0,level:"A1"},{i:6,start:47.348,end:56.852,es:"No te toques los ojos con las manos sucias.",group:"tocar con la mano",group_index:0,level:"A2"},{i:7,start:56.852,end:65.652,es:"Alguien me tocó el hombro en el autobús.",group:"tocar con la mano",group_index:0,level:"A2"},{i:8,start:65.652,end:73.535,es:"Nunca había tocado la nieve.",group:"tocar con la mano",group_index:0,level:"B1"},{i:9,start:75.035,end:82.427,es:"Mi hermana toca el piano.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:10,start:82.427,end:89.136,es:"¿Tocas la guitarra?",group:"tocar un instrumento",group_index:1,level:"A1"},{i:11,start:89.136,end:96.891,es:"Él toca muy bien el violín.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:12,start:96.891,end:105.456,es:"Quiero aprender a tocar la batería.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:13,start:105.456,end:113.083,es:"La banda toca los sábados.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:14,start:113.083,end:120.624,es:"Toca algo para nosotros.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:15,start:120.624,end:129.36,es:"De niño, tocaba la flauta en la escuela.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:16,start:129.36,end:138.416,es:"Anoche tocaron mi canción favorita.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:17,start:138.416,end:147.536,es:"Hace diez años que toco el saxofón.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:18,start:149.036,end:156.321,es:"Alguien toca la puerta.",group:"tocar la puerta, el timbre",group_index:2,level:"A1"},{i:19,start:156.321,end:163.863,es:"Toca el timbre, por favor.",group:"tocar la puerta, el timbre",group_index:2,level:"A1"},{i:20,start:163.863,end:172.087,es:"Toqué la puerta, pero nadie abrió.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:21,start:172.087,end:180.844,es:"El cartero tocó el timbre dos veces.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:22,start:180.844,end:190.583,es:"Toca el timbre otra vez, creo que no te oyeron.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:23,start:190.583,end:199.511,es:"Antes de entrar, hay que tocar la puerta.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:24,start:199.511,end:209.676,es:"Los niños tocaron el timbre y salieron corriendo.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:25,start:211.176,end:218.163,es:"Ahora te toca a ti.",group:"te toca, el turno",group_index:3,level:"A1"},{i:26,start:218.163,end:224.637,es:"¿A quién le toca?",group:"te toca, el turno",group_index:3,level:"A1"},{i:27,start:224.637,end:232.797,es:"Me toca lavar los platos hoy.",group:"te toca, el turno",group_index:3,level:"A2"},{i:28,start:232.797,end:241.725,es:"Mañana le toca cocinar a mi hermano.",group:"te toca, el turno",group_index:3,level:"A2"},{i:29,start:241.725,end:249.779,es:"Te toca elegir la película.",group:"te toca, el turno",group_index:3,level:"A2"},{i:30,start:249.779,end:256.915,es:"¿Cuándo me toca hablar?",group:"te toca, el turno",group_index:3,level:"A2"},{i:31,start:256.915,end:264.712,es:"Ayer le tocó sacar al perro.",group:"te toca, el turno",group_index:3,level:"A2"},{i:32,start:264.712,end:272.936,es:"Nos toca esperar una hora más.",group:"te toca, el turno",group_index:3,level:"A2"},{i:33,start:272.936,end:282.824,es:"La última vez pagué yo, así que hoy te toca a ti.",group:"te toca, el turno",group_index:3,level:"A2"},{i:34,start:282.824,end:291.88,es:"Al abuelo le toca ir al médico el lunes.",group:"te toca, el turno",group_index:3,level:"A2"},{i:35,start:293.38,end:300.537,es:"Me tocó la lotería.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:36,start:300.537,end:308.42,es:"Le tocó un viaje a la playa.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:37,start:308.42,end:316.793,es:"Nunca me toca nada en las rifas.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:38,start:316.793,end:326.617,es:"En el examen me tocó la pregunta más difícil.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:39,start:326.617,end:334.649,es:"Nos tocó un hotel muy bonito.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:40,start:334.649,end:342.319,es:"¿Qué te tocó en el sorteo?",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:41,start:342.319,end:351.311,es:"Me tocó un asiento al lado de la ventana.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:42,start:351.311,end:360.281,es:"A mi amiga le tocó trabajar el domingo.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:43,start:360.281,end:369.7,es:"Ojalá te toque un buen profesor este año.",group:"me tocó, el premio y la suerte",group_index:4,level:"B1"},{i:44,start:371.2,end:379.552,es:"No quiero tocar ese tema ahora.",group:"tocar un tema",group_index:5,level:"B1"},{i:45,start:379.552,end:389.76,es:"En la reunión tocamos varios temas importantes.",group:"tocar un tema",group_index:5,level:"B1"},{i:46,start:389.76,end:400.224,es:"Es mejor no tocar el tema de la política en la cena.",group:"tocar un tema",group_index:5,level:"B1"},{i:47,start:400.224,end:409.088,es:"El libro toca temas muy difíciles.",group:"tocar un tema",group_index:5,level:"B1"},{i:48,start:409.088,end:418.101,es:"¿Por qué siempre tocas temas tan tristes?",group:"tocar un tema",group_index:5,level:"B1"},{i:49,start:418.101,end:429.205,es:"Prefiero que no toques ese asunto delante de mis padres.",group:"tocar un tema",group_index:5,level:"B1"},{i:50,start:429.205,end:438.667,es:"El profesor solo tocó el tema por encima.",group:"tocar un tema",group_index:5,level:"B1"},{i:51,start:438.667,end:447.488,es:"Si tocas ese tema, se va a molestar.",group:"tocar un tema",group_index:5,level:"B1"},{i:52,start:448.988,end:457.745,es:"Nunca he estado enfermo, toco madera.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:53,start:457.745,end:466.14,es:"La película me tocó el corazón.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:54,start:466.14,end:475.772,es:"Después de tocar fondo, empezó a mejorar.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:55,start:475.772,end:483.975,es:"Sus palabras me tocaron mucho.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:56,start:483.975,end:492.327,es:"Ese problema me toca de cerca.",group:"expresiones con tocar",group_index:6,level:"B1"}],u1={word:o1,slug:r1,kind:s1,hash:n1,duration:l1,voice:i1,marks:t1},d1="verbos reflexivos",p1="verbos_reflexivos",g1="concept",c1="ffd0fb0f3205ee83",v1=549.528,m1="santa",_1=[{i:0,start:.5,end:7.764,es:"Me despierto a las siete.",group:"la rutina diaria",group_index:0,level:"A1"},{i:1,start:7.764,end:16.564,es:"Me levanto temprano todos los días.",group:"la rutina diaria",group_index:0,level:"A1"},{i:2,start:16.564,end:24.937,es:"Mi hermano se ducha por la noche.",group:"la rutina diaria",group_index:0,level:"A1"},{i:3,start:24.937,end:33.588,es:"Nos vestimos rápido por la mañana.",group:"la rutina diaria",group_index:0,level:"A1"},{i:4,start:33.588,end:41.961,es:"Los niños se acuestan a las nueve.",group:"la rutina diaria",group_index:0,level:"A1"},{i:5,start:41.961,end:49.097,es:"¿A qué hora te levantas?",group:"la rutina diaria",group_index:0,level:"A1"},{i:6,start:49.097,end:57.577,es:"Mi padre se afeita cada mañana.",group:"la rutina diaria",group_index:0,level:"A1"},{i:7,start:57.577,end:65.289,es:"Me peino antes de salir.",group:"la rutina diaria",group_index:0,level:"A1"},{i:8,start:65.289,end:74.345,es:"¿Te duchas por la mañana o por la noche?",group:"la rutina diaria",group_index:0,level:"A1"},{i:9,start:75.845,end:84.325,es:"Me lavo las manos antes de comer.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:10,start:84.325,end:92.485,es:"Ella se lava el pelo cada día.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:11,start:92.485,end:102.352,es:"Me cepillo los dientes después del desayuno.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:12,start:102.352,end:109.808,es:"El niño se lava la cara.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:13,start:109.808,end:117.499,es:"Mi madre se pinta las uñas.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:14,start:117.499,end:125.765,es:"Se pone los zapatos en la puerta.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:15,start:125.765,end:133.477,es:"Me quito el abrigo al entrar.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:16,start:133.477,end:141.723,es:"Me corto el pelo una vez al mes.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A2"},{i:17,start:143.223,end:151.852,es:"Me enojo cuando hay mucho tráfico.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:18,start:151.852,end:159.969,es:"Mi madre se preocupa por todo.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:19,start:159.969,end:168.151,es:"Nos alegramos mucho de verte.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:20,start:168.151,end:176.247,es:"Los niños se aburren en el auto.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:21,start:176.247,end:185.26,es:"Me pongo nervioso antes de un examen.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:22,start:185.26,end:193.676,es:"Ella se cansa mucho en el trabajo.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:23,start:193.676,end:201.175,es:"¿Por qué te enojas tanto?",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:24,start:201.175,end:208.951,es:"Hoy me siento mucho mejor.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:25,start:208.951,end:217.025,es:"Él se pone triste cuando llueve.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:26,start:218.525,end:225.789,es:"Levántate, ya es tarde.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:27,start:225.789,end:232.904,es:"Voy a ducharme ahora.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:28,start:232.904,end:240.36,es:"Siéntate aquí, por favor.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:29,start:240.36,end:248.627,es:"No te preocupes, todo está bien.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:30,start:248.627,end:257.085,es:"Tengo que acostarme temprano hoy.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:31,start:257.085,end:265.885,es:"Lávate las manos, la cena está lista.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:32,start:265.885,end:273.576,es:"Ponte el abrigo, hace frío.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:33,start:273.576,end:281.757,es:"Necesito relajarme un poco.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:34,start:281.757,end:289.192,es:"Cálmate, no pasa nada.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:35,start:289.192,end:297.757,es:"Acuérdate de llamarme cuando llegues.",group:"en mandatos e infinitivos",group_index:3,level:"B1"},{i:36,start:299.257,end:307.097,es:"Ayer me levanté muy tarde.",group:"en pasado",group_index:4,level:"A2"},{i:37,start:307.097,end:315.855,es:"Esta mañana me duché con agua fría.",group:"en pasado",group_index:4,level:"A2"},{i:38,start:315.855,end:324.953,es:"Cuando era niño, me acostaba a las ocho.",group:"en pasado",group_index:4,level:"A2"},{i:39,start:324.953,end:333.519,es:"Mi hermana se casó el año pasado.",group:"en pasado",group_index:4,level:"A2"},{i:40,start:333.519,end:341.508,es:"¿A qué hora te despertaste hoy?",group:"en pasado",group_index:4,level:"A2"},{i:41,start:341.508,end:350.841,es:"Los niños se divirtieron mucho en el parque.",group:"en pasado",group_index:4,level:"A2"},{i:42,start:350.841,end:357.956,es:"Me caí en la escalera.",group:"en pasado",group_index:4,level:"A2"},{i:43,start:357.956,end:368.527,es:"Antes nos levantábamos a las seis para ir al trabajo.",group:"en pasado",group_index:4,level:"A2"},{i:44,start:368.527,end:377.796,es:"Ya me había vestido cuando llegó el taxi.",group:"en pasado",group_index:4,level:"B1"},{i:45,start:379.296,end:388.331,es:"Nos conocimos en un viaje a México.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:46,start:388.331,end:396,es:"Mis padres se quieren mucho.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:47,start:396,end:405.141,es:"Mi hermano y yo nos llamamos cada semana.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:48,start:405.141,end:415.008,es:"Los dos amigos se abrazaron en el aeropuerto.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:49,start:415.008,end:424.427,es:"Ellos se escriben mensajes todos los días.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:50,start:424.427,end:434.272,es:"Ana y Luis se ayudan con las tareas de la casa.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:51,start:434.272,end:443.115,es:"Los vecinos se saludan en la escalera.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:52,start:443.115,end:452.149,es:"Es importante que nos escuchemos más.",group:"acciones recíprocas",group_index:5,level:"B1"},{i:53,start:452.149,end:461.205,es:"Ojalá se entiendan mejor con el tiempo.",group:"acciones recíprocas",group_index:5,level:"B1"},{i:54,start:462.705,end:469.884,es:"¿Cómo se llama tu perro?",group:"cambios de significado",group_index:6,level:"A1"},{i:55,start:469.884,end:477.297,es:"Ya me voy, es muy tarde.",group:"cambios de significado",group_index:6,level:"A2"},{i:56,start:477.297,end:486.673,es:"¿Por qué te fuiste tan temprano de la fiesta?",group:"cambios de significado",group_index:6,level:"A2"},{i:57,start:486.673,end:494.577,es:"El bebé se durmió en el auto.",group:"cambios de significado",group_index:6,level:"A2"},{i:58,start:494.577,end:502.673,es:"Hoy me quedo en casa porque llueve.",group:"cambios de significado",group_index:6,level:"A2"},{i:59,start:502.673,end:513.841,es:"Normalmente duermo bien, pero anoche me dormí muy tarde.",group:"cambios de significado",group_index:6,level:"B1"},{i:60,start:513.841,end:523.26,es:"Me quedé dormido y llegué tarde al trabajo.",group:"cambios de significado",group_index:6,level:"B1"},{i:61,start:523.26,end:532.529,es:"Se quedaron sin dinero al final del viaje.",group:"cambios de significado",group_index:6,level:"B1"},{i:62,start:532.529,end:541.863,es:"Me di cuenta del error demasiado tarde.",group:"cambios de significado",group_index:6,level:"B1"},{i:63,start:541.863,end:549.468,es:"No me acuerdo de su nombre.",group:"cambios de significado",group_index:6,level:"B1"}],x1={word:d1,slug:p1,kind:g1,hash:c1,duration:v1,voice:m1,marks:_1},A1="vez",h1="vez",b1="word",q1="21a806d066f7f246",f1=526.104,y1="santa",j1=[{i:0,start:.5,end:9.535,es:"Voy al gimnasio tres veces por semana.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:1,start:9.535,end:17.993,es:"Como pescado una vez a la semana.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:2,start:17.993,end:26.559,es:"Llamo a mi madre dos veces al día.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:3,start:26.559,end:34.377,es:"Lee la pregunta dos veces.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:4,start:34.377,end:41.343,es:"Solo lo digo una vez.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:5,start:41.343,end:50.633,es:"Tomo esta medicina tres veces al día.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:6,start:50.633,end:57.684,es:"Fui a París una vez.",group:"una vez, dos veces",group_index:0,level:"A2"},{i:7,start:59.184,end:66.683,es:"A veces trabajo en casa.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:8,start:66.683,end:74.096,es:"A veces llueve en verano.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:9,start:74.096,end:82.811,es:"Mi hermano a veces cocina para todos.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:10,start:82.811,end:91.035,es:"Muchas veces comemos juntos.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:11,start:91.035,end:99.109,es:"A veces no entiendo a mi jefe.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:12,start:99.109,end:108.123,es:"Muchas veces el tren llega tarde.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:13,start:108.123,end:116.112,es:"¿Vas mucho al cine? A veces.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:14,start:117.612,end:125.089,es:"¿Puedes decirlo otra vez?",group:"otra vez",group_index:2,level:"A1"},{i:15,start:125.089,end:131.799,es:"Otra vez llueve.",group:"otra vez",group_index:2,level:"A1"},{i:16,start:131.799,end:140.791,es:"Mañana vamos otra vez a la playa.",group:"otra vez",group_index:2,level:"A1"},{i:17,start:140.791,end:146.945,es:"¡Otra vez tú!",group:"otra vez",group_index:2,level:"A1"},{i:18,start:146.945,end:156.172,es:"El niño quiere ver la película otra vez.",group:"otra vez",group_index:2,level:"A1"},{i:19,start:156.172,end:164.993,es:"Mi teléfono otra vez no funciona.",group:"otra vez",group_index:2,level:"A1"},{i:20,start:164.993,end:172.897,es:"Perdí las llaves otra vez.",group:"otra vez",group_index:2,level:"A2"},{i:21,start:174.397,end:182.685,es:"Es la primera vez que vengo aquí.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A1"},{i:22,start:182.685,end:191.379,es:"La primera vez que la vi, no hablamos.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:23,start:191.379,end:200.093,es:"¿Cuándo fue la última vez que comiste?",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:24,start:200.093,end:209.939,es:"La última vez que fui, el museo estaba cerrado.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:25,start:209.939,end:218.547,es:"Esta es la última vez que te ayudo.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:26,start:218.547,end:228.179,es:"Recuerdo la primera vez que subí a un avión.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:27,start:228.179,end:236.381,es:"La próxima vez, llámame antes.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:28,start:237.881,end:246.297,es:"De vez en cuando como chocolate.",group:"de vez en cuando",group_index:4,level:"A2"},{i:29,start:246.297,end:255.737,es:"Mis primos nos visitan de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:30,start:255.737,end:264.836,es:"De vez en cuando me gusta caminar solo.",group:"de vez en cuando",group_index:4,level:"A2"},{i:31,start:264.836,end:273.487,es:"Vamos al teatro de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:32,start:273.487,end:282.863,es:"De vez en cuando escucho música clásica.",group:"de vez en cuando",group_index:4,level:"A2"},{i:33,start:282.863,end:291.727,es:"Es bueno descansar de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:34,start:293.227,end:299.957,es:"Tal vez mañana.",group:"tal vez",group_index:5,level:"A2"},{i:35,start:299.957,end:307.456,es:"Tal vez voy a la fiesta.",group:"tal vez",group_index:5,level:"A2"},{i:36,start:307.456,end:314.72,es:"Tal vez tienes razón.",group:"tal vez",group_index:5,level:"A2"},{i:37,start:314.72,end:322.453,es:"Tal vez está en la cocina.",group:"tal vez",group_index:5,level:"A2"},{i:38,start:322.453,end:330.293,es:"Tal vez llueva esta tarde.",group:"tal vez",group_index:5,level:"B1"},{i:39,start:330.293,end:339.051,es:"Tal vez Ana no sepa la dirección.",group:"tal vez",group_index:5,level:"B1"},{i:40,start:339.051,end:347.701,es:"Tal vez podamos vernos el sábado.",group:"tal vez",group_index:5,level:"B1"},{i:41,start:349.201,end:357.233,es:"Hoy tomo té en vez de café.",group:"en vez de",group_index:6,level:"A2"},{i:42,start:357.233,end:366.161,es:"Vamos a pie en vez de tomar un taxi.",group:"en vez de",group_index:6,level:"A2"},{i:43,start:366.161,end:375.388,es:"En vez de ver la televisión, lee un libro.",group:"en vez de",group_index:6,level:"A2"},{i:44,start:375.388,end:383.505,es:"Compré pollo en vez de carne.",group:"en vez de",group_index:6,level:"A2"},{i:45,start:383.505,end:392.647,es:"Ella fue a la reunión en vez de su jefe.",group:"en vez de",group_index:6,level:"A2"},{i:46,start:392.647,end:403.687,es:"Prefiero quedarme en casa en vez de salir esta noche.",group:"en vez de",group_index:6,level:"A2"},{i:47,start:403.687,end:412.359,es:"En vez de quejarte, ayúdame un poco.",group:"en vez de",group_index:6,level:"B1"},{i:48,start:413.859,end:422.509,es:"No puedo hacer dos cosas a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:49,start:422.509,end:430.051,es:"Todos hablaban a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:50,start:430.051,end:439.661,es:"Es una película triste y divertida a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:51,start:439.661,end:448.077,es:"Sentí miedo y alegría a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:52,start:448.077,end:457.027,es:"Mi hermana estudia y trabaja a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:53,start:457.027,end:465.827,es:"Los dos llegamos a la puerta a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:54,start:467.327,end:475.124,es:"Hace cada vez más calor.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:55,start:475.124,end:482.815,es:"Cada vez hay menos tiempo.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:56,start:482.815,end:490.975,es:"Mi español es cada vez mejor.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:57,start:490.975,end:500.692,es:"Cada vez más personas trabajan desde casa.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:58,start:500.692,end:509.385,es:"La ciudad está cada vez más cara.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:59,start:509.385,end:517.439,es:"Cada vez leo menos libros.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:60,start:517.439,end:526.047,es:"Tu hijo está cada vez más alto.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"}],B1={word:A1,slug:h1,kind:b1,hash:q1, vez",group_index:1,level:"A1"},{i:16,start:125.164,end:133.004,es:"Volví a ver esa película.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:17,start:133.004,end:140.055,es:"Ayer volvió a nevar.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:18,start:140.055,end:148.215,es:"Volvimos a visitar el museo.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:19,start:148.215,end:157.655,es:"Después de dos años, volvió a trabajar.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:20,start:157.655,end:166.455,es:"Volví a llamar, pero nadie contestó.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:21,start:166.455,end:175.511,es:"El dolor volvió a empezar por la noche.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:22,start:175.511,end:185.527,es:"Mi hermana volvió a estudiar a los cuarenta años.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:23,start:185.527,end:195.564,es:"De niño, volví a leer ese cuento muchas veces.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:24,start:197.064,end:204.584,es:"Voy a volver a intentarlo.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:25,start:204.584,end:213.064,es:"Mañana va a volver a hacer frío.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:26,start:213.064,end:221.565,es:"¿Vas a volver a ese restaurante?",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:27,start:221.565,end:230.152,es:"Vamos a volver a vernos en verano.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:28,start:230.152,end:239.187,es:"Volveré a escribirte la semana que viene.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:29,start:239.187,end:248.925,es:"El año que viene volveremos a viajar juntos.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:30,start:248.925,end:257.235,es:"Te volveré a llamar más tarde.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:31,start:257.235,end:265.565,es:"Pronto volverá a salir el sol.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:32,start:267.065,end:274.159,es:"No vuelvo a comer ahí.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:33,start:274.159,end:281.316,es:"Nunca volví a verlo.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:34,start:281.316,end:289.476,es:"No volvimos a hablar del tema.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:35,start:289.476,end:297.636,es:"No pienso volver a ese hotel.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:36,start:297.636,end:307.076,es:"Después del accidente, no volvió a manejar.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:37,start:307.076,end:315.812,es:"Prometo no volver a llegar tarde.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:38,start:315.812,end:324.057,es:"No ha vuelto a llover desde marzo.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:39,start:324.057,end:331.492,es:"No vuelvas a hacer eso.",group:"no volver a, nunca más",group_index:4,level:"B1"},{i:40,start:332.992,end:339.829,es:"Vuelve a intentarlo.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:41,start:339.829,end:348.821,es:"Vuelva a revisar sus datos, por favor.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:42,start:348.821,end:356.32,es:"Vuelve a leer la pregunta.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:43,start:356.32,end:364.565,es:"Vuelvan a sentarse, por favor.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:44,start:364.565,end:372.128,es:"Vuelve a contar el dinero.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:45,start:372.128,end:381.547,es:"Por favor, vuelva a escribir su contraseña.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:46,start:381.547,end:393.013,es:"Si no funciona, apaga la computadora y vuelve a encenderla.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:47,start:394.513,end:402.268,es:"Lo volví a ver en la fiesta.",group:"con pronombres",group_index:6,level:"B1"},{i:48,start:402.268,end:409.404,es:"Te lo vuelvo a explicar.",group:"con pronombres",group_index:6,level:"B1"},{i:49,start:409.404,end:416.945,es:"Se me volvió a olvidar.",group:"con pronombres",group_index:6,level:"B1"},{i:50,start:416.945,end:425.255,es:"Me volvió a llamar a medianoche.",group:"con pronombres",group_index:6,level:"B1"},{i:51,start:425.255,end:433.052,es:"¿Me lo puedes volver a decir?",group:"con pronombres",group_index:6,level:"B1"},{i:52,start:433.052,end:442.62,es:"Nos volvimos a encontrar en el aeropuerto.",group:"con pronombres",group_index:6,level:"B1"},{i:53,start:442.62,end:450.844,es:"Se volvió a romper la lavadora.",group:"con pronombres",group_index:6,level:"B1"},{i:54,start:450.844,end:459.004,es:"Me lo volví a poner para la boda.",group:"con pronombres",group_index:6,level:"B1"},{i:55,start:460.504,end:468.472,es:"Espero que no vuelva a pasar.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:56,start:468.472,end:476.931,es:"Ojalá volvamos a vernos pronto.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:57,start:476.931,end:486.243,es:"Si pudiera, volvería a estudiar medicina.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:58,start:486.243,end:494.253,es:"Yo no volvería a ese lugar.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:59,start:494.253,end:502.541,es:"Cuando vuelvas a venir, avísame.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:60,start:502.541,end:511.235,es:"Me alegra que hayas vuelto a cantar.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:61,start:511.235,end:519.373,es:"No creo que vuelva a llover hoy.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"}],L1={word:z1,slug:M1,kind:E1,hash:$1,duration:k1,voice:N1,marks:w1},S1="ya / todavía",T1="ya_todavia",P1="word",C1="2b43d66fed669c9e",H1=518.208,Q1="santa",D1=[{i:0,start:.5,end:6.612,es:"Ya es tarde.",group:"ya en presente",group_index:0,level:"A1"},{i:1,start:6.612,end:13.108,es:"Ya sé tu nombre.",group:"ya en presente",group_index:0,level:"A1"},{i:2,start:13.108,end:20.457,es:"Mi hermano ya trabaja.",group:"ya en presente",group_index:0,level:"A1"},{i:3,start:20.457,end:27.593,es:"¿Ya tienes las llaves?",group:"ya en presente",group_index:0,level:"A1"},{i:4,start:27.593,end:34.815,es:"El niño ya lee solo.",group:"ya en presente",group_index:0,level:"A1"},{i:5,start:34.815,end:41.929,es:"Ya estamos en casa.",group:"ya en presente",group_index:0,level:"A1"},{i:6,start:41.929,end:49.343,es:"La cena ya está lista.",group:"ya en presente",group_index:0,level:"A1"},{i:7,start:50.843,end:56.379,es:"¡Ya voy!",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:8,start:56.379,end:62.128,es:"¡Ven ya!",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:9,start:62.128,end:69.605,es:"Ya vengo, espérame aquí.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:10,start:69.605,end:76.677,es:"Hazlo ya, por favor.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:11,start:76.677,end:84.603,es:"Necesito una respuesta ya.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:12,start:84.603,end:91.717,es:"Ya bajo, un momento.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:13,start:91.717,end:99.963,es:"Si quieres llegar a tiempo, sal ya.",group:"ya voy, ahora mismo",group_index:1,level:"A2"},{i:14,start:101.463,end:108.513,es:"Todavía es temprano.",group:"todavía",group_index:2,level:"A1"},{i:15,start:108.513,end:116.524,es:"Mi abuela todavía vive sola.",group:"todavía",group_index:2,level:"A1"},{i:16,start:116.524,end:123.788,es:"¿Todavía tienes hambre?",group:"todavía",group_index:2,level:"A1"},{i:17,start:123.788,end:131.116,es:"Todavía llueve mucho.",group:"todavía",group_index:2,level:"A1"},{i:18,start:131.116,end:138.977,es:"Los niños todavía duermen.",group:"todavía",group_index:2,level:"A1"},{i:19,start:138.977,end:146.945,es:"Todavía estoy en la oficina.",group:"todavía",group_index:2,level:"A1"},{i:20,start:146.945,end:155.425,es:"¿Todavía trabajas en el hospital?",group:"todavía",group_index:2,level:"A1"},{i:21,start:156.925,end:163.677,es:"Todavía no lo sé.",group:"todavía no",group_index:3,level:"A1"},{i:22,start:163.677,end:172.2,es:"El autobús todavía no está aquí.",group:"todavía no",group_index:3,level:"A1"},{i:23,start:172.2,end:180.04,es:"Todavía no tengo trabajo.",group:"todavía no",group_index:3,level:"A1"},{i:24,start:180.04,end:187.688,es:"Mi hija todavía no habla.",group:"todavía no",group_index:3,level:"A1"},{i:25,start:187.688,end:195.635,es:"Todavía no es hora de comer.",group:"todavía no",group_index:3,level:"A1"},{i:26,start:195.635,end:204.051,es:"Todavía no conozco a tus padres.",group:"todavía no",group_index:3,level:"A1"},{i:27,start:204.051,end:211.741,es:"¿Todavía no estás listo?",group:"todavía no",group_index:3,level:"A1"},{i:28,start:213.241,end:220.761,es:"Ya no vivo en esa casa.",group:"ya no",group_index:4,level:"A2"},{i:29,start:220.761,end:227.62,es:"Ya no tengo frío.",group:"ya no",group_index:4,level:"A2"},{i:30,start:227.62,end:234.756,es:"Mi padre ya no fuma.",group:"ya no",group_index:4,level:"A2"},{i:31,start:234.756,end:242.233,es:"Ya no hay pan en la tienda.",group:"ya no",group_index:4,level:"A2"},{i:32,start:242.233,end:250.372,es:"Ya no quiero más café, gracias.",group:"ya no",group_index:4,level:"A2"},{i:33,start:250.372,end:257.871,es:"Ellos ya no son amigos.",group:"ya no",group_index:4,level:"A2"},{i:34,start:257.871,end:268.121,es:"Desde que tengo bicicleta, ya no tomo el autobús.",group:"ya no",group_index:4,level:"A2"},{i:35,start:269.621,end:276.757,es:"Ya he comido, gracias.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:36,start:276.757,end:284.448,es:"¿Ya has terminado la tarea?",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:37,start:284.448,end:292.587,es:"Ya hemos visto esa película.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:38,start:292.587,end:302.219,es:"Mis amigos ya han llegado al restaurante.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:39,start:302.219,end:310.229,es:"¿Ya has hablado con el médico?",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:40,start:310.229,end:317.707,es:"Ya ha empezado el partido.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:41,start:317.707,end:325.141,es:"Ya he leído tu mensaje.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:42,start:325.141,end:332.704,es:"¿Ya han llamado del banco?",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:43,start:334.204,end:342.023,es:"¡Ya está! Funciona otra vez.",group:"¡ya está!",group_index:6,level:"A2"},{i:44,start:342.023,end:350.204,es:"Ya está, la puerta está cerrada.",group:"¡ya está!",group_index:6,level:"A2"},{i:45,start:350.204,end:356.871,es:"¿Ya está el arroz?",group:"¡ya está!",group_index:6,level:"A2"},{i:46,start:356.871,end:364.668,es:"Un minuto más y ya está.",group:"¡ya está!",group_index:6,level:"A2"},{i:47,start:364.668,end:372.295,es:"¡Ya está! Terminé la tarea.",group:"¡ya está!",group_index:6,level:"A2"},{i:48,start:372.295,end:379.9,es:"¡Ya está! Ya podemos salir.",group:"¡ya está!",group_index:6,level:"A2"},{i:49,start:381.4,end:390.733,es:"Ya es de noche, pero todavía hace calor.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:50,start:390.733,end:401.688,es:"Ya terminé el informe, pero todavía tengo que enviarlo.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:51,start:401.688,end:411.235,es:"Mi hijo ya camina, pero todavía no habla.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:52,start:411.235,end:421.613,es:"Ya no llueve, pero las calles todavía están mojadas.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:53,start:421.613,end:432.205,es:"Ya compré los regalos, pero todavía no
