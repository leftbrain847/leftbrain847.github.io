roup:"echar, lanzar algo",group_index:0,level:"A1"},{i:5,start:39.444,end:47.028,es:"No eches papeles al suelo.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:6,start:47.028,end:55.359,es:"Echamos una moneda a la fuente.",group:"echar, lanzar algo",group_index:0,level:"A2"},{i:7,start:56.859,end:64.891,es:"Echa un poco de sal a la sopa.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:8,start:64.891,end:72.645,es:"¿Le echas azúcar al café?",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:9,start:72.645,end:79.995,es:"Yo no echo leche al té.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:10,start:79.995,end:87.643,es:"Echa más agua a la olla.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:11,start:87.643,end:96.101,es:"Mi abuela echa mucho ajo a todo.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:12,start:96.101,end:104.603,es:"Echa un poco de hielo a la limonada.",group:"echar en la comida y la bebida",group_index:1,level:"A1"},{i:13,start:104.603,end:113.36,es:"¿Cuánto aceite le echo a la ensalada?",group:"echar en la comida y la bebida",group_index:1,level:"A2"},{i:14,start:113.36,end:122.224,es:"Le eché demasiada pimienta a la carne.",group:"echar en la comida y la bebida",group_index:1,level:"A2"},{i:15,start:123.724,end:132.439,es:"¿Me echas una mano con estas cajas?",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:16,start:132.439,end:141.068,es:"Mi vecino siempre me echa una mano.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:17,start:141.068,end:148.887,es:"Te echo una mano con la cena.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:18,start:148.887,end:158.625,es:"Ayer le eché una mano a mi hermano con la mudanza.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:19,start:158.625,end:167.425,es:"¿Puedes echar un vistazo a mi trabajo?",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:20,start:167.425,end:175.799,es:"Voy a echar un vistazo a la tienda.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:21,start:175.799,end:184.321,es:"Echa un vistazo al bebé, por favor.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:22,start:184.321,end:193.697,es:"El mecánico le echó un vistazo al motor.",group:"echar una mano, echar un vistazo",group_index:2,level:"A2"},{i:23,start:195.197,end:202.931,es:"El perro se echa en el sofá.",group:"echarse, acostarse",group_index:3,level:"A1"},{i:24,start:202.931,end:211.624,es:"Estoy cansado, voy a echarme un rato.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:25,start:211.624,end:220.019,es:"Después de comer, me eché en la cama.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:26,start:220.019,end:229.907,es:"Mi padre se echa en la hamaca todas las tardes.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:27,start:229.907,end:239.176,es:"Nos echamos en la arena a tomar el sol.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:28,start:239.176,end:248.211,es:"Échate un momento si te duele la cabeza.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:29,start:248.211,end:257.053,es:"El gato se echó al lado de la ventana.",group:"echarse, acostarse",group_index:3,level:"A2"},{i:30,start:258.553,end:265.092,es:"¿Me echas de menos?",group:"echar de menos",group_index:4,level:"A1"},{i:31,start:265.092,end:272.761,es:"Echo de menos a mi familia.",group:"echar de menos",group_index:4,level:"A2"},{i:32,start:272.761,end:281.625,es:"Echamos de menos la comida de casa.",group:"echar de menos",group_index:4,level:"A2"},{i:33,start:281.625,end:291.023,es:"Cuando vivía lejos, echaba de menos el mar.",group:"echar de menos",group_index:4,level:"A2"},{i:34,start:291.023,end:298.692,es:"Te he echado mucho de menos.",group:"echar de menos",group_index:4,level:"A2"},{i:35,start:298.692,end:308.815,es:"Mi hija echa de menos a sus amigos del colegio.",group:"echar de menos",group_index:4,level:"A2"},{i:36,start:308.815,end:317.252,es:"Voy a echar de menos esta ciudad.",group:"echar de menos",group_index:4,level:"A2"},{i:37,start:317.252,end:328.655,es:"Nadie echó de menos la televisión durante las vacaciones.",group:"echar de menos",group_index:4,level:"A2"},{i:38,start:330.155,end:339.189,es:"Mi madre echó a los niños de la cocina.",group:"echar a alguien",group_index:5,level:"A2"},{i:39,start:339.189,end:348.224,es:"Lo echaron del trabajo por llegar tarde.",group:"echar a alguien",group_index:5,level:"B1"},{i:40,start:348.224,end:358.197,es:"El dueño nos echó del restaurante a medianoche.",group:"echar a alguien",group_index:5,level:"B1"},{i:41,start:358.197,end:367.083,es:"Si no pagas el alquiler, te van a echar.",group:"echar a alguien",group_index:5,level:"B1"},{i:42,start:367.083,end:375.904,es:"Echaron a dos jugadores del partido.",group:"echar a alguien",group_index:5,level:"B1"},{i:43,start:375.904,end:385.941,es:"Me echaron de la biblioteca por hablar por teléfono.",group:"echar a alguien",group_index:5,level:"B1"},{i:44,start:385.941,end:395.573,es:"No creo que te echen por un error tan pequeño.",group:"echar a alguien",group_index:5,level:"B1"},{i:45,start:397.073,end:406.044,es:"Cuando vio al perro, el niño echó a correr.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:46,start:406.044,end:414.481,es:"Al oír la noticia, se echó a llorar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:47,start:414.481,end:423.111,es:"De repente, todos se echaron a reír.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:48,start:423.111,end:430.417,es:"El pájaro echó a volar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:49,start:430.417,end:440.241,es:"Cuando abrieron la puerta, la gente echó a andar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:50,start:440.241,end:449.02,es:"Si le dices eso, se va a echar a llorar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:51,start:449.02,end:459.121,es:"Empezó a llover y echamos a correr hacia la casa.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:52,start:460.621,end:468.483,es:"Siempre me echa la culpa a mí.",group:"expresiones con echar",group_index:7,level:"B1"},{i:53,start:468.483,end:476.877,es:"El calor echó a perder la fruta.",group:"expresiones con echar",group_index:7,level:"B1"},{i:54,start:476.877,end:485.741,es:"No eches a perder esta oportunidad.",group:"expresiones con echar",group_index:7,level:"B1"},{i:55,start:485.741,end:494.264,es:"Siempre me echa en cara mis errores.",group:"expresiones con echar",group_index:7,level:"B1"},{i:56,start:494.264,end:502.936,es:"Estaba tan furioso que echaba humo.",group:"expresiones con echar",group_index:7,level:"B1"},{i:57,start:502.936,end:512.312,es:"Me gustaría echar raíces en este pueblo.",group:"expresiones con echar",group_index:7,level:"B1"},{i:58,start:512.312,end:520.536,es:"No le eches más leña al fuego.",group:"expresiones con echar",group_index:7,level:"B1"}],pl={word:sl,slug:nl,kind:ll,hash:il,duration:tl,voice:ul,marks:dl},gl="faltar / hacer falta",cl="faltar_hacer_falta",vl="word",ml="e53c41c85efeabfb",_l=489.072,xl="dora",Al=[{i:0,start:.5,end:6.911,es:"Me falta dinero.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:1,start:6.911,end:13.065,es:"¿Qué te falta?",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:2,start:13.065,end:20.329,es:"A la sopa le falta sal.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:3,start:20.329,end:27.444,es:"Nos faltan dos sillas.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:4,start:27.444,end:35.433,es:"A mi camisa le falta un botón.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:5,start:35.433,end:42.761,es:"Te falta una firma aquí.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:6,start:42.761,end:51.284,es:"Me faltan tres páginas del libro.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:7,start:51.284,end:59.679,es:"A este equipo le falta un jugador.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:8,start:61.179,end:68.443,es:"Falta poco para llegar.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:9,start:68.443,end:77.157,es:"Faltan dos días para mi cumpleaños.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:10,start:77.157,end:84.613,es:"¿Cuánto falta para el verano?",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:11,start:84.613,end:93.307,es:"Faltan cinco minutos para las nueve.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:12,start:93.307,end:100.656,es:"Ya falta poco, niños.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:13,start:100.656,end:110.693,es:"Todavía faltan tres semanas para las vacaciones.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:14,start:110.693,end:118.299,es:"¿Cuántas estaciones faltan?",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:15,start:118.299,end:126.715,es:"Solo falta una semana para la boda.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:16,start:128.215,end:135.671,es:"En la fiesta faltó comida.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:17,start:135.671,end:144.855,es:"Me faltó tiempo para terminar el examen.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:18,start:144.855,end:153.079,es:"Cuando llegamos, faltaba el postre.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:19,start:153.079,end:161.964,es:"Siempre nos faltaba dinero a fin de mes.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:20,start:161.964,end:169.228,es:"¿Quién faltó a la reunión?",group:"faltó, faltaba",group_index:2,level:"A2"},{i:21,start:169.228,end:178.327,es:"Faltó agua en el barrio toda la semana.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:22,start:178.327,end:187.489,es:"Faltaban diez minutos para la medianoche.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:23,start:188.989,end:197.789,es:"Hoy falto a clase porque estoy enfermo.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A1"},{i:24,start:197.789,end:205.117,es:"Nunca falto al trabajo.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A1"},{i:25,start:205.117,end:213.448,es:"Mi hijo faltó a clase dos días.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:26,start:213.448,end:220.627,es:"¿Por qué faltaste ayer?",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:27,start:220.627,end:229.768,es:"Si faltas mucho, vas a perder el curso.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:28,start:229.768,end:238.12,es:"Ella nunca ha faltado a una cita.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:29,start:238.12,end:245.789,es:"No quiero faltar a tu fiesta.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:30,start:247.289,end:254.532,es:"Hace falta paciencia.",group:"hace falta + nombre",group_index:4,level:"A1"},{i:31,start:254.532,end:261.54,es:"¿Te hace falta algo?",group:"hace falta + nombre",group_index:4,level:"A1"},{i:32,start:261.54,end:269.636,es:"Me hace falta un abrigo nuevo.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:33,start:269.636,end:277.497,es:"Nos hacen falta más platos.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:34,start:277.497,end:286.767,es:"Para este trabajo hace falta experiencia.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:35,start:286.767,end:295.481,es:"En esta casa hace falta más luz.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:36,start:295.481,end:303.919,es:"Te hacen falta unas vacaciones.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:37,start:303.919,end:311.396,es:"Le hacía falta un amigo.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:38,start:312.896,end:320.459,es:"Hace falta estudiar más.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:39,start:320.459,end:328.021,es:"No hace falta pagar ahora.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:40,start:328.021,end:335.797,es:"¿Hace falta reservar mesa?",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:41,start:335.797,end:343.851,es:"No hace falta llevar paraguas.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:42,start:343.851,end:353.803,es:"Para viajar allí hace falta tener pasaporte.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:43,start:353.803,end:362.944,es:"Gracias, pero no hacía falta traer nada.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:44,start:362.944,end:372.128,es:"Hará falta comprar más comida para el sábado.",group:"hace falta + infinitivo",group_index:5,level:"B1"},{i:45,start:373.628,end:381.063,es:"No hace falta que vengas.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:46,start:381.063,end:388.689,es:"No hace falta que me esperes.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:47,start:388.689,end:396.849,es:"No hace falta que traigan nada.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:48,start:396.849,end:404.369,es:"¿Hace falta que lo repita?",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:49,start:404.369,end:413.639,es:"Hace falta que alguien hable con el director.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:50,start:413.639,end:421.948,es:"No hacía falta que te molestaras.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:51,start:421.948,end:431.196,es:"No hace falta que me lo expliques otra vez.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:52,start:432.696,end:438.893,es:"¡Lo que faltaba!",group:"expresiones",group_index:7,level:"A2"},{i:53,start:438.893,end:446.136,es:"Me haces mucha falta.",group:"expresiones",group_index:7,level:"B1"},{i:54,start:446.136,end:454.765,es:"No le faltes el respeto a tu abuela.",group:"expresiones",group_index:7,level:"B1"},{i:55,start:454.765,end:464.525,es:"Vivo lejos y me hace mucha falta mi familia.",group:"expresiones",group_index:7,level:"B1"},{i:56,start:464.525,end:473.688,es:"Faltó poco para que perdiéramos el avión.",group:"expresiones",group_index:7,level:"B1"},{i:57,start:473.688,end:481.784,es:"No faltaría más, pase usted.",group:"expresiones",group_index:7,level:"B1"},{i:58,start:481.784,end:489.005,es:"Aquí no nos falta nada.",group:"expresiones",group_index:7,level:"B1"}],hl={word:gl,slug:cl,kind:vl,hash:ml,duration:_l,voice:xl,marks:Al},bl="haber",ql="haber",fl="word",yl="a060f87cf3e31dd7",jl=495.84,Bl="dora",zl=[{i:0,start:.5,end:7.785,es:"Hay un perro en el jardín.",group:"hay",group_index:0,level:"A1"},{i:1,start:7.785,end:15.583,es:"¿Hay leche en el refrigerador?",group:"hay",group_index:0,level:"A1"},{i:2,start:15.583,end:21.46,es:"No hay pan.",group:"hay",group_index:0,level:"A1"},{i:3,start:21.46,end:29.599,es:"Hay muchas personas en la calle.",group:"hay",group_index:0,level:"A1"},{i:4,start:29.599,end:38.121,es:"En mi clase hay veinte estudiantes.",group:"hay",group_index:0,level:"A1"},{i:5,start:38.121,end:45.812,es:"¿Hay un banco cerca de aquí?",group:"hay",group_index:0,level:"A1"},{i:6,start:45.812,end:52.436,es:"Hoy no hay clase.",group:"hay",group_index:0,level:"A1"},{i:7,start:52.436,end:60.489,es:"Hay dos camas en la habitación.",group:"hay",group_index:0,level:"A1"},{i:8,start:60.489,end:67.007,es:"¿Qué hay para comer?",group:"hay",group_index:0,level:"A1"},{i:9,start:68.507,end:75.067,es:"Hay que comer bien.",group:"hay que",group_index:1,level:"A1"},{i:10,start:75.067,end:82.096,es:"Hay que llegar temprano.",group:"hay que",group_index:1,level:"A1"},{i:11,start:82.096,end:89.339,es:"Hay que tener paciencia.",group:"hay que",group_index:1,level:"A1"},{i:12,start:89.339,end:96.432,es:"Hay que lavar los platos.",group:"hay que",group_index:1,level:"A1"},{i:13,start:96.432,end:103.803,es:"Hay que hablar con ella hoy.",group:"hay que",group_index:1,level:"A1"},{i:14,start:103.803,end:112.496,es:"Para entrar, hay que comprar una entrada.",group:"hay que",group_index:1,level:"A2"},{i:15,start:112.496,end:119.44,es:"No hay que pagar nada.",group:"hay que",group_index:1,level:"A2"},{i:16,start:119.44,end:126.725,es:"No hay que preocuparse.",group:"hay que",group_index:1,level:"A2"},{i:17,start:128.225,end:135.084,es:"He comido demasiado.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:18,start:135.084,end:142.327,es:"¿Has visto mi teléfono?",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:19,start:142.327,end:151.255,es:"Hemos vivido aquí durante cinco años.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:20,start:151.255,end:158.711,es:"Todavía no he terminado.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:21,start:158.711,end:165.633,es:"Ya ha llegado el tren.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:22,start:165.633,end:174.156,es:"¿Alguna vez has estado en México?",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:23,start:174.156,end:181.569,es:"Nunca he probado el mole.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:24,start:181.569,end:189.58,es:"Esta semana ha llovido mucho.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:25,start:189.58,end:198.06,es:"Mis padres han vuelto de su viaje.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:26,start:199.56,end:207.528,es:"Había mucha gente en la fiesta.",group:"había, hubo",group_index:3,level:"A2"},{i:27,start:207.528,end:215.923,es:"Antes había un cine en esta calle.",group:"había, hubo",group_index:3,level:"A2"},{i:28,start:215.923,end:223.08,es:"No había nadie en casa.",group:"había, hubo",group_index:3,level:"A2"},{i:29,start:223.08,end:230.92,es:"¿Había agua caliente en el hotel?",group:"había, hubo",group_index:3,level:"A2"},{i:30,start:230.92,end:239.379,es:"Ayer hubo un accidente en la autopista.",group:"había, hubo",group_index:3,level:"A2"},{i:31,start:239.379,end:247.368,es:"Hubo un problema con mi tarjeta.",group:"había, hubo",group_index:3,level:"A2"},{i:32,start:247.368,end:256.061,es:"Anoche hubo una tormenta muy fuerte.",group:"había, hubo",group_index:3,level:"A2"},{i:33,start:256.061,end:264.584,es:"Cuando era niño, no había internet.",group:"había, hubo",group_index:3,level:"A2"},{i:34,start:266.084,end:275.481,es:"Cuando llegué, la película ya había empezado.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:35,start:275.481,end:283.641,es:"Nunca había visto tanta nieve.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:36,start:283.641,end:292.271,es:"Me dijo que había perdido las llaves.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:37,start:292.271,end:300.495,es:"Ya habíamos cenado cuando llamaste.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:38,start:300.495,end:308.164,es:"No sabía que habías vuelto.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:39,start:308.164,end:316.687,es:"Pensé que te habías olvidado de mí.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:40,start:316.687,end:327.108,es:"Mis amigos ya habían salido cuando empezó a llover.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:41,start:328.608,end:336.619,es:"Mañana habrá mucho tráfico.",group:"habrá, habría",group_index:5,level:"B1"},{i:42,start:336.619,end:343.733,es:"¿Habrá tiempo para comer?",group:"habrá, habría",group_index:5,level:"B1"},{i:43,start:343.733,end:351.403,es:"No contesta. Habrá salido.",group:"habrá, habría",group_index:5,level:"B1"},{i:44,start:351.403,end:361.248,es:"Para el viernes ya habré terminado el informe.",group:"habrá, habría",group_index:5,level:"B1"},{i:45,start:361.248,end:368.725,es:"Yo habría hecho lo mismo.",group:"habrá, habría",group_index:5,level:"B1"},{i:46,start:368.725,end:378.869,es:"Habría más trabajo si la tienda abriera los domingos.",group:"habrá, habría",group_index:5,level:"B1"},{i:47,start:378.869,end:387.2,es:"Me dijeron que habría una reunión.",group:"habrá, habría",group_index:5,level:"B1"},{i:48,start:388.7,end:396.668,es:"Espero que haya mesas libres.",group:"haya, hubiera",group_index:6,level:"B1"},{i:49,start:396.668,end:405.063,es:"No creo que haya llegado todavía.",group:"haya, hubiera",group_index:6,level:"B1"},{i:50,start:405.063,end:412.839,es:"Me alegro de que hayas venido.",group:"haya, hubiera",group_index:6,level:"B1"},{i:51,start:412.839,end:420.849,es:"Cuando hayas terminado, llámame.",group:"haya, hubiera",group_index:6,level:"B1"},{i:52,start:420.849,end:429.052,es:"Ojalá haya buen tiempo mañana.",group:"haya, hubiera",group_index:6,level:"B1"},{i:53,start:429.052,end:436.871,es:"No creo que hayas entendido.",group:"haya, hubiera",group_index:6,level:"B1"},{i:54,start:436.871,end:445.137,es:"Me sorprendió que no hubiera nadie.",group:"haya, hubiera",group_index:6,level:"B1"},{i:55,start:446.637,end:452.493,es:"No hay de qué.",group:"expresiones",group_index:7,level:"A1"},{i:56,start:452.493,end:458.84,es:"¿Qué hay de nuevo?",group:"expresiones",group_index:7,level:"A2"},{i:57,start:458.84,end:464.952,es:"No hay prisa.",group:"expresiones",group_index:7,level:"A2"},{i:58,start:464.952,end:472.408,es:"Ha habido un cambio de planes.",group:"expresiones",group_index:7,level:"B1"},{i:59,start:472.408,end:479.288,es:"No hay nada que hacer.",group:"expresiones",group_index:7,level:"B1"},{i:60,start:479.288,end:487.32,es:"No hay mal que por bien no venga.",group:"expresiones",group_index:7,level:"B1"},{i:61,start:487.32,end:495.779,es:"No hay manera de abrir esta puerta.",group:"expresiones",group_index:7,level:"B1"}],Ml={word:bl,slug:ql,kind:fl,hash:yl,duration:jl,voice:Bl,marks:zl},El="hacer",$l="hacer",kl="word",Nl="59e7803fb839959c",wl=501,Ll="dora",Sl=[{i:0,start:.5,end:6.185,es:"¿Qué haces?",group:"hacer, actividades",group_index:0,level:"A1"},{i:1,start:6.185,end:14.303,es:"Hago la tarea después de cenar.",group:"hacer, actividades",group_index:0,level:"A1"},{i:2,start:14.303,end:23.039,es:"Mi padre hace la comida los domingos.",group:"hacer, actividades",group_index:0,level:"A1"},{i:3,start:23.039,end:31.711,es:"¿Qué hacen ustedes los fines de semana?",group:"hacer, actividades",group_index:0,level:"A1"},{i:4,start:31.711,end:40.084,es:"Hago ejercicio todas las mañanas.",group:"hacer, actividades",group_index:0,level:"A1"},{i:5,start:40.084,end:46.857,es:"Siempre hago la cama.",group:"hacer, actividades",group_index:0,level:"A1"},{i:6,start:46.857,end:55.359,es:"Mi madre hace un pastel muy rico.",group:"hacer, actividades",group_index:0,level:"A1"},{i:7,start:55.359,end:62.601,es:"No hago nada los sábados.",group:"hacer, actividades",group_index:0,level:"A1"},{i:8,start:62.601,end:70.249,es:"¿Qué vas a hacer esta noche?",group:"hacer, actividades",group_index:0,level:"A1"},{i:9,start:71.749,end:78.736,es:"Hoy hace mucho frío.",group:"el tiempo",group_index:1,level:"A1"},{i:10,start:78.736,end:85.915,es:"En verano hace calor.",group:"el tiempo",group_index:1,level:"A1"},{i:11,start:85.915,end:93.52,es:"Hace sol, vamos al parque.",group:"el tiempo",group_index:1,level:"A1"},{i:12,start:93.52,end:100.699,es:"Hace viento en la playa.",group:"el tiempo",group_index:1,level:"A1"},{i:13,start:100.699,end:108.581,es:"¿Qué tiempo hace en tu ciudad?",group:"el tiempo",group_index:1,level:"A1"},{i:14,start:108.581,end:116.443,es:"Hace buen tiempo para caminar.",group:"el tiempo",group_index:1,level:"A1"},{i:15,start:116.443,end:124.005,es:"Hoy hace un día precioso.",group:"el tiempo",group_index:1,level:"A1"},{i:16,start:124.005,end:131.163,es:"Ayer hizo mucho calor.",group:"el tiempo",group_index:1,level:"A2"},{i:17,start:132.663,end:139.82,es:"¿Puedo hacer una pregunta?",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A1"},{i:18,start:139.82,end:149.025,es:"Los estudiantes hacen muchas preguntas.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A1"},{i:19,start:149.025,end:157.1,es:"Tenemos que hacer fila para entrar.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:20,start:157.1,end:165.047,es:"Hicimos fila durante una hora.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:21,start:165.047,end:173.057,es:"Todavía no he hecho la maleta.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:22,start:173.057,end:183.073,es:"Siempre hago la maleta la noche antes del viaje.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:23,start:183.073,end:192.812,es:"El periodista le hizo una pregunta difícil.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:24,start:194.312,end:200.787,es:"¿Qué hiciste ayer?",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:25,start:200.787,end:208.776,es:"No hice nada el fin de semana.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:26,start:208.776,end:216.893,es:"Mi hermano hizo la cena anoche.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:27,start:216.893,end:225.715,es:"De niños hacíamos castillos de arena.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:28,start:225.715,end:232.808,es:"¿Ya has hecho la tarea?",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:29,start:232.808,end:240.819,es:"Hemos hecho un viaje increíble.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:30,start:240.819,end:247.613,es:"Lo hice sin pensar.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:31,start:247.613,end:254.835,es:"¿Qué hacías a esa hora?",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:32,start:256.335,end:263.428,es:"Llegué hace dos horas.",group:"hace, pasado",group_index:4,level:"A2"},{i:33,start:263.428,end:272.676,es:"Hace un año que nos conocimos en Madrid.",group:"hace, pasado",group_index:4,level:"A2"},{i:34,start:272.676,end:279.236,es:"La vi hace poco.",group:"hace, pasado",group_index:4,level:"A2"},{i:35,start:279.236,end:288.313,es:"Hace tres días que hablamos por teléfono.",group:"hace, pasado",group_index:4,level:"A2"},{i:36,start:288.313,end:298.201,es:"Mis abuelos se casaron hace cincuenta años.",group:"hace, pasado",group_index:4,level:"A2"},{i:37,start:298.201,end:306.895,es:"Hace mucho tiempo vivía en el campo.",group:"hace, pasado",group_index:4,level:"A2"},{i:38,start:306.895,end:315.119,es:"¿Cuánto tiempo hace que llegaste?",group:"hace, pasado",group_index:4,level:"A2"},{i:39,start:315.119,end:324.239,es:"Terminé la universidad hace diez años.",group:"hace, pasado",group_index:4,level:"A2"},{i:40,start:325.739,end:334.347,es:"Hace dos años que estudio español.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:41,start:334.347,end:342.571,es:"Hace mucho tiempo que no te veo.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:42,start:342.571,end:350.987,es:"¿Cuánto tiempo hace que vives aquí?",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:43,start:350.987,end:359.467,es:"Hace una hora que espero el autobús.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:44,start:359.467,end:366.901,es:"Hace meses que no llueve.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:45,start:366.901,end:375.488,es:"Hace tiempo que quiero visitar Perú.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:46,start:375.488,end:383.989,es:"Hace una semana que no duermo bien.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:47,start:385.489,end:391.537,es:"Hazme caso.",group:"hacer caso",group_index:6,level:"A2"},{i:48,start:391.537,end:399.612,es:"Los niños no me hacen caso.",group:"hacer caso",group_index:6,level:"A2"},{i:49,start:399.612,end:407.836,es:"Nunca haces caso a tus padres.",group:"hacer caso",group_index:6,level:"A2"},{i:50,start:407.836,end:415.932,es:"Debí hacerle caso al médico.",group:"hacer caso",group_index:6,level:"B1"},{i:51,start:415.932,end:424.689,es:"Te lo dije, pero no me hiciste caso.",group:"hacer caso",group_index:6,level:"B1"},{i:52,start:424.689,end:433.297,es:"No le hagas caso, está de mal humor.",group:"hacer caso",group_index:6,level:"B1"},{i:53,start:433.297,end:441.585,es:"Quiero que me hagas caso esta vez.",group:"hacer caso",group_index:6,level:"B1"},{i:54,start:443.085,end:450.307,es:"Se está haciendo tarde.",group:"hacerse",group_index:7,level:"B1"},{i:55,start:450.307,end:457.933,es:"Mi hermana se hizo médica.",group:"hacerse",group_index:7,level:"B1"},{i:56,start:457.933,end:466.371,es:"Nos hicimos amigos en el colegio.",group:"hacerse",group_index:7,level:"B1"},{i:57,start:466.371,end:475,es:"Con los años, se hizo más paciente.",group:"hacerse",group_index:7,level:"B1"},{i:58,start:475,end:483.309,es:"Quiere hacerse rico muy rápido.",group:"hacerse",group_index:7,level:"B1"},{i:59,start:483.309,end:492.557,es:"Se hace de noche muy temprano en invierno.",group:"hacerse",group_index:7,level:"B1"},{i:60,start:492.557,end:500.952,es:"Ojalá nos hagamos buenos amigos.",group:"hacerse",group_index:7,level:"B1"}],Tl={word:El,slug:$l,kind:kl,hash:Nl,duration:wl,voice:Ll,marks:Sl},Pl="igual",Cl="igual",Hl="word",Ql="29174e8414e73c3d",Dl=539.184,Yl="dora",Vl=[{i:0,start:.5,end:8.745,es:"Mi camisa es igual a la tuya.",group:"igual e iguales",group_index:0,level:"A1"},{i:1,start:8.745,end:16.521,es:"Las dos casas son iguales.",group:"igual e :157.985,end:167.617,es:"Los dos exámenes fueron igual de difíciles.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:20,start:167.617,end:176.972,es:"Ella es igual de simpática que su hermana.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:21,start:176.972,end:186.305,es:"El tren y el autobús son igual de rápidos.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:22,start:186.305,end:195.703,es:"Hoy el tráfico está igual de mal que ayer.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:23,start:195.703,end:205.036,es:"Los dos trabajos son igual de importantes.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:24,start:206.536,end:212.584,es:"Me da igual.",group:"me da igual y es igual",group_index:3,level:"A1"},{i:25,start:212.584,end:219.677,es:"Me da igual el color.",group:"me da igual y es igual",group_index:3,level:"A1"},{i:26,start:219.677,end:227.368,es:"Da igual, mañana lo hacemos.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:27,start:227.368,end:235.635,es:"A mi padre le da igual la música.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:28,start:235.635,end:244.136,es:"¿Te da igual comer en casa o fuera?",group:"me da igual y es igual",group_index:3,level:"A2"},{i:29,start:244.136,end:251.635,es:"Es igual, no pasa nada.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:30,start:251.635,end:258.856,es:"Nos da igual el lugar.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:31,start:258.856,end:266.781,es:"A ellos les da igual el precio.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:32,start:266.781,end:276.093,es:"Ese día me daba igual perder el partido.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:33,start:276.093,end:282.867,es:"A mí no me da igual.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:34,start:282.867,end:291.411,es:"Da igual si llueve, vamos a salir.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:35,start:292.911,end:301.476,es:"La madre quiere a sus hijos por igual.",group:"por igual",group_index:4,level:"A2"},{i:36,start:301.476,end:309.593,es:"Dividimos la cuenta por igual.",group:"por igual",group_index:4,level:"A2"},{i:37,start:309.593,end:318.948,es:"En casa repartimos las tareas por igual.",group:"por igual",group_index:4,level:"B1"},{i:38,start:318.948,end:326.767,es:"La ley es para todos por igual.",group:"por igual",group_index:4,level:"B1"},{i:39,start:326.767,end:337.252,es:"Las ganancias se reparten por igual entre los socios.",group:"por igual",group_index:4,level:"B1"},{i:40,start:337.252,end:345.54,es:"El calor afecta a todos por igual.",group:"por igual",group_index:4,level:"B1"},{i:41,start:347.04,end:355.307,es:"Al igual que tú, prefiero el campo.",group:"al igual que",group_index:5,level:"B1"},{i:42,start:355.307,end:363.595,es:"Al igual que su padre, es médico.",group:"al igual que",group_index:5,level:"B1"},{i:43,start:363.595,end:374.187,es:"Al igual que el año pasado, vamos a la playa en agosto.",group:"al igual que",group_index:5,level:"B1"},{i:44,start:374.187,end:384.395,es:"Ella, al igual que su hermano, habla tres idiomas.",group:"al igual que",group_index:5,level:"B1"},{i:45,start:384.395,end:394.645,es:"Al igual que muchas personas, trabajo desde casa.",group:"al igual que",group_index:5,level:"B1"},{i:46,start:394.645,end:403.424,es:"Al igual que ayer, el tren llegó tarde.",group:"al igual que",group_index:5,level:"B1"},{i:47,start:403.424,end:413.632,es:"Al igual que en otros países, aquí la comida es cara.",group:"al igual que",group_index:5,level:"B1"},{i:48,start:415.132,end:422.183,es:"Igual llueve mañana.",group:"igual: quizás",group_index:6,level:"B1"},{i:49,start:422.183,end:430.663,es:"Igual vamos al cine esta noche.",group:"igual: quizás",group_index:6,level:"B1"},{i:50,start:430.663,end:438.396,es:"Igual no viene a la fiesta.",group:"igual: quizás",group_index:6,level:"B1"},{i:51,start:438.396,end:446.407,es: ,group:"llevar, cargar",group_index:0,level:"A1"},{i:4,start:29.577,end:37.673,es:"¿Puedes llevar la sopa a la mesa?",group:"llevar, cargar",group_index:0,level:"A1"},{i:5,start:37.673,end:46.068,es:"Mi padre lleva la maleta grande.",group:"llevar, cargar",group_index:0,level:"A1"},{i:6,start:46.068,end:53.737,es:"Llevé el pastel a la fiesta.",group:"llevar, cargar",group_index:0,level:"A2"},{i:7,start:53.737,end:61.94,es:"No llevaba el pasaporte encima.",group:"llevar, cargar",group_index:0,level:"A2"},{i:8,start:63.44,end:71.045,es:"Hoy llevo un vestido rojo.",group:"llevar ropa",group_index:1,level:"A1"},{i:9,start:71.045,end:79.675,es:"Mi abuelo lleva una corbata azul.",group:"llevar ropa",group_index:1,level:"A1"},{i:10,start:79.675,end:87.216,es:"¿Qué vas a llevar a la boda?",group:"llevar ropa",group_index:1,level:"A1"},{i:11,start:87.216,end:94.864,es:"Ella siempre lleva sombrero.",group:"llevar ropa",group_index:1,level:"A1"},{i:12,start:94.864,end:102.981,es:"Llevas una camisa muy bonita.",group:"llevar ropa",group_index:1,level:"A1"},{i:13,start:102.981,end:111.141,es:"El niño lleva zapatos nuevos.",group:"llevar ropa",group_index:1,level:"A1"},{i:14,start:111.141,end:119.323,es:"En verano llevo ropa ligera.",group:"llevar ropa",group_index:1,level:"A1"},{i:15,start:119.323,end:127.653,es:"Ayer llevaba una chaqueta negra.",group:"llevar ropa",group_index:1,level:"A2"},{i:16,start:129.153,end:135.777,es:"Te llevo a casa.",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:17,start:135.777,end:143.468,es:"Llevo a mis hijos a la escuela.",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:18,start:143.468,end:150.86,es:"¿Me llevas al aeropuerto?",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:19,start:150.86,end:158.807,es:"Este autobús te lleva al centro.",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:20,start:158.807,end:166.625,es:"Mi madre me llevó al médico.",group:"llevar a alguien a un lugar",group_index:2,level:"A2"},{i:21,start:166.625,end:175.852,es:"Te voy a llevar a un restaurante muy bueno.",group:"llevar a alguien a un lugar",group_index:2,level:"A2"},{i:22,start:175.852,end:185.655,es:"Llevamos al perro al parque todas las mañanas.",group:"llevar a alguien a un lugar",group_index:2,level:"A2"},{i:23,start:187.155,end:194.355,es:"Llevo dos años aquí.",group:"llevar tiempo",group_index:3,level:"A2"},{i:24,start:194.355,end:203.112,es:"¿Cuánto tiempo llevas en esta ciudad?",group:"llevar tiempo",group_index:3,level:"A2"},{i:25,start:203.112,end:210.888,es:"Llevamos una hora en la fila.",group:"llevar tiempo",group_index:3,level:"A2"},{i:26,start:210.888,end:220.328,es:"Mis padres llevan treinta años casados.",group:"llevar tiempo",group_index:3,level:"A2"},{i:27,start:220.328,end:229.149,es:"Ella lleva tres meses en la empresa.",group:"llevar tiempo",group_index:3,level:"A2"},{i:28,start:229.149,end:237.459,es:"Este trabajo lleva mucho tiempo.",group:"llevar tiempo",group_index:3,level:"A2"},{i:29,start:237.459,end:246.685,es:"Preparar la cena me llevó toda la tarde.",group:"llevar tiempo",group_index:3,level:"A2"},{i:30,start:248.185,end:255.471,es:"Llevo una hora esperando.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:31,start:255.471,end:263.46,es:"Llevamos todo el día caminando.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:32,start:263.46,end:272.58,es:"¿Cuánto tiempo llevas estudiando español?",group:"llevar + gerundio",group_index:4,level:"A2"},{i:33,start:272.58,end:281.316,es:"Lleva tres días lloviendo sin parar.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:34,start:281.316,end:289.412,es:"Llevo meses buscando trabajo.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:35,start:289.412,end:299.193,es:"Mi vecino lleva toda la mañana haciendo ruido.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:36,start:299.193,end:309.465,es:"Cuando lo conocí, llevaba dos años viviendo solo.",group:"llevar + gerundio",group_index:4,level:"B1"},{i:37,start:310.965,end:319.061,es:"Me llevo muy bien con mi hermana.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:38,start:319.061,end:326.539,es:"Mis padres se llevan bien.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:39,start:326.539,end:334.272,es:"No me llevo bien con mi jefe.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:40,start:334.272,end:343.413,es:"Los dos gatos no se llevan nada bien.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:41,start:343.413,end:351.829,es:"¿Te llevas bien con tus compañeros?",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:42,start:351.829,end:360.096,es:"De niños nos llevábamos muy mal.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:43,start:360.096,end:368.533,es:"Espero que te lleves bien con ellos.",group:"llevarse bien o mal",group_index:5,level:"B1"},{i:44,start:370.033,end:377.169,es:"¿Me lo llevo o lo dejo?",group:"llevarse algo",group_index:6,level:"A2"},{i:45,start:377.169,end:385.436,es:"Me llevo esta camisa, por favor.",group:"llevarse algo",group_index:6,level:"A2"},{i:46,start:385.436,end:393.063,es:"Alguien se llevó mi paraguas.",group:"llevarse algo",group_index:6,level:"A2"},{i:47,start:393.063,end:401.073,es:"Me llevé una sorpresa enorme.",group:"llevarse algo",group_index:6,level:"B1"},{i:48,start:401.073,end:408.807,es:"El viento se llevó las hojas.",group:"llevarse algo",group_index:6,level:"B1"},{i:49,start:408.807,end:418.033,es:"Nos llevamos un buen susto con la tormenta.",group:"llevarse algo",group_index:6,level:"B1"},{i:50,start:418.033,end:427.281,es:"No te lleves mi cargador, que lo necesito.",group:"llevarse algo",group_index:6,level:"B1"},{i:51,start:427.281,end:435.761,es:"El ladrón se llevó todas las joyas.",group:"llevarse algo",group_index:6,level:"B1"},{i:52,start:437.261,end:446.168,es:"Mi hermano siempre me lleva la contraria.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:53,start:446.168,end:454.669,es:"Ella lleva la cuenta de los gastos.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:54,start:454.669,end:463.661,es:"Mi abuela lleva una vida muy tranquila.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:55,start:463.661,end:472.397,es:"Este camino no lleva a ninguna parte.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:56,start:472.397,end:480.941,es:"No te dejes llevar por los nervios.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:57,start:480.941,end:488.291,es:"Yo te llevo tres años.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:58,start:488.291,end:498.371,es:"Ellos llevan la empresa juntos desde hace años.",group:"expresiones con llevar",group_index:7,level:"B1"}],Jl={word:Il,slug:Fl,kind:Rl,hash:Ul,duration:Gl,voice:Kl,marks:Wl},Xl="lo",Zl="lo",ei="word",ai="93f6e53a8c3449c6",oi=489.864,ri="dora",si=[{i:0,start:.5,end:10.025,es:"¿Conoces a Pedro? Sí, lo conozco del trabajo.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:1,start:10.025,end:17.78,es:"¿El café? Lo tomo sin azúcar.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:2,start:17.78,end:26.665,es:"Mi hermano está en casa, lo llamo ahora.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:3,start:26.665,end:35.06,es:"Este vestido es bonito, lo compro.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:4,start:35.06,end:43.839,es:"No encuentro mi teléfono, ¿lo tienes tú?",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:5,start:43.839,end:52.297,es:"El pan está aquí, lo pongo en la mesa.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:6,start:52.297,end:62.143,es:"Mi abuelo vive lejos, pero lo visito los domingos.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:7,start:62.143,end:70.943,es:"El auto está sucio, lo lavo mañana.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:8,start:70.943,end:78.676,es:"¿Dónde está el perro? No lo veo.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:9,start:80.176,end:85.776,es:"No lo sé.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:10,start:85.776,end:91.44,es:"Ya lo sé.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:11,start:91.44,end:98.235,es:"Lo sé, tienes razón.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:12,start:98.235,end:106.672,es:"¿Sabes dónde vive Ana? No, no lo sé.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:13,start:106.672,end:112.464,es:"No lo creo.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:14,start:112.464,end:118.981,es:"Lo siento mucho.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:15,start:118.981,end:124.965,es:"¿Lo entiendes?",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:16,start:124.965,end:131.013,es:"Te lo prometo.",group:"lo sé, no lo sé",group_index:1,level:"A2"},{i:17,start:132.513,end:139.799,es:"Voy a comprarlo mañana.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:18,start:139.799,end:147.596,es:"¿Puedes repetirlo, por favor?",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:19,start:147.596,end:154.604,es:"Quiero verlo otra vez.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:20,start:154.604,end:161.335,es:"Tómalo, es para ti.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:21,start:161.335,end:168.833,es:"Pruébalo, está muy rico.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:22,start:168.833,end:175.521,es:"Estoy pensándolo.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:23,start:175.521,end:184.663,es:"Tengo que terminarlo antes del viernes.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:24,start:184.663,end:191.351,es:"Ábrelo con cuidado.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:25,start:191.351,end:199.468,es:"Necesito leerlo dos veces.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:26,start:200.968,end:208.616,es:"Lo que necesito es dormir.",group:"lo que",group_index:3,level:"A2"},{i:27,start:208.616,end:215.901,es:"No entiendo lo que dices.",group:"lo que",group_index:3,level:"A2"},{i:28,start:215.901,end:223.528,es:"Esto es lo que compré ayer.",group:"lo que",group_index:3,level:"A2"},{i:29,start:223.528,end:231.859,es:"Lo que más me gusta es la playa.",group:"lo que",group_index:3,level:"A2"},{i:30,start:231.859,end:238.291,es:"Dime lo que pasó.",group:"lo que",group_index:3,level:"A2"},{i:31,start:238.291,end:246.515,es:"Lo que pasa es que estoy cansado.",group:"lo que",group_index:3,level:"A2"},{i:32,start:246.515,end:254.547,es:"Gracias por todo lo que hiciste.",group:"lo que",group_index:3,level:"A2"},{i:33,start:254.547,end:261.789,es:"No sé lo que voy a hacer.",group:"lo que",group_index:3,level:"A2"},{i:34,start:261.789,end:269.629,es:"Todo lo que dijo era verdad.",group:"lo que",group_index:3,level:"A2"},{i:35,start:269.629,end:276.019,es:"Haz lo que quieras.",group:"lo que",group_index:3,level:"B1"},{i:36,start:277.519,end:284.1,es:"Yo quiero lo mismo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A1"},{i:37,start:284.1,end:291.492,es:"A lo mejor llueve mañana.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:38,start:291.492,end:298.735,es:"A lo mejor tienes razón.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:39,start:298.735,end:305.849,es:"Siempre dice lo mismo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:40,start:305.849,end:312.153,es:"Me da lo mismo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:41,start:312.153,end:319.268,es:"Por lo menos come algo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:42,start:319.268,end:328.431,es:"Llegamos tarde, pero por lo menos llegamos.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:43,start:328.431,end:336.868,es:"Necesito por lo menos dos horas.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:44,start:336.868,end:345.241,es:"Por lo general, desayuno en casa.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:45,start:346.741,end:354.027,es:"Lo bueno es que hace sol.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:46,start:354.027,end:361.077,es:"Lo malo es el precio.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:47,start:361.077,end:369.237,es:"Lo importante es estar juntos.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:48,start:369.237,end:377.397,es:"Lo mejor del viaje fue la comida.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:49,start:377.397,end:384.149,es:"Lo peor ya pasó.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:50,start:384.149,end:391.584,es:"Lo difícil es empezar.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:51,start:391.584,end:399.979,es:"Lo más importante es la salud.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:52,start:399.979,end:408.075,es:"Lo raro es que nadie contestó.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:53,start:408.075,end:416.512,es:"Lo bueno de esta ciudad es el clima.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:54,start:418.012,end:426.855,es:"No sabes lo rápido que corre mi hija.",group:"lo rápido que",group_index:6,level:"B1"},{i:55,start:426.855,end:435.868,es:"Me sorprende lo bien que hablas español.",group:"lo rápido que",group_index:6,level:"B1"},{i:56,start:435.868,end:443.751,es:"Mira lo grande que está tu hijo.",group:"lo rápido que",group_index:6,level:"B1"},{i:57,start:443.751,end:452.508,es:"No te imaginas lo cansada que estoy.",group:"lo rápido que",group_index:6,level:"B1"},{i:58,start:452.508,end:462.204,es:"Ya ves lo difícil que es encontrar trabajo.",group:"lo rápido que",group_index:6,level:"B1"},{i:59,start:462.204,end:470.705,es:"Es increíble lo caro que está todo.",group:"lo rápido que",group_index:6,level:"B1"},{i:60,start:470.705,end:480.039,es:"Me encanta lo tranquilo que es este barrio.",group:"lo rápido que",group_index:6,level:"B1"},{i:61,start:480.039,end:489.799,es:"Todavía recuerdo lo feliz que estaba ese día.",group:"lo rápido que",group_index:6,level:"B1"}],ni={word:Xl,slug:Zl,kind:ei,hash:ai,duration:oi,voice:ri,marks:si},li="mismo",ii="mismo",ti="word",ui="7a60fefe58ac8395",di=462.792,pi="dora",gi=[{i:0,start:.5,end:7.807,es:"Tenemos el mismo libro.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:1,start:7.807,end:15.54,es:"Vivimos en la misma calle.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:2,start:15.54,end:24.127,es:"Siempre como en el mismo restaurante.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:3,start:24.127,end:33.332,es:"Mi hermano y yo tenemos los mismos ojos.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:4,start:33.332,end:42.303,es:"Ellas trabajan en la misma oficina.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:5,start:42.303,end:50.249,es:"Es la misma canción de ayer.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:6,start:50.249,end:58.281,es:"Llevas la misma camisa que yo.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:7,start:58.281,end:65.716,es:"Nacimos el mismo año.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:8,start:67.216,end:73.691,es:"Para mí, lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:9,start:73.691,end:80.912,es:"Siempre dices lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:10,start:80.912,end:88.752,es:"Yo quiero lo mismo, por favor.",group:"lo mismo",group_index:1,level:"A1"},{i:11,start:88.752,end:96.72,es:"Todos los días hago lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:12,start:96.72,end:102.96,es:"No es lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:13,start:102.96,end:110.139,es:"Pienso lo mismo que tú.",group:"lo mismo",group_index:1,level:"A1"},{i:14,start:110.139,end:118.896,es:"Me pasó lo mismo la semana pasada.",group:"lo mismo",group_index:1,level:"A2"},{i:15,start:120.396,end:126.849,es:"Ven ahora mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A1"},{i:16,start:126.849,end:134.433,es:"Ahora mismo estoy ocupado.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A1"},{i:17,start:134.433,end:141.356,es:"Te espero aquí mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:18,start:141.356,end:148.385,es:"Lo envío hoy mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:19,start:148.385,end:157.633,es:"El hotel está ahí mismo, al lado del parque.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:20,start:157.633,end:165.388,es:"Voy a llamarla ahora mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:21,start:165.388,end:174.039,es:"Puedes dejar las bolsas aquí mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:22,start:174.039,end:181.281,es:"Ayer mismo hablé con él.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:23,start:182.781,end:189.448,es:"Yo mismo lo hice.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:24,start:189.448,end:196.648,es:"Ella misma me lo dijo.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:25,start:196.648,end:204.061,es:"Lo puedo hacer yo misma.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:26,start:204.061,end:212.733,es:"Nosotros mismos pintamos la casa.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:27,start:212.733,end:221.576,es:"El director mismo vino a saludarnos.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:28,start:221.576,end:228.051,es:"Hazlo tú mismo.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:29,start:228.051,end:237,es:"Ellos mismos prepararon toda la comida.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:30,start:238.5,end:246.127,es:"Llegamos al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:31,start:246.127,end:254.329,es:"No hablen todos al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:32,start:254.329,end:264.644,es:"Puedo cocinar y escuchar música al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:33,start:264.644,end:273.977,es:"Sonaron los dos teléfonos al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:34,start:273.977,end:284.207,es:"Es difícil estudiar y trabajar al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:35,start:284.207,end:293.284,es:"Quiero ir, pero al mismo tiempo tengo miedo.",group:"al mismo tiempo",group_index:4,level:"B1"},{i:36,start:294.784,end:303.136,es:"Gano lo mismo que el año pasado.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:37,start:303.136,end:312.192,es:"Este vestido cuesta lo mismo que el otro.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:38,start:312.192,end:321.227,es:"Ella tiene la misma edad que mi hermana.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:39,start:321.227,end:330.219,es:"Mi casa es del mismo color que la tuya.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:40,start:330.219,end:338.357,es:"Hoy hace el mismo calor que ayer.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:41,start:338.357,end:348.395,es:"Estudiamos en la misma escuela que nuestros padres.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:42,start:349.895,end:356.199,es:"Me da lo mismo.",group:"da lo mismo",group_index:6,level:"A2"},{i:43,start:356.199,end:363.569,es:"¿Té o café? Me da lo mismo.",group:"da lo mismo",group_index:6,level:"A2"},{i:44,start:363.569,end:371.281,es:"Da lo mismo si llegas tarde.",group:"da lo mismo",group_index:6,level:"B1"},{i:45,start:371.281,end:380.423,es:"Le da lo mismo lo que piensen los demás.",group:"da lo mismo",group_index:6,level:"B1"},{i:46,start:380.423,end:388.903,es:"A mí me da lo mismo dónde comamos.",group:"da lo mismo",group_index:6,level:"B1"},{i:47,start:388.903,end:396.551,es:"Da lo mismo, ya no importa.",group:"da lo mismo",group_index:6,level:"B1"},{i:48,start:396.551,end:404.945,es:"Nos da lo mismo ir hoy o mañana.",group:"da lo mismo",group_index:6,level:"B1"},{i:49,start:406.445,end:413.88,es:"Solo piensa en sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:50,start:413.88,end:421.891,es:"Ella habla mucho de sí misma.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:51,start:421.891,end:429.688,es:"Ella cree mucho en sí misma.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:52,start:429.688,end:438.36,es:"El problema en sí mismo no es grave.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:53,start:438.36,end:445.603,es:"Él se ríe de sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:54,start:445.603,end:453.784,es:"Él no sabe cuidarse a sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:55,start:453.784,end:462.733,es:"Mi abuelo está muy seguro de sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"}],ci={word:li,slug:ii,kind:ti,hash:ui,duration:di,voice:pi,marks:gi},vi="pasar",mi="pasar",_i="word",xi="c235ea45c3c26a21",Ai=479.112,hi="dora",bi=[{i:0,start:.5,end:8.916,es:"Pasa, pasa, estás en tu casa.",group:"pasar, entrar",group_index:0,level:"A1"},{i:1,start:8.916,end:14.943,es:"¿Puedo pasar?",group:"pasar, entrar",group_index:0,level:"A1"},{i:2,start:14.943,end:21.567,es:"Pasen, por favor.",group:"pasar, entrar",group_index:0,level:"A1"},{i:3,start:21.567,end:29.151,es:"Pase, la doctora lo espera.",group:"pasar, entrar",group_index:0,level:"A1"},{i:4,start:29.151,end:36.735,es:"No se puede pasar por aquí.",group:"pasar, entrar",group_index:0,level:"A1"},{i:5,start:36.735,end:44.276,es:"Déjame pasar, por favor.",group:"pasar, entrar",group_index:0,level:"A1"},{i:6,start:45.776,end:51.525,es:"¿Qué pasa?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:7,start:51.525,end:57.275,es:"¿Qué pasó?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:8,start:57.275,end:63.493,es:"No pasa nada.",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:9,start:63.493,end:69.541,es:"¿Qué te pasa?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:10,start:69.541,end:77.68,es:"Algo le pasa a mi computadora.",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:11,start:77.68,end:84.517,es:"¿Qué le pasa al bebé?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:12,start:84.517,end:92.464,es:"Esto siempre me pasa los lunes.",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:13,start:92.464,end:101.499,es:"Ayer pasó algo muy raro en la oficina.",group:"pasar, ocurrir",group_index:1,level:"A2"},{i:14,start:101.499,end:108.976,es:"¿Qué te ha pasado en la mano?",group:"pasar, ocurrir",group_index:1,level:"A2"},{i:15,start:110.476,end:119.233,es:"El autobús pasa cada diez minutos.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:16,start:119.233,end:126.967,es:"Paso por tu casa a las seis.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:17,start:126.967,end:134.913,es:"Este tren pasa por mi pueblo.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:18,start:134.913,end:143.884,es:"Pasamos por el parque de camino a casa.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:19,start:143.884,end:151.468,es:"Ayer pasé por la panadería.",group:"pasar por un lugar",group_index:2,level:"A2"},{i:20,start:151.468,end:161.889,es:"¿Puedes pasar por el supermercado después del trabajo?",group:"pasar por un lugar",group_index:2,level:"A2"},{i:21,start:161.889,end:170.412,es:"Un perro pasó corriendo por la calle.",group:"pasar por un lugar",group_index:2,level:"A2"},{i:22,start:171.912,end:180.285,es:"Paso mucho tiempo con mi familia.",group:"pasar el tiempo",group_index:3,level:"A1"},{i:23,start:180.285,end:188.488,es:"Pasamos el verano en la playa.",group:"pasar el tiempo",group_index:3,level:"A1"},{i:24,start:188.488,end:195.773,es:"Pasé la tarde leyendo.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:25,start:195.773,end:203.379,es:"¿Dónde pasaste la Navidad?",group:"pasar el tiempo",group_index:3,level:"A2"},{i:26,start:203.379,end:212.733,es:"Ella pasa horas delante de la computadora.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:27,start:212.733,end:221.981,es:"Hemos pasado una semana increíble en Perú.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:28,start:221.981,end:231.4,es:"Voy a pasar el fin de semana con mis abuelos.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:29,start:232.9,end:239.417,es:"¡Que lo pases bien!",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:30,start:239.417,end:247.812,es:"Lo pasamos muy bien en la fiesta.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:31,start:247.812,end:257.06,es:"Los niños lo pasaron genial en el parque.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:32,start:257.06,end:265.945,es:"Lo pasé muy mal en el viaje en barco.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:33,start:265.945,end:274.127,es:"¿Lo pasaste bien en el concierto?",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:34,start:274.127,end:283.545,es:"Mi abuela lo pasó mal cuando estuvo enferma.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:35,start:283.545,end:291.556,es:"Siempre lo pasamos bien juntos.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:36,start:293.056,end:300.981,es:"El tiempo pasa muy rápido.",group:"el tiempo pasa",group_index:5,level:"A1"},{i:37,start:300.981,end:308.352,es:"Ya pasaron tres años.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:38,start:308.352,end:317.045,es:"Pasaron muchos días sin noticias.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:39,start:317.045,end:326.123,es:"Han pasado diez minutos y no ha llegado.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:40,start:326.123,end:334.069,es:"Con los años, el dolor pasa.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:41,start:334.069,end:341.12,es:"Ya pasó la tormenta.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:42,start:341.12,end:351.179,es:"Cuando pase el invierno, vamos a pintar la casa.",group:"el tiempo pasa",group_index:5,level:"B1"},{i:43,start:352.679,end:359.281,es:"¿Me pasas la sal?",group:"pasar algo a alguien",group_index:6,level:"A1"},{i:44,start:359.281,end:366.972,es:"Pásame el agua, por favor.",group:"pasar algo a alguien",group_index:6,level:"A1"},{i:45,start:366.972,end:375.004,es:"Te paso el número de mi hermano.",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:46,start:375.004,end:382.951,es:"Le pasé el balón a mi amigo.",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:47,start:382.951,end:391.047,es:"¿Me pasaste las fotos del viaje?",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:48,start:391.047,end:399.655,es:"Ya le he pasado el mensaje a mi jefe.",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:49,start:401.155,end:410.531,es:"Pasé el examen de matemáticas a la primera.",group:"expresiones con pasar",group_index:7,level:"A2"},{i:50,start:410.531,end:418.904,es:"Me pasé de parada en el autobús.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:51,start:418.904,end:427.107,es:"Ya se me pasó el dolor de cabeza.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:52,start:427.107,end:434.392,es:"No te pases con la sal.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:53,start:434.392,end:443.213,es:"Se me pasó llamarte, lo siento mucho.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:54,start:443.213,end:453.464,es:"Pasamos por momentos difíciles el año pasado.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:55,start:453.464,end:461.837,es:"Ojalá que no le pase nada malo.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:56,start:461.837,end:470.637,es:"Pase lo que pase, yo estoy contigo.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:57,start:470.637,end:479.053,es:"Esa canción ya pasó de moda.",group:"expresiones con pasar",group_index:7,level:"B1"}],qi={word:vi,slug:mi,kind:_i,hash:xi,duration:Ai,voice:hi,marks:bi},fi="poner(se)",yi="poner_se",ji="word",Bi="5dbf60ad7dfae640",zi=533.784,Mi="dora",Ei=[{i:0,start:.5,end:7.935,es:"Pon las llaves en la mesa.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:1,start:7.935,end:15.071,es:"¿Dónde pongo mi abrigo?",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:2,start:15.071,end:23.721,es:"Pongo la leche en el refrigerador.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:3,start:23.721,end:31.604,es:"Ella pone las flores en el agua.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:4,start:31.604,end:39.572,es:"No pongas los pies en el sofá.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:5,start:39.572,end:47.881,es:"Pon los zapatos debajo de la cama.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:6,start:47.881,end:55.529,es:"¿Pusiste azúcar en mi café?",group:"poner algo en un lugar",group_index:0,level:"A2"},{i:7,start:55.529,end:63.092,es:"Puse tu libro en la mochila.",group:"poner algo en un lugar",group_index:0,level:"A2"},{i:8,start:64.592,end:70.64,es:"¿Pongo la tele?",group:"poner la tele, la música",group_index:1,level:"A1"},{i:9,start:70.64,end:77.925,es:"Pon música, por favor.",group:"poner la tele, la música",group_index:1,level:"A1"},{i:10,start:77.925,end:86.747,es:"Mi padre pone la radio por la mañana.",group:"poner la tele, la música",group_index:1,level:"A1"},{i:11,start:86.747,end:94.416,es:"¿Puedes poner la calefacción?",group:"poner la tele, la música",group_index:1,level:"A1"},{i:12,start:94.416,end:102.256,es:"Pon el ventilador, por favor.",group:"poner la tele, la música",group_index:1,level:"A1"},{i:13,start:102.256,end:110.117,es:"Puse el despertador a las seis.",group:"poner la tele, la música",group_index:1,level:"A2"},{i:14,start:110.117,end:118.427,es:"Pon una película, estoy aburrido.",group:"poner la tele, la música",group_index:1,level:"A2"},{i:15,start:118.427,end:128.741,es:"Voy a poner el aire acondicionado, hace mucho calor.",group:"poner la tele, la música",group_index:1,level:"A2"},{i:16,start:130.241,end:138.103,es:"Pon la mesa, vamos a comer.",group:"poner la mesa",group_index:2,level:"A1"},{i:17,start:138.103,end:146.412,es:"Yo pongo la mesa y tú cocinas.",group:"poner la mesa",group_index:2,level:"A1"},{i:18,start:146.412,end:153.783,es:"¿Quién pone la mesa hoy?",group:"poner la mesa",group_index:2,level:"A1"},{i:19,start:153.783,end:163.244,es:"Los niños ponen la mesa todas las noches.",group:"poner la mesa",group_index:2,level:"A1"},{i:20,start:163.244,end:171.809,es:"Ayúdame a poner la mesa, por favor.",group:"poner la mesa",group_index:2,level:"A1"},{i:21,start:171.809,end:179.799,es:"Ya puse la mesa para la cena.",group:"poner la mesa",group_index:2,level:"A2"},{i:22,start:181.299,end:188.904,es:"Ponte el abrigo, hace frío.",group:"ponerse ropa",group_index:3,level:"A1"},{i:23,start:188.904,end:195.891,es:"Me pongo los zapatos.",group:"ponerse ropa",group_index:3,level:"A1"},{i:24,start:195.891,end:204.605,es:"Ella siempre se pone un vestido rojo.",group:"ponerse ropa",group_index:3,level:"A1"},{i:25,start:204.605,end:212.616,es:"Ponte el cinturón de seguridad.",group:"ponerse ropa",group_index:3,level:"A1"},{i:26,start:212.616,end:221.139,es:"No me pongo esos pantalones nunca.",group:"ponerse ropa",group_index:3,level:"A1"},{i:27,start:221.139,end:229.469,es:"¿Qué te vas a poner para la fiesta?",group:"ponerse ropa",group_index:3,level:"A2"},{i:28,start:229.469,end:237.907,es:"Hoy me puse la camisa de mi hermano.",group:"ponerse ropa",group_index:3,level:"A2"},{i:29,start:237.907,end:246.685,es:"Los niños ya se pusieron el pijama.",group:"ponerse ropa",group_index:3,level:"A2"},{i:30,start:248.185,end:255.961,es:"Le pusieron Ana a la niña.",group:"poner nombre",group_index:4,level:"A2"},{i:31,start:255.961,end:264.292,es:"¿Qué nombre le vas a poner al perro?",group:"poner nombre",group_index:4,level:"A2"},{i:32,start:264.292,end:272.516,es:"Le pusimos Luna a nuestra gata.",group:"poner nombre",group_index:4,level:"A2"},{i:33,start:272.516,end:282.105,es:"Mis padres me pusieron el nombre de mi abuelo.",group:"poner nombre",group_index:4,level:"A2"},{i:34,start:282.105,end:291.076,es:"Todavía no le han puesto nombre al bebé.",group:"poner nombre",group_index:4,level:"A2"},{i:35,start:291.076,end:300.793,es:"¿Por qué le pusieron ese nombre al restaurante?",group:"poner nombre",group_index:4,level:"A2"},{i:36,start:300.793,end:311.044,es:"En el colegio le pusieron un apodo muy gracioso.",group:"poner nombre",group_index:4,level:"B1"},{i:37,start:312.544,end:321.472,es:"Me pongo nervioso antes de un examen.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:38,start:321.472,end:331.125,es:"Mi madre se puso muy contenta con la noticia.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:39,start:331.125,end:339.563,es:"El cielo se puso gris de repente.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:40,start:339.563,end:347.211,es:"Cuando la vio, se puso rojo.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:41,start:347.211,end:354.069,es:"No te pongas triste.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:42,start:354.069,end:363.915,es:"Mi abuela se puso enferma el invierno pasado.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:43,start:363.915,end:372.928,es:"Se pone de mal humor cuando tiene hambre.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:44,start:372.928,end:381.173,es:"Me puse muy feliz cuando llamaste.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:45,start:382.673,end:391.431,es:"De repente, el bebé se puso a llorar.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:46,start:391.431,end:400.38,es:"Cuando llegué a casa, me puse a cocinar.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:47,start:400.38,end:409.308,es:"Se puso a llover justo cuando salimos.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:48,start:409.308,end:418.3,es:"Ponte a estudiar, mañana tienes examen.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:49,start:418.3,end:428.423,es:"Después de cenar, nos pusimos a jugar a las cartas.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:50,start:428.423,end:437.777,es:"Si me pongo a ver la tele, no termino nunca.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:51,start:437.777,end:448.796,es:"Mi hermano se pone a cantar en la ducha todas las mañanas.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:52,start:448.796,end:458.449,es:"Quiero que te pongas a trabajar ahora mismo.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:53,start:459.949,end:467.512,es:"Nunca nos ponemos de acuerdo.",group:"ponerse de acuerdo",group_index:7,level:"A2"},{i:54,start:467.512,end:477.08,es:"Al final nos pusimos de acuerdo sobre el viaje.",group:"ponerse de acuerdo",group_index:7,level:"A2"},{i:55,start:477.08,end:487.181,es:"Tenemos que ponernos de acuerdo antes del viernes.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:56,start:487.181,end:496.28,es:"Es difícil que todos se pongan de acuerdo.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:57,start:496.28,end:505.123,es:"¿Ya se pusieron de acuerdo sobre el precio?",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:58,start:505.123,end:515.928,es:"Mis padres no se ponen de acuerdo sobre el nombre del perro.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:59,start:515.928,end:524.6,es:"Ojalá nos pongamos de acuerdo pronto.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:60,start:524.6,end:533.72,es:"Si no se ponen de acuerdo, no habrá fiesta.",group:"ponerse de acuerdo",group_index:7,level:"B1"}],$i={word:fi,slug:yi,kind:ji,hash:Bi,duration:zi,voice:Mi,marks:Ei},ki="por / para",Ni="por_para",wi="word",Li="8ca298754eea69f8",Si=504.936,Ti="dora",Pi=[{i:0,start:.5,end:7.359,es:"Estudio para aprender.",group:"para: finalidad",group_index:0,level:"A1"},{i:1,start:7.359,end:14.175,es:"Trabajo para vivir.",group:"para: finalidad",group_index:0,level:"A1"},{i:2,start:14.175,end:22.612,es:"Voy al mercado para comprar fruta.",group:"para: finalidad",group_index:0,level:"A1"},{i:3,start:22.612,end:30.644,es:"Necesito dinero para el viaje.",group:"para: finalidad",group_index:0,level:"A1"},{i:4,start:30.644,end:38.527,es:"Esta caja es para los libros.",group:"para: finalidad",group_index:0,level:"A1"},{i:5,start:38.527,end:45.364,es:"¿Para qué sirve esto?",group:"para: finalidad",group_index:0,level:"A1"},{i:6,start:45.364,end:53.375,es:"Me levanto temprano para correr.",group:"para: finalidad",group_index:0,level:"A1"},{i:7,start:53.375,end:61.023,es:"Ahorro para comprar una casa.",group:"para: finalidad",group_index:0,level:"A2"},{i:8,start:62.523,end:69.829,es:"Este regalo es para ti.",group:"para: destinatario",group_index:1,level:"A1"},{i:9,start:69.829,end:77.499,es:"Las flores son para mi madre.",group:"para: destinatario",group_index:1,level:"A1"},{i:10,start:77.499,end:84.592,es:"¿Para quién es el café?",group:"para: destinatario",group_index:1,level:"A1"},{i:11,start:84.592,end:92.069,es:"Hay una carta para usted.",group:"para: destinatario",group_index:1,level:"A1"},{i:12,start:92.069,end:100.357,es:"Trabaja para una empresa grande.",group:"para: destinatario",group_index:1,level:"A1"},{i:13,start:100.357,end:107.536,es:"Hice la cena para todos.",group:"para: destinatario",group_index:1,level:"A2"},{i:14,start:109.036,end:116.983,es:"Mañana salimos para la playa.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:15,start:116.983,end:125.463,es:"El tren para Quito sale a las ocho.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:16,start:125.463,end:133.388,es:"¿Este autobús va para el centro?",group:"para: destino y plazo",group_index:2,level:"A2"},{i:17,start:133.388,end:141.719,es:"Necesito el informe para el lunes.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:18,start:141.719,end:149.111,es:"La tarea es para mañana.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:19,start:149.111,end:157.313,es:"Para las seis ya estoy en casa.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:20,start:157.313,end:165.559,es:"Para el verano quiero hablar mejor.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:21,start:167.059,end:175.496,es:"Para mí, esta película es aburrida.",group:"para mí: opinión",group_index:3,level:"A2"},{i:22,start:175.496,end:184.168,es:"Para ella, la familia es lo primero.",group:"para mí: opinión",group_index:3,level:"A2"},{i:23,start:184.168,end:192.477,es:"Para mi gusto, hay demasiada sal.",group:"para mí: opinión",group_index:3,level:"A2"},{i:24,start:192.477,end:202.152,es:"Para nosotros, el domingo es el mejor día.",group:"para mí: opinión",group_index:3,level:"A2"},{i:25,start:202.152,end:210.973,es:"Para un niño tan pequeño, lee muy bien.",group:"para mí: opinión",group_index:3,level:"B1"},{i:26,start:210.973,end:219.688,es:"Hace mucho calor para ser diciembre.",group:"para mí: opinión",group_index:3,level:"B1"},{i:27,start:221.188,end:228.239,es:"Gracias por la comida.",group:"por: causa",group_index:4,level:"A1"},{i:28,start:228.239,end:235.055,es:"Perdón por la espera.",group:"por: causa",group_index:4,level:"A1"},{i:29,start:235.055,end:241.188,es:"Lo hice por ti.",group:"por: causa",group_index:4,level:"A2"},{i:30,start:241.188,end:248.452,es:"No salimos por la lluvia.",group:"por: causa",group_index:4,level:"A2"},{i:31,start:248.452,end:256.143,es:"Llegué tarde por el tráfico.",group:"por: causa",group_index:4,level:"A2"},{i:32,start:256.143,end:263.727,es:"Está cansado por el viaje.",group:"por: causa",group_index:4,level:"A2"},{i:33,start:263.727,end:271.78,es:"Me preocupo mucho por mi hijo.",group:"por: causa",group_index:4,level:"A2"},{i:34,start:273.28,end:280.309,es:"Caminamos por el parque.",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:35,start:280.309,end:287.317,es:"Estudio por la mañana.",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:36,start:287.317,end:294.261,es:"Hablamos por teléfono.",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:37,start:294.261,end:301.589,es:"¿Hay una farmacia por aquí?",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:38,start:301.589,end:309.472,es:"El gato entró por la ventana.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:39,start:309.472,end:317.248,es:"Paso por tu casa a las cinco.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:40,start:317.248,end:325.024,es:"Te mando las fotos por correo.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:41,start:325.024,end:332.693,es:"Viví en Perú por dos años.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:42,start:334.193,end:342.225,es:"Te cambio mi libro por el tuyo.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:43,start:342.225,end:350.3,es:"Pagamos mucho por esta casa.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:44,start:350.3,end:359.036,es:"Vendió su auto por muy poco dinero.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:45,start:359.036,end:367.751,es:"Cambié la camisa por una más grande.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:46,start:367.751,end:375.569,es:"Mañana trabajo yo por ti.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:47,start:375.569,end:383.943,es:"¿Cuánto pagaste por esa chaqueta?",group:"por: cambio y precio",group_index:6,level:"A2"},{i:48,start:385.443,end:392.941,es:"Por favor, cierra la puerta.",group:"por fin, por eso, por favor",group_index:7,level:"A1"},{i:49,start:392.941,end:399.523,es:"¡Por fin llegaste!",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:50,start:399.523,end:407.384,es:"Por supuesto que puedes venir.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:51,start:407.384,end:415.629,es:"Estaba enfermo, por eso no vine.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:52,start:415.629,end:423.683,es:"Por cierto, ¿viste a Juan ayer?",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:53,start:423.683,end:430.968,es:"Por ahora todo está bien.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:54,start:430.968,end:438.637,es:"Por suerte, no pasó nada.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:55,start:440.137,end:449.193,es:"Salí por la mañana para llegar temprano.",group:"por y para juntos",group_index:8,level:"B1"},{i:56,start:449.193,end:456.649,es:"Lo hice por ti, no para mí.",group:"por y para juntos",group_index:8,level:"B1"},{i:57,start:456.649,end:465.833,es:"Pasamos por Lima para visitar a mis tíos.",group:"por y para juntos",group_index:8,level:"B1"},{i:58,start:465.833,end:475.401,es:"Te llamo por teléfono para confirmar la hora.",group:"por y para juntos",group_index:8,level:"B1"},{i:59,start:475.401,end:484.82,es:"Estudia por las noches para aprobar el examen.",group:"por y para juntos",group_index:8,level:"B1"},{i:60,start:484.82,end:495.284,es:"Gracias por el regalo, es perfecto para mi casa nueva.",group:"por y para juntos",group_index:8,level:"B1"},{i:61,start:495.284,end:504.873,es:"Para llegar al hotel, hay que pasar por el puente.",group:"por y para juntos",group_index:8,level:"B1"}],Ci={word:ki,slug:Ni,kind:wi,hash:Li,duration:Si,voice:Ti,marks:Pi},Hi="que",Qi="que",Di="word",Yi="a14405659133eaa5",Vi=488.424,Oi="dora",Ii=[{i:0,start:.5,end:8.233,es:"Tengo que trabajar mañana.",group:"tener que, hay que",group_index:0,level:"A1"},{i:1,start:8.233,end:15.817,es:"Tienes que probar esta sopa.",group:"tener que, hay que",group_index:0,level:"A1"},{i:2,start:15.817,end:22.804,es:"Hay que salir temprano.",group:"tener que, hay que",group_index:0,level:"A1"},{i:3,start:22.804,end:30.089,es:"Tenemos que comprar pan.",group:"tener que, hay que",group_index:0,level:"A1"},{i:4,start:30.089,end:37.375,es:"Hay que pagar en efectivo.",group:"tener que, hay que",group_index:0,level:"A1"},{i:5,start:37.375,end:43.7,es:"¿Tienes que ir hoy?",group:"tener que, hay que",group_index:0,level:"A1"},{i:6,start:43.7,end:51.412,es:"Mis hijos tienen que estudiar.",group:"tener que, hay que",group_index:0,level:"A1"},{i:7,start:51.412,end:59.401,es:"Hay que tener cuidado con el perro.",group:"tener que, hay que",group_index:0,level:"A1"},{i:8,start:60.901,end:69.125,es:"La chica que canta es mi prima.",group:"el libro que leí",group_index:1,level:"A1"},{i:9,start:69.125,end:77.243,es:"Tengo un amigo que vive en Chile.",group:"el libro que leí",group_index:1,level:"A1"},{i:10,start:77.243,end:85.445,es:"El tren que va a Lima sale ahora.",group:"el libro que leí",group_index:1,level:"A1"},{i:11,start:85.445,end:93.925,es:"Es una película que me gusta mucho.",group:"el libro que leí",group_index:1,level:"A1"},{i:12,start:93.925,end:103.899,es:"Las personas que trabajan aquí son muy amables.",group:"el libro que leí",group_index:1,level:"A1"},{i:13,start:103.899,end:111.824,es:"El libro que leí es muy bueno.",group:"el libro que leí",group_index:1,level:"A2"},{i:14,start:111.824,end:120.24,es:"La casa que compramos es pequeña.",group:"el libro que leí",group_index:1,level:"A2"},{i:15,start:120.24,end:129.211,es:"¿Dónde está la camisa que me regalaste?",group:"el libro que leí",group_index:1,level:"A2"},{i:16,start:129.211,end:138.821,es:"El restaurante que te recomendé está cerrado.",group:"el libro que leí",group_index:1,level:"A2"},{i:17,start:140.321,end:147.244,es:"Creo que va a llover.",group:"creo que",group_index:2,level:
