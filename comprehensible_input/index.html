oup:"echar de menos",group_index:4,level:"A2"},{i:38,start:347.74,end:356.781,es:"Mi madre echó a los niños de la cocina.",group:"echar a alguien",group_index:5,level:"A2"},{i:39,start:356.781,end:365.854,es:"Lo echaron del trabajo por llegar tarde.",group:"echar a alguien",group_index:5,level:"B1"},{i:40,start:365.854,end:375.775,es:"El dueño nos echó del restaurante a medianoche.",group:"echar a alguien",group_index:5,level:"B1"},{i:41,start:375.775,end:386.184,es:"Si no pagas el alquiler, te van a echar.",group:"echar a alguien",group_index:5,level:"B1"},{i:42,start:386.184,end:395.095,es:"Echaron a dos jugadores del partido.",group:"echar a alguien",group_index:5,level:"B1"},{i:43,start:395.095,end:405.469,es:"Me echaron de la biblioteca por hablar por teléfono.",group:"echar a alguien",group_index:5,level:"B1"},{i:44,start:405.469,end:415.785,es:"No creo que te echen por un error tan pequeño.",group:"echar a alguien",group_index:5,level:"B1"},{i:45,start:417.285,end:427.299,es:"Cuando vio al perro, el niño echó a correr.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:46,start:427.299,end:436.511,es:"Al oír la noticia, se echó a llorar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:47,start:436.511,end:445.849,es:"De repente, todos se echaron a reír.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:48,start:445.849,end:453.297,es:"El pájaro echó a volar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:49,start:453.297,end:464.007,es:"Cuando abrieron la puerta, la gente echó a andar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:50,start:464.007,end:473.511,es:"Si le dices eso, se va a echar a llorar.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:51,start:473.511,end:484.953,es:"Empezó a llover y echamos a correr hacia la casa.",group:"echar a + infinitivo, echarse a + infinitivo",group_index:6,level:"B1"},{i:52,start:486.453,end:495.956,es:"Siempre me echa la culpa a mí.",group:"expresiones con echar",group_index:7,level:"B1"},{i:53,start:495.956,end:504.438,es:"El calor echó a perder la fruta.",group:"expresiones con echar",group_index:7,level:"B1"},{i:54,start:504.438,end:513.035,es:"No eches a perder esta oportunidad.",group:"expresiones con echar",group_index:7,level:"B1"},{i:55,start:513.035,end:522.004,es:"Siempre me echa en cara mis errores.",group:"expresiones con echar",group_index:7,level:"B1"},{i:56,start:522.004,end:531.124,es:"Estaba tan furioso que echaba humo.",group:"expresiones con echar",group_index:7,level:"B1"},{i:57,start:531.124,end:540.55,es:"Me gustaría echar raíces en este pueblo.",group:"expresiones con echar",group_index:7,level:"B1"},{i:58,start:540.55,end:548.985,es:"No le eches más leña al fuego.",group:"expresiones con echar",group_index:7,level:"B1"}],Jn={word:In,slug:Fn,kind:Rn,hash:Un,duration:Gn,voice:Kn,marks:Xn},Wn="faltar / hacer falta",Zn="faltar_hacer_falta",el="word",al="8f140b3e4e221e70",ol=514.272,rl="mx",sl=[{i:0,start:.5,end:7.237,es:"Me falta dinero.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:1,start:7.237,end:13.385,es:"¿Qué te falta?",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:2,start:13.385,end:20.799,es:"A la sopa le falta sal.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:3,start:20.799,end:27.998,es:"Nos faltan dos sillas.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:4,start:27.998,end:37.838,es:"A mi camisa le falta un botón.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:5,start:37.838,end:45.864,es:"Te falta una firma aquí.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:6,start:45.864,end:54.384,es:"Me faltan tres páginas del libro.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:7,start:54.384,end:63.4,es:"A este equipo le falta un jugador.",group:"me falta, nos faltan",group_index:0,level:"A1"},{i:8,start:64.9,end:72.325,es:"Falta poco para llegar.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:9,start:72.325,end:81.19,es:"Faltan dos días para mi cumpleaños.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:10,start:81.19,end:88.787,es:"¿Cuánto falta para el verano?",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:11,start:88.787,end:97.652,es:"Faltan cinco minutos para las nueve.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:12,start:97.652,end:105.344,es:"Ya falta poco, niños.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:13,start:105.344,end:115.965,es:"Todavía faltan tres semanas para las vacaciones.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:14,start:115.965,end:123.599,es:"¿Cuántas estaciones faltan?",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:15,start:123.599,end:132.673,es:"Solo falta una semana para la boda.",group:"falta poco, faltan dos días",group_index:1,level:"A1"},{i:16,start:134.173,end:141.952,es:"En la fiesta faltó comida.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:17,start:141.952,end:151.559,es:"Me faltó tiempo para terminar el examen.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:18,start:151.559,end:160.482,es:"Cuando llegamos, faltaba el postre.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:19,start:160.482,end:169.625,es:"Siempre nos faltaba dinero a fin de mes.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:20,start:169.625,end:177.097,es:"¿Quién faltó a la reunión?",group:"faltó, faltaba",group_index:2,level:"A2"},{i:21,start:177.097,end:186.867,es:"Faltó agua en el barrio toda la semana.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:22,start:186.867,end:196.231,es:"Faltaban diez minutos para la medianoche.",group:"faltó, faltaba",group_index:2,level:"A2"},{i:23,start:197.731,end:206.851,es:"Hoy falto a clase porque estoy enfermo.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A1"},{i:24,start:206.851,end:214.229,es:"Nunca falto al trabajo.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A1"},{i:25,start:214.229,end:222.943,es:"Mi hijo faltó a clase dos días.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:26,start:222.943,end:230.251,es:"¿Por qué faltaste ayer?",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:27,start:230.251,end:239.963,es:"Si faltas mucho, vas a perder el curso.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:28,start:239.963,end:249.327,es:"Ella nunca ha faltado a una cita.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:29,start:249.327,end:257.309,es:"No quiero faltar a tu fiesta.",group:"faltar a clase, faltar al trabajo",group_index:3,level:"A2"},{i:30,start:258.809,end:266.06,es:"Hace falta paciencia.",group:"hace falta + nombre",group_index:4,level:"A1"},{i:31,start:266.06,end:272.994,es:"¿Te hace falta algo?",group:"hace falta + nombre",group_index:4,level:"A1"},{i:32,start:272.994,end:281.48,es:"Me hace falta un abrigo nuevo.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:33,start:281.48,end:289.602,es:"Nos hacen falta más platos.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:34,start:289.602,end:299.36,es:"Para este trabajo hace falta experiencia.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:35,start:299.36,end:308.887,es:"En esta casa hace falta más luz.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:36,start:308.887,end:317.458,es:"Te hacen falta unas vacaciones.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:37,start:317.458,end:325.707,es:"Le hacía falta un amigo.",group:"hace falta + nombre",group_index:4,level:"A2"},{i:38,start:327.207,end:335.062,es:"Hace falta estudiar más.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:39,start:335.062,end:342.835,es:"No hace falta pagar ahora.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:40,start:342.835,end:350.852,es:"¿Hace falta reservar mesa?",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:41,start:350.852,end:359.196,es:"No hace falta llevar paraguas.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:42,start:359.196,end:369.779,es:"Para viajar allí hace falta tener pasaporte.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:43,start:369.779,end:380.106,es:"Gracias, pero no hacía falta traer nada.",group:"hace falta + infinitivo",group_index:5,level:"A2"},{i:44,start:380.106,end:390.677,es:"Hará falta comprar más comida para el sábado.",group:"hace falta + infinitivo",group_index:5,level:"B1"},{i:45,start:392.177,end:400.02,es:"No hace falta que vengas.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:46,start:400.02,end:408.281,es:"No hace falta que me esperes.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:47,start:408.281,end:416.786,es:"No hace falta que traigan nada.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:48,start:416.786,end:424.257,es:"¿Hace falta que lo repita?",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:49,start:424.257,end:434.689,es:"Hace falta que alguien hable con el director.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:50,start:434.689,end:443.463,es:"No hacía falta que te molestaras.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:51,start:443.463,end:453.431,es:"No hace falta que me lo expliques otra vez.",group:"hace falta que, no hace falta que",group_index:6,level:"B1"},{i:52,start:454.931,end:461.287,es:"¡Lo que faltaba!",group:"expresiones",group_index:7,level:"A2"},{i:53,start:461.287,end:468.949,es:"Me haces mucha falta.",group:"expresiones",group_index:7,level:"B1"},{i:54,start:468.949,end:477.918,es:"No le faltes el respeto a tu abuela.",group:"expresiones",group_index:7,level:"B1"},{i:55,start:477.918,end:488.373,es:"Vivo lejos y me hace mucha falta mi familia.",group:"expresiones",group_index:7,level:"B1"},{i:56,start:488.373,end:497.737,es:"Faltó poco para que perdiéramos el avión.",group:"expresiones",group_index:7,level:"B1"},{i:57,start:497.737,end:506.729,es:"No faltaría más, pase usted.",group:"expresiones",group_index:7,level:"B1"},{i:58,start:506.729,end:514.201,es:"Aquí no nos falta nada.",group:"expresiones",group_index:7,level:"B1"}],nl={word:Wn,slug:Zn,kind:el,hash:al,duration:ol,voice:rl,marks:sl},ll="haber",il="haber",tl="word",ul="ceecde9829e89cf5",dl=529.896,pl="mx",gl=[{i:0,start:.5,end:8.877,es:"Hay un perro en el jardín.",group:"hay",group_index:0,level:"A1"},{i:1,start:8.877,end:16.836,es:"¿Hay leche en el refrigerador?",group:"hay",group_index:0,level:"A1"},{i:2,start:16.836,end:22.95,es:"No hay pan.",group:"hay",group_index:0,level:"A1"},{i:3,start:22.95,end:31.199,es:"Hay muchas personas en la calle.",group:"hay",group_index:0,level:"A1"},{i:4,start:31.199,end:39.634,es:"En mi clase hay veinte estudiantes.",group:"hay",group_index:0,level:"A1"},{i:5,start:39.634,end:47.547,es:"¿Hay un banco cerca de aquí?",group:"hay",group_index:0,level:"A1"},{i:6,start:47.547,end:54.171,es:"Hoy no hay clase.",group:"hay",group_index:0,level:"A1"},{i:7,start:54.171,end:62.281,es:"Hay dos camas en la habitación.",group:"hay",group_index:0,level:"A1"},{i:8,start:62.281,end:68.893,es:"¿Qué hay para comer?",group:"hay",group_index:0,level:"A1"},{i:9,start:70.393,end:77.086,es:"Hay que comer bien.",group:"hay que",group_index:1,level:"A1"},{i:10,start:77.086,end:84.221,es:"Hay que llegar temprano.",group:"hay que",group_index:1,level:"A1"},{i:11,start:84.221,end:91.379,es:"Hay que tener paciencia.",group:"hay que",group_index:1,level:"A1"},{i:12,start:91.379,end:98.7,es:"Hay que lavar los platos.",group:"hay que",group_index:1,level:"A1"},{i:13,start:98.7,end:106.508,es:"Hay que hablar con ella hoy.",group:"hay que",group_index:1,level:"A1"},{i:14,start:106.508,end:116.429,es:"Para entrar, hay que comprar una entrada.",group:"hay que",group_index:1,level:"A2"},{i:15,start:116.429,end:123.772,es:"No hay que pagar nada.",group:"hay que",group_index:1,level:"A2"},{i:16,start:123.772,end:131.115,es:"No hay que preocuparse.",group:"hay que",group_index:1,level:"A2"},{i:17,start:132.615,end:139.692,es:"He comido demasiado.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:18,start:139.692,end:146.885,es:"¿Has visto mi teléfono?",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:19,start:146.885,end:156.957,es:"Hemos vivido aquí durante cinco años.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:20,start:156.957,end:164.492,es:"Todavía no he terminado.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:21,start:164.492,end:172.73,es:"Ya ha llegado el tren.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:22,start:172.73,end:181.339,es:"¿Alguna vez has estado en México?",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:23,start:181.339,end:189.925,es:"Nunca he probado el mole.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:24,start:189.925,end:198.511,es:"Esta semana ha llovido mucho.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:25,start:198.511,end:207.062,es:"Mis padres han vuelto de su viaje.",group:"he, has, ha: pretérito perfecto",group_index:2,level:"A2"},{i:26,start:208.562,end:217.863,es:"Había mucha gente en la fiesta.",group:"había, hubo",group_index:3,level:"A2"},{i:27,start:217.863,end:227.935,es:"Antes había un cine en esta calle.",group:"había, hubo",group_index:3,level:"A2"},{i:28,start:227.935,end:236.707,es:"No había nadie en casa.",group:"había, hubo",group_index:3,level:"A2"},{i:29,start:236.707,end:245.73,es:"¿Había agua caliente en el hotel?",group:"había, hubo",group_index:3,level:"A2"},{i:30,start:245.73,end:255.28,es:"Ayer hubo un accidente en la autopista.",group:"había, hubo",group_index:3,level:"A2"},{i:31,start:255.28,end:264.528,es:"Hubo un problema con mi tarjeta.",group:"había, hubo",group_index:3,level:"A2"},{i:32,start:264.528,end:273.706,es:"Anoche hubo una tormenta muy fuerte.",group:"había, hubo",group_index:3,level:"A2"},{i:33,start:273.706,end:282.582,es:"Cuando era niño, no había internet.",group:"había, hubo",group_index:3,level:"A2"},{i:34,start:284.082,end:294.758,es:"Cuando llegué, la película ya había empezado.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:35,start:294.758,end:303.274,es:"Nunca había visto tanta nieve.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:36,start:303.274,end:313.863,es:"Me dijo que había perdido las llaves.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:37,start:313.863,end:322.808,es:"Ya habíamos cenado cuando llamaste.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:38,start:322.808,end:331.487,es:"No sabía que habías vuelto.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:39,start:331.487,end:340.062,es:"Pensé que te habías olvidado de mí.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:40,start:340.062,end:350.946,es:"Mis amigos ya habían salido cuando empezó a llover.",group:"había + participio: pluscuamperfecto",group_index:4,level:"B1"},{i:41,start:352.446,end:360.568,es:"Mañana habrá mucho tráfico.",group:"habrá, habría",group_index:5,level:"B1"},{i:42,start:360.568,end:367.854,es:"¿Habrá tiempo para comer?",group:"habrá, habría",group_index:5,level:"B1"},{i:43,start:367.854,end:376.01,es:"No contesta. Habrá salido.",group:"habrá, habría",group_index:5,level:"B1"},{i:44,start:376.01,end:386.175,es:"Para el viernes ya habré terminado el informe.",group:"habrá, habría",group_index:5,level:"B1"},{i:45,start:386.175,end:394.494,es:"Yo habría hecho lo mismo.",group:"habrá, habría",group_index:5,level:"B1"},{i:46,start:394.494,end:405.503,es:"Habría más trabajo si la tienda abriera los domingos.",group:"habrá, habría",group_index:5,level:"B1"},{i:47,start:405.503,end:414.959,es:"Me dijeron que habría una reunión.",group:"habrá, habría",group_index:5,level:"B1"},{i:48,start:416.459,end:425.661,es:"Espero que haya mesas libres.",group:"haya, hubiera",group_index:6,level:"B1"},{i:49,start:425.661,end:434.595,es:"No creo que haya llegado todavía.",group:"haya, hubiera",group_index:6,level:"B1"},{i:50,start:434.595,end:442.682,es:"Me alegro de que hayas venido.",group:"haya, hubiera",group_index:6,level:"B1"},{i:51,start:442.682,end:451.407,es:"Cuando hayas terminado, llámame.",group:"haya, hubiera",group_index:6,level:"B1"},{i:52,start:451.407,end:460.179,es:"Ojalá haya buen tiempo mañana.",group:"haya, hubiera",group_index:6,level:"B1"},{i:53,start:460.179,end:468.335,es:"No creo que hayas entendido.",group:"haya, hubiera",group_index:6,level:"B1"},{i:54,start:468.335,end:476.805,es:"Me sorprendió que no hubiera nadie.",group:"haya, hubiera",group_index:6,level:"B1"},{i:55,start:478.305,end:484.466,es:"No hay de qué.",group:"expresiones",group_index:7,level:"A1"},{i:56,start:484.466,end:490.765,es:"¿Qué hay de nuevo?",group:"expresiones",group_index:7,level:"A2"},{i:57,start:490.765,end:497.194,es:"No hay prisa.",group:"expresiones",group_index:7,level:"A2"},{i:58,start:497.194,end:505.582,es:"Ha habido un cambio de planes.",group:"expresiones",group_index:7,level:"B1"},{i:59,start:505.582,end:512.578,es:"No hay nada que hacer.",group:"expresiones",group_index:7,level:"B1"},{i:60,start:512.578,end:521.269,es:"No hay mal que por bien no venga.",group:"expresiones",group_index:7,level:"B1"},{i:61,start:521.269,end:529.843,es:"No hay manera de abrir esta puerta.",group:"expresiones",group_index:7,level:"B1"}],cl={word:ll,slug:il,kind:tl,hash:ul,duration:dl,voice:pl,marks:gl},vl="hacer",ml="hacer",xl="word",_l="64580584d10b1f81",Al=527.112,hl="mx",bl=[{i:0,start:.5,end:6.172,es:"¿Qué haces?",group:"hacer, actividades",group_index:0,level:"A1"},{i:1,start:6.172,end:14.143,es:"Hago la tarea después de cenar.",group:"hacer, actividades",group_index:0,level:"A1"},{i:2,start:14.143,end:22.995,es:"Mi padre hace la comida los domingos.",group:"hacer, actividades",group_index:0,level:"A1"},{i:3,start:22.995,end:32.975,es:"¿Qué hacen ustedes los fines de semana?",group:"hacer, actividades",group_index:0,level:"A1"},{i:4,start:32.975,end:42.768,es:"Hago ejercicio todas las mañanas.",group:"hacer, actividades",group_index:0,level:"A1"},{i:5,start:42.768,end:51.354,es:"Siempre hago la cama.",group:"hacer, actividades",group_index:0,level:"A1"},{i:6,start:51.354,end:61.078,es:"Mi madre hace un pastel muy rico.",group:"hacer, actividades",group_index:0,level:"A1"},{i:7,start:61.078,end:68.643,es:"No hago nada los sábados.",group:"hacer, actividades",group_index:0,level:"A1"},{i:8,start:68.643,end:76.474,es:"¿Qué vas a hacer esta noche?",group:"hacer, actividades",group_index:0,level:"A1"},{i:9,start:77.974,end:85.236,es:"Hoy hace mucho frío.",group:"el tiempo",group_index:1,level:"A1"},{i:10,start:85.236,end:92.661,es:"En verano hace calor.",group:"el tiempo",group_index:1,level:"A1"},{i:11,start:92.661,end:100.853,es:"Hace sol, vamos al parque.",group:"el tiempo",group_index:1,level:"A1"},{i:12,start:100.853,end:107.964,es:"Hace viento en la playa.",group:"el tiempo",group_index:1,level:"A1"},{i:13,start:107.964,end:115.54,es:"¿Qué tiempo hace en tu ciudad?",group:"el tiempo",group_index:1,level:"A1"},{i:14,start:115.54,end:123.592,es:"Hace buen tiempo para caminar.",group:"el tiempo",group_index:1,level:"A1"},{i:15,start:123.592,end:131.33,es:"Hoy hace un día precioso.",group:"el tiempo",group_index:1,level:"A1"},{i:16,start:131.33,end:138.776,es:"Ayer hizo mucho calor.",group:"el tiempo",group_index:1,level:"A2"},{i:17,start:140.276,end:147.434,es:"¿Puedo hacer una pregunta?",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A1"},{i:18,start:147.434,end:156.936,es:"Los estudiantes hacen muchas preguntas.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A1"},{i:19,start:156.936,end:165.394,es:"Tenemos que hacer fila para entrar.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:20,start:165.394,end:173.899,es:"Hicimos fila durante una hora.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:21,start:173.899,end:182.798,es:"Todavía no he hecho la maleta.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:22,start:182.798,end:194.763,es:"Siempre hago la maleta la noche antes del viaje.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:23,start:194.763,end:204.696,es:"El periodista le hizo una pregunta difícil.",group:"hacer una pregunta, fila, maleta",group_index:2,level:"A2"},{i:24,start:206.196,end:212.762,es:"¿Qué hiciste ayer?",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:25,start:212.762,end:221.173,es:"No hice nada el fin de semana.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:26,start:221.173,end:230.386,es:"Mi hermano hizo la cena anoche.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:27,start:230.386,end:239.506,es:"De niños hacíamos castillos de arena.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:28,start:239.506,end:246.629,es:"¿Ya has hecho la tarea?",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:29,start:246.629,end:255.714,es:"Hemos hecho un viaje increíble.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:30,start:255.714,end:262.461,es:"Lo hice sin pensar.",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:31,start:262.461,end:270.048,es:"¿Qué hacías a esa hora?",group:"hice, hacía, he hecho",group_index:3,level:"A2"},{i:32,start:271.548,end:279.031,es:"Llegué hace dos horas.",group:"hace, pasado",group_index:4,level:"A2"},{i:33,start:279.031,end:288.616,es:"Hace un año que nos conocimos en Madrid.",group:"hace, pasado",group_index:4,level:"A2"},{i:34,start:288.616,end:295.658,es:"La vi hace poco.",group:"hace, pasado",group_index:4,level:"A2"},{i:35,start:295.658,end:305.533,es:"Hace tres días que hablamos por teléfono.",group:"hace, pasado",group_index:4,level:"A2"},{i:36,start:305.533,end:315.187,es:"Mis abuelos se casaron hace cincuenta años.",group:"hace, pasado",group_index:4,level:"A2"},{i:37,start:315.187,end:325.398,es:"Hace mucho tiempo vivía en el campo.",group:"hace, pasado",group_index:4,level:"A2"},{i:38,start:325.398,end:333.369,es:"¿Cuánto tiempo hace que llegaste?",group:"hace, pasado",group_index:4,level:"A2"},{i:39,start:333.369,end:342.744,es:"Terminé la universidad hace diez años.",group:"hace, pasado",group_index:4,level:"A2"},{i:40,start:344.244,end:353.341,es:"Hace dos años que estudio español.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:41,start:353.341,end:361.602,es:"Hace mucho tiempo que no te veo.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:42,start:361.602,end:370.083,es:"¿Cuánto tiempo hace que vives aquí?",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:43,start:370.083,end:378.797,es:"Hace una hora que espero el autobús.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:44,start:378.797,end:386.28,es:"Hace meses que no llueve.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:45,start:386.28,end:394.924,es:"Hace tiempo que quiero visitar Perú.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:46,start:394.924,end:403.777,es:"Hace una semana que no duermo bien.",group:"hace + tiempo + que, duración",group_index:5,level:"A2"},{i:47,start:405.277,end:411.425,es:"Hazme caso.",group:"hacer caso",group_index:6,level:"A2"},{i:48,start:411.425,end:419.554,es:"Los niños no me hacen caso.",group:"hacer caso",group_index:6,level:"A2"},{i:49,start:419.554,end:428.465,es:"Nunca haces caso a tus padres.",group:"hacer caso",group_index:6,level:"A2"},{i:50,start:428.465,end:436.76,es:"Debí hacerle caso al médico.",group:"hacer caso",group_index:6,level:"B1"},{i:51,start:436.76,end:446.473,es:"Te lo dije, pero no me hiciste caso.",group:"hacer caso",group_index:6,level:"B1"},{i:52,start:446.473,end:456.278,es:"No le hagas caso, está de mal humor.",group:"hacer caso",group_index:6,level:"B1"},{i:53,start:456.278,end:465.154,es:"Quiero que me hagas caso esta vez.",group:"hacer caso",group_index:6,level:"B1"},{i:54,start:466.654,end:473.893,es:"Se está haciendo tarde.",group:"hacerse",group_index:7,level:"B1"},{i:55,start:473.893,end:481.875,es:"Mi hermana se hizo médica.",group:"hacerse",group_index:7,level:"B1"},{i:56,start:481.875,end:490.484,es:"Nos hicimos amigos en el colegio.",group:"hacerse",group_index:7,level:"B1"},{i:57,start:490.484,end:499.93,es:"Con los años, se hizo más paciente.",group:"hacerse",group_index:7,level:"B1"},{i:58,start:499.93,end:508.446,es:"Quiere hacerse rico muy rápido.",group:"hacerse",group_index:7,level:"B1"},{i:59,start:508.446,end:518.181,es:"Se hace de noche muy temprano en invierno.",group:"hacerse",group_index:7,level:"B1"},{i:60,start:518.181,end:527.046,es:"Ojalá nos hagamos buenos amigos.",group:"hacerse",group_index:7,level:"B1"}],fl={word:vl,slug:ml,kind:xl,hash:_l,duration:Al,voice:hl,marks:bl},ql="igual",yl="igual",jl="word",Bl="07d75a4a40dc84ce",zl=575.112,Ml="mx",El=[{i:0,start:.5,end:9.585,es:"Mi camisa es igual a la tuya.",group:"igual e iguales",group_index:0,level:"A1"},{i:1,start:9.585,end:17.3,es:"Las dos casas son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:2,start:17.3,end:25.222,es:"Tu bolso es igual al mío.",group:"igual e iguales",group_index:0,level:"A1"},{i:3,start:25.222,end:33.711,es:"Los gemelos son casi iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:4,start:33.711,end:41.947,es:"Estos zapatos no son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:5,start:41.947,end:49.889,es:"Todos los días son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:6,start:49.889,end:59.833,es:"Mi teléfono es igual al de mi hermano.",group:"igual e iguales",group_index:0,level:"A1"},{i:7,start:59.833,end:67.548,es:"Las dos tazas son iguales.",group:"igual e iguales",group_index:0,level:"A1"},{i:8,start:69.048,end:76.717,es:"Hablas igual que tu madre.",group:"igual que",group_index:1,level:"A1"},{i:9,start:76.717,end:85.5,es:"Ella canta igual que su abuela.",group:"igual que",group_index:1,level:"A1"},{i:10,start:85.5,end:93.285,es:"Mi hijo come igual que yo.",group:"igual que",group_index:1,level:"A1"},{i:11,start:93.285,end:102.324,es:"Hoy hace frío, igual que ayer.",group:"igual que",group_index:1,level:"A1"},{i:12,start:102.324,end:109.157,es:"Pienso igual que tú.",group:"igual que",group_index:1,level:"A1"},{i:13,start:109.157,end:117.487,es:"Él trabaja igual que siempre.",group:"igual que",group_index:1,level:"A1"},{i:14,start:117.487,end:126.816,es:"La casa está igual que hace diez años.",group:"igual que",group_index:1,level:"A2"},{i:15,start:126.816,end:136.084,es:"Lo hice igual que la última vez.",group:"igual que",group_index:1,level:"A2"},{i:16,start:137.584,end:146.635,es:"Las dos películas son igual de largas.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:17,start:146.635,end:155.685,es:"Mi hermano es igual de alto que yo.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:18,start:155.685,end:165.188,es:"Este restaurante es igual de caro que el otro.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:19,start:165.188,end:174.866,es:"Los dos exámenes fueron igual de difíciles.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:20,start:174.866,end:186.006,es:"Ella es igual de simpática que su hermana.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:21,start:186.006,end:196.623,es:"El tren y el autobús son igual de rápidos.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:22,start:196.623,end:206.15,es:"Hoy el tráfico está igual de mal que ayer.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:23,start:206.15,end:215.723,es:"Los dos trabajos son igual de importantes.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:24,start:217.223,end:223.614,es:"Me da igual.",group:"me da igual y es igual",group_index:3,level:"A1"},{i:25,start:223.614,end:230.877,es:"Me da igual el color.",group:"me da igual y es igual",group_index:3,level:"A1"},{i:26,start:230.877,end:239.532,es:"Da igual, mañana lo hacemos.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:27,start:239.532,end:250.006,es:"A mi padre le da igual la música.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:28,start:250.006,end:258.766,es:"¿Te da igual comer en casa o fuera?",group:"me da igual y es igual",group_index:3,level:"A2"},{i:29,start:258.766,end:267.069,es:"Es igual, no pasa nada.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:30,start:267.069,end:274.437,es:"Nos da igual el lugar.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:31,start:274.437,end:282.826,es:"A ellos les da igual el precio.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:32,start:282.826,end:292.387,es:"Ese día me daba igual perder el partido.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:33,start:292.387,end:299.777,es:"A mí no me da igual.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:34,start:299.777,end:309.281,es:"Da igual si llueve, vamos a salir.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:35,start:310.781,end:319.771,es:"La madre quiere a sus hijos por igual.",group:"por igual",group_index:4,level:"A2"},{i:36,start:319.771,end:327.846,es:"Dividimos la cuenta por igual.",group:"por igual",group_index:4,level:"A2"},{i:37,start:327.846,end:337.245,es:"En casa repartimos las tareas por igual.",group:"por igual",group_index:4,level:"B1"},{i:38,start:337.245,end:345.645,es:"La ley es para todos por igual.",group:"por igual",group_index:4,level:"B1"},{i:39,start:345.645,end:355.772,es:"Las ganancias se reparten por igual entre los socios.",group:"por igual",group_index:4,level:"B1"},{i:40,start:355.772,end:364.668,es:"El calor afecta a todos por igual.",group:"por igual",group_index:4,level:"B1"},{i:41,start:366.168,end:375.311,es:"Al igual que tú, prefiero el campo.",group:"al igual que",group_index:5,level:"B1"},{i:42,start:375.311,end:384.57,es:"Al igual que su padre, es médico.",group:"al igual que",group_index:5,level:"B1"},{i:43,start:384.57,end:397.417,es:"Al igual que el año pasado, vamos a la playa en agosto.",group:"al igual que",group_index:5,level:"B1"},{i:44,start:397.417,end:409.3,es:"Ella, al igual que su hermano, habla tres idiomas.",group:"al igual que",group_index:5,level:"B1"},{i:45,start:409.3,end:420.568,es:"Al igual que muchas personas, trabajo desde casa.",group:"al igual que",group_index:5,level:"B1"},{i:46,start:420.568,end:430.408,es:"Al igual que ayer, el tren llegó tarde.",group:"al igual que",group_index:5,level:"B1"},{i:47,start:430.408,end:442.326,es:"Al igual que en otros países, aquí la comida es cara.",group:"al igual que",group_index:5,level:"B1"},{i:48,start:443.826,end:450.729,es:"Igual llueve mañana.",group:"igual: quizás",group_index:6,level:"B1"},{i:49,start:450.729,end:459.245,es:"Igual vamos al cine esta noche.",group:"igual: quizás",group_index:6,level:"B1"},{i:50,start:459.245,end:466.821,es:"Igual no viene a la fiesta.",group:"igual: quizás",group_index:6,level:"B1"},{i:51,start:466.821,end:475.732,es:"Llámalo, igual está en casa.",group:"igual: quizás",group_index:6,level:"B1"},{i:52,start:475.732,end:482.716,es:"Igual tienes razón.",group:"igual: quizás",group_index:6,level:"B1"},{i:53,start:482.716,end:491.139,es:"Igual llegamos un poco tarde.",group:"igual: quizás",group_index:6,level:"B1"},{i:54,start:491.139,end:500.178,es:"No sé, igual me quedo en casa.",group:"igual: quizás",group_index:6,level:"B1"},{i:55,start:500.178,end:510.39,es:"Pregunta en la tienda, igual lo tienen.",group:"igual: quizás",group_index:6,level:"B1"},{i:56,start:511.89,end:520.912,es:"Es un lugar de una belleza sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:57,start:520.912,end:530.195,es:"Tiene un talento sin igual para la música.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:58,start:530.195,end:538.455,es:"Esta comida no tiene igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:59,start:538.455,end:546.728,es:"Fue una experiencia sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:60,start:546.728,end:557.369,es:"Mi abuela tenía una paciencia sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:61,start:557.369,end:565.092,es:"Es un cantante sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:62,start:565.092,end:575.05,es:"La vista desde esta montaña no tiene igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"}],kl={word:ql,slug:yl,kind:jl,hash:Bl,duration:zl,voice:Ml,marks:El},$l="llevar",wl="llevar",Nl="word",Sl="29a908a6202ceb4f",Ll=524.232,Tl="mx",Pl=[{i:0,start:.5,end:9.597,es:"Llevo una mochila muy pesada.",group:"llevar, cargar",group_index:0,level:"A1"},{i:1,start:9.597,end:15.907,es:"¿Llevas dinero?",group:"llevar, cargar",group_index:0,level:"A1"},{i:2,start:15.907,end:22.984,es:"Yo llevo las bolsas.",group:"llevar, cargar",group_index:0,level:"A1"},{i:3,start:22.984,end:31.291,es:"Siempre llevo agua en el auto.",group:"llevar, cargar",group_index:0,level:"A1"},{i:4,start:31.291,end:39.541,es:"¿Puedes llevar la sopa a la mesa?",group:"llevar, cargar",group_index:0,level:"A1"},{i:5,start:39.541,end:48.288,es:"Mi padre lleva la maleta grande.",group:"llevar, cargar",group_index:0,level:"A1"},{i:6,start:48.288,end:56.607,es:"Llevé el pastel a la fiesta.",group:"llevar, cargar",group_index:0,level:"A2"},{i:7,start:56.607,end:65.635,es:"No llevaba el pasaporte encima.",group:"llevar, cargar",group_index:0,level:"A2"},{i:8,start:67.135,end:74.71,es:"Hoy llevo un vestido rojo.",group:"llevar ropa",group_index:1,level:"A1"},{i:9,start:74.71,end:85.142,es:"Mi abuelo lleva una corbata azul.",group:"llevar ropa",group_index:1,level:"A1"},{i:10,start:85.142,end:93.067,es:"¿Qué vas a llevar a la boda?",group:"llevar ropa",group_index:1,level:"A1"},{i:11,start:93.067,end:102.233,es:"Ella siempre lleva sombrero.",group:"llevar ropa",group_index:1,level:"A1"},{i:12,start:102.233,end:111.388,es:"Llevas una camisa muy bonita.",group:"llevar ropa",group_index:1,level:"A1"},{i:13,start:111.388,end:119.633,es:"El niño lleva zapatos nuevos.",group:"llevar ropa",group_index:1,level:"A1"},{i:14,start:119.633,end:127.731,es:"En verano llevo ropa ligera.",group:"llevar ropa",group_index:1,level:"A1"},{i:15,start:127.731,end:136.774,es:"Ayer llevaba una chaqueta negra.",group:"llevar ropa",group_index:1,level:"A2"},{i:16,start:138.274,end:145.049,es:"Te llevo a casa.",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:17,start:145.049,end:153.519,es:"Llevo a mis hijos a la escuela.",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:18,start:153.519,end:160.9,es:"¿Me llevas al aeropuerto?",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:19,start:160.9,end:169.289,es:"Este autobús te lleva al centro.",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:20,start:169.289,end:177.154,es:"Mi madre me llevó al médico.",group:"llevar a alguien a un lugar",group_index:2,level:"A2"},{i:21,start:177.154,end:186.887,es:"Te voy a llevar a un restaurante muy bueno.",group:"llevar a alguien a un lugar",group_index:2,level:"A2"},{i:22,start:186.887,end:198.108,es:"Llevamos al perro al parque todas las mañanas.",group:"llevar a alguien a un lugar",group_index:2,level:"A2"},{i:23,start:199.608,end:206.929,es:"Llevo dos años aquí.",group:"llevar tiempo",group_index:3,level:"A2"},{i:24,start:206.929,end:215.41,es:"¿Cuánto tiempo llevas en esta ciudad?",group:"llevar tiempo",group_index:3,level:"A2"},{i:25,start:215.41,end:223.81,es:"Llevamos una hora en la fila.",group:"llevar tiempo",group_index:3,level:"A2"},{i:26,start:223.81,end:233.685,es:"Mis padres llevan treinta años casados.",group:"llevar tiempo",group_index:3,level:"A2"},{i:27,start:233.685,end:242.619,es:"Ella lleva tres meses en la empresa.",group:"llevar tiempo",group_index:3,level:"A2"},{i:28,start:242.619,end:251.345,es:"Este trabajo lleva mucho tiempo.",group:"llevar tiempo",group_index:3,level:"A2"},{i:29,start:251.345,end:260.674,es:"Preparar la cena me llevó toda la tarde.",group:"llevar tiempo",group_index:3,level:"A2"},{i:30,start:262.174,end:269.866,es:"Llevo una hora esperando.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:31,start:269.866,end:279.647,es:"Llevamos todo el día caminando.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:32,start:279.647,end:289.058,es:"¿Cuánto tiempo llevas estudiando español?",group:"llevar + gerundio",group_index:4,level:"A2"},{i:33,start:289.058,end:297.667,es:"Lleva tres días lloviendo sin parar.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:34,start:297.667,end:305.916,es:"Llevo meses buscando trabajo.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:35,start:305.916,end:316.986,es:"Mi vecino lleva toda la mañana haciendo ruido.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:36,start:316.986,end:328.556,es:"Cuando lo conocí, llevaba dos años viviendo solo.",group:"llevar + gerundio",group_index:4,level:"B1"},{i:37,start:330.056,end:338.723,es:"Me llevo muy bien con mi hermana.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:38,start:338.723,end:346.09,es:"Mis padres se llevan bien.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:39,start:346.09,end:354.061,es:"No me llevo bien con mi jefe.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:40,start:354.061,end:363.748,es:"Los dos gatos no se llevan nada bien.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:41,start:363.748,end:372.101,es:"¿Te llevas bien con tus compañeros?",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:42,start:372.101,end:380.848,es:"De niños nos llevábamos muy mal.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:43,start:380.848,end:389.434,es:"Espero que te lleves bien con ellos.",group:"llevarse bien o mal",group_index:5,level:"B1"},{i:44,start:390.934,end:397.732,es:"¿Me lo llevo o lo dejo?",group:"llevarse algo",group_index:6,level:"A2"},{i:45,start:397.732,end:407.061,es:"Me llevo esta camisa, por favor.",group:"llevarse algo",group_index:6,level:"A2"},{i:46,start:407.061,end:414.66,es:"Alguien se llevó mi paraguas.",group:"llevarse algo",group_index:6,level:"A2"},{i:47,start:414.66,end:423.153,es:"Me llevé una sorpresa enorme.",group:"llevarse algo",group_index:6,level:"B1"},{i:48,start:423.153,end:430.892,es:"El viento se llevó las hojas.",group:"llevarse algo",group_index:6,level:"B1"},{i:49,start:430.892,end:440.29,es:"Nos llevamos un buen susto con la tormenta.",group:"llevarse algo",group_index:6,level:"B1"},{i:50,start:440.29,end:450.119,es:"No te lleves mi cargador, que lo necesito.",group:"llevarse algo",group_index:6,level:"B1"},{i:51,start:450.119,end:459.48,es:"El ladrón se llevó todas las joyas.",group:"llevarse algo",group_index:6,level:"B1"},{i:52,start:460.98,end:470.251,es:"Mi hermano siempre me lleva la contraria.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:53,start:470.251,end:478.546,es:"Ella lleva la cuenta de los gastos.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:54,start:478.546,end:488.943,es:"Mi abuela lleva una vida muy tranquila.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:55,start:488.943,end:498.319,es:"Este camino no lleva a ninguna parte.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:56,start:498.319,end:506.858,es:"No te dejes llevar por los nervios.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:57,start:506.858,end:514.109,es:"Yo te llevo tres años.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:58,start:514.109,end:524.17,es:"Ellos llevan la empresa juntos desde hace años.",group:"expresiones con llevar",group_index:7,level:"B1"}],Cl={word:$l,slug:wl,kind:Nl,hash:Sl,duration:Ll,voice:Tl,marks:Pl},Hl="lo",Ql="lo",Dl="word",Yl="1ca3ff6ec70300df",Vl=516.12,Ol="mx",Il=[{i:0,start:.5,end:11.408,es:"¿Conoces a Pedro? Sí, lo conozco del trabajo.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:1,start:11.408,end:20.122,es:"¿El café? Lo tomo sin azúcar.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:2,start:20.122,end:30.391,es:"Mi hermano está en casa, lo llamo ahora.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:3,start:30.391,end:40.103,es:"Este vestido es bonito, lo compro.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:4,start:40.103,end:49.92,es:"No encuentro mi teléfono, ¿lo tienes tú?",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:5,start:49.92,end:60.227,es:"El pan está aquí, lo pongo en la mesa.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:6,start:60.227,end:71.205,es:"Mi abuelo vive lejos, pero lo visito los domingos.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:7,start:71.205,end:80.789,es:"El auto está sucio, lo lavo mañana.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:8,start:80.789,end:89.132,es:"¿Dónde está el perro? No lo veo.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:9,start:90.632,end:96.35,es:"No lo sé.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:10,start:96.35,end:102.161,es:"Ya lo sé.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:11,start:102.161,end:109.898,es:"Lo sé, tienes razón.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:12,start:109.898,end:119.622,es:"¿Sabes dónde vive Ana? No, no lo sé.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:13,start:119.622,end:125.375,es:"No lo creo.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:14,start:125.375,end:131.875,es:"Lo siento mucho.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:15,start:131.875,end:137.809,es:"¿Lo entiendes?",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:16,start:137.809,end:143.821,es:"Te lo prometo.",group:"lo sé, no lo sé",group_index:1,level:"A2"},{i:17,start:145.321,end:153.021,es:"Voy a comprarlo mañana.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:18,start:153.021,end:160.894,es:"¿Puedes repetirlo, por favor?",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:19,start:160.894,end:167.866,es:"Quiero verlo otra vez.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:20,start:167.866,end:175.39,es:"Tómalo, es para ti.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:21,start:175.39,end:183.883,es:"Pruébalo, está muy rico.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:22,start:183.883,end:190.541,es:"Estoy pensándolo.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:23,start:190.541,end:199.556,es:"Tengo que terminarlo antes del viernes.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:24,start:199.556,end:206.354,es:"Ábrelo con cuidado.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:25,start:206.354,end:214.267,es:"Necesito leerlo dos veces.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:26,start:215.767,end:223.238,es:"Lo que necesito es dormir.",group:"lo que",group_index:3,level:"A2"},{i:27,start:223.238,end:230.466,es:"No entiendo lo que dices.",group:"lo que",group_index:3,level:"A2"},{i:28,start:230.466,end:238.483,es:"Esto es lo que compré ayer.",group:"lo que",group_index:3,level:"A2"},{i:29,start:238.483,end:247.98,es:"Lo que más me gusta es la playa.",group:"lo que",group_index:3,level:"A2"},{i:30,start:247.98,end:254.5,es:"Dime lo que pasó.",group:"lo que",group_index:3,level:"A2"},{i:31,start:254.5,end:262.807,es:"Lo que pasa es que estoy cansado.",group:"lo que",group_index:3,level:"A2"},{i:32,start:262.807,end:270.757,es:"Gracias por todo lo que hiciste.",group:"lo que",group_index:3,level:"A2"},{i:33,start:270.757,end:278.322,es:"No sé lo que voy a hacer.",group:"lo que",group_index:3,level:"A2"},{i:34,start:278.322,end:286.888,es:"Todo lo que dijo era verdad.",group:"lo que",group_index:3,level:"A2"},{i:35,start:286.888,end:293.477,es:"Haz lo que quieras.",group:"lo que",group_index:3,level:"B1"},{i:36,start:294.977,end:301.67,es:"Yo quiero lo mismo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A1"},{i:37,start:301.67,end:309.176,es:"A lo mejor llueve mañana.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:38,start:309.176,end:316.631,es:"A lo mejor tienes razón.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:39,start:316.631,end:323.917,es:"Siempre dice lo mismo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:40,start:323.917,end:330.169,es:"Me da lo mismo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:41,start:330.169,end:337.548,es:"Por lo menos come algo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:42,start:337.548,end:347.887,es:"Llegamos tarde, pero por lo menos llegamos.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:43,start:347.887,end:356.317,es:"Necesito por lo menos dos horas.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:44,start:356.317,end:365.843,es:"Por lo general, desayuno en casa.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:45,start:367.343,end:374.652,es:"Lo bueno es que hace sol.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:46,start:374.652,end:381.609,es:"Lo malo es el precio.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:47,start:381.609,end:391.031,es:"Lo importante es estar juntos.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:48,start:391.031,end:399.614,es:"Lo mejor del viaje fue la comida.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:49,start:399.614,end:406.481,es:"Lo peor ya pasó.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:50,start:406.481,end:413.721,es:"Lo difícil es empezar.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:51,start:413.721,end:423.142,es:"Lo más importante es la salud.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:52,start:423.142,end:431.181,es:"Lo raro es que nadie contestó.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:53,start:431.181,end:439.999,es:"Lo bueno de esta ciudad es el clima.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:54,start:441.499,end:451.072,es:"No sabes lo rápido que corre mi hija.",group:"lo rápido que",group_index:6,level:"B1"},{i:55,start:451.072,end:460.006,es:"Me sorprende lo bien que hablas español.",group:"lo rápido que",group_index:6,level:"B1"},{i:56,start:460.006,end:468.173,es:"Mira lo grande que está tu hijo.",group:"lo rápido que",group_index:6,level:"B1"},{i:57,start:468.173,end:477.107,es:"No te imaginas lo cansada que estoy.",group:"lo rápido que",group_index:6,level:"B1"},{i:58,start:477.107,end:487.075,es:"Ya ves lo difícil que es encontrar trabajo.",group:"lo rápido que",group_index:6,level:"B1"},{i:59,start:487.075,end:495.858,es:"Es increíble lo caro que está todo.",group:"lo rápido que",group_index:6,level:"B1"},{i:60,start:495.858,end:505.966,es:"Me encanta lo tranquilo que es este barrio.",group:"lo rápido que",group_index:6,level:"B1"},{i:61,start:505.966,end:516.067,es:"Todavía recuerdo lo feliz que estaba ese día.",group:"lo rápido que",group_index:6,level:"B1"}],Fl={word:Hl,slug:Ql,kind:Dl,hash:Yl,duration:Vl,voice:Ol,marks:Il},Rl="mismo",Ul="mismo",Gl="word",Kl="c2a6d6089ce4aa6e",Xl=488.712,Jl="mx",Wl=[{i:0,start:.5,end:7.856,es:"Tenemos el mismo libro.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:1,start:7.856,end:15.687,es:"Vivimos en la misma calle.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:2,start:15.687,end:24.807,es:"Siempre como en el mismo restaurante.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:3,start:24.807,end:35.425,es:"Mi hermano y yo tenemos los mismos ojos.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:4,start:35.425,end:44.371,es:"Ellas trabajan en la misma oficina.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:5,start:44.371,end:53.07,es:"Es la misma canción de ayer.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:6,start:53.07,end:62.083,es:"Llevas la misma camisa que yo.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:7,start:62.083,end:69.884,es:"Nacimos el mismo año.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:8,start:71.384,end:78.669,es:"Para mí, lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:9,start:78.669,end:86.28,es:"Siempre dices lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:10,start:86.28,end:94.46,es:"Yo quiero lo mismo, por favor.",group:"lo mismo",group_index:1,level:"A1"},{i:11,start:94.46,end:102.695,es:"Todos los días hago lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:12,start:102.695,end:109.064,es:"No es lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:13,start:109.064,end:116.222,es:"Pienso lo mismo que tú.",group:"lo mismo",group_index:1,level:"A1"},{i:14,start:116.222,end:126.166,es:"Me pasó lo mismo la semana pasada.",group:"lo mismo",group_index:1,level:"A2"},{i:15,start:127.666,end:134.208,es:"Ven ahora mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A1"},{i:16,start:134.208,end:142.04,es:"Ahora mismo estoy ocupado.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A1"},{i:17,start:142.04,end:149.848,es:"Te espero aquí mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:18,start:149.848,end:157.145,es:"Lo envío hoy mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:19,start:157.145,end:167.501,es:"El hotel está ahí mismo, al lado del parque.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:20,start:167.501,end:176.375,es:"Voy a llamarla ahora mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:21,start:176.375,end:185.263,es:"Puedes dejar las bolsas aquí mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:22,start:185.263,end:192.828,es:"Ayer mismo hablé con él.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:23,start:194.328,end:201.137,es:"Yo mismo lo hice.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:24,start:201.137,end:208.446,es:"Ella misma me lo dijo.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:25,start:208.446,end:216.278,es:"Lo puedo hacer yo misma.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:26,start:216.278,end:225.374,es:"Nosotros mismos pintamos la casa.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:27,start:225.374,end:234.1,es:"El director mismo vino a saludarnos.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:28,start:234.1,end:240.573,es:"Hazlo tú mismo.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:29,start:240.573,end:250.703,es:"Ellos mismos prepararon toda la comida.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:30,start:252.203,end:260.011,es:"Llegamos al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:31,start:260.011,end:268.713,es:"No hablen todos al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:32,start:268.713,end:279.491,es:"Puedo cocinar y escuchar música al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:33,start:279.491,end:289.099,es:"Sonaron los dos teléfonos al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:34,start:289.099,end:299.496,es:"Es difícil estudiar y trabajar al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:35,start:299.496,end:310.032,es:"Quiero ir, pero al mismo tiempo tengo miedo.",group:"al mismo tiempo",group_index:4,level:"B1"},{i:36,start:311.532,end:320.838,es:"Gano lo mismo que el año pasado.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:37,start:320.838,end:329.854,es:"Este vestido cuesta lo mismo que el otro.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:38,start:329.854,end:339.589,es:"Ella tiene la misma edad que mi hermana.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:39,start:339.589,end:348.976,es:"Mi casa es del mismo color que la tuya.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:40,start:348.976,end:357.388,es:"Hoy hace el mismo calor que ayer.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:41,start:357.388,end:367.676,es:"Estudiamos en la misma escuela que nuestros padres.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:42,start:369.176,end:375.489,es:"Me da lo mismo.",group:"da lo mismo",group_index:6,level:"A2"},{i:43,start:375.489,end:383.866,es:"¿Té o café? Me da lo mismo.",group:"da lo mismo",group_index:6,level:"A2"},{i:44,start:383.866,end:392.045,es:"Da lo mismo si llegas tarde.",group:"da lo mismo",group_index:6,level:"B1"},{i:45,start:392.045,end:401.037,es:"Le da lo mismo lo que piensen los demás.",group:"da lo mismo",group_index:6,level:"B1"},{i:46,start:401.037,end:409.761,es:"A mí me da lo mismo dónde comamos.",group:"da lo mismo",group_index:6,level:"B1"},{i:47,start:409.761,end:418.741,es:"Da lo mismo, ya no importa.",group:"da lo mismo",group_index:6,level:"B1"},{i:48,start:418.741,end:427.292,es:"Nos da lo mismo ir hoy o mañana.",group:"da lo mismo",group_index:6,level:"B1"},{i:49,start:428.792,end:436.334,es:"Solo piensa en sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:50,start:436.334,end:445.396,es:"Ella habla mucho de sí misma.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:51,start:445.396,end:454.504,es:"Ella cree mucho en sí misma.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:52,start:454.504,end:463.357,es:"El problema en sí mismo no es grave.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:53,start:463.357,end:470.654,es:"Él se ríe de sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:54,start:470.654,end:479.124,es:"Él no sabe cuidarse a sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:55,start:479.124,end:488.662,es:"Mi abuelo está muy seguro de sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"}],Zl={word:Rl,slug:Ul,kind:Gl,hash:Kl,duration:Xl,voice:Jl,marks:Wl},ei="pasar",ai="pasar",oi="word",ri="bd5310aea43e7292",si=510.456,ni="mx",li=[{i:0,start:.5,end:9.852,es:"Pasa, pasa, estás en tu casa.",group:"pasar, entrar",group_index:0,level:"A1"},{i:1,start:9.852,end:15.816,es:"¿Puedo pasar?",group:"pasar, entrar",group_index:0,level:"A1"},{i:2,start:15.816,end:22.881,es:"Pasen, por favor.",group:"pasar, entrar",group_index:0,level:"A1"},{i:3,start:22.881,end:31.618,es:"Pase, la doctora lo espera.",group:"pasar, entrar",group_index:0,level:"A1"},{i:4,start:31.618,end:39.229,es:"No se puede pasar por aquí.",group:"pasar, entrar",group_index:0,level:"A1"},{i:5,start:39.229,end:47.501,es:"Déjame pasar, por favor.",group:"pasar, entrar",group_index:0,level:"A1"},{i:6,start:49.001,end:54.812,es:"¿Qué pasa?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:7,start:54.812,end:60.531,es:"¿Qué pasó?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:8,start:60.531,end:66.887,es:"No pasa nada.",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:9,start:66.887,end:72.826,es:"¿Qué te pasa?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:10,start:72.826,end:82.19,es:"Algo le pasa a mi computadora.",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:11,start:82.19,end:88.965,es:"¿Qué le pasa al bebé?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:12,start:88.965,end:97.4,es:"Esto siempre me pasa los lunes.",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:13,start:97.4,end:107.449,es:"Ayer pasó algo muy raro en la oficina.",group:"pasar, ocurrir",group_index:1,level:"A2"},{i:14,start:107.449,end:114.99,es:"¿Qué te ha pasado en la mano?",group:"pasar, ocurrir",group_index:1,level:"A2"},{i:15,start:116.49,end:125.554,es:"El autobús pasa cada diez minutos.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:16,start:125.554,end:133.374,es:"Paso por tu casa a las seis.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:17,start:133.374,end:141.275,es:"Este tren pasa por mi pueblo.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:18,start:141.275,end:151.439,es:"Pasamos por el parque de camino a casa.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:19,start:151.439,end:159.468,es:"Ayer pasé por la panadería.",group:"pasar por un lugar",group_index:2,level:"A2"},{i:20,start:159.468,end:170.202,es:"¿Puedes pasar por el supermercado después del trabajo?",group:"pasar por un lugar",group_index:2,level:"A2"},{i:21,start:170.202,end:179.334,es:"Un perro pasó corriendo por la calle.",group:"pasar por un lugar",group_index:2,level:"A2"},{i:22,start:180.834,end:189.617,es:"Paso mucho tiempo con mi familia.",group:"pasar el tiempo",group_index:3,level:"A1"},{i:23,start:189.617,end:197.704,es:"Pasamos el verano en la playa.",group:"pasar el tiempo",group_index:3,level:"A1"},{i:24,start:197.704,end:206.034,es:"Pasé la tarde leyendo.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:25,start:206.034,end:213.657,es:"¿Dónde pasaste la Navidad?",group:"pasar el tiempo",group_index:3,level:"A2"},{i:26,start:213.657,end:223.253,es:"Ella pasa horas delante de la computadora.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:27,start:223.253,end:235.055,es:"Hemos pasado una semana increíble en Perú.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:28,start:235.055,end:245.94,es:"Voy a pasar el fin de semana con mis abuelos.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:29,start:247.44,end:253.97,es:"¡Que lo pases bien!",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:30,start:253.97,end:262.515,es:"Lo pasamos muy bien en la fiesta.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:31,start:262.515,end:272.776,es:"Los niños lo pasaron genial en el parque.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:32,start:272.776,end:282.783,es:"Lo pasé muy mal en el viaje en barco.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:33,start:282.783,end:290.915,es:"¿Lo pasaste bien en el concierto?",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:34,start:290.915,end:300.558,es:"Mi abuela lo pasó mal cuando estuvo enferma.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:35,start:300.558,end:309.237,es:"Siempre lo pasamos bien juntos.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:36,start:310.737,end:318.893,es:"El tiempo pasa muy rápido.",group:"el tiempo pasa",group_index:5,level:"A1"},{i:37,start:318.893,end:326.19,es:"Ya pasaron tres años.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:38,start:326.19,end:334.892,es:"Pasaron muchos días sin noticias.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:39,start:334.892,end:344.349,es:"Han pasado diez minutos y no ha llegado.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:40,start:344.349,end:353.04,es:"Con los años, el dolor pasa.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:41,start:353.04,end:360.221,es:"Ya pasó la tormenta.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:42,start:360.221,end:371.326,es:"Cuando pase el invierno, vamos a pintar la casa.",group:"el tiempo pasa",group_index:5,level:"B1"},{i:43,start:372.826,end:379.758,es:"¿Me pasas la sal?",group:"pasar algo a alguien",group_index:6,level:"A1"},{i:44,start:379.758,end:388.425,es:"Pásame el agua, por favor.",group:"pasar algo a alguien",group_index:6,level:"A1"},{i:45,start:388.425,end:397.626,es:"Te paso el número de mi hermano.",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:46,start:397.626,end:406.711,es:"Le pasé el balón a mi amigo.",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:47,start:406.711,end:415.071,es:"¿Me pasaste las fotos del viaje?",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:48,start:415.071,end:426.072,es:"Ya le he pasado el mensaje a mi jefe.",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:49,start:427.572,end:438.201,es:"Pasé el examen de matemáticas a la primera.",group:"expresiones con pasar",group_index:7,level:"A2"},{i:50,start:438.201,end:447.321,es:"Me pasé de parada en el autobús.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:51,start:447.321,end:455.989,es:"Ya se me pasó el dolor de cabeza.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:52,start:455.989,end:463.263,es:"No te pases con la sal.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:53,start:463.263,end:473.021,es:"Se me pasó llamarte, lo siento mucho.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:54,start:473.021,end:483.372,es:"Pasamos por momentos difíciles el año pasado.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:55,start:483.372,end:492.295,es:"Ojalá que no le pase nada malo.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:56,start:492.295,end:501.983,es:"Pase lo que pase, yo estoy contigo.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:57,start:501.983,end:510.407,es:"Esa canción ya pasó de moda.",group:"expresiones con pasar",group_index:7,level:"B1"}],ii={word:ei,slug:ai,kind:oi,hash:ri,duration:si,voice:ni,marks:li},ti="poner(se)",ui="poner_se",di="word",pi="c960474e57d4be6c",gi=564.312,ci="mx",vi=[{i:0,start:.5,end:8.015,es:"Pon las llaves en la mesa.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:1,start:8.015,end:15.44,es:"¿Dónde pongo mi abrigo?",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:2,start:15.44,end:24.455,es:"Pongo la leche en el refrigerador.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:3,start:24.455,end:32.693,es:"Ella pone las flores en el agua.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:4,start:32.693,end:40.884,es:"No pongas los pies en el sofá.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:5,start:40.884,end:49.444,es:"Pon los zapatos debajo de la cama.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:6,start:49.444,end:57.176,es:"¿Pusiste azúcar en mi café?",group:"poner algo en un lugar",group_index:0,level:"A2"},{i:7,start:57.176,end:64.961,es:"Puse tu libro en la mochila.",group:"poner algo en un lugar",group_index:0,level:"A2"},{i:8,start:66.461,end:72.716,es:"¿Pongo la tele?",group:"poner la tele, la música",group_index:1,level:"A1"},{i:9,start:72.716,end:80.848,es:"Pon música, por favor.",group:"poner la tele, la música",group_index:1,level:"A1"},{i:10,start:80.848,end:89.84,es:"Mi padre pone la radio por la mañana.",group:"poner la tele, la música",group_index:1,level:"A1"},{i:11,start:89.84,end:97.772,es:"¿Puedes poner la calefacción?",group:"poner la tele, la música",group_index:1,level:"A1"},{i:12,start:97.772,end:106.146,es:"Pon el ventilador, por favor.",group:"poner la tele, la música",group_index:1,level:"A1"},{i:13,start:106.146,end:114.085,es:"Puse el despertador a las seis.",group:"poner la tele, la música",group_index:1,level:"A2"},{i:14,start:114.085,end:123.79,es:"Pon una película, estoy aburrido.",group:"poner la tele, la música",group_index:1,level:"A2"},{i:15,start:123.79,end:135.453,es:"Voy a poner el aire acondicionado, hace mucho calor.",group:"poner la tele, la música",group_index:1,level:"A2"},{i:16,start:136.953,end:145.606,es:"Pon la mesa, vamos a comer.",group:"poner la mesa",group_index:2,level:"A1"},{i:17,start:145.606,end:154.25,es:"Yo pongo la mesa y tú cocinas.",group:"poner la mesa",group_index:2,level:"A1"},{i:18,start:154.25,end:161.454,es:"¿Quién pone la mesa hoy?",group:"poner la mesa",group_index:2,level:"A1"},{i:19,start:161.454,end:171.286,es:"Los niños ponen la mesa todas las noches.",group:"poner la mesa",group_index:2,level:"A1"},{i:20,start:171.286,end:180.719,es:"Ayúdame a poner la mesa, por favor.",group:"poner la mesa",group_index:2,level:"A1"},{i:21,start:180.719,end:188.98,es:"Ya puse la mesa para la cena.",group:"poner la mesa",group_index:2,level:"A2"},{i:22,start:190.48,end:199.8,es:"Ponte el abrigo, hace frío.",group:"ponerse ropa",group_index:3,level:"A1"},{i:23,start:199.8,end:206.935,es:"Me pongo los zapatos.",group:"ponerse ropa",group_index:3,level:"A1"},{i:24,start:206.935,end:217.819,es:"Ella siempre se pone un vestido rojo.",group:"ponerse ropa",group_index:3,level:"A1"},{i:25,start:217.819,end:225.891,es:"Ponte el cinturón de seguridad.",group:"ponerse ropa",group_index:3,level:"A1"},{i:26,start:225.891,end:234.895,es:"No me pongo esos pantalones nunca.",group:"ponerse ropa",group_index:3,level:"A1"},{i:27,start:234.895,end:243.167,es:"¿Qué te vas a poner para la fiesta?",group:"ponerse ropa",group_index:3,level:"A2"},{i:28,start:243.167,end:251.928,es:"Hoy me puse la camisa de mi hermano.",group:"ponerse ropa",group_index:3,level:"A2"},{i:29,start:251.928,end:260.819,es:"Los niños ya se pusieron el pijama.",group:"ponerse ropa",group_index:3,level:"A2"},{i:30,start:262.319,end:270.139,es:"Le pusieron Ana a la niña.",group:"poner nombre",group_index:4,level:"A2"},{i:31,start:270.139,end:278.713,es:"¿Qué nombre le vas a poner al perro?",group:"poner nombre",group_index:4,level:"A2"},{i:32,start:278.713,end:287.102,es:"Le pusimos Luna a nuestra gata.",group:"poner nombre",group_index:4,level:"A2"},{i:33,start:287.102,end:296.628,es:"Mis padres me pusieron el nombre de mi abuelo.",group:"poner nombre",group_index:4,level:"A2"},{i:34,start:296.628,end:306.392,es:"Todavía no le han puesto nombre al bebé.",group:"poner nombre",group_index:4,level:"A2"},{i:35,start:306.392,end:316.074,es:"¿Por qué le pusieron ese nombre al restaurante?",group:"poner nombre",group_index:4,level:"A2"},{i:36,start:316.074,end:326.297,es:"En el colegio le pusieron un apodo muy gracioso.",group:"poner nombre",group_index:4,level:"B1"},{i:37,start:327.797,end:337.137,es:"Me pongo nervioso antes de un examen.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:38,start:337.137,end:347.176,es:"Mi madre se puso muy contenta con la noticia.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:39,start:347.176,end:355.866,es:"El cielo se puso gris de repente.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:40,start:355.866,end:364.417,es:"Cuando la vio, se puso rojo.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:41,start:364.417,end:371.378,es:"No te pongas triste.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:42,start:371.378,end:382.576,es:"Mi abuela se puso enferma el invierno pasado.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:43,start:382.576,end:392.196,es:"Se pone de mal humor cuando tiene hambre.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:44,start:392.196,end:401.165,es:"Me puse muy feliz cuando llamaste.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:45,start:402.665,end:412.235,es:"De repente, el bebé se puso a llorar.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:46,start:412.235,end:422.516,es:"Cuando llegué a casa, me puse a cocinar.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:47,start:422.516,end:431.647,es:"Se puso a llover justo cuando salimos.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:48,start:431.647,end:442.361,es:"Ponte a estudiar, mañana tienes examen.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:49,start:442.361,end:453.806,es:"Después de cenar, nos pusimos a jugar a las cartas.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:50,start:453.806,end:464.551,es:"Si me pongo a ver la tele, no termino nunca.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:51,start:464.551,end:476.585,es:"Mi hermano se pone a cantar en la ducha todas las mañanas.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:52,start:476.585,end:486.553,es:"Quiero que te pongas a trabajar ahora mismo.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:53,start:488.053,end:496,es:"Nunca nos ponemos de acuerdo.",group:"ponerse de acuerdo",group_index:7,level:"A2"},{i:54,start:496,end:505.759,es:"Al final nos pusimos de acuerdo sobre el viaje.",group:"ponerse de acuerdo",group_index:7,level:"A2"},{i:55,start:505.759,end:515.819,es:"Tenemos que ponernos de acuerdo antes del viernes.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:56,start:515.819,end:525.427,es:"Es difícil que todos se pongan de acuerdo.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:57,start:525.427,end:534.489,es:"¿Ya se pusieron de acuerdo sobre el precio?",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:58,start:534.489,end:545.455,es:"Mis padres no se ponen de acuerdo sobre el nombre del perro.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:59,start:545.455,end:554.552,es:"Ojalá nos pongamos de acuerdo pronto.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:60,start:554.552,end:564.241,es:"Si no se ponen de acuerdo, no habrá fiesta.",group:"ponerse de acuerdo",group_index:7,level:"B1"}],mi={word:ti,slug:ui,kind:di,hash:pi,duration:gi,voice:ci,marks:vi},xi="por / para",_i="por_para",Ai="word",hi="1fbc422801a0a788",bi=531.48,fi="mx",qi=[{i:0,start:.5,end:7.553,es:"Estudio para aprender.",group:"para: finalidad",group_index:0,level:"A1"},{i:1,start:7.553,end:14.375,es:"Trabajo para vivir.",group:"para: finalidad",group_index:0,level:"A1"},{i:2,start:14.375,end:23.448,es:"Voy al mercado para comprar fruta.",group:"para: finalidad",group_index:0,level:"A1"},{i:3,start:23.448,end:31.701,es:"Necesito dinero para el viaje.",group:"para: finalidad",group_index:0,level:"A1"},{i:4,start:31.701,end:41.054,es:"Esta caja es para los libros.",group:"para: finalidad",group_index:0,level:"A1"},{i:5,start:41.054,end:47.678,es:"¿Para qué sirve esto?",group:"para: finalidad",group_index:0,level:"A1"},{i:6,start:47.678,end:55.822,es:"Me levanto temprano para correr.",group:"para: finalidad",group_index:0,level:"A1"},{i:7,start:55.822,end:63.909,es:"Ahorro para comprar una casa.",group:"para: finalidad",group_index:0,level:"A2"},{i:8,start:65.409,end:72.962,es:"Este regalo es para ti.",group:"para: destinatario",group_index:1,level:"A1"},{i:9,start:72.962,end:80.979,es:"Las flores son para mi madre.",group:"para: destinatario",group_index:1,level:"A1"},{i:10,start:80.979,end:87.974,es:"¿Para quién es el café?",group:"para: destinatario",group_index:1,level:"A1"},{i:11,start:87.974,end:95.62,es:"Hay una carta para usted.",group:"para: destinatario",group_index:1,level:"A1"},{i:12,start:95.62,end:105.146,es:"Trabaja para una empresa grande.",group:"para: destinatario",group_index:1,level:"A1"},{i:13,start:105.146,end:112.571,es:"Hice la cena para todos.",group:"para: destinatario",group_index:1,level:"A2"},{i:14,start:114.071,end:122.286,es:"Mañana salimos para la playa.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:15,start:122.286,end:131.232,es:"El tren para Quito sale a las ocho.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:16,start:131.232,end:139.342,es:"¿Este autobús va para el centro?",group:"para: destino y plazo",group_index:2,level:"A2"},{i:17,start:139.342,end:147.873,es:"Necesito el informe para el lunes.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:18,start:147.873,end:155.809,es:"La tarea es para mañana.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:19,start:155.809,end:164.476,es:"Para las seis ya estoy en casa.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:20,start:164.476,end:173.271,es:"Para el verano quiero hablar mejor.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:21,start:174.771,end:184.809,es:"Para mí, esta película es aburrida.",group:"para mí: opinión",group_index:3,level:"A2"},{i:22,start:184.809,end:195.717,es:"Para ella, la familia es lo primero.",group:"para mí: opinión",group_index:3,level:"A2"},{i:23,start:195.717,end:204.651,es:"Para mi gusto, hay demasiada sal.",group:"para mí: opinión",group_index:3,level:"A2"},{i:24,start:204.651,end:215.211,es:"Para nosotros, el domingo es el mejor día.",group:"para mí: opinión",group_index:3,level:"A2"},{i:25,start:215.211,end:226.231,es:"Para un niño tan pequeño, lee muy bien.",group:"para mí: opinión",group_index:3,level:"B1"},{i:26,start:226.231,end:235.398,es:"Hace mucho calor para ser diciembre.",group:"para mí: opinión",group_index:3,level:"B1"},{i:27,start:236.898,end:244.021,es:"Gracias por la comida.",group:"por: causa",group_index:4,level:"A1"},{i:28,start:244.021,end:251.028,es:"Perdón por la espera.",group:"por: causa",group_index:4,level:"A1"},{i:29,start:251.028,end:257.196,es:"Lo hice por ti.",group:"por: causa",group_index:4,level:"A2"},{i:30,start:257.196,end:264.644,es:"No salimos por la lluvia.",group:"por: causa",group_index:4,level:"A2"},{i:31,start:264.644,end:272.464,es:"Llegué tarde por el tráfico.",group:"por: causa",group_index:4,level:"A2"},{i:32,start:272.464,end:280.295,es:"Está cansado por el viaje.",group:"por: causa",group_index:4,level:"A2"},{i:33,start:280.295,end:289.078,es:"Me preocupo mucho por mi hijo.",group:"por: causa",group_index:4,level:"A2"},{i:34,start:290.578,end:298.13,es:"Caminamos por el parque.",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:35,start:298.13,end:305.346,es:"Estudio por la mañana.",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:36,start:305.346,end:312.445,es:"Hablamos por teléfono.",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:37,start:312.445,end:319.939,es:"¿Hay una farmacia por aquí?",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:38,start:319.939,end:327.663,es:"El gato entró por la ventana.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:39,start:327.663,end:335.889,es:"Paso por tu casa a las cinco.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:40,start:335.889,end:343.825,es:"Te mando las fotos por correo.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:41,start:343.825,end:352.039,es:"Viví en Perú por dos años.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:42,start:353.539,end:361.591,es:"Te cambio mi libro por el tuyo.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:43,start:361.591,end:369.933,es:"Pagamos mucho por esta casa.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:44,start:369.933,end:378.983,es:"Vendió su auto por muy poco dinero.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:45,start:378.983,end:389.021,es:"Cambié la camisa por una más grande.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:46,start:389.021,end:396.782,es:"Mañana trabajo yo por ti.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:47,start:396.782,end:404.967,es:"¿Cuánto pagaste por esa chaqueta?",group:"por: cambio y precio",group_index:6,level:"A2"},{i:48,start:406.467,end:414.864,es:"Por favor, cierra la puerta.",group:"por fin, por eso, por favor",group_index:7,level:"A1"},{i:49,start:414.864,end:421.349,es:"¡Por fin llegaste!",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:50,start:421.349,end:429.288,es:"Por supuesto que puedes venir.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:51,start:429.288,end:437.839,es:"Estaba enfermo, por eso no vine.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:52,start:437.839,end:445.751,es:"Por cierto, ¿viste a Juan ayer?",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:53,start:445.751,end:453.035,es:"Por ahora todo está bien.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:54,start:453.035,end:460.634,es:"Por suerte, no pasó nada.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:55,start:462.134,end:471.266,es:"Salí por la mañana para llegar temprano.",group:"por y para juntos",group_index:8,level:"B1"},{i:56,start:471.266,end:479.392,es:"Lo hice por ti, no para mí.",group:"por y para juntos",group_index:8,level:"B1"},{i:57,start:479.392,end:489.104,es:"Pasamos por Lima para visitar a mis tíos.",group:"por y para juntos",group_index:8,level:"B1"},{i:58,start:489.104,end:499.072,es:"Te llamo por teléfono para confirmar la hora.",group:"por y para juntos",group_index:8,level:"B1"},{i:59,start:499.072,end:509.121,es:"Estudia por las noches para aprobar el examen.",group:"por y para juntos",group_index:8,level:"B1"},{i:60,start:509.121,end:521.039,es:"Gracias por el regalo, es perfecto para mi casa nueva.",group:"por y para juntos",group_index:8,level:"B1"},{i:61,start:521.039,end:531.424,es:"Para llegar al hotel, hay que pasar por el puente.",group:"por y para juntos",group_index:8,level:"B1"}],yi={word:xi,slug:_i,kind:Ai,hash:hi,duration:bi,voice:fi,marks:qi},ji="que",Bi="que",zi="word",Mi="0f3cd5435942da99",Ei=512.688,ki="mx",$i=[{i:0,start:.5,end:8.471,es:"Tengo que trabajar mañana.",group:"tener que, hay que",group_index:0,level:"A1"},{i:1,start:8.471,end:16.267,es:"Tienes que probar esta sopa.",group:"tener que, hay que",group_index:0,level:"A1"},{i:2,start:16.267,end:23.425,es:"Hay que salir temprano.",group:"tener que, hay que",group_index:0,level:"A1"},{i:3,start:23.425,end:30.872,es:"Tenemos que comprar pan.",group:"tener que, hay que",group_index:0,level:"A1"},{i:4,start:30.872,end:38.494,es:"Hay que pagar en efectivo.",group:"tener que, hay que",group_index:0,level:"A1"},{i:5,start:38.494,end:44.863,es:"¿Tienes que ir hoy?",group:"tener que, hay que",group_index:0,level:"A1"},{i:6,start:44.863,end:52.787,es:"Mis hijos tienen que estudiar.",group:"tener que, hay que",group_index:0,level:"A1"},{i:7,start:52.787,end:61.269,es:"Hay que tener cuidado con el perro.",group:"tener que, hay que",group_index:0,level:"A1"},{i:8,start:62.769,end:71.665,es:"La chica que canta es mi prima.",group:"el libro que leí",group_index:1,level:"A1"},{i:9,start:71.665,end:81.946,es:"Tengo un amigo que vive en Chile.",group:"el libro que leí",group_index:1,level:"A1"},{i:10,start:81.946,end:91.066,es:"El tren que va a Lima sale ahora.",group:"el libro que leí",group_index:1,level:"A1"},{i:11,start:91.066,end:99.989,es:"Es una película que me gusta mucho.",group:"el libro que leí",group_index:1,level:"A1"},{i:12,start:99.989,end:110.56,es:"Las personas que trabajan aquí son muy amables.",group:"el libro que leí",group_index:1,level:"A1"},{i:13,start:110.56,end:118.53,es:"El libro que leí es muy bueno.",group:"el libro que leí",group_index:1,level:"A2"},{i:14,start:118.53,end:127.905,es:"La casa que compramos es pequeña.",group:"el libro que leí",group_index:1,level:"A2"},{i:15,start:127.905,end:137.455,es:"¿Dónde está la camisa que me regalaste?",group:"el libro que leí",group_index:1,level:"A2"},{i:16,start:137.455,end:147.163,es:"El restaurante que te recomendé está cerrado.",group:"el libro que leí",group_index:1,level:"A2"},{i:17,start:148.663,end:156.181,es:"Creo que va a llover.",group:"creo que",group_index:2,level:"A1"},{i:18,start:156.181,end:163.722,es:"Dice que está cansado.",group:"creo que",group_index:2,level:"A1"},{i:19,start:163.722,end:171.147,es:"Pienso que tienes razón.",group:"creo que",group_index:2,level:"A1"},{i:20,start:171.147,end:178.108,es:"Sé que es difícil.",group:"creo que",group_index:2,level:"A1"},{i:21,start:178.108,end:185.428,es:"Pare
