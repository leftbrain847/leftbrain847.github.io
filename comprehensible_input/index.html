ce que no hay nadie.",group:"creo que",group_index:2,level:"A1"},{i:22,start:185.428,end:191.716,es:"Supongo que sí.",group:"creo que",group_index:2,level:"A1"},{i:23,start:191.716,end:199.396,es:"Estoy seguro de que lo sabe.",group:"creo que",group_index:2,level:"A2"},{i:24,start:199.396,end:207.266,es:"Me dijo que no podía venir.",group:"creo que",group_index:2,level:"A2"},{i:25,start:207.266,end:214.726,es:"Veo que ya terminaste.",group:"creo que",group_index:2,level:"A2"},{i:26,start:216.226,end:225.253,es:"Mi hermano es más alto que yo.",group:"más que, menos que",group_index:3,level:"A1"},{i:27,start:225.253,end:233.886,es:"Este auto es más caro que el otro.",group:"más que, menos que",group_index:3,level:"A2"},{i:28,start:233.886,end:242.123,es:"Hoy hace menos frío que ayer.",group:"más que, menos que",group_index:3,level:"A2"},{i:29,start:242.123,end:250.615,es:"Me gusta más el té que el café.",group:"más que, menos que",group_index:3,level:"A2"},{i:30,start:250.615,end:259.619,es:"Corre más rápido que su padre.",group:"más que, menos que",group_index:3,level:"A2"},{i:31,start:259.619,end:267.578,es:"Ella trabaja más que nadie.",group:"más que, menos que",group_index:3,level:"A2"},{i:32,start:267.578,end:276.22,es:"La película es peor que el libro.",group:"más que, menos que",group_index:3,level:"A2"},{i:33,start:276.22,end:284.33,es:"Ahora gana menos que antes.",group:"más que, menos que",group_index:3,level:"A2"},{i:34,start:284.33,end:292.091,es:"Más vale tarde que nunca.",group:"más que, menos que",group_index:3,level:"A2"},{i:35,start:293.591,end:301.005,es:"Es que no tengo tiempo.",group:"es que",group_index:4,level:"A2"},{i:36,start:301.005,end:309.85,es:"Lo siento, es que estaba ocupado.",group:"es que",group_index:4,level:"A2"},{i:37,start:309.85,end:319.249,es:"No puedo ir, es que estoy enfermo.",group:"es que",group_index:4,level:"A2"},{i:38,start:319.249,end:326.21,es:"¿Es que no me escuchas?",group:"es que",group_index:4,level:"A2"},{i:39,start:326.21,end:333.588,es:"Es que no sabía nada.",group:"es que",group_index:4,level:"A2"},{i:40,start:333.588,end:343.126,es:"Perdón, es que había mucho tráfico.",group:"es que",group_index:4,level:"A2"},{i:41,start:343.126,end:350.876,es:"Es que hoy no me siento bien.",group:"es que",group_index:4,level:"A2"},{i:42,start:352.376,end:361.729,es:"Estaba cansado, así que me acosté.",group:"así que, ya que",group_index:5,level:"A2"},{i:43,start:361.729,end:371.114,es:"Está lloviendo, así que no salimos.",group:"así que, ya que",group_index:5,level:"A2"},{i:44,start:371.114,end:380.501,es:"Ya que estás aquí, ayúdame con esto.",group:"así que, ya que",group_index:5,level:"B1"},{i:45,start:380.501,end:389.563,es:"Ya que tienes tiempo, ¿vamos al cine?",group:"así que, ya que",group_index:5,level:"B1"},{i:46,start:391.063,end:399.022,es:"Quiero que vengas a mi casa.",group:"quiero que vengas",group_index:6,level:"B1"},{i:47,start:399.022,end:405.797,es:"Espero que te guste.",group:"quiero que vengas",group_index:6,level:"B1"},{i:48,start:405.797,end:413.05,es:"Necesito que me ayudes.",group:"quiero que vengas",group_index:6,level:"B1"},{i:49,start:413.05,end:421.578,es:"Es importante que duermas bien.",group:"quiero que vengas",group_index:6,level:"B1"},{i:50,start:421.578,end:430.001,es:"Prefiero que hablemos mañana.",group:"quiero que vengas",group_index:6,level:"B1"},{i:51,start:430.001,end:439.805,es:"Mi madre quiere que la llame todos los días.",group:"quiero que vengas",group_index:6,level:"B1"},{i:52,start:439.805,end:447.532,es:"Es mejor que salgamos ya.",group:"quiero que vengas",group_index:6,level:"B1"},{i:53,start:447.532,end:455.305,es:"No creo que llegue a tiempo.",group:"quiero que vengas",group_index:6,level:"B1"},{i:54,start:456.805,end:463.232,es:"¡Que te vaya bien!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:55,start:463.232,end:469.31,es:"Que descanses.",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:56,start:469.31,end:476.41,es:"¡Que tengas buen viaje!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:57,start:476.41,end:483.487,es:"¡Que te mejores pronto!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:58,start:483.487,end:490.842,es:"¡Que sean muy felices!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:59,start:490.842,end:497.385,es:"Que duermas bien.",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:60,start:497.385,end:505.007,es:"¡Que disfrutes la fiesta!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:61,start:505.007,end:512.629,es:"¡Que cumplas muchos más!",group:"¡que te vaya bien!",group_index:7,level:"B1"}],wi={word:ji,slug:Bi,kind:zi,hash:Mi,duration:Ei,voice:ki,marks:$i},Ni="quedar(se)",Si="quedar_se",Li="word",Ti="477a057090c27daa",Pi=504.192,Ci="mx",Hi=[{i:0,start:.5,end:7.542,es:"Hoy me quedo en casa.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:1,start:7.542,end:14.154,es:"¿Te quedas a cenar?",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:2,start:14.154,end:22.636,es:"Nos quedamos en un hotel pequeño.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:3,start:22.636,end:31.024,es:"Mi hermana se queda con nosotros.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:4,start:31.024,end:39.192,es:"Quédate aquí un momento.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:5,start:39.192,end:47.627,es:"Prefiero quedarme en la cama.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:6,start:47.627,end:57.177,es:"Ayer nos quedamos en la playa todo el día.",group:"quedarse en un lugar",group_index:0,level:"A2"},{i:7,start:57.177,end:66.982,es:"Me quedé dos semanas en casa de mis abuelos.",group:"quedarse en un lugar",group_index:0,level:"A2"},{i:8,start:68.482,end:75.454,es:"¿Dónde queda el museo?",group:"quedar, estar situado",group_index:1,level:"A1"},{i:9,start:75.454,end:83.504,es:"El banco queda muy cerca.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:10,start:83.504,end:91.916,es:"Mi casa queda lejos del centro.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:11,start:91.916,end:101.836,es:"La farmacia queda al lado del mercado.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:12,start:101.836,end:109.179,es:"¿Queda lejos la estación?",group:"quedar, estar situado",group_index:1,level:"A1"},{i:13,start:109.179,end:117.882,es:"La escuela queda a dos calles de aquí.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:14,start:117.882,end:127.197,es:"El restaurante queda enfrente del parque.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:15,start:128.697,end:136.319,es:"Queda un poco de café.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:16,start:136.319,end:142.711,es:"No queda leche.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:17,start:142.711,end:149.799,es:"¿Cuánto dinero te queda?",group:"quedar, sobrar",group_index:2,level:"A1"},{i:18,start:149.799,end:157.433,es:"Solo quedan dos asientos.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:19,start:157.433,end:165.996,es:"Quedan cinco minutos para el final.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:20,start:165.996,end:174.663,es:"Me quedan tres días de vacaciones.",group:"quedar, sobrar",group_index:2,level:"A2"},{i:21,start:174.663,end:183.237,es:"No quedaba nada en el refrigerador.",group:"quedar, sobrar",group_index:2,level:"A2"},{i:22,start:183.237,end:191.897,es:"Todavía nos queda mucho trabajo.",group:"quedar, sobrar",group_index:2,level:"A2"},{i:23,start:193.397,end:201.972,es:"Esa camisa te queda muy bien.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:24,start:201.972,end:210.569,es:"Estos zapatos me quedan pequeños.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:25,start:210.569,end:218.609,es:"El vestido le queda grande.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:26,start:218.609,end:226.185,es:"¿Cómo me queda este sombrero?",group:"quedar bien o mal",group_index:3,level:"A2"},{i:27,start:226.185,end:234.783,es:"El azul te queda mejor que el rojo.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:28,start:234.783,end:243.238,es:"Los pantalones ya no me quedan.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:29,start:243.238,end:251.139,es:"Quedé muy mal con mi jefe.",group:"quedar bien o mal",group_index:3,level:"B1"},{i:30,start:251.139,end:259.493,es:"Quiero quedar bien con tus padres.",group:"quedar bien o mal",group_index:3,level:"B1"},{i:31,start:260.993,end:268.804,es:"La sopa quedó muy rica.",group:"quedar, resultado",group_index:4,level:"A2"},{i:32,start:268.804,end:276.821,es:"¡Qué bonita quedó tu habitación!",group:"quedar, resultado",group_index:4,level:"A2"},{i:33,start:276.821,end:284.986,es:"La casa quedó muy limpia.",group:"quedar, resultado",group_index:4,level:"A2"},{i:34,start:284.986,end:294.721,es:"La puerta quedó abierta toda la noche.",group:"quedar, resultado",group_index:4,level:"A2"},{i:35,start:294.721,end:305.618,es:"Con la pintura nueva, la cocina quedó como nueva.",group:"quedar, resultado",group_index:4,level:"A2"},{i:36,start:305.618,end:314.401,es:"Mi dibujo no quedó como yo quería.",group:"quedar, resultado",group_index:4,level:"A2"},{i:37,start:314.401,end:325.263,es:"Después de la tormenta, la calle quedó sin luz.",group:"quedar, resultado",group_index:4,level:"B1"},{i:38,start:326.763,end:335.14,es:"Me quedé sorprendido con la noticia.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:39,start:335.14,end:342.785,es:"Se quedó dormido en el sofá.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:40,start:342.785,end:350.245,es:"El niño se quedó callado.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:41,start:350.245,end:360.654,es:"Nos quedamos sin gasolina en la carretera.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:42,start:360.654,end:370.482,es:"Mi abuela se quedó sola después de la mudanza.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:43,start:370.482,end:379.451,es:"Me quedé mirando el mar un buen rato.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:44,start:379.451,end:389.337,es:"Se quedaron hablando hasta la medianoche.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:45,start:389.337,end:399.421,es:"Si sigues así, te vas a quedar sin amigos.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"B1"},{i:46,start:400.921,end:408.845,es:"Me quedo con la camisa verde.",group:"quedarse con algo",group_index:6,level:"A2"},{i:47,start:408.845,end:415.771,es:"Quédate con el cambio.",group:"quedarse con algo",group_index:6,level:"A2"},{i:48,start:415.771,end:424.079,es:"Mi hermano se quedó con mi libro.",group:"quedarse con algo",group_index:6,level:"A2"},{i:49,start:424.079,end:432.281,es:"¿Te puedes quedar con mis llaves?",group:"quedarse con algo",group_index:6,level:"A2"},{i:50,start:432.281,end:442.829,es:"Al final nos quedamos con el apartamento más grande.",group:"quedarse con algo",group_index:6,level:"B1"},{i:51,start:444.329,end:452.242,es:"Quedamos en vernos el lunes.",group:"quedar en algo",group_index:7,level:"B1"},{i:52,start:452.242,end:462.024,es:"Habíamos quedado en llamarnos esta tarde.",group:"quedar en algo",group_index:7,level:"B1"},{i:53,start:462.024,end:471.156,es:"Quedaron en traer la comida a la fiesta.",group:"quedar en algo",group_index:7,level:"B1"},{i:54,start:471.156,end:479.219,es:"¿En qué quedamos, vienes o no?",group:"quedar en algo",group_index:7,level:"B1"},{i:55,start:479.219,end:488.571,es:"Quedé en ayudar a mi vecino con la mudanza.",group:"quedar en algo",group_index:7,level:"B1"},{i:56,start:488.571,end:495.448,es:"Todo quedó en nada.",group:"quedar en algo",group_index:7,level:"B1"},{i:57,start:495.448,end:504.126,es:"Quedamos en encontrarnos en la plaza.",group:"quedar en algo",group_index:7,level:"B1"}],Qi={word:Ni,slug:Si,kind:Li,hash:Ti,duration:Pi,voice:Ci,marks:Hi},Di="sacar",Yi="sacar",Vi="word",Oi="6b7c641e433dde65",Ii=559.104,Fi="mx",Ri=[{i:0,start:.5,end:8.807,es:"Saca la leche del refrigerador.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:1,start:8.807,end:18.287,es:"Ella saca un libro de la mochila.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:2,start:18.287,end:27.154,es:"¿Puedes sacar los platos del armario?",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:3,start:27.154,end:35.891,es:"Saco las llaves del bolsillo.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:4,start:35.891,end:44.024,es:"Saquen sus cuadernos, por favor.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:5,start:44.024,end:52.39,es:"Sacamos las maletas del auto.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:6,start:52.39,end:60.528,es:"El dentista me sacó una muela.",group:"sacar algo de un lugar",group_index:0,level:"A2"},{i:7,start:60.528,end:68.812,es:"¿Ya sacaste la ropa de la lavadora?",group:"sacar algo de un lugar",group_index:0,level:"A2"},{i:8,start:70.312,end:78.422,es:"¿Quién saca la basura hoy?",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:9,start:78.422,end:87.995,es:"Saco al perro todas las mañanas.",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:10,start:87.995,end:99.309,es:"Por favor, saca la basura antes de dormir.",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:11,start:99.309,end:109.021,es:"Mi hijo nunca saca la basura.",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:12,start:109.021,end:118.049,es:"Voy a sacar al perro a pasear.",group:"sacar la basura, sacar al perro",group_index:1,level:"A2"},{i:13,start:118.049,end:126.786,es:"Ayer se me olvidó sacar la basura.",group:"sacar la basura, sacar al perro",group_index:1,level:"A2"},{i:14,start:126.786,end:136.452,es:"Saqué a los niños al parque un rato.",group:"sacar la basura, sacar al perro",group_index:1,level:"A2"},{i:15,start:137.952,end:145.092,es:"¿Me sacas una foto?",group:"sacar fotos",group_index:2,level:"A1"},{i:16,start:145.092,end:153.562,es:"Aquí no se pueden sacar fotos.",group:"sacar fotos",group_index:2,level:"A1"},{i:17,start:153.562,end:161.756,es:"Mi madre saca fotos de todo.",group:"sacar fotos",group_index:2,level:"A1"},{i:18,start:161.756,end:169.587,es:"Saca una foto del mar.",group:"sacar fotos",group_index:2,level:"A1"},{i:19,start:169.587,end:178.545,es:"Sacamos muchas fotos en el viaje.",group:"sacar fotos",group_index:2,level:"A2"},{i:20,start:178.545,end:187.357,es:"¿Puedes sacarnos una foto a los dos?",group:"sacar fotos",group_index:2,level:"A2"},{i:21,start:187.357,end:197.599,es:"Le saqué una foto al atardecer con el teléfono.",group:"sacar fotos",group_index:2,level:"A2"},{i:22,start:199.099,end:206.598,es:"Necesito sacar dinero.",group:"sacar dinero",group_index:3,level:"A1"},{i:23,start:206.598,end:215.018,es:"¿Hay un cajero para sacar dinero?",group:"sacar dinero",group_index:3,level:"A1"},{i:24,start:215.018,end:223.79,es:"Saqué dinero del cajero de la esquina.",group:"sacar dinero",group_index:3,level:"A2"},{i:25,start:223.79,end:234.768,es:"No pude sacar dinero porque el cajero no funcionaba.",group:"sacar dinero",group_index:3,level:"A2"},{i:26,start:234.768,end:244.886,es:"Voy a sacar dinero antes de ir al mercado.",group:"sacar dinero",group_index:3,level:"A2"},{i:27,start:244.886,end:254.784,es:"Mi abuelo saca dinero del banco cada mes.",group:"sacar dinero",group_index:3,level:"A2"},{i:28,start:254.784,end:265.274,es:"Si sacas dinero en otro banco, te cobran más.",group:"sacar dinero",group_index:3,level:"A2"},{i:29,start:266.774,end:276.823,es:"Mi hermana siempre saca buenas notas.",group:"sacar buena nota",group_index:4,level:"A1"},{i:30,start:276.823,end:285.757,es:"Saqué un diez en matemáticas.",group:"sacar buena nota",group_index:4,level:"A2"},{i:31,start:285.757,end:294.262,es:"¿Qué nota sacaste en el examen?",group:"sacar buena nota",group_index:4,level:"A2"},{i:32,start:294.262,end:303.568,es:"Este año he sacado mejores notas.",group:"sacar buena nota",group_index:4,level:"A2"},{i:33,start:303.568,end:313.152,es:"Si estudias, vas a sacar buena nota.",group:"sacar buena nota",group_index:4,level:"A2"},{i:34,start:313.152,end:321.912,es:"No saqué buena nota, pero aprobé.",group:"sacar buena nota",group_index:4,level:"A2"},{i:35,start:321.912,end:332.251,es:"Ojalá saque buena nota en el examen de inglés.",group:"sacar buena nota",group_index:4,level:"B1"},{i:36,start:333.751,end:343.208,es:"Ya saqué los boletos para el concierto.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:37,start:343.208,end:352.259,es:"Hay que sacar las entradas por internet.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:38,start:352.259,end:360.926,es:"¿Dónde puedo sacar un boleto de tren?",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:39,start:360.926,end:371.056,es:"Mi hijo acaba de sacar la licencia de conducir.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:40,start:371.056,end:381.198,es:"Tengo que sacar el pasaporte antes del viaje.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:41,start:381.198,end:391.664,es:"Vamos a sacar entradas para el partido del sábado.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:42,start:391.664,end:402.298,es:"Me gustaría sacar los boletos con tiempo.",group:"sacar entradas, boletos, documentos",group_index:5,level:"B1"},{i:43,start:403.798,end:412.837,es:"¿Qué conclusión sacaste de la película?",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"A2"},{i:44,start:412.837,end:421.875,es:"No saques conclusiones tan rápido.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:45,start:421.875,end:433.864,es:"Después de la reunión, sacamos varias conclusiones.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:46,start:433.864,end:441.882,es:"Ese ruido me saca de quicio.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:47,start:441.882,end:451.837,es:"Mi hermano me saca de quicio cuando no escucha.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:48,start:451.837,end:461.375,es:"No dejes que el tráfico te saque de quicio.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:49,start:461.375,end:471.691,es:"Es mejor esperar antes de sacar conclusiones.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:50,start:471.691,end:481.048,es:"Me sacó de quicio que llegara tan tarde.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:51,start:482.548,end:493.479,es:"Mis padres trabajaron mucho para sacarnos adelante.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:52,start:493.479,end:502.623,es:"Hay que sacar provecho de las vacaciones.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:53,start:502.623,end:511.673,es:"No sé de dónde sacas tanta energía.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:54,start:511.673,end:520.84,es:"Siempre saca tiempo para su familia.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:55,start:520.84,end:528.822,es:"¿Quién sacó el tema del dinero?",group:"expresiones con sacar",group_index:7,level:"B1"},{i:56,start:528.822,end:536.862,es:"No me saques de mis casillas.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:57,start:536.862,end:548.386,es:"Ella sacó una idea genial de un libro viejo.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:58,start:548.386,end:559.038,es:"Siempre sabe sacar lo mejor de cada situación.",group:"expresiones con sacar",group_index:7,level:"B1"}],Ui={word:Di,slug:Yi,kind:Vi,hash:Oi,duration:Ii,voice:Fi,marks:Ri},Gi="saludos y despedidas",Ki="saludos_y_despedidas",Xi="concept",Ji="a284f3262e7d5a59",Wi=481.392,Zi="mx",et=[{i:0,start:.5,end:7.635,es:"Hola, ¿qué tal?",group:"saludar",group_index:0,level:"A1"},{i:1,start:7.635,end:15.234,es:"Buenas, ¿cómo estás?",group:"saludar",group_index:0,level:"A1"},{i:2,start:15.234,end:21.074,es:"¿Cómo te va?",group:"saludar",group_index:0,level:"A1"},{i:3,start:21.074,end:28.569,es:"Hola, ¿cómo andas?",group:"saludar",group_index:0,level:"A1"},{i:4,start:28.569,end:34.232,es:"¿Todo bien?",group:"saludar",group_index:0,level:"A1"},{i:5,start:34.232,end:40.101,es:"¿Qué cuentas?",group:"saludar",group_index:0,level:"A1"},{i:6,start:40.101,end:46.4,es:"¿Qué hay de nuevo?",group:"saludar",group_index:0,level:"A1"},{i:7,start:46.4,end:54.325,es:"¡Hola, cuánto tiempo!",group:"saludar",group_index:0,level:"A2"},{i:8,start:54.325,end:60.879,es:"¡Qué gusto verte!",group:"saludar",group_index:0,level:"A2"},{i:9,start:62.379,end:69.536,es:"Muy bien, gracias.",group:"responder",group_index:1,level:"A1"},{i:10,start:69.536,end:76.207,es:"Aquí, tranquilo.",group:"responder",group_index:1,level:"A1"},{i:11,start:76.207,end:84.201,es:"Más o menos, la verdad.",group:"responder",group_index:1,level:"A1"},{i:12,start:84.201,end:93.622,es:"Bastante bien, un poco cansado.",group:"responder",group_index:1,level:"A1"},{i:13,start:93.622,end:102.011,es:"Nada nuevo, lo de siempre.",group:"responder",group_index:1,level:"A2"},{i:14,start:102.011,end:107.866,es:"Ahí vamos.",group:"responder",group_index:1,level:"A2"},{i:15,start:109.366,end:115.967,es:"Bien, ¿y tú?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:16,start:115.967,end:124.626,es:"Todo tranquilo, ¿y tú qué tal?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:17,start:124.626,end:133.477,es:"Muy bien, ¿y a ti cómo te va?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:18,start:133.477,end:143.073,es:"Bien, gracias, ¿y tú cómo estás?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:19,start:143.073,end:152.53,es:"Pues aquí, trabajando, ¿y tú?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:20,start:152.53,end:163.043,es:"Aquí, como siempre, ¿y tú qué cuentas?",group:"devolver la pregunta",group_index:2,level:"A2"},{i:21,start:164.543,end:170.54,es:"Hasta luego.",group:"decir adiós",group_index:3,level:"A1"},{i:22,start:170.54,end:176.375,es:"Nos vemos.",group:"decir adiós",group_index:3,level:"A1"},{i:23,start:176.375,end:183.21,es:"Nos vemos mañana.",group:"decir adiós",group_index:3,level:"A1"},{i:24,start:183.21,end:190.266,es:"Nos vemos otro día.",group:"decir adiós",group_index:3,level:"A1"},{i:25,start:190.266,end:196.746,es:"Hablamos luego.",group:"decir adiós",group_index:3,level:"A1"},{i:26,start:196.746,end:202.766,es:"Hasta pronto.",group:"decir adiós",group_index:3,level:"A1"},{i:27,start:202.766,end:209.251,es:"Te escribo luego.",group:"decir adiós",group_index:3,level:"A1"},{i:28,start:210.751,end:216.759,es:"Igualmente.",group:"responder a una despedida",group_index:4,level:"A1"},{i:29,start:216.759,end:224.436,es:"Tú también, cuídate.",group:"responder a una despedida",group_index:4,level:"A1"},{i:30,start:224.436,end:231.593,es:"De acuerdo, nos vemos.",group:"responder a una despedida",group_index:4,level:"A1"},{i:31,start:231.593,end:239.576,es:"Gracias, lo mismo digo.",group:"responder a una despedida",group_index:4,level:"A2"},{i:32,start:239.576,end:246.545,es:"El gusto fue mío.",group:"responder a una despedida",group_index:4,level:"A2"},{i:33,start:246.545,end:255.548,es:"Gracias, yo les doy tus saludos.",group:"responder a una despedida",group_index:4,level:"A2"},{i:34,start:255.548,end:263.936,es:"Hasta luego, que estés bien.",group:"responder a una despedida",group_index:4,level:"A2"},{i:35,start:265.436,end:270.98,es:"¡Qué bien!",group:"reaccionar a la respuesta",group_index:5,level:"A1"},{i:36,start:270.98,end:277.813,es:"Ay, qué pena.",group:"reaccionar a la respuesta",group_index:5,level:"A1"},{i:37,start:277.813,end:287.081,es:"Te entiendo, yo también estoy cansado.",group:"reaccionar a la respuesta",group_index:5,level:"A1"},{i:38,start:287.081,end:293.537,es:"Me alegro mucho.",group:"reaccionar a la respuesta",group_index:5,level:"A2"},{i:39,start:293.537,end:301.588,es:"Me alegro de que te vaya bien.",group:"reaccionar a la respuesta",group_index:5,level:"B1"},{i:40,start:301.588,end:309.397,es:"Espero que todo siga bien.",group:"reaccionar a la respuesta",group_index:5,level:"B1"},{i:41,start:310.897,end:317.579,es:"¿Qué tal tu día?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:42,start:317.579,end:324.318,es:"¿Qué tal el trabajo?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:43,start:324.318,end:331.349,es:"¿Qué tal la familia?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:44,start:331.349,end:338.669,es:"¿Cómo va todo en casa?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:45,start:338.669,end:345.479,es:"¿Cómo va la semana?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:46,start:345.479,end:353.566,es:"¿Cómo te fue el fin de semana?",group:"preguntar cómo va todo",group_index:6,level:"A2"},{i:47,start:353.566,end:361.002,es:"¿Qué has hecho estos días?",group:"preguntar cómo va todo",group_index:6,level:"A2"},{i:48,start:361.002,end:367.683,es:"¿Cómo has estado?",group:"preguntar cómo va todo",group_index:6,level:"A2"},{i:49,start:369.183,end:375.528,es:"Bueno, te dejo.",group:"avisar que te vas",group_index:7,level:"A2"},{i:50,start:375.528,end:381.92,es:"Me tengo que ir.",group:"avisar que te vas",group_index:7,level:"A2"},{i:51,start:381.92,end:389.925,es:"Ya me voy, que es tarde.",group:"avisar que te vas",group_index:7,level:"A2"},{i:52,start:389.925,end:397.292,es:"Bueno, me voy yendo.",group:"avisar que te vas",group_index:7,level:"A2"},{i:53,start:397.292,end:404.055,es:"Bueno, me despido.",group:"avisar que te vas",group_index:7,level:"A2"},{i:54,start:404.055,end:414.011,es:"Te dejo, que seguro tienes cosas que hacer.",group:"avisar que te vas",group_index:7,level:"A2"},{i:55,start:414.011,end:422.411,es:"Bueno, no te quito más tiempo.",group:"avisar que te vas",group_index:7,level:"B1"},{i:56,start:423.911,end:430.199,es:"Cuídate mucho.",group:"buenos deseos",group_index:8,level:"A1"},{i:57,start:430.199,end:437.194,es:"Buen fin de semana.",group:"buenos deseos",group_index:8,level:"A1"},{i:58,start:437.194,end:443.772,es:"Que te vaya bien.",group:"buenos deseos",group_index:8,level:"A2"},{i:59,start:443.772,end:450.779,es:"Que tengas buen día.",group:"buenos deseos",group_index:8,level:"A2"},{i:60,start:450.779,end:458.18,es:"Saludos a tu familia.",group:"buenos deseos",group_index:8,level:"A2"},{i:61,start:458.18,end:465.222,es:"Fue un gusto verte.",group:"buenos deseos",group_index:8,level:"A2"},{i:62,start:465.222,end:473.332,es:"Que tengas una buena semana.",group:"buenos deseos",group_index:8,level:"A2"},{i:63,start:473.332,end:481.338,es:"Que disfrutes el resto del día.",group:"buenos deseos",group_index:8,level:"B1"}],at={word:Gi,slug:Ki,kind:Xi,hash:Ji,duration:Wi,voice:Zi,marks:et},ot="se",rt="se",st="word",nt="b20ea210b0adff0b",lt=509.928,it="mx",tt=[{i:0,start:.5,end:9.132,es:"Mi hermano se ducha por la mañana.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:1,start:9.132,end:17.959,es:"Ella se levanta a las siete.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:2,start:17.959,end:26.034,es:"Mi abuela se acuesta temprano.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:3,start:26.034,end:33.261,es:"¿Cómo se llama tu perro?",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:4,start:33.261,end:40.925,es:"El niño se lava las manos.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:5,start:40.925,end:49.836,es:"Mi padre se afeita todos los días.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:6,start:49.836,end:58.388,es:"Se pone el abrigo y sale.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:7,start:58.388,end:66.039,es:"Los niños se visten solos.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:8,start:66.039,end:75.124,es:"Mi madre se peina antes de salir.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:9,start:76.624,end:84.42,es:"Mi jefe se va a las cinco.",group:"se va, se queda",group_index:1,level:"A1"},{i:10,start:84.42,end:91.485,es:"Hoy se queda en casa.",group:"se va, se queda",group_index:1,level:"A1"},{i:11,start:91.485,end:99.467,es:"Se sienta junto a la ventana.",group:"se va, se queda",group_index:1,level:"A1"},{i:12,start:99.467,end:107.74,es:"Mi hijo se enoja fácilmente.",group:"se va, se queda",group_index:1,level:"A1"},{i:13,start:107.74,end:116.732,es:"Se preocupa mucho por su familia.",group:"se va, se queda",group_index:1,level:"A1"},{i:14,start:116.732,end:125.073,es:"Mi amigo se casa en junio.",group:"se va, se queda",group_index:1,level:"A1"},{i:15,start:125.073,end:132.951,es:"Ana se fue sin decir nada.",group:"se va, se queda",group_index:1,level:"A2"},{i:16,start:132.951,end:140.957,es:"Se quedaron en un hotel pequeño.",group:"se va, se queda",group_index:1,level:"A2"},{i:17,start:140.957,end:148.811,es:"Se acordó de mi cumpleaños.",group:"se va, se queda",group_index:1,level:"A2"},{i:18,start:150.311,end:158.015,es:"Mis padres se quieren mucho.",group:"se quieren",group_index:2,level:"A1"},{i:19,start:158.015,end:166.09,es:"Se conocieron en la universidad.",group:"se quieren",group_index:2,level:"A2"},{i:20,start:166.09,end:173.56,es:"Los vecinos no se hablan.",group:"se quieren",group_index:2,level:"A2"},{i:21,start:173.56,end:182.621,es:"Se escriben todas las semanas.",group:"se quieren",group_index:2,level:"A2"},{i:22,start:182.621,end:190.523,es:"Se abrazaron en el aeropuerto.",group:"se quieren",group_index:2,level:"A2"},{i:23,start:190.523,end:200.084,es:"Ana y Luis se ven todos los días.",group:"se quieren",group_index:2,level:"A2"},{i:24,start:200.084,end:208.695,es:"Los dos hermanos se parecen mucho.",group:"se quieren",group_index:2,level:"A2"},{i:25,start:208.695,end:217.362,es:"Se ayudan con las tareas de la casa.",group:"se quieren",group_index:2,level:"A2"},{i:26,start:218.862,end:225.602,es:"Aquí se vive bien.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:27,start:225.602,end:234.594,es:"Se come muy bien en este restaurante.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:28,start:234.594,end:242.615,es:"¿Cómo se dice esto en español?",group:"se vive bien aquí",group_index:3,level:"A2"},{i:29,start:242.615,end:251.096,es:"En esta tienda se habla español.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:30,start:251.096,end:258.429,es:"No se puede fumar aquí.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:31,start:258.429,end:265.834,es:"¿Por dónde se va al centro?",group:"se vive bien aquí",group_index:3,level:"A2"},{i:32,start:265.834,end:274.582,es:"Se trabaja mucho en esta empresa.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:33,start:274.582,end:282.239,es:"Desde aquí se ve el mar.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:34,start:282.239,end:289.955,es:"¿Cómo se escribe tu nombre?",group:"se vive bien aquí",group_index:3,level:"A2"},{i:35,start:291.455,end:299.449,es:"En esta calle se venden casas.",group:"se venden casas",group_index:4,level:"A2"},{i:36,start:299.449,end:309.973,es:"Se alquila un apartamento cerca del parque.",group:"se venden casas",group_index:4,level:"A2"},{i:37,start:309.973,end:318.408,es:"Se necesita ayuda en la cocina.",group:"se venden casas",group_index:4,level:"A2"},{i:38,start:318.408,end:326.785,es:"Aquí se arreglan computadoras.",group:"se venden casas",group_index:4,level:"A2"},{i:39,start:326.785,end:334.524,es:"Aquí se aceptan tarjetas.",group:"se venden casas",group_index:4,level:"A2"},{i:40,start:334.524,end:342.913,es:"Se vendieron todas las entradas.",group:"se venden casas",group_index:4,level:"A2"},{i:41,start:342.913,end:351.231,es:"Este plato se prepara con arroz.",group:"se venden casas",group_index:4,level:"A2"},{i:42,start:351.231,end:360.642,es:"Se construyó un puente nuevo el año pasado.",group:"se venden casas",group_index:4,level:"A2"},{i:43,start:362.142,end:368.777,es:"Se lo doy mañana.",group:"se lo, se la",group_index:5,level:"A2"},{i:44,start:368.777,end:377.688,es:"¿El libro? Se lo presté a Marta.",group:"se lo, se la",group_index:5,level:"A2"},{i:45,start:377.688,end:384.173,es:"Se lo dije ayer.",group:"se lo, se la",group_index:5,level:"A2"},{i:46,start:384.173,end:393.137,es:"¿Le diste la carta? Sí, se la di.",group:"se lo, se la",group_index:5,level:"A2"},{i:47,start:393.137,end:404.962,es:"Mi hijo quería un perro y se lo compramos.",group:"se lo, se la",group_index:5,level:"A2"},{i:48,start:404.962,end:415.963,es:"Si tienes la foto, mándasela a tu madre.",group:"se lo, se la",group_index:5,level:"A2"},{i:49,start:415.963,end:425.315,es:"Se lo explico otra vez, señora.",group:"se lo, se la",group_index:5,level:"A2"},{i:50,start:425.315,end:433.529,es:"Se los regalé a mis sobrinos.",group:"se lo, se la",group_index:5,level:"A2"},{i:51,start:433.529,end:440.943,es:"No se lo digas a nadie.",group:"se lo, se la",group_index:5,level:"B1"},{i:52,start:442.443,end:449.601,es:"Se me olvidó tu nombre.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:53,start:449.601,end:456.538,es:"Se le cayó el vaso.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:54,start:456.538,end:463.626,es:"Se nos acabó la leche.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:55,start:463.626,end:471.121,es:"Se me rompió el teléfono.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:56,start:471.121,end:478.616,es:"Se te olvidaron las llaves.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:57,start:478.616,end:488.293,es:"Se le perdió la tarjeta en el autobús.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:58,start:488.293,end:495.184,es:"Se me quemó el arroz.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:59,start:495.184,end:501.843,es:"Se nos hizo tarde.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:60,start:501.843,end:509.871,es:"Al niño se le cayó un diente.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"}],ut={word:ot,slug:rt,kind:st,hash:nt,duration:lt,voice:it,marks:tt},dt="seguir",pt="seguir",gt="word",ct="4b956f239e9e22c0",vt=494.28,mt="mx",xt=[{i:0,start:.5,end:7.902,es:"Sígueme, por favor.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:1,start:7.902,end:16.302,es:"El perro me sigue a todas partes.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:2,start:16.302,end:24.969,es:"Sigue esta calle hasta el final.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:3,start:24.969,end:31.435,es:"¿Por qué me sigues?",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:4,start:31.435,end:39.324,es:"Seguimos al guía por el museo.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:5,start:39.324,end:47.476,es:"Los patitos siguen a su madre.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:6,start:47.476,end:56.26,es:"Siga a ese taxi, por favor.",group:"seguir, ir detrás",group_index:0,level:"A2"},{i:7,start:56.26,end:64.95,es:"Alguien nos sigue desde hace un rato.",group:"seguir, ir detrás",group_index:0,level:"A2"},{i:8,start:66.45,end:72.076,es:"¿Seguimos?",group:"seguir, continuar",group_index:1,level:"A1"},{i:9,start:72.076,end:80.905,es:"Sigue, por favor, te escucho.",group:"seguir, continuar",group_index:1,level:"A1"},{i:10,start:80.905,end:90.058,es:"La película sigue después de los anuncios.",group:"seguir, continuar",group_index:1,level:"A1"},{i:11,start:90.058,end:98.725,es:"Si quieres, seguimos mañana.",group:"seguir, continuar",group_index:1,level:"A1"},{i:12,start:98.725,end:106.51,es:"El camino sigue por el bosque.",group:"seguir, continuar",group_index:1,level:"A1"},{i:13,start:106.51,end:115.615,es:"La reunión sigue hasta las cinco.",group:"seguir, continuar",group_index:1,level:"A1"},{i:14,start:115.615,end:123.621,es:"Seguimos con la lección de ayer.",group:"seguir, continuar",group_index:1,level:"A1"},{i:15,start:125.121,end:131.396,es:"Sigue lloviendo.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:16,start:131.396,end:140.064,es:"Sigo trabajando en el mismo lugar.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:17,start:140.064,end:147.802,es:"¿Sigues viviendo en el centro?",group:"sigue lloviendo",group_index:2,level:"A2"},{i:18,start:147.802,end:158.268,es:"Mi abuelo sigue manejando a los noventa años.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:19,start:158.268,end:166.146,es:"Seguimos esperando el autobús.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:20,start:166.146,end:173.862,es:"Los niños siguen durmiendo.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:21,start:173.862,end:183.923,es:"Ella siguió hablando toda la noche.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:22,start:183.923,end:194.006,es:"Sigue intentándolo, ya casi lo tienes.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:23,start:194.006,end:204.067,es:"A pesar del frío, seguimos caminando.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:24,start:205.567,end:213.178,es:"Mi hermana sigue enferma.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:25,start:213.178,end:219.151,es:"¿Sigues aquí?",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:26,start:219.151,end:226.495,es:"La tienda sigue cerrada.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:27,start:226.495,end:234.091,es:"El café sigue caliente.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:28,start:234.091,end:241.493,es:"Seguimos en el aeropuerto.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:29,start:241.493,end:252.123,es:"Mis padres siguen casados después de cuarenta años.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:30,start:252.123,end:259.118,es:"Sigo muy cansado.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:31,start:259.118,end:266.288,es:"¿Sigue abierto el banco?",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:32,start:266.288,end:274.27,es:"El problema sigue igual.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:33,start:275.77,end:283.16,es:"Sigue las instrucciones.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:34,start:283.16,end:291.444,es:"Seguí tu consejo y funcionó.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:35,start:291.444,end:298.881,es:"Hay que seguir las reglas.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:36,start:298.881,end:306.77,es:"No seguiste la receta, ¿verdad?",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:37,start:306.77,end:316.238,es:"Siempre sigo los consejos de mi madre.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:38,start:316.238,end:325.974,es:"Sigue el mapa y no te vas a perder.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:39,start:325.974,end:335.593,es:"Seguimos las señales hasta la salida.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:40,start:335.593,end:346.513,es:"El médico me dijo que siguiera una dieta.",group:"seguir instrucciones y consejos",group_index:4,level:"B1"},{i:41,start:348.013,end:354.787,es:"Sigo sin entender.",group:"seguir sin",group_index:5,level:"B1"},{i:42,start:354.787,end:362.526,es:"Seguimos sin noticias de él.",group:"seguir sin",group_index:5,level:"B1"},{i:43,start:362.526,end:371.457,es:"El vecino sigue sin pagar el alquiler.",group:"seguir sin",group_index:5,level:"B1"},{i:44,start:371.457,end:379.822,es:"Sigo sin encontrar mis llaves.",group:"seguir sin",group_index:5,level:"B1"},{i:45,start:379.822,end:392.147,es:"Llevo una hora en la cama y sigo sin poder dormir.",group:"seguir sin",group_index:5,level:"B1"},{i:46,start:392.147,end:400.663,es:"La computadora sigue sin funcionar.",group:"seguir sin",group_index:5,level:"B1"},{i:47,start:400.663,end:408.994,es:"Siguen sin contestar el teléfono.",group:"seguir sin",group_index:5,level:"B1"},{i:48,start:408.994,end:417.185,es:"Mi hijo sigue sin saber nadar.",group:"seguir sin",group_index:5,level:"B1"},{i:49,start:418.685,end:425.831,es:"Espero que sigas bien.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:50,start:425.831,end:434.255,es:"Ojalá siga haciendo buen tiempo.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:51,start:434.255,end:443.352,es:"Si sigues así, vas a llegar lejos.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:52,start:443.352,end:451.044,es:"¡Que siga la fiesta!",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:53,start:451.044,end:459.676,es:"No creo que siga lloviendo mañana.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:54,start:459.676,end:469.284,es:"Seguiría estudiando si tuviera más tiempo.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:55,start:469.284,end:479.112,es:"Sigue así, lo estás haciendo muy bien.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:56,start:479.112,end:486.166,es:"¿Cómo sigue tu madre?",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:57,start:486.166,end:494.217,es:"Me pidió que siguiera adelante.",group:"sigue así, que sigas bien",group_index:6,level:"B1"}],_t={word:dt,slug:pt,kind:gt,hash:ct,duration:vt,voice:mt,marks:xt},At="soler",ht="soler",bt="word",ft="6e6413345b4f6f47",qt=553.032,yt="mx",jt=[{i:0,start:.5,end:8.436,es:"Suelo desayunar a las siete.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:1,start:8.436,end:17.149,es:"Mi padre suele leer el periódico.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:2,start:17.149,end:24.737,es:"Solemos comer en casa.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:3,start:24.737,end:33.277,es:"Ella suele llegar temprano.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:4,start:33.277,end:41.154,es:"Suelo caminar al trabajo.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:5,start:41.154,end:49.784,es:"Los niños suelen dormir la siesta.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:6,start:49.784,end:58.417,es:"Mis abuelos suelen cenar temprano.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:7,start:58.417,end:66.631,es:"Suelo beber agua con la comida.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:8,start:66.631,end:75.494,es:"Los sábados solemos ir al mercado.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:9,start:76.994,end:84.64,es:"¿Sueles cocinar en casa?",group:"preguntas",group_index:1,level:"A1"},{i:10,start:84.64,end:93.06,es:"¿A qué hora sueles levantarte?",group:"preguntas",group_index:1,level:"A1"},{i:11,start:93.06,end:100.868,es:"¿Dónde suelen comer ustedes?",group:"preguntas",group_index:1,level:"A1"},{i:12,start:100.868,end:108.932,es:"¿Qué sueles hacer los domingos?",group:"preguntas",group_index:1,level:"A1"},{i:13,start:108.932,end:116.577,es:"¿Sueles viajar en verano?",group:"preguntas",group_index:1,level:"A1"},{i:14,start:116.577,end:124.281,es:"¿Cómo sueles ir al trabajo?",group:"preguntas",group_index:1,level:"A1"},{i:15,start:124.281,end:134.143,es:"¿Tu hermana suele llamar los fines de semana?",group:"preguntas",group_index:1,level:"A1"},{i:16,start:134.143,end:142.183,es:"¿Qué suele cenar tu familia?",group:"preguntas",group_index:1,level:"A1"},{i:17,start:143.683,end:151.387,es:"No suelo ver la televisión.",group:"no suelo",group_index:2,level:"A2"},{i:18,start:151.387,end:160.37,es:"Mi madre no suele cocinar los lunes.",group:"no suelo",group_index:2,level:"A2"},{i:19,start:160.37,end:168.109,es:"No solemos salir de noche.",group:"no suelo",group_index:2,level:"A2"},{i:20,start:168.109,end:175.824,es:"Él no suele llegar tarde.",group:"no suelo",group_index:2,level:"A2"},{i:21,start:175.824,end:183.655,es:"No suelo comer carne roja.",group:"no suelo",group_index:2,level:"A2"},{i:22,start:183.655,end:193.158,es:"Los domingos no suelen abrir las tiendas.",group:"no suelo",group_index:2,level:"A2"},{i:23,start:193.158,end:201.674,es:"No suelo dormir bien en los aviones.",group:"no suelo",group_index:2,level:"A2"},{i:24,start:201.674,end:212.953,es:"Mis amigos no suelen contestar los mensajes rápido.",group:"no suelo",group_index:2,level:"A2"},{i:25,start:214.453,end:223.303,es:"En agosto suele hacer mucho calor.",group:"lo normal",group_index:3,level:"A2"},{i:26,start:223.303,end:232.237,es:"En esta ciudad suele llover en abril.",group:"lo normal",group_index:3,level:"A2"},{i:27,start:232.237,end:240.196,es:"El tren suele llegar puntual.",group:"lo normal",group_index:3,level:"A2"},{i:28,start:240.196,end:249.131,es:"Los lunes suele haber mucho tráfico.",group:"lo normal",group_index:3,level:"A2"},{i:29,start:249.131,end:257.798,es:"Este restaurante suele estar lleno.",group:"lo normal",group_index:3,level:"A2"},{i:30,start:257.798,end:266.593,es:"La primera clase suele ser fácil.",group:"lo normal",group_index:3,level:"A2"},{i:31,start:266.593,end:275.829,es:"En invierno suele nevar en las montañas.",group:"lo normal",group_index:3,level:"A2"},{i:32,start:275.829,end:285.669,es:"Las entradas del museo suelen costar poco.",group:"lo normal",group_index:3,level:"A2"},{i:33,start:287.169,end:297.16,es:"De niño, solía jugar en la calle.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:34,start:297.16,end:307.232,es:"Mi abuela solía hacer pan los domingos.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:35,start:307.232,end:316.817,es:"Solíamos ir a la playa en verano.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:36,start:316.817,end:325.67,es:"¿Qué solías hacer después de clase?",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:37,start:325.67,end:334.012,es:"Mi padre solía fumar mucho.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:38,start:334.012,end:344.441,es:"En la universidad, solía estudiar de noche.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:39,start:344.441,end:353.607,es:"Mis primos solían visitarnos en Navidad.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:40,start:353.607,end:362.762,es:"Solía tomar el autobús a las siete.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:41,start:362.762,end:372.486,es:"Ella solía escribir cartas a mano.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:42,start:373.986,end:384.43,es:"Antes solía correr, pero ahora prefiero nadar.",group:"antes y ahora",group_index:5,level:"A2"},{i:43,start:384.43,end:395.303,es:"Solía tomar tres cafés al día, pero ya no.",group:"antes y ahora",group_index:5,level:"A2"},{i:44,start:395.303,end:408.196,es:"Antes solíamos cenar juntos, pero ahora cada uno come a su hora.",group:"antes y ahora",group_index:5,level:"B1"},{i:45,start:408.196,end:420.01,es:"Antes no solía leer, y ahora leo todas las noches.",group:"antes y ahora",group_index:5,level:"B1"},{i:46,start:420.01,end:434.099,es:"Mi hermano solía ser muy tímido, pero ha cambiado mucho.",group:"antes y ahora",group_index:5,level:"B1"},{i:47,start:434.099,end:447.259,es:"Antes solíamos escribirnos cartas, y hoy todo es por mensaje.",group:"antes y ahora",group_index:5,level:"B1"},{i:48,start:447.259,end:460.582,es:"Este barrio solía ser tranquilo, pero ahora hay mucho ruido.",group:"antes y ahora",group_index:5,level:"B1"},{i:49,start:460.582,end:470.143,es:"Ya no suelo acostarme tarde como antes.",group:"antes y ahora",group_index:5,level:"B1"},{i:50,start:471.643,end:481.657,es:"Eso no suele pasar en un lugar tan tranquilo.",group:"no suele pasar",group_index:6,level:"B1"},{i:51,start:481.657,end:491.625,es:"Como suele pasar, el vuelo salió tarde.",group:"no suele pasar",group_index:6,level:"B1"},{i:52,start:491.625,end:502.759,es:"Como solía decir mi abuelo, el tiempo es oro.",group:"no suele pasar",group_index:6,level:"B1"},{i:53,start:502.759,end:511.786,es:"Esto no suele ocurrir en esta empresa.",group:"no suele pasar",group_index:6,level:"B1"},{i:54,start:511.786,end:523.182,es:"Lo que suele pasar es que nadie lee las instrucciones.",group:"no suele pasar",group_index:6,level:"B1"},{i:55,start:523.182,end:532.487,es:"Los problemas suelen resolverse hablando.",group:"no suele pasar",group_index:6,level:"B1"},{i:56,start:532.487,end:542.018,es:"Es raro, porque él no suele equivocarse.",group:"no suele pasar",group_index:6,level:"B1"},{i:57,start:542.018,end:552.973,es:"Como se suele decir, más vale tarde que nunca.",group:"no suele pasar",group_index:6,level:"B1"}],Bt={word:At,slug:ht,kind:bt,hash:ft,duration:qt,voice:yt,marks:jt},zt="tener",Mt="tener",Et="word",kt="1bbab974eb88c6a6",$t=539.712,wt="mx",Nt=[{i:0,start:.5,end:7.321,es:"Tengo dos hermanos.",group:"tener, poseer",group_index:0,level:"A1"},{i:1,start:7.321,end:14.34,es:"¿Tienes un bolígrafo?",group:"tener, poseer",group_index:0,level:"A1"},{i:2,start:14.34,end:23.437,es:"Mi abuela tiene un gato negro.",group:"tener, poseer",group_index:0,level:"A1"},{i:3,start:23.437,end:30.061,es:"No tenemos auto.",group:"tener, poseer",group_index:0,level:"A1"},{i:4,start:30.061,end:38.914,es:"Esta casa tiene tres habitaciones.",group:"tener, poseer",group_index:0,level:"A1"},{i:5,start:38.914,end:46.873,es:"¿Tiene usted una mesa para dos?",group:"tener, poseer",group_index:0,level:"A1"},{i:6,start:46.873,end:55.377,es:"Ellos tienen una tienda en el centro.",group:"tener, poseer",group_index:0,level:"A1"},{i:7,start:55.377,end:62.303,es:"Hoy no tengo tiempo.",group:"tener, poseer",group_index:0,level:"A1"},{i:8,start:62.303,end:70.808,es:"Mi hermana tiene el pelo largo.",group:"tener, poseer",group_index:0,level:"A1"},{i:9,start:72.308,end:80.615,es:"Aquí tienes las llaves.",group:"aquí tienes",group_index:1,level:"A1"},{i:10,start:80.615,end:89.689,es:"Aquí tiene su café, señora.",group:"aquí tienes",group_index:1,level:"A1"},{i:11,start:89.689,end:96.58,es:"Aquí tienen el menú.",group:"aquí tienes",group_index:1,level:"A1"},{i:12,start:96.58,end:103.912,es:"Aquí tienes tu cambio.",group:"aquí tienes",group_index:1,level:"A1"},{i:13,start:105.412,end:112.477,es:"Tengo treinta años.",group:"tener años",group_index:2,level:"A1"},{i:14,start:112.477,end:119.507,es:"¿Cuántos años tienes?",group:"tener años",group_index:2,level:"A1"},{i:15,start:119.507,end:127.722,es:"Mi hijo tiene cinco años.",group:"tener años",group_index:2,level:"A1"},{i:16,start:127.722,end:136.284,es:"Mi abuelo tiene noventa años.",group:"tener años",group_index:2,level:"A1"},{i:17,start:136.284,end:144.417,es:"El perro ya tiene diez años.",group:"tener años",group_index:2,level:"A1"},{i:18,start:144.417,end:155.326,es:"Cuando tenía veinte años, vivía en Lima.",group:"tener años",group_index:2,level:"A2"},{i:19,start:156.826,end:164.158,es:"Tengo mucha hambre.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:20,start:164.158,end:170.08,es:"¿Tienes sed?",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:21,start:170.08,end:177.385,es:"Los niños tienen frío.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:22,start:177.385,end:185.612,es:"En verano siempre tengo calor.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:23,start:185.612,end:194.337,es:"Tengo sueño, me voy a dormir.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:24,start:194.337,end:202.725,es:"Mi hija tiene miedo de los perros.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:25,start:202.725,end:210.18,es:"Lo siento, tengo prisa.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:26,start:210.18,end:217.651,es:"¿No tienen hambre todavía?",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:27,start:217.651,end:225.378,es:"Anoche tuve mucho miedo.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A2"},{i:28,start:226.878,end:234.779,es:"Tengo que trabajar mañana.",group:"tener que",group_index:4,level:"A1"},{i:29,start:234.779,end:241.691,es:"Tienes que descansar.",group:"tener que",group_index:4,level:"A1"},{i:30,start:241.691,end:249.058,es:"Tenemos que comprar pan.",group:"tener que",group_index:4,level:"A1"},{i:31,start:249.058,end:256.634,es:"¿A qué hora tienes que salir?",group:"tener que",group_index:4,level:"A1"},{i:32,start:256.634,end:264.7,es:"Los niños tienen que estudiar.",group:"tener que",group_index:4,level:"A1"},{i:33,start:264.7,end:272.938,es:"No tienes que venir si no quieres.",group:"tener que",group_index:4,level:"A1"},{i:34,start:272.938,end:281.059,es:"Ayer tuve que ir al médico.",group:"tener que",group_index:4,level:"A2"},{i:35,start:281.059,end:290.85,es:"Tuvimos que esperar dos horas en el aeropuerto.",group:"tener que",group_index:4,level:"A2"},{i:36,start:292.35,end:300.437,es:"Tengo ganas de ir a la playa.",group:"tener ganas de",group_index:5,level:"A2"},{i:37,start:300.437,end:308.57,es:"No tengo ganas de cocinar hoy.",group:"tener ganas de",group_index:5,level:"A2"},{i:38,start:308.57,end:317.011,es:"¿Tienes ganas de salir esta noche?",group:"tener ganas de",group_index:5,level:"A2"},{i:39,start:317.011,end:325.225,es:"Tengo muchas ganas de verte.",group:"tener ganas de",group_index:5,level:"A2"},{i:40,start:325.225,end:333.875,es:"Los niños tienen ganas de jugar.",group:"tener ganas de",group_index:5,level:"A2"},{i:41,start:333.875,end:342.45,es:"Hoy no tenía ganas de levantarme.",group:"tener ganas de",group_index:5,level:"A2"},{i:42,start:342.45,end:351.941,es:"Tenemos ganas de conocer tu nueva casa.",group:"tener ganas de",group_index:5,level:"A2"},{i:43,start:353.441,end:359.779,es:"Tienes razón.",group:"tener razón, tener cuidado",group_index:6,level:"A1"},{i:44,start:359.779,end:368.412,es:"Creo que mi madre tenía razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:45,start:368.412,end:375.976,es:"No siempre tienes razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:46,start:375.976,end:383.285,es:"Ten cuidado con el perro.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:47,start:383.285,end:393.133,es:"Tengan cuidado, el suelo está mojado.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:48,start:393.133,end:402.915,es:"Tienes que tener cuidado al cruzar la calle.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:49,start:402.915,end:410.828,es:"Al final, tuviste razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:50,start:412.328,end:422.655,es:"De niño tenía una bicicleta roja.",group:"tenía, tuve",group_index:7,level:"A2"},{i:51,start:422.655,end:432.402,es:"Antes no teníamos computadora en casa.",group:"tenía, tuve",group_index:7,level:"A2"},{i:52,start:432.402,end:441.348,es:"Ayer tuve una reunión muy larga.",group:"tenía, tuve",group_index:7,level:"A2"},{i:53,start:441.348,end:449.722,es:"El año pasado tuvieron un bebé.",group:"tenía, tuve",group_index:7,level:"A2"},{i:54,start:449.722,end:458.782,es:"Tuvimos un problema con el hotel.",group:"tenía, tuve",group_index:7,level:"A2"},{i:55,start:458.782,end:466.182,es:"¿Tuviste un buen viaje?",group:"tenía, tuve",group_index:7,level:"A2"},{i:56,start:466.182,end:475.639,es:"La semana pasada tuve mucho trabajo.",group:"tenía, tuve",group_index:7,level:"A2"},{i:57,start:477.139,end:484.877,es:"Eso no tiene nada que ver.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:58,start:484.877,end:493.998,es:"Su trabajo tiene que ver con la música.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:59,start:493.998,end:503.06,es:"¿Qué tiene que ver eso con nuestro problema?",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:60,start:503.06,end:511.251,es:"Espero que tengas un buen día.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:61,start:511.251,end:522.971,es:"Si tuviera más tiempo, aprendería a tocar la guitarra.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:62,start:522.971,end:530.64,es:"No creo que tengan razón.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:63,start:530.64,end:539.651,es:"Me alegra que tengas tantos amigos.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"}],St={word:zt,slug:Mt,kind:Et,hash:kt,duration:$t,voice:wt,marks:Nt},Lt="tocar",Tt="tocar",Pt="word",Ct="e3eb4bf558742e1e",Ht=517.848,Qt="mx",Dt=[{i:0,start:.5,end:9.214,es:"No toques el horno, está caliente.",group:"tocar con la mano",group_index:0,level:"A1"},{i:1,start:9.214,end:16.347,es:"¿Puedo tocar al perro?",group:"tocar con la mano",group_index:0,level:"A1"},{i:2,start:16.347,end:24.178,es:"El bebé me toca la cara.",group:"tocar con la mano",group_index:0,level:"A1"},{i:3,start:24.178,end:32.509,es:"Por favor, no toquen los cuadros.",group:"tocar con la mano",group_index:0,level:"A1"},{i:4,start:32.509,end:40.089,es:"Me gusta tocar la arena.",group:"tocar con la mano",group_index:0,level:"A1"},{i:5,start:40.089,end:50.129,es:"Toca el agua, está muy fría.",group:"tocar con la mano",group_index:0,level:"A1"},{i:6,start:50.129,end:60.387,es:"No te toques los ojos con las manos sucias.",group:"tocar con la mano",group_index:0,level:"A2"},{i:7,start:60.387,end:69.437,es:"Alguien me tocó el hombro en el autobús.",group:"tocar con la mano",group_index:0,level:"A2"},{i:8,start:69.437,end:78.383,es:"Nunca había tocado la nieve.",group:"tocar con la mano",group_index:0,level:"B1"},{i:9,start:79.883,end:88.481,es:"Mi hermana toca el piano.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:10,start:88.481,end:95.227,es:"¿Tocas la guitarra?",group:"tocar un instrumento",group_index:1,level:"A1"},{i:11,start:95.227,end:103.105,es:"Él toca muy bien el violín.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:12,start:103.105,end:112.074,es:"Quiero aprender a tocar la batería.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:13,start:112.074,end:119.928,es:"La banda toca los sábados.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:14,start:119.928,end:127.809,es:"Toca algo para nosotros.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:15,start:127.809,end:138.218,es:"De niño, tocaba la flauta en la escuela.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:16,start:138.218,end:147.164,es:"Anoche tocaron mi canción favorita.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:17,start:147.164,end:156.655,es:"Hace diez años que toco el saxofón.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:18,start:158.155,end:165.313,es:"Alguien toca la puerta.",group:"tocar la puerta, el timbre",group_index:2,level:"A1"},{i:19,start:165.313,end:173.59,es:"Toca el timbre, por favor.",group:"tocar la puerta, el timbre",group_index:2,level:"A1"},{i:20,start:173.59,end:182.513,es:"Toqué la puerta, pero nadie abrió.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:21,start:182.513,end:191.378,es:"El cartero tocó el timbre dos veces.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:22,start:191.378,end:202.685,es:"Toca el timbre otra vez, creo que no te oyeron.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:23,start:202.685,end:212.27,es:"Antes de entrar, hay que tocar la puerta.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:24,start:212.27,end:223.143,es:"Los niños tocaron el timbre y salieron corriendo.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:25,start:224.643,end:231.394,es:"Ahora te toca a ti.",group:"te toca, el turno",group_index:3,level:"A1"},{i:26,start:231.394,end:237.786,es:"¿A quién le toca?",group:"te toca, el turno",group_index:3,level:"A1"},{i:27,start:237.786,end:246.628,es:"Me toca lavar los platos hoy.",group:"te toca, el turno",group_index:3,level:"A2"},{i:28,start:246.628,end:256.618,es:"Mañana le toca cocinar a mi hermano.",group:"te toca, el turno",group_index:3,level:"A2"},{i:29,start:256.618,end:264.659,es:"Te toca elegir la película.",group:"te toca, el turno",group_index:3,level:"A2"},{i:30,start:264.659,end:271.596,es:"¿Cuándo me toca hablar?",group:"te toca, el turno",group_index:3,level:"A2"},{i:31,start:271.596,end:279.927,es:"Ayer le tocó sacar al perro.",group:"te toca, el turno",group_index:3,level:"A2"},{i:32,start:279.927,end:288.536,es:"Nos toca esperar una hora más.",group:"te toca, el turno",group_index:3,level:"A2"},{i:33,start:288.536,end:300.271,es:"La última vez pagué yo, así que hoy te toca a ti.",group:"te toca, el turno",group_index:3,level:"A2"},{i:34,start:300.271,end:309.728,es:"Al abuelo le toca ir al médico el lunes.",group:"te toca, el turno",group_index:3,level:"A2"},{i:35,start:311.228,end:318.095,es:"Me tocó la lotería.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:36,start:318.095,end:326.217,es:"Le tocó un viaje a la playa.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:37,start:326.217,end:334.989,es:"Nunca me toca nada en las rifas.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:38,start:334.989,end:344.991,es:"En el examen me tocó la pregunta más difícil.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:39,start:344.991,end:353.205,es:"Nos tocó un hotel muy bonito.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:40,start:353.205,end:360.282,es:"¿Qué te tocó en el sorteo?",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:41,start:360.282,end:369.356,es:"Me tocó un asiento al lado de la ventana.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:42,start:369.356,end:380.608,es:"A mi amiga le tocó trabajar el domingo.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:43,start:380.608,end:390.564,es:"Ojalá te toque un buen profesor este año.",group:"me tocó, el premio y la suerte",group_index:4,level:"B1"},{i:44,start:392.064,end:400.487,es:"No quiero tocar ese tema ahora.",group:"tocar un tema",group_index:5,level:"B1"},{i:45,start:400.487,end:410.819,es:"En la reunión tocamos varios temas importantes.",group:"tocar un tema",group_index:5,level:"B1"},{i:46,start:410.819,end:421.727,es:"Es mejor no tocar el tema de la política en la cena.",group:"tocar un tema",group_index:5,level:"B1"},{i:47,start:421.727,end:430.766,es:"El libro toca temas muy difíciles.",group:"tocar un tema",group_index:5,level:"B1"},{i:48,start:430.766,end:440.049,es:"¿Por qué siempre tocas temas tan tristes?",group:"tocar un tema",group_index:5,level:"B1"},{i:49,start:440.049,end:451.003,es:"Prefiero que no toques ese asunto delante de mis padres.",group:"tocar un tema",group_index:5,level:"B1"},{i:50,start:451.003,end:460.541,es:"El profesor solo tocó el tema por encima.",group:"tocar un tema",group_index:5,level:"B1"},{i:51,start:460.541,end:470.869,es:"Si tocas ese tema, se va a molestar.",group:"tocar un tema",group_index:5,level:"B1"},{i:52,start:472.369,end:481.976,es:"Nunca he estado enfermo, toco madera.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:53,start:481.976,end:490.191,es:"La película me tocó el corazón.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:54,start:490.191,end:500.495,es:"Después de tocar fondo, empezó a mejorar.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:55,start:500.495,end:509.418,es:"Sus palabras me tocaron mucho.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:56,start:509.418,end:517.795,es:"Ese problema me toca de cerca.",group:"expresiones con tocar",group_index:6,level:"B1"}],Yt={word:Lt,slug:Tt,kind:Pt,hash:Ct,duration:Ht,voice:Qt,marks:Dt},Vt="verbos reflexivos",Ot="verbos_reflexivos",It="concept",Ft="36bfabbff8efb8bb",Rt=569.664,Ut="mx",Gt=[{i:0,start:.5,end:7.915,es:"Me despierto a las siete.",group:"la rutina diaria",group_index:0,level:"A1"},{i:1,start:7.915,end:16.954,es:"Me levanto temprano todos los días.",group:"la rutina diaria",group_index:0,level:"A1"},{i:2,start:16.954,end:25.296,es:"Mi hermano se ducha por la noche.",group:"la rutina diaria",group_index:0,level:"A1"},{i:3,start:25.296,end:34.118,es:"Nos vestimos rápido por la mañana.",group:"la rutina diaria",group_index:0,level:"A1"},{i:4,start:34.118,end:42.496,es:"Los niños se acuestan a las nueve.",group:"la rutina diaria",group_index:0,level:"A1"},{i:5,start:42.496,end:49.573,es:"¿A qué hora te levantas?",group:"la rutina diaria",group_index:0,level:"A1"},{i:6,start:49.573,end:58.237,es:"Mi padre se afeita cada mañana.",group:"la rutina diaria",group_index:0,level:"A1"},{i:7,start:58.237,end:65.848,es:"Me peino antes de salir.",group:"la rutina diaria",group_index:0,level:"A1"},{i:8,start:65.848,end:74.748,es:"¿Te duchas por la mañana o por la noche?",group:"la rutina diaria",group_index:0,level:"A1"},{i:9,start:76.248,end:85.008,es:"Me lavo las manos antes de comer.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:10,start:85.008,end:94.789,es:"Ella se lava el pelo cada día.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:11,start:94.789,end:104.309,es:"Me cepillo los dientes después del desayuno.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:12,start:104.309,end:111.893,es:"El niño se lava la cara.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:13,start:111.893,end:119.854,es:"Mi madre se pinta las uñas.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:14,start:119.854,end:128.08,es:"Se pone los zapatos en la puerta.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:15,start:128.08,end:136.12,es:"Me quito el abrigo al entrar.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:16,start:136.12,end:144.416,es:"Me corto el pelo una vez al mes.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A2"},{i:17,start:145.916,end:155.024,es:"Me enojo cuando hay mucho tráfico.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:18,start:155.024,end:163.325,es:"Mi madre se preocupa por todo.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:19,start:163.325,end:171.504,es:"Nos alegramos mucho de verte.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:20,start:171.504,end:179.961,es:"Los niños se aburren en el auto.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:21,start:179.961,end:189.337,es:"Me pongo nervioso antes de un examen.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:22,start:189.337,end:198.77,es:"Ella se cansa mucho en el trabajo.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:23,start:198.77,end:206.201,es:"¿Por qué te enojas tanto?",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:24,start:206.201,end:213.87,es:"Hoy me siento mucho mejor.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:25,start:213.87,end:221.91,es:"Él se pone triste cuando llueve.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:26,start:223.41,end:232.031,es:"Levántate, ya es tarde.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:27,start:232.031,end:239.267,es:"Voy a ducharme ahora.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:28,start:239.267,end:246.982,es:"Siéntate aquí, por favor.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:29,start:246.982,end:255.766,es:"No te preocupes, todo está bien.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:30,start:255.766,end:264.178,es:"Tengo que acostarme temprano hoy.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:31,start:264.178,end:274.182,es:"Lávate las manos, la cena está lista.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:32,start:274.182,end:283.421,es:"Ponte el abrigo, hace frío.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:33,start:283.421,end:292.158,es:"Necesito relajarme un poco.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:34,start:292.158,end:300.744,es:"Cálmate, no pasa nada.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:35,start:300.744,end:309.249,es:"Acuérdate de llamarme cuando llegues.",group:"en mandatos e infinitivos",group_index:3,level:"B1"},{i:36,start:310.749,end:318.777,es:"Ayer me levanté muy tarde.",group:"en pasado",group_index:4,level:"A2"},{i:37,start:318.777,end:327.951,es:"Esta mañana me duché con agua fría.",group:"en pasado",group_index:4,level:"A2"},{i:38,start:327.951,end:337.896,es:"Cuando era niño, me acostaba a las ocho.",group:"en pasado",group_index:4,level:"A2"},{i:39,start:337.896,end:346.818,es:"Mi hermana se casó el año pasado.",group:"en pasado",group_index:4,level:"A2"},{i:40,start:346.818,end:354.58,es:"¿A qué hora te despertaste hoy?",group:"en pasado",group_index:4,level:"A2"},{i:41,start:354.58,end:364.08,es:"Los niños se divirtieron mucho en el parque.",group:"en pasado",group_index:4,level:"A2"},{i:42,start:364.08,end:371.519,es:"Me caí en la escalera.",group:"en pasado",group_index:4,level:"A2"},{i:43,start:371.519,end:382.868,es:"Antes nos levantábamos a las seis para ir al trabajo.",group:"en pasado",group_index:4,level:"A2"},{i:44,start:382.868,end:392.522,es:"Ya me había vestido cuando llegó el taxi.",group:"en pasado",group_index:4,level:"B1"},{i:45,start:394.022,end:402.84,es:"Nos conocimos en un viaje a México.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:46,start:402.84,end:410.579,es:"Mis padres se quieren mucho.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:47,start:410.579,end:421.347,es:"Mi hermano y yo nos llamamos cada semana.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:48,start:421.347,end:430.99,es:"Los dos amigos se abrazaron en el aeropuerto.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:49,start:430.99,end:440.957,es:"Ellos se escriben mensajes todos los días.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:50,start:440.957,end:451.656,es:"Ana y Luis se ayudan con las tareas de la casa.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:51,start:451.656,end:460.66,es:"Los vecinos se saludan en la escalera.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:52,start:460.66,end:469.838,es:"Es importante que nos escuchemos más.",group:"acciones recíprocas",group_index:5,level:"B1"},{i:53,start:469.838,end:479.214,es:"Ojalá se entiendan mejor con el tiempo.",group:"acciones recíprocas",group_index:5,level:"B1"},{i:54,start:480.714,end:488.011,es:"¿Cómo se llama tu perro?",group:"cambios de significado",group_index:6,level:"A1"},{i:55,start:488.011,end:496.609,es:"Ya me voy, es muy tarde.",group:"cambios de significado",group_index:6,level:"A2"},{i:56,start:496.609,end:505.929,es:"¿Por qué te fuiste tan temprano de la fiesta?",group:"cambios de significado",group_index:6,level:"A2"},{i:57,start:505.929,end:513.598,es:"El bebé se durmió en el auto.",group:"cambios de significado",group_index:6,level:"A2"},{i:58,start:513.598,end:521.928,es:"Hoy me quedo en casa porque llueve.",group:"cambios de significado",group_index:6,level:"A2"},{i:59,start:521.928,end:533.765,es:"Normalmente duermo bien, pero anoche me dormí muy tarde.",group:"cambios de significado",group_index:6,level:"B1"},{i:60,start:533.765,end:544.069,es:"Me quedé dormido y llegué tarde al trabajo.",group:"cambios de significado",group_index:6,level:"B1"},{i:61,start:544.069,end:552.992,es:"Se quedaron sin dinero al final del viaje.",group:"cambios de significado",group_index:6,level:"B1"},{i:62,start:552.992,end:562.128,es:"Me di cuenta del error demasiado tarde.",group:"cambios de significado",group_index:6,level:"B1"},{i:63,start:562.128,end:569.6,es:"No me acuerdo de su nombre.",group:"cambios de significado",group_index:6,level:"B1"}],Kt={word:Vt,slug:Ot,kind:It,hash:Ft,duration:Rt,voice:Ut,marks:Gt},Xt="vez",Jt="vez",Wt="word",Zt="e11094ac80e1206b",eu=546.84,au="mx",ou=[{i:0,start:.5,end:9.864,es:"Voy al gimnasio tres veces por semana.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:1,start:9.864,end:19.019,es:"Como pescado una vez a la semana.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:2,start:19.019,end:27.988,es:"Llamo a mi madre dos veces al día.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:3,start:27.988,end:35.935,es:"Lee la pregunta dos veces.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:4,start:35.935,end:43.987,es:"Solo lo digo una vez.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:5,start:43.987,end:53.273,es:"Tomo esta medicina tres veces al día.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:6,start:53.273,end:61.105,es:"Fui a París una vez.",group:"una vez, dos veces",group_index:0,level:"A2"},{i:7,start:62.605,end:70.459,es:"A veces trabajo en casa.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:8,start:70.459,end:77.873,es:"A veces llueve en verano.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:9,start:77.873,end:87.109,es:"Mi hermano a veces cocina para todos.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:10,start:87.109,end:95.811,es:"Muchas veces comemos juntos.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:11,start:95.811,end:103.84,es:"A veces no entiendo a mi jefe.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:12,start:103.84,end:112.693,es:"Muchas veces el tren llega tarde.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:13,start:112.693,end:121.209,es:"¿Vas mucho al cine? A veces.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:14,start:122.709,end:129.859,es:"¿Puedes decirlo otra vez?",group:"otra vez",group_index:2,level:"A1"},{i:15,start:129.859,end:136.459,es:"Otra vez llueve.",group:"otra vez",group_index:2,level:"A1"},{i:16,start:136.459,end:145.289,es:"Mañana vamos otra vez a la playa.",group:"otra vez",group_index:2,level:"A1"},{i:17,start:145.289,end:151.367,es:"¡Otra vez tú!",group:"otra vez",group_index:2,level:"A1"},{i:18,start:151.367,end:161.923,es:"El niño quiere ver la película otra vez.",group:"otra vez",group_index:2,level:"A1"},{i:19,start:161.923,end:170.555,es:"Mi teléfono otra vez no funciona.",group:"otra vez",group_index:2,level:"A1"},{i:20,start:170.555,end:178.329,es:"Perdí las llaves otra vez.",group:"otra vez",group_index:2,level:"A2"},{i:21,start:179.829,end:188.54,es:"Es la primera vez que vengo aquí.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A1"},{i:22,start:188.54,end:198.101,es:"La primera vez que la vi, no hablamos.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:23,start:198.101,end:207.07,es:"¿Cuándo fue la última vez que comiste?",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:24,start:207.07,end:218.131,es:"La última vez que fui, el museo estaba cerrado.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:25,start:218.131,end:228.087,es:"Esta es la última vez que te ayudo.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:26,start:228.087,end:238.229,es:"Recuerdo la primera vez que subí a un avión.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:27,start:238.229,end:248.011,es:"La próxima vez, llámame antes.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:28,start:249.511,end:257.655,es:"De vez en cuando como chocolate.",group:"de vez en cuando",group_index:4,level:"A2"},{i:29,start:257.655,end:266.798,es:"Mis primos nos visitan de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:30,start:266.798,end:275.976,es:"De vez en cuando me gusta caminar solo.",group:"de vez en cuando",group_index:4,level:"A2"},{i:31,start:275.976,end:284.458,es:"Vamos al teatro de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:32,start:284.458,end:293.973,es:"De vez en cuando escucho música clásica.",group:"de vez en cuando",group_index:4,level:"A2"},{i:33,start:293.973,end:302.768,es:"Es bueno descansar de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:34,start:304.268,end:310.799,es:"Tal vez mañana.",group:"tal vez",group_index:5,level:"A2"},{i:35,start:310.799,end:318.386,es:"Tal vez voy a la fiesta.",group:"tal vez",group_index:5,level:"A2"},{i:36,start:318.386,end:325.579,es:"Tal vez tienes razón.",group:"tal vez",group_index:5,level:"A2"},{i:37,start:325.579,end:333.329,es:"Tal vez está en la cocina.",group:"tal vez",group_index:5,level:"A2"},{i:38,start:333.329,end:341.3,es:"Tal vez llueva esta tarde.",group:"tal vez",group_index:5,level:"B1"},{i:39,start:341.3,end:350.188,es:"Tal vez Ana no sepa la dirección.",group:"tal vez",group_index:5,level:"B1"},{i:40,start:350.188,end:358.913,es:"Tal vez podamos vernos el sábado.",group:"tal vez",group_index:5,level:"B1"},{i:41,start:360.413,end:368.918,es:"Hoy tomo té en vez de café.",group:"en vez de",group_index:6,level:"A2"},{i:42,start:368.918,end:378.525,es:"Vamos a pie en vez de tomar un taxi.",group:"en vez de",group_index:6,level:"A2"},{i:43,start:378.525,end:388.644,es:"En vez de ver la televisión, lee un libro.",group:"en vez de",group_index:6,level:"A2"},{i:44,start:388.644,end:397.415,es:"Compré pollo en vez de carne.",group:"en vez de",group_index:6,level:"A2"},{i:45,start:397.415,end:407.023,es:"Ella fue a la reunión en vez de su jefe.",group:"en vez de",group_index:6,level:"A2"},{i:46,start:407.023,end:418.221,es:"Prefiero quedarme en casa en vez de salir esta noche.",group:"en vez de",group_index:6,level:"A2"},{i:47,start:418.221,end:428.026,es:"En vez de quejarte, ayúdame un poco.",group:"en vez de",group_index:6,level:"B1"},{i:48,start:429.526,end:437.985,es:"No puedo hacer dos cosas a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:49,start:437.985,end:445.252,es:"Todos hablaban a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:50,start:445.252,end:456.074,es:"Es una película triste y divertida a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:51,start:456.074,end:465.496,es:"Sentí miedo y alegría a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:52,start:465.496,end:474.93,es:"Mi hermana estudia y trabaja a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:53,start:474.93,end:484.41,es:"Los dos llegamos a la puerta a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:54,start:485.91,end:493.846,es:"Hace cada vez más calor.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:55,start:493.846,end:501.967,es:"Cada vez hay menos tiempo.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:56,start:501.967,end:510.611,es:"Mi español es cada vez mejor.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:57,start:510.611,end:520.451,es:"Cada vez más personas trabajan desde casa.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:58,start:520.451,end:529.571,es:"La ciudad está cada vez más cara.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:59,start:529.571,end:537.635,es:"Cada vez leo menos libros.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:60,start:537.635,end:546.786,es:"Tu hijo está cada vez más alto.",group:"cad
