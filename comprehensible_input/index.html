 cenar juntos, pero ahora cada uno come a su hora.",group:"antes y ahora",group_index:5,level:"B1"},{i:45,start:394.357,end:404.885,es:"Antes no solía leer, y ahora leo todas las noches.",group:"antes y ahora",group_index:5,level:"B1"},{i:46,start:404.885,end:415.691,es:"Mi hermano solía ser muy tímido, pero ha cambiado mucho.",group:"antes y ahora",group_index:5,level:"B1"},{i:47,start:415.691,end:427.328,es:"Antes solíamos escribirnos cartas, y hoy todo es por mensaje.",group:"antes y ahora",group_index:5,level:"B1"},{i:48,start:427.328,end:438.645,es:"Este barrio solía ser tranquilo, pero ahora hay mucho ruido.",group:"antes y ahora",group_index:5,level:"B1"},{i:49,start:438.645,end:448.085,es:"Ya no suelo acostarme tarde como antes.",group:"antes y ahora",group_index:5,level:"B1"},{i:50,start:449.585,end:459.409,es:"Eso no suele pasar en un lugar tan tranquilo.",group:"no suele pasar",group_index:6,level:"B1"},{i:51,start:459.409,end:468.423,es:"Como suele pasar, el vuelo salió tarde.",group:"no suele pasar",group_index:6,level:"B1"},{i:52,start:468.423,end:478.183,es:"Como solía decir mi abuelo, el tiempo es oro.",group:"no suele pasar",group_index:6,level:"B1"},{i:53,start:478.183,end:487.175,es:"Esto no suele ocurrir en esta empresa.",group:"no suele pasar",group_index:6,level:"B1"},{i:54,start:487.175,end:497.724,es:"Lo que suele pasar es que nadie lee las instrucciones.",group:"no suele pasar",group_index:6,level:"B1"},{i:55,start:497.724,end:507.143,es:"Los problemas suelen resolverse hablando.",group:"no suele pasar",group_index:6,level:"B1"},{i:56,start:507.143,end:516.455,es:"Es raro, porque él no suele equivocarse.",group:"no suele pasar",group_index:6,level:"B1"},{i:57,start:516.455,end:526.364,es:"Como se suele decir, más vale tarde que nunca.",group:"no suele pasar",group_index:6,level:"B1"}],ks={word:ys,slug:js,kind:Bs,hash:zs,duration:Ms,voice:Es,marks:$s},Ns="tener",ws="tener",Ls="word",Ss="2eb3b48f662c5c7e",Ts=526.248,Ps="alex",Cs=[{i:0,start:.5,end:7.508,es:"Tengo dos hermanos.",group:"tener, poseer",group_index:0,level:"A1"},{i:1,start:7.508,end:14.623,es:"¿Tienes un bolígrafo?",group:"tener, poseer",group_index:0,level:"A1"},{i:2,start:14.623,end:22.847,es:"Mi abuela tiene un gato negro.",group:"tener, poseer",group_index:0,level:"A1"},{i:3,start:22.847,end:29.556,es:"No tenemos auto.",group:"tener, poseer",group_index:0,level:"A1"},{i:4,start:29.556,end:38.42,es:"Esta casa tiene tres habitaciones.",group:"tener, poseer",group_index:0,level:"A1"},{i:5,start:38.42,end:46.772,es:"¿Tiene usted una mesa para dos?",group:"tener, poseer",group_index:0,level:"A1"},{i:6,start:46.772,end:55.167,es:"Ellos tienen una tienda en el centro.",group:"tener, poseer",group_index:0,level:"A1"},{i:7,start:55.167,end:62.217,es:"Hoy no tengo tiempo.",group:"tener, poseer",group_index:0,level:"A1"},{i:8,start:62.217,end:70.292,es:"Mi hermana tiene el pelo largo.",group:"tener, poseer",group_index:0,level:"A1"},{i:9,start:71.792,end:79.056,es:"Aquí tienes las llaves.",group:"aquí tienes",group_index:1,level:"A1"},{i:10,start:79.056,end:86.853,es:"Aquí tiene su café, señora.",group:"aquí tienes",group_index:1,level:"A1"},{i:11,start:86.853,end:93.627,es:"Aquí tienen el menú.",group:"aquí tienes",group_index:1,level:"A1"},{i:12,start:93.627,end:100.656,es:"Aquí tienes tu cambio.",group:"aquí tienes",group_index:1,level:"A1"},{i:13,start:102.156,end:109.377,es:"Tengo treinta años.",group:"tener años",group_index:2,level:"A1"},{i:14,start:109.377,end:116.471,es:"¿Cuántos años tienes?",group:"tener años",group_index:2,level:"A1"},{i:15,start:116.471,end:124.289,es:"Mi hijo tiene cinco años.",group:"tener años",group_index:2,level:"A1"},{i:16,start:124.289,end:132.577,es:"Mi abuelo tiene noventa años.",group:"tener años",group_index:2,level:"A1"},{i:17,start:132.577,end:140.695,es:"El perro ya tiene diez años.",group:"tener años",group_index:2,level:"A1"},{i:18,start:140.695,end:150.007,es:"Cuando tenía veinte años, vivía en Lima.",group:"tener años",group_index:2,level:"A2"},{i:19,start:151.507,end:158.387,es:"Tengo mucha hambre.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:20,start:158.387,end:164.264,es:"¿Tienes sed?",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:21,start:164.264,end:171.549,es:"Los niños tienen frío.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:22,start:171.549,end:179.773,es:"En verano siempre tengo calor.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:23,start:179.773,end:187.848,es:"Tengo sueño, me voy a dormir.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:24,start:187.848,end:195.923,es:"Mi hija tiene miedo de los perros.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:25,start:195.923,end:203.421,es:"Lo siento, tengo prisa.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:26,start:203.421,end:211.091,es:"¿No tienen hambre todavía?",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:27,start:211.091,end:218.76,es:"Anoche tuve mucho miedo.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A2"},{i:28,start:220.26,end:228.015,es:"Tengo que trabajar mañana.",group:"tener que",group_index:4,level:"A1"},{i:29,start:228.015,end:235.044,es:"Tienes que descansar.",group:"tener que",group_index:4,level:"A1"},{i:30,start:235.044,end:242.436,es:"Tenemos que comprar pan.",group:"tener que",group_index:4,level:"A1"},{i:31,start:242.436,end:249.977,es:"¿A qué hora tienes que salir?",group:"tener que",group_index:4,level:"A1"},{i:32,start:249.977,end:257.86,es:"Los niños tienen que estudiar.",group:"tener que",group_index:4,level:"A1"},{i:33,start:257.86,end:266.041,es:"No tienes que venir si no quieres.",group:"tener que",group_index:4,level:"A1"},{i:34,start:266.041,end:273.668,es:"Ayer tuve que ir al médico.",group:"tener que",group_index:4,level:"A2"},{i:35,start:273.668,end:283.705,es:"Tuvimos que esperar dos horas en el aeropuerto.",group:"tener que",group_index:4,level:"A2"},{i:36,start:285.205,end:293.28,es:"Tengo ganas de ir a la playa.",group:"tener ganas de",group_index:5,level:"A2"},{i:37,start:293.28,end:301.845,es:"No tengo ganas de cocinar hoy.",group:"tener ganas de",group_index:5,level:"A2"},{i:38,start:301.845,end:310.411,es:"¿Tienes ganas de salir esta noche?",group:"tener ganas de",group_index:5,level:"A2"},{i:39,start:310.411,end:318.528,es:"Tengo muchas ganas de verte.",group:"tener ganas de",group_index:5,level:"A2"},{i:40,start:318.528,end:326.944,es:"Los niños tienen ganas de jugar.",group:"tener ganas de",group_index:5,level:"A2"},{i:41,start:326.944,end:335.488,es:"Hoy no tenía ganas de levantarme.",group:"tener ganas de",group_index:5,level:"A2"},{i:42,start:335.488,end:345.056,es:"Tenemos ganas de conocer tu nueva casa.",group:"tener ganas de",group_index:5,level:"A2"},{i:43,start:346.556,end:352.732,es:"Tienes razón.",group:"tener razón, tener cuidado",group_index:6,level:"A1"},{i:44,start:352.732,end:361.105,es:"Creo que mi madre tenía razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:45,start:361.105,end:368.583,es:"No siempre tienes razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:46,start:368.583,end:375.889,es:"Ten cuidado con el perro.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:47,start:375.889,end:384.86,es:"Tengan cuidado, el suelo está mojado.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:48,start:384.86,end:394.364,es:"Tienes que tener cuidado al cruzar la calle.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:49,start:394.364,end:401.884,es:"Al final, tuviste razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:50,start:403.384,end:412.547,es:"De niño tenía una bicicleta roja.",group:"tenía, tuve",group_index:7,level:"A2"},{i:51,start:412.547,end:421.88,es:"Antes no teníamos computadora en casa.",group:"tenía, tuve",group_index:7,level:"A2"},{i:52,start:421.88,end:430.253,es:"Ayer tuve una reunión muy larga.",group:"tenía, tuve",group_index:7,level:"A2"},{i:53,start:430.253,end:438.605,es:"El año pasado tuvieron un bebé.",group:"tenía, tuve",group_index:7,level:"A2"},{i:54,start:438.605,end:447.043,es:"Tuvimos un problema con el hotel.",group:"tenía, tuve",group_index:7,level:"A2"},{i:55,start:447.043,end:454.392,es:"¿Tuviste un buen viaje?",group:"tenía, tuve",group_index:7,level:"A2"},{i:56,start:454.392,end:463.64,es:"La semana pasada tuve mucho trabajo.",group:"tenía, tuve",group_index:7,level:"A2"},{i:57,start:465.14,end:472.873,es:"Eso no tiene nada que ver.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:58,start:472.873,end:481.887,es:"Su trabajo tiene que ver con la música.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:59,start:481.887,end:491.007,es:"¿Qué tiene que ver eso con nuestro problema?",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:60,start:491.007,end:499.273,es:"Espero que tengas un buen día.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:61,start:499.273,end:509.887,es:"Si tuviera más tiempo, aprendería a tocar la guitarra.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:62,start:509.887,end:517.556,es:"No creo que tengan razón.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:63,start:517.556,end:526.185,es:"Me alegra que tengas tantos amigos.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"}],Hs={word:Ns,slug:ws,kind:Ls,hash:Ss,duration:Ts,voice:Ps,marks:Cs},Qs="tocar",Ds="tocar",Ys="word",Vs="16d327dbfe228660",Os=494.88,Is="alex",Fs=[{i:0,start:.5,end:8.98,es:"No toques el horno, está caliente.",group:"tocar con la mano",group_index:0,level:"A1"},{i:1,start:8.98,end:15.945,es:"¿Puedo tocar al perro?",group:"tocar con la mano",group_index:0,level:"A1"},{i:2,start:15.945,end:23.593,es:"El bebé me toca la cara.",group:"tocar con la mano",group_index:0,level:"A1"},{i:3,start:23.593,end:31.775,es:"Por favor, no toquen los cuadros.",group:"tocar con la mano",group_index:0,level:"A1"},{i:4,start:31.775,end:39.316,es:"Me gusta tocar la arena.",group:"tocar con la mano",group_index:0,level:"A1"},{i:5,start:39.316,end:47.455,es:"Toca el agua, está muy fría.",group:"tocar con la mano",group_index:0,level:"A1"},{i:6,start:47.455,end:56.937,es:"No te toques los ojos con las manos sucias.",group:"tocar con la mano",group_index:0,level:"A2"},{i:7,start:56.937,end:65.865,es:"Alguien me tocó el hombro en el autobús.",group:"tocar con la mano",group_index:0,level:"A2"},{i:8,start:65.865,end:73.833,es:"Nunca había tocado la nieve.",group:"tocar con la mano",group_index:0,level:"B1"},{i:9,start:75.333,end:82.789,es:"Mi hermana toca el piano.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:10,start:82.789,end:89.563,es:"¿Tocas la guitarra?",group:"tocar un instrumento",group_index:1,level:"A1"},{i:11,start:89.563,end:97.445,es:"Él toca muy bien el violín.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:12,start:97.445,end:106.032,es:"Quiero aprender a tocar la batería.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:13,start:106.032,end:113.744,es:"La banda toca los sábados.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:14,start:113.744,end:121.371,es:"Toca algo para nosotros.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:15,start:121.371,end:130.213,es:"De niño, tocaba la flauta en la escuela.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:16,start:130.213,end:139.397,es:"Anoche tocaron mi canción favorita.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:17,start:139.397,end:148.432,es:"Hace diez años que toco el saxofón.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:18,start:149.932,end:157.281,es:"Alguien toca la puerta.",group:"tocar la puerta, el timbre",group_index:2,level:"A1"},{i:19,start:157.281,end:164.844,es:"Toca el timbre, por favor.",group:"tocar la puerta, el timbre",group_index:2,level:"A1"},{i:20,start:164.844,end:173.068,es:"Toqué la puerta, pero nadie abrió.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:21,start:173.068,end:181.889,es:"El cartero tocó el timbre dos veces.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:22,start:181.889,end:191.671,es:"Toca el timbre otra vez, creo que no te oyeron.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:23,start:191.671,end:200.641,es:"Antes de entrar, hay que tocar la puerta.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:24,start:200.641,end:210.785,es:"Los niños tocaron el timbre y salieron corriendo.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:25,start:212.285,end:219.272,es:"Ahora te toca a ti.",group:"te toca, el turno",group_index:3,level:"A1"},{i:26,start:219.272,end:225.747,es:"¿A quién le toca?",group:"te toca, el turno",group_index:3,level:"A1"},{i:27,start:225.747,end:233.907,es:"Me toca lavar los platos hoy.",group:"te toca, el turno",group_index:3,level:"A2"},{i:28,start:233.907,end:242.963,es:"Mañana le toca cocinar a mi hermano.",group:"te toca, el turno",group_index:3,level:"A2"},{i:29,start:242.963,end:250.973,es:"Te toca elegir la película.",group:"te toca, el turno",group_index:3,level:"A2"},{i:30,start:250.973,end:258.109,es:"¿Cuándo me toca hablar?",group:"te toca, el turno",group_index:3,level:"A2"},{i:31,start:258.109,end:266.013,es:"Ayer le tocó sacar al perro.",group:"te toca, el turno",group_index:3,level:"A2"},{i:32,start:266.013,end:274.259,es:"Nos toca esperar una hora más.",group:"te toca, el turno",group_index:3,level:"A2"},{i:33,start:274.259,end:284.147,es:"La última vez pagué yo, así que hoy te toca a ti.",group:"te toca, el turno",group_index:3,level:"A2"},{i:34,start:284.147,end:293.331,es:"Al abuelo le toca ir al médico el lunes.",group:"te toca, el turno",group_index:3,level:"A2"},{i:35,start:294.831,end:302.009,es:"Me tocó la lotería.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:36,start:302.009,end:310.105,es:"Le tocó un viaje a la playa.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:37,start:310.105,end:318.585,es:"Nunca me toca nada en las rifas.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:38,start:318.585,end:328.644,es:"En el examen me tocó la pregunta más difícil.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:39,start:328.644,end:336.74,es:"Nos tocó un hotel muy bonito.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:40,start:336.74,end:344.303,es:"¿Qué te tocó en el sorteo?",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:41,start:344.303,end:353.423,es:"Me tocó un asiento al lado de la ventana.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:42,start:353.423,end:362.436,es:"A mi amiga le tocó trabajar el domingo.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:43,start:362.436,end:371.94,es:"Ojalá te toque un buen profesor este año.",group:"me tocó, el premio y la suerte",group_index:4,level:"B1"},{i:44,start:373.44,end:381.856,es:"No quiero tocar ese tema ahora.",group:"tocar un tema",group_index:5,level:"B1"},{i:45,start:381.856,end:392.085,es:"En la reunión tocamos varios temas importantes.",group:"tocar un tema",group_index:5,level:"B1"},{i:46,start:392.085,end:402.635,es:"Es mejor no tocar el tema de la política en la cena.",group:"tocar un tema",group_index:5,level:"B1"},{i:47,start:402.635,end:411.541,es:"El libro toca temas muy difíciles.",group:"tocar un tema",group_index:5,level:"B1"},{i:48,start:411.541,end:420.512,es:"¿Por qué siempre tocas temas tan tristes?",group:"tocar un tema",group_index:5,level:"B1"},{i:49,start:420.512,end:431.531,es:"Prefiero que no toques ese asunto delante de mis padres.",group:"tocar un tema",group_index:5,level:"B1"},{i:50,start:431.531,end:441.077,es:"El profesor solo tocó el tema por encima.",group:"tocar un tema",group_index:5,level:"B1"},{i:51,start:441.077,end:449.899,es:"Si tocas ese tema, se va a molestar.",group:"tocar un tema",group_index:5,level:"B1"},{i:52,start:451.399,end:460.22,es:"Nunca he estado enfermo, toco madera.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:53,start:460.22,end:468.636,es:"La película me tocó el corazón.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:54,start:468.636,end:478.268,es:"Después de tocar fondo, empezó a mejorar.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:55,start:478.268,end:486.428,es:"Sus palabras me tocaron mucho.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:56,start:486.428,end:494.823,es:"Ese problema me toca de cerca.",group:"expresiones con tocar",group_index:6,level:"B1"}],Rs={word:Qs,slug:Ds,kind:Ys,hash:Vs,duration:Os,voice:Is,marks:Fs},Us="verbos reflexivos",Gs="verbos_reflexivos",Ks="concept",Ws="dff289c33591f2ad",Js=552.48,Xs="alex",Zs=[{i:0,start:.5,end:7.743,es:"Me despierto a las siete.",group:"la rutina diaria",group_index:0,level:"A1"},{i:1,start:7.743,end:16.607,es:"Me levanto temprano todos los días.",group:"la rutina diaria",group_index:0,level:"A1"},{i:2,start:16.607,end:25.044,es:"Mi hermano se ducha por la noche.",group:"la rutina diaria",group_index:0,level:"A1"},{i:3,start:25.044,end:33.759,es:"Nos vestimos rápido por la mañana.",group:"la rutina diaria",group_index:0,level:"A1"},{i:4,start:33.759,end:42.175,es:"Los niños se acuestan a las nueve.",group:"la rutina diaria",group_index:0,level:"A1"},{i:5,start:42.175,end:49.353,es:"¿A qué hora te levantas?",group:"la rutina diaria",group_index:0,level:"A1"},{i:6,start:49.353,end:57.897,es:"Mi padre se afeita cada mañana.",group:"la rutina diaria",group_index:0,level:"A1"},{i:7,start:57.897,end:65.631,es:"Me peino antes de salir.",group:"la rutina diaria",group_index:0,level:"A1"},{i:8,start:65.631,end:74.729,es:"¿Te duchas por la mañana o por la noche?",group:"la rutina diaria",group_index:0,level:"A1"},{i:9,start:76.229,end:84.752,es:"Me lavo las manos antes de comer.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:10,start:84.752,end:92.976,es:"Ella se lava el pelo cada día.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:11,start:92.976,end:102.8,es:"Me cepillo los dientes después del desayuno.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:12,start:102.8,end:110.299,es:"El niño se lava la cara.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:13,start:110.299,end:118.032,es:"Mi madre se pinta las uñas.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:14,start:118.032,end:126.405,es:"Se pone los zapatos en la puerta.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:15,start:126.405,end:134.117,es:"Me quito el abrigo al entrar.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:16,start:134.117,end:142.448,es:"Me corto el pelo una vez al mes.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A2"},{i:17,start:143.948,end:152.62,es:"Me enojo cuando hay mucho tráfico.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:18,start:152.62,end:160.801,es:"Mi madre se preocupa por todo.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:19,start:160.801,end:168.983,es:"Nos alegramos mucho de verte.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:20,start:168.983,end:177.121,es:"Los niños se aburren en el auto.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:21,start:177.121,end:186.199,es:"Me pongo nervioso antes de un examen.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:22,start:186.199,end:194.721,es:"Ella se cansa mucho en el trabajo.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:23,start:194.721,end:202.22,es:"¿Por qué te enojas tanto?",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:24,start:202.22,end:210.06,es:"Hoy me siento mucho mejor.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:25,start:210.06,end:218.22,es:"Él se pone triste cuando llueve.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:26,start:219.72,end:227.005,es:"Levántate, ya es tarde.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:27,start:227.005,end:234.141,es:"Voy a ducharme ahora.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:28,start:234.141,end:241.683,es:"Siéntate aquí, por favor.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:29,start:241.683,end:249.928,es:"No te preocupes, todo está bien.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:30,start:249.928,end:258.344,es:"Tengo que acostarme temprano hoy.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:31,start:258.344,end:267.187,es:"Lávate las manos, la cena está lista.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:32,start:267.187,end:274.856,es:"Ponte el abrigo, hace frío.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:33,start:274.856,end:283.123,es:"Necesito relajarme un poco.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:34,start:283.123,end:290.621,es:"Cálmate, no pasa nada.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:35,start:290.621,end:299.229,es:"Acuérdate de llamarme cuando llegues.",group:"en mandatos e infinitivos",group_index:3,level:"B1"},{i:36,start:300.729,end:308.591,es:"Ayer me levanté muy tarde.",group:"en pasado",group_index:4,level:"A2"},{i:37,start:308.591,end:317.476,es:"Esta mañana me duché con agua fría.",group:"en pasado",group_index:4,level:"A2"},{i:38,start:317.476,end:326.596,es:"Cuando era niño, me acostaba a las ocho.",group:"en pasado",group_index:4,level:"A2"},{i:39,start:326.596,end:335.332,es:"Mi hermana se casó el año pasado.",group:"en pasado",group_index:4,level:"A2"},{i:40,start:335.332,end:343.428,es:"¿A qué hora te despertaste hoy?",group:"en pasado",group_index:4,level:"A2"},{i:41,start:343.428,end:352.825,es:"Los niños se divirtieron mucho en el parque.",group:"en pasado",group_index:4,level:"A2"},{i:42,start:352.825,end:359.94,es:"Me caí en la escalera.",group:"en pasado",group_index:4,level:"A2"},{i:43,start:359.94,end:370.489,es:"Antes nos levantábamos a las seis para ir al trabajo.",group:"en pasado",group_index:4,level:"A2"},{i:44,start:370.489,end:379.78,es:"Ya me había vestido cuando llegó el taxi.",group:"en pasado",group_index:4,level:"B1"},{i:45,start:381.28,end:390.464,es:"Nos conocimos en un viaje a México.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:46,start:390.464,end:398.219,es:"Mis padres se quieren mucho.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:47,start:398.219,end:407.424,es:"Mi hermano y yo nos llamamos cada semana.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:48,start:407.424,end:417.333,es:"Los dos amigos se abrazaron en el aeropuerto.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:49,start:417.333,end:426.709,es:"Ellos se escriben mensajes todos los días.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:50,start:426.709,end:436.683,es:"Ana y Luis se ayudan con las tareas de la casa.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:51,start:436.683,end:445.547,es:"Los vecinos se saludan en la escalera.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:52,start:445.547,end:454.581,es:"Es importante que nos escuchemos más.",group:"acciones recíprocas",group_index:5,level:"B1"},{i:53,start:454.581,end:463.637,es:"Ojalá se entiendan mejor con el tiempo.",group:"acciones recíprocas",group_index:5,level:"B1"},{i:54,start:465.137,end:472.444,es:"¿Cómo se llama tu perro?",group:"cambios de significado",group_index:6,level:"A1"},{i:55,start:472.444,end:479.793,es:"Ya me voy, es muy tarde.",group:"cambios de significado",group_index:6,level:"A2"},{i:56,start:479.793,end:489.233,es:"¿Por qué te fuiste tan temprano de la fiesta?",group:"cambios de significado",group_index:6,level:"A2"},{i:57,start:489.233,end:497.308,es:"El bebé se durmió en el auto.",group:"cambios de significado",group_index:6,level:"A2"},{i:58,start:497.308,end:505.553,es:"Hoy me quedo en casa porque llueve.",group:"cambios de significado",group_index:6,level:"A2"},{i:59,start:505.553,end:516.572,es:"Normalmente duermo bien, pero anoche me dormí muy tarde.",group:"cambios de significado",group_index:6,level:"B1"},{i:60,start:516.572,end:526.097,es:"Me quedé dormido y llegué tarde al trabajo.",group:"cambios de significado",group_index:6,level:"B1"},{i:61,start:526.097,end:535.516,es:"Se quedaron sin dinero al final del viaje.",group:"cambios de significado",group_index:6,level:"B1"},{i:62,start:535.516,end:544.871,es:"Me di cuenta del error demasiado tarde.",group:"cambios de significado",group_index:6,level:"B1"},{i:63,start:544.871,end:552.412,es:"No me acuerdo de su nombre.",group:"cambios de significado",group_index:6,level:"B1"}],en={word:Us,slug:Gs,kind:Ks,hash:Ws,duration:Js,voice:Xs,marks:Zs},an="vez",on="vez",rn="word",sn="399a96ffbd1135e7",nn=529.104,ln="alex",tn=[{i:0,start:.5,end:9.62,es:"Voy al gimnasio tres veces por semana.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:1,start:9.62,end:18.185,es:"Como pescado una vez a la semana.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:2,start:18.185,end:26.964,es:"Llamo a mi madre dos veces al día.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:3,start:26.964,end:34.783,es:"Lee la pregunta dos veces.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:4,start:34.783,end:41.705,es:"Solo lo digo una vez.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:5,start:41.705,end:51.06,es:"Tomo esta medicina tres veces al día.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:6,start:51.06,end:58.153,es:"Fui a París una vez.",group:"una vez, dos veces",group_index:0,level:"A2"},{i:7,start:59.653,end:67.173,es:"A veces trabajo en casa.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:8,start:67.173,end:74.587,es:"A veces llueve en verano.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:9,start:74.587,end:83.408,es:"Mi hermano a veces cocina para todos.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:10,start:83.408,end:91.589,es:"Muchas veces comemos juntos.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:11,start:91.589,end:99.664,es:"A veces no entiendo a mi jefe.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:12,start:99.664,end:108.72,es:"Muchas veces el tren llega tarde.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:13,start:108.72,end:116.752,es:"¿Vas mucho al cine? A veces.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:14,start:118.252,end:125.687,es:"¿Puedes decirlo otra vez?",group:"otra vez",group_index:2,level:"A1"},{i:15,start:125.687,end:132.375,es:"Otra vez llueve.",group:"otra vez",group_index:2,level:"A1"},{i:16,start:132.375,end:141.537,es:"Mañana vamos otra vez a la playa.",group:"otra vez",group_index:2,level:"A1"},{i:17,start:141.537,end:147.713,es:"¡Otra vez tú!",group:"otra vez",group_index:2,level:"A1"},{i:18,start:147.713,end:157.068,es:"El niño quiere ver la película otra vez.",group:"otra vez",group_index:2,level:"A1"},{i:19,start:157.068,end:165.889,es:"Mi teléfono otra vez no funciona.",group:"otra vez",group_index:2,level:"A1"},{i:20,start:165.889,end:173.815,es:"Perdí las llaves otra vez.",group:"otra vez",group_index:2,level:"A2"},{i:21,start:175.315,end:183.645,es:"Es la primera vez que vengo aquí.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A1"},{i:22,start:183.645,end:192.36,es:"La primera vez que la vi, no hablamos.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:23,start:192.36,end:201.075,es:"¿Cuándo fue la última vez que comiste?",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:24,start:201.075,end:210.92,es:"La última vez que fui, el museo estaba cerrado.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:25,start:210.92,end:219.613,es:"Esta es la última vez que te ayudo.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:26,start:219.613,end:229.224,es:"Recuerdo la primera vez que subí a un avión.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:27,start:229.224,end:237.448,es:"La próxima vez, llámame antes.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:28,start:238.948,end:247.407,es:"De vez en cuando como chocolate.",group:"de vez en cuando",group_index:4,level:"A2"},{i:29,start:247.407,end:256.932,es:"Mis primos nos visitan de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:30,start:256.932,end:266.052,es:"De vez en cuando me gusta caminar solo.",group:"de vez en cuando",group_index:4,level:"A2"},{i:31,start:266.052,end:274.788,es:"Vamos al teatro de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:32,start:274.788,end:284.207,es:"De vez en cuando escucho música clásica.",group:"de vez en cuando",group_index:4,level:"A2"},{i:33,start:284.207,end:293.092,es:"Es bueno descansar de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:34,start:294.592,end:301.301,es:"Tal vez mañana.",group:"tal vez",group_index:5,level:"A2"},{i:35,start:301.301,end:308.8,es:"Tal vez voy a la fiesta.",group:"tal vez",group_index:5,level:"A2"},{i:36,start:308.8,end:316.107,es:"Tal vez tienes razón.",group:"tal vez",group_index:5,level:"A2"},{i:37,start:316.107,end:323.947,es:"Tal vez está en la cocina.",group:"tal vez",group_index:5,level:"A2"},{i:38,start:323.947,end:331.765,es:"Tal vez llueva esta tarde.",group:"tal vez",group_index:5,level:"B1"},{i:39,start:331.765,end:340.501,es:"Tal vez Ana no sepa la dirección.",group:"tal vez",group_index:5,level:"B1"},{i:40,start:340.501,end:349.173,es:"Tal vez podamos vernos el sábado.",group:"tal vez",group_index:5,level:"B1"},{i:41,start:350.673,end:358.748,es:"Hoy tomo té en vez de café.",group:"en vez de",group_index:6,level:"A2"},{i:42,start:358.748,end:367.783,es:"Vamos a pie en vez de tomar un taxi.",group:"en vez de",group_index:6,level:"A2"},{i:43,start:367.783,end:377.009,es:"En vez de ver la televisión, lee un libro.",group:"en vez de",group_index:6,level:"A2"},{i:44,start:377.009,end:385.127,es:"Compré pollo en vez de carne.",group:"en vez de",group_index:6,level:"A2"},{i:45,start:385.127,end:394.375,es:"Ella fue a la reunión en vez de su jefe.",group:"en vez de",group_index:6,level:"A2"},{i:46,start:394.375,end:405.372,es:"Prefiero quedarme en casa en vez de salir esta noche.",group:"en vez de",group_index:6,level:"A2"},{i:47,start:405.372,end:414.023,es:"En vez de quejarte, ayúdame un poco.",group:"en vez de",group_index:6,level:"B1"},{i:48,start:415.523,end:424.429,es:"No puedo hacer dos cosas a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:49,start:424.429,end:431.992,es:"Todos hablaban a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:50,start:431.992,end:441.688,es:"Es una película triste y divertida a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:51,start:441.688,end:450.275,es:"Sentí miedo y alegría a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:52,start:450.275,end:459.437,es:"Mi hermana estudia y trabaja a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:53,start:459.437,end:468.472,es:"Los dos llegamos a la puerta a la vez.",group:"a la vez",group_index:7,level:"B1"},{i:54,start:469.972,end:477.769,es:"Hace cada vez más calor.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:55,start:477.769,end:485.503,es:"Cada vez hay menos tiempo.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:56,start:485.503,end:493.812,es:"Mi español es cada vez mejor.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:57,start:493.812,end:503.593,es:"Cada vez más personas trabajan desde casa.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:58,start:503.593,end:512.351,es:"La ciudad está cada vez más cara.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:59,start:512.351,end:520.34,es:"Cada vez leo menos libros.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"},{i:60,start:520.34,end:529.033,es:"Tu hijo está cada vez más alto.",group:"cada vez más, cada vez menos",group_index:8,level:"B1"}],un={word:an,slug:on,kind:rn,hash:sn,duration:nn,voice:ln,marks:tn},dn="volver a",pn="volver_a",gn="word",cn="b4fa9dfd382b53e5",vn=521.88,mn="alex",_n=[{i:0,start:.5,end:7.913,es:"Vuelvo a casa a las seis.",group:"volver, regresar",group_index:0,level:"A1"},{i:1,start:7.913,end:14.153,es:"¿Cuándo vuelves?",group:"volver, regresar",group_index:0,level:"A1"},{i:2,start:14.153,end:21.78,es:"Mi hermano vuelve mañana.",group:"volver, regresar",group_index:0,level:"A1"},{i:3,start:21.78,end:28.852,es:"Volvemos en una hora.",group:"volver, regresar",group_index:0,level:"A1"},{i:4,start:28.852,end:37.908,es:"Ella vuelve del trabajo muy cansada.",group:"volver, regresar",group_index:0,level:"A1"},{i:5,start:37.908,end:45.663,es:"¿A qué hora vuelven los niños?",group:"volver, regresar",group_index:0,level:"A1"},{i:6,start:45.663,end:52.564,es:"Ayer volví tarde.",group:"volver, regresar",group_index:0,level:"A2"},{i:7,start:52.564,end:60.895,es:"Mis padres volvieron de Italia.",group:"volver, regresar",group_index:0,level:"A2"},{i:8,start:62.395,end:69.595,es:"Vuelvo a leer el libro.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:9,start:69.595,end:77.115,es:"Mañana vuelvo a llamar.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:10,start:77.115,end:85.573,es:"Siempre vuelve a perder las llaves.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:11,start:85.573,end:93.115,es:"El bebé vuelve a llorar.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:12,start:93.115,end:99.632,es:"Vuelve a llover.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:13,start:99.632,end:107.835,es:"Hoy volvemos a comer pescado.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:14,start:107.835,end:116.144,es:"Mi computadora vuelve a fallar.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:15,start:116.144,end:124.752,es:"Ella vuelve a preguntar lo mismo.",group:"vuelvo a + infinitivo, otra vez",group_index:1,level:"A1"},{i:16,start:126.252,end:134.199,es:"Volví a ver esa película.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:17,start:134.199,end:141.249,es:"Ayer volvió a nevar.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:18,start:141.249,end:149.452,es:"Volvimos a visitar el museo.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:19,start:149.452,end:158.935,es:"Después de dos años, volvió a trabajar.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:20,start:158.935,end:167.735,es:"Volví a llamar, pero nadie contestó.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:21,start:167.735,end:176.727,es:"El dolor volvió a empezar por la noche.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:22,start:176.727,end:186.679,es:"Mi hermana volvió a estudiar a los cuarenta años.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:23,start:186.679,end:196.588,es:"De niño, volví a leer ese cuento muchas veces.",group:"volví a, volvió a",group_index:2,level:"A2"},{i:24,start:198.088,end:205.565,es:"Voy a volver a intentarlo.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:25,start:205.565,end:214.109,es:"Mañana va a volver a hacer frío.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:26,start:214.109,end:222.632,es:"¿Vas a volver a ese restaurante?",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:27,start:222.632,end:231.432,es:"Vamos a volver a vernos en verano.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:28,start:231.432,end:240.509,es:"Volveré a escribirte la semana que viene.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:29,start:240.509,end:250.269,es:"El año que viene volveremos a viajar juntos.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:30,start:250.269,end:258.643,es:"Te volveré a llamar más tarde.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:31,start:258.643,end:267.059,es:"Pronto volverá a salir el sol.",group:"voy a volver a, volveré a",group_index:3,level:"A2"},{i:32,start:268.559,end:275.716,es:"No vuelvo a comer ahí.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:33,start:275.716,end:282.98,es:"Nunca volví a verlo.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:34,start:282.98,end:291.183,es:"No volvimos a hablar del tema.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:35,start:291.183,end:299.407,es:"No pienso volver a ese hotel.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:36,start:299.407,end:308.847,es:"Después del accidente, no volvió a manejar.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:37,start:308.847,end:317.583,es:"Prometo no volver a llegar tarde.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:38,start:317.583,end:325.849,es:"No ha vuelto a llover desde marzo.",group:"no volver a, nunca más",group_index:4,level:"A2"},{i:39,start:325.849,end:333.327,es:"No vuelvas a hacer eso.",group:"no volver a, nunca más",group_index:4,level:"B1"},{i:40,start:334.827,end:341.728,es:"Vuelve a intentarlo.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:41,start:341.728,end:350.741,es:"Vuelva a revisar sus datos, por favor.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:42,start:350.741,end:358.325,es:"Vuelve a leer la pregunta.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:43,start:358.325,end:366.592,es:"Vuelvan a sentarse, por favor.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:44,start:366.592,end:374.24,es:"Vuelve a contar el dinero.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:45,start:374.24,end:383.637,es:"Por favor, vuelva a escribir su contraseña.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:46,start:383.637,end:394.933,es:"Si no funciona, apaga la computadora y vuelve a encenderla.",group:"vuelve a intentarlo",group_index:5,level:"A2"},{i:47,start:396.433,end:404.273,es:"Lo volví a ver en la fiesta.",group:"con pronombres",group_index:6,level:"B1"},{i:48,start:404.273,end:411.495,es:"Te lo vuelvo a explicar.",group:"con pronombres",group_index:6,level:"B1"},{i:49,start:411.495,end:419.079,es:"Se me volvió a olvidar.",group:"con pronombres",group_index:6,level:"B1"},{i:50,start:419.079,end:427.431,es:"Me volvió a llamar a medianoche.",group:"con pronombres",group_index:6,level:"B1"},{i:51,start:427.431,end:435.164,es:"¿Me lo puedes volver a decir?",group:"con pronombres",group_index:6,level:"B1"},{i:52,start:435.164,end:444.753,es:"Nos volvimos a encontrar en el aeropuerto.",group:"con pronombres",group_index:6,level:"B1"},{i:53,start:444.753,end:452.999,es:"Se volvió a romper la lavadora.",group:"con pronombres",group_index:6,level:"B1"},{i:54,start:452.999,end:461.159,es:"Me lo volví a poner para la boda.",group:"con pronombres",group_index:6,level:"B1"},{i:55,start:462.659,end:470.691,es:"Espero que no vuelva a pasar.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:56,start:470.691,end:479.235,es:"Ojalá volvamos a vernos pronto.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:57,start:479.235,end:488.632,es:"Si pudiera, volvería a estudiar medicina.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:58,start:488.632,end:496.664,es:"Yo no volvería a ese lugar.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:59,start:496.664,end:504.973,es:"Cuando vuelvas a venir, avísame.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:60,start:504.973,end:513.667,es:"Me alegra que hayas vuelto a cantar.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"},{i:61,start:513.667,end:521.827,es:"No creo que vuelva a llover hoy.",group:"ojalá volvamos a vernos",group_index:7,level:"B1"}],xn={word:dn,slug:pn,kind:gn,hash:cn,duration:vn,voice:mn,marks:_n},An="ya / todavía",hn="ya_todavia",bn="word",qn="692dfe7201818a3b",fn=519.888,yn="alex",jn=[{i:0,start:.5,end:6.569,es:"Ya es tarde.",group:"ya en presente",group_index:0,level:"A1"},{i:1,start:6.569,end:13.108,es:"Ya sé tu nombre.",group:"ya en presente",group_index:0,level:"A1"},{i:2,start:13.108,end:20.479,es:"Mi hermano ya trabaja.",group:"ya en presente",group_index:0,level:"A1"},{i:3,start:20.479,end:27.572,es:"¿Ya tienes las llaves?",group:"ya en presente",group_index:0,level:"A1"},{i:4,start:27.572,end:35.007,es:"El niño ya lee solo.",group:"ya en presente",group_index:0,level:"A1"},{i:5,start:35.007,end:42.121,es:"Ya estamos en casa.",group:"ya en presente",group_index:0,level:"A1"},{i:6,start:42.121,end:49.641,es:"La cena ya está lista.",group:"ya en presente",group_index:0,level:"A1"},{i:7,start:51.141,end:56.699,es:"¡Ya voy!",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:8,start:56.699,end:62.469,es:"¡Ven ya!",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:9,start:62.469,end:69.989,es:"Ya vengo, espérame aquí.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:10,start:69.989,end:77.125,es:"Hazlo ya, por favor.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:11,start:77.125,end:85.051,es:"Necesito una respuesta ya.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:12,start:85.051,end:92.251,es:"Ya bajo, un momento.",group:"ya voy, ahora mismo",group_index:1,level:"A1"},{i:13,start:92.251,end:100.496,es:"Si quieres llegar a tiempo, sal ya.",group:"ya voy, ahora mismo",group_index:1,level:"A2"},{i:14,start:101.996,end:109.047,es:"Todavía es temprano.",group:"todavía",group_index:2,level:"A1"},{i:15,start:109.047,end:117.164,es:"Mi abuela todavía vive sola.",group:"todavía",group_index:2,level:"A1"},{i:16,start:117.164,end:124.407,es:"¿Todavía tienes hambre?",group:"todavía",group_index:2,level:"A1"},{i:17,start:124.407,end:131.777,es:"Todavía llueve mucho.",group:"todavía",group_index:2,level:"A1"},{i:18,start:131.777,end:139.617,es:"Los niños todavía duermen.",group:"todavía",group_index:2,level:"A1"},{i:19,start:139.617,end:147.713,es:"Todavía estoy en la oficina.",group:"todavía",group_index:2,level:"A1"},{i:20,start:147.713,end:156.3,es:"¿Todavía trabajas en el hospital?",group:"todavía",group_index:2,level:"A1"},{i:21,start:157.8,end:164.616,es:"Todavía no lo sé.",group:"todavía no",group_index:3,level:"A1"},{i:22,start:164.616,end:173.181,es:"El autobús todavía no está aquí.",group:"todavía no",group_index:3,level:"A1"},{i:23,start:173.181,end:181.107,es:"Todavía no tengo trabajo.",group:"todavía no",group_index:3,level:"A1"},{i:24,start:181.107,end:188.819,es:"Mi hija todavía no habla.",group:"todavía no",group_index:3,level:"A1"},{i:25,start:188.819,end:196.765,es:"Todavía no es hora de comer.",group:"todavía no",group_index:3,level:"A1"},{i:26,start:196.765,end:205.309,es:"Todavía no conozco a tus padres.",group:"todavía no",group_index:3,level:"A1"},{i:27,start:205.309,end:213.064,es:"¿Todavía no estás listo?",group:"todavía no",group_index:3,level:"A1"},{i:28,start:214.564,end:222.148,es:"Ya no vivo en esa casa.",group:"ya no",group_index:4,level:"A2"},{i:29,start:222.148,end:229.007,es:"Ya no tengo frío.",group:"ya no",group_index:4,level:"A2"},{i:30,start:229.007,end:236.271,es:"Mi padre ya no fuma.",group:"ya no",group_index:4,level:"A2"},{i:31,start:236.271,end:243.833,es:"Ya no hay pan en la tienda.",group:"ya no",group_index:4,level:"A2"},{i:32,start:243.833,end:252.1,es:"Ya no quiero más café, gracias.",group:"ya no",group_index:4,level:"A2"},{i:33,start:252.1,end:259.684,es:"Ellos ya no son amigos.",group:"ya no",group_index:4,level:"A2"},{i:34,start:259.684,end:269.935,es:"Desde que tengo bicicleta, ya no tomo el autobús.",group:"ya no",group_index:4,level:"A2"},{i:35,start:271.435,end:278.635,es:"Ya he comido, gracias.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:36,start:278.635,end:286.389,es:"¿Ya has terminado la tarea?",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:37,start:286.389,end:294.549,es:"Ya hemos visto esa película.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:38,start:294.549,end:304.267,es:"Mis amigos ya han llegado al restaurante.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:39,start:304.267,end:312.277,es:"¿Ya has hablado con el médico?",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:40,start:312.277,end:319.797,es:"Ya ha empezado el partido.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:41,start:319.797,end:327.296,es:"Ya he leído tu mensaje.",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:42,start:327.296,end:334.901,es:"¿Ya han llamado del banco?",group:"ya con pretérito perfecto",group_index:5,level:"A2"},{i:43,start:336.401,end:344.156,es:"¡Ya está! Funciona otra vez.",group:"¡ya está!",group_index:6,level:"A2"},{i:44,start:344.156,end:352.359,es:"Ya está, la puerta está cerrada.",group:"¡ya está!",group_index:6,level:"A2"},{i:45,start:352.359,end:359.132,es:"¿Ya está el arroz?",group:"¡ya está!",group_index:6,level:"A2"},{i:46,start:359.132,end:366.908,es:"Un minuto más y ya está.",group:"¡ya está!",group_index:6,level:"A2"},{i:47,start:366.908,end:374.471,es:"¡Ya está! Terminé la tarea.",group:"¡ya está!",group_index:6,level:"A2"},{i:48,start:374.471,end:382.055,es:"¡Ya está! Ya podemos salir.",group:"¡ya está!",group_index:6,level:"A2"},{i:49,start:383.555,end:392.845,es:"Ya es de noche, pero todavía hace calor.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:50,start:392.845,end:403.693,es:"Ya terminé el informe, pero todavía tengo que enviarlo.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:51,start:403.693,end:413.261,es:"Mi hijo ya camina, pero todavía no habla.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:52,start:413.261,end:423.64,es:"Ya no llueve, pero las calles todavía están mojadas.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:53,start:423.64,end:434.061,es:"Ya compré los regalos, pero todavía no los he envuelto.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:54,start:434.061,end:443.971,es:"Ya sabía la noticia, pero todavía no lo creo.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:55,start:443.971,end:453.965,es:"Ya son las diez y todavía no ha llegado nadie.",group:"ya y todavía en la misma frase",group_index:7,level:"B1"},{i:56,start:455.465,end:464.415,es:"Ya que estás aquí, ayúdame con la mesa.",group:"ya que",group_index:8,level:"B1"},{i:57,start:464.415,end:474.345,es:"Ya que hace buen tiempo, podríamos comer afuera.",group:"ya que",group_index:8,level:"B1"},{i:58,start:474.345,end:483.465,es:"No voy a salir, ya que estoy muy cansado.",group:"ya que",group_index:8,level:"B1"},{i:59,start:483.465,end:492.457,es:"Ya que vas al mercado, compra tomates.",group:"ya que",group_index:8,level:"B1"},{i:60,start:492.457,end:501.364,es:"Ya que no tienes prisa, quédate a cenar.",group:"ya que",group_index:8,level:"B1"},{i:61,start:501.364,end:510.42,es:"Ya que lo mencionas, yo también quiero ir.",group:"ya que",group_index:8,level:"B1"},{i:62,start:510.42,end:519.839,es:"Te llamo mañana, ya que hoy no tengo tiempo.",group:"ya que",group_index:8,level:"B1"}],Bn={word:An,slug:hn,kind:bn,hash:qn,duration:fn,voice:yn,marks:jn},zn="acabar",Mn="acabar",En="word",$n="c6058629a4f0a2c6",kn=527.688,Nn="dora",wn=[{i:0,start:.5,end:7.999,es:"La clase acaba a las tres.",group:"acabar, terminar",group_index:0,level:"A1"},{i:1,start:7.999,end:15.391,es:"¿Cuándo acaba la película?",group:"acabar, terminar",group_index:0,level:"A1"},{i:2,start:15.391,end:23.06,es:"La fiesta acaba muy tarde.",group:"acabar, terminar",group_index:0,level:"A1"},{i:3,start:23.06,end:30.644,es:"Acabo el trabajo a las cinco.",group:"acabar, terminar",group_index:0,level:"A1"},{i:4,start:30.644,end:37.929,es:"El curso acaba en junio.",group:"acabar, terminar",group_index:0,level:"A1"},{i:5,start:37.929,end:45.791,es:"¿Ya acabas la tarea? Te espero.",group:"acabar, terminar",group_index:0,level:"A1"},{i:6,start:45.791,end:53.801,es:"Mi turno acaba a medianoche.",group:"acabar, terminar",group_index:0,level:"A1"},{i:7,start:55.301,end:62.245,es:"Ayer acabé el libro.",group:"acabé, acabó",group_index:1,level:"A2"},{i:8,start:62.245,end:69.296,es:"¿Ya acabaste la tarea?",group:"acabé, acabó",group_index:1,level:"A2"},{i:9,start:69.296,end:77.328,es:"La reunión acabó muy tarde.",group:"acabé, acabó",group_index:1,level:"A2"},{i:10,start:77.328,end:85.936,es:"Anoche acabamos la cena a las once.",group:"acabé, acabó",group_index:1,level:"A2"},{i:11,start:85.936,end:94.352,es:"Todavía no he acabado el informe.",group:"acabé, acabó",group_index:1,level:"A2"},{i:12,start:94.352,end:102.128,es:"El partido acabó empatado.",group:"acabé, acabó",group_index:1,level:"A2"},{i:13,start:102.128,end:109.371,es:"¿Cómo acabó la historia?",group:"acabé, acabó",group_index:1,level:"A2"},{i:14,start:109.371,end:118.555,es:"Cuando acabó el partido, salimos a caminar.",group:"acabé, acabó",group_index:1,level:"A2"},{i:15,start:120.055,end:127.383,es:"Acabo de llegar a casa.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:16,start:127.383,end:133.921,es:"Acabamos de comer.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:17,start:133.921,end:141.356,es:"El tren acaba de salir.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:18,start:141.356,end:148.428,es:"¿Acabas de despertarte?",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:19,start:148.428,end:155.82,es:"Acaba de llamar tu madre.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:20,start:155.82,end:163.895,es:"Acabo de ver a Pedro en la calle.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:21,start:163.895,end:172.972,es:"Mis vecinos acaban de tener un bebé.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:22,start:172.972,end:180.364,es:"Acabo de enviarte el correo.",group:"acabar de + infinitivo",group_index:2,level:"A2"},{i:23,start:180.364,end:188.695,es:"Cuando llegué, él acababa de salir.",group:"acabar de + infinitivo",group_index:2,level:"B1"},{i:24,start:188.695,end:198.348,es:"Acababa de ducharme cuando sonó el teléfono.",group:"acabar de + infinitivo",group_index:2,level:"B1"},{i:25,start:199.848,end:206.579,es:"Se acabó la leche.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:26,start:206.579,end:214.12,es:"Se acabaron las vacaciones.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:27,start:214.12,end:220.893,es:"Se nos acabó el pan.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:28,start:220.893,end:229.459,es:"Se me acabó la batería del teléfono.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:29,start:229.459,end:236.125,es:"¿Se acabó el café?",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:30,start:236.125,end:244.008,es:"Se acabó el tiempo del examen.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:31,start:244.008,end:252.253,es:"Se están acabando las entradas.",group:"acabarse: no quedar",group_index:3,level:"A2"},{i:32,start:252.253,end:261.672,es:"Cuando se acabe el dinero, volvemos a casa.",group:"acabarse: no quedar",group_index:3,level:"B1"},{i:33,start:263.172,end:271.161,es:"Acabé comprando dos camisas.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:34,start:271.161,end:279.876,es:"Siempre acabamos hablando de trabajo.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:35,start:279.876,end:289.572,es:"Fuimos a pasear y acabamos cenando en la playa.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:36,start:289.572,end:299.396,es:"No quería ir, pero acabé bailando toda la noche.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:37,start:299.396,end:308.004,es:"Ella siempre acaba pagando la cuenta.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:38,start:308.004,end:318.127,es:"Empezó como un juego y acabó siendo su trabajo.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:39,start:318.127,end:328.271,es:"Si no descansas, acabarás durmiéndote en clase.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:40,start:328.271,end:338.159,es:"Al final, acabó riéndose de sus propios errores.",group:"acabar + gerundio",group_index:4,level:"B1"},{i:41,start:339.659,end:346.987,es:"La historia acabó bien.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"A2"},{i:42,start:346.987,end:354.229,es:"La película acaba mal.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"A2"},{i:43,start:354.229,end:362.176,es:"La discusión acabó en pelea.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:44,start:362.176,end:369.931,es:"Esta calle acaba en el río.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:45,start:369.931,end:378.816,es:"Si sigues así, vas a acabar enfermo.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:46,start:378.816,end:387.573,es:"Acabaron por aceptar nuestra oferta.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:47,start:387.573,end:395.669,es:"Todo acabó en una gran fiesta.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:48,start:395.669,end:404.128,es:"El proyecto acabó por cancelarse.",group:"acabar en, acabar por, acabar bien",group_index:5,level:"B1"},{i:49,start:405.628,end:414.023,es:"Tenemos que acabar con este problema.",group:"acabar con",group_index:6,level:"B1"},{i:50,start:414.023,end:422.588,es:"Este trabajo va a acabar conmigo.",group:"acabar con",group_index:6,level:"B1"},{i:51,start:422.588,end:430.94,es:"La lluvia acabó con nuestros planes.",group:"acabar con",group_index:6,level:"B1"},{i:52,start:430.94,end:440.039,es:"El gobierno quiere acabar con la pobreza.",group:"acabar con",group_index:6,level:"B1"},{i:53,start:440.039,end:449.073,es:"Hay que acabar con el ruido en el edificio.",group:"acabar con",group_index:6,level:"B1"},{i:54,start:449.073,end:458.599,es:"Esta medicina acabó con mi dolor de cabeza.",group:"acabar con",group_index:6,level:"B1"},{i:55,start:458.599,end:468.06,es:"Quiero acabar con esta situación cuanto antes.",group:"acabar con",group_index:6,level:"B1"},{i:56,start:469.56,end:477.315,es:"¡Se acabó! Nos vamos a casa.",group:"expresiones",group_index:7,level:"A2"},{i:57,start:477.315,end:487.075,es:"Y colorín colorado, este cuento se ha acabado.",group:"expresiones",group_index:7,level:"A2"},{i:58,start:487.075,end:494.189,es:"Esto no acaba nunca.",group:"expresiones",group_index:7,level:"B1"},{i:59,start:494.189,end:502.221,es:"No acabo de entender la pregunta.",group:"expresiones",group_index:7,level:"B1"},{i:60,start:502.221,end:511.277,es:"No acabo de acostumbrarme a esta ciudad.",group:"expresiones",group_index:7,level:"B1"},{i:61,start:511.277,end:518.584,es:"Lo bueno se acaba pronto.",group:"expresiones",group_index:7,level:"B1"},{i:62,start:518.584,end:527.64,es:"No vas a salir esta noche, y se acabó.",group:"expresiones",group_index:7,level:"B1"}],Ln={word:zn,slug:Mn,kind:En,hash:$n,duration:kn,voice:Nn,marks:wn},Sn="conocer",Tn="conocer",Pn="word",Cn="09e6e2b98fe553b8",Hn=569.448,Qn="dora",Dn=[{i:0,start:.5,end:7.487,es:"Conozco a tu hermano.",group:"conocer a una persona",group_index:0,level:"A1"},{i:1,start:7.487,end:14.772,es:"No conozco a nadie aquí.",group:"conocer a una persona",group_index:0,level:"A1"},{i:2,start:14.772,end:21.929,es:"¿Conoces a mi vecina?",group:"conocer a una persona",group_index:0,level:"A1"},{i:3,start:21.929,end:30.644,es:"Ella conoce a todos en la oficina.",group:"conocer a una persona",group_index:0,level:"A1"},{i:4,start:30.644,end:39.337,es:"Conocemos al profesor de música.",group:"conocer a una persona",group_index:0,level:"A1"},{i:5,start:39.337,end:47.86,es:"Mis padres no conocen a mi jefe.",group:"conocer a una persona",group_index:0,level:"A1"},{i:6,start:47.86,end:56.852,es:"Yo conozco a la dueña del restaurante.",group:"conocer a una persona",group_index:0,level:"A1"},{i:7,start:56.852,end:65.588,es:"Te conozco desde hace muchos años.",group:"conocer a una persona",group_index:0,level:"A2"},{i:8,start:67.088,end:74.437,es:"No conozco esta ciudad.",group:"conocer un lugar",group_index:1,level:"A1"},{i:9,start:74.437,end:83.6,es:"Conozco un buen restaurante cerca de aquí.",group:"conocer un lugar",group_index:1,level:"A1"},{i:10,start:83.6,end:90.181,es:"¿Conoces México?",group:"conocer un lugar",group_index:1,level:"A1"},{i:11,start:90.181,end:97.957,es:"Mi abuela no conoce el mar.",group:"conocer un lugar",group_index:1,level:"A1"},{i:12,start:97.957,end:105.669,es:"Quiero conocer Buenos Aires.",group:"conocer un lugar",group_index:1,level:"A1"},{i:13,start:105.669,end:113.36,es:"Ya conocemos este museo.",group:"conocer un lugar",group_index:1,level:"A1"},{i:14,start:113.36,end:122.352,es:"El taxista conoce todas las calles.",group:"conocer un lugar",group_index:1,level:"A1"},{i:15,start:122.352,end:131.493,es:"Nunca he conocido un lugar tan tranquilo.",group:"conocer un lugar",group_index:1,level:"A2"},{i:16,start:132.993,end:140.577,es:"¿Conoces un buen médico?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:17,start:140.577,end:148.567,es:"¿Conoces algún hotel barato?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:18,start:148.567,end:157.004,es:"¿Conocen una tienda abierta ahora?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:19,start:157.004,end:166.551,es:"¿Conoces una buena película para esta noche?",group:"preguntas y recomendaciones",group_index:2,level:"A1"},{i:20,start:166.551,end:175.969,es:"Si conoces un buen mecánico, avísame.",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:21,start:175.969,end:185.452,es:"¿Conoces alguna receta fácil con pollo?",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:22,start:185.452,end:194.913,es:"Te recomiendo un café que conozco en el centro.",group:"preguntas y recomendaciones",group_index:2,level:"A2"},{i:23,start:194.913,end:203.991,es:"¿Usted conoce a alguien que hable inglés?",group:"preguntas y recomendaciones",group_index:2,level:"B1"},{i:24,start:205.491,end:213.16,es:"Mucho gusto en conocerte.",group:"conocer por primera vez",group_index:3,level:"A1"},{i:25,start:213.16,end:222.152,es:"Conocí a mi novia en la universidad.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:26,start:222.152,end:230.12,es:"¿Dónde conociste a tu esposo?",group:"conocer por primera vez",group_index:3,level:"A2"},{i:27,start:230.12,end:239.283,es:"Nos conocimos en una fiesta de cumpleaños.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:28,start:239.283,end:247.635,es:"Ayer conocí a los padres de Carlos.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:29,start:247.635,end:256.392,es:"Mañana vas a conocer a mi familia.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:30,start:256.392,end:265.512,es:"Conocí a mi mejor amigo en el autobús.",group:"conocer por primera vez",group_index:3,level:"A2"},{i:31,start:265.512,end:275.357,es:"Me encantaría conocer a tu hermana algún día.",group:"conocer por primera vez",group_index:3,level:"B1"},{i:32,start:276.857,end:283.609,es:"¿Ustedes se conocen?",group:"conocerse",group_index:4,level:"A1"},{i:33,start:283.609,end:292.516,es:"Nosotros nos conocemos desde niños.",group:"conocerse",group_index:4,level:"A2"},{i:34,start:292.516,end:300.847,es:"Ellos se conocieron en el trabajo.",group:"conocerse",group_index:4,level:"A2"},{i:35,start:300.847,end:309.199,es:"Nos conocimos hace diez años.",group:"conocerse",group_index:4,level:"A2"},{i:36,start:309.199,end:317.871,es:"Mis padres se conocieron en un tren.",group:"conocerse",group_index:4,level:"A2"},{i:37,start:317.871,end:328.527,es:"Me conozco muy bien y sé cuándo necesito descansar.",group:"conocerse",group_index:4,level:"B1"},{i:38,start:328.527,end:337.54,es:"Es importante conocerse a uno mismo.",group:"conocerse",group_index:4,level:"B1"},{i:39,start:339.04,end:347.84,es:"Conozco a Ana, pero no sé dónde vive.",group:"conocer y saber",group_index:5,level:"A2"},{i:40,start:347.84,end:357.707,es:"Conozco Madrid, pero no sé dónde está tu hotel.",group:"conocer y saber",group_index:5,level:"A2"},{i:41,start:357.707,end:367.595,es:"Sé su nombre, pero no lo conozco personalmente.",group:"conocer y saber",group_index:5,level:"A2"},{i:42,start:367.595,end:376.544,es:"Conozco la canción, pero no sé la letra.",group:"conocer y saber",group_index:5,level:"A2"},{i:43,start:376.544,end:386.965,es:"No conozco al nuevo director, solo sé que es muy serio.",group:"conocer y saber",group_index:5,level:"B1"},{i:44,start:386.965,end:398.069,es:"Conozco el camino, así que sé cuánto tiempo vamos a tardar.",group:"conocer y saber",group_index:5,level:"B1"},{i:45,start:398.069,end:408.661,es:"Aunque conozco bien el tema, no sé si podré explicarlo.",group:"conocer y saber",group_index:5,level:"B1"},{i:46,start:410.161,end:419.367,es:"Es un cantante muy conocido en su país.",group:"conocido y dar a conocer",group_index:6,level:"A2"},{i:47,start:419.367,end:428.337,es:"Esta ciudad es conocida por su comida.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:48,start:428.337,end:437.329,es:"El pintor es conocido en todo el mundo.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:49,start:437.329,end:445.788,es:"Lo conocen como el rey de la salsa.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:50,start:445.788,end:455.996,es:"La empresa dio a conocer su nuevo producto ayer.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:51,start:455.996,end:467.143,es:"Mañana van a dar a conocer los resultados del examen.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:52,start:467.143,end:477.095,es:"El pueblo es conocido como la capital del café.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:53,start:477.095,end:487.879,es:"El libro ayudó a dar a conocer la historia de la región.",group:"conocido y dar a conocer",group_index:6,level:"B1"},{i:54,start:489.379,end:497.261,es:"Conozco muy bien a mi hermana.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A1"},{i:55,start:497.261,end:509.645,es:"Mi vecina me conoce de vista porque paso por su calle todos los días.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A2"},{i:56,start:509.645,end:519.213,es:"Lo conozco de vista, pero nunca hemos hablado.",group:"conocer bien, de vista, a fondo",group_index:7,level:"A2"},{i:57,start:519.213,end:527.096,es:"Ella conoce el tema a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:58,start:527.096,end:537.325,es:"Antes de decidir, quiero conocer el proyecto a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:59,start:537.325,end:547.768,es:"No lo conocía bien, pero parecía una buena persona.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:60,start:547.768,end:559.384,es:"Para trabajar aquí, es necesario que conozcas bien el sistema.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"},{i:61,start:559.384,end:569.4,es:"Después de tantos viajes, conoce el país a fondo.",group:"conocer bien, de vista, a fondo",group_index:7,level:"B1"}],Yn={word:Sn,slug:Tn,kind:Pn,hash:Cn,duration:Hn,voice:Qn,marks:Dn},Vn="dar",On="dar",In="word",Fn="74093b64869ae221",Rn=528.888,Un="dora",Gn=[{i:0,start:.5,end:8.447,es:"Te doy mi número de teléfono.",group:"dar, entregar",group_index:0,level:"A1"},{i:1,start:8.447,end:16.009,es:"¿Me das un vaso de agua?",group:"dar, entregar",group_index:0,level:"A1"},{i:2,start:16.009,end:25.151,es:"Mi abuela me da dinero en mi cumpleaños.",group:"dar, entregar",group_index:0,level:"A1"},{i:3,start:25.151,end:33.545,es:"El profesor nos da mucha tarea.",group:"dar, entregar",group_index:0,level:"A1"},{i:4,start:33.545,end:41.023,es:"¿Le das de comer al gato?",group:"dar, entregar",group_index:0,level:"A1"},{i:5,start:41.023,end:47.113,es:"Dame la mano.",group:"dar, entregar",group_index:0,level:"A1"},{i:6,start:47.113,end:56.489,es:"Los vecinos nos dan fruta de su jardín.",group:"dar, entregar",group_index:0,level:"A1"},{i:7,start:56.489,end:63.199,es:"¿Qué le damos a mamá?",group:"dar, entregar",group_index:0,level:"A1"},{i:8,start:63.199,end:70.612,es:"¿Me das la sal, por favor?",group:"dar, entregar",group_index:0,level:"A1"},{i:9,start:72.112,end:79.845,es:"Te doy las gracias por todo.",group:"dar las gracias",group_index:1,level:"A1"},{i:10,start:79.845,end:88.816,es:"Siempre damos las gracias al conductor.",group:"dar las gracias",group_index:1,level:"A1"},{i:11,start:88.816,end:97.552,es:"Quiero darle las gracias a tu madre.",group:"dar las gracias",group_index:1,level:"A1"},{i:12,start:97.552,end:104.667,es:"Hay que dar las gracias.",group:"dar las gracias",group_index:1,level:"A1"},{i:13,start:104.667,end:112.72,es:"Le di las gracias por el regalo.",group:"dar las gracias",group_index:1,level:"A2"},{i:14,start:112.72,end:121.136,es:"Los niños no dieron las gracias.",group:"dar las gracias",group_index:1,level:"A2"},{i:15,start:122.636,end:130.263,es:"Le di un beso a mi abuela.",group:"di, dio, daba",group_index:2,level:"A2"},{i:16,start:130.263,end:138.231,es:"Mi jefe me dio el día libre.",group:"di, dio, daba",group_index:2,level:"A2"},{i:17,start:138.231,end:145.751,es:"¿Quién te dio esa noticia?",group:"di, dio, daba",group_index:2,level:"A2"},{i:18,start:145.751,end:155.041,es:"Nos dieron una habitación con vista al mar.",group:"di, dio, daba",group_index:2,level:"A2"},{i:19,start:155.041,end:164.332,es:"Mi padre siempre me daba buenos consejos.",group:"di, dio, daba",group_index:2,level:"A2"},{i:20,start:164.332,end:172.193,es:"El médico me dio una receta.",group:"di, dio, daba",group_index:2,level:"A2"},{i:21,start:172.193,end:181.484,es:"Le dimos un regalo a nuestra profesora.",group:"di, dio, daba",group_index:2,level:"A2"},{i:22,start:182.984,end:191.293,es:"Después de comer, damos un paseo.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A1"},{i:23,start:191.293,end:200.499,es:"Mis abuelos dan un paseo cada tarde.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A1"},{i:24,start:200.499,end:209.469,es:"Vamos a dar una vuelta por el centro.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:25,start:209.469,end:218.141,es:"¿Quieres dar una vuelta en bicicleta?",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:26,start:218.141,end:226.472,es:"Ayer dimos un paseo por la playa.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:27,start:226.472,end:234.717,es:"Voy a dar una vuelta con el perro.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:28,start:234.717,end:244.691,es:"Dimos una vuelta por el mercado antes de cenar.",group:"dar una vuelta, dar un paseo",group_index:3,level:"A2"},{i:29,start:246.191,end:253.476,es:"Me dan miedo las arañas.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:30,start:253.476,end:261.721,es:"A mi hijo le da miedo la oscuridad.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:31,start:261.721,end:270.18,es:"Me da vergüenza hablar en público.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:32,start:270.18,end:279.023,es:"¿No te da vergüenza llegar tan tarde?",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:33,start:279.023,end:287.375,es:"Me da pena ver a ese perro solo.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:34,start:287.375,end:296.047,es:"Nos dio mucha pena dejar la ciudad.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:35,start:296.047,end:304.42,es:"Esa película me dio mucho miedo.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:36,start:304.42,end:313.711,es:"Le da vergüenza bailar delante de todos.",group:"dar miedo, vergüenza, pena",group_index:4,level:"A2"},{i:37,start:315.211,end:321.259,es:"Me da igual.",group:"dar igual",group_index:5,level:"A1"},{i:38,start:321.259,end:329.099,es:"¿Pizza o pasta? Me da igual.",group:"dar igual",group_index:5,level:"A1"},{i:39,start:329.099,end:338.539,es:"Nos da igual el precio, queremos un buen hotel.",group:"dar igual",group_index:5,level:"A2"},{i:40,start:338.539,end:346.485,es:"¿Te da igual si vamos mañana?",group:"dar igual",group_index:5,level:"A2"},{i:41,start:346.485,end:355.691,es:"Antes me importaba, pero ahora me da igual.",group:"dar igual",group_index:5,level:"A2"},{i:42,start:355.691,end:363.147,es:"Da igual, no pasa nada.",group:"dar igual",group_index:5,level:"A2"},{i:43,start:363.147,end:372.629,es:"A ella le da igual lo que piensen los demás.",group:"dar igual",group_index:5,level:"B1"},{i:44,start:374.129,end:380.241,es:"¡Date prisa!",group:"darse prisa",group_index:6,level:"A1"},{i:45,start:380.241,end:388.7,es:"Dense prisa, el tren sale ahora.",group:"darse prisa",group_index:6,level:"A2"},{i:46,start:388.7,end:398.055,es:"Si no nos damos prisa, vamos a llegar tarde.",group:"darse prisa",group_index:6,level:"A2"},{i:47,start:398.055,end:406.129,es:"Me di prisa y llegué a tiempo.",group:"darse prisa",group_index:6,level:"A2"},{i:48,start:406.129,end:414.161,es:"No hace falta que te des prisa.",group:"darse prisa",group_index:6,level:"B1"},{i:49,start:415.661,end:422.904,es:"No me di cuenta de la hora.",group:"darse cuenta",group_index:7,level:"A2"},{i:50,start:422.904,end:431.021,es:"¿Te diste cuenta de que no estaba?",group:"darse cuenta",group_index:7,level:"A2"},{i:51,start:431.021,end:439.139,es:"Me di cuenta demasiado tarde.",group:"darse cuenta",group_index:7,level:"A2"},{i:52,start:439.139,end:449.752,es:"De repente me di cuenta de que había perdido las llaves.",group:"darse cuenta",group_index:7,level:"B1"},{i:53,start:449.752,end:457.677,es:"Nadie se dio cuenta del error.",group:"darse cuenta",group_index:7,level:"B1"},{i:54,start:457.677,end:466.392,es:"Cuando te des cuenta, ya será tarde.",group:"darse cuenta",group_index:7,level:"B1"},{i:55,start:466.392,end:475.725,es:"Es importante que se den cuenta del problema.",group:"darse cuenta",group_index:7,level:"B1"},{i:56,start:475.725,end:484.589,es:"Por fin me he dado cuenta de lo que quiero.",group:"darse cuenta",group_index:7,level:"B1"},{i:57,start:486.089,end:493.289,es:"La ventana da al mar.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:58,start:493.289,end:502.047,es:"Mi habitación da a un patio tranquilo.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:59,start:502.047,end:511.06,es:"Queremos una habitación que dé a la calle.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:60,start:511.06,end:519.817,es:"La puerta de la cocina da al jardín.",group:"dar a, mirar hacia",group_index:8,level:"B1"},{i:61,start:519.817,end:528.831,es:"El balcón daba a una plaza muy bonita.",group:"dar a, mirar hacia",group_index:8,level:"B1"}],Kn={word:Vn,slug:On,kind:In,hash:Fn,duration:Rn,voice:Un,marks:Gn},Wn="dejar",Jn="dejar",Xn="word",Zn="44b22db257e758e9",el=484.368,al="dora",ol=[{i:0,start:.5,end:7.465,es:"Deja tu abrigo aquí.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:1,start:7.465,end:14.729,es:"¿Dónde dejo las llaves?",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:2,start:14.729,end:21.951,es:"Dejo el auto en la calle.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:3,start:21.951,end:30.132,es:"Siempre dejo la ventana abierta.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:4,start:30.132,end:38.164,es:"Deja los zapatos en la puerta.",group:"dejar algo en un lugar",group_index:0,level:"A1"},{i:5,start:38.164,end:45.897,es:"Dejé el teléfono en casa.",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:6,start:45.897,end:53.375,es:"¿Dónde dejaste mi libro?",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:7,start:53.375,end:62.324,es:"Te dejé un poco de pastel en la cocina.",group:"dejar algo en un lugar",group_index:0,level:"A2"},{i:8,start:63.824,end:71.024,es:"¿Me dejas ir al baño?",group:"dejar, permitir",group_index:1,level:"A1"},{i:9,start:71.024,end:76.944,es:"Déjame ver.",group:"dejar, permitir",group_index:1,level:"A1"},{i:10,start:76.944,end:84.784,es:"Mi madre no me deja salir.",group:"dejar, permitir",group_index:1,level:"A1"},{i:11,start:84.784,end:91.557,es:"Déjame ayudarte.",group:"dejar, permitir",group_index:1,level:"A1"},{i:12,start:91.557,end:99.44,es:"El ruido no me deja dormir.",group:"dejar, permitir",group_index:1,level:"A1"},{i:13,start:99.44,end:107.728,es:"¿Me dejas usar tu computadora?",group:"dejar, permitir",group_index:1,level:"A1"},{i:14,start:107.728,end:118.725,es:"Mis padres nunca me dejaban ver televisión de noche.",group:"dejar, permitir",group_index:1,level:"A2"},{i:15,start:118.725,end:127.248,es:"No me dejaron entrar sin entrada.",group:"dejar, permitir",group_index:1,level:"A2"},{i:16,start:128.748,end:135.351,es:"No me dejes solo.",group:"dejar a alguien",group_index:2,level:"A1"},{i:17,start:135.351,end:142.209,es:"Te dejo en la esquina.",group:"dejar a alguien",group_index:2,level:"A1"},{i:18,start:142.209,end:148.727,es:"Mi novia me dejó.",group:"dejar a alguien",group_index:2,level:"A2"},{i:19,start:148.727,end:156.695,es:"Dejé a los niños con mi madre.",group:"dejar a alguien",group_index:2,level:"A2"},{i:20,start:156.695,end:164.833,es:"Mi padre me dejó en la estación.",group:"dejar a alguien",group_index:2,level:"A2"},{i:21,start:164.833,end:174.124,es:"Él la dejó después de cinco años juntos.",group:"dejar a alguien",group_index:2,level:"A2"},{i:22,start:174.124,end:182.263,es:"Nunca voy a dejar a mis amigos.",group:"dejar a alguien",group_index:2,level:"A2"},{i:23,start:183.763,end:190.109,es:"¡Deja de gritar!",group:"dejar de + infinitivo",group_index:3,level:"A1"},{i:24,start:190.109,end:198.248,es:"Dejé de fumar el año pasado.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:25,start:198.248,end:206.003,es:"Por fin ha dejado de llover.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:26,start:206.003,end:215.229,es:"Mi hermano dejó de trabajar en el banco.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:27,start:215.229,end:224.2,es:"Tienes que dejar de comer tanto azúcar.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:28,start:224.2,end:234.088,es:"Cuando nació mi hijo, dejé de salir por la noche.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:29,start:234.088,end:242.76,es:"Quiero dejar de preocuparme por todo.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:30,start:242.76,end:250.579,es:"El reloj dejó de funcionar.",group:"dejar de + infinitivo",group_index:3,level:"A2"},{i:31,start:252.079,end:259.812,es:"Dejé mi trabajo en marzo.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:32,start:259.812,end:267.396,es:"Ella dejó la universidad.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:33,start:267.396,end:274.468,es:"Quiero dejar el café.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:34,start:274.468,end:283.737,es:"Dejamos el gimnasio porque era muy caro.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:35,start:283.737,end:293.22,es:"Mi abuelo dejó el tabaco hace diez años.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:36,start:293.22,end:301.337,es:"No pienso dejar mis estudios.",group:"dejar un trabajo o un hábito",group_index:4,level:"A2"},{i:37,start:302.837,end:310.571,es:"El bebé no deja de llorar.",group:"no dejar de",group_index:5,level:"A2"},{i:38,start:310.571,end:319.968,es:"Mi vecino no dejó de hablar en toda la cena.",group:"no dejar de",group_index:5,level:"A2"},{i:39,start:319.968,end:328.043,es:"No dejes de visitar el mercado.",group:"no dejar de",group_index:5,level:"B1"},{i:40,start:328.043,end:335.349,es:"No dejo de pensar en ti.",group:"no dejar de",group_index:5,level:"B1"},{i:41,start:335.349,end:344.363,es:"No dejen de probar la sopa de la casa.",group:"no dejar de",group_index:5,level:"B1"},{i:42,start:344.363,end:352.715,es:"No dejes de llamarme cuando llegues.",group:"no dejar de",group_index:5,level:"B1"},{i:43,start:352.715,end:362.325,es:"Aunque esté cansado, no deja de ir al gimnasio.",group:"no dejar de",group_index:5,level:"B1"},{i:44,start:363.825,end:372.263,es:"Deja la puerta cerrada, por favor.",group:"dejar + participio o adjetivo",group_index:6,level:"A2"},{i:45,start:372.263,end:379.591,es:"Dejé la cena preparada.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:46,start:379.591,end:387.836,es:"La noticia me dejó preocupado.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:47,start:387.836,end:396.017,es:"Dejamos todo listo para el viaje.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:48,start:396.017,end:403.879,es:"El examen me dejó agotado.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:49,start:403.879,end:412.145,es:"El viaje nos dejó muy contentos.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:50,start:412.145,end:420.775,es:"Ya dejé pagada la cuenta del hotel.",group:"dejar + participio o adjetivo",group_index:6,level:"B1"},{i:51,start:422.275,end:430.371,es:"Sin querer, dejé caer el plato.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:52,start:430.371,end:437.336,es:"Déjalo, no importa.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:53,start:437.336,end:444.515,es:"Deja eso para mañana.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:54,start:444.515,end:450.819,es:"Déjame en paz.",group:"expresiones con dejar",group_index:7,level:"A2"},{i:55,start:450.819,end:458.403,es:"Deja que lo piense un poco.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:56,start:458.403,end:466.541,es:"Dejemos el tema para otro día.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:57,start:466.541,end:476.344,es:"No dejes para mañana lo que puedas hacer hoy.",group:"expresiones con dejar",group_index:7,level:"B1"},{i:58,start:476.344,end:484.312,es:"Eso deja mucho que desear.",group:"expresiones con dejar",group_index:7,level:"B1"}],rl={word:Wn,slug:Jn,kind:Xn,hash:Zn,duration:el,voice:al,marks:ol},sl="echar",nl="echar",ll="word",il="39d2fdde137efae2",tl=520.584,ul="dora",dl=[{i:0,start:.5,end:7.785,es:"Echa la pelota al perro.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:1,start:7.785,end:15.455,es:"Echo la carta en el buzón.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:2,start:15.455,end:23.956,es:"Los niños echan piedras al río.",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:3,start:23.956,end:31.881,es:"¿Puedes echar esto a la basura?",group:"echar, lanzar algo",group_index:0,level:"A1"},{i:4,start:31.881,end:39.444,es:"Ella echa pan a los patos.",g
