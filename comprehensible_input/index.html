vel:"A2"},{i:23,start:197.921,end:207.34,es:"Los dos trabajos son igual de importantes.",group:"igual de + adjetivo",group_index:2,level:"A2"},{i:24,start:208.84,end:215.08,es:"Me da igual.",group:"me da igual y es igual",group_index:3,level:"A1"},{i:25,start:215.08,end:222.259,es:"Me da igual el color.",group:"me da igual y es igual",group_index:3,level:"A1"},{i:26,start:222.259,end:230.035,es:"Da igual, mañana lo hacemos.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:27,start:230.035,end:238.429,es:"A mi padre le da igual la música.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:28,start:238.429,end:246.909,es:"¿Te da igual comer en casa o fuera?",group:"me da igual y es igual",group_index:3,level:"A2"},{i:29,start:246.909,end:254.344,es:"Es igual, no pasa nada.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:30,start:254.344,end:261.757,es:"Nos da igual el lugar.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:31,start:261.757,end:269.853,es:"A ellos les da igual el precio.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:32,start:269.853,end:279.165,es:"Ese día me daba igual perder el partido.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:33,start:279.165,end:286.344,es:"A mí no me da igual.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:34,start:286.344,end:294.931,es:"Da igual si llueve, vamos a salir.",group:"me da igual y es igual",group_index:3,level:"A2"},{i:35,start:296.431,end:305.081,es:"La madre quiere a sus hijos por igual.",group:"por igual",group_index:4,level:"A2"},{i:36,start:305.081,end:313.263,es:"Dividimos la cuenta por igual.",group:"por igual",group_index:4,level:"A2"},{i:37,start:313.263,end:322.788,es:"En casa repartimos las tareas por igual.",group:"por igual",group_index:4,level:"B1"},{i:38,start:322.788,end:330.799,es:"La ley es para todos por igual.",group:"por igual",group_index:4,level:"B1"},{i:39,start:330.799,end:341.241,es:"Las ganancias se reparten por igual entre los socios.",group:"por igual",group_index:4,level:"B1"},{i:40,start:341.241,end:349.679,es:"El calor afecta a todos por igual.",group:"por igual",group_index:4,level:"B1"},{i:41,start:351.179,end:359.467,es:"Al igual que tú, prefiero el campo.",group:"al igual que",group_index:5,level:"B1"},{i:42,start:359.467,end:367.691,es:"Al igual que su padre, es médico.",group:"al igual que",group_index:5,level:"B1"},{i:43,start:367.691,end:378.411,es:"Al igual que el año pasado, vamos a la playa en agosto.",group:"al igual que",group_index:5,level:"B1"},{i:44,start:378.411,end:388.64,es:"Ella, al igual que su hermano, habla tres idiomas.",group:"al igual que",group_index:5,level:"B1"},{i:45,start:388.64,end:398.976,es:"Al igual que muchas personas, trabajo desde casa.",group:"al igual que",group_index:5,level:"B1"},{i:46,start:398.976,end:408.032,es:"Al igual que ayer, el tren llegó tarde.",group:"al igual que",group_index:5,level:"B1"},{i:47,start:408.032,end:418.304,es:"Al igual que en otros países, aquí la comida es cara.",group:"al igual que",group_index:5,level:"B1"},{i:48,start:419.804,end:427.004,es:"Igual llueve mañana.",group:"igual: quizás",group_index:6,level:"B1"},{i:49,start:427.004,end:435.484,es:"Igual vamos al cine esta noche.",group:"igual: quizás",group_index:6,level:"B1"},{i:50,start:435.484,end:443.239,es:"Igual no viene a la fiesta.",group:"igual: quizás",group_index:6,level:"B1"},{i:51,start:443.239,end:451.121,es:"Llámalo, igual está en casa.",group:"igual: quizás",group_index:6,level:"B1"},{i:52,start:451.121,end:458.193,es:"Igual tienes razón.",group:"igual: quizás",group_index:6,level:"B1"},{i:53,start:458.193,end:466.46,es:"Igual llegamos un poco tarde.",group:"igual: quizás",group_index:6,level:"B1"},{i:54,start:466.46,end:474.428,es:"No sé, igual me quedo en casa.",group:"igual: quizás",group_index:6,level:"B1"},{i:55,start:474.428,end:483.207,es:"Pregunta en la tienda, igual lo tienen.",group:"igual: quizás",group_index:6,level:"B1"},{i:56,start:484.707,end:493.507,es:"Es un lugar de una belleza sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:57,start:493.507,end:502.648,es:"Tiene un talento sin igual para la música.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:58,start:502.648,end:510.531,es:"Esta comida no tiene igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:59,start:510.531,end:518.477,es:"Fue una experiencia sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:60,start:518.477,end:527.853,es:"Mi abuela tenía una paciencia sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:61,start:527.853,end:535.587,es:"Es un cantante sin igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"},{i:62,start:535.587,end:545.304,es:"La vista desde esta montaña no tiene igual.",group:"sin igual y no tener igual",group_index:7,level:"B1"}],Jd={word:Id,slug:Fd,kind:Rd,hash:Ud,duration:Gd,voice:Kd,marks:Wd},Xd="llevar",Zd="llevar",ep="word",ap="e4742b608301140e",op=504,rp="santa",sp=[{i:0,start:.5,end:8.511,es:"Llevo una mochila muy pesada.",group:"llevar, cargar",group_index:0,level:"A1"},{i:1,start:8.511,end:14.708,es:"¿Llevas dinero?",group:"llevar, cargar",group_index:0,level:"A1"},{i:2,start:14.708,end:21.737,es:"Yo llevo las bolsas.",group:"llevar, cargar",group_index:0,level:"A1"},{i:3,start:21.737,end:29.833,es:"Siempre llevo agua en el auto.",group:"llevar, cargar",group_index:0,level:"A1"},{i:4,start:29.833,end:37.972,es:"¿Puedes llevar la sopa a la mesa?",group:"llevar, cargar",group_index:0,level:"A1"},{i:5,start:37.972,end:46.495,es:"Mi padre lleva la maleta grande.",group:"llevar, cargar",group_index:0,level:"A1"},{i:6,start:46.495,end:54.121,es:"Llevé el pastel a la fiesta.",group:"llevar, cargar",group_index:0,level:"A2"},{i:7,start:54.121,end:62.367,es:"No llevaba el pasaporte encima.",group:"llevar, cargar",group_index:0,level:"A2"},{i:8,start:63.867,end:71.579,es:"Hoy llevo un vestido rojo.",group:"llevar ropa",group_index:1,level:"A1"},{i:9,start:71.579,end:80.187,es:"Mi abuelo lleva una corbata azul.",group:"llevar ropa",group_index:1,level:"A1"},{i:10,start:80.187,end:87.792,es:"¿Qué vas a llevar a la boda?",group:"llevar ropa",group_index:1,level:"A1"},{i:11,start:87.792,end:95.611,es:"Ella siempre lleva sombrero.",group:"llevar ropa",group_index:1,level:"A1"},{i:12,start:95.611,end:103.792,es:"Llevas una camisa muy bonita.",group:"llevar ropa",group_index:1,level:"A1"},{i:13,start:103.792,end:112.101,es:"El niño lleva zapatos nuevos.",group:"llevar ropa",group_index:1,level:"A1"},{i:14,start:112.101,end:120.368,es:"En verano llevo ropa ligera.",group:"llevar ropa",group_index:1,level:"A1"},{i:15,start:120.368,end:128.955,es:"Ayer llevaba una chaqueta negra.",group:"llevar ropa",group_index:1,level:"A2"},{i:16,start:130.455,end:137.1,es:"Te llevo a casa.",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:17,start:137.1,end:144.812,es:"Llevo a mis hijos a la escuela.",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:18,start:144.812,end:152.225,es:"¿Me llevas al aeropuerto?",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:19,start:152.225,end:160.407,es:"Este autobús te lleva al centro.",group:"llevar a alguien a un lugar",group_index:2,level:"A1"},{i:20,start:160.407,end:168.289,es:"Mi madre me llevó al médico.",group:"llevar a alguien a un lugar",group_index:2,level:"A2"},{i:21,start:168.289,end:177.644,es:"Te voy a llevar a un restaurante muy bueno.",group:"llevar a alguien a un lugar",group_index:2,level:"A2"},{i:22,start:177.644,end:187.404,es:"Llevamos al perro al parque todas las mañanas.",group:"llevar a alguien a un lugar",group_index:2,level:"A2"},{i:23,start:188.904,end:196.36,es:"Llevo dos años aquí.",group:"llevar tiempo",group_index:3,level:"A2"},{i:24,start:196.36,end:205.352,es:"¿Cuánto tiempo llevas en esta ciudad?",group:"llevar tiempo",group_index:3,level:"A2"},{i:25,start:205.352,end:213.256,es:"Llevamos una hora en la fila.",group:"llevar tiempo",group_index:3,level:"A2"},{i:26,start:213.256,end:222.696,es:"Mis padres llevan treinta años casados.",group:"llevar tiempo",group_index:3,level:"A2"},{i:27,start:222.696,end:231.56,es:"Ella lleva tres meses en la empresa.",group:"llevar tiempo",group_index:3,level:"A2"},{i:28,start:231.56,end:240.04,es:"Este trabajo lleva mucho tiempo.",group:"llevar tiempo",group_index:3,level:"A2"},{i:29,start:240.04,end:249.331,es:"Preparar la cena me llevó toda la tarde.",group:"llevar tiempo",group_index:3,level:"A2"},{i:30,start:250.831,end:258.287,es:"Llevo una hora esperando.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:31,start:258.287,end:266.532,es:"Llevamos todo el día caminando.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:32,start:266.532,end:275.823,es:"¿Cuánto tiempo llevas estudiando español?",group:"llevar + gerundio",group_index:4,level:"A2"},{i:33,start:275.823,end:284.751,es:"Lleva tres días lloviendo sin parar.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:34,start:284.751,end:292.911,es:"Llevo meses buscando trabajo.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:35,start:292.911,end:302.863,es:"Mi vecino lleva toda la mañana haciendo ruido.",group:"llevar + gerundio",group_index:4,level:"A2"},{i:36,start:302.863,end:313.284,es:"Cuando lo conocí, llevaba dos años viviendo solo.",group:"llevar + gerundio",group_index:4,level:"B1"},{i:37,start:314.784,end:322.816,es:"Me llevo muy bien con mi hermana.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:38,start:322.816,end:330.379,es:"Mis padres se llevan bien.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:39,start:330.379,end:338.069,es:"No me llevo bien con mi jefe.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:40,start:338.069,end:347.296,es:"Los dos gatos no se llevan nada bien.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:41,start:347.296,end:355.755,es:"¿Te llevas bien con tus compañeros?",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:42,start:355.755,end:364.085,es:"De niños nos llevábamos muy mal.",group:"llevarse bien o mal",group_index:5,level:"A2"},{i:43,start:364.085,end:372.693,es:"Espero que te lleves bien con ellos.",group:"llevarse bien o mal",group_index:5,level:"B1"},{i:44,start:374.193,end:381.393,es:"¿Me lo llevo o lo dejo?",group:"llevarse algo",group_index:6,level:"A2"},{i:45,start:381.393,end:389.703,es:"Me llevo esta camisa, por favor.",group:"llevarse algo",group_index:6,level:"A2"},{i:46,start:389.703,end:397.521,es:"Alguien se llevó mi paraguas.",group:"llevarse algo",group_index:6,level:"A2"},{i:47,start:397.521,end:405.681,es:"Me llevé una sorpresa enorme.",group:"llevarse algo",group_index:6,level:"B1"},{i:48,start:405.681,end:413.5,es:"El viento se llevó las hojas.",group:"llevarse algo",group_index:6,level:"B1"},{i:49,start:413.5,end:422.812,es:"Nos llevamos un buen susto con la tormenta.",group:"llevarse algo",group_index:6,level:"B1"},{i:50,start:422.812,end:432.039,es:"No te lleves mi cargador, que lo necesito.",group:"llevarse algo",group_index:6,level:"B1"},{i:51,start:432.039,end:440.689,es:"El ladrón se llevó todas las joyas.",group:"llevarse algo",group_index:6,level:"B1"},{i:52,start:442.189,end:451.224,es:"Mi hermano siempre me lleva la contraria.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:53,start:451.224,end:459.768,es:"Ella lleva la cuenta de los gastos.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:54,start:459.768,end:468.803,es:"Mi abuela lleva una vida muy tranquila.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:55,start:468.803,end:477.475,es:"Este camino no lleva a ninguna parte.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:56,start:477.475,end:486.104,es:"No te dejes llevar por los nervios.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:57,start:486.104,end:493.645,es:"Yo te llevo tres años.",group:"expresiones con llevar",group_index:7,level:"B1"},{i:58,start:493.645,end:503.939,es:"Ellos llevan la empresa juntos desde hace años.",group:"expresiones con llevar",group_index:7,level:"B1"}],np={word:Xd,slug:Zd,kind:ep,hash:ap,duration:op,voice:rp,marks:sp},lp="lo",ip="lo",tp="word",up="52f569cf56093705",dp=496.752,pp="santa",gp=[{i:0,start:.5,end:10.196,es:"¿Conoces a Pedro? Sí, lo conozco del trabajo.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:1,start:10.196,end:18.015,es:"¿El café? Lo tomo sin azúcar.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:2,start:18.015,end:27.049,es:"Mi hermano está en casa, lo llamo ahora.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:3,start:27.049,end:35.465,es:"Este vestido es bonito, lo compro.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:4,start:35.465,end:44.329,es:"No encuentro mi teléfono, ¿lo tienes tú?",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:5,start:44.329,end:52.98,es:"El pan está aquí, lo pongo en la mesa.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:6,start:52.98,end:63.188,es:"Mi abuelo vive lejos, pero lo visito los domingos.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:7,start:63.188,end:72.116,es:"El auto está sucio, lo lavo mañana.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:8,start:72.116,end:80.041,es:"¿Dónde está el perro? No lo veo.",group:"lo, a él o a eso",group_index:0,level:"A1"},{i:9,start:81.541,end:87.184,es:"No lo sé.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:10,start:87.184,end:92.912,es:"Ya lo sé.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:11,start:92.912,end:99.728,es:"Lo sé, tienes razón.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:12,start:99.728,end:108.272,es:"¿Sabes dónde vive Ana? No, no lo sé.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:13,start:108.272,end:114.192,es:"No lo creo.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:14,start:114.192,end:120.837,es:"Lo siento mucho.",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:15,start:120.837,end:126.907,es:"¿Lo entiendes?",group:"lo sé, no lo sé",group_index:1,level:"A1"},{i:16,start:126.907,end:133.019,es:"Te lo prometo.",group:"lo sé, no lo sé",group_index:1,level:"A2"},{i:17,start:134.519,end:141.932,es:"Voy a comprarlo mañana.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:18,start:141.932,end:149.729,es:"¿Puedes repetirlo, por favor?",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:19,start:149.729,end:157.036,es:"Quiero verlo otra vez.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:20,start:157.036,end:163.767,es:"Tómalo, es para ti.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:21,start:163.767,end:171.223,es:"Pruébalo, está muy rico.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:22,start:171.223,end:178.017,es:"Estoy pensándolo.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:23,start:178.017,end:187.287,es:"Tengo que terminarlo antes del viernes.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:24,start:187.287,end:194.039,es:"Ábrelo con cuidado.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:25,start:194.039,end:202.22,es:"Necesito leerlo dos veces.",group:"comprarlo, tómalo",group_index:2,level:"A2"},{i:26,start:203.72,end:211.603,es:"Lo que necesito es dormir.",group:"lo que",group_index:3,level:"A2"},{i:27,start:211.603,end:219.059,es:"No entiendo lo que dices.",group:"lo que",group_index:3,level:"A2"},{i:28,start:219.059,end:226.771,es:"Esto es lo que compré ayer.",group:"lo que",group_index:3,level:"A2"},{i:29,start:226.771,end:235.208,es:"Lo que más me gusta es la playa.",group:"lo que",group_index:3,level:"A2"},{i:30,start:235.208,end:241.725,es:"Dime lo que pasó.",group:"lo que",group_index:3,level:"A2"},{i:31,start:241.725,end:250.035,es:"Lo que pasa es que estoy cansado.",group:"lo que",group_index:3,level:"A2"},{i:32,start:250.035,end:258.216,es:"Gracias por todo lo que hiciste.",group:"lo que",group_index:3,level:"A2"},{i:33,start:258.216,end:265.544,es:"No sé lo que voy a hacer.",group:"lo que",group_index:3,level:"A2"},{i:34,start:265.544,end:273.491,es:"Todo lo que dijo era verdad.",group:"lo que",group_index:3,level:"A2"},{i:35,start:273.491,end:280.029,es:"Haz lo que quieras.",group:"lo que",group_index:3,level:"B1"},{i:36,start:281.529,end:288.388,es:"Yo quiero lo mismo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A1"},{i:37,start:288.388,end:295.887,es:"A lo mejor llueve mañana.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:38,start:295.887,end:303.321,es:"A lo mejor tienes razón.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:39,start:303.321,end:310.607,es:"Siempre dice lo mismo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:40,start:310.607,end:317.103,es:"Me da lo mismo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:41,start:317.103,end:324.303,es:"Por lo menos come algo.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:42,start:324.303,end:333.551,es:"Llegamos tarde, pero por lo menos llegamos.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:43,start:333.551,end:342.201,es:"Necesito por lo menos dos horas.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:44,start:342.201,end:350.511,es:"Por lo general, desayuno en casa.",group:"a lo mejor, lo mismo, por lo menos",group_index:4,level:"A2"},{i:45,start:352.011,end:359.253,es:"Lo bueno es que hace sol.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:46,start:359.253,end:366.325,es:"Lo malo es el precio.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:47,start:366.325,end:374.613,es:"Lo importante es estar juntos.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:48,start:374.613,end:382.965,es:"Lo mejor del viaje fue la comida.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:49,start:382.965,end:389.845,es:"Lo peor ya pasó.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:50,start:389.845,end:397.429,es:"Lo difícil es empezar.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:51,start:397.429,end:405.888,es:"Lo más importante es la salud.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:52,start:405.888,end:414.027,es:"Lo raro es que nadie contestó.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:53,start:414.027,end:422.699,es:"Lo bueno de esta ciudad es el clima.",group:"lo bueno, lo importante",group_index:5,level:"A2"},{i:54,start:424.199,end:432.999,es:"No sabes lo rápido que corre mi hija.",group:"lo rápido que",group_index:6,level:"B1"},{i:55,start:432.999,end:442.097,es:"Me sorprende lo bien que hablas español.",group:"lo rápido que",group_index:6,level:"B1"},{i:56,start:442.097,end:450.044,es:"Mira lo grande que está tu hijo.",group:"lo rápido que",group_index:6,level:"B1"},{i:57,start:450.044,end:458.887,es:"No te imaginas lo cansada que estoy.",group:"lo rápido que",group_index:6,level:"B1"},{i:58,start:458.887,end:468.796,es:"Ya ves lo difícil que es encontrar trabajo.",group:"lo rápido que",group_index:6,level:"B1"},{i:59,start:468.796,end:477.34,es:"Es increíble lo caro que está todo.",group:"lo rápido que",group_index:6,level:"B1"},{i:60,start:477.34,end:486.887,es:"Me encanta lo tranquilo que es este barrio.",group:"lo rápido que",group_index:6,level:"B1"},{i:61,start:486.887,end:496.689,es:"Todavía recuerdo lo feliz que estaba ese día.",group:"lo rápido que",group_index:6,level:"B1"}],cp={word:lp,slug:ip,kind:tp,hash:up,duration:dp,voice:pp,marks:gp},vp="mismo",mp="mismo",_p="word",xp="91c8f4637368302b",Ap=469.152,hp="santa",bp=[{i:0,start:.5,end:7.935,es:"Tenemos el mismo libro.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:1,start:7.935,end:15.775,es:"Vivimos en la misma calle.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:2,start:15.775,end:24.489,es:"Siempre como en el mismo restaurante.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:3,start:24.489,end:33.844,es:"Mi hermano y yo tenemos los mismos ojos.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:4,start:33.844,end:42.815,es:"Ellas trabajan en la misma oficina.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:5,start:42.815,end:50.932,es:"Es la misma canción de ayer.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:6,start:50.932,end:59.071,es:"Llevas la misma camisa que yo.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:7,start:59.071,end:66.527,es:"Nacimos el mismo año.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:8,start:68.027,end:74.672,es:"Para mí, lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:9,start:74.672,end:82.064,es:"Siempre dices lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:10,start:82.064,end:90.011,es:"Yo quiero lo mismo, por favor.",group:"lo mismo",group_index:1,level:"A1"},{i:11,start:90.011,end:98.192,es:"Todos los días hago lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:12,start:98.192,end:104.624,es:"No es lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:13,start:104.624,end:111.909,es:"Pienso lo mismo que tú.",group:"lo mismo",group_index:1,level:"A1"},{i:14,start:111.909,end:120.645,es:"Me pasó lo mismo la semana pasada.",group:"lo mismo",group_index:1,level:"A2"},{i:15,start:122.145,end:128.812,es:"Ven ahora mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A1"},{i:16,start:128.812,end:136.524,es:"Ahora mismo estoy ocupado.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A1"},{i:17,start:136.524,end:143.575,es:"Te espero aquí mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:18,start:143.575,end:150.732,es:"Lo envío hoy mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:19,start:150.732,end:160.044,es:"El hotel está ahí mismo, al lado del parque.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:20,start:160.044,end:167.905,es:"Voy a llamarla ahora mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:21,start:167.905,end:176.833,es:"Puedes dejar las bolsas aquí mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:22,start:176.833,end:184.247,es:"Ayer mismo hablé con él.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:23,start:185.747,end:192.541,es:"Yo mismo lo hice.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:24,start:192.541,end:199.827,es:"Ella misma me lo dijo.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:25,start:199.827,end:207.389,es:"Lo puedo hacer yo misma.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:26,start:207.389,end:216.104,es:"Nosotros mismos pintamos la casa.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:27,start:216.104,end:225.075,es:"El director mismo vino a saludarnos.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:28,start:225.075,end:231.763,es:"Hazlo tú mismo.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:29,start:231.763,end:240.925,es:"Ellos mismos prepararon toda la comida.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:30,start:242.425,end:249.988,es:"Llegamos al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:31,start:249.988,end:258.212,es:"No hablen todos al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:32,start:258.212,end:268.505,es:"Puedo cocinar y escuchar música al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:33,start:268.505,end:278.073,es:"Sonaron los dos teléfonos al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:34,start:278.073,end:288.388,es:"Es difícil estudiar y trabajar al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:35,start:288.388,end:297.636,es:"Quiero ir, pero al mismo tiempo tengo miedo.",group:"al mismo tiempo",group_index:4,level:"B1"},{i:36,start:299.136,end:307.531,es:"Gano lo mismo que el año pasado.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:37,start:307.531,end:316.629,es:"Este vestido cuesta lo mismo que el otro.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:38,start:316.629,end:325.707,es:"Ella tiene la misma edad que mi hermana.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:39,start:325.707,end:334.827,es:"Mi casa es del mismo color que la tuya.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:40,start:334.827,end:342.965,es:"Hoy hace el mismo calor que ayer.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:41,start:342.965,end:352.981,es:"Estudiamos en la misma escuela que nuestros padres.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:42,start:354.481,end:360.977,es:"Me da lo mismo.",group:"da lo mismo",group_index:6,level:"A2"},{i:43,start:360.977,end:368.412,es:"¿Té o café? Me da lo mismo.",group:"da lo mismo",group_index:6,level:"A2"},{i:44,start:368.412,end:376.273,es:"Da lo mismo si llegas tarde.",group:"da lo mismo",group_index:6,level:"B1"},{i:45,start:376.273,end:385.5,es:"Le da lo mismo lo que piensen los demás.",group:"da lo mismo",group_index:6,level:"B1"},{i:46,start:385.5,end:394.193,es:"A mí me da lo mismo dónde comamos.",group:"da lo mismo",group_index:6,level:"B1"},{i:47,start:394.193,end:402.033,es:"Da lo mismo, ya no importa.",group:"da lo mismo",group_index:6,level:"B1"},{i:48,start:402.033,end:410.407,es:"Nos da lo mismo ir hoy o mañana.",group:"da lo mismo",group_index:6,level:"B1"},{i:49,start:411.907,end:419.427,es:"Solo piensa en sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:50,start:419.427,end:427.501,es:"Ella habla mucho de sí misma.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:51,start:427.501,end:435.469,es:"Ella cree mucho en sí misma.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:52,start:435.469,end:444.248,es:"El problema en sí mismo no es grave.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:53,start:444.248,end:451.683,es:"Él se ríe de sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:54,start:451.683,end:460.099,es:"Él no sabe cuidarse a sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:55,start:460.099,end:469.091,es:"Mi abuelo está muy seguro de sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"}],qp={word:vp,slug:mp,kind:_p,hash:xp,duration:Ap,voice:hp,marks:bp},fp="pasar",yp="pasar",jp="word",Bp="72f77762cfb358cd",zp=483.696,Mp="santa",Ep=[{i:0,start:.5,end:8.767,es:"Pasa, pasa, estás en tu casa.",group:"pasar, entrar",group_index:0,level:"A1"},{i:1,start:8.767,end:14.879,es:"¿Puedo pasar?",group:"pasar, entrar",group_index:0,level:"A1"},{i:2,start:14.879,end:21.588,es:"Pasen, por favor.",group:"pasar, entrar",group_index:0,level:"A1"},{i:3,start:21.588,end:29.172,es:"Pase, la doctora lo espera.",group:"pasar, entrar",group_index:0,level:"A1"},{i:4,start:29.172,end:36.863,es:"No se puede pasar por aquí.",group:"pasar, entrar",group_index:0,level:"A1"},{i:5,start:36.863,end:44.425,es:"Déjame pasar, por favor.",group:"pasar, entrar",group_index:0,level:"A1"},{i:6,start:45.925,end:51.717,es:"¿Qué pasa?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:7,start:51.717,end:57.488,es:"¿Qué pasó?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:8,start:57.488,end:63.877,es:"No pasa nada.",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:9,start:63.877,end:70.075,es:"¿Qué te pasa?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:10,start:70.075,end:78.256,es:"Algo le pasa a mi computadora.",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:11,start:78.256,end:85.051,es:"¿Qué le pasa al bebé?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:12,start:85.051,end:93.147,es:"Esto siempre me pasa los lunes.",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:13,start:93.147,end:102.224,es:"Ayer pasó algo muy raro en la oficina.",group:"pasar, ocurrir",group_index:1,level:"A2"},{i:14,start:102.224,end:109.723,es:"¿Qué te ha pasado en la mano?",group:"pasar, ocurrir",group_index:1,level:"A2"},{i:15,start:111.223,end:120.044,es:"El autobús pasa cada diez minutos.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:16,start:120.044,end:127.82,es:"Paso por tu casa a las seis.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:17,start:127.82,end:135.788,es:"Este tren pasa por mi pueblo.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:18,start:135.788,end:144.844,es:"Pasamos por el parque de camino a casa.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:19,start:144.844,end:152.62,es:"Ayer pasé por la panadería.",group:"pasar por un lugar",group_index:2,level:"A2"},{i:20,start:152.62,end:163.34,es:"¿Puedes pasar por el supermercado después del trabajo?",group:"pasar por un lugar",group_index:2,level:"A2"},{i:21,start:163.34,end:171.927,es:"Un perro pasó corriendo por la calle.",group:"pasar por un lugar",group_index:2,level:"A2"},{i:22,start:173.427,end:181.928,es:"Paso mucho tiempo con mi familia.",group:"pasar el tiempo",group_index:3,level:"A1"},{i:23,start:181.928,end:190.173,es:"Pasamos el verano en la playa.",group:"pasar el tiempo",group_index:3,level:"A1"},{i:24,start:190.173,end:197.587,es:"Pasé la tarde leyendo.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:25,start:197.587,end:205.341,es:"¿Dónde pasaste la Navidad?",group:"pasar el tiempo",group_index:3,level:"A2"},{i:26,start:205.341,end:214.717,es:"Ella pasa horas delante de la computadora.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:27,start:214.717,end:224.136,es:"Hemos pasado una semana increíble en Perú.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:28,start:224.136,end:233.64,es:"Voy a pasar el fin de semana con mis abuelos.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:29,start:235.14,end:241.807,es:"¡Que lo pases bien!",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:30,start:241.807,end:250.137,es:"Lo pasamos muy bien en la fiesta.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:31,start:250.137,end:259.535,es:"Los niños lo pasaron genial en el parque.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:32,start:259.535,end:268.505,es:"Lo pasé muy mal en el viaje en barco.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:33,start:268.505,end:276.879,es:"¿Lo pasaste bien en el concierto?",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:34,start:276.879,end:286.319,es:"Mi abuela lo pasó mal cuando estuvo enferma.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:35,start:286.319,end:294.521,es:"Siempre lo pasamos bien juntos.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:36,start:296.021,end:304.053,es:"El tiempo pasa muy rápido.",group:"el tiempo pasa",group_index:5,level:"A1"},{i:37,start:304.053,end:311.573,es:"Ya pasaron tres años.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:38,start:311.573,end:320.267,es:"Pasaron muchos días sin noticias.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:39,start:320.267,end:329.387,es:"Han pasado diez minutos y no ha llegado.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:40,start:329.387,end:337.312,es:"Con los años, el dolor pasa.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:41,start:337.312,end:344.448,es:"Ya pasó la tormenta.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:42,start:344.448,end:354.549,es:"Cuando pase el invierno, vamos a pintar la casa.",group:"el tiempo pasa",group_index:5,level:"B1"},{i:43,start:356.049,end:362.823,es:"¿Me pasas la sal?",group:"pasar algo a alguien",group_index:6,level:"A1"},{i:44,start:362.823,end:370.577,es:"Pásame el agua, por favor.",group:"pasar algo a alguien",group_index:6,level:"A1"},{i:45,start:370.577,end:378.716,es:"Te paso el número de mi hermano.",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:46,start:378.716,end:386.748,es:"Le pasé el balón a mi amigo.",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:47,start:386.748,end:394.951,es:"¿Me pasaste las fotos del viaje?",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:48,start:394.951,end:403.665,es:"Ya le he pasado el mensaje a mi jefe.",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:49,start:405.165,end:414.691,es:"Pasé el examen de matemáticas a la primera.",group:"expresiones con pasar",group_index:7,level:"A2"},{i:50,start:414.691,end:423.213,es:"Me pasé de parada en el autobús.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:51,start:423.213,end:431.587,es:"Ya se me pasó el dolor de cabeza.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:52,start:431.587,end:438.979,es:"No te pases con la sal.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:53,start:438.979,end:447.949,es:"Se me pasó llamarte, lo siento mucho.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:54,start:447.949,end:458.243,es:"Pasamos por momentos difíciles el año pasado.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:55,start:458.243,end:466.637,es:"Ojalá que no le pase nada malo.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:56,start:466.637,end:475.288,es:"Pase lo que pase, yo estoy contigo.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:57,start:475.288,end:483.64,es:"Esa canción ya pasó de moda.",group:"expresiones con pasar",group_index:7,level:"B1"}],$p={word:fp,slug:yp,kind:jp,hash:Bp,duration:zp,voice:Mp,marks:Ep},kp="poner(se)",Np="poner_se",wp="word",Lp="c8d3b28a98dcc480",Sp=539.688,Tp="santa",Pp=[{i:0,start:.5,end:8.041,es:"Pon las llaves en la mesa.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:1,start:8.041,end:15.369,es:"¿Dónde pongo mi abrigo?",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:2,start:15.369,end:24.063,es:"Pongo la leche en el refrigerador.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:3,start:24.063,end:32.223,es:"Ella pone las flores en el agua.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:4,start:32.223,end:40.233,es:"No pongas los pies en el sofá.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:5,start:40.233,end:48.564,es:"Pon los zapatos debajo de la cama.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:6,start:48.564,end:56.319,es:"¿Pusiste azúcar en mi café?",group:"poner algo en un lugar",group_index:0,level:"A2"},{i:7,start:56.319,end:63.924,es:"Puse tu libro en la mochila.",group:"poner algo en un lugar",group_index:0,level:"A2"},{i:8,start:65.424,end:71.515,es:"¿Pongo la tele?",group:"poner la tele, la música",group_index:1,level:"A1"},{i:9,start:71.515,end:78.821,es:"Pon música, por favor.",group:"poner la tele, la música",group_index:1,level:"A1"},{i:10,start:78.821,end:87.557,es:"Mi padre pone la radio por la mañana.",group:"poner la tele, la música",group_index:1,level:"A1"},{i:11,start:87.557,end:95.269,es:"¿Puedes poner la calefacción?",group:"poner la tele, la música",group_index:1,level:"A1"},{i:12,start:95.269,end:103.173,es:"Pon el ventilador, por favor.",group:"poner la tele, la música",group_index:1,level:"A1"},{i:13,start:103.173,end:111.184,es:"Puse el despertador a las seis.",group:"poner la tele, la música",group_index:1,level:"A2"},{i:14,start:111.184,end:119.515,es:"Pon una película, estoy aburrido.",group:"poner la tele, la música",group_index:1,level:"A2"},{i:15,start:119.515,end:130.021,es:"Voy a poner el aire acondicionado, hace mucho calor.",group:"poner la tele, la música",group_index:1,level:"A2"},{i:16,start:131.521,end:139.383,es:"Pon la mesa, vamos a comer.",group:"poner la mesa",group_index:2,level:"A1"},{i:17,start:139.383,end:147.756,es:"Yo pongo la mesa y tú cocinas.",group:"poner la mesa",group_index:2,level:"A1"},{i:18,start:147.756,end:155.233,es:"¿Quién pone la mesa hoy?",group:"poner la mesa",group_index:2,level:"A1"},{i:19,start:155.233,end:164.78,es:"Los niños ponen la mesa todas las noches.",group:"poner la mesa",group_index:2,level:"A1"},{i:20,start:164.78,end:173.473,es:"Ayúdame a poner la mesa, por favor.",group:"poner la mesa",group_index:2,level:"A1"},{i:21,start:173.473,end:181.484,es:"Ya puse la mesa para la cena.",group:"poner la mesa",group_index:2,level:"A2"},{i:22,start:182.984,end:190.675,es:"Ponte el abrigo, hace frío.",group:"ponerse ropa",group_index:3,level:"A1"},{i:23,start:190.675,end:197.789,es:"Me pongo los zapatos.",group:"ponerse ropa",group_index:3,level:"A1"},{i:24,start:197.789,end:206.611,es:"Ella siempre se pone un vestido rojo.",group:"ponerse ropa",group_index:3,level:"A1"},{i:25,start:206.611,end:214.813,es:"Ponte el cinturón de seguridad.",group:"ponerse ropa",group_index:3,level:"A1"},{i:26,start:214.813,end:223.507,es:"No me pongo esos pantalones nunca.",group:"ponerse ropa",group_index:3,level:"A1"},{i:27,start:223.507,end:231.88,es:"¿Qué te vas a poner para la fiesta?",group:"ponerse ropa",group_index:3,level:"A2"},{i:28,start:231.88,end:240.253,es:"Hoy me puse la camisa de mi hermano.",group:"ponerse ropa",group_index:3,level:"A2"},{i:29,start:240.253,end:249.053,es:"Los niños ya se pusieron el pijama.",group:"ponerse ropa",group_index:3,level:"A2"},{i:30,start:250.553,end:258.329,es:"Le pusieron Ana a la niña.",group:"poner nombre",group_index:4,level:"A2"},{i:31,start:258.329,end:266.788,es:"¿Qué nombre le vas a poner al perro?",group:"poner nombre",group_index:4,level:"A2"},{i:32,start:266.788,end:275.119,es:"Le pusimos Luna a nuestra gata.",group:"poner nombre",group_index:4,level:"A2"},{i:33,start:275.119,end:284.815,es:"Mis padres me pusieron el nombre de mi abuelo.",group:"poner nombre",group_index:4,level:"A2"},{i:34,start:284.815,end:293.807,es:"Todavía no le han puesto nombre al bebé.",group:"poner nombre",group_index:4,level:"A2"},{i:35,start:293.807,end:303.609,es:"¿Por qué le pusieron ese nombre al restaurante?",group:"poner nombre",group_index:4,level:"A2"},{i:36,start:303.609,end:313.988,es:"En el colegio le pusieron un apodo muy gracioso.",group:"poner nombre",group_index:4,level:"B1"},{i:37,start:315.488,end:324.501,es:"Me pongo nervioso antes de un examen.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:38,start:324.501,end:334.24,es:"Mi madre se puso muy contenta con la noticia.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:39,start:334.24,end:342.848,es:"El cielo se puso gris de repente.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:40,start:342.848,end:350.603,es:"Cuando la vio, se puso rojo.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:41,start:350.603,end:357.568,es:"No te pongas triste.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:42,start:357.568,end:367.499,es:"Mi abuela se puso enferma el invierno pasado.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:43,start:367.499,end:376.448,es:"Se pone de mal humor cuando tiene hambre.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:44,start:376.448,end:384.864,es:"Me puse muy feliz cuando llamaste.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:45,start:386.364,end:395.121,es:"De repente, el bebé se puso a llorar.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:46,start:395.121,end:404.177,es:"Cuando llegué a casa, me puse a cocinar.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:47,start:404.177,end:413.191,es:"Se puso a llover justo cuando salimos.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:48,start:413.191,end:422.225,es:"Ponte a estudiar, mañana tienes examen.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:49,start:422.225,end:432.497,es:"Después de cenar, nos pusimos a jugar a las cartas.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:50,start:432.497,end:441.937,es:"Si me pongo a ver la tele, no termino nunca.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:51,start:441.937,end:453.02,es:"Mi hermano se pone a cantar en la ducha todas las mañanas.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:52,start:453.02,end:462.908,es:"Quiero que te pongas a trabajar ahora mismo.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:53,start:464.408,end:472.141,es:"Nunca nos ponemos de acuerdo.",group:"ponerse de acuerdo",group_index:7,level:"A2"},{i:54,start:472.141,end:481.923,es:"Al final nos pusimos de acuerdo sobre el viaje.",group:"ponerse de acuerdo",group_index:7,level:"A2"},{i:55,start:481.923,end:492.195,es:"Tenemos que ponernos de acuerdo antes del viernes.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:56,start:492.195,end:501.379,es:"Es difícil que todos se pongan de acuerdo.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:57,start:501.379,end:510.435,es:"¿Ya se pusieron de acuerdo sobre el precio?",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:58,start:510.435,end:521.56,es:"Mis padres no se ponen de acuerdo sobre el nombre del perro.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:59,start:521.56,end:530.339,es:"Ojalá nos pongamos de acuerdo pronto.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:60,start:530.339,end:539.629,es:"Si no se ponen de acuerdo, no habrá fiesta.",group:"ponerse de acuerdo",group_index:7,level:"B1"}],Cp={word:kp,slug:Np,kind:wp,hash:Lp,duration:Sp,voice:Tp,marks:Pp},Hp="por / para",Qp="por_para",Dp="word",Yp="9f3e7d96aab7be28",Vp=511.008,Op="santa",Ip=[{i:0,start:.5,end:7.508,es:"Estudio para aprender.",group:"para: finalidad",group_index:0,level:"A1"},{i:1,start:7.508,end:14.537,es:"Trabajo para vivir.",group:"para: finalidad",group_index:0,level:"A1"},{i:2,start:14.537,end:23.103,es:"Voy al mercado para comprar fruta.",group:"para: finalidad",group_index:0,level:"A1"},{i:3,start:23.103,end:31.241,es:"Necesito dinero para el viaje.",group:"para: finalidad",group_index:0,level:"A1"},{i:4,start:31.241,end:39.209,es:"Esta caja es para los libros.",group:"para: finalidad",group_index:0,level:"A1"},{i:5,start:39.209,end:46.239,es:"¿Para qué sirve esto?",group:"para: finalidad",group_index:0,level:"A1"},{i:6,start:46.239,end:54.484,es:"Me levanto temprano para correr.",group:"para: finalidad",group_index:0,level:"A1"},{i:7,start:54.484,end:62.26,es:"Ahorro para comprar una casa.",group:"para: finalidad",group_index:0,level:"A2"},{i:8,start:63.76,end:71.152,es:"Este regalo es para ti.",group:"para: destinatario",group_index:1,level:"A1"},{i:9,start:71.152,end:78.971,es:"Las flores son para mi madre.",group:"para: destinatario",group_index:1,level:"A1"},{i:10,start:78.971,end:86.128,es:"¿Para quién es el café?",group:"para: destinatario",group_index:1,level:"A1"},{i:11,start:86.128,end:93.776,es:"Hay una carta para usted.",group:"para: destinatario",group_index:1,level:"A1"},{i:12,start:93.776,end:102.064,es:"Trabaja para una empresa grande.",group:"para: destinatario",group_index:1,level:"A1"},{i:13,start:102.064,end:109.307,es:"Hice la cena para todos.",group:"para: destinatario",group_index:1,level:"A2"},{i:14,start:110.807,end:118.796,es:"Mañana salimos para la playa.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:15,start:118.796,end:127.447,es:"El tren para Quito sale a las ocho.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:16,start:127.447,end:135.521,es:"¿Este autobús va para el centro?",group:"para: destino y plazo",group_index:2,level:"A2"},{i:17,start:135.521,end:143.959,es:"Necesito el informe para el lunes.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:18,start:143.959,end:151.372,es:"La tarea es para mañana.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:19,start:151.372,end:159.404,es:"Para las seis ya estoy en casa.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:20,start:159.404,end:167.735,es:"Para el verano quiero hablar mejor.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:21,start:169.235,end:177.8,es:"Para mí, esta película es aburrida.",group:"para mí: opinión",group_index:3,level:"A2"},{i:22,start:177.8,end:186.429,es:"Para ella, la familia es lo primero.",group:"para mí: opinión",group_index:3,level:"A2"},{i:23,start:186.429,end:194.845,es:"Para mi gusto, hay demasiada sal.",group:"para mí: opinión",group_index:3,level:"A2"},{i:24,start:194.845,end:204.563,es:"Para nosotros, el domingo es el mejor día.",group:"para mí: opinión",group_index:3,level:"A2"},{i:25,start:204.563,end:213.427,es:"Para un niño tan pequeño, lee muy bien.",group:"para mí: opinión",group_index:3,level:"B1"},{i:26,start:213.427,end:222.227,es:"Hace mucho calor para ser diciembre.",group:"para mí: opinión",group_index:3,level:"B1"},{i:27,start:223.727,end:230.799,es:"Gracias por la comida.",group:"por: causa",group_index:4,level:"A1"},{i:28,start:230.799,end:237.743,es:"Perdón por la espera.",group:"por: causa",group_index:4,level:"A1"},{i:29,start:237.743,end:243.961,es:"Lo hice por ti.",group:"por: causa",group_index:4,level:"A2"},{i:30,start:243.961,end:251.311,es:"No salimos por la lluvia.",group:"por: causa",group_index:4,level:"A2"},{i:31,start:251.311,end:259.172,es:"Llegué tarde por el tráfico.",group:"por: causa",group_index:4,level:"A2"},{i:32,start:259.172,end:266.863,es:"Está cansado por el viaje.",group:"por: causa",group_index:4,level:"A2"},{i:33,start:266.863,end:274.98,es:"Me preocupo mucho por mi hijo.",group:"por: causa",group_index:4,level:"A2"},{i:34,start:276.48,end:283.659,es:"Caminamos por el parque.",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:35,start:283.659,end:290.88,es:"Estudio por la mañana.",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:36,start:290.88,end:297.888,es:"Hablamos por teléfono.",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:37,start:297.888,end:305.323,es:"¿Hay una farmacia por aquí?",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:38,start:305.323,end:313.312,es:"El gato entró por la ventana.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:39,start:313.312,end:321.259,es:"Paso por tu casa a las cinco.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:40,start:321.259,end:329.141,es:"Te mando las fotos por correo.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:41,start:329.141,end:337.024,es:"Viví en Perú por dos años.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:42,start:338.524,end:346.599,es:"Te cambio mi libro por el tuyo.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:43,start:346.599,end:354.737,es:"Pagamos mucho por esta casa.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:44,start:354.737,end:363.687,es:"Vendió su auto por muy poco dinero.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:45,start:363.687,end:372.487,es:"Cambié la camisa por una más grande.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:46,start:372.487,end:380.369,es:"Mañana trabajo yo por ti.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:47,start:380.369,end:388.849,es:"¿Cuánto pagaste por esa chaqueta?",group:"por: cambio y precio",group_index:6,level:"A2"},{i:48,start:390.349,end:397.891,es:"Por favor, cierra la puerta.",group:"por fin, por eso, por favor",group_index:7,level:"A1"},{i:49,start:397.891,end:404.707,es:"¡Por fin llegaste!",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:50,start:404.707,end:412.717,es:"Por supuesto que puedes venir.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:51,start:412.717,end:420.92,es:"Estaba enfermo, por eso no vine.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:52,start:420.92,end:428.931,es:"Por cierto, ¿viste a Juan ayer?",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:53,start:428.931,end:436.344,es:"Por ahora todo está bien.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:54,start:436.344,end:443.971,es:"Por suerte, no pasó nada.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:55,start:445.471,end:454.569,es:"Salí por la mañana para llegar temprano.",group:"por y para juntos",group_index:8,level:"B1"},{i:56,start:454.569,end:462.089,es:"Lo hice por ti, no para mí.",group:"por y para juntos",group_index:8,level:"B1"},{i:57,start:462.089,end:471.38,es:"Pasamos por Lima para visitar a mis tíos.",group:"por y para juntos",group_index:8,level:"B1"},{i:58,start:471.38,end:480.991,es:"Te llamo por teléfono para confirmar la hora.",group:"por y para juntos",group_index:8,level:"B1"},{i:59,start:480.991,end:490.601,es:"Estudia por las noches para aprobar el examen.",group:"por y para juntos",group_index:8,level:"B1"},{i:60,start:490.601,end:501.215,es:"Gracias por el regalo, es perfecto para mi casa nueva.",group:"por y para juntos",group_index:8,level:"B1"},{i:61,start:501.215,end:510.953,es:"Para llegar al hotel, hay que pasar por el puente.",group:"por y para juntos",group_index:8,level:"B1"}],Fp={word:Hp,slug:Qp,kind:Dp,hash:Yp,duration:Vp,voice:Op,marks:Ip},Rp="que",Up="que",Gp="word",Kp="5c7975541d89f36c",Wp=494.28,Jp="santa",Xp=[{i:0,start:.5,end:8.233,es:"Tengo que trabajar mañana.",group:"tener que, hay que",group_index:0,level:"A1"},{i:1,start:8.233,end:15.967,es:"Tienes que probar esta sopa.",group:"tener que, hay que",group_index:0,level:"A1"},{i:2,start:15.967,end:23.081,es:"Hay que salir temprano.",group:"tener que, hay que",group_index:0,level:"A1"},{i:3,start:23.081,end:30.452,es:"Tenemos que comprar pan.",group:"tener que, hay que",group_index:0,level:"A1"},{i:4,start:30.452,end:37.865,es:"Hay que pagar en efectivo.",group:"tener que, hay que",group_index:0,level:"A1"},{i:5,start:37.865,end:44.34,es:"¿Tienes que ir hoy?",group:"tener que, hay que",group_index:0,level:"A1"},{i:6,start:44.34,end:52.244,es:"Mis hijos tienen que estudiar.",group:"tener que, hay que",group_index:0,level:"A1"},{i:7,start:52.244,end:60.34,es:"Hay que tener cuidado con el perro.",group:"tener que, hay que",group_index:0,level:"A1"},{i:8,start:61.84,end:69.979,es:"La chica que canta es mi prima.",group:"el libro que leí",group_index:1,level:"A1"},{i:9,start:69.979,end:78.117,es:"Tengo un amigo que vive en Chile.",group:"el libro que leí",group_index:1,level:"A1"},{i:10,start:78.117,end:86.384,es:"El tren que va a Lima sale ahora.",group:"el libro que leí",group_index:1,level:"A1"},{i:11,start:86.384,end:94.992,es:"Es una película que me gusta mucho.",group:"el libro que leí",group_index:1,level:"A1"},{i:12,start:94.992,end:105.221,es:"Las personas que trabajan aquí son muy amables.",group:"el libro que leí",group_index:1,level:"A1"},{i:13,start:105.221,end:113.189,es:"El libro que leí es muy bueno.",group:"el libro que leí",group_index:1,level:"A2"},{i:14,start:113.189,end:121.648,es:"La casa que compramos es pequeña.",group:"el libro que leí",group_index:1,level:"A2"},{i:15,start:121.648,end:130.789,es:"¿Dónde está la camisa que me regalaste?",group:"el libro que leí",group_index:1,level:"A2"},{i:16,start:130.789,end:140.507,es:"El restaurante que te recomendé está cerrado.",group:"el libro que leí",group_index:1,level:"A2"},{i:17,start:142.007,end:149.143,es:"Creo que va a llover.",group:"creo que",group_index:2,level:"A1"},{i:18,start:149.143,end:156.364,es:"Dice que está cansado.",group:"creo que",group_index:2,level:"A1"},{i:19,start:156.364,end:163.756,es:"Pienso que tienes razón.",group:"creo que",group_index:2,level:"A1"},{i:20,start:163.756,end:170.487,es:"Sé que es difícil.",group:"creo que",group_index:2,level:"A1"},{i:21,start:170.487,end:177.879,es:"Parece que no hay nadie.",group:"creo que",group_index:2,level:"A1"},{i:22,start:177.879,end:184.311,es:"Supongo que sí.",group:"creo que",group_index:2,level:"A1"},{i:23,start:184.311,end:192.065,es:"Estoy seguro de que lo sabe.",group:"creo que",group_index:2,level:"A2"},{i:24,start:192.065,end:199.969,es:"Me dijo que no podía venir.",group:"creo que",group_index:2,level:"A2"},{i:25,start:199.969,end:207.297,es:"Veo que ya terminaste.",group:"creo que",group_index:2,level:"A2"},{i:26,start:208.797,end:216.957,es:"Mi hermano es más alto que yo.",group:"más que, menos que",group_index:3,level:"A1"},{i:27,start:216.957,end:225.373,es:"Este auto es más caro que el otro.",group:"más que, menos que",group_index:3,level:"A2"},{i:28,start:225.373,end:233.149,es:"Hoy hace menos frío que ayer.",group:"más que, menos que",group_index:3,level:"A2"},{i:29,start:233.149,end:241.587,es:"Me gusta más el té que el café.",group:"más que, menos que",group_index:3,level:"A2"},{i:30,start:241.587,end:249.747,es:"Corre más rápido que su padre.",group:"más que, menos que",group_index:3,level:"A2"},{i:31,start:249.747,end:257.693,es:"Ella trabaja más que nadie.",group:"más que, menos que",group_index:3,level:"A2"},{i:32,start:257.693,end:265.917,es:"La película es peor que el libro.",group:"más que, menos que",group_index:3,level:"A2"},{i:33,start:265.917,end:273.565,es:"Ahora gana menos que antes.",group:"más que, menos que",group_index:3,level:"A2"},{i:34,start:273.565,end:281.341,es:"Más vale tarde que nunca.",group:"más que, menos que",group_index:3,level:"A2"},{i:35,start:282.841,end:289.956,es:"Es que no tengo tiempo.",group:"es que",group_index:4,level:"A2"},{i:36,start:289.956,end:298.073,es:"Lo siento, es que estaba ocupado.",group:"es que",group_index:4,level:"A2"},{i:37,start:298.073,end:306.276,es:"No puedo ir, es que estoy enfermo.",group:"es que",group_index:4,level:"A2"},{i:38,start:306.276,end:313.348,es:"¿Es que no me escuchas?",group:"es que",group_index:4,level:"A2"},{i:39,start:313.348,end:320.484,es:"Es que no sabía nada.",group:"es que",group_index:4,level:"A2"},{i:40,start:320.484,end:328.964,es:"Perdón, es que había mucho tráfico.",group:"es que",group_index:4,level:"A2"},{i:41,start:328.964,end:336.633,es:"Es que hoy no me siento bien.",group:"es que",group_index:4,level:"A2"},{i:42,start:338.133,end:346.869,es:"Estaba cansado, así que me acosté.",group:"así que, ya que",group_index:5,level:"A2"},{i:43,start:346.869,end:355.584,es:"Está lloviendo, así que no salimos.",group:"así que, ya que",group_index:5,level:"A2"},{i:44,start:355.584,end:364.149,es:"Ya que estás aquí, ayúdame con esto.",group:"así que, ya que",group_index:5,level:"B1"},{i:45,start:364.149,end:372.779,es:"Ya que tienes tiempo, ¿vamos al cine?",group:"así que, ya que",group_index:5,level:"B1"},{i:46,start:374.279,end:381.905,es:"Quiero que vengas a mi casa.",group:"quiero que vengas",group_index:6,level:"B1"},{i:47,start:381.905,end:388.828,es:"Espero que te guste.",group:"quiero que vengas",group_index:6,level:"B1"},{i:48,start:388.828,end:396.412,es:"Necesito que me ayudes.",group:"quiero que vengas",group_index:6,level:"B1"},{i:49,start:396.412,end:404.657,es:"Es importante que duermas bien.",group:"quiero que vengas",group_index:6,level:"B1"},{i:50,start:404.657,end:412.54,es:"Prefiero que hablemos mañana.",group:"quiero que vengas",group_index:6,level:"B1"},{i:51,start:412.54,end:421.639,es:"Mi madre quiere que la llame todos los días.",group:"quiero que vengas",group_index:6,level:"B1"},{i:52,start:421.639,end:429.308,es:"Es mejor que salgamos ya.",group:"quiero que vengas",group_index:6,level:"B1"},{i:53,start:429.308,end:436.807,es:"No creo que llegue a tiempo.",group:"quiero que vengas",group_index:6,level:"B1"},{i:54,start:438.307,end:445.08,es:"¡Que te vaya bien!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:55,start:445.08,end:451.448,es:"Que descanses.",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:56,start:451.448,end:458.733,es:"¡Que tengas buen viaje!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:57,start:458.733,end:465.827,es:"¡Que te mejores pronto!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:58,start:465.827,end:472.877,es:"¡Que sean muy felices!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:59,start:472.877,end:479.416,es:"Que duermas bien.",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:60,start:479.416,end:486.744,es:"¡Que disfrutes la fiesta!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:61,start:486.744,end:494.221,es:"¡Que cumplas muchos más!",group:"¡que te vaya bien!",group_index:7,level:"B1"}],Zp={word:Rp,slug:Up,kind:Gp,hash:Kp,duration:Wp,voice:Jp,marks:Xp},eg="quedar(se)",ag="quedar_se",og="word",rg="e56f3553d4521723",sg=493.656,ng="santa",lg=[{i:0,start:.5,end:7.38,es:"Hoy me quedo en casa.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:1,start:7.38,end:14.111,es:"¿Te quedas a cenar?",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:2,start:14.111,end:22.441,es:"Nos quedamos en un hotel pequeño.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:3,start:22.441,end:30.772,es:"Mi hermana se queda con nosotros.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:4,start:30.772,end:38.185,es:"Quédate aquí un momento.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:5,start:38.185,end:46.025,es:"Prefiero quedarme en la cama.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:6,start:46.025,end:55.316,es:"Ayer nos quedamos en la playa todo el día.",group:"quedarse en un lugar",group_index:0,level:"A2"},{i:7,start:55.316,end:64.884,es:"Me quedé dos semanas en casa de mis abuelos.",group:"quedarse en un lugar",group_index:0,level:"A2"},{i:8,start:66.384,end:73.499,es:"¿Dónde queda el museo?",group:"quedar, estar situado",group_index:1,level:"A1"},{i:9,start:73.499,end:81.125,es:"El banco queda muy cerca.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:10,start:81.125,end:89.456,es:"Mi casa queda lejos del centro.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:11,start:89.456,end:98.384,es:"La farmacia queda al lado del mercado.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:12,start:98.384,end:105.776,es:"¿Queda lejos la estación?",group:"quedar, estar situado",group_index:1,level:"A1"},{i:13,start:105.776,end:114.512,es:"La escuela queda a dos calles de aquí.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:14,start:114.512,end:123.483,es:"El restaurante queda enfrente del parque.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:15,start:124.983,end:132.268,es:"Queda un poco de café.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:16,start:132.268,end:138.785,es:"No queda leche.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:17,start:138.785,end:146.071,es:"¿Cuánto dinero te queda?",group:"quedar, sobrar",group_index:2,level:"A1"},{i:18,start:146.071,end:153.655,es:"Solo quedan dos asientos.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:19,start:153.655,end:162.241,es:"Quedan cinco minutos para el final.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:20,start:162.241,end:170.956,es:"Me quedan tres días de vacaciones.",group:"quedar, sobrar",group_index:2,level:"A2"},{i:21,start:170.956,end:179.841,es:"No quedaba nada en el refrigerador.",group:"quedar, sobrar",group_index:2,level:"A2"},{i:22,start:179.841,end:188.407,es:"Todavía nos queda mucho trabajo.",group:"quedar, sobrar",group_index:2,level:"A2"},{i:23,start:189.907,end:198.131,es:"Esa camisa te queda muy bien.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:24,start:198.131,end:206.589,es:"Estos zapatos me quedan pequeños.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:25,start:206.589,end:214.216,es:"El vestido le queda grande.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:26,start:214.216,end:221.971,es:"¿Cómo me queda este sombrero?",group:"quedar bien o mal",group_index:3,level:"A2"},{i:27,start:221.971,end:230.6,es:"El azul te queda mejor que el rojo.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:28,start:230.6,end:238.888,es:"Los pantalones ya no me quedan.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:29,start:238.888,end:246.6,es:"Quedé muy mal con mi jefe.",group:"quedar bien o mal",group_index:3,level:"B1"},{i:30,start:246.6,end:254.824,es:"Quiero quedar bien con tus padres.",group:"quedar bien o mal",group_index:3,level:"B1"},{i:31,start:256.324,end:263.759,es:"La sopa quedó muy rica.",group:"quedar, resultado",group_index:4,level:"A2"},{i:32,start:263.759,end:271.983,es:"¡Qué bonita quedó tu habitación!",group:"quedar, resultado",group_index:4,level:"A2"},{i:33,start:271.983,end:279.652,es:"La casa quedó muy limpia.",group:"quedar, resultado",group_index:4,level:"A2"},{i:34,start:279.652,end:288.708,es:"La puerta quedó abierta toda la noche.",group:"quedar, resultado",group_index:4,level:"A2"},{i:35,start:288.708,end:298.959,es:"Con la pintura nueva, la cocina quedó como nueva.",group:"quedar, resultado",group_index:4,level:"A2"},{i:36,start:298.959,end:307.631,es:"Mi dibujo no quedó como yo quería.",group:"quedar, resultado",group_index:4,level:"A2"},{i:37,start:307.631,end:317.625,es:"Después de la tormenta, la calle quedó sin luz.",group:"quedar, resultado",group_index:4,level:"B1"},{i:38,start:319.125,end:327.584,es:"Me quedé sorprendido con la noticia.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:39,start:327.584,end:335.701,es:"Se quedó dormido en el sofá.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:40,start:335.701,end:343.392,es:"El niño se quedó callado.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:41,start:343.392,end:352.789,es:"Nos quedamos sin gasolina en la carretera.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:42,start:352.789,end:362.421,es:"Mi abuela se quedó sola después de la mudanza.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:43,start:362.421,end:371.221,es:"Me quedé mirando el mar un buen rato.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:44,start:371.221,end:380.341,es:"Se quedaron hablando hasta la medianoche.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:45,start:380.341,end:389.589,es:"Si sigues así, te vas a quedar sin amigos.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"B1"},{i:46,start:391.089,end:398.972,es:"Me quedo con la camisa verde.",group:"quedarse con algo",group_index:6,level:"A2"},{i:47,start:398.972,end:405.895,es:"Quédate con el cambio.",group:"quedarse con algo",group_index:6,level:"A2"},{i:48,start:405.895,end:414.097,es:"Mi hermano se quedó con mi libro.",group:"quedarse con algo",group_index:6,level:"A2"},{i:49,start:414.097,end:422.087,es:"¿Te puedes quedar con mis llaves?",group:"quedarse con algo",group_index:6,level:"A2"},{i:50,start:422.087,end:432.764,es:"Al final nos quedamos con el apartamento más grande.",group:"quedarse con algo",group_index:6,level:"B1"},{i:51,start:434.264,end:442.211,es:"Quedamos en vernos el lunes.",group:"quedar en algo",group_index:7,level:"B1"},{i:52,start:442.211,end:451.459,es:"Habíamos quedado en llamarnos esta tarde.",group:"quedar en algo",group_index:7,level:"B1"},{i:53,start:451.459,end:460.536,es:"Quedaron en traer la comida a la fiesta.",group:"quedar en algo",group_index:7,level:"B1"},{i:54,start:460.536,end:468.44,es:"¿En qué quedamos, vienes o no?",group:"quedar en algo",group_index:7,level:"B1"},{i:55,start:468.44,end:477.816,es:"Quedé en ayudar a mi vecino con la mudanza.",group:"quedar en algo",group_index:7,level:"B1"},{i:56,start:477.816,end:484.589,es:"Todo quedó en nada.",group:"quedar en algo",group_index:7,level:"B1"},{i:57,start:484.589,end:493.603,es:"Quedamos en encontrarnos en la plaza.",group:"quedar en algo",group_index:7,level:"B1"}],ig={word:eg,slug:ag,kind:og,hash:rg,duration:sg,voice:ng,marks:lg},tg="sacar",ug="sacar",dg="word",pg="f2e0614af1b84d40",gg=532.872,cg="santa",vg=[{i:0,start:.5,end:8.916,es:"Saca la leche del refrigerador.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:1,start:8.916,end:17.14,es:"Ella saca un libro de la mochila.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:2,start:17.14,end:25.919,es:"¿Puedes sacar los platos del armario?",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:3,start:25.919,end:33.908,es:"Saco las llaves del bolsillo.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:4,start:33.908,end:42.132,es:"Saquen sus cuadernos, por favor.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:5,start:42.132,end:50.313,es:"Sacamos las maletas del auto.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:6,start:50.313,end:58.473,es:"El dentista me sacó una muela.",group:"sacar algo de un lugar",group_index:0,level:"A2"},{i:7,start:58.473,end:66.996,es:"¿Ya sacaste la ropa de la lavadora?",group:"sacar algo de un lugar",group_index:0,level:"A2"},{i:8,start:68.496,end:76.144,es:"¿Quién saca la basura hoy?",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:9,start:76.144,end:84.411,es:"Saco al perro todas las mañanas.",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:10,start:84.411,end:93.808,es:"Por favor, saca la basura antes de dormir.",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:11,start:93.808,end:101.925,es:"Mi hijo nunca saca la basura.",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:12,start:101.925,end:109.957,es:"Voy a sacar al perro a pasear.",group:"sacar la basura, sacar al perro",group_index:1,level:"A2"},{i:13,start:109.957,end:118.672,es:"Ayer se me olvidó sacar la basura.",group:"sacar la basura, sacar al perro",group_index:1,level:"A2"},{i:14,start:118.672,end:127.429,es:"Saqué a los niños al parque un rato.",group:"sacar la basura, sacar al perro",group_index:1,level:"A2"},{i:15,start:128.929,end:136.023,es:"¿Me sacas una foto?",group:"sacar fotos",group_index:2,level:"A1"},{i:16,start:136.023,end:144.14,es:"Aquí no se pueden sacar fotos.",group:"sacar fotos",group_index:2,level:"A1"},{i:17,start:144.14,end:152.364,es:"Mi madre saca fotos de todo.",group:"sacar fotos",group_index:2,level:"A1"},{i:18,start:152.364,end:159.564,es:"Saca una foto del mar.",group:"sacar fotos",group_index:2,level:"A1"},{i:19,start:159.564,end:168.364,es:"Sacamos muchas fotos en el viaje.",group:"sacar fotos",group_index:2,level:"A2"},{i:20,start:168.364,end:177.036,es:"¿Puedes sacarnos una foto a los dos?",group:"sacar fotos",group_index:2,level:"A2"},{i:21,start:177.036,end:186.86,es:"Le saqué una foto al atardecer con el teléfono.",group:"sacar fotos",group_index:2,level:"A2"},{i:22,start:188.36,end:195.987,es:"Necesito sacar dinero.",group:"sacar dinero",group_index:3,level:"A1"},{i:23,start:195.987,end:204.189,es:"¿Hay un cajero para sacar dinero?",group:"sacar dinero",group_index:3,level:"A1"},{i:24,start:204.189,end:212.712,es:"Saqué dinero del cajero de la esquina.",group:"sacar dinero",group_index:3,level:"A2"},{i:25,start:212.712,end:223.475,es:"No pude sacar dinero porque el cajero no funcionaba.",group:"sacar dinero",group_index:3,level:"A2"},{i:26,start:223.475,end:233.085,es:"Voy a sacar dinero antes de ir al mercado.",group:"sacar dinero",group_index:3,level:"A2"},{i:27,start:233.085,end:242.589,es:"Mi abuelo saca dinero del banco cada mes.",group:"sacar dinero",group_index:3,level:"A2"},{i:28,start:242.589,end:252.307,es:"Si sacas dinero en otro banco, te cobran más.",group:"sacar dinero",group_index:3,level:"A2"},{i:29,start:253.807,end:262.671,es:"Mi hermana siempre saca buenas notas.",group:"sacar buena nota",group_index:4,level:"A1"},{i:30,start:262.671,end:270.809,es:"Saqué un diez en matemáticas.",group:"sacar buena nota",group_index:4,level:"A2"},{i:31,start:270.809,end:278.905,es:"¿Qué nota sacaste en el examen?",group:"sacar buena nota",group_index:4,level:"A2"},{i:32,start:278.905,end:287.663,es:"Este año he sacado mejores notas.",group:"sacar buena nota",group_index:4,level:"A2"},{i:33,start:287.663,end:296.527,es:"Si estudias, vas a sacar buena nota.",group:"sacar buena nota",group_index:4,level:"A2"},{i:34,start:296.527,end:304.921,es:"No saqué buena nota, pero aprobé.",group:"sacar buena nota",group_index:4,level:"A2"},{i:35,start:304.921,end:314.66,es:"Ojalá saque buena nota en el examen de inglés.",group:"sacar buena nota",group_index:4,level:"B1"},{i:36,start:316.16,end:324.939,es:"Ya saqué los boletos para el concierto.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:37,start:324.939,end:333.973,es:"Hay que sacar las entradas por internet.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:38,start:333.973,end:342.88,es:"¿Dónde puedo sacar un boleto de tren?",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:39,start:342.88,end:352.981,es:"Mi hijo acaba de sacar la licencia de conducir.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:40,start:352.981,end:362.912,es:"Tengo que sacar el pasaporte antes del viaje.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:41,start:362.912,end:372.949,es:"Vamos a sacar entradas para el partido del sábado.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:42,start:372.949,end:382.261,es:"Me gustaría sacar los boletos con tiempo.",group:"sacar entradas, boletos, documentos",group_index:5,level:"B1"},{i:43,start:383.761,end:392.796,es:"¿Qué conclusión sacaste de la película?",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"A2"},{i:44,start:392.796,end:401.596,es:"No saques conclusiones tan rápido.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:45,start:401.596,end:412.145,es:"Después de la reunión, sacamos varias conclusiones.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:46,start:412.145,end:420.113,es:"Ese ruido me saca de quicio.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:47,start:420.113,end:429.745,es:"Mi hermano me saca de quicio cuando no escucha.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:48,start:429.745,end:439.1,es:"No dejes que el tráfico te saque de quicio.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:49,start:439.1,end:449.116,es:"Es mejor esperar antes de sacar conclusiones.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:50,start:449.116,end:458.343,es:"Me sacó de quicio que llegara tan tarde.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:51,start:459.843,end:470.669,es:"Mis padres trabajaron mucho para sacarnos adelante.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:52,start:470.669,end:479.64,es:"Hay que sacar provecho de las vacaciones.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:53,start:479.64,end:488.547,es:"No sé de dónde sacas tanta energía.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:54,start:488.547,end:497.283,es:"Siempre saca tiempo para su familia.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:55,start:497.283,end:505.251,es:"¿Quién sacó el tema del dinero?",group:"expresiones con sacar",group_index:7,level:"B1"},{i:56,start:505.251,end:513.069,es:"No me saques de mis casillas.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:57,start:513.069,end:522.659,es:"Ella sacó una idea genial de un libro viejo.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:58,start:522.659,end:532.803,es:"Siempre sabe sacar lo mejor de cada situación.",group:"expresiones con sacar",group_index:7,level:"B1"}],mg={word:tg,slug:ug,kind:dg,hash:pg,duration:gg,voice:cg,marks:vg},_g="saludos y despedidas",xg="saludos_y_despedidas",Ag="concept",hg="b1ef83f63d75eaf4",bg=462.144,qg="santa",fg=[{i:0,start:.5,end:6.633,es:"Hola, ¿qué tal?",group:"saludar",group_index:0,level:"A1"},{i:1,start:6.633,end:13.407,es:"Buenas, ¿cómo estás?",group:"saludar",group_index:0,level:"A1"},{i:2,start:13.407,end:19.327,es:"¿Cómo te va?",group:"saludar",group_index:0,level:"A1"},{i:3,start:19.327,end:25.929,es:"Hola, ¿cómo andas?",group:"saludar",group_index:0,level:"A1"},{i:4,start:25.929,end:31.785,es:"¿Todo bien?",group:"saludar",group_index:0,level:"A1"},{i:5,start:31.785,end:37.791,es:"¿Qué cuentas?",group:"saludar",group_index:0,level:"A1"},{i:6,start:37.791,end:44.372,es:"¿Qué hay de nuevo?",group:"saludar",group_index:0,level:"A1"},{i:7,start:44.372,end:51.167,es:"¡Hola, cuánto tiempo!",group:"saludar",group_index:0,level:"A2"},{i:8,start:51.167,end:57.769,es:"¡Qué gusto verte!",group:"saludar",group_index:0,level:"A2"},{i:9,start:59.269,end:66.064,es:"Muy bien, gracias.",group:"responder",group_index:1,level:"A1"},{i:10,start:66.064,end:72.496,es:"Aquí, tranquilo.",group:"responder",group_index:1,level:"A1"},{i:11,start:72.496,end:79.888,es:"Más o menos, la verdad.",group:"responder",group_index:1,level:"A1"},{i:12,start:79.888,end:88.283,es:"Bastante bien, un poco cansado.",group:"responder",group_index:1,level:"A1"},{i:13,start:88.283,end:95.739,es:"Nada nuevo, lo de siempre.",group:"responder",group_index:1,level:"A2"},{i:14,start:95.739,end:101.595,es:"Ahí vamos.",group:"responder",group_index:1,level:"A2"},{i:15,start:103.095,end:109.015,es:"Bien, ¿y tú?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:16,start:109.015,end:116.876,es:"Todo tranquilo, ¿y tú qué tal?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:17,start:116.876,end:124.567,es:"Muy bien, ¿y a ti cómo te va?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:18,start:124.567,end:132.791,es:"Bien, gracias, ¿y tú cómo estás?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:19,start:132.791,end:140.78,es:"Pues aquí, trabajando, ¿y tú?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:20,start:140.78,end:149.345,es:"Aquí, como siempre, ¿y tú qué cuentas?",group:"devolver la pregunta",group_index:2,level:"A2"},{i:21,start:150.845,end:156.893,es:"Hasta luego.",group:"decir adiós",group_index:3,level:"A1"},{i:22,start:156.893,end:162.643,es:"Nos vemos.",group:"decir adiós",group_index:3,level:"A1"},{i:23,start:162.643,end:169.395,es:"Nos vemos mañana.",group:"decir adiós",group_index:3,level:"A1"},{i:24,start:169.395,end:176.531,es:"Nos vemos otro día.",group:"decir adiós",group_index:3,level:"A1"},{i:25,start:176.531,end:182.92,es:"Hablamos luego.",group:"decir adiós",group_index:3,level:"A1"},{i:26,start:182.92,end:189.011,es:"Hasta pronto.",group:"decir adiós",group_index:3,level:"A1"},{i:27,start:189.011,end:195.763,es:"Te escribo luego.",group:"decir adiós",group_index:3,level:"A1"},{i:28,start:197.263,end:203.396,es:"Igualmente.",group:"responder a una despedida",group_index:4,level:"A1"},{i:29,start:203.396,end:210.468,es:"Tú también, cuídate.",group:"responder a una despedida",group_index:4,level:"A1"},{i:30,start:210.468,end:217.689,es:"De acuerdo, nos vemos.",group:"responder a una despedida",group_index:4,level:"A1"},{i:31,start:217.689,end:225.209,es:"Gracias, lo mismo digo.",group:"responder a una despedida",group_index:4,level:"A2"},{i:32,start:225.209,end:231.94,es:"El gusto fue mío.",group:"responder a una despedida",group_index:4,level:"A2"},{i:33,start:231.94,end:240.057,es:"Gracias, yo les doy tus saludos.",group:"responder a una despedida",group_index:4,level:"A2"},{i:34,start:240.057,end:247.577,es:"Hasta luego, que estés bien.",group:"responder a una despedida",group_index:4,level:"A2"},{i:35,start:249.077,end:254.699,es:"¡Qué bien!",group:"reaccionar a la respuesta",group_index:5,level:"A1"},{i:36,start:254.699,end:260.725,es:"Ay, qué pena.",group:"reaccionar a la respuesta",group_index:5,level:"A1"},{i:37,start:260.725,end:269.653,es:"Te entiendo, yo también estoy cansado.",group:"reaccionar a la respuesta",group_index:5,level:"A1"},{i:38,start:269.653,end:276.299,es:"Me alegro mucho.",group:"reaccionar a la respuesta",group_index:5,level:"A2"},{i:39,start:276.299,end:284.203,es:"Me alegro de que te vaya bien.",group:"reaccionar a la respuesta",group_index:5,level:"B1"},{i:40,start:284.203,end:291.915,es:"Espero que todo siga bien.",group:"reaccionar a la respuesta",group_index:5,level:"B1"},{i:41,start:293.415,end:300.103,es:"¿Qué tal tu día?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:42,start:300.103,end:307.047,es:"¿Qué tal el trabajo?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:43,start:307.047,end:313.969,es:"¿Qué tal la familia?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:44,start:313.969,end:321.212,es:"¿Cómo va todo en casa?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:45,start:321.212,end:328.049,es:"¿Cómo va la semana?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:46,start:328.049,end:335.911,es:"¿Cómo te fue el fin de semana?",group:"preguntar cómo va todo",group_index:6,level:"A2"},{i:47,start:335.911,end:343.601,es:"¿Qué has hecho estos días?",group:"preguntar cómo va todo",group_index:6,level:"A2"},{i:48,start:343.601,end:350.375,es:"¿Cómo has estado?",group:"preguntar cómo va todo",group_index:6,level:"A2"},{i:49,start:351.875,end:358.264,es:"Bueno, te dejo.",group:"avisar que te vas",group_index:7,level:"A2"},{i:50,start:358.264,end:364.717,es:"Me tengo que ir.",group:"avisar que te vas",group_index:7,level:"A2"},{i:51,start:364.717,end:371.832,es:"Ya me voy, que es tarde.",group:"avisar que te vas",group_index:7,level:"A2"},{i:52,start:371.832,end:378.819,es:"Bueno, me voy yendo.",group:"avisar que te vas",group_index:7,level:"A2"},{i:53,start:378.819,end:385.549,es:"Bueno, me despido.",group:"avisar que te vas",group_index:7,level:"A2"},{i:54,start:385.549,end:394.904,es:"Te dejo, que seguro tienes cosas que hacer.",group:"avisar que te vas",group_index:7,level:"A2"},{i:55,start:394.904,end:402.851,es:"Bueno, no te quito más tiempo.",group:"avisar que te vas",group_index:7,level:"B1"},{i:56,start:404.351,end:410.761,es:"Cuídate mucho.",group:"buenos deseos",group_index:8,level:"A1"},{i:57,start:410.761,end:417.727,es:"Buen fin de semana.",group:"buenos deseos",group_index:8,level:"A1"},{i:58,start:417.727,end:424.436,es:"Que te vaya bien.",group:"buenos deseos",group_index:8,level:"A2"},{i:59,start:424.436,end:431.487,es:"Que tengas buen día.",group:"buenos deseos",group_index:8,level:"A2"},{i:60,start:431.487,end:438.644,es:"Saludos a tu familia.",group:"buenos deseos",group_index:8,level:"A2"},{i:61,start:438.644,end:445.673,es:"Fue un gusto verte.",group:"buenos deseos",group_index:8,level:"A2"},{i:62,start:445.673,end:453.748,es:"Que tengas una buena semana.",group:"buenos deseos",group_index:8,level:"A2"},{i:63,start:453.748,end:462.079,es:"Que disfrutes el resto del día.",group:"buenos deseos",group_index:8,level:"B1"}],yg={word:_g,slug:xg,kind:Ag,hash:hg,duration:bg,voice:qg,marks:fg},jg="se",Bg="se",zg="word",Mg="0cd7f9f37da4d67f",Eg=493.224,$g="santa",kg=[{i:0,start:.5,end:8.895,es:"Mi hermano se ducha por la mañana.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:1,start:8.895,end:16.5,es:"Ella se levanta a las siete.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:2,start:16.5,end:24.468,es:"Mi abuela se acuesta temprano.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:3,start:24.468,end:31.647,es:"¿Cómo se llama tu perro?",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:4,start:31.647,end:39.316,es:"El niño se lava las manos.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:5,start:39.316,end:48.073,es:"Mi padre se afeita todos los días.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:6,start:48.073,end:55.551,es:"Se pone el abrigo y sale.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:7,start:55.551,end:63.263,es:"Los niños se visten s
