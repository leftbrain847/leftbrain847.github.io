t:30.966,end:38.577,es:"Hay que pagar en efectivo.",group:"tener que, hay que",group_index:0,level:"A1"},{i:5,start:38.577,end:44.945,es:"¿Tienes que ir hoy?",group:"tener que, hay que",group_index:0,level:"A1"},{i:6,start:44.945,end:52.812,es:"Mis hijos tienen que estudiar.",group:"tener que, hay que",group_index:0,level:"A1"},{i:7,start:52.812,end:61.177,es:"Hay que tener cuidado con el perro.",group:"tener que, hay que",group_index:0,level:"A1"},{i:8,start:62.677,end:71.57,es:"La chica que canta es mi prima.",group:"el libro que leí",group_index:1,level:"A1"},{i:9,start:71.57,end:81.723,es:"Tengo un amigo que vive en Chile.",group:"el libro que leí",group_index:1,level:"A1"},{i:10,start:81.723,end:90.832,es:"El tren que va a Lima sale ahora.",group:"el libro que leí",group_index:1,level:"A1"},{i:11,start:90.832,end:99.592,es:"Es una película que me gusta mucho.",group:"el libro que leí",group_index:1,level:"A1"},{i:12,start:99.592,end:110.058,es:"Las personas que trabajan aquí son muy amables.",group:"el libro que leí",group_index:1,level:"A1"},{i:13,start:110.058,end:118.064,es:"El libro que leí es muy bueno.",group:"el libro que leí",group_index:1,level:"A2"},{i:14,start:118.064,end:127.486,es:"La casa que compramos es pequeña.",group:"el libro que leí",group_index:1,level:"A2"},{i:15,start:127.486,end:137.07,es:"¿Dónde está la camisa que me regalaste?",group:"el libro que leí",group_index:1,level:"A2"},{i:16,start:137.07,end:146.732,es:"El restaurante que te recomendé está cerrado.",group:"el libro que leí",group_index:1,level:"A2"},{i:17,start:148.232,end:155.913,es:"Creo que va a llover.",group:"creo que",group_index:2,level:"A1"},{i:18,start:155.913,end:163.268,es:"Dice que está cansado.",group:"creo que",group_index:2,level:"A1"},{i:19,start:163.268,end:170.628,es:"Pienso que tienes razón.",group:"creo que",group_index:2,level:"A1"},{i:20,start:170.628,end:177.624,es:"Sé que es difícil.",group:"creo que",group_index:2,level:"A1"},{i:21,start:177.624,end:184.921,es:"Parece que no hay nadie.",group:"creo que",group_index:2,level:"A1"},{i:22,start:184.921,end:191.231,es:"Supongo que sí.",group:"creo que",group_index:2,level:"A1"},{i:23,start:191.231,end:198.933,es:"Estoy seguro de que lo sabe.",group:"creo que",group_index:2,level:"A2"},{i:24,start:198.933,end:206.85,es:"Me dijo que no podía venir.",group:"creo que",group_index:2,level:"A2"},{i:25,start:206.85,end:214.24,es:"Veo que ya terminaste.",group:"creo que",group_index:2,level:"A2"},{i:26,start:215.74,end:224.814,es:"Mi hermano es más alto que yo.",group:"más que, menos que",group_index:3,level:"A1"},{i:27,start:224.814,end:233.318,es:"Este auto es más caro que el otro.",group:"más que, menos que",group_index:3,level:"A2"},{i:28,start:233.318,end:241.591,es:"Hoy hace menos frío que ayer.",group:"más que, menos que",group_index:3,level:"A2"},{i:29,start:241.591,end:250.096,es:"Me gusta más el té que el café.",group:"más que, menos que",group_index:3,level:"A2"},{i:30,start:250.096,end:258.973,es:"Corre más rápido que su padre.",group:"más que, menos que",group_index:3,level:"A2"},{i:31,start:258.973,end:266.966,es:"Ella trabaja más que nadie.",group:"más que, menos que",group_index:3,level:"A2"},{i:32,start:266.966,end:275.585,es:"La película es peor que el libro.",group:"más que, menos que",group_index:3,level:"A2"},{i:33,start:275.585,end:283.59,es:"Ahora gana menos que antes.",group:"más que, menos que",group_index:3,level:"A2"},{i:34,start:283.59,end:291.364,es:"Más vale tarde que nunca.",group:"más que, menos que",group_index:3,level:"A2"},{i:35,start:292.864,end:300.161,es:"Es que no tengo tiempo.",group:"es que",group_index:4,level:"A2"},{i:36,start:300.161,end:309.021,es:"Lo siento, es que estaba ocupado.",group:"es que",group_index:4,level:"A2"},{i:37,start:309.021,end:318.362,es:"No puedo ir, es que estoy enfermo.",group:"es que",group_index:4,level:"A2"},{i:38,start:318.362,end:325.369,es:"¿Es que no me escuchas?",group:"es que",group_index:4,level:"A2"},{i:39,start:325.369,end:332.619,es:"Es que no sabía nada.",group:"es que",group_index:4,level:"A2"},{i:40,start:332.619,end:342.065,es:"Perdón, es que había mucho tráfico.",group:"es que",group_index:4,level:"A2"},{i:41,start:342.065,end:349.687,es:"Es que hoy no me siento bien.",group:"es que",group_index:4,level:"A2"},{i:42,start:351.187,end:360.664,es:"Estaba cansado, así que me acosté.",group:"así que, ya que",group_index:5,level:"A2"},{i:43,start:360.664,end:369.897,es:"Está lloviendo, así que no salimos.",group:"así que, ya que",group_index:5,level:"A2"},{i:44,start:369.897,end:379.249,es:"Ya que estás aquí, ayúdame con esto.",group:"así que, ya que",group_index:5,level:"B1"},{i:45,start:379.249,end:388.288,es:"Ya que tienes tiempo, ¿vamos al cine?",group:"así que, ya que",group_index:5,level:"B1"},{i:46,start:389.788,end:397.759,es:"Quiero que vengas a mi casa.",group:"quiero que vengas",group_index:6,level:"B1"},{i:47,start:397.759,end:404.51,es:"Espero que te guste.",group:"quiero que vengas",group_index:6,level:"B1"},{i:48,start:404.51,end:411.767,es:"Necesito que me ayudes.",group:"quiero que vengas",group_index:6,level:"B1"},{i:49,start:411.767,end:420.272,es:"Es importante que duermas bien.",group:"quiero que vengas",group_index:6,level:"B1"},{i:50,start:420.272,end:428.741,es:"Prefiero que hablemos mañana.",group:"quiero que vengas",group_index:6,level:"B1"},{i:51,start:428.741,end:438.475,es:"Mi madre quiere que la llame todos los días.",group:"quiero que vengas",group_index:6,level:"B1"},{i:52,start:438.475,end:446.243,es:"Es mejor que salgamos ya.",group:"quiero que vengas",group_index:6,level:"B1"},{i:53,start:446.243,end:453.981,es:"No creo que llegue a tiempo.",group:"quiero que vengas",group_index:6,level:"B1"},{i:54,start:455.481,end:461.943,es:"¡Que te vaya bien!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:55,start:461.943,end:468.021,es:"Que descanses.",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:56,start:468.021,end:475.19,es:"¡Que tengas buen viaje!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:57,start:475.19,end:482.221,es:"¡Que te mejores pronto!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:58,start:482.221,end:489.623,es:"¡Que sean muy felices!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:59,start:489.623,end:496.165,es:"Que duermas bien.",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:60,start:496.165,end:503.834,es:"¡Que disfrutes la fiesta!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:61,start:503.834,end:511.41,es:"¡Que cumplas muchos más!",group:"¡que te vaya bien!",group_index:7,level:"B1"}],$i={word:yi,slug:ji,kind:Bi,hash:zi,duration:Mi,voice:Ei,marks:ki},wi="quedar(se)",Ni="quedar_se",Si="word",Li="29801f47e642b8a3",Ti=504.384,Pi="mx",Ci=[{i:0,start:.5,end:7.495,es:"Hoy me quedo en casa.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:1,start:7.495,end:14.108,es:"¿Te quedas a cenar?",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:2,start:14.108,end:22.531,es:"Nos quedamos en un hotel pequeño.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:3,start:22.531,end:31.082,es:"Mi hermana se queda con nosotros.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:4,start:31.082,end:39.111,es:"Quédate aquí un momento.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:5,start:39.111,end:47.593,es:"Prefiero quedarme en la cama.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:6,start:47.593,end:57.165,es:"Ayer nos quedamos en la playa todo el día.",group:"quedarse en un lugar",group_index:0,level:"A2"},{i:7,start:57.165,end:66.901,es:"Me quedé dos semanas en casa de mis abuelos.",group:"quedarse en un lugar",group_index:0,level:"A2"},{i:8,start:68.401,end:75.28,es:"¿Dónde queda el museo?",group:"quedar, estar situado",group_index:1,level:"A1"},{i:9,start:75.28,end:83.411,es:"El banco queda muy cerca.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:10,start:83.411,end:91.974,es:"Mi casa queda lejos del centro.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:11,start:91.974,end:101.872,es:"La farmacia queda al lado del mercado.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:12,start:101.872,end:109.239,es:"¿Queda lejos la estación?",group:"quedar, estar situado",group_index:1,level:"A1"},{i:13,start:109.239,end:117.987,es:"La escuela queda a dos calles de aquí.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:14,start:117.987,end:127.265,es:"El restaurante queda enfrente del parque.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:15,start:128.765,end:136.503,es:"Queda un poco de café.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:16,start:136.503,end:142.872,es:"No queda leche.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:17,start:142.872,end:149.96,es:"¿Cuánto dinero te queda?",group:"quedar, sobrar",group_index:2,level:"A1"},{i:18,start:149.96,end:157.606,es:"Solo quedan dos asientos.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:19,start:157.606,end:166.331,es:"Quedan cinco minutos para el final.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:20,start:166.331,end:174.987,es:"Me quedan tres días de vacaciones.",group:"quedar, sobrar",group_index:2,level:"A2"},{i:21,start:174.987,end:183.584,es:"No quedaba nada en el refrigerador.",group:"quedar, sobrar",group_index:2,level:"A2"},{i:22,start:183.584,end:192.266,es:"Todavía nos queda mucho trabajo.",group:"quedar, sobrar",group_index:2,level:"A2"},{i:23,start:193.766,end:202.364,es:"Esa camisa te queda muy bien.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:24,start:202.364,end:211.031,es:"Estos zapatos me quedan pequeños.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:25,start:211.031,end:218.94,es:"El vestido le queda grande.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:26,start:218.94,end:226.667,es:"¿Cómo me queda este sombrero?",group:"quedar bien o mal",group_index:3,level:"A2"},{i:27,start:226.667,end:235.195,es:"El azul te queda mejor que el rojo.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:28,start:235.195,end:243.673,es:"Los pantalones ya no me quedan.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:29,start:243.673,end:251.632,es:"Quedé muy mal con mi jefe.",group:"quedar bien o mal",group_index:3,level:"B1"},{i:30,start:251.632,end:259.916,es:"Quiero quedar bien con tus padres.",group:"quedar bien o mal",group_index:3,level:"B1"},{i:31,start:261.416,end:269.21,es:"La sopa quedó muy rica.",group:"quedar, resultado",group_index:4,level:"A2"},{i:32,start:269.21,end:277.135,es:"¡Qué bonita quedó tu habitación!",group:"quedar, resultado",group_index:4,level:"A2"},{i:33,start:277.135,end:285.268,es:"La casa quedó muy limpia.",group:"quedar, resultado",group_index:4,level:"A2"},{i:34,start:285.268,end:294.701,es:"La puerta quedó abierta toda la noche.",group:"quedar, resultado",group_index:4,level:"A2"},{i:35,start:294.701,end:305.865,es:"Con la pintura nueva, la cocina quedó como nueva.",group:"quedar, resultado",group_index:4,level:"A2"},{i:36,start:305.865,end:314.602,es:"Mi dibujo no quedó como yo quería.",group:"quedar, resultado",group_index:4,level:"A2"},{i:37,start:314.602,end:325.452,es:"Después de la tormenta, la calle quedó sin luz.",group:"quedar, resultado",group_index:4,level:"B1"},{i:38,start:326.952,end:335.224,es:"Me quedé sorprendido con la noticia.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:39,start:335.224,end:342.87,es:"Se quedó dormido en el sofá.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:40,start:342.87,end:350.376,es:"El niño se quedó callado.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:41,start:350.376,end:360.782,es:"Nos quedamos sin gasolina en la carretera.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:42,start:360.782,end:370.692,es:"Mi abuela se quedó sola después de la mudanza.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:43,start:370.692,end:379.661,es:"Me quedé mirando el mar un buen rato.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:44,start:379.661,end:389.629,es:"Se quedaron hablando hasta la medianoche.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:45,start:389.629,end:399.77,es:"Si sigues así, te vas a quedar sin amigos.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"B1"},{i:46,start:401.27,end:409.229,es:"Me quedo con la camisa verde.",group:"quedarse con algo",group_index:6,level:"A2"},{i:47,start:409.229,end:416.074,es:"Quédate con el cambio.",group:"quedarse con algo",group_index:6,level:"A2"},{i:48,start:416.074,end:424.3,es:"Mi hermano se quedó con mi libro.",group:"quedarse con algo",group_index:6,level:"A2"},{i:49,start:424.3,end:432.514,es:"¿Te puedes quedar con mis llaves?",group:"quedarse con algo",group_index:6,level:"A2"},{i:50,start:432.514,end:442.958,es:"Al final nos quedamos con el apartamento más grande.",group:"quedarse con algo",group_index:6,level:"B1"},{i:51,start:444.458,end:452.347,es:"Quedamos en vernos el lunes.",group:"quedar en algo",group_index:7,level:"B1"},{i:52,start:452.347,end:462.071,es:"Habíamos quedado en llamarnos esta tarde.",group:"quedar en algo",group_index:7,level:"B1"},{i:53,start:462.071,end:471.18,es:"Quedaron en traer la comida a la fiesta.",group:"quedar en algo",group_index:7,level:"B1"},{i:54,start:471.18,end:479.324,es:"¿En qué quedamos, vienes o no?",group:"quedar en algo",group_index:7,level:"B1"},{i:55,start:479.324,end:488.642,es:"Quedé en ayudar a mi vecino con la mudanza.",group:"quedar en algo",group_index:7,level:"B1"},{i:56,start:488.642,end:495.585,es:"Todo quedó en nada.",group:"quedar en algo",group_index:7,level:"B1"},{i:57,start:495.585,end:504.333,es:"Quedamos en encontrarnos en la plaza.",group:"quedar en algo",group_index:7,level:"B1"}],Hi={word:wi,slug:Ni,kind:Si,hash:Li,duration:Ti,voice:Pi,marks:Ci},Qi="sacar",Di="sacar",Yi="word",Vi="b48f6431af9bfac9",Oi=559.008,Ii="mx",Fi=[{i:0,start:.5,end:8.784,es:"Saca la leche del refrigerador.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:1,start:8.784,end:18.206,es:"Ella saca un libro de la mochila.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:2,start:18.206,end:27.081,es:"¿Puedes sacar los platos del armario?",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:3,start:27.081,end:35.691,es:"Saco las llaves del bolsillo.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:4,start:35.691,end:43.87,es:"Saquen sus cuadernos, por favor.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:5,start:43.87,end:52.212,es:"Sacamos las maletas del auto.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:6,start:52.212,end:60.306,es:"El dentista me sacó una muela.",group:"sacar algo de un lugar",group_index:0,level:"A2"},{i:7,start:60.306,end:68.694,es:"¿Ya sacaste la ropa de la lavadora?",group:"sacar algo de un lugar",group_index:0,level:"A2"},{i:8,start:70.194,end:78.281,es:"¿Quién saca la basura hoy?",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:9,start:78.281,end:87.947,es:"Saco al perro todas las mañanas.",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:10,start:87.947,end:99.354,es:"Por favor, saca la basura antes de dormir.",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:11,start:99.354,end:108.822,es:"Mi hijo nunca saca la basura.",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:12,start:108.822,end:117.81,es:"Voy a sacar al perro a pasear.",group:"sacar la basura, sacar al perro",group_index:1,level:"A2"},{i:13,start:117.81,end:126.594,es:"Ayer se me olvidó sacar la basura.",group:"sacar la basura, sacar al perro",group_index:1,level:"A2"},{i:14,start:126.594,end:136.282,es:"Saqué a los niños al parque un rato.",group:"sacar la basura, sacar al perro",group_index:1,level:"A2"},{i:15,start:137.782,end:144.889,es:"¿Me sacas una foto?",group:"sacar fotos",group_index:2,level:"A1"},{i:16,start:144.889,end:153.417,es:"Aquí no se pueden sacar fotos.",group:"sacar fotos",group_index:2,level:"A1"},{i:17,start:153.417,end:161.67,es:"Mi madre saca fotos de todo.",group:"sacar fotos",group_index:2,level:"A1"},{i:18,start:161.67,end:169.478,es:"Saca una foto del mar.",group:"sacar fotos",group_index:2,level:"A1"},{i:19,start:169.478,end:178.401,es:"Sacamos muchas fotos en el viaje.",group:"sacar fotos",group_index:2,level:"A2"},{i:20,start:178.401,end:187.254,es:"¿Puedes sacarnos una foto a los dos?",group:"sacar fotos",group_index:2,level:"A2"},{i:21,start:187.254,end:197.482,es:"Le saqué una foto al atardecer con el teléfono.",group:"sacar fotos",group_index:2,level:"A2"},{i:22,start:198.982,end:206.593,es:"Necesito sacar dinero.",group:"sacar dinero",group_index:3,level:"A1"},{i:23,start:206.593,end:215.098,es:"¿Hay un cajero para sacar dinero?",group:"sacar dinero",group_index:3,level:"A1"},{i:24,start:215.098,end:224.044,es:"Saqué dinero del cajero de la esquina.",group:"sacar dinero",group_index:3,level:"A2"},{i:25,start:224.044,end:235.114,es:"No pude sacar dinero porque el cajero no funcionaba.",group:"sacar dinero",group_index:3,level:"A2"},{i:26,start:235.114,end:245.078,es:"Voy a sacar dinero antes de ir al mercado.",group:"sacar dinero",group_index:3,level:"A2"},{i:27,start:245.078,end:255.011,es:"Mi abuelo saca dinero del banco cada mes.",group:"sacar dinero",group_index:3,level:"A2"},{i:28,start:255.011,end:265.629,es:"Si sacas dinero en otro banco, te cobran más.",group:"sacar dinero",group_index:3,level:"A2"},{i:29,start:267.129,end:277.236,es:"Mi hermana siempre saca buenas notas.",group:"sacar buena nota",group_index:4,level:"A1"},{i:30,start:277.236,end:286.205,es:"Saqué un diez en matemáticas.",group:"sacar buena nota",group_index:4,level:"A2"},{i:31,start:286.205,end:294.675,es:"¿Qué nota sacaste en el examen?",group:"sacar buena nota",group_index:4,level:"A2"},{i:32,start:294.675,end:303.864,es:"Este año he sacado mejores notas.",group:"sacar buena nota",group_index:4,level:"A2"},{i:33,start:303.864,end:313.414,es:"Si estudias, vas a sacar buena nota.",group:"sacar buena nota",group_index:4,level:"A2"},{i:34,start:313.414,end:322.128,es:"No saqué buena nota, pero aprobé.",group:"sacar buena nota",group_index:4,level:"A2"},{i:35,start:322.128,end:332.339,es:"Ojalá saque buena nota en el examen de inglés.",group:"sacar buena nota",group_index:4,level:"B1"},{i:36,start:333.839,end:343.342,es:"Ya saqué los boletos para el concierto.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:37,start:343.342,end:352.346,es:"Hay que sacar las entradas por internet.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:38,start:352.346,end:360.955,es:"¿Dónde puedo sacar un boleto de tren?",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:39,start:360.955,end:370.923,es:"Mi hijo acaba de sacar la licencia de conducir.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:40,start:370.923,end:381.065,es:"Tengo que sacar el pasaporte antes del viaje.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:41,start:381.065,end:391.622,es:"Vamos a sacar entradas para el partido del sábado.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:42,start:391.622,end:402.15,es:"Me gustaría sacar los boletos con tiempo.",group:"sacar entradas, boletos, documentos",group_index:5,level:"B1"},{i:43,start:403.65,end:412.608,es:"¿Qué conclusión sacaste de la película?",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"A2"},{i:44,start:412.608,end:421.832,es:"No saques conclusiones tan rápido.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:45,start:421.832,end:433.677,es:"Después de la reunión, sacamos varias conclusiones.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:46,start:433.677,end:441.532,es:"Ese ruido me saca de quicio.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:47,start:441.532,end:451.546,es:"Mi hermano me saca de quicio cuando no escucha.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:48,start:451.546,end:461.002,es:"No dejes que el tráfico te saque de quicio.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:49,start:461.002,end:471.362,es:"Es mejor esperar antes de sacar conclusiones.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:50,start:471.362,end:480.75,es:"Me sacó de quicio que llegara tan tarde.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:51,start:482.25,end:493.111,es:"Mis padres trabajaron mucho para sacarnos adelante.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:52,start:493.111,end:502.371,es:"Hay que sacar provecho de las vacaciones.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:53,start:502.371,end:511.63,es:"No sé de dónde sacas tanta energía.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:54,start:511.63,end:520.924,es:"Siempre saca tiempo para su familia.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:55,start:520.924,end:528.976,es:"¿Quién sacó el tema del dinero?",group:"expresiones con sacar",group_index:7,level:"B1"},{i:56,start:528.976,end:536.947,es:"No me saques de mis casillas.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:57,start:536.947,end:548.354,es:"Ella sacó una idea genial de un libro viejo.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:58,start:548.354,end:558.948,es:"Siempre sabe sacar lo mejor de cada situación.",group:"expresiones con sacar",group_index:7,level:"B1"}],Ri={word:Qi,slug:Di,kind:Yi,hash:Vi,duration:Oi,voice:Ii,marks:Fi},Ui="saludos y despedidas",Gi="saludos_y_despedidas",Ki="concept",Xi="3ab606c4186b9911",Ji=481.152,Wi="mx",Zi=[{i:0,start:.5,end:7.542,es:"Hola, ¿qué tal?",group:"saludar",group_index:0,level:"A1"},{i:1,start:7.542,end:15.245,es:"Buenas, ¿cómo estás?",group:"saludar",group_index:0,level:"A1"},{i:2,start:15.245,end:21.125,es:"¿Cómo te va?",group:"saludar",group_index:0,level:"A1"},{i:3,start:21.125,end:28.666,es:"Hola, ¿cómo andas?",group:"saludar",group_index:0,level:"A1"},{i:4,start:28.666,end:34.271,es:"¿Todo bien?",group:"saludar",group_index:0,level:"A1"},{i:5,start:34.271,end:40.117,es:"¿Qué cuentas?",group:"saludar",group_index:0,level:"A1"},{i:6,start:40.117,end:46.52,es:"¿Qué hay de nuevo?",group:"saludar",group_index:0,level:"A1"},{i:7,start:46.52,end:54.56,es:"¡Hola, cuánto tiempo!",group:"saludar",group_index:0,level:"A2"},{i:8,start:54.56,end:61.091,es:"¡Qué gusto verte!",group:"saludar",group_index:0,level:"A2"},{i:9,start:62.591,end:69.783,es:"Muy bien, gracias.",group:"responder",group_index:1,level:"A1"},{i:10,start:69.783,end:76.407,es:"Aquí, tranquilo.",group:"responder",group_index:1,level:"A1"},{i:11,start:76.407,end:84.598,es:"Más o menos, la verdad.",group:"responder",group_index:1,level:"A1"},{i:12,start:84.598,end:93.893,es:"Bastante bien, un poco cansado.",group:"responder",group_index:1,level:"A1"},{i:13,start:93.893,end:102.2,es:"Nada nuevo, lo de siempre.",group:"responder",group_index:1,level:"A2"},{i:14,start:102.2,end:108.054,es:"Ahí vamos.",group:"responder",group_index:1,level:"A2"},{i:15,start:109.554,end:116.097,es:"Bien, ¿y tú?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:16,start:116.097,end:124.778,es:"Todo tranquilo, ¿y tú qué tal?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:17,start:124.778,end:133.663,es:"Muy bien, ¿y a ti cómo te va?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:18,start:133.663,end:143.073,es:"Bien, gracias, ¿y tú cómo estás?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:19,start:143.073,end:152.518,es:"Pues aquí, trabajando, ¿y tú?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:20,start:152.518,end:162.997,es:"Aquí, como siempre, ¿y tú qué cuentas?",group:"devolver la pregunta",group_index:2,level:"A2"},{i:21,start:164.497,end:170.47,es:"Hasta luego.",group:"decir adiós",group_index:3,level:"A1"},{i:22,start:170.47,end:176.355,es:"Nos vemos.",group:"decir adiós",group_index:3,level:"A1"},{i:23,start:176.355,end:183.167,es:"Nos vemos mañana.",group:"decir adiós",group_index:3,level:"A1"},{i:24,start:183.167,end:190.22,es:"Nos vemos otro día.",group:"decir adiós",group_index:3,level:"A1"},{i:25,start:190.22,end:196.736,es:"Hablamos luego.",group:"decir adiós",group_index:3,level:"A1"},{i:26,start:196.736,end:202.744,es:"Hasta pronto.",group:"decir adiós",group_index:3,level:"A1"},{i:27,start:202.744,end:209.206,es:"Te escribo luego.",group:"decir adiós",group_index:3,level:"A1"},{i:28,start:210.706,end:216.761,es:"Igualmente.",group:"responder a una despedida",group_index:4,level:"A1"},{i:29,start:216.761,end:224.424,es:"Tú también, cuídate.",group:"responder a una despedida",group_index:4,level:"A1"},{i:30,start:224.424,end:231.582,es:"De acuerdo, nos vemos.",group:"responder a una despedida",group_index:4,level:"A1"},{i:31,start:231.582,end:239.436,es:"Gracias, lo mismo digo.",group:"responder a una despedida",group_index:4,level:"A2"},{i:32,start:239.436,end:246.405,es:"El gusto fue mío.",group:"responder a una despedida",group_index:4,level:"A2"},{i:33,start:246.405,end:255.607,es:"Gracias, yo les doy tus saludos.",group:"responder a una despedida",group_index:4,level:"A2"},{i:34,start:255.607,end:263.961,es:"Hasta luego, que estés bien.",group:"responder a una despedida",group_index:4,level:"A2"},{i:35,start:265.461,end:271.051,es:"¡Qué bien!",group:"reaccionar a la respuesta",group_index:5,level:"A1"},{i:36,start:271.051,end:277.861,es:"Ay, qué pena.",group:"reaccionar a la respuesta",group_index:5,level:"A1"},{i:37,start:277.861,end:287.19,es:"Te entiendo, yo también estoy cansado.",group:"reaccionar a la respuesta",group_index:5,level:"A1"},{i:38,start:287.19,end:293.645,es:"Me alegro mucho.",group:"reaccionar a la respuesta",group_index:5,level:"A2"},{i:39,start:293.645,end:301.616,es:"Me alegro de que te vaya bien.",group:"reaccionar a la respuesta",group_index:5,level:"B1"},{i:40,start:301.616,end:309.505,es:"Espero que todo siga bien.",group:"reaccionar a la respuesta",group_index:5,level:"B1"},{i:41,start:311.005,end:317.617,es:"¿Qué tal tu día?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:42,start:317.617,end:324.311,es:"¿Qué tal el trabajo?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:43,start:324.311,end:331.248,es:"¿Qué tal la familia?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:44,start:331.248,end:338.488,es:"¿Cómo va todo en casa?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:45,start:338.488,end:345.402,es:"¿Cómo va la semana?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:46,start:345.402,end:353.512,es:"¿Cómo te fue el fin de semana?",group:"preguntar cómo va todo",group_index:6,level:"A2"},{i:47,start:353.512,end:361.064,es:"¿Qué has hecho estos días?",group:"preguntar cómo va todo",group_index:6,level:"A2"},{i:48,start:361.064,end:367.677,es:"¿Cómo has estado?",group:"preguntar cómo va todo",group_index:6,level:"A2"},{i:49,start:369.177,end:375.487,es:"Bueno, te dejo.",group:"avisar que te vas",group_index:7,level:"A2"},{i:50,start:375.487,end:381.798,es:"Me tengo que ir.",group:"avisar que te vas",group_index:7,level:"A2"},{i:51,start:381.798,end:389.675,es:"Ya me voy, que es tarde.",group:"avisar que te vas",group_index:7,level:"A2"},{i:52,start:389.675,end:397.182,es:"Bueno, me voy yendo.",group:"avisar que te vas",group_index:7,level:"A2"},{i:53,start:397.182,end:403.956,es:"Bueno, me despido.",group:"avisar que te vas",group_index:7,level:"A2"},{i:54,start:403.956,end:413.97,es:"Te dejo, que seguro tienes cosas que hacer.",group:"avisar que te vas",group_index:7,level:"A2"},{i:55,start:413.97,end:422.324,es:"Bueno, no te quito más tiempo.",group:"avisar que te vas",group_index:7,level:"B1"},{i:56,start:423.824,end:430.1,es:"Cuídate mucho.",group:"buenos deseos",group_index:8,level:"A1"},{i:57,start:430.1,end:437.118,es:"Buen fin de semana.",group:"buenos deseos",group_index:8,level:"A1"},{i:58,start:437.118,end:443.591,es:"Que te vaya bien.",group:"buenos deseos",group_index:8,level:"A2"},{i:59,start:443.591,end:450.552,es:"Que tengas buen día.",group:"buenos deseos",group_index:8,level:"A2"},{i:60,start:450.552,end:457.907,es:"Saludos a tu familia.",group:"buenos deseos",group_index:8,level:"A2"},{i:61,start:457.907,end:465.03,es:"Fue un gusto verte.",group:"buenos deseos",group_index:8,level:"A2"},{i:62,start:465.03,end:473.071,es:"Que tengas una buena semana.",group:"buenos deseos",group_index:8,level:"A2"},{i:63,start:473.071,end:481.099,es:"Que disfrutes el resto del día.",group:"buenos deseos",group_index:8,level:"B1"}],et={word:Ui,slug:Gi,kind:Ki,hash:Xi,duration:Ji,voice:Wi,marks:Zi},at="se",ot="se",rt="word",st="f187d48b97c89dde",nt=510.432,lt="mx",it=[{i:0,start:.5,end:9.123,es:"Mi hermano se ducha por la mañana.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:1,start:9.123,end:18.006,es:"Ella se levanta a las siete.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:2,start:18.006,end:26.093,es:"Mi abuela se acuesta temprano.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:3,start:26.093,end:33.365,es:"¿Cómo se llama tu perro?",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:4,start:33.365,end:41.073,es:"El niño se lava las manos.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:5,start:41.073,end:49.949,es:"Mi padre se afeita todos los días.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:6,start:49.949,end:58.5,es:"Se pone el abrigo y sale.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:7,start:58.5,end:66.259,es:"Los niños se visten solos.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:8,start:66.259,end:75.299,es:"Mi madre se peina antes de salir.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:9,start:76.799,end:84.654,es:"Mi jefe se va a las cinco.",group:"se va, se queda",group_index:1,level:"A1"},{i:10,start:84.654,end:91.707,es:"Hoy se queda en casa.",group:"se va, se queda",group_index:1,level:"A1"},{i:11,start:91.707,end:99.666,es:"Se sienta junto a la ventana.",group:"se va, se queda",group_index:1,level:"A1"},{i:12,start:99.666,end:108.055,es:"Mi hijo se enoja fácilmente.",group:"se va, se queda",group_index:1,level:"A1"},{i:13,start:108.055,end:117.07,es:"Se preocupa mucho por su familia.",group:"se va, se queda",group_index:1,level:"A1"},{i:14,start:117.07,end:125.389,es:"Mi amigo se casa en junio.",group:"se va, se queda",group_index:1,level:"A1"},{i:15,start:125.389,end:133.313,es:"Ana se fue sin decir nada.",group:"se va, se queda",group_index:1,level:"A2"},{i:16,start:133.313,end:141.307,es:"Se quedaron en un hotel pequeño.",group:"se va, se queda",group_index:1,level:"A2"},{i:17,start:141.307,end:149.15,es:"Se acordó de mi cumpleaños.",group:"se va, se queda",group_index:1,level:"A2"},{i:18,start:150.65,end:158.342,es:"Mis padres se quieren mucho.",group:"se quieren",group_index:2,level:"A1"},{i:19,start:158.342,end:166.51,es:"Se conocieron en la universidad.",group:"se quieren",group_index:2,level:"A2"},{i:20,start:166.51,end:174.017,es:"Los vecinos no se hablan.",group:"se quieren",group_index:2,level:"A2"},{i:21,start:174.017,end:183.113,es:"Se escriben todas las semanas.",group:"se quieren",group_index:2,level:"A2"},{i:22,start:183.113,end:191.003,es:"Se abrazaron en el aeropuerto.",group:"se quieren",group_index:2,level:"A2"},{i:23,start:191.003,end:200.657,es:"Ana y Luis se ven todos los días.",group:"se quieren",group_index:2,level:"A2"},{i:24,start:200.657,end:209.226,es:"Los dos hermanos se parecen mucho.",group:"se quieren",group_index:2,level:"A2"},{i:25,start:209.226,end:217.952,es:"Se ayudan con las tareas de la casa.",group:"se quieren",group_index:2,level:"A2"},{i:26,start:219.452,end:226.18,es:"Aquí se vive bien.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:27,start:226.18,end:235.033,es:"Se come muy bien en este restaurante.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:28,start:235.033,end:242.992,es:"¿Cómo se dice esto en español?",group:"se vive bien aquí",group_index:3,level:"A2"},{i:29,start:242.992,end:251.369,es:"En esta tienda se habla español.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:30,start:251.369,end:258.748,es:"No se puede fumar aquí.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:31,start:258.748,end:266.234,es:"¿Por dónde se va al centro?",group:"se vive bien aquí",group_index:3,level:"A2"},{i:32,start:266.234,end:275.11,es:"Se trabaja mucho en esta empresa.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:33,start:275.11,end:282.802,es:"Desde aquí se ve el mar.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:34,start:282.802,end:290.471,es:"¿Cómo se escribe tu nombre?",group:"se vive bien aquí",group_index:3,level:"A2"},{i:35,start:291.971,end:300.139,es:"En esta calle se venden casas.",group:"se venden casas",group_index:4,level:"A2"},{i:36,start:300.139,end:310.733,es:"Se alquila un apartamento cerca del parque.",group:"se venden casas",group_index:4,level:"A2"},{i:37,start:310.733,end:319.215,es:"Se necesita ayuda en la cocina.",group:"se venden casas",group_index:4,level:"A2"},{i:38,start:319.215,end:327.452,es:"Aquí se arreglan computadoras.",group:"se venden casas",group_index:4,level:"A2"},{i:39,start:327.452,end:335.179,es:"Aquí se aceptan tarjetas.",group:"se venden casas",group_index:4,level:"A2"},{i:40,start:335.179,end:343.521,es:"Se vendieron todas las entradas.",group:"se venden casas",group_index:4,level:"A2"},{i:41,start:343.521,end:351.771,es:"Este plato se prepara con arroz.",group:"se venden casas",group_index:4,level:"A2"},{i:42,start:351.771,end:361.169,es:"Se construyó un puente nuevo el año pasado.",group:"se venden casas",group_index:4,level:"A2"},{i:43,start:362.669,end:369.293,es:"Se lo doy mañana.",group:"se lo, se la",group_index:5,level:"A2"},{i:44,start:369.293,end:378.239,es:"¿El libro? Se lo presté a Marta.",group:"se lo, se la",group_index:5,level:"A2"},{i:45,start:378.239,end:384.747,es:"Se lo dije ayer.",group:"se lo, se la",group_index:5,level:"A2"},{i:46,start:384.747,end:393.674,es:"¿Le diste la carta? Sí, se la di.",group:"se lo, se la",group_index:5,level:"A2"},{i:47,start:393.674,end:405.476,es:"Mi hijo quería un perro y se lo compramos.",group:"se lo, se la",group_index:5,level:"A2"},{i:48,start:405.476,end:416.43,es:"Si tienes la foto, mándasela a tu madre.",group:"se lo, se la",group_index:5,level:"A2"},{i:49,start:416.43,end:425.783,es:"Se lo explico otra vez, señora.",group:"se lo, se la",group_index:5,level:"A2"},{i:50,start:425.783,end:434.067,es:"Se los regalé a mis sobrinos.",group:"se lo, se la",group_index:5,level:"A2"},{i:51,start:434.067,end:441.411,es:"No se lo digas a nadie.",group:"se lo, se la",group_index:5,level:"B1"},{i:52,start:442.911,end:450.045,es:"Se me olvidó tu nombre.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:53,start:450.045,end:456.959,es:"Se le cayó el vaso.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:54,start:456.959,end:464.094,es:"Se nos acabó la leche.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:55,start:464.094,end:471.612,es:"Se me rompió el teléfono.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:56,start:471.612,end:479.118,es:"Se te olvidaron las llaves.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:57,start:479.118,end:488.912,es:"Se le perdió la tarjeta en el autobús.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:58,start:488.912,end:495.779,es:"Se me quemó el arroz.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:59,start:495.779,end:502.45,es:"Se nos hizo tarde.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:60,start:502.45,end:510.374,es:"Al niño se le cayó un diente.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"}],tt={word:at,slug:ot,kind:rt,hash:st,duration:nt,voice:lt,marks:it},ut="seguir",dt="seguir",pt="word",gt="fdc626d9526fe22d",ct=495.888,vt="mx",mt=[{i:0,start:.5,end:7.995,es:"Sígueme, por favor.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:1,start:7.995,end:16.488,es:"El perro me sigue a todas partes.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:2,start:16.488,end:25.364,es:"Sigue esta calle hasta el final.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:3,start:25.364,end:31.798,es:"¿Por qué me sigues?",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:4,start:31.798,end:39.711,es:"Seguimos al guía por el museo.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:5,start:39.711,end:47.866,es:"Los patitos siguen a su madre.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:6,start:47.866,end:56.603,es:"Siga a ese taxi, por favor.",group:"seguir, ir detrás",group_index:0,level:"A2"},{i:7,start:56.603,end:65.282,es:"Alguien nos sigue desde hace un rato.",group:"seguir, ir detrás",group_index:0,level:"A2"},{i:8,start:66.782,end:72.396,es:"¿Seguimos?",group:"seguir, continuar",group_index:1,level:"A1"},{i:9,start:72.396,end:81.214,es:"Sigue, por favor, te escucho.",group:"seguir, continuar",group_index:1,level:"A1"},{i:10,start:81.214,end:90.427,es:"La película sigue después de los anuncios.",group:"seguir, continuar",group_index:1,level:"A1"},{i:11,start:90.427,end:99.152,es:"Si quieres, seguimos mañana.",group:"seguir, continuar",group_index:1,level:"A1"},{i:12,start:99.152,end:107.028,es:"El camino sigue por el bosque.",group:"seguir, continuar",group_index:1,level:"A1"},{i:13,start:107.028,end:116.182,es:"La reunión sigue hasta las cinco.",group:"seguir, continuar",group_index:1,level:"A1"},{i:14,start:116.182,end:124.094,es:"Seguimos con la lección de ayer.",group:"seguir, continuar",group_index:1,level:"A1"},{i:15,start:125.594,end:131.835,es:"Sigue lloviendo.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:16,start:131.835,end:140.386,es:"Sigo trabajando en el mismo lugar.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:17,start:140.386,end:148.16,es:"¿Sigues viviendo en el centro?",group:"sigue lloviendo",group_index:2,level:"A2"},{i:18,start:148.16,end:158.673,es:"Mi abuelo sigue manejando a los noventa años.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:19,start:158.673,end:166.609,es:"Seguimos esperando el autobús.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:20,start:166.609,end:174.366,es:"Los niños siguen durmiendo.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:21,start:174.366,end:184.543,es:"Ella siguió hablando toda la noche.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:22,start:184.543,end:194.638,es:"Sigue intentándolo, ya casi lo tienes.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:23,start:194.638,end:204.64,es:"A pesar del frío, seguimos caminando.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:24,start:206.14,end:213.902,es:"Mi hermana sigue enferma.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:25,start:213.902,end:219.934,es:"¿Sigues aquí?",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:26,start:219.934,end:227.359,es:"La tienda sigue cerrada.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:27,start:227.359,end:234.886,es:"El café sigue caliente.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:28,start:234.886,end:242.288,es:"Seguimos en el aeropuerto.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:29,start:242.288,end:252.906,es:"Mis padres siguen casados después de cuarenta años.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:30,start:252.906,end:259.959,es:"Sigo muy cansado.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:31,start:259.959,end:267.129,es:"¿Sigue abierto el banco?",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:32,start:267.129,end:275.134,es:"El problema sigue igual.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:33,start:276.634,end:284.036,es:"Sigue las instrucciones.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:34,start:284.036,end:292.366,es:"Seguí tu consejo y funcionó.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:35,start:292.366,end:299.861,es:"Hay que seguir las reglas.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:36,start:299.861,end:307.692,es:"No seguiste la receta, ¿verdad?",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:37,start:307.692,end:317.184,es:"Siempre sigo los consejos de mi madre.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:38,start:317.184,end:326.815,es:"Sigue el mapa y no te vas a perder.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:39,start:326.815,end:336.434,es:"Seguimos las señales hasta la salida.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:40,start:336.434,end:347.203,es:"El médico me dijo que siguiera una dieta.",group:"seguir instrucciones y consejos",group_index:4,level:"B1"},{i:41,start:348.703,end:355.501,es:"Sigo sin entender.",group:"seguir sin",group_index:5,level:"B1"},{i:42,start:355.501,end:363.379,es:"Seguimos sin noticias de él.",group:"seguir sin",group_index:5,level:"B1"},{i:43,start:363.379,end:372.355,es:"El vecino sigue sin pagar el alquiler.",group:"seguir sin",group_index:5,level:"B1"},{i:44,start:372.355,end:380.709,es:"Sigo sin encontrar mis llaves.",group:"seguir sin",group_index:5,level:"B1"},{i:45,start:380.709,end:393.161,es:"Llevo una hora en la cama y sigo sin poder dormir.",group:"seguir sin",group_index:5,level:"B1"},{i:46,start:393.161,end:401.782,es:"La computadora sigue sin funcionar.",group:"seguir sin",group_index:5,level:"B1"},{i:47,start:401.782,end:410.24,es:"Siguen sin contestar el teléfono.",group:"seguir sin",group_index:5,level:"B1"},{i:48,start:410.24,end:418.49,es:"Mi hijo sigue sin saber nadar.",group:"seguir sin",group_index:5,level:"B1"},{i:49,start:419.99,end:427.217,es:"Espero que sigas bien.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:50,start:427.217,end:435.641,es:"Ojalá siga haciendo buen tiempo.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:51,start:435.641,end:444.819,es:"Si sigues así, vas a llegar lejos.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:52,start:444.819,end:452.43,es:"¡Que siga la fiesta!",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:53,start:452.43,end:461.294,es:"No creo que siga lloviendo mañana.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:54,start:461.294,end:471.064,es:"Seguiría estudiando si tuviera más tiempo.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:55,start:471.064,end:480.869,es:"Sigue así, lo estás haciendo muy bien.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:56,start:480.869,end:487.9,es:"¿Cómo sigue tu madre?",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:57,start:487.9,end:495.824,es:"Me pidió que siguiera adelante.",group:"sigue así, que sigas bien",group_index:6,level:"B1"}],xt={word:ut,slug:dt,kind:pt,hash:gt,duration:ct,voice:vt,marks:mt},_t="soler",At="soler",ht="word",bt="087fccc8b0da417b",ft=551.928,qt="mx",yt=[{i:0,start:.5,end:8.471,es:"Suelo desayunar a las siete.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:1,start:8.471,end:17.37,es:"Mi padre suele leer el periódico.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:2,start:17.37,end:25.027,es:"Solemos comer en casa.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:3,start:25.027,end:33.486,es:"Ella suele llegar temprano.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:4,start:33.486,end:41.433,es:"Suelo caminar al trabajo.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:5,start:41.433,end:50.162,es:"Los niños suelen dormir la siesta.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:6,start:50.162,end:58.632,es:"Mis abuelos suelen cenar temprano.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:7,start:58.632,end:66.893,es:"Suelo beber agua con la comida.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:8,start:66.893,end:75.757,es:"Los sábados solemos ir al mercado.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:9,start:77.257,end:84.857,es:"¿Sueles cocinar en casa?",group:"preguntas",group_index:1,level:"A1"},{i:10,start:84.857,end:93.231,es:"¿A qué hora sueles levantarte?",group:"preguntas",group_index:1,level:"A1"},{i:11,start:93.231,end:100.888,es:"¿Dónde suelen comer ustedes?",group:"preguntas",group_index:1,level:"A1"},{i:12,start:100.888,end:109.033,es:"¿Qué sueles hacer los domingos?",group:"preguntas",group_index:1,level:"A1"},{i:13,start:109.033,end:116.632,es:"¿Sueles viajar en verano?",group:"preguntas",group_index:1,level:"A1"},{i:14,start:116.632,end:124.266,es:"¿Cómo sueles ir al trabajo?",group:"preguntas",group_index:1,level:"A1"},{i:15,start:124.266,end:133.989,es:"¿Tu hermana suele llamar los fines de semana?",group:"preguntas",group_index:1,level:"A1"},{i:16,start:133.989,end:142.11,es:"¿Qué suele cenar tu familia?",group:"preguntas",group_index:1,level:"A1"},{i:17,start:143.61,end:151.326,es:"No suelo ver la televisión.",group:"no suelo",group_index:2,level:"A2"},{i:18,start:151.326,end:160.322,es:"Mi madre no suele cocinar los lunes.",group:"no suelo",group_index:2,level:"A2"},{i:19,start:160.322,end:167.99,es:"No solemos salir de noche.",group:"no suelo",group_index:2,level:"A2"},{i:20,start:167.99,end:175.659,es:"Él no suele llegar tarde.",group:"no suelo",group_index:2,level:"A2"},{i:21,start:175.659,end:183.409,es:"No suelo comer carne roja.",group:"no suelo",group_index:2,level:"A2"},{i:22,start:183.409,end:192.863,es:"Los domingos no suelen abrir las tiendas.",group:"no suelo",group_index:2,level:"A2"},{i:23,start:192.863,end:201.415,es:"No suelo dormir bien en los aviones.",group:"no suelo",group_index:2,level:"A2"},{i:24,start:201.415,end:212.742,es:"Mis amigos no suelen contestar los mensajes rápido.",group:"no suelo",group_index:2,level:"A2"},{i:25,start:214.242,end:223.06,es:"En agosto suele hacer mucho calor.",group:"lo normal",group_index:3,level:"A2"},{i:26,start:223.06,end:231.982,es:"En esta ciudad suele llover en abril.",group:"lo normal",group_index:3,level:"A2"},{i:27,start:231.982,end:239.872,es:"El tren suele llegar puntual.",group:"lo normal",group_index:3,level:"A2"},{i:28,start:239.872,end:248.841,es:"Los lunes suele haber mucho tráfico.",group:"lo normal",group_index:3,level:"A2"},{i:29,start:248.841,end:257.543,es:"Este restaurante suele estar lleno.",group:"lo normal",group_index:3,level:"A2"},{i:30,start:257.543,end:266.352,es:"La primera clase suele ser fácil.",group:"lo normal",group_index:3,level:"A2"},{i:31,start:266.352,end:275.507,es:"En invierno suele nevar en las montañas.",group:"lo normal",group_index:3,level:"A2"},{i:32,start:275.507,end:285.161,es:"Las entradas del museo suelen costar poco.",group:"lo normal",group_index:3,level:"A2"},{i:33,start:286.661,end:296.663,es:"De niño, solía jugar en la calle.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:34,start:296.663,end:306.688,es:"Mi abuela solía hacer pan los domingos.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:35,start:306.688,end:316.331,es:"Solíamos ir a la playa en verano.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:36,start:316.331,end:325.102,es:"¿Qué solías hacer después de clase?",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:37,start:325.102,end:333.305,es:"Mi padre solía fumar mucho.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:38,start:333.305,end:343.64,es:"En la universidad, solía estudiar de noche.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:39,start:343.64,end:352.993,es:"Mis primos solían visitarnos en Navidad.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:40,start:352.993,end:362.136,es:"Solía tomar el autobús a las siete.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:41,start:362.136,end:371.848,es:"Ella solía escribir cartas a mano.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:42,start:373.348,end:383.78,es:"Antes solía correr, pero ahora prefiero nadar.",group:"antes y ahora",group_index:5,level:"A2"},{i:43,start:383.78,end:394.758,es:"Solía tomar tres cafés al día, pero ya no.",group:"antes y ahora",group_index:5,level:"A2"},{i:44,start:394.758,end:407.721,es:"Antes solíamos cenar juntos, pero ahora cada uno come a su hora.",group:"antes y ahora",group_index:5,level:"B1"},{i:45,start:407.721,end:419.406,es:"Antes no solía leer, y ahora leo todas las noches.",group:"antes y ahora",group_index:5,level:"B1"},{i:46,start:419.406,end:433.53,es:"Mi hermano solía ser muy tímido, pero ha cambiado mucho.",group:"antes y ahora",group_index:5,level:"B1"},{i:47,start:433.53,end:446.528,es:"Antes solíamos escribirnos cartas, y hoy todo es por mensaje.",group:"antes y ahora",group_index:5,level:"B1"},{i:48,start:446.528,end:459.781,es:"Este barrio solía ser tranquilo, pero ahora hay mucho ruido.",group:"antes y ahora",group_index:5,level:"B1"},{i:49,start:459.781,end:469.261,es:"Ya no suelo acostarme tarde como antes.",group:"antes y ahora",group_index:5,level:"B1"},{i:50,start:470.761,end:480.671,es:"Eso no suele pasar en un lugar tan tranquilo.",group:"no suele pasar",group_index:6,level:"B1"},{i:51,start:480.671,end:490.673,es:"Como suele pasar, el vuelo salió tarde.",group:"no suele pasar",group_index:6,level:"B1"},{i:52,start:490.673,end:501.726,es:"Como solía decir mi abuelo, el tiempo es oro.",group:"no suele pasar",group_index:6,level:"B1"},{i:53,start:501.726,end:510.765,es:"Esto no suele ocurrir en esta empresa.",group:"no suele pasar",group_index:6,level:"B1"},{i:54,start:510.765,end:522.184,es:"Lo que suele pasar es que nadie lee las instrucciones.",group:"no suele pasar",group_index:6,level:"B1"},{i:55,start:522.184,end:531.432,es:"Los problemas suelen resolverse hablando.",group:"no suele pasar",group_index:6,level:"B1"},{i:56,start:531.432,end:540.904,es:"Es raro, porque él no suele equivocarse.",group:"no suele pasar",group_index:6,level:"B1"},{i:57,start:540.904,end:551.87,es:"Como se suele decir, más vale tarde que nunca.",group:"no suele pasar",group_index:6,level:"B1"}],jt={word:_t,slug:At,kind:ht,hash:bt,duration:ft,voice:qt,marks:yt},Bt="tener",zt="tener",Mt="word",Et="a5494f3b556b7244",kt=539.712,$t="mx",wt=[{i:0,start:.5,end:7.333,es:"Tengo dos hermanos.",group:"tener, poseer",group_index:0,level:"A1"},{i:1,start:7.333,end:14.313,es:"¿Tienes un bolígrafo?",group:"tener, poseer",group_index:0,level:"A1"},{i:2,start:14.313,end:23.468,es:"Mi abuela tiene un gato negro.",group:"tener, poseer",group_index:0,level:"A1"},{i:3,start:23.468,end:30.15,es:"No tenemos auto.",group:"tener, poseer",group_index:0,level:"A1"},{i:4,start:30.15,end:39.003,es:"Esta casa tiene tres habitaciones.",group:"tener, poseer",group_index:0,level:"A1"},{i:5,start:39.003,end:46.962,es:"¿Tiene usted una mesa para dos?",group:"tener, poseer",group_index:0,level:"A1"},{i:6,start:46.962,end:55.49,es:"Ellos tienen una tienda en el centro.",group:"tener, poseer",group_index:0,level:"A1"},{i:7,start:55.49,end:62.439,es:"Hoy no tengo tiempo.",group:"tener, poseer",group_index:0,level:"A1"},{i:8,start:62.439,end:71.002,es:"Mi hermana tiene el pelo largo.",group:"tener, poseer",group_index:0,level:"A1"},{i:9,start:72.502,end:80.786,es:"Aquí tienes las llaves.",group:"aquí tienes",group_index:1,level:"A1"},{i:10,start:80.786,end:89.697,es:"Aquí tiene su café, señora.",group:"aquí tienes",group_index:1,level:"A1"},{i:11,start:89.697,end:96.553,es:"Aquí tienen el menú.",group:"aquí tienes",group_index:1,level:"A1"},{i:12,start:96.553,end:103.885,es:"Aquí tienes tu cambio.",group:"aquí tienes",group_index:1,level:"A1"},{i:13,start:105.385,end:112.45,es:"Tengo treinta años.",group:"tener años",group_index:2,level:"A1"},{i:14,start:112.45,end:119.457,es:"¿Cuántos años tienes?",group:"tener años",group_index:2,level:"A1"},{i:15,start:119.457,end:127.776,es:"Mi hijo tiene cinco años.",group:"tener años",group_index:2,level:"A1"},{i:16,start:127.776,end:136.42,es:"Mi abuelo tiene noventa años.",group:"tener años",group_index:2,level:"A1"},{i:17,start:136.42,end:144.623,es:"El perro ya tiene diez años.",group:"tener años",group_index:2,level:"A1"},{i:18,start:144.623,end:155.473,es:"Cuando tenía veinte años, vivía en Lima.",group:"tener años",group_index:2,level:"A2"},{i:19,start:156.973,end:164.305,es:"Tengo mucha hambre.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:20,start:164.305,end:170.237,es:"¿Tienes sed?",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:21,start:170.237,end:177.588,es:"Los niños tienen frío.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:22,start:177.588,end:185.907,es:"En verano siempre tengo calor.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:23,start:185.907,end:194.539,es:"Tengo sueño, me voy a dormir.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:24,start:194.539,end:202.858,es:"Mi hija tiene miedo de los perros.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:25,start:202.858,end:210.31,es:"Lo siento, tengo prisa.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:26,start:210.31,end:217.7,es:"¿No tienen hambre todavía?",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A1"},{i:27,start:217.7,end:225.45,es:"Anoche tuve mucho miedo.",group:"tener hambre, sed, frío, calor, sueño, miedo, prisa",group_index:3,level:"A2"},{i:28,start:226.95,end:234.967,es:"Tengo que trabajar mañana.",group:"tener que",group_index:4,level:"A1"},{i:29,start:234.967,end:241.82,es:"Tienes que descansar.",group:"tener que",group_index:4,level:"A1"},{i:30,start:241.82,end:249.28,es:"Tenemos que comprar pan.",group:"tener que",group_index:4,level:"A1"},{i:31,start:249.28,end:256.893,es:"¿A qué hora tienes que salir?",group:"tener que",group_index:4,level:"A1"},{i:32,start:256.893,end:265.022,es:"Los niños tienen que estudiar.",group:"tener que",group_index:4,level:"A1"},{i:33,start:265.022,end:273.214,es:"No tienes que venir si no quieres.",group:"tener que",group_index:4,level:"A1"},{i:34,start:273.214,end:281.37,es:"Ayer tuve que ir al médico.",group:"tener que",group_index:4,level:"A2"},{i:35,start:281.37,end:291.138,es:"Tuvimos que esperar dos horas en el aeropuerto.",group:"tener que",group_index:4,level:"A2"},{i:36,start:292.638,end:300.656,es:"Tengo ganas de ir a la playa.",group:"tener ganas de",group_index:5,level:"A2"},{i:37,start:300.656,end:308.649,es:"No tengo ganas de cocinar hoy.",group:"tener ganas de",group_index:5,level:"A2"},{i:38,start:308.649,end:317.205,es:"¿Tienes ganas de salir esta noche?",group:"tener ganas de",group_index:5,level:"A2"},{i:39,start:317.205,end:325.466,es:"Tengo muchas ganas de verte.",group:"tener ganas de",group_index:5,level:"A2"},{i:40,start:325.466,end:334.049,es:"Los niños tienen ganas de jugar.",group:"tener ganas de",group_index:5,level:"A2"},{i:41,start:334.049,end:342.716,es:"Hoy no tenía ganas de levantarme.",group:"tener ganas de",group_index:5,level:"A2"},{i:42,start:342.716,end:352.161,es:"Tenemos ganas de conocer tu nueva casa.",group:"tener ganas de",group_index:5,level:"A2"},{i:43,start:353.661,end:359.949,es:"Tienes razón.",group:"tener razón, tener cuidado",group_index:6,level:"A1"},{i:44,start:359.949,end:368.628,es:"Creo que mi madre tenía razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:45,start:368.628,end:376.238,es:"No siempre tienes razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:46,start:376.238,end:383.617,es:"Ten cuidado con el perro.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:47,start:383.617,end:393.43,es:"Tengan cuidado, el suelo está mojado.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:48,start:393.43,end:403.235,es:"Tienes que tener cuidado al cruzar la calle.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:49,start:403.235,end:411.241,es:"Al final, tuviste razón.",group:"tener razón, tener cuidado",group_index:6,level:"A2"},{i:50,start:412.741,end:422.964,es:"De niño tenía una bicicleta roja.",group:"tenía, tuve",group_index:7,level:"A2"},{i:51,start:422.964,end:432.711,es:"Antes no teníamos computadora en casa.",group:"tenía, tuve",group_index:7,level:"A2"},{i:52,start:432.711,end:441.634,es:"Ayer tuve una reunión muy larga.",group:"tenía, tuve",group_index:7,level:"A2"},{i:53,start:441.634,end:450.054,es:"El año pasado tuvieron un bebé.",group:"tenía, tuve",group_index:7,level:"A2"},{i:54,start:450.054,end:458.996,es:"Tuvimos un problema con el hotel.",group:"tenía, tuve",group_index:7,level:"A2"},{i:55,start:458.996,end:466.369,es:"¿Tuviste un buen viaje?",group:"tenía, tuve",group_index:7,level:"A2"},{i:56,start:466.369,end:475.756,es:"La semana pasada tuve mucho trabajo.",group:"tenía, tuve",group_index:7,level:"A2"},{i:57,start:477.256,end:484.867,es:"Eso no tiene nada que ver.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:58,start:484.867,end:493.929,es:"Su trabajo tiene que ver con la música.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:59,start:493.929,end:502.956,es:"¿Qué tiene que ver eso con nuestro problema?",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:60,start:502.956,end:511.124,es:"Espero que tengas un buen día.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:61,start:511.124,end:523.008,es:"Si tuviera más tiempo, aprendería a tocar la guitarra.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:62,start:523.008,end:530.665,es:"No creo que tengan razón.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"},{i:63,start:530.665,end:539.658,es:"Me alegra que tengas tantos amigos.",group:"tener que ver con, tenga, tuviera",group_index:8,level:"B1"}],Nt={word:Bt,slug:zt,kind:Mt,hash:Et,duration:kt,voice:$t,marks:wt},St="tocar",Lt="tocar",Tt="word",Pt="8bba906fc6553c54",Ct=517.296,Ht="mx",Qt=[{i:0,start:.5,end:9.237,es:"No toques el horno, está caliente.",group:"tocar con la mano",group_index:0,level:"A1"},{i:1,start:9.237,end:16.372,es:"¿Puedo tocar al perro?",group:"tocar con la mano",group_index:0,level:"A1"},{i:2,start:16.372,end:24.249,es:"El bebé me toca la cara.",group:"tocar con la mano",group_index:0,level:"A1"},{i:3,start:24.249,end:32.429,es:"Por favor, no toquen los cuadros.",group:"tocar con la mano",group_index:0,level:"A1"},{i:4,start:32.429,end:40.054,es:"Me gusta tocar la arena.",group:"tocar con la mano",group_index:0,level:"A1"},{i:5,start:40.054,end:49.99,es:"Toca el agua, está muy fría.",group:"tocar con la mano",group_index:0,level:"A1"},{i:6,start:49.99,end:60.352,es:"No te toques los ojos con las manos sucias.",group:"tocar con la mano",group_index:0,level:"A2"},{i:7,start:60.352,end:69.356,es:"Alguien me tocó el hombro en el autobús.",group:"tocar con la mano",group_index:0,level:"A2"},{i:8,start:69.356,end:78.43,es:"Nunca había tocado la nieve.",group:"tocar con la mano",group_index:0,level:"B1"},{i:9,start:79.93,end:88.574,es:"Mi hermana toca el piano.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:10,start:88.574,end:95.307,es:"¿Tocas la guitarra?",group:"tocar un instrumento",group_index:1,level:"A1"},{i:11,start:95.307,end:103.266,es:"Él toca muy bien el violín.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:12,start:103.266,end:112.27,es:"Quiero aprender a tocar la batería.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:13,start:112.27,end:120.139,es:"La banda toca los sábados.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:14,start:120.139,end:128.137,es:"Toca algo para nosotros.",group:"tocar un instrumento",group_index:1,level:"A1"},{i:15,start:128.137,end:138.43,es:"De niño, tocaba la flauta en la escuela.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:16,start:138.43,end:147.307,es:"Anoche tocaron mi canción favorita.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:17,start:147.307,end:156.485,es:"Hace diez años que toco el saxofón.",group:"tocar un instrumento",group_index:1,level:"A2"},{i:18,start:157.985,end:165.143,es:"Alguien toca la puerta.",group:"tocar la puerta, el timbre",group_index:2,level:"A1"},{i:19,start:165.143,end:173.503,es:"Toca el timbre, por favor.",group:"tocar la puerta, el timbre",group_index:2,level:"A1"},{i:20,start:173.503,end:182.518,es:"Toqué la puerta, pero nadie abrió.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:21,start:182.518,end:191.325,es:"El cartero tocó el timbre dos veces.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:22,start:191.325,end:202.541,es:"Toca el timbre otra vez, creo que no te oyeron.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:23,start:202.541,end:212.171,es:"Antes de entrar, hay que tocar la puerta.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:24,start:212.171,end:222.848,es:"Los niños tocaron el timbre y salieron corriendo.",group:"tocar la puerta, el timbre",group_index:2,level:"A2"},{i:25,start:224.348,end:231.135,es:"Ahora te toca a ti.",group:"te toca, el turno",group_index:3,level:"A1"},{i:26,start:231.135,end:237.527,es:"¿A quién le toca?",group:"te toca, el turno",group_index:3,level:"A1"},{i:27,start:237.527,end:246.403,es:"Me toca lavar los platos hoy.",group:"te toca, el turno",group_index:3,level:"A2"},{i:28,start:246.403,end:256.405,es:"Mañana le toca cocinar a mi hermano.",group:"te toca, el turno",group_index:3,level:"A2"},{i:29,start:256.405,end:264.492,es:"Te toca elegir la película.",group:"te toca, el turno",group_index:3,level:"A2"},{i:30,start:264.492,end:271.371,es:"¿Cuándo me toca hablar?",group:"te toca, el turno",group_index:3,level:"A2"},{i:31,start:271.371,end:279.586,es:"Ayer le tocó sacar al perro.",group:"te toca, el turno",group_index:3,level:"A2"},{i:32,start:279.586,end:288.09,es:"Nos toca esperar una hora más.",group:"te toca, el turno",group_index:3,level:"A2"},{i:33,start:288.09,end:299.895,es:"La última vez pagué yo, así que hoy te toca a ti.",group:"te toca, el turno",group_index:3,level:"A2"},{i:34,start:299.895,end:309.27,es:"Al abuelo le toca ir al médico el lunes.",group:"te toca, el turno",group_index:3,level:"A2"},{i:35,start:310.77,end:317.626,es:"Me tocó la lotería.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:36,start:317.626,end:325.76,es:"Le tocó un viaje a la playa.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:37,start:325.76,end:334.462,es:"Nunca me toca nada en las rifas.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:38,start:334.462,end:344.394,es:"En el examen me tocó la pregunta más difícil.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:39,start:344.394,end:352.539,es:"Nos tocó un hotel muy bonito.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:40,start:352.539,end:359.662,es:"¿Qué te tocó en el sorteo?",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:41,start:359.662,end:368.759,es:"Me tocó un asiento al lado de la ventana.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:42,start:368.759,end:380.029,es:"A mi amiga le tocó trabajar el domingo.",group:"me tocó, el premio y la suerte",group_index:4,level:"A2"},{i:43,start:380.029,end:389.916,es:"Ojalá te toque un buen profesor este año.",group:"me tocó, el premio y la suerte",group_index:4,level:"B1"},{i:44,start:391.416,end:399.804,es:"No quiero tocar ese tema ahora.",group:"tocar un tema",group_index:5,level:"B1"},{i:45,start:399.804,end:410.178,es:"En la reunión tocamos varios temas importantes.",group:"tocar un tema",group_index:5,level:"B1"},{i:46,start:410.178,end:421.098,es:"Es mejor no tocar el tema de la política en la cena.",group:"tocar un tema",group_index:5,level:"B1"},{i:47,start:421.098,end:430.125,es:"El libro toca temas muy difíciles.",group:"tocar un tema",group_index:5,level:"B1"},{i:48,start:430.125,end:439.447,es:"¿Por qué siempre tocas temas tan tristes?",group:"tocar un tema",group_index:5,level:"B1"},{i:49,start:439.447,end:450.193,es:"Prefiero que no toques ese asunto delante de mis padres.",group:"tocar un tema",group_index:5,level:"B1"},{i:50,start:450.193,end:459.859,es:"El profesor solo tocó el tema por encima.",group:"tocar un tema",group_index:5,level:"B1"},{i:51,start:459.859,end:470.314,es:"Si tocas ese tema, se va a molestar.",group:"tocar un tema",group_index:5,level:"B1"},{i:52,start:471.814,end:481.34,es:"Nunca he estado enfermo, toco madera.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:53,start:481.34,end:489.601,es:"La película me tocó el corazón.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:54,start:489.601,end:500.072,es:"Después de tocar fondo, empezó a mejorar.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:55,start:500.072,end:508.925,es:"Sus palabras me tocaron mucho.",group:"expresiones con tocar",group_index:6,level:"B1"},{i:56,start:508.925,end:517.235,es:"Ese problema me toca de cerca.",group:"expresiones con tocar",group_index:6,level:"B1"}],Dt={word:St,slug:Lt,kind:Tt,hash:Pt,duration:Ct,voice:Ht,marks:Qt},Yt="verbos reflexivos",Vt="verbos_reflexivos",Ot="concept",It="0528f42902df2cf0",Ft=570.12,Rt="mx",Ut=[{i:0,start:.5,end:7.946,es:"Me despierto a las siete.",group:"la rutina diaria",group_index:0,level:"A1"},{i:1,start:7.946,end:16.88,es:"Me levanto temprano todos los días.",group:"la rutina diaria",group_index:0,level:"A1"},{i:2,start:16.88,end:25.27,es:"Mi hermano se ducha por la noche.",group:"la rutina diaria",group_index:0,level:"A1"},{i:3,start:25.27,end:34.001,es:"Nos vestimos rápido por la mañana.",group:"la rutina diaria",group_index:0,level:"A1"},{i:4,start:34.001,end:42.459,es:"Los niños se acuestan a las nueve.",group:"la rutina diaria",group_index:0,level:"A1"},{i:5,start:42.459,end:49.594,es:"¿A qué hora te levantas?",group:"la rutina diaria",group_index:0,level:"A1"},{i:6,start:49.594,end:58.387,es:"Mi padre se afeita cada mañana.",group:"la rutina diaria",group_index:0,level:"A1"},{i:7,start:58.387,end:65.997,es:"Me peino antes de salir.",group:"la rutina diaria",group_index:0,level:"A1"},{i:8,start:65.997,end:74.978,es:"¿Te duchas por la mañana o por la noche?",group:"la rutina diaria",group_index:0,level:"A1"},{i:9,start:76.478,end:85.239,es:"Me lavo las manos antes de comer.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:10,start:85.239,end:94.904,es:"Ella se lava el pelo cada día.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:11,start:94.904,end:104.55,es:"Me cepillo los dientes después del desayuno.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:12,start:104.55,end:112.112,es:"El niño se lava la cara.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:13,start:112.112,end:120.149,es:"Mi madre se pinta las uñas.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:14,start:120.149,end:128.503,es:"Se pone los zapatos en la puerta.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:15,start:128.503,end:136.462,es:"Me quito el abrigo al entrar.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A1"},{i:16,start:136.462,end:144.746,es:"Me corto el pelo una vez al mes.",group:"con partes del cuerpo y la ropa",group_index:1,level:"A2"},{i:17,start:146.246,end:155.517,es:"Me enojo cuando hay mucho tráfico.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:18,start:155.517,end:163.778,es:"Mi madre se preocupa por todo.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:19,start:163.778,end:171.9,es:"Nos alegramos mucho de verte.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:20,start:171.9,end:180.255,es:"Los niños se aburren en el auto.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:21,start:180.255,end:189.607,es:"Me pongo nervioso antes de un examen.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:22,start:189.607,end:198.971,es:"Ella se cansa mucho en el trabajo.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:23,start:198.971,end:206.422,es:"¿Por qué te enojas tanto?",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:24,start:206.422,end:214.137,es:"Hoy me siento mucho mejor.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:25,start:214.137,end:222.097,es:"Él se pone triste cuando llueve.",group:"sentimientos y cambios",group_index:2,level:"A2"},{i:26,start:223.597,end:232.25,es:"Levántate, ya es tarde.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:27,start:232.25,end:239.5,es:"Voy a ducharme ahora.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:28,start:239.5,end:247.378,es:"Siéntate aquí, por favor.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:29,start:247.378,end:256.091,es:"No te preocupes, todo está bien.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:30,start:256.091,end:264.515,es:"Tengo que acostarme temprano hoy.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:31,start:264.515,end:274.45,es:"Lávate las manos, la cena está lista.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:32,start:274.45,end:283.643,es:"Ponte el abrigo, hace frío.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:33,start:283.643,end:292.484,es:"Necesito relajarme un poco.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:34,start:292.484,end:301.128,es:"Cálmate, no pasa nada.",group:"en mandatos e infinitivos",group_index:3,level:"A2"},{i:35,start:301.128,end:309.725,es:"Acuérdate de llamarme cuando llegues.",group:"en mandatos e infinitivos",group_index:3,level:"B1"},{i:36,start:311.225,end:319.312,es:"Ayer me levanté muy tarde.",group:"en pasado",group_index:4,level:"A2"},{i:37,start:319.312,end:328.498,es:"Esta mañana me duché con agua fría.",group:"en pasado",group_index:4,level:"A2"},{i:38,start:328.498,end:338.547,es:"Cuando era niño, me acostaba a las ocho.",group:"en pasado",group_index:4,level:"A2"},{i:39,start:338.547,end:347.423,es:"Mi hermana se casó el año pasado.",group:"en pasado",group_index:4,level:"A2"},{i:40,start:347.423,end:355.147,es:"¿A qué hora te despertaste hoy?",group:"en pasado",group_index:4,level:"A2"},{i:41,start:355.147,end:364.526,es:"Los niños se divirtieron mucho en el parque.",group:"en pasado",group_index:4,level:"A2"},{i:42,start:364.526,end:371.881,es:"Me caí en la escalera.",group:"en pasado",group_index:4,level:"A2"},{i:43,start:371.881,end:383.23,es:"Antes nos levantábamos a las seis para ir al trabajo.",group:"en pasado",group_index:4,level:"A2"},{i:44,start:383.23,end:392.873,es:"Ya me había vestido cuando llegó el taxi.",group:"en pasado",group_index:4,level:"B1"},{i:45,start:394.373,end:403.226,es:"Nos conocimos en un viaje a México.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:46,start:403.226,end:410.929,es:"Mis padres se quieren mucho.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:47,start:410.929,end:421.872,es:"Mi hermano y yo nos llamamos cada semana.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:48,start:421.872,end:431.538,es:"Los dos amigos se abrazaron en el aeropuerto.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:49,start:431.538,end:441.366,es:"Ellos se escriben mensajes todos los días.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:50,start:441.366,end:452.042,es:"Ana y Luis se ayudan con las tareas de la casa.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:51,start:452.042,end:460.998,es:"Los vecinos se saludan en la escalera.",group:"acciones recíprocas",group_index:5,level:"A2"},{i:52,start:460.998,end:470.222,es:"Es importante que nos escuchemos más.",group:"acciones recíprocas",group_index:5,level:"B1"},{i:53,start:470.222,end:479.47,es:"Ojalá se entiendan mejor con el tiempo.",group:"acciones recíprocas",group_index:5,level:"B1"},{i:54,start:480.97,end:488.198,es:"¿Cómo se llama tu perro?",group:"cambios de significado",group_index:6,level:"A1"},{i:55,start:488.198,end:496.842,es:"Ya me voy, es muy tarde.",group:"cambios de significado",group_index:6,level:"A2"},{i:56,start:496.842,end:506.168,es:"¿Por qué te fuiste tan temprano de la fiesta?",group:"cambios de significado",group_index:6,level:"A2"},{i:57,start:506.168,end:513.813,es:"El bebé se durmió en el auto.",group:"cambios de significado",group_index:6,level:"A2"},{i:58,start:513.813,end:522.225,es:"Hoy me quedo en casa porque llueve.",group:"cambios de significado",group_index:6,level:"A2"},{i:59,start:522.225,end:534.19,es:"Normalmente duermo bien, pero anoche me dormí muy tarde.",group:"cambios de significado",group_index:6,level:"B1"},{i:60,start:534.19,end:544.517,es:"Me quedé dormido y llegué tarde al trabajo.",group:"cambios de significado",group_index:6,level:"B1"},{i:61,start:544.517,end:553.556,es:"Se quedaron sin dinero al final del viaje.",group:"cambios de significado",group_index:6,level:"B1"},{i:62,start:553.556,end:562.527,es:"Me di cuenta del error demasiado tarde.",group:"cambios de significado",group_index:6,level:"B1"},{i:63,start:562.527,end:570.068,es:"No me acuerdo de su nombre.",group:"cambios de significado",group_index:6,level:"B1"}],Gt={word:Yt,slug:Vt,kind:Ot,hash:It,duration:Ft,voice:Rt,marks:Ut},Kt="vez",Xt="vez",Jt="word",Wt="8753893c27680bda",Zt=547.2,eu="mx",au=[{i:0,start:.5,end:9.922,es:"Voy al gimnasio tres veces por semana.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:1,start:9.922,end:19.065,es:"Como pescado una vez a la semana.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:2,start:19.065,end:27.965,es:"Llamo a mi madre dos veces al día.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:3,start:27.965,end:35.854,es:"Lee la pregunta dos veces.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:4,start:35.854,end:43.813,es:"Solo lo digo una vez.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:5,start:43.813,end:53.11,es:"Tomo esta medicina tres veces al día.",group:"una vez, dos veces",group_index:0,level:"A1"},{i:6,start:53.11,end:61.079,es:"Fui a París una vez.",group:"una vez, dos veces",group_index:0,level:"A2"},{i:7,start:62.579,end:70.359,es:"A veces trabajo en casa.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:8,start:70.359,end:77.761,es:"A veces llueve en verano.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:9,start:77.761,end:87.09,es:"Mi hermano a veces cocina para todos.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:10,start:87.09,end:95.966,es:"Muchas veces comemos juntos.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:11,start:95.966,end:103.902,es:"A veces no entiendo a mi jefe.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:12,start:103.902,end:112.72,es:"Muchas veces el tren llega tarde.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:13,start:112.72,end:121.283,es:"¿Vas mucho al cine? A veces.",group:"a veces, muchas veces",group_index:1,level:"A1"},{i:14,start:122.783,end:130.001,es:"¿Puedes decirlo otra vez?",group:"otra vez",group_index:2,level:"A1"},{i:15,start:130.001,end:136.636,es:"Otra vez llueve.",group:"otra vez",group_index:2,level:"A1"},{i:16,start:136.636,end:145.489,es:"Mañana vamos otra vez a la playa.",group:"otra vez",group_index:2,level:"A1"},{i:17,start:145.489,end:151.498,es:"¡Otra vez tú!",group:"otra vez",group_index:2,level:"A1"},{i:18,start:151.498,end:161.988,es:"El niño quiere ver la película otra vez.",group:"otra vez",group_index:2,level:"A1"},{i:19,start:161.988,end:170.609,es:"Mi teléfono otra vez no funciona.",group:"otra vez",group_index:2,level:"A1"},{i:20,start:170.609,end:178.417,es:"Perdí las llaves otra vez.",group:"otra vez",group_index:2,level:"A2"},{i:21,start:179.917,end:188.631,es:"Es la primera vez que vengo aquí.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A1"},{i:22,start:188.631,end:198.015,es:"La primera vez que la vi, no hablamos.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:23,start:198.015,end:206.891,es:"¿Cuándo fue la última vez que comiste?",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:24,start:206.891,end:217.92,es:"La última vez que fui, el museo estaba cerrado.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:25,start:217.92,end:227.899,es:"Esta es la última vez que te ayudo.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:26,start:227.899,end:238.18,es:"Recuerdo la primera vez que subí a un avión.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:27,start:238.18,end:248.02,es:"La próxima vez, llámame antes.",group:"la primera vez, la última vez, la próxima vez",group_index:3,level:"A2"},{i:28,start:249.52,end:257.803,es:"De vez en cuando como chocolate.",group:"de vez en cuando",group_index:4,level:"A2"},{i:29,start:257.803,end:266.935,es:"Mis primos nos visitan de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:30,start:266.935,end:276.077,es:"De vez en cuando me gusta caminar solo.",group:"de vez en cuando",group_index:4,level:"A2"},{i:31,start:276.077,end:284.536,es:"Vamos al teatro de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:32,start:284.536,end:294.092,es:"De vez en cuando escucho música clásica.",group:"de vez en cuando",group_index:4,level:"A2"},{i:33,start:294.092,end:302.911,es:"Es bueno descansar de vez en cuando.",group:"de vez en cuando",group_index:4,level:"A2"},{i:34,start:304.411,end:310.965,es:"Tal vez mañana.",group:"tal vez",group_index:5,level:"A2"},{i:35,start:310.965,end:318.541,es:"Tal vez voy a la fiesta.",group:"tal vez",group_index:5,level:"A2"},{i:36,start:318.541,end:325.699,es:"Tal vez tienes razón.",group:"tal vez",group_index:5,level:"A2"},{i:37,start:325.699,end:333.495,es:"Tal vez está en la cocina.",group:"tal vez",group_index:5,level:"A2"},{i:38,start:333.495,end:341.443,es:"Tal vez llueva esta tarde.",group:"tal vez",group_index:5,level:"B1"},{i:39,start:341.443,end:350.342,es:"Tal vez Ana no sepa la dirección.",group:"tal vez",group_index:5,level:"B1"},{i:40,start:350.342,end:359.067,es:"Tal vez podamos vernos el sábado.",group:"tal vez",group_index:5,level:"B1"},{i:41,start:360.567,end:369.084,es:"Hoy tomo té en vez de café.",group:"en vez de",group_index:6,level:"A2"},{i:42,start:369.084,end:378.587,es:"Vamos a pie en vez de tomar un taxi.",group:"en vez de",group_index:6,level:"A2"},{i:43,start:378.587,end:388.845,es:"En vez de ver la televisión, lee un libro.",group:"en vez de",group_index:6,level:"A2"},{i:44,start:388.845,end:397.605,es:"Compré pollo en vez de carne.",group:"en vez de",
