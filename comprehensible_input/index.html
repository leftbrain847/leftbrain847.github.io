1,level:"A1"},{i:14,start:146.853,end:159.969,es:"Me pasó lo mismo la semana pasada.",group:"lo mismo",group_index:1,level:"A2"},{i:15,start:161.469,end:169.426,es:"Ven ahora mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A1"},{i:16,start:169.426,end:179.25,es:"Ahora mismo estoy ocupado.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A1"},{i:17,start:179.25,end:189.301,es:"Te espero aquí mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:18,start:189.301,end:198.298,es:"Lo envío hoy mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:19,start:198.298,end:211.995,es:"El hotel está ahí mismo, al lado del parque.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:20,start:211.995,end:223.339,es:"Voy a llamarla ahora mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:21,start:223.339,end:234.688,es:"Puedes dejar las bolsas aquí mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:22,start:234.688,end:244.154,es:"Ayer mismo hablé con él.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:23,start:245.654,end:253.958,es:"Yo mismo lo hice.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:24,start:253.958,end:263.086,es:"Ella misma me lo dijo.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:25,start:263.086,end:272.756,es:"Lo puedo hacer yo misma.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:26,start:272.756,end:284.56,es:"Nosotros mismos pintamos la casa.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:27,start:284.56,end:295.714,es:"El director mismo vino a saludarnos.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:28,start:295.714,end:303.469,es:"Hazlo tú mismo.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:29,start:303.469,end:316.923,es:"Ellos mismos prepararon toda la comida.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:30,start:318.423,end:328.17,es:"Llegamos al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:31,start:328.17,end:339.539,es:"No hablen todos al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:32,start:339.539,end:353.773,es:"Puedo cocinar y escuchar música al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:33,start:353.773,end:366.451,es:"Sonaron los dos teléfonos al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:34,start:366.451,end:380.122,es:"Es difícil estudiar y trabajar al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:35,start:380.122,end:394.008,es:"Quiero ir, pero al mismo tiempo tengo miedo.",group:"al mismo tiempo",group_index:4,level:"B1"},{i:36,start:395.508,end:407.381,es:"Gano lo mismo que el año pasado.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:37,start:407.381,end:418.893,es:"Este vestido cuesta lo mismo que el otro.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:38,start:418.893,end:432.125,es:"Ella tiene la misma edad que mi hermana.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:39,start:432.125,end:444.367,es:"Mi casa es del mismo color que la tuya.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:40,start:444.367,end:454.962,es:"Hoy hace el mismo calor que ayer.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:41,start:454.962,end:468.459,es:"Estudiamos en la misma escuela que nuestros padres.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:42,start:469.959,end:477.369,es:"Me da lo mismo.",group:"da lo mismo",group_index:6,level:"A2"},{i:43,start:477.369,end:487.917,es:"¿Té o café? Me da lo mismo.",group:"da lo mismo",group_index:6,level:"A2"},{i:44,start:487.917,end:498.291,es:"Da lo mismo si llegas tarde.",group:"da lo mismo",group_index:6,level:"B1"},{i:45,start:498.291,end:509.65,es:"Le da lo mismo lo que piensen los demás.",group:"da lo mismo",group_index:6,level:"B1"},{i:46,start:509.65,end:520.61,es:"A mí me da lo mismo dónde comamos.",group:"da lo mismo",group_index:6,level:"B1"},{i:47,start:520.61,end:532.656,es:"Da lo mismo, ya no importa.",group:"da lo mismo",group_index:6,level:"B1"},{i:48,start:532.656,end:543.597,es:"Nos da lo mismo ir hoy o mañana.",group:"da lo mismo",group_index:6,level:"B1"},{i:49,start:545.097,end:554.589,es:"Solo piensa en sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:50,start:554.589,end:566.332,es:"Ella habla mucho de sí misma.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:51,start:566.332,end:578.343,es:"Ella cree mucho en sí misma.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:52,start:578.343,end:589.711,es:"El problema en sí mismo no es grave.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:53,start:589.711,end:598.749,es:"Él se ríe de sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:54,start:598.749,end:609.611,es:"Él no sabe cuidarse a sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:55,start:609.611,end:621.867,es:"Mi abuelo está muy seguro de sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"}],Io={word:Co,slug:Ho,kind:Qo,hash:Do,duration:Yo,voice:Vo,marks:Oo},Fo="pasar",Ro="pasar",Uo="word",Go="75f9bd21cbe3d06c",Ko=652.776,Xo="mx-lento",Jo=[{i:0,start:.5,end:12.752,es:"Pasa, pasa, estás en tu casa.",group:"pasar, entrar",group_index:0,level:"A1"},{i:1,start:12.752,end:19.68,es:"¿Puedo pasar?",group:"pasar, entrar",group_index:0,level:"A1"},{i:2,start:19.68,end:28.339,es:"Pasen, por favor.",group:"pasar, entrar",group_index:0,level:"A1"},{i:3,start:28.339,end:39.732,es:"Pase, la doctora lo espera.",group:"pasar, entrar",group_index:0,level:"A1"},{i:4,start:39.732,end:49.42,es:"No se puede pasar por aquí.",group:"pasar, entrar",group_index:0,level:"A1"},{i:5,start:49.42,end:60.035,es:"Déjame pasar, por favor.",group:"pasar, entrar",group_index:0,level:"A1"},{i:6,start:61.535,end:68.31,es:"¿Qué pasa?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:7,start:68.31,end:75.108,es:"¿Qué pasó?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:8,start:75.108,end:82.824,es:"No pasa nada.",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:9,start:82.824,end:89.831,es:"¿Qué te pasa?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:10,start:89.831,end:102.067,es:"Algo le pasa a mi computadora.",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:11,start:102.067,end:110.304,es:"¿Qué le pasa al bebé?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:12,start:110.304,end:121.101,es:"Esto siempre me pasa los lunes.",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:13,start:121.101,end:134.269,es:"Ayer pasó algo muy raro en la oficina.",group:"pasar, ocurrir",group_index:1,level:"A2"},{i:14,start:134.269,end:143.598,es:"¿Qué te ha pasado en la mano?",group:"pasar, ocurrir",group_index:1,level:"A2"},{i:15,start:145.098,end:156.75,es:"El autobús pasa cada diez minutos.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:16,start:156.75,end:166.452,es:"Paso por tu casa a las seis.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:17,start:166.452,end:176.411,es:"Este tren pasa por mi pueblo.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:18,start:176.411,end:189.845,es:"Pasamos por el parque de camino a casa.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:19,start:189.845,end:200.111,es:"Ayer pasé por la panadería.",group:"pasar por un lugar",group_index:2,level:"A2"},{i:20,start:200.111,end:214.218,es:"¿Puedes pasar por el supermercado después del trabajo?",group:"pasar por un lugar",group_index:2,level:"A2"},{i:21,start:214.218,end:225.853,es:"Un perro pasó corriendo por la calle.",group:"pasar por un lugar",group_index:2,level:"A2"},{i:22,start:227.353,end:238.682,es:"Paso mucho tiempo con mi familia.",group:"pasar el tiempo",group_index:3,level:"A1"},{i:23,start:238.682,end:248.793,es:"Pasamos el verano en la playa.",group:"pasar el tiempo",group_index:3,level:"A1"},{i:24,start:248.793,end:259.523,es:"Pasé la tarde leyendo.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:25,start:259.523,end:268.945,es:"¿Dónde pasaste la Navidad?",group:"pasar el tiempo",group_index:3,level:"A2"},{i:26,start:268.945,end:281.501,es:"Ella pasa horas delante de la computadora.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:27,start:281.501,end:297.587,es:"Hemos pasado una semana increíble en Perú.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:28,start:297.587,end:312.23,es:"Voy a pasar el fin de semana con mis abuelos.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:29,start:313.73,end:321.659,es:"¡Que lo pases bien!",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:30,start:321.659,end:332.433,es:"Lo pasamos muy bien en la fiesta.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:31,start:332.433,end:346.293,es:"Los niños lo pasaron genial en el parque.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:32,start:346.293,end:359.359,es:"Lo pasé muy mal en el viaje en barco.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:33,start:359.359,end:369.322,es:"¿Lo pasaste bien en el concierto?",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:34,start:369.322,end:382.074,es:"Mi abuela lo pasó mal cuando estuvo enferma.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:35,start:382.074,end:393.272,es:"Siempre lo pasamos bien juntos.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:36,start:394.772,end:405.269,es:"El tiempo pasa muy rápido.",group:"el tiempo pasa",group_index:5,level:"A1"},{i:37,start:405.269,end:414.405,es:"Ya pasaron tres años.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:38,start:414.405,end:425.613,es:"Pasaron muchos días sin noticias.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:39,start:425.613,end:438.089,es:"Han pasado diez minutos y no ha llegado.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:40,start:438.089,end:449.31,es:"Con los años, el dolor pasa.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:41,start:449.31,end:458.285,es:"Ya pasó la tormenta.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:42,start:458.285,end:472.918,es:"Cuando pase el invierno, vamos a pintar la casa.",group:"el tiempo pasa",group_index:5,level:"B1"},{i:43,start:474.418,end:483.008,es:"¿Me pasas la sal?",group:"pasar algo a alguien",group_index:6,level:"A1"},{i:44,start:483.008,end:494.307,es:"Pásame el agua, por favor.",group:"pasar algo a alguien",group_index:6,level:"A1"},{i:45,start:494.307,end:506.384,es:"Te paso el número de mi hermano.",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:46,start:506.384,end:518.298,es:"Le pasé el balón a mi amigo.",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:47,start:518.298,end:528.852,es:"¿Me pasaste las fotos del viaje?",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:48,start:528.852,end:543.661,es:"Ya le he pasado el mensaje a mi jefe.",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:49,start:545.161,end:559.26,es:"Pasé el examen de matemáticas a la primera.",group:"expresiones con pasar",group_index:7,level:"A2"},{i:50,start:559.26,end:571.085,es:"Me pasé de parada en el autobús.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:51,start:571.085,end:582.176,es:"Ya se me pasó el dolor de cabeza.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:52,start:582.176,end:591.099,es:"No te pases con la sal.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:53,start:591.099,end:604.099,es:"Se me pasó llamarte, lo siento mucho.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:54,start:604.099,end:617.499,es:"Pasamos por momentos difíciles el año pasado.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:55,start:617.499,end:628.861,es:"Ojalá que no le pase nada malo.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:56,start:628.861,end:641.85,es:"Pase lo que pase, yo estoy contigo.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:57,start:641.85,end:652.716,es:"Esa canción ya pasó de moda.",group:"expresiones con pasar",group_index:7,level:"B1"}],Wo={word:Fo,slug:Ro,kind:Uo,hash:Go,duration:Ko,voice:Xo,marks:Jo},Zo="poner(se)",er="poner_se",ar="word",or="705e59af0d4fa9f1",rr=723.984,sr="mx-lento",nr=[{i:0,start:.5,end:9.734,es:"Pon las llaves en la mesa.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:1,start:9.734,end:18.842,es:"¿Dónde pongo mi abrigo?",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:2,start:18.842,end:30.416,es:"Pongo la leche en el refrigerador.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:3,start:30.416,end:41.041,es:"Ella pone las flores en el agua.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:4,start:41.041,end:51.354,es:"No pongas los pies en el sofá.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:5,start:51.354,end:62.126,es:"Pon los zapatos debajo de la cama.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:6,start:62.126,end:71.826,es:"¿Pusiste azúcar en mi café?",group:"poner algo en un lugar",group_index:0,level:"A2"},{i:7,start:71.826,end:81.375,es:"Puse tu libro en la mochila.",group:"poner algo en un lugar",group_index:0,level:"A2"},{i:8,start:82.875,end:90.099,es:"¿Pongo la tele?",group:"poner la tele, la música",group_index:1,level:"A1"},{i:9,start:90.099,end:100.269,es:"Pon música, por favor.",group:"poner la tele, la música",group_index:1,level:"A1"},{i:10,start:100.269,end:111.801,es:"Mi padre pone la radio por la mañana.",group:"poner la tele, la música",group_index:1,level:"A1"},{i:11,start:111.801,end:121.566,es:"¿Puedes poner la calefacción?",group:"poner la tele, la música",group_index:1,level:"A1"},{i:12,start:121.566,end:132.165,es:"Pon el ventilador, por favor.",group:"poner la tele, la música",group_index:1,level:"A1"},{i:13,start:132.165,end:142.108,es:"Puse el despertador a las seis.",group:"poner la tele, la música",group_index:1,level:"A2"},{i:14,start:142.108,end:154.498,es:"Pon una película, estoy aburrido.",group:"poner la tele, la música",group_index:1,level:"A2"},{i:15,start:154.498,end:170.175,es:"Voy a poner el aire acondicionado, hace mucho calor.",group:"poner la tele, la música",group_index:1,level:"A2"},{i:16,start:171.675,end:182.833,es:"Pon la mesa, vamos a comer.",group:"poner la mesa",group_index:2,level:"A1"},{i:17,start:182.833,end:193.775,es:"Yo pongo la mesa y tú cocinas.",group:"poner la mesa",group_index:2,level:"A1"},{i:18,start:193.775,end:202.662,es:"¿Quién pone la mesa hoy?",group:"poner la mesa",group_index:2,level:"A1"},{i:19,start:202.662,end:215.021,es:"Los niños ponen la mesa todas las noches.",group:"poner la mesa",group_index:2,level:"A1"},{i:20,start:215.021,end:227.424,es:"Ayúdame a poner la mesa, por favor.",group:"poner la mesa",group_index:2,level:"A1"},{i:21,start:227.424,end:237.97,es:"Ya puse la mesa para la cena.",group:"poner la mesa",group_index:2,level:"A2"},{i:22,start:239.47,end:251.817,es:"Ponte el abrigo, hace frío.",group:"ponerse ropa",group_index:3,level:"A1"},{i:23,start:251.817,end:260.592,es:"Me pongo los zapatos.",group:"ponerse ropa",group_index:3,level:"A1"},{i:24,start:260.592,end:275.409,es:"Ella siempre se pone un vestido rojo.",group:"ponerse ropa",group_index:3,level:"A1"},{i:25,start:275.409,end:285.475,es:"Ponte el cinturón de seguridad.",group:"ponerse ropa",group_index:3,level:"A1"},{i:26,start:285.475,end:297.14,es:"No me pongo esos pantalones nunca.",group:"ponerse ropa",group_index:3,level:"A1"},{i:27,start:297.14,end:307.63,es:"¿Qué te vas a poner para la fiesta?",group:"ponerse ropa",group_index:3,level:"A2"},{i:28,start:307.63,end:318.654,es:"Hoy me puse la camisa de mi hermano.",group:"ponerse ropa",group_index:3,level:"A2"},{i:29,start:318.654,end:330.257,es:"Los niños ya se pusieron el pijama.",group:"ponerse ropa",group_index:3,level:"A2"},{i:30,start:331.757,end:341.58,es:"Le pusieron Ana a la niña.",group:"poner nombre",group_index:4,level:"A2"},{i:31,start:341.58,end:352.586,es:"¿Qué nombre le vas a poner al perro?",group:"poner nombre",group_index:4,level:"A2"},{i:32,start:352.586,end:363.152,es:"Le pusimos Luna a nuestra gata.",group:"poner nombre",group_index:4,level:"A2"},{i:33,start:363.152,end:375.466,es:"Mis padres me pusieron el nombre de mi abuelo.",group:"poner nombre",group_index:4,level:"A2"},{i:34,start:375.466,end:388.07,es:"Todavía no le han puesto nombre al bebé.",group:"poner nombre",group_index:4,level:"A2"},{i:35,start:388.07,end:400.387,es:"¿Por qué le pusieron ese nombre al restaurante?",group:"poner nombre",group_index:4,level:"A2"},{i:36,start:400.387,end:414.017,es:"En el colegio le pusieron un apodo muy gracioso.",group:"poner nombre",group_index:4,level:"B1"},{i:37,start:415.517,end:427.611,es:"Me pongo nervioso antes de un examen.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:38,start:427.611,end:440.807,es:"Mi madre se puso muy contenta con la noticia.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:39,start:440.807,end:451.727,es:"El cielo se puso gris de repente.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:40,start:451.727,end:462.624,es:"Cuando la vio, se puso rojo.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:41,start:462.624,end:471.267,es:"No te pongas triste.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:42,start:471.267,end:486.387,es:"Mi abuela se puso enferma el invierno pasado.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:43,start:486.387,end:499.316,es:"Se pone de mal humor cuando tiene hambre.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:44,start:499.316,end:510.9,es:"Me puse muy feliz cuando llamaste.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:45,start:512.4,end:524.874,es:"De repente, el bebé se puso a llorar.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:46,start:524.874,end:538.383,es:"Cuando llegué a casa, me puse a cocinar.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:47,start:538.383,end:550.208,es:"Se puso a llover justo cuando salimos.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:48,start:550.208,end:564.505,es:"Ponte a estudiar, mañana tienes examen.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:49,start:564.505,end:579.687,es:"Después de cenar, nos pusimos a jugar a las cartas.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:50,start:579.687,end:594.127,es:"Si me pongo a ver la tele, no termino nunca.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:51,start:594.127,end:610.141,es:"Mi hermano se pone a cantar en la ducha todas las mañanas.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:52,start:610.141,end:623.185,es:"Quiero que te pongas a trabajar ahora mismo.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:53,start:624.685,end:634.72,es:"Nunca nos ponemos de acuerdo.",group:"ponerse de acuerdo",group_index:7,level:"A2"},{i:54,start:634.72,end:647.262,es:"Al final nos pusimos de acuerdo sobre el viaje.",group:"ponerse de acuerdo",group_index:7,level:"A2"},{i:55,start:647.262,end:660.341,es:"Tenemos que ponernos de acuerdo antes del viernes.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:56,start:660.341,end:673.061,es:"Es difícil que todos se pongan de acuerdo.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:57,start:673.061,end:684.906,es:"¿Ya se pusieron de acuerdo sobre el precio?",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:58,start:684.906,end:699.492,es:"Mis padres no se ponen de acuerdo sobre el nombre del perro.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:59,start:699.492,end:711.332,es:"Ojalá nos pongamos de acuerdo pronto.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:60,start:711.332,end:723.917,es:"Si no se ponen de acuerdo, no habrá fiesta.",group:"ponerse de acuerdo",group_index:7,level:"B1"}],lr={word:Zo,slug:er,kind:ar,hash:or,duration:rr,voice:sr,marks:nr},ir="por / para",tr="por_para",ur="word",dr="52152cf1b331a47c",pr=673.44,gr="mx-lento",cr=[{i:0,start:.5,end:8.965,es:"Estudio para aprender.",group:"para: finalidad",group_index:0,level:"A1"},{i:1,start:8.965,end:17.358,es:"Trabajo para vivir.",group:"para: finalidad",group_index:0,level:"A1"},{i:2,start:17.358,end:29.088,es:"Voy al mercado para comprar fruta.",group:"para: finalidad",group_index:0,level:"A1"},{i:3,start:29.088,end:39.283,es:"Necesito dinero para el viaje.",group:"para: finalidad",group_index:0,level:"A1"},{i:4,start:39.283,end:51.54,es:"Esta caja es para los libros.",group:"para: finalidad",group_index:0,level:"A1"},{i:5,start:51.54,end:59.534,es:"¿Para qué sirve esto?",group:"para: finalidad",group_index:0,level:"A1"},{i:6,start:59.534,end:69.974,es:"Me levanto temprano para correr.",group:"para: finalidad",group_index:0,level:"A1"},{i:7,start:69.974,end:80.359,es:"Ahorro para comprar una casa.",group:"para: finalidad",group_index:0,level:"A2"},{i:8,start:81.859,end:91.308,es:"Este regalo es para ti.",group:"para: destinatario",group_index:1,level:"A1"},{i:9,start:91.308,end:101.54,es:"Las flores son para mi madre.",group:"para: destinatario",group_index:1,level:"A1"},{i:10,start:101.54,end:110.113,es:"¿Para quién es el café?",group:"para: destinatario",group_index:1,level:"A1"},{i:11,start:110.113,end:119.608,es:"Hay una carta para usted.",group:"para: destinatario",group_index:1,level:"A1"},{i:12,start:119.608,end:132.146,es:"Trabaja para una empresa grande.",group:"para: destinatario",group_index:1,level:"A1"},{i:13,start:132.146,end:141.398,es:"Hice la cena para todos.",group:"para: destinatario",group_index:1,level:"A2"},{i:14,start:142.898,end:153.132,es:"Mañana salimos para la playa.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:15,start:153.132,end:164.572,es:"El tren para Quito sale a las ocho.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:16,start:164.572,end:174.737,es:"¿Este autobús va para el centro?",group:"para: destino y plazo",group_index:2,level:"A2"},{i:17,start:174.737,end:185.598,es:"Necesito el informe para el lunes.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:18,start:185.598,end:195.949,es:"La tarea es para mañana.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:19,start:195.949,end:207.197,es:"Para las seis ya estoy en casa.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:20,start:207.197,end:218.449,es:"Para el verano quiero hablar mejor.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:21,start:219.949,end:233.633,es:"Para mí, esta película es aburrida.",group:"para mí: opinión",group_index:3,level:"A2"},{i:22,start:233.633,end:248.175,es:"Para ella, la familia es lo primero.",group:"para mí: opinión",group_index:3,level:"A2"},{i:23,start:248.175,end:259.532,es:"Para mi gusto, hay demasiada sal.",group:"para mí: opinión",group_index:3,level:"A2"},{i:24,start:259.532,end:273.445,es:"Para nosotros, el domingo es el mejor día.",group:"para mí: opinión",group_index:3,level:"A2"},{i:25,start:273.445,end:288.084,es:"Para un niño tan pequeño, lee muy bien.",group:"para mí: opinión",group_index:3,level:"B1"},{i:26,start:288.084,end:300.075,es:"Hace mucho calor para ser diciembre.",group:"para mí: opinión",group_index:3,level:"B1"},{i:27,start:301.575,end:310.4,es:"Gracias por la comida.",group:"por: causa",group_index:4,level:"A1"},{i:28,start:310.4,end:318.918,es:"Perdón por la espera.",group:"por: causa",group_index:4,level:"A1"},{i:29,start:318.918,end:326.071,es:"Lo hice por ti.",group:"por: causa",group_index:4,level:"A2"},{i:30,start:326.071,end:335.341,es:"No salimos por la lluvia.",group:"por: causa",group_index:4,level:"A2"},{i:31,start:335.341,end:345.274,es:"Llegué tarde por el tráfico.",group:"por: causa",group_index:4,level:"A2"},{i:32,start:345.274,end:355.148,es:"Está cansado por el viaje.",group:"por: causa",group_index:4,level:"A2"},{i:33,start:355.148,end:366.476,es:"Me preocupo mucho por mi hijo.",group:"por: causa",group_index:4,level:"A2"},{i:34,start:367.976,end:377.349,es:"Caminamos por el parque.",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:35,start:377.349,end:386.341,es:"Estudio por la mañana.",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:36,start:386.341,end:395.203,es:"Hablamos por teléfono.",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:37,start:395.203,end:404.664,es:"¿Hay una farmacia por aquí?",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:38,start:404.664,end:414.24,es:"El gato entró por la ventana.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:39,start:414.24,end:424.797,es:"Paso por tu casa a las cinco.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:40,start:424.797,end:434.764,es:"Te mando las fotos por correo.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:41,start:434.764,end:445.217,es:"Viví en Perú por dos años.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:42,start:446.717,end:456.789,es:"Te cambio mi libro por el tuyo.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:43,start:456.789,end:467.43,es:"Pagamos mucho por esta casa.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:44,start:467.43,end:478.962,es:"Vendió su auto por muy poco dinero.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:45,start:478.962,end:492.269,es:"Cambié la camisa por una más grande.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:46,start:492.269,end:501.981,es:"Mañana trabajo yo por ti.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:47,start:501.981,end:512.228,es:"¿Cuánto pagaste por esa chaqueta?",group:"por: cambio y precio",group_index:6,level:"A2"},{i:48,start:513.728,end:524.489,es:"Por favor, cierra la puerta.",group:"por fin, por eso, por favor",group_index:7,level:"A1"},{i:49,start:524.489,end:532.264,es:"¡Por fin llegaste!",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:50,start:532.264,end:542.003,es:"Por supuesto que puedes venir.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:51,start:542.003,end:552.983,es:"Estaba enfermo, por eso no vine.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:52,start:552.983,end:562.856,es:"Por cierto, ¿viste a Juan ayer?",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:53,start:562.856,end:571.795,es:"Por ahora todo está bien.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:54,start:571.795,end:581.356,es:"Por suerte, no pasó nada.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:55,start:582.856,end:594.779,es:"Salí por la mañana para llegar temprano.",group:"por y para juntos",group_index:8,level:"B1"},{i:56,start:594.779,end:605.159,es:"Lo hice por ti, no para mí.",group:"por y para juntos",group_index:8,level:"B1"},{i:57,start:605.159,end:617.825,es:"Pasamos por Lima para visitar a mis tíos.",group:"por y para juntos",group_index:8,level:"B1"},{i:58,start:617.825,end:630.716,es:"Te llamo por teléfono para confirmar la hora.",group:"por y para juntos",group_index:8,level:"B1"},{i:59,start:630.716,end:643.621,es:"Estudia por las noches para aprobar el examen.",group:"por y para juntos",group_index:8,level:"B1"},{i:60,start:643.621,end:659.727,es:"Gracias por el regalo, es perfecto para mi casa nueva.",group:"por y para juntos",group_index:8,level:"B1"},{i:61,start:659.727,end:673.387,es:"Para llegar al hotel, hay que pasar por el puente.",group:"por y para juntos",group_index:8,level:"B1"}],vr={word:ir,slug:tr,kind:ur,hash:dr,duration:pr,voice:gr,marks:cr},mr="que",xr="que",_r="word",Ar="4fd6ba6eda174f62",hr=645.96,br="mx-lento",fr=[{i:0,start:.5,end:10.468,es:"Tengo que trabajar mañana.",group:"tener que, hay que",group_index:0,level:"A1"},{i:1,start:10.468,end:20.172,es:"Tienes que probar esta sopa.",group:"tener que, hay que",group_index:0,level:"A1"},{i:2,start:20.172,end:29.049,es:"Hay que salir temprano.",group:"tener que, hay que",group_index:0,level:"A1"},{i:3,start:29.049,end:38.113,es:"Tenemos que comprar pan.",group:"tener que, hay que",group_index:0,level:"A1"},{i:4,start:38.113,end:47.709,es:"Hay que pagar en efectivo.",group:"tener que, hay que",group_index:0,level:"A1"},{i:5,start:47.709,end:55.238,es:"¿Tienes que ir hoy?",group:"tener que, hay que",group_index:0,level:"A1"},{i:6,start:55.238,end:65.366,es:"Mis hijos tienen que estudiar.",group:"tener que, hay que",group_index:0,level:"A1"},{i:7,start:65.366,end:76.146,es:"Hay que tener cuidado con el perro.",group:"tener que, hay que",group_index:0,level:"A1"},{i:8,start:77.646,end:89.189,es:"La chica que canta es mi prima.",group:"el libro que leí",group_index:1,level:"A1"},{i:9,start:89.189,end:102.886,es:"Tengo un amigo que vive en Chile.",group:"el libro que leí",group_index:1,level:"A1"},{i:10,start:102.886,end:115.003,es:"El tren que va a Lima sale ahora.",group:"el libro que leí",group_index:1,level:"A1"},{i:11,start:115.003,end:126.309,es:"Es una película que me gusta mucho.",group:"el libro que leí",group_index:1,level:"A1"},{i:12,start:126.309,end:140.397,es:"Las personas que trabajan aquí son muy amables.",group:"el libro que leí",group_index:1,level:"A1"},{i:13,start:140.397,end:150.426,es:"El libro que leí es muy bueno.",group:"el libro que leí",group_index:1,level:"A2"},{i:14,start:150.426,end:162.7,es:"La casa que compramos es pequeña.",group:"el libro que leí",group_index:1,level:"A2"},{i:15,start:162.7,end:174.93,es:"¿Dónde está la camisa que me regalaste?",group:"el libro que leí",group_index:1,level:"A2"},{i:16,start:174.93,end:187.493,es:"El restaurante que te recomendé está cerrado.",group:"el libro que leí",group_index:1,level:"A2"},{i:17,start:188.993,end:198.523,es:"Creo que va a llover.",group:"creo que",group_index:2,level:"A1"},{i:18,start:198.523,end:207.834,es:"Dice que está cansado.",group:"creo que",group_index:2,level:"A1"},{i:19,start:207.834,end:216.997,es:"Pienso que tienes razón.",group:"creo que",group_index:2,level:"A1"},{i:20,start:216.997,end:225.613,es:"Sé que es difícil.",group:"creo que",group_index:2,level:"A1"},{i:21,start:225.613,end:234.609,es:"Parece que no hay nadie.",group:"creo que",group_index:2,level:"A1"},{i:22,start:234.609,end:242.15,es:"Supongo que sí.",group:"creo que",group_index:2,level:"A1"},{i:23,start:242.15,end:251.805,es:"Estoy seguro de que lo sabe.",group:"creo que",group_index:2,level:"A2"},{i:24,start:251.805,end:261.673,es:"Me dijo que no podía venir.",group:"creo que",group_index:2,level:"A2"},{i:25,start:261.673,end:270.921,es:"Veo que ya terminaste.",group:"creo que",group_index:2,level:"A2"},{i:26,start:272.421,end:284.082,es:"Mi hermano es más alto que yo.",group:"más que, menos que",group_index:3,level:"A1"},{i:27,start:284.082,end:294.894,es:"Este auto es más caro que el otro.",group:"más que, menos que",group_index:3,level:"A2"},{i:28,start:294.894,end:305.378,es:"Hoy hace menos frío que ayer.",group:"más que, menos que",group_index:3,level:"A2"},{i:29,start:305.378,end:316.012,es:"Me gusta más el té que el café.",group:"más que, menos que",group_index:3,level:"A2"},{i:30,start:316.012,end:327.707,es:"Corre más rápido que su padre.",group:"más que, menos que",group_index:3,level:"A2"},{i:31,start:327.707,end:337.864,es:"Ella trabaja más que nadie.",group:"más que, menos que",group_index:3,level:"A2"},{i:32,start:337.864,end:348.781,es:"La película es peor que el libro.",group:"más que, menos que",group_index:3,level:"A2"},{i:33,start:348.781,end:358.99,es:"Ahora gana menos que antes.",group:"más que, menos que",group_index:3,level:"A2"},{i:34,start:358.99,end:368.791,es:"Más vale tarde que nunca.",group:"más que, menos que",group_index:3,level:"A2"},{i:35,start:370.291,end:379.418,es:"Es que no tengo tiempo.",group:"es que",group_index:4,level:"A2"},{i:36,start:379.418,end:390.877,es:"Lo siento, es que estaba ocupado.",group:"es que",group_index:4,level:"A2"},{i:37,start:390.877,end:403.306,es:"No puedo ir, es que estoy enfermo.",group:"es que",group_index:4,level:"A2"},{i:38,start:403.306,end:411.927,es:"¿Es que no me escuchas?",group:"es que",group_index:4,level:"A2"},{i:39,start:411.927,end:421.005,es:"Es que no sabía nada.",group:"es que",group_index:4,level:"A2"},{i:40,start:421.005,end:433.462,es:"Perdón, es que había mucho tráfico.",group:"es que",group_index:4,level:"A2"},{i:41,start:433.462,end:443.081,es:"Es que hoy no me siento bien.",group:"es que",group_index:4,level:"A2"},{i:42,start:444.581,end:456.918,es:"Estaba cansado, así que me acosté.",group:"así que, ya que",group_index:5,level:"A2"},{i:43,start:456.918,end:468.969,es:"Está lloviendo, así que no salimos.",group:"así que, ya que",group_index:5,level:"A2"},{i:44,start:468.969,end:481.595,es:"Ya que estás aquí, ayúdame con esto.",group:"así que, ya que",group_index:5,level:"B1"},{i:45,start:481.595,end:493.478,es:"Ya que tienes tiempo, ¿vamos al cine?",group:"así que, ya que",group_index:5,level:"B1"},{i:46,start:494.978,end:504.911,es:"Quiero que vengas a mi casa.",group:"quiero que vengas",group_index:6,level:"B1"},{i:47,start:504.911,end:513.044,es:"Espero que te guste.",group:"quiero que vengas",group_index:6,level:"B1"},{i:48,start:513.044,end:521.866,es:"Necesito que me ayudes.",group:"quiero que vengas",group_index:6,level:"B1"},{i:49,start:521.866,end:532.527,es:"Es importante que duermas bien.",group:"quiero que vengas",group_index:6,level:"B1"},{i:50,start:532.527,end:543.227,es:"Prefiero que hablemos mañana.",group:"quiero que vengas",group_index:6,level:"B1"},{i:51,start:543.227,end:555.978,es:"Mi madre quiere que la llame todos los días.",group:"quiero que vengas",group_index:6,level:"B1"},{i:52,start:555.978,end:565.705,es:"Es mejor que salgamos ya.",group:"quiero que vengas",group_index:6,level:"B1"},{i:53,start:565.705,end:575.499,es:"No creo que llegue a tiempo.",group:"quiero que vengas",group_index:6,level:"B1"},{i:54,start:576.999,end:584.895,es:"¡Que te vaya bien!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:55,start:584.895,end:592.1,es:"Que descanses.",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:56,start:592.1,end:600.942,es:"¡Que tengas buen viaje!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:57,start:600.942,end:609.551,es:"¡Que te mejores pronto!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:58,start:609.551,end:618.863,es:"¡Que sean muy felices!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:59,start:618.863,end:626.911,es:"Que duermas bien.",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:60,start:626.911,end:636.293,es:"¡Que disfrutes la fiesta!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:61,start:636.293,end:645.894,es:"¡Que cumplas muchos más!",group:"¡que te vaya bien!",group_index:7,level:"B1"}],qr={word:mr,slug:xr,kind:_r,hash:Ar,duration:hr,voice:br,marks:fr},yr="quedar(se)",jr="quedar_se",Br="word",zr="1d3ca3a9c73c8bd4",Mr=639.936,Er="mx-lento",kr=[{i:0,start:.5,end:9.045,es:"Hoy me quedo en casa.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:1,start:9.045,end:17.091,es:"¿Te quedas a cenar?",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:2,start:17.091,end:27.534,es:"Nos quedamos en un hotel pequeño.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:3,start:27.534,end:38.301,es:"Mi hermana se queda con nosotros.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:4,start:38.301,end:48.757,es:"Quédate aquí un momento.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:5,start:48.757,end:59.335,es:"Prefiero quedarme en la cama.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:6,start:59.335,end:71.514,es:"Ayer nos quedamos en la playa todo el día.",group:"quedarse en un lugar",group_index:0,level:"A2"},{i:7,start:71.514,end:84.196,es:"Me quedé dos semanas en casa de mis abuelos.",group:"quedarse en un lugar",group_index:0,level:"A2"},{i:8,start:85.696,end:94.119,es:"¿Dónde queda el museo?",group:"quedar, estar situado",group_index:1,level:"A1"},{i:9,start:94.119,end:104.233,es:"El banco queda muy cerca.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:10,start:104.233,end:115.059,es:"Mi casa queda lejos del centro.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:11,start:115.059,end:128.062,es:"La farmacia queda al lado del mercado.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:12,start:128.062,end:137.019,es:"¿Queda lejos la estación?",group:"quedar, estar situado",group_index:1,level:"A1"},{i:13,start:137.019,end:148.205,es:"La escuela queda a dos calles de aquí.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:14,start:148.205,end:160.161,es:"El restaurante queda enfrente del parque.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:15,start:161.661,end:171.598,es:"Queda un poco de café.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:16,start:171.598,end:179.209,es:"No queda leche.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:17,start:179.209,end:187.925,es:"¿Cuánto dinero te queda?",group:"quedar, sobrar",group_index:2,level:"A1"},{i:18,start:187.925,end:197.528,es:"Solo quedan dos asientos.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:19,start:197.528,end:208.587,es:"Quedan cinco minutos para el final.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:20,start:208.587,end:219.603,es:"Me quedan tres días de vacaciones.",group:"quedar, sobrar",group_index:2,level:"A2"},{i:21,start:219.603,end:230.604,es:"No quedaba nada en el refrigerador.",group:"quedar, sobrar",group_index:2,level:"A2"},{i:22,start:230.604,end:241.535,es:"Todavía nos queda mucho trabajo.",group:"quedar, sobrar",group_index:2,level:"A2"},{i:23,start:243.035,end:254.034,es:"Esa camisa te queda muy bien.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:24,start:254.034,end:265.142,es:"Estos zapatos me quedan pequeños.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:25,start:265.142,end:275.127,es:"El vestido le queda grande.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:26,start:275.127,end:284.569,es:"¿Cómo me queda este sombrero?",group:"quedar bien o mal",group_index:3,level:"A2"},{i:27,start:284.569,end:295.551,es:"El azul te queda mejor que el rojo.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:28,start:295.551,end:306.27,es:"Los pantalones ya no me quedan.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:29,start:306.27,end:316.223,es:"Quedé muy mal con mi jefe.",group:"quedar bien o mal",group_index:3,level:"B1"},{i:30,start:316.223,end:326.955,es:"Quiero quedar bien con tus padres.",group:"quedar bien o mal",group_index:3,level:"B1"},{i:31,start:328.455,end:338.262,es:"La sopa quedó muy rica.",group:"quedar, resultado",group_index:4,level:"A2"},{i:32,start:338.262,end:348.265,es:"¡Qué bonita quedó tu habitación!",group:"quedar, resultado",group_index:4,level:"A2"},{i:33,start:348.265,end:358.381,es:"La casa quedó muy limpia.",group:"quedar, resultado",group_index:4,level:"A2"},{i:34,start:358.381,end:371.134,es:"La puerta quedó abierta toda la noche.",group:"quedar, resultado",group_index:4,level:"A2"},{i:35,start:371.134,end:385.989,es:"Con la pintura nueva, la cocina quedó como nueva.",group:"quedar, resultado",group_index:4,level:"A2"},{i:36,start:385.989,end:397.315,es:"Mi dibujo no quedó como yo quería.",group:"quedar, resultado",group_index:4,level:"A2"},{i:37,start:397.315,end:411.764,es:"Después de la tormenta, la calle quedó sin luz.",group:"quedar, resultado",group_index:4,level:"B1"},{i:38,start:413.264,end:423.688,es:"Me quedé sorprendido con la noticia.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:39,start:423.688,end:433.191,es:"Se quedó dormido en el sofá.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:40,start:433.191,end:442.392,es:"El niño se quedó callado.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:41,start:442.392,end:456.364,es:"Nos quedamos sin gasolina en la carretera.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:42,start:456.364,end:468.887,es:"Mi abuela se quedó sola después de la mudanza.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:43,start:468.887,end:480.421,es:"Me quedé mirando el mar un buen rato.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:44,start:480.421,end:493.674,es:"Se quedaron hablando hasta la medianoche.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:45,start:493.674,end:506.916,es:"Si sigues así, te vas a quedar sin amigos.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"B1"},{i:46,start:508.416,end:518.392,es:"Me quedo con la camisa verde.",group:"quedarse con algo",group_index:6,level:"A2"},{i:47,start:518.392,end:526.897,es:"Quédate con el cambio.",group:"quedarse con algo",group_index:6,level:"A2"},{i:48,start:526.897,end:537.352,es:"Mi hermano se quedó con mi libro.",group:"quedarse con algo",group_index:6,level:"A2"},{i:49,start:537.352,end:547.73,es:"¿Te puedes quedar con mis llaves?",group:"quedarse con algo",group_index:6,level:"A2"},{i:50,start:547.73,end:561.78,es:"Al final nos quedamos con el apartamento más grande.",group:"quedarse con algo",group_index:6,level:"B1"},{i:51,start:563.28,end:573.199,es:"Quedamos en vernos el lunes.",group:"quedar en algo",group_index:7,level:"B1"},{i:52,start:573.199,end:585.846,es:"Habíamos quedado en llamarnos esta tarde.",group:"quedar en algo",group_index:7,level:"B1"},{i:53,start:585.846,end:597.524,es:"Quedaron en traer la comida a la fiesta.",group:"quedar en algo",group_index:7,level:"B1"},{i:54,start:597.524,end:608.014,es:"¿En qué quedamos, vienes o no?",group:"quedar en algo",group_index:7,level:"B1"},{i:55,start:608.014,end:620.217,es:"Quedé en ayudar a mi vecino con la mudanza.",group:"quedar en algo",group_index:7,level:"B1"},{i:56,start:620.217,end:628.649,es:"Todo quedó en nada.",group:"quedar en algo",group_index:7,level:"B1"},{i:57,start:628.649,end:639.875,es:"Quedamos en encontrarnos en la plaza.",group:"quedar en algo",group_index:7,level:"B1"}],$r={word:yr,slug:jr,kind:Br,hash:zr,duration:Mr,voice:Er,marks:kr},wr="sacar",Nr="sacar",Sr="word",Lr="fe2d5ce0f32cd92b",Tr=721.344,Pr="mx-lento",Cr=[{i:0,start:.5,end:11.225,es:"Saca la leche del refrigerador.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:1,start:11.225,end:23.412,es:"Ella saca un libro de la mochila.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:2,start:23.412,end:34.868,es:"¿Puedes sacar los platos del armario?",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:3,start:34.868,end:46.09,es:"Saco las llaves del bolsillo.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:4,start:46.09,end:56.592,es:"Saquen sus cuadernos, por favor.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:5,start:56.592,end:67.342,es:"Sacamos las maletas del auto.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:6,start:67.342,end:77.348,es:"El dentista me sacó una muela.",group:"sacar algo de un lugar",group_index:0,level:"A2"},{i:7,start:77.348,end:87.94,es:"¿Ya sacaste la ropa de la lavadora?",group:"sacar algo de un lugar",group_index:0,level:"A2"},{i:8,start:89.44,end:99.786,es:"¿Quién saca la basura hoy?",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:9,start:99.786,end:112.278,es:"Saco al perro todas las mañanas.",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:10,start:112.278,end:127.538,es:"Por favor, saca la basura antes de dormir.",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:11,start:127.538,end:140.325,es:"Mi hijo nunca saca la basura.",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:12,start:140.325,end:151.883,es:"Voy a sacar al perro a pasear.",group:"sacar la basura, sacar al perro",group_index:1,level:"A2"},{i:13,start:151.883,end:163.038,es:"Ayer se me olvidó sacar la basura.",group:"sacar la basura, sacar al perro",group_index:1,level:"A2"},{i:14,start:163.038,end:175.904,es:"Saqué a los niños al parque un rato.",group:"sacar la basura, sacar al perro",group_index:1,level:"A2"},{i:15,start:177.404,end:186.035,es:"¿Me sacas una foto?",group:"sacar fotos",group_index:2,level:"A1"},{i:16,start:186.035,end:196.954,es:"Aquí no se pueden sacar fotos.",group:"sacar fotos",group_index:2,level:"A1"},{i:17,start:196.954,end:207.136,es:"Mi madre saca fotos de todo.",group:"sacar fotos",group_index:2,level:"A1"},{i:18,start:207.136,end:216.885,es:"Saca una foto del mar.",group:"sacar fotos",group_index:2,level:"A1"},{i:19,start:216.885,end:228.561,es:"Sacamos muchas fotos en el viaje.",group:"sacar fotos",group_index:2,level:"A2"},{i:20,start:228.561,end:239.658,es:"¿Puedes sacarnos una foto a los dos?",group:"sacar fotos",group_index:2,level:"A2"},{i:21,start:239.658,end:252.949,es:"Le saqué una foto al atardecer con el teléfono.",group:"sacar fotos",group_index:2,level:"A2"},{i:22,start:254.449,end:263.755,es:"Necesito sacar dinero.",group:"sacar dinero",group_index:3,level:"A1"},{i:23,start:263.755,end:274.713,es:"¿Hay un cajero para sacar dinero?",group:"sacar dinero",group_index:3,level:"A1"},{i:24,start:274.713,end:286.056,es:"Saqué dinero del cajero de la esquina.",group:"sacar dinero",group_index:3,level:"A2"},{i:25,start:286.056,end:300.911,es:"No pude sacar dinero porque el cajero no funcionaba.",group:"sacar dinero",group_index:3,level:"A2"},{i:26,start:300.911,end:314.145,es:"Voy a sacar dinero antes de ir al mercado.",group:"sacar dinero",group_index:3,level:"A2"},{i:27,start:314.145,end:327.082,es:"Mi abuelo saca dinero del banco cada mes.",group:"sacar dinero",group_index:3,level:"A2"},{i:28,start:327.082,end:341.264,es:"Si sacas dinero en otro banco, te cobran más.",group:"sacar dinero",group_index:3,level:"A2"},{i:29,start:342.764,end:356.119,es:"Mi hermana siempre saca buenas notas.",group:"sacar buena nota",group_index:4,level:"A1"},{i:30,start:356.119,end:367.601,es:"Saqué un diez en matemáticas.",group:"sacar buena nota",group_index:4,level:"A2"},{i:31,start:367.601,end:378.439,es:"¿Qué nota sacaste en el examen?",group:"sacar buena nota",group_index:4,level:"A2"},{i:32,start:378.439,end:390.64,es:"Este año he sacado mejores notas.",group:"sacar buena nota",group_index:4,level:"A2"},{i:33,start:390.64,end:403.225,es:"Si estudias, vas a sacar buena nota.",group:"sacar buena nota",group_index:4,level:"A2"},{i:34,start:403.225,end:414.386,es:"No saqué buena nota, pero aprobé.",group:"sacar buena nota",group_index:4,level:"A2"},{i:35,start:414.386,end:428.077,es:"Ojalá saque buena nota en el examen de inglés.",group:"sacar buena nota",group_index:4,level:"B1"},{i:36,start:429.577,end:441.878,es:"Ya saqué los boletos para el concierto.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:37,start:441.878,end:453.251,es:"Hay que sacar las entradas por internet.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:38,start:453.251,end:464.217,es:"¿Dónde puedo sacar un boleto de tren?",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:39,start:464.217,end:477.477,es:"Mi hijo acaba de sacar la licencia de conducir.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:40,start:477.477,end:491.061,es:"Tengo que sacar el pasaporte antes del viaje.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:41,start:491.061,end:504.901,es:"Vamos a sacar entradas para el partido del sábado.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:42,start:504.901,end:518.805,es:"Me gustaría sacar los boletos con tiempo.",group:"sacar entradas, boletos, documentos",group_index:5,level:"B1"},{i:43,start:520.305,end:531.858,es:"¿Qué conclusión sacaste de la película?",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"A2"},{i:44,start:531.858,end:543.66,es:"No saques conclusiones tan rápido.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:45,start:543.66,end:559.765,es:"Después de la reunión, sacamos varias conclusiones.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:46,start:559.765,end:569.64,es:"Ese ruido me saca de quicio.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:47,start:569.64,end:582.425,es:"Mi hermano me saca de quicio cuando no escucha.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:48,start:582.425,end:594.554,es:"No dejes que el tráfico te saque de quicio.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:49,start:594.554,end:607.889,es:"Es mejor esperar antes de sacar conclusiones.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:50,start:607.889,end:620.063,es:"Me sacó de quicio que llegara tan tarde.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:51,start:621.563,end:636.023,es:"Mis padres trabajaron mucho para sacarnos adelante.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:52,start:636.023,end:647.999,es:"Hay que sacar provecho de las vacaciones.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:53,start:647.999,end:659.835,es:"No sé de dónde sacas tanta energía.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:54,start:659.835,end:671.795,es:"Siempre saca tiempo para su familia.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:55,start:671.795,end:681.824,es:"¿Quién sacó el tema del dinero?",group:"expresiones con sacar",group_index:7,level:"B1"},{i:56,start:681.824,end:691.951,es:"No me saques de mis casillas.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:57,start:691.951,end:707.41,es:"Ella sacó una idea genial de un libro viejo.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:58,start:707.41,end:721.273,es:"Siempre sabe sacar lo mejor de cada situación.",group:"expresiones con sacar",group_index:7,level:"B1"}],Hr={word:wr,slug:Nr,kind:Sr,hash:Lr,duration:Tr,voice:Pr,marks:Cr},Qr="saludos y despedidas",Dr="saludos_y_despedidas",Yr="concept",Vr="1bc1c6bbffee8506",Or=594.36,Ir="mx-lento",Fr=[{i:0,start:.5,end:9.388,es:"Hola, ¿qué tal?",group:"saludar",group_index:0,level:"A1"},{i:1,start:9.388,end:19.172,es:"Buenas, ¿cómo estás?",group:"saludar",group_index:0,level:"A1"},{i:2,start:19.172,end:25.998,es:"¿Cómo te va?",group:"saludar",group_index:0,level:"A1"},{i:3,start:25.998,end:35.335,es:"Hola, ¿cómo andas?",group:"saludar",group_index:0,level:"A1"},{i:4,start:35.335,end:41.74,es:"¿Todo bien?",group:"saludar",group_index:0,level:"A1"},{i:5,start:41.74,end:48.547,es:"¿Qué cuentas?",group:"saludar",group_index:0,level:"A1"},{i:6,start:48.547,end:56.27,es:"¿Qué hay de nuevo?",group:"saludar",group_index:0,level:"A1"},{i:7,start:56.27,end:66.571,es:"¡Hola, cuánto tiempo!",group:"saludar",group_index:0,level:"A2"},{i:8,start:66.571,end:74.623,es:"¡Qué gusto verte!",group:"saludar",group_index:0,level:"A2"},{i:9,start:76.123,end:84.904,es:"Muy bien, gracias.",group:"responder",group_index:1,level:"A1"},{i:10,start:84.904,end:92.885,es:"Aquí, tranquilo.",group:"responder",group_index:1,level:"A1"},{i:11,start:92.885,end:102.951,es:"Más o menos, la verdad.",group:"responder",group_index:1,level:"A1"},{i:12,start:102.951,end:115.231,es:"Bastante bien, un poco cansado.",group:"responder",group_index:1,level:"A1"},{i:13,start:115.231,end:125.849,es:"Nada nuevo, lo de siempre.",group:"responder",group_index:1,level:"A2"},{i:14,start:125.849,end:132.618,es:"Ahí vamos.",group:"responder",group_index:1,level:"A2"},{i:15,start:134.118,end:142.141,es:"Bien, ¿y tú?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:16,start:142.141,end:153.45,es:"Todo tranquilo, ¿y tú qué tal?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:17,start:153.45,end:164.821,es:"Muy bien, ¿y a ti cómo te va?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:18,start:164.821,end:177.252,es:"Bien, gracias, ¿y tú cómo estás?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:19,start:177.252,end:189.726,es:"Pues aquí, trabajando, ¿y tú?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:20,start:189.726,end:203.87,es:"Aquí, como siempre, ¿y tú qué cuentas?",group:"devolver la pregunta",group_index:2,level:"A2"},{i:21,start:205.37,end:212.383,es:"Hasta luego.",group:"decir adiós",group_index:3,level:"A1"},{i:22,start:212.383,end:219.114,es:"Nos vemos.",group:"decir adiós",group_index:3,level:"A1"},{i:23,start:219.114,end:227.433,es:"Nos vemos mañana.",group:"decir adiós",group_index:3,level:"A1"},{i:24,start:227.433,end:236.02,es:"Nos vemos otro día.",group:"decir adiós",group_index:3,level:"A1"},{i:25,start:236.02,end:243.669,es:"Hablamos luego.",group:"decir adiós",group_index:3,level:"A1"},{i:26,start:243.669,end:250.725,es:"Hasta pronto.",group:"decir adiós",group_index:3,level:"A1"},{i:27,start:250.725,end:258.499,es:"Te escribo luego.",group:"decir adiós",group_index:3,level:"A1"},{i:28,start:259.999,end:267.047,es:"Igualmente.",group:"responder a una despedida",group_index:4,level:"A1"},{i:29,start:267.047,end:276.772,es:"Tú también, cuídate.",group:"responder a una despedida",group_index:4,level:"A1"},{i:30,start:276.772,end:285.67,es:"De acuerdo, nos vemos.",group:"responder a una despedida",group_index:4,level:"A1"},{i:31,start:285.67,end:295.604,es:"Gracias, lo mismo digo.",group:"responder a una despedida",group_index:4,level:"A2"},{i:32,start:295.604,end:304.232,es:"El gusto fue mío.",group:"responder a una despedida",group_index:4,level:"A2"},{i:33,start:304.232,end:315.938,es:"Gracias, yo les doy tus saludos.",group:"responder a una despedida",group_index:4,level:"A2"},{i:34,start:315.938,end:326.569,es:"Hasta luego, que estés bien.",group:"responder a una despedida",group_index:4,level:"A2"},{i:35,start:328.069,end:334.502,es:"¡Qué bien!",group:"reaccionar a la respuesta",group_index:5,level:"A1"},{i:36,start:334.502,end:342.786,es:"Ay, qué pena.",group:"reaccionar a la respuesta",group_index:5,level:"A1"},{i:37,start:342.786,end:354.93,es:"Te entiendo, yo también estoy cansado.",group:"reaccionar a la respuesta",group_index:5,level:"A1"},{i:38,start:354.93,end:362.611,es:"Me alegro mucho.",group:"reaccionar a la respuesta",group_index:5,level:"A2"},{i:39,start:362.611,end:372.667,es:"Me alegro de que te vaya bien.",group:"reaccionar a la respuesta",group_index:5,level:"B1"},{i:40,start:372.667,end:382.46,es:"Espero que todo siga bien.",group:"reaccionar a la respuesta",group_index:5,level:"B1"},{i:41,start:383.96,end:391.904,es:"¿Qué tal tu día?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:42,start:391.904,end:400.209,es:"¿Qué tal el trabajo?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:43,start:400.209,end:408.736,es:"¿Qué tal la familia?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:44,start:408.736,end:417.602,es:"¿Cómo va todo en casa?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:45,start:417.602,end:425.959,es:"¿Cómo va la semana?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:46,start:425.959,end:436.283,es:"¿Cómo te fue el fin de semana?",group:"preguntar cómo va todo",group_index:6,level:"A2"},{i:47,start:436.283,end:445.461,es:"¿Qué has hecho estos días?",group:"preguntar cómo va todo",group_index:6,level:"A2"},{i:48,start:445.461,end:453.493,es:"¿Cómo has estado?",group:"preguntar cómo va todo",group_index:6,level:"A2"},{i:49,start:454.993,end:462.628,es:"Bueno, te dejo.",group:"avisar que te vas",group_index:7,level:"A2"},{i:50,start:462.628,end:470.203,es:"Me tengo que ir.",group:"avisar que te vas",group_index:7,level:"A2"},{i:51,start:470.203,end:480.531,es:"Ya me voy, que es tarde.",group:"avisar que te vas",group_index:7,level:"A2"},{i:52,start:480.531,end:490.241,es:"Bueno, me voy yendo.",group:"avisar que te vas",group_index:7,level:"A2"},{i:53,start:490.241,end:498.409,es:"Bueno, me despido.",group:"avisar que te vas",group_index:7,level:"A2"},{i:54,start:498.409,end:511.586,es:"Te dejo, que seguro tienes cosas que hacer.",group:"avisar que te vas",group_index:7,level:"A2"},{i:55,start:511.586,end:522.12,es:"Bueno, no te quito más tiempo.",group:"avisar que te vas",group_index:7,level:"B1"},{i:56,start:523.62,end:531.07,es:"Cuídate mucho.",group:"buenos deseos",group_index:8,level:"A1"},{i:57,start:531.07,end:539.62,es:"Buen fin de semana.",group:"buenos deseos",group_index:8,level:"A1"},{i:58,start:539.62,end:547.49,es:"Que te vaya bien.",group:"buenos deseos",group_index:8,level:"A2"},{i:59,start:547.49,end:555.983,es:"Que tengas buen día.",group:"buenos deseos",group_index:8,level:"A2"},{i:60,start:555.983,end:565.254,es:"Saludos a tu familia.",group:"buenos deseos",group_index:8,level:"A2"},{i:61,start:565.254,end:573.875,es:"Fue un gusto verte.",group:"buenos deseos",group_index:8,level:"A2"},{i:62,start:573.875,end:584.203,es:"Que tengas una buena semana.",group:"buenos deseos",group_index:8,level:"A2"},{i:63,start:584.203,end:594.298,es:"Que disfrutes el resto del día.",group:"buenos deseos",group_index:8,level:"B1"}],Rr={word:Qr,slug:Dr,kind:Yr,hash:Vr,duration:Or,voice:Ir,marks:Fr},Ur="se",Gr="se",Kr="word",Xr="7049d5dc5daafa67",Jr=645,Wr="mx-lento",Zr=[{i:0,start:.5,end:11.466,es:"Mi hermano se ducha por la mañana.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:1,start:11.466,end:22.899,es:"Ella se levanta a las siete.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:2,start:22.899,end:33.044,es:"Mi abuela se acuesta temprano.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:3,start:33.044,end:41.99,es:"¿Cómo se llama tu perro?",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:4,start:41.99,end:51.632,es:"El niño se lava las manos.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:5,start:51.632,end:63.059,es:"Mi padre se afeita todos los días.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:6,start:63.059,end:74.156,es:"Se pone el abrigo y sale.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:7,start:74.156,end:83.765,es:"Los niños se visten solos.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:8,start:83.765,end:95.475,es:"Mi madre se peina antes de salir.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:9,start:96.975,end:106.92,es:"Mi jefe se va a las cinco.",group:"se va, se queda",group_index:1,level:"A1"},{i:10,start:106.92,end:115.617,es:"Hoy se queda en casa.",group:"se va, se queda",group_index:1,level:"A1"},{i:11,start:115.617,end:125.669,es:"Se sienta junto a la ventana.",group:"se va, se queda",group_index:1,level:"A1"},{i:12,start:125.669,end:136.323,es:"Mi hijo se enoja fácilmente.",group:"se va, se queda",group_index:1,level:"A1"},{i:13,start:136.323,end:147.855,es:"Se preocupa mucho por su familia.",group:"se va, se queda",group_index:1,level:"A1"},{i:14,start:147.855,end:158.448,es:"Mi amigo se casa en junio.",group:"se va, se queda",group_index:1,level:"A1"},{i:15,start:158.448,end:168.445,es:"Ana se fue sin decir nada.",group:"se va, se queda",group_index:1,level:"A2"},{i:16,start:168.445,end:178.645,es:"Se quedaron en un hotel pequeño.",group:"se va, se queda",group_index:1,level:"A2"},{i:17,start:178.645,end:188.577,es:"Se acordó de mi cumpleaños.",group:"se va, se queda",group_index:1,level:"A2"},{i:18,start:190.077,end:199.722,es:"Mis padres se quieren mucho.",group:"se quieren",group_index:2,level:"A1"},{i:19,start:199.722,end:210.027,es:"Se conocieron en la universidad.",group:"se quieren",group_index:2,level:"A2"},{i:20,start:210.027,end:219.172,es:"Los vecinos no se hablan.",group:"se quieren",group_index:2,level:"A2"},{i:21,start:219.172,end:230.986,es:"Se escriben todas las semanas.",group:"se quieren",group_index:2,level:"A2"},{i:22,start:230.986,end:240.884,es:"Se abrazaron en el aeropuerto.",group:"se quieren",group_index:2,level:"A2"},{i:23,start:240.884,end:253.103,es:"Ana y Luis se ven todos los días.",group:"se quieren",group_index:2,level:"A2"},{i:24,start:253.103,end:263.914,es:"Los dos hermanos se parecen mucho.",group:"se quieren",group_index:2,level:"A2"},{i:25,start:263.914,end:275.078,es:"Se ayudan con las tareas de la casa.",group:"se quieren",group_index:2,level:"A2"},{i:26,start:276.578,end:284.743,es:"Aquí se vive bien.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:27,start:284.743,end:296.127,es:"Se come muy bien en este restaurante.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:28,start:296.127,end:306.103,es:"¿Cómo se dice esto en español?",group:"se vive bien aquí",group_index:3,level:"A2"},{i:29,start:306.103,end:316.815,es:"En esta tienda se habla español.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:30,start:316.815,end:326.026,es:"No se puede fumar aquí.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:31,start:326.026,end:335.098,es:"¿Por dónde se va al centro?",group:"se vive bien aquí",group_index:3,level:"A2"},{i:32,start:335.098,end:346.377,es:"Se trabaja mucho en esta empresa.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:33,start:346.377,end:355.91,es:"Desde aquí se ve el mar.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:34,start:355.91,end:365.503,es:"¿Cómo se escribe tu nombre?",group:"se vive bien aquí",group_index:3,level:"A2"},{i:35,start:367.003,end:376.979,es:"En esta calle se venden casas.",group:"se venden casas",group_index:4,level:"A2"},{i:36,start:376.979,end:391.096,es:"Se alquila un apartamento cerca del parque.",group:"se venden casas",group_index:4,level:"A2"},{i:37,start:391.096,end:401.897,es:"Se necesita ayuda en la cocina.",group:"se venden casas",group_index:4,level:"A2"},{i:38,start:401.897,end:412.431,es:"Aquí se arreglan computadoras.",group:"se venden casas",group_index:4,level:"A2"},{i:39,start:412.431,end:422.281,es:"Aquí se aceptan tarjetas.",group:"se venden casas",group_index:4,level:"A2"},{i:40,start:422.281,end:432.821,es:"Se vendieron todas las entradas.",group:"se venden casas",group_index:4,level:"A2"},{i:41,start:432.821,end:443.237,es:"Este plato se prepara con arroz.",group:"se venden casas",group_index:4,level:"A2"},{i:42,start:443.237,end:455.41,es:"Se construyó un puente nuevo el año pasado.",group:"se venden casas",group_index:4,level:"A2"},{i:43,start:456.91,end:464.944,es:"Se lo doy mañana.",group:"se lo, se la",group_index:5,level:"A2"},{i:44,start:464.944,end:476.497,es:"¿El libro? Se lo presté a Marta.",group:"se lo, se la",group_index:5,level:"A2"},{i:45,start:476.497,end:484.296,es:"Se lo dije ayer.",group:"se lo, se la",group_index:5,level:"A2"},{i:46,start:484.296,end:495.978,es:"¿Le diste la carta? Sí, se la di.",group:"se lo, se la",group_index:5,level:"A2"},{i:47,start:495.978,end:512.311,es:"Mi hijo quería un perro y se lo compramos.",group:"se lo, se la",group_index:5,level:"A2"},{i:48,start:512.311,end:527.196,es:"Si tienes la foto, mándasela a tu madre.",group:"se lo, se la",group_index:5,level:"A2"},{i:49,start:527.196,end:539.571,es:"Se lo explico otra vez, señora.",group:"se lo, se la",group_index:5,level:"A2"},{i:50,start:539.571,end:549.967,es:"Se los regalé a mis sobrinos.",group:"se lo, se la",group_index:5,level:"A2"},{i:51,start:549.967,end:559.039,es:"No se lo digas a nadie.",group:"se lo, se la",group_index:5,level:"B1"},{i:52,start:560.539,end:569.236,es:"Se me olvidó tu nombre.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:53,start:569.236,end:577.754,es:"Se le cayó el vaso.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:54,start:577.754,end:586.529,es:"Se nos acabó la leche.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:55,start:586.529,end:595.879,es:"Se me rompió el teléfono.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:56,start:595.879,end:605.317,es:"Se te olvidaron las llaves.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:57,start:605.317,end:618.262,es:"Se le perdió la tarjeta en el autobús.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:58,start:618.262,end:626.616,es:"Se me quemó el arroz.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:59,start:626.616,end:634.802,es:"Se nos hizo tarde.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:60,start:634.802,end:644.939,es:"Al niño se le cayó un diente.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"}],es={word:Ur,slug:Gr,kind:Kr,hash:Xr,duration:Jr,voice:Wr,marks:Zr},as="seguir",os="seguir",rs="word",ss="ebe65bc9869c7a0f",ns=630.528,ls="mx-lento",is=[{i:0,start:.5,end:9.939,es:"Sígueme, por favor.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:1,start:9.939,end:20.78,es:"El perro me sigue a todas partes.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:2,start:20.78,end:32.085,es:"Sigue esta calle hasta el final.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:3,start:32.085,end:39.769,es:"¿Por qué me sigues?",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:4,start:39.769,end:49.785,es:"Seguimos al guía por el museo.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:5,start:49.785,end:60.075,es:"Los patitos siguen a su madre.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:6,start:60.075,end:71.547,es:"Siga a ese taxi, por favor.",group:"seguir, ir detrás",group_index:0,level:"A2"},{i:7,start:71.547,end:82.509,es:"Alguien nos sigue desde hace un rato.",group:"seguir, ir detrás",group_index:0,level:"A2"},{i:8,start:84.009,end:90.545,es:"¿Seguimos?",group:"seguir, continuar",group_index:1,level:"A1"},{i:9,start:90.545,end:102.126,es:"Sigue, por favor, te escucho.",group:"seguir, continuar",group_index:1,level:"A1"},{i:10,start:102.126,end:114.053,es:"La película sigue después de los anuncios.",group:"seguir, continuar",group_index:1,level:"A1"},{i:11,start:114.053,end:125.384,es:"Si quieres, seguimos mañana.",group:"seguir, continuar",group_index:1,level:"A1"},{i:12,start:125.384,end:135.135,es:"El camino sigue por el bosque.",group:"seguir, continuar",group_index:1,level:"A1"},{i:13,start:135.135,end:147.029,es:"La reunión sigue hasta las cinco.",group:"seguir, continuar",group_index:1,level:"A1"},{i:14,start:147.029,end:157.039,es:"Seguimos con la lección de ayer.",group:"seguir, continuar",group_index:1,level:"A1"},{i:15,start:158.539,end:166.026,es:"Sigue lloviendo.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:16,start:166.026,end:177.004,es:"Sigo trabajando en el mismo lugar.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:17,start:177.004,end:186.605,es:"¿Sigues viviendo en el centro?",group:"sigue lloviendo",group_index:2,level:"A2"},{i:18,start:186.605,end:200.25,es:"Mi abuelo sigue manejando a los noventa años.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:19,start:200.25,end:210.245,es:"Seguimos esperando el autobús.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:20,start:210.245,end:219.749,es:"Los niños siguen durmiendo.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:21,start:219.749,end:233.504,es:"Ella siguió hablando toda la noche.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:22,start:233.504,end:246.75,es:"Sigue intentándolo, ya casi lo tienes.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:23,start:246.75,end:260.119,es:"A pesar del frío, seguimos caminando.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:24,start:261.619,end:271.219,es:"Mi hermana sigue enferma.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:25,start:271.219,end:278.297,es:"¿Sigues aquí?",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:26,start:278.297,end:287.356,es:"La tienda sigue cerrada.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:27,start:287.356,end:296.691,es:"El café sigue caliente.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:28,start:296.691,end:305.825,es:"Seguimos en el aeropuerto.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:29,start:305.825,end:319.935,es:"Mis padres siguen casados después de cuarenta años.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:30,start:319.935,end:328.735,es:"Sigo muy cansado.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:31,start:328.735,end:337.441,es:"¿Sigue abierto el banco?",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:32,start:337.441,end:347.81,es:"El problema sigue igual.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:33,start:349.31,end:358.458,es:"Sigue las instrucciones.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:34,start:358.458,end:369.126,es:"Seguí tu consejo y funcionó.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:35,start:369.126,end:378.583,es:"Hay que seguir las reglas.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:36,start:378.583,end:388.485,es:"No seguiste la receta, ¿verdad?",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:37,start:388.485,end:400.712,es:"Siempre sigo los consejos de mi madre.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:38,start:400.712,end:413.537,es:"Sigue el mapa y no te vas a perder.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:39,start:413.537,end:426.344,es:"Seguimos las señales hasta la salida.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:40,start:426.344,end:440.839,es:"El médico me dijo que siguiera una dieta.",group:"seguir instrucciones y consejos",group_index:4,level:"B1"},{i:41,start:442.339,end:450.569,es:"Sigo sin entender.",group:"seguir sin",group_index:5,level:"B1"},{i:42,start:450.569,end:460.186,es:"Seguimos sin noticias de él.",group:"seguir sin",group_index:5,level:"B1"},{i:43,start:460.186,end:471.458,es:"El vecino sigue sin pagar el alquiler.",group:"seguir sin",group_index:5,level:"B1"},{i:44,start:471.458,end:482.217,es:"Sigo sin encontrar mis llaves.",group:"seguir sin",group_index:5,level:"B1"},{i:45,start:482.217,end:499.175,es:"Llevo una hora en la cama y sigo sin poder dormir.",group:"seguir sin",group_index:5,level:"B1"},{i:46,start:499.175,end:510.215,es:"La computadora sigue sin funcionar.",group:"seguir sin",group_index:5,level:"B1"},{i:47,start:510.215,end:521.044,es:"Siguen sin contestar el teléfono.",group:"seguir sin",group_index:5,level:"B1"},{i:48,start:521.044,end:531.754,es:"Mi hijo sigue sin saber nadar.",group:"seguir sin",group_index:5,level:"B1"},{i:49,start:533.254,end:542.13,es:"Espero que sigas bien.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:50,start:542.13,end:552.992,es:"Ojalá siga haciendo buen tiempo.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:51,start:552.992,end:564.949,es:"Si sigues así, vas a llegar lejos.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:52,start:564.949,end:574.748,es:"¡Que siga la fiesta!",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:53,start:574.748,end:586.016,es:"No creo que siga lloviendo mañana.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:54,start:586.016,end:598.772,es:"Seguiría estudiando si tuviera más tiempo.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:55,start:598.772,end:611.752,es:"Sigue así, lo estás haciendo muy bien.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:56,start:611.752,end:620.415,es:"¿Cómo sigue tu madre?",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:57,start:620.415,end:630.474,es:"Me pidió que siguiera adelante.",group:"sigue así, que sigas bien",group_index:6,level:"B1"}],ts={word:as,slug:os,kind:rs,hash:ss,duration:ns,voice:ls,marks:is},us="soler",ds="soler",ps="word",gs="db65a6a2e47b842c",cs=714.336,vs="mx-lento",ms=[{i:0,start:.5,end:10.63,es:"Suelo desayunar a las siete.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:1,start:10.63,end:21.907,es:"Mi padre suele leer el periódico.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:2,start:21.907,end:31.508,es:"Solemos comer en casa.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:3,start:31.508,end:42.614,es:"Ella suele llegar temprano.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:4,start:42.614,end:52.481,es:"Suelo caminar al trabajo.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:5,start:52.481,end:63.512,es:"Los niños suelen dormir la siesta.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:6,start:63.512,end:74.318,es:"Mis abuelos suelen cenar temprano.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:7,start:74.318,end:84.799,es:"Suelo beber agua con la comida.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:8,start:84.799,end:95.995,es:"Los sábados solemos ir al mercado.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:9,start:97.495,end:107.288,es:"¿Sueles cocinar en casa?",group:"preguntas",group_index:1,level:"A1"},{i:10,start:107.288,end:117.714,es:"¿A qué hora sueles levantarte?",group:"preguntas",group_index:1,level:"A1"},{i:11,start:117.714,end:127.31,es:"¿Dónde suelen comer ustedes?",group:"preguntas",group_index:1,level:"A1"},{i:12,start:127.31,end:137.522,es:"¿Qué sueles hacer los domingos?",group:"preguntas",group_index:1,level:"A1"},{i:13,start:137.522,end:147.018,es:"¿Sueles viajar en verano?",group:"preguntas",group_index:1,level:"A1"},{i:14,start:147.018,end:156.575,es:"¿Cómo sueles ir al trabajo?",group:"preguntas",group_index:1,level:"A1"},{i:15,start:156.575,end:169.354,es:"¿Tu hermana suele llamar los fines de semana?",group:"preguntas",group_index:1,level:"A1"},{i:16,start:169.354,end:179.67,es:"¿Qué suele cenar tu familia?",group:"preguntas",group_index:1,level:"A1"},{i:17,start:181.17,end:190.801,es:"No suelo ver la televisión.",group:"no suelo",group_index:2,level:"A2"},{i:18,start:190.801,end:202.186,es:"Mi madre no suele cocinar los lunes.",group:"no suelo",group_index:2,level:"A2"},{i:19,start:202.186,end:211.754,es:"No solemos salir de noche.",group:"no suelo",group_index:2,level:"A2"},{i:20,start:211.754,end:221.455,es:"Él no suele llegar tarde.",group:"no suelo",group_index:2,level:"A2"},{i:21,start:221.455,end:231.283,es:"No suelo comer carne roja.",group:"no suelo",group_index:2,level:"A2"},{i:22,start:231.283,end:243.474,es:"Los domingos no suelen abrir las tiendas.",group:"no suelo",group_index:2,level:"A2"},{i:23,start:243.474,end:254.475,es:"No suelo dormir bien en los aviones.",group:"no suelo",group_index:2,level:"A2"},{i:24,start:254.475,end:269.571,es:"Mis amigos no suelen contestar los mensajes rápido.",group:"no suelo",group_index:2,level:"A2"},{i:25,start:271.071,end:282.32,es:"En agosto suele hacer mucho calor.",group:"lo normal",group_index:3,level:"A2"},{i:26,start:282.32,end:293.85,es:"En esta ciudad suele llover en abril.",group:"lo normal",group_index:3,level:"A2"},{i:27,start:293.85,end:303.94,es:"El tren suele llegar puntual.",group:"lo normal",group_index:3,level:"A2"},{i:28,start:303.94,end:315.324,es:"Los lunes suele haber mucho tráfico.",group:"lo normal",group_index:3,level:"A2"},{i:29,start:315.324,end:326.319,es:"Este restaurante suele estar lleno.",group:"lo normal",group_index:3,level:"A2"},{i:30,start:326.319,end:337.506,es:"La primera clase suele ser fácil.",group:"lo normal",group_index:3,level:"A2"},{i:31,start:337.506,end:349.378,es:"En invierno suele nevar en las montañas.",group:"lo normal",group_index:3,level:"A2"},{i:32,start:349.378,end:362.031,es:"Las entradas del museo suelen costar poco.",group:"lo normal",group_index:3,level:"A2"},{i:33,start:363.531,end:376.94,es:"De niño, solía jugar en la calle.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:34,start:376.94,end:390.358,es:"Mi abuela solía hacer pan los domingos.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:35,start:390.358,end:402.99,es:"Solíamos ir a la playa en verano.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:36,start:402.99,end:414.293,es:"¿Qué solías hacer después de clase?",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:37,start:414.293,end:424.855,es:"Mi padre solía fumar mucho.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:38,start:424.855,end:438.445,es:"En la universidad, solía estudiar de noche.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:39,start:438.445,end:450.153,es:"Mis primos solían visitarnos en Navidad.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:40,start:450.153,end:462.015,es:"Solía tomar el autobús a las siete.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:41,start:462.015,end:474.967,es:"Ella solía escribir cartas a mano.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:42,start:476.467,end:490.393,es:"Antes solía correr, pero ahora prefiero nadar.",group:"antes y ahora",group_index:5,level:"A2"},{i:43,start:490.393,end:504.735,es:"Solía tomar tres cafés al día, pero ya no.",group:"antes y ahora",group_index:5,level:"A2"},{i:44,start:504.735,end:522.321,es:"Antes solíamos cenar juntos, pero ahora cada uno come a su hora.",group:"antes y ahora",group_index:5,level:"B1"},{i:45,start:522.321,end:538.265,es:"Antes no solía leer, y ahora leo todas las noches.",group:"antes y ahora",group_index:5,level:"B1"},{i:46,start:538.265,end:557.801,es:"Mi hermano solía ser muy tímido, pero ha cambiado mucho.",group:"antes y ahora",group_index:5,level:"B1"},{i:47,start:557.801,end:575.883,es:"Antes solíamos escribirnos cartas, y hoy todo es por mensaje.",group:"antes y ahora",group_index:5,level:"B1"},{i:48,start:575.883,end:593.804,es:"Este barrio solía ser tranquilo, pero ahora hay mucho ruido.",group:"antes y ahora",group_index:5,level:"B1"},{i:49,start:593.804,end:606.407,es:"Ya no suelo acostarme tarde como antes.",group:"antes y ahora",group_index:5,level:"B1"},{i:50,start:607.907,end:621.106,es:"Eso no suele pasar en un lugar tan tranquilo.",group:"no suele pasar",group_index:6,level:"B1"},{i:51,start:621.106,end:634.25,es:"Como suele pasar, el vuelo salió tarde.",group:"no suele pasar",group_index:6,level:"B1"},{i:52,start:634.25,end:649.115,es:"Como solía decir mi abuelo, el tiempo es oro.",group:"no suele pasar",group_index:6,level:"B1"},{i:53,start:649.115,end:660.415,es:"Esto no suele ocurrir en esta empresa.",group:"no suele pasar",group_index:6,level:"B1"},{i:54,start:660.415,end:675.633,es:"Lo que suele pasar es que nadie lee las instrucciones.",group:"no suele pasar",group_index:6,level:"B1"},{i:55,start:675.633,end:687.33,es:"Los problemas suelen resolverse hablando.",group:"no suele pasar",group_index:6,level:"B1"},{i:56,start:687.33,end:699.575,es:"Es raro, porque él no suele equivocarse.",group:"no suele pasar",group_index:6,level:"B1"},{i:57,start:699.575,end:714.267,es:"Como se suele decir, más vale tarde que nunca.",group:"no suele pasar",group_index:6,level:"B1"}],xs={word:us,slug:ds,kind:ps,hash:gs,duration:cs,voice:vs,marks:ms},_s="tener",As="tener",hs="word",bs="4b13ad4e3507d4d1",fs=681.984,qs="mx-lento",ys=[{i:0,start:.5,end:8.77,es:"Tengo dos hermanos.",group:"tener, poseer",group_index:0,level:"A1"},{i:1,start:8.77,end:17.311,es:"¿Tienes un bolígrafo?",group:"tener, poseer",group_index:0,level:"A1"},{i:2,start:17.311,end:29.302,es:"Mi abuela tiene un gato negro.",group:"tener, poseer",group_index:0,level:"A1"},{i:3,start:29.302,end:37.376,es:"No tenemos auto.",gr
