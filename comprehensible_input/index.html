.516,es:"Mira lo grande que está tu hijo.",group:"lo rápido que",group_index:6,level:"B1"},{i:57,start:451.516,end:460.465,es:"No te imaginas lo cansada que estoy.",group:"lo rápido que",group_index:6,level:"B1"},{i:58,start:460.465,end:470.311,es:"Ya ves lo difícil que es encontrar trabajo.",group:"lo rápido que",group_index:6,level:"B1"},{i:59,start:470.311,end:478.919,es:"Es increíble lo caro que está todo.",group:"lo rápido que",group_index:6,level:"B1"},{i:60,start:478.919,end:488.401,es:"Me encanta lo tranquilo que es este barrio.",group:"lo rápido que",group_index:6,level:"B1"},{i:61,start:488.401,end:498.247,es:"Todavía recuerdo lo feliz que estaba ese día.",group:"lo rápido que",group_index:6,level:"B1"}],Wo={word:Oo,slug:Io,kind:Fo,hash:Ro,duration:Uo,voice:Go,marks:Ko},Jo="mismo",Xo="mismo",Zo="word",er="0e6e6e790d37856f",ar=471.504,or="alex",rr=[{i:0,start:.5,end:7.999,es:"Tenemos el mismo libro.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:1,start:7.999,end:15.86,es:"Vivimos en la misma calle.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:2,start:15.86,end:24.575,es:"Siempre como en el mismo restaurante.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:3,start:24.575,end:33.844,es:"Mi hermano y yo tenemos los mismos ojos.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:4,start:33.844,end:42.793,es:"Ellas trabajan en la misma oficina.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:5,start:42.793,end:50.911,es:"Es la misma canción de ayer.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:6,start:50.911,end:59.071,es:"Llevas la misma camisa que yo.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:7,start:59.071,end:66.591,es:"Nacimos el mismo año.",group:"el mismo, la misma",group_index:0,level:"A1"},{i:8,start:68.091,end:74.736,es:"Para mí, lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:9,start:74.736,end:82.107,es:"Siempre dices lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:10,start:82.107,end:90.139,es:"Yo quiero lo mismo, por favor.",group:"lo mismo",group_index:1,level:"A1"},{i:11,start:90.139,end:98.405,es:"Todos los días hago lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:12,start:98.405,end:104.88,es:"No es lo mismo.",group:"lo mismo",group_index:1,level:"A1"},{i:13,start:104.88,end:112.101,es:"Pienso lo mismo que tú.",group:"lo mismo",group_index:1,level:"A1"},{i:14,start:112.101,end:121.008,es:"Me pasó lo mismo la semana pasada.",group:"lo mismo",group_index:1,level:"A2"},{i:15,start:122.508,end:129.217,es:"Ven ahora mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A1"},{i:16,start:129.217,end:136.951,es:"Ahora mismo estoy ocupado.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A1"},{i:17,start:136.951,end:144.065,es:"Te espero aquí mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:18,start:144.065,end:151.287,es:"Lo envío hoy mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:19,start:151.287,end:160.684,es:"El hotel está ahí mismo, al lado del parque.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:20,start:160.684,end:168.695,es:"Voy a llamarla ahora mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:21,start:168.695,end:177.559,es:"Puedes dejar las bolsas aquí mismo.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:22,start:177.559,end:185.057,es:"Ayer mismo hablé con él.",group:"ahora mismo, aquí mismo, hoy mismo",group_index:2,level:"A2"},{i:23,start:186.557,end:193.395,es:"Yo mismo lo hice.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:24,start:193.395,end:200.765,es:"Ella misma me lo dijo.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:25,start:200.765,end:208.413,es:"Lo puedo hacer yo misma.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:26,start:208.413,end:217.149,es:"Nosotros mismos pintamos la casa.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:27,start:217.149,end:226.099,es:"El director mismo vino a saludarnos.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:28,start:226.099,end:232.808,es:"Hazlo tú mismo.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:29,start:232.808,end:241.971,es:"Ellos mismos prepararon toda la comida.",group:"yo mismo, ella misma",group_index:3,level:"A2"},{i:30,start:243.471,end:251.14,es:"Llegamos al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:31,start:251.14,end:259.513,es:"No hablen todos al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:32,start:259.513,end:269.935,es:"Puedo cocinar y escuchar música al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:33,start:269.935,end:279.545,es:"Sonaron los dos teléfonos al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:34,start:279.545,end:289.903,es:"Es difícil estudiar y trabajar al mismo tiempo.",group:"al mismo tiempo",group_index:4,level:"A2"},{i:35,start:289.903,end:299.172,es:"Quiero ir, pero al mismo tiempo tengo miedo.",group:"al mismo tiempo",group_index:4,level:"B1"},{i:36,start:300.672,end:309.088,es:"Gano lo mismo que el año pasado.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:37,start:309.088,end:318.208,es:"Este vestido cuesta lo mismo que el otro.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:38,start:318.208,end:327.285,es:"Ella tiene la misma edad que mi hermana.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:39,start:327.285,end:336.469,es:"Mi casa es del mismo color que la tuya.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:40,start:336.469,end:344.672,es:"Hoy hace el mismo calor que ayer.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:41,start:344.672,end:354.688,es:"Estudiamos en la misma escuela que nuestros padres.",group:"lo mismo que, el mismo que",group_index:5,level:"B1"},{i:42,start:356.188,end:362.705,es:"Me da lo mismo.",group:"da lo mismo",group_index:6,level:"A2"},{i:43,start:362.705,end:370.204,es:"¿Té o café? Me da lo mismo.",group:"da lo mismo",group_index:6,level:"A2"},{i:44,start:370.204,end:378.087,es:"Da lo mismo si llegas tarde.",group:"da lo mismo",group_index:6,level:"B1"},{i:45,start:378.087,end:387.377,es:"Le da lo mismo lo que piensen los demás.",group:"da lo mismo",group_index:6,level:"B1"},{i:46,start:387.377,end:396.135,es:"A mí me da lo mismo dónde comamos.",group:"da lo mismo",group_index:6,level:"B1"},{i:47,start:396.135,end:404.017,es:"Da lo mismo, ya no importa.",group:"da lo mismo",group_index:6,level:"B1"},{i:48,start:404.017,end:412.476,es:"Nos da lo mismo ir hoy o mañana.",group:"da lo mismo",group_index:6,level:"B1"},{i:49,start:413.976,end:421.539,es:"Solo piensa en sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:50,start:421.539,end:429.699,es:"Ella habla mucho de sí misma.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:51,start:429.699,end:437.688,es:"Ella cree mucho en sí misma.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:52,start:437.688,end:446.488,es:"El problema en sí mismo no es grave.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:53,start:446.488,end:453.923,es:"Él se ríe de sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:54,start:453.923,end:462.424,es:"Él no sabe cuidarse a sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"},{i:55,start:462.424,end:471.437,es:"Mi abuelo está muy seguro de sí mismo.",group:"sí mismo, en sí mismo",group_index:7,level:"B1"}],sr={word:Jo,slug:Xo,kind:Zo,hash:er,duration:ar,voice:or,marks:rr},nr="pasar",lr="pasar",ir="word",tr="00ebe96d635bc17a",ur=486.216,dr="alex",pr=[{i:0,start:.5,end:8.895,es:"Pasa, pasa, estás en tu casa.",group:"pasar, entrar",group_index:0,level:"A1"},{i:1,start:8.895,end:15.007,es:"¿Puedo pasar?",group:"pasar, entrar",group_index:0,level:"A1"},{i:2,start:15.007,end:21.695,es:"Pasen, por favor.",group:"pasar, entrar",group_index:0,level:"A1"},{i:3,start:21.695,end:29.279,es:"Pase, la doctora lo espera.",group:"pasar, entrar",group_index:0,level:"A1"},{i:4,start:29.279,end:37.055,es:"No se puede pasar por aquí.",group:"pasar, entrar",group_index:0,level:"A1"},{i:5,start:37.055,end:44.639,es:"Déjame pasar, por favor.",group:"pasar, entrar",group_index:0,level:"A1"},{i:6,start:46.139,end:51.973,es:"¿Qué pasa?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:7,start:51.973,end:57.765,es:"¿Qué pasó?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:8,start:57.765,end:64.197,es:"No pasa nada.",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:9,start:64.197,end:70.331,es:"¿Qué te pasa?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:10,start:70.331,end:78.597,es:"Algo le pasa a mi computadora.",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:11,start:78.597,end:85.52,es:"¿Qué le pasa al bebé?",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:12,start:85.52,end:93.723,es:"Esto siempre me pasa los lunes.",group:"pasar, ocurrir",group_index:1,level:"A1"},{i:13,start:93.723,end:102.821,es:"Ayer pasó algo muy raro en la oficina.",group:"pasar, ocurrir",group_index:1,level:"A2"},{i:14,start:102.821,end:110.384,es:"¿Qué te ha pasado en la mano?",group:"pasar, ocurrir",group_index:1,level:"A2"},{i:15,start:111.884,end:120.769,es:"El autobús pasa cada diez minutos.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:16,start:120.769,end:128.609,es:"Paso por tu casa a las seis.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:17,start:128.609,end:136.599,es:"Este tren pasa por mi pueblo.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:18,start:136.599,end:145.676,es:"Pasamos por el parque de camino a casa.",group:"pasar por un lugar",group_index:2,level:"A1"},{i:19,start:145.676,end:153.559,es:"Ayer pasé por la panadería.",group:"pasar por un lugar",group_index:2,level:"A2"},{i:20,start:153.559,end:164.215,es:"¿Puedes pasar por el supermercado después del trabajo?",group:"pasar por un lugar",group_index:2,level:"A2"},{i:21,start:164.215,end:172.801,es:"Un perro pasó corriendo por la calle.",group:"pasar por un lugar",group_index:2,level:"A2"},{i:22,start:174.301,end:182.845,es:"Paso mucho tiempo con mi familia.",group:"pasar el tiempo",group_index:3,level:"A1"},{i:23,start:182.845,end:191.219,es:"Pasamos el verano en la playa.",group:"pasar el tiempo",group_index:3,level:"A1"},{i:24,start:191.219,end:198.632,es:"Pasé la tarde leyendo.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:25,start:198.632,end:206.387,es:"¿Dónde pasaste la Navidad?",group:"pasar el tiempo",group_index:3,level:"A2"},{i:26,start:206.387,end:215.827,es:"Ella pasa horas delante de la computadora.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:27,start:215.827,end:225.224,es:"Hemos pasado una semana increíble en Perú.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:28,start:225.224,end:234.749,es:"Voy a pasar el fin de semana con mis abuelos.",group:"pasar el tiempo",group_index:3,level:"A2"},{i:29,start:236.249,end:242.895,es:"¡Que lo pases bien!",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:30,start:242.895,end:251.332,es:"Lo pasamos muy bien en la fiesta.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:31,start:251.332,end:260.751,es:"Los niños lo pasaron genial en el parque.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:32,start:260.751,end:269.764,es:"Lo pasé muy mal en el viaje en barco.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:33,start:269.764,end:278.095,es:"¿Lo pasaste bien en el concierto?",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:34,start:278.095,end:287.556,es:"Mi abuela lo pasó mal cuando estuvo enferma.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:35,start:287.556,end:295.78,es:"Siempre lo pasamos bien juntos.",group:"pasarlo bien o mal",group_index:4,level:"A2"},{i:36,start:297.28,end:305.355,es:"El tiempo pasa muy rápido.",group:"el tiempo pasa",group_index:5,level:"A1"},{i:37,start:305.355,end:312.981,es:"Ya pasaron tres años.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:38,start:312.981,end:321.803,es:"Pasaron muchos días sin noticias.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:39,start:321.803,end:330.944,es:"Han pasado diez minutos y no ha llegado.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:40,start:330.944,end:338.997,es:"Con los años, el dolor pasa.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:41,start:338.997,end:346.155,es:"Ya pasó la tormenta.",group:"el tiempo pasa",group_index:5,level:"A2"},{i:42,start:346.155,end:356.32,es:"Cuando pase el invierno, vamos a pintar la casa.",group:"el tiempo pasa",group_index:5,level:"B1"},{i:43,start:357.82,end:364.636,es:"¿Me pasas la sal?",group:"pasar algo a alguien",group_index:6,level:"A1"},{i:44,start:364.636,end:372.391,es:"Pásame el agua, por favor.",group:"pasar algo a alguien",group_index:6,level:"A1"},{i:45,start:372.391,end:380.593,es:"Te paso el número de mi hermano.",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:46,start:380.593,end:388.689,es:"Le pasé el balón a mi amigo.",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:47,start:388.689,end:396.977,es:"¿Me pasaste las fotos del viaje?",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:48,start:396.977,end:405.756,es:"Ya le he pasado el mensaje a mi jefe.",group:"pasar algo a alguien",group_index:6,level:"A2"},{i:49,start:407.256,end:416.845,es:"Pasé el examen de matemáticas a la primera.",group:"expresiones con pasar",group_index:7,level:"A2"},{i:50,start:416.845,end:425.347,es:"Me pasé de parada en el autobús.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:51,start:425.347,end:433.763,es:"Ya se me pasó el dolor de cabeza.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:52,start:433.763,end:441.197,es:"No te pases con la sal.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:53,start:441.197,end:450.125,es:"Se me pasó llamarte, lo siento mucho.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:54,start:450.125,end:460.397,es:"Pasamos por momentos difíciles el año pasado.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:55,start:460.397,end:468.835,es:"Ojalá que no le pase nada malo.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:56,start:468.835,end:477.656,es:"Pase lo que pase, yo estoy contigo.",group:"expresiones con pasar",group_index:7,level:"B1"},{i:57,start:477.656,end:486.157,es:"Esa canción ya pasó de moda.",group:"expresiones con pasar",group_index:7,level:"B1"}],gr={word:nr,slug:lr,kind:ir,hash:tr,duration:ur,voice:dr,marks:pr},cr="poner(se)",vr="poner_se",mr="word",_r="d51d924351efe44c",xr=541.8,Ar="alex",hr=[{i:0,start:.5,end:8.148,es:"Pon las llaves en la mesa.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:1,start:8.148,end:15.604,es:"¿Dónde pongo mi abrigo?",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:2,start:15.604,end:24.319,es:"Pongo la leche en el refrigerador.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:3,start:24.319,end:32.479,es:"Ella pone las flores en el agua.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:4,start:32.479,end:40.553,es:"No pongas los pies en el sofá.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:5,start:40.553,end:48.991,es:"Pon los zapatos debajo de la cama.",group:"poner algo en un lugar",group_index:0,level:"A1"},{i:6,start:48.991,end:56.788,es:"¿Pusiste azúcar en mi café?",group:"poner algo en un lugar",group_index:0,level:"A2"},{i:7,start:56.788,end:64.543,es:"Puse tu libro en la mochila.",group:"poner algo en un lugar",group_index:0,level:"A2"},{i:8,start:66.043,end:72.155,es:"¿Pongo la tele?",group:"poner la tele, la música",group_index:1,level:"A1"},{i:9,start:72.155,end:79.483,es:"Pon música, por favor.",group:"poner la tele, la música",group_index:1,level:"A1"},{i:10,start:79.483,end:88.347,es:"Mi padre pone la radio por la mañana.",group:"poner la tele, la música",group_index:1,level:"A1"},{i:11,start:88.347,end:96.123,es:"¿Puedes poner la calefacción?",group:"poner la tele, la música",group_index:1,level:"A1"},{i:12,start:96.123,end:104.027,es:"Pon el ventilador, por favor.",group:"poner la tele, la música",group_index:1,level:"A1"},{i:13,start:104.027,end:112.059,es:"Puse el despertador a las seis.",group:"poner la tele, la música",group_index:1,level:"A2"},{i:14,start:112.059,end:120.411,es:"Pon una película, estoy aburrido.",group:"poner la tele, la música",group_index:1,level:"A2"},{i:15,start:120.411,end:130.96,es:"Voy a poner el aire acondicionado, hace mucho calor.",group:"poner la tele, la música",group_index:1,level:"A2"},{i:16,start:132.46,end:140.385,es:"Pon la mesa, vamos a comer.",group:"poner la mesa",group_index:2,level:"A1"},{i:17,start:140.385,end:148.801,es:"Yo pongo la mesa y tú cocinas.",group:"poner la mesa",group_index:2,level:"A1"},{i:18,start:148.801,end:156.321,es:"¿Quién pone la mesa hoy?",group:"poner la mesa",group_index:2,level:"A1"},{i:19,start:156.321,end:165.868,es:"Los niños ponen la mesa todas las noches.",group:"poner la mesa",group_index:2,level:"A1"},{i:20,start:165.868,end:174.604,es:"Ayúdame a poner la mesa, por favor.",group:"poner la mesa",group_index:2,level:"A1"},{i:21,start:174.604,end:182.636,es:"Ya puse la mesa para la cena.",group:"poner la mesa",group_index:2,level:"A2"},{i:22,start:184.136,end:191.805,es:"Ponte el abrigo, hace frío.",group:"ponerse ropa",group_index:3,level:"A1"},{i:23,start:191.805,end:198.941,es:"Me pongo los zapatos.",group:"ponerse ropa",group_index:3,level:"A1"},{i:24,start:198.941,end:207.784,es:"Ella siempre se pone un vestido rojo.",group:"ponerse ropa",group_index:3,level:"A1"},{i:25,start:207.784,end:216.008,es:"Ponte el cinturón de seguridad.",group:"ponerse ropa",group_index:3,level:"A1"},{i:26,start:216.008,end:224.723,es:"No me pongo esos pantalones nunca.",group:"ponerse ropa",group_index:3,level:"A1"},{i:27,start:224.723,end:233.096,es:"¿Qué te vas a poner para la fiesta?",group:"ponerse ropa",group_index:3,level:"A2"},{i:28,start:233.096,end:241.619,es:"Hoy me puse la camisa de mi hermano.",group:"ponerse ropa",group_index:3,level:"A2"},{i:29,start:241.619,end:250.44,es:"Los niños ya se pusieron el pijama.",group:"ponerse ropa",group_index:3,level:"A2"},{i:30,start:251.94,end:259.759,es:"Le pusieron Ana a la niña.",group:"poner nombre",group_index:4,level:"A2"},{i:31,start:259.759,end:268.217,es:"¿Qué nombre le vas a poner al perro?",group:"poner nombre",group_index:4,level:"A2"},{i:32,start:268.217,end:276.655,es:"Le pusimos Luna a nuestra gata.",group:"poner nombre",group_index:4,level:"A2"},{i:33,start:276.655,end:286.329,es:"Mis padres me pusieron el nombre de mi abuelo.",group:"poner nombre",group_index:4,level:"A2"},{i:34,start:286.329,end:295.513,es:"Todavía no le han puesto nombre al bebé.",group:"poner nombre",group_index:4,level:"A2"},{i:35,start:295.513,end:305.316,es:"¿Por qué le pusieron ese nombre al restaurante?",group:"poner nombre",group_index:4,level:"A2"},{i:36,start:305.316,end:315.652,es:"En el colegio le pusieron un apodo muy gracioso.",group:"poner nombre",group_index:4,level:"B1"},{i:37,start:317.152,end:326.229,es:"Me pongo nervioso antes de un examen.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:38,start:326.229,end:335.989,es:"Mi madre se puso muy contenta con la noticia.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:39,start:335.989,end:344.619,es:"El cielo se puso gris de repente.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:40,start:344.619,end:352.373,es:"Cuando la vio, se puso rojo.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:41,start:352.373,end:359.403,es:"No te pongas triste.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:42,start:359.403,end:369.333,es:"Mi abuela se puso enferma el invierno pasado.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:43,start:369.333,end:378.432,es:"Se pone de mal humor cuando tiene hambre.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:44,start:378.432,end:386.869,es:"Me puse muy feliz cuando llamaste.",group:"ponerse + adjetivo",group_index:5,level:"A2"},{i:45,start:388.369,end:397.233,es:"De repente, el bebé se puso a llorar.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:46,start:397.233,end:406.268,es:"Cuando llegué a casa, me puse a cocinar.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:47,start:406.268,end:415.345,es:"Se puso a llover justo cuando salimos.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:48,start:415.345,end:424.359,es:"Ponte a estudiar, mañana tienes examen.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:49,start:424.359,end:434.524,es:"Después de cenar, nos pusimos a jugar a las cartas.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:50,start:434.524,end:444.007,es:"Si me pongo a ver la tele, no termino nunca.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:51,start:444.007,end:455.153,es:"Mi hermano se pone a cantar en la ducha todas las mañanas.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:52,start:455.153,end:465.041,es:"Quiero que te pongas a trabajar ahora mismo.",group:"ponerse a + infinitivo",group_index:6,level:"B1"},{i:53,start:466.541,end:474.211,es:"Nunca nos ponemos de acuerdo.",group:"ponerse de acuerdo",group_index:7,level:"A2"},{i:54,start:474.211,end:483.971,es:"Al final nos pusimos de acuerdo sobre el viaje.",group:"ponerse de acuerdo",group_index:7,level:"A2"},{i:55,start:483.971,end:494.2,es:"Tenemos que ponernos de acuerdo antes del viernes.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:56,start:494.2,end:503.448,es:"Es difícil que todos se pongan de acuerdo.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:57,start:503.448,end:512.461,es:"¿Ya se pusieron de acuerdo sobre el precio?",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:58,start:512.461,end:523.565,es:"Mis padres no se ponen de acuerdo sobre el nombre del perro.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:59,start:523.565,end:532.429,es:"Ojalá nos pongamos de acuerdo pronto.",group:"ponerse de acuerdo",group_index:7,level:"B1"},{i:60,start:532.429,end:541.741,es:"Si no se ponen de acuerdo, no habrá fiesta.",group:"ponerse de acuerdo",group_index:7,level:"B1"}],br={word:cr,slug:vr,kind:mr,hash:_r,duration:xr,voice:Ar,marks:hr},qr="por / para",fr="por_para",yr="word",jr="17db9a1c56194c2c",Br=512.568,zr="alex",Mr=[{i:0,start:.5,end:7.465,es:"Estudio para aprender.",group:"para: finalidad",group_index:0,level:"A1"},{i:1,start:7.465,end:14.431,es:"Trabajo para vivir.",group:"para: finalidad",group_index:0,level:"A1"},{i:2,start:14.431,end:23.017,es:"Voy al mercado para comprar fruta.",group:"para: finalidad",group_index:0,level:"A1"},{i:3,start:23.017,end:31.135,es:"Necesito dinero para el viaje.",group:"para: finalidad",group_index:0,level:"A1"},{i:4,start:31.135,end:39.231,es:"Esta caja es para los libros.",group:"para: finalidad",group_index:0,level:"A1"},{i:5,start:39.231,end:46.217,es:"¿Para qué sirve esto?",group:"para: finalidad",group_index:0,level:"A1"},{i:6,start:46.217,end:54.441,es:"Me levanto temprano para correr.",group:"para: finalidad",group_index:0,level:"A1"},{i:7,start:54.441,end:62.217,es:"Ahorro para comprar una casa.",group:"para: finalidad",group_index:0,level:"A2"},{i:8,start:63.717,end:71.109,es:"Este regalo es para ti.",group:"para: destinatario",group_index:1,level:"A1"},{i:9,start:71.109,end:78.885,es:"Las flores son para mi madre.",group:"para: destinatario",group_index:1,level:"A1"},{i:10,start:78.885,end:86.064,es:"¿Para quién es el café?",group:"para: destinatario",group_index:1,level:"A1"},{i:11,start:86.064,end:93.669,es:"Hay una carta para usted.",group:"para: destinatario",group_index:1,level:"A1"},{i:12,start:93.669,end:102.043,es:"Trabaja para una empresa grande.",group:"para: destinatario",group_index:1,level:"A1"},{i:13,start:102.043,end:109.349,es:"Hice la cena para todos.",group:"para: destinatario",group_index:1,level:"A2"},{i:14,start:110.849,end:118.945,es:"Mañana salimos para la playa.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:15,start:118.945,end:127.66,es:"El tren para Quito sale a las ocho.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:16,start:127.66,end:135.777,es:"¿Este autobús va para el centro?",group:"para: destino y plazo",group_index:2,level:"A2"},{i:17,start:135.777,end:144.279,es:"Necesito el informe para el lunes.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:18,start:144.279,end:151.756,es:"La tarea es para mañana.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:19,start:151.756,end:159.916,es:"Para las seis ya estoy en casa.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:20,start:159.916,end:168.311,es:"Para el verano quiero hablar mejor.",group:"para: destino y plazo",group_index:2,level:"A2"},{i:21,start:169.811,end:178.483,es:"Para mí, esta película es aburrida.",group:"para mí: opinión",group_index:3,level:"A2"},{i:22,start:178.483,end:187.219,es:"Para ella, la familia es lo primero.",group:"para mí: opinión",group_index:3,level:"A2"},{i:23,start:187.219,end:195.613,es:"Para mi gusto, hay demasiada sal.",group:"para mí: opinión",group_index:3,level:"A2"},{i:24,start:195.613,end:205.395,es:"Para nosotros, el domingo es el mejor día.",group:"para mí: opinión",group_index:3,level:"A2"},{i:25,start:205.395,end:214.259,es:"Para un niño tan pequeño, lee muy bien.",group:"para mí: opinión",group_index:3,level:"B1"},{i:26,start:214.259,end:223.08,es:"Hace mucho calor para ser diciembre.",group:"para mí: opinión",group_index:3,level:"B1"},{i:27,start:224.58,end:231.652,es:"Gracias por la comida.",group:"por: causa",group_index:4,level:"A1"},{i:28,start:231.652,end:238.639,es:"Perdón por la espera.",group:"por: causa",group_index:4,level:"A1"},{i:29,start:238.639,end:244.879,es:"Lo hice por ti.",group:"por: causa",group_index:4,level:"A2"},{i:30,start:244.879,end:252.207,es:"No salimos por la lluvia.",group:"por: causa",group_index:4,level:"A2"},{i:31,start:252.207,end:260.068,es:"Llegué tarde por el tráfico.",group:"por: causa",group_index:4,level:"A2"},{i:32,start:260.068,end:267.78,es:"Está cansado por el viaje.",group:"por: causa",group_index:4,level:"A2"},{i:33,start:267.78,end:275.855,es:"Me preocupo mucho por mi hijo.",group:"por: causa",group_index:4,level:"A2"},{i:34,start:277.355,end:284.576,es:"Caminamos por el parque.",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:35,start:284.576,end:291.691,es:"Estudio por la mañana.",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:36,start:291.691,end:298.699,es:"Hablamos por teléfono.",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:37,start:298.699,end:306.176,es:"¿Hay una farmacia por aquí?",group:"por: lugar, tiempo y medio",group_index:5,level:"A1"},{i:38,start:306.176,end:314.229,es:"El gato entró por la ventana.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:39,start:314.229,end:322.176,es:"Paso por tu casa a las cinco.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:40,start:322.176,end:330.208,es:"Te mando las fotos por correo.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:41,start:330.208,end:338.112,es:"Viví en Perú por dos años.",group:"por: lugar, tiempo y medio",group_index:5,level:"A2"},{i:42,start:339.612,end:347.772,es:"Te cambio mi libro por el tuyo.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:43,start:347.772,end:355.975,es:"Pagamos mucho por esta casa.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:44,start:355.975,end:364.945,es:"Vendió su auto por muy poco dinero.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:45,start:364.945,end:373.703,es:"Cambié la camisa por una más grande.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:46,start:373.703,end:381.692,es:"Mañana trabajo yo por ti.",group:"por: cambio y precio",group_index:6,level:"A2"},{i:47,start:381.692,end:390.215,es:"¿Cuánto pagaste por esa chaqueta?",group:"por: cambio y precio",group_index:6,level:"A2"},{i:48,start:391.715,end:399.277,es:"Por favor, cierra la puerta.",group:"por fin, por eso, por favor",group_index:7,level:"A1"},{i:49,start:399.277,end:406.115,es:"¡Por fin llegaste!",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:50,start:406.115,end:414.104,es:"Por supuesto que puedes venir.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:51,start:414.104,end:422.307,es:"Estaba enfermo, por eso no vine.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:52,start:422.307,end:430.36,es:"Por cierto, ¿viste a Juan ayer?",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:53,start:430.36,end:437.88,es:"Por ahora todo está bien.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:54,start:437.88,end:445.549,es:"Por suerte, no pasó nada.",group:"por fin, por eso, por favor",group_index:7,level:"A2"},{i:55,start:447.049,end:456.148,es:"Salí por la mañana para llegar temprano.",group:"por y para juntos",group_index:8,level:"B1"},{i:56,start:456.148,end:463.732,es:"Lo hice por ti, no para mí.",group:"por y para juntos",group_index:8,level:"B1"},{i:57,start:463.732,end:472.98,es:"Pasamos por Lima para visitar a mis tíos.",group:"por y para juntos",group_index:8,level:"B1"},{i:58,start:472.98,end:482.655,es:"Te llamo por teléfono para confirmar la hora.",group:"por y para juntos",group_index:8,level:"B1"},{i:59,start:482.655,end:492.201,es:"Estudia por las noches para aprobar el examen.",group:"por y para juntos",group_index:8,level:"B1"},{i:60,start:492.201,end:502.772,es:"Gracias por el regalo, es perfecto para mi casa nueva.",group:"por y para juntos",group_index:8,level:"B1"},{i:61,start:502.772,end:512.511,es:"Para llegar al hotel, hay que pasar por el puente.",group:"por y para juntos",group_index:8,level:"B1"}],Er={word:qr,slug:fr,kind:yr,hash:jr,duration:Br,voice:zr,marks:Mr},$r="que",kr="que",Nr="word",wr="17d5c53646d66118",Lr=496.776,Sr="alex",Tr=[{i:0,start:.5,end:8.255,es:"Tengo que trabajar mañana.",group:"tener que, hay que",group_index:0,level:"A1"},{i:1,start:8.255,end:16.073,es:"Tienes que probar esta sopa.",group:"tener que, hay que",group_index:0,level:"A1"},{i:2,start:16.073,end:23.188,es:"Hay que salir temprano.",group:"tener que, hay que",group_index:0,level:"A1"},{i:3,start:23.188,end:30.58,es:"Tenemos que comprar pan.",group:"tener que, hay que",group_index:0,level:"A1"},{i:4,start:30.58,end:38.121,es:"Hay que pagar en efectivo.",group:"tener que, hay que",group_index:0,level:"A1"},{i:5,start:38.121,end:44.639,es:"¿Tienes que ir hoy?",group:"tener que, hay que",group_index:0,level:"A1"},{i:6,start:44.639,end:52.5,es:"Mis hijos tienen que estudiar.",group:"tener que, hay que",group_index:0,level:"A1"},{i:7,start:52.5,end:60.681,es:"Hay que tener cuidado con el perro.",group:"tener que, hay que",group_index:0,level:"A1"},{i:8,start:62.181,end:70.448,es:"La chica que canta es mi prima.",group:"el libro que leí",group_index:1,level:"A1"},{i:9,start:70.448,end:78.757,es:"Tengo un amigo que vive en Chile.",group:"el libro que leí",group_index:1,level:"A1"},{i:10,start:78.757,end:87.173,es:"El tren que va a Lima sale ahora.",group:"el libro que leí",group_index:1,level:"A1"},{i:11,start:87.173,end:95.739,es:"Es una película que me gusta mucho.",group:"el libro que leí",group_index:1,level:"A1"},{i:12,start:95.739,end:105.947,es:"Las personas que trabajan aquí son muy amables.",group:"el libro que leí",group_index:1,level:"A1"},{i:13,start:105.947,end:114,es:"El libro que leí es muy bueno.",group:"el libro que leí",group_index:1,level:"A2"},{i:14,start:114,end:122.608,es:"La casa que compramos es pequeña.",group:"el libro que leí",group_index:1,level:"A2"},{i:15,start:122.608,end:131.792,es:"¿Dónde está la camisa que me regalaste?",group:"el libro que leí",group_index:1,level:"A2"},{i:16,start:131.792,end:141.573,es:"El restaurante que te recomendé está cerrado.",group:"el libro que leí",group_index:1,level:"A2"},{i:17,start:143.073,end:150.167,es:"Creo que va a llover.",group:"creo que",group_index:2,level:"A1"},{i:18,start:150.167,end:157.473,es:"Dice que está cansado.",group:"creo que",group_index:2,level:"A1"},{i:19,start:157.473,end:164.887,es:"Pienso que tienes razón.",group:"creo que",group_index:2,level:"A1"},{i:20,start:164.887,end:171.617,es:"Sé que es difícil.",group:"creo que",group_index:2,level:"A1"},{i:21,start:171.617,end:179.116,es:"Parece que no hay nadie.",group:"creo que",group_index:2,level:"A1"},{i:22,start:179.116,end:185.548,es:"Supongo que sí.",group:"creo que",group_index:2,level:"A1"},{i:23,start:185.548,end:193.388,es:"Estoy seguro de que lo sabe.",group:"creo que",group_index:2,level:"A2"},{i:24,start:193.388,end:201.313,es:"Me dijo que no podía venir.",group:"creo que",group_index:2,level:"A2"},{i:25,start:201.313,end:208.705,es:"Veo que ya terminaste.",group:"creo que",group_index:2,level:"A2"},{i:26,start:210.205,end:218.451,es:"Mi hermano es más alto que yo.",group:"más que, menos que",group_index:3,level:"A1"},{i:27,start:218.451,end:226.909,es:"Este auto es más caro que el otro.",group:"más que, menos que",group_index:3,level:"A2"},{i:28,start:226.909,end:234.792,es:"Hoy hace menos frío que ayer.",group:"más que, menos que",group_index:3,level:"A2"},{i:29,start:234.792,end:243.251,es:"Me gusta más el té que el café.",group:"más que, menos que",group_index:3,level:"A2"},{i:30,start:243.251,end:251.389,es:"Corre más rápido que su padre.",group:"más que, menos que",group_index:3,level:"A2"},{i:31,start:251.389,end:259.336,es:"Ella trabaja más que nadie.",group:"más que, menos que",group_index:3,level:"A2"},{i:32,start:259.336,end:267.645,es:"La película es peor que el libro.",group:"más que, menos que",group_index:3,level:"A2"},{i:33,start:267.645,end:275.293,es:"Ahora gana menos que antes.",group:"más que, menos que",group_index:3,level:"A2"},{i:34,start:275.293,end:283.133,es:"Más vale tarde que nunca.",group:"más que, menos que",group_index:3,level:"A2"},{i:35,start:284.633,end:291.748,es:"Es que no tengo tiempo.",group:"es que",group_index:4,level:"A2"},{i:36,start:291.748,end:299.865,es:"Lo siento, es que estaba ocupado.",group:"es que",group_index:4,level:"A2"},{i:37,start:299.865,end:308.068,es:"No puedo ir, es que estoy enfermo.",group:"es que",group_index:4,level:"A2"},{i:38,start:308.068,end:315.119,es:"¿Es que no me escuchas?",group:"es que",group_index:4,level:"A2"},{i:39,start:315.119,end:322.233,es:"Es que no sabía nada.",group:"es que",group_index:4,level:"A2"},{i:40,start:322.233,end:330.713,es:"Perdón, es que había mucho tráfico.",group:"es que",group_index:4,level:"A2"},{i:41,start:330.713,end:338.404,es:"Es que hoy no me siento bien.",group:"es que",group_index:4,level:"A2"},{i:42,start:339.904,end:348.661,es:"Estaba cansado, así que me acosté.",group:"así que, ya que",group_index:5,level:"A2"},{i:43,start:348.661,end:357.355,es:"Está lloviendo, así que no salimos.",group:"así que, ya que",group_index:5,level:"A2"},{i:44,start:357.355,end:365.963,es:"Ya que estás aquí, ayúdame con esto.",group:"así que, ya que",group_index:5,level:"B1"},{i:45,start:365.963,end:374.571,es:"Ya que tienes tiempo, ¿vamos al cine?",group:"así que, ya que",group_index:5,level:"B1"},{i:46,start:376.071,end:383.804,es:"Quiero que vengas a mi casa.",group:"quiero que vengas",group_index:6,level:"B1"},{i:47,start:383.804,end:390.769,es:"Espero que te guste.",group:"quiero que vengas",group_index:6,level:"B1"},{i:48,start:390.769,end:398.375,es:"Necesito que me ayudes.",group:"quiero que vengas",group_index:6,level:"B1"},{i:49,start:398.375,end:406.62,es:"Es importante que duermas bien.",group:"quiero que vengas",group_index:6,level:"B1"},{i:50,start:406.62,end:414.46,es:"Prefiero que hablemos mañana.",group:"quiero que vengas",group_index:6,level:"B1"},{i:51,start:414.46,end:423.58,es:"Mi madre quiere que la llame todos los días.",group:"quiero que vengas",group_index:6,level:"B1"},{i:52,start:423.58,end:431.271,es:"Es mejor que salgamos ya.",group:"quiero que vengas",group_index:6,level:"B1"},{i:53,start:431.271,end:438.876,es:"No creo que llegue a tiempo.",group:"quiero que vengas",group_index:6,level:"B1"},{i:54,start:440.376,end:447.171,es:"¡Que te vaya bien!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:55,start:447.171,end:453.539,es:"Que descanses.",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:56,start:453.539,end:460.909,es:"¡Que tengas buen viaje!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:57,start:460.909,end:468.045,es:"¡Que te mejores pronto!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:58,start:468.045,end:475.245,es:"¡Que sean muy felices!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:59,start:475.245,end:481.827,es:"Que duermas bien.",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:60,start:481.827,end:489.176,es:"¡Que disfrutes la fiesta!",group:"¡que te vaya bien!",group_index:7,level:"B1"},{i:61,start:489.176,end:496.717,es:"¡Que cumplas muchos más!",group:"¡que te vaya bien!",group_index:7,level:"B1"}],Pr={word:$r,slug:kr,kind:Nr,hash:wr,duration:Lr,voice:Sr,marks:Tr},Cr="quedar(se)",Hr="quedar_se",Qr="word",Dr="c8f8c5bd8b438622",Yr=496.752,Vr="alex",Or=[{i:0,start:.5,end:7.487,es:"Hoy me quedo en casa.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:1,start:7.487,end:14.324,es:"¿Te quedas a cenar?",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:2,start:14.324,end:22.697,es:"Nos quedamos en un hotel pequeño.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:3,start:22.697,end:31.007,es:"Mi hermana se queda con nosotros.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:4,start:31.007,end:38.441,es:"Quédate aquí un momento.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:5,start:38.441,end:46.388,es:"Prefiero quedarme en la cama.",group:"quedarse en un lugar",group_index:0,level:"A1"},{i:6,start:46.388,end:55.7,es:"Ayer nos quedamos en la playa todo el día.",group:"quedarse en un lugar",group_index:0,level:"A2"},{i:7,start:55.7,end:65.311,es:"Me quedé dos semanas en casa de mis abuelos.",group:"quedarse en un lugar",group_index:0,level:"A2"},{i:8,start:66.811,end:73.925,es:"¿Dónde queda el museo?",group:"quedar, estar situado",group_index:1,level:"A1"},{i:9,start:73.925,end:81.595,es:"El banco queda muy cerca.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:10,start:81.595,end:89.989,es:"Mi casa queda lejos del centro.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:11,start:89.989,end:99.003,es:"La farmacia queda al lado del mercado.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:12,start:99.003,end:106.352,es:"¿Queda lejos la estación?",group:"quedar, estar situado",group_index:1,level:"A1"},{i:13,start:106.352,end:115.28,es:"La escuela queda a dos calles de aquí.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:14,start:115.28,end:124.251,es:"El restaurante queda enfrente del parque.",group:"quedar, estar situado",group_index:1,level:"A1"},{i:15,start:125.751,end:133.036,es:"Queda un poco de café.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:16,start:133.036,end:139.575,es:"No queda leche.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:17,start:139.575,end:146.817,es:"¿Cuánto dinero te queda?",group:"quedar, sobrar",group_index:2,level:"A1"},{i:18,start:146.817,end:154.423,es:"Solo quedan dos asientos.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:19,start:154.423,end:162.945,es:"Quedan cinco minutos para el final.",group:"quedar, sobrar",group_index:2,level:"A1"},{i:20,start:162.945,end:171.703,es:"Me quedan tres días de vacaciones.",group:"quedar, sobrar",group_index:2,level:"A2"},{i:21,start:171.703,end:180.716,es:"No quedaba nada en el refrigerador.",group:"quedar, sobrar",group_index:2,level:"A2"},{i:22,start:180.716,end:189.345,es:"Todavía nos queda mucho trabajo.",group:"quedar, sobrar",group_index:2,level:"A2"},{i:23,start:190.845,end:199.091,es:"Esa camisa te queda muy bien.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:24,start:199.091,end:207.613,es:"Estos zapatos me quedan pequeños.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:25,start:207.613,end:215.283,es:"El vestido le queda grande.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:26,start:215.283,end:223.123,es:"¿Cómo me queda este sombrero?",group:"quedar bien o mal",group_index:3,level:"A2"},{i:27,start:223.123,end:231.752,es:"El azul te queda mejor que el rojo.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:28,start:231.752,end:240.125,es:"Los pantalones ya no me quedan.",group:"quedar bien o mal",group_index:3,level:"A2"},{i:29,start:240.125,end:248.051,es:"Quedé muy mal con mi jefe.",group:"quedar bien o mal",group_index:3,level:"B1"},{i:30,start:248.051,end:256.381,es:"Quiero quedar bien con tus padres.",group:"quedar bien o mal",group_index:3,level:"B1"},{i:31,start:257.881,end:265.444,es:"La sopa quedó muy rica.",group:"quedar, resultado",group_index:4,level:"A2"},{i:32,start:265.444,end:273.668,es:"¡Qué bonita quedó tu habitación!",group:"quedar, resultado",group_index:4,level:"A2"},{i:33,start:273.668,end:281.38,es:"La casa quedó muy limpia.",group:"quedar, resultado",group_index:4,level:"A2"},{i:34,start:281.38,end:290.521,es:"La puerta quedó abierta toda la noche.",group:"quedar, resultado",group_index:4,level:"A2"},{i:35,start:290.521,end:300.708,es:"Con la pintura nueva, la cocina quedó como nueva.",group:"quedar, resultado",group_index:4,level:"A2"},{i:36,start:300.708,end:309.423,es:"Mi dibujo no quedó como yo quería.",group:"quedar, resultado",group_index:4,level:"A2"},{i:37,start:309.423,end:319.481,es:"Después de la tormenta, la calle quedó sin luz.",group:"quedar, resultado",group_index:4,level:"B1"},{i:38,start:320.981,end:329.589,es:"Me quedé sorprendido con la noticia.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:39,start:329.589,end:337.685,es:"Se quedó dormido en el sofá.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:40,start:337.685,end:345.376,es:"El niño se quedó callado.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:41,start:345.376,end:354.88,es:"Nos quedamos sin gasolina en la carretera.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:42,start:354.88,end:364.661,es:"Mi abuela se quedó sola después de la mudanza.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:43,start:364.661,end:373.675,es:"Me quedé mirando el mar un buen rato.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:44,start:373.675,end:382.88,es:"Se quedaron hablando hasta la medianoche.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"A2"},{i:45,start:382.88,end:392.128,es:"Si sigues así, te vas a quedar sin amigos.",group:"quedarse + adjetivo, gerundio o sin algo",group_index:5,level:"B1"},{i:46,start:393.628,end:401.511,es:"Me quedo con la camisa verde.",group:"quedarse con algo",group_index:6,level:"A2"},{i:47,start:401.511,end:408.476,es:"Quédate con el cambio.",group:"quedarse con algo",group_index:6,level:"A2"},{i:48,start:408.476,end:416.679,es:"Mi hermano se quedó con mi libro.",group:"quedarse con algo",group_index:6,level:"A2"},{i:49,start:416.679,end:424.753,es:"¿Te puedes quedar con mis llaves?",group:"quedarse con algo",group_index:6,level:"A2"},{i:50,start:424.753,end:435.367,es:"Al final nos quedamos con el apartamento más grande.",group:"quedarse con algo",group_index:6,level:"B1"},{i:51,start:436.867,end:444.899,es:"Quedamos en vernos el lunes.",group:"quedar en algo",group_index:7,level:"B1"},{i:52,start:444.899,end:454.147,es:"Habíamos quedado en llamarnos esta tarde.",group:"quedar en algo",group_index:7,level:"B1"},{i:53,start:454.147,end:463.459,es:"Quedaron en traer la comida a la fiesta.",group:"quedar en algo",group_index:7,level:"B1"},{i:54,start:463.459,end:471.427,es:"¿En qué quedamos, vienes o no?",group:"quedar en algo",group_index:7,level:"B1"},{i:55,start:471.427,end:480.867,es:"Quedé en ayudar a mi vecino con la mudanza.",group:"quedar en algo",group_index:7,level:"B1"},{i:56,start:480.867,end:487.661,es:"Todo quedó en nada.",group:"quedar en algo",group_index:7,level:"B1"},{i:57,start:487.661,end:496.696,es:"Quedamos en encontrarnos en la plaza.",group:"quedar en algo",group_index:7,level:"B1"}],Ir={word:Cr,slug:Hr,kind:Qr,hash:Dr,duration:Yr,voice:Vr,marks:Or},Fr="sacar",Rr="sacar",Ur="word",Gr="9a0132ffc7314752",Kr=535.824,Wr="alex",Jr=[{i:0,start:.5,end:8.852,es:"Saca la leche del refrigerador.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:1,start:8.852,end:17.247,es:"Ella saca un libro de la mochila.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:2,start:17.247,end:25.983,es:"¿Puedes sacar los platos del armario?",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:3,start:25.983,end:34.057,es:"Saco las llaves del bolsillo.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:4,start:34.057,end:42.217,es:"Saquen sus cuadernos, por favor.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:5,start:42.217,end:50.356,es:"Sacamos las maletas del auto.",group:"sacar algo de un lugar",group_index:0,level:"A1"},{i:6,start:50.356,end:58.559,es:"El dentista me sacó una muela.",group:"sacar algo de un lugar",group_index:0,level:"A2"},{i:7,start:58.559,end:67.103,es:"¿Ya sacaste la ropa de la lavadora?",group:"sacar algo de un lugar",group_index:0,level:"A2"},{i:8,start:68.603,end:76.443,es:"¿Quién saca la basura hoy?",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:9,start:76.443,end:84.773,es:"Saco al perro todas las mañanas.",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:10,start:84.773,end:94.149,es:"Por favor, saca la basura antes de dormir.",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:11,start:94.149,end:102.395,es:"Mi hijo nunca saca la basura.",group:"sacar la basura, sacar al perro",group_index:1,level:"A1"},{i:12,start:102.395,end:110.576,es:"Voy a sacar al perro a pasear.",group:"sacar la basura, sacar al perro",group_index:1,level:"A2"},{i:13,start:110.576,end:119.461,es:"Ayer se me olvidó sacar la basura.",group:"sacar la basura, sacar al perro",group_index:1,level:"A2"},{i:14,start:119.461,end:128.325,es:"Saqué a los niños al parque un rato.",group:"sacar la basura, sacar al perro",group_index:1,level:"A2"},{i:15,start:129.825,end:136.94,es:"¿Me sacas una foto?",group:"sacar fotos",group_index:2,level:"A1"},{i:16,start:136.94,end:145.164,es:"Aquí no se pueden sacar fotos.",group:"sacar fotos",group_index:2,level:"A1"},{i:17,start:145.164,end:153.431,es:"Mi madre saca fotos de todo.",group:"sacar fotos",group_index:2,level:"A1"},{i:18,start:153.431,end:160.695,es:"Saca una foto del mar.",group:"sacar fotos",group_index:2,level:"A1"},{i:19,start:160.695,end:169.623,es:"Sacamos muchas fotos en el viaje.",group:"sacar fotos",group_index:2,level:"A2"},{i:20,start:169.623,end:178.487,es:"¿Puedes sacarnos una foto a los dos?",group:"sacar fotos",group_index:2,level:"A2"},{i:21,start:178.487,end:188.417,es:"Le saqué una foto al atardecer con el teléfono.",group:"sacar fotos",group_index:2,level:"A2"},{i:22,start:189.917,end:197.565,es:"Necesito sacar dinero.",group:"sacar dinero",group_index:3,level:"A1"},{i:23,start:197.565,end:205.896,es:"¿Hay un cajero para sacar dinero?",group:"sacar dinero",group_index:3,level:"A1"},{i:24,start:205.896,end:214.547,es:"Saqué dinero del cajero de la esquina.",group:"sacar dinero",group_index:3,level:"A2"},{i:25,start:214.547,end:225.16,es:"No pude sacar dinero porque el cajero no funcionaba.",group:"sacar dinero",group_index:3,level:"A2"},{i:26,start:225.16,end:234.685,es:"Voy a sacar dinero antes de ir al mercado.",group:"sacar dinero",group_index:3,level:"A2"},{i:27,start:234.685,end:244.381,es:"Mi abuelo saca dinero del banco cada mes.",group:"sacar dinero",group_index:3,level:"A2"},{i:28,start:244.381,end:254.099,es:"Si sacas dinero en otro banco, te cobran más.",group:"sacar dinero",group_index:3,level:"A2"},{i:29,start:255.599,end:264.569,es:"Mi hermana siempre saca buenas notas.",group:"sacar buena nota",group_index:4,level:"A1"},{i:30,start:264.569,end:272.793,es:"Saqué un diez en matemáticas.",group:"sacar buena nota",group_index:4,level:"A2"},{i:31,start:272.793,end:280.996,es:"¿Qué nota sacaste en el examen?",group:"sacar buena nota",group_index:4,level:"A2"},{i:32,start:280.996,end:289.839,es:"Este año he sacado mejores notas.",group:"sacar buena nota",group_index:4,level:"A2"},{i:33,start:289.839,end:298.873,es:"Si estudias, vas a sacar buena nota.",group:"sacar buena nota",group_index:4,level:"A2"},{i:34,start:298.873,end:307.375,es:"No saqué buena nota, pero aprobé.",group:"sacar buena nota",group_index:4,level:"A2"},{i:35,start:307.375,end:317.241,es:"Ojalá saque buena nota en el examen de inglés.",group:"sacar buena nota",group_index:4,level:"B1"},{i:36,start:318.741,end:327.584,es:"Ya saqué los boletos para el concierto.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:37,start:327.584,end:336.597,es:"Hay que sacar las entradas por internet.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:38,start:336.597,end:345.547,es:"¿Dónde puedo sacar un boleto de tren?",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:39,start:345.547,end:355.648,es:"Mi hijo acaba de sacar la licencia de conducir.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:40,start:355.648,end:365.643,es:"Tengo que sacar el pasaporte antes del viaje.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:41,start:365.643,end:375.68,es:"Vamos a sacar entradas para el partido del sábado.",group:"sacar entradas, boletos, documentos",group_index:5,level:"A2"},{i:42,start:375.68,end:385.077,es:"Me gustaría sacar los boletos con tiempo.",group:"sacar entradas, boletos, documentos",group_index:5,level:"B1"},{i:43,start:386.577,end:395.612,es:"¿Qué conclusión sacaste de la película?",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"A2"},{i:44,start:395.612,end:404.476,es:"No saques conclusiones tan rápido.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:45,start:404.476,end:415.025,es:"Después de la reunión, sacamos varias conclusiones.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:46,start:415.025,end:423.079,es:"Ese ruido me saca de quicio.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:47,start:423.079,end:432.732,es:"Mi hermano me saca de quicio cuando no escucha.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:48,start:432.732,end:442.044,es:"No dejes que el tráfico te saque de quicio.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:49,start:442.044,end:452.103,es:"Es mejor esperar antes de sacar conclusiones.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:50,start:452.103,end:461.201,es:"Me sacó de quicio que llegara tan tarde.",group:"sacar conclusiones, sacar de quicio",group_index:6,level:"B1"},{i:51,start:462.701,end:473.677,es:"Mis padres trabajaron mucho para sacarnos adelante.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:52,start:473.677,end:482.712,es:"Hay que sacar provecho de las vacaciones.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:53,start:482.712,end:491.597,es:"No sé de dónde sacas tanta energía.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:54,start:491.597,end:500.333,es:"Siempre saca tiempo para su familia.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:55,start:500.333,end:508.259,es:"¿Quién sacó el tema del dinero?",group:"expresiones con sacar",group_index:7,level:"B1"},{i:56,start:508.259,end:516.12,es:"No me saques de mis casillas.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:57,start:516.12,end:525.709,es:"Ella sacó una idea genial de un libro viejo.",group:"expresiones con sacar",group_index:7,level:"B1"},{i:58,start:525.709,end:535.768,es:"Siempre sabe sacar lo mejor de cada situación.",group:"expresiones con sacar",group_index:7,level:"B1"}],Xr={word:Fr,slug:Rr,kind:Ur,hash:Gr,duration:Kr,voice:Wr,marks:Jr},Zr="saludos y despedidas",es="saludos_y_despedidas",as="concept",os="46153e110da6a874",rs=463.704,ss="alex",ns=[{i:0,start:.5,end:6.697,es:"Hola, ¿qué tal?",group:"saludar",group_index:0,level:"A1"},{i:1,start:6.697,end:13.492,es:"Buenas, ¿cómo estás?",group:"saludar",group_index:0,level:"A1"},{i:2,start:13.492,end:19.412,es:"¿Cómo te va?",group:"saludar",group_index:0,level:"A1"},{i:3,start:19.412,end:26.079,es:"Hola, ¿cómo andas?",group:"saludar",group_index:0,level:"A1"},{i:4,start:26.079,end:31.999,es:"¿Todo bien?",group:"saludar",group_index:0,level:"A1"},{i:5,start:31.999,end:37.983,es:"¿Qué cuentas?",group:"saludar",group_index:0,level:"A1"},{i:6,start:37.983,end:44.5,es:"¿Qué hay de nuevo?",group:"saludar",group_index:0,level:"A1"},{i:7,start:44.5,end:51.337,es:"¡Hola, cuánto tiempo!",group:"saludar",group_index:0,level:"A2"},{i:8,start:51.337,end:57.961,es:"¡Qué gusto verte!",group:"saludar",group_index:0,level:"A2"},{i:9,start:59.461,end:66.341,es:"Muy bien, gracias.",group:"responder",group_index:1,level:"A1"},{i:10,start:66.341,end:72.837,es:"Aquí, tranquilo.",group:"responder",group_index:1,level:"A1"},{i:11,start:72.837,end:80.315,es:"Más o menos, la verdad.",group:"responder",group_index:1,level:"A1"},{i:12,start:80.315,end:88.773,es:"Bastante bien, un poco cansado.",group:"responder",group_index:1,level:"A1"},{i:13,start:88.773,end:96.293,es:"Nada nuevo, lo de siempre.",group:"responder",group_index:1,level:"A2"},{i:14,start:96.293,end:102.171,es:"Ahí vamos.",group:"responder",group_index:1,level:"A2"},{i:15,start:103.671,end:109.612,es:"Bien, ¿y tú?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:16,start:109.612,end:117.516,es:"Todo tranquilo, ¿y tú qué tal?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:17,start:117.516,end:125.292,es:"Muy bien, ¿y a ti cómo te va?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:18,start:125.292,end:133.516,es:"Bien, gracias, ¿y tú cómo estás?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:19,start:133.516,end:141.548,es:"Pues aquí, trabajando, ¿y tú?",group:"devolver la pregunta",group_index:2,level:"A1"},{i:20,start:141.548,end:150.113,es:"Aquí, como siempre, ¿y tú qué cuentas?",group:"devolver la pregunta",group_index:2,level:"A2"},{i:21,start:151.613,end:157.64,es:"Hasta luego.",group:"decir adiós",group_index:3,level:"A1"},{i:22,start:157.64,end:163.432,es:"Nos vemos.",group:"decir adiós",group_index:3,level:"A1"},{i:23,start:163.432,end:170.184,es:"Nos vemos mañana.",group:"decir adiós",group_index:3,level:"A1"},{i:24,start:170.184,end:177.277,es:"Nos vemos otro día.",group:"decir adiós",group_index:3,level:"A1"},{i:25,start:177.277,end:183.688,es:"Hablamos luego.",group:"decir adiós",group_index:3,level:"A1"},{i:26,start:183.688,end:189.779,es:"Hasta pronto.",group:"decir adiós",group_index:3,level:"A1"},{i:27,start:189.779,end:196.531,es:"Te escribo luego.",group:"decir adiós",group_index:3,level:"A1"},{i:28,start:198.031,end:204.121,es:"Igualmente.",group:"responder a una despedida",group_index:4,level:"A1"},{i:29,start:204.121,end:211.215,es:"Tú también, cuídate.",group:"responder a una despedida",group_index:4,level:"A1"},{i:30,start:211.215,end:218.415,es:"De acuerdo, nos vemos.",group:"responder a una despedida",group_index:4,level:"A1"},{i:31,start:218.415,end:225.892,es:"Gracias, lo mismo digo.",group:"responder a una despedida",group_index:4,level:"A2"},{i:32,start:225.892,end:232.644,es:"El gusto fue mío.",group:"responder a una despedida",group_index:4,level:"A2"},{i:33,start:232.644,end:240.676,es:"Gracias, yo les doy tus saludos.",group:"responder a una despedida",group_index:4,level:"A2"},{i:34,start:240.676,end:248.239,es:"Hasta luego, que estés bien.",group:"responder a una despedida",group_index:4,level:"A2"},{i:35,start:249.739,end:255.381,es:"¡Qué bien!",group:"reaccionar a la respuesta",group_index:5,level:"A1"},{i:36,start:255.381,end:261.515,es:"Ay, qué pena.",group:"reaccionar a la respuesta",group_index:5,level:"A1"},{i:37,start:261.515,end:270.443,es:"Te entiendo, yo también estoy cansado.",group:"reaccionar a la respuesta",group_index:5,level:"A1"},{i:38,start:270.443,end:277.109,es:"Me alegro mucho.",group:"reaccionar a la respuesta",group_index:5,level:"A2"},{i:39,start:277.109,end:285.099,es:"Me alegro de que te vaya bien.",group:"reaccionar a la respuesta",group_index:5,level:"B1"},{i:40,start:285.099,end:292.917,es:"Espero que todo siga bien.",group:"reaccionar a la respuesta",group_index:5,level:"B1"},{i:41,start:294.417,end:301.084,es:"¿Qué tal tu día?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:42,start:301.084,end:308.135,es:"¿Qué tal el trabajo?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:43,start:308.135,end:315.079,es:"¿Qué tal la familia?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:44,start:315.079,end:322.407,es:"¿Cómo va todo en casa?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:45,start:322.407,end:329.244,es:"¿Cómo va la semana?",group:"preguntar cómo va todo",group_index:6,level:"A1"},{i:46,start:329.244,end:337.148,es:"¿Cómo te fue el fin de semana?",group:"preguntar cómo va todo",group_index:6,level:"A2"},{i:47,start:337.148,end:344.817,es:"¿Qué has hecho estos días?",group:"preguntar cómo va todo",group_index:6,level:"A2"},{i:48,start:344.817,end:351.655,es:"¿Cómo has estado?",group:"preguntar cómo va todo",group_index:6,level:"A2"},{i:49,start:353.155,end:359.629,es:"Bueno, te dejo.",group:"avisar que te vas",group_index:7,level:"A2"},{i:50,start:359.629,end:366.147,es:"Me tengo que ir.",group:"avisar que te vas",group_index:7,level:"A2"},{i:51,start:366.147,end:373.368,es:"Ya me voy, que es tarde.",group:"avisar que te vas",group_index:7,level:"A2"},{i:52,start:373.368,end:380.397,es:"Bueno, me voy yendo.",group:"avisar que te vas",group_index:7,level:"A2"},{i:53,start:380.397,end:387.213,es:"Bueno, me despido.",group:"avisar que te vas",group_index:7,level:"A2"},{i:54,start:387.213,end:396.461,es:"Te dejo, que seguro tienes cosas que hacer.",group:"avisar que te vas",group_index:7,level:"A2"},{i:55,start:396.461,end:404.387,es:"Bueno, no te quito más tiempo.",group:"avisar que te vas",group_index:7,level:"B1"},{i:56,start:405.887,end:412.34,es:"Cuídate mucho.",group:"buenos deseos",group_index:8,level:"A1"},{i:57,start:412.34,end:419.22,es:"Buen fin de semana.",group:"buenos deseos",group_index:8,level:"A1"},{i:58,start:419.22,end:425.908,es:"Que te vaya bien.",group:"buenos deseos",group_index:8,level:"A2"},{i:59,start:425.908,end:432.959,es:"Que tengas buen día.",group:"buenos deseos",group_index:8,level:"A2"},{i:60,start:432.959,end:440.201,es:"Saludos a tu familia.",group:"buenos deseos",group_index:8,level:"A2"},{i:61,start:440.201,end:447.124,es:"Fue un gusto verte.",group:"buenos deseos",group_index:8,level:"A2"},{i:62,start:447.124,end:455.284,es:"Que tengas una buena semana.",group:"buenos deseos",group_index:8,level:"A2"},{i:63,start:455.284,end:463.636,es:"Que disfrutes el resto del día.",group:"buenos deseos",group_index:8,level:"B1"}],ls={word:Zr,slug:es,kind:as,hash:os,duration:rs,voice:ss,marks:ns},is="se",ts="se",us="word",ds="7754f963bc0c72ff",ps=496.248,gs="alex",cs=[{i:0,start:.5,end:9.001,es:"Mi hermano se ducha por la mañana.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:1,start:9.001,end:16.671,es:"Ella se levanta a las siete.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:2,start:16.671,end:24.724,es:"Mi abuela se acuesta temprano.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:3,start:24.724,end:32.031,es:"¿Cómo se llama tu perro?",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:4,start:32.031,end:39.785,es:"El niño se lava las manos.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:5,start:39.785,end:48.585,es:"Mi padre se afeita todos los días.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:6,start:48.585,end:56.105,es:"Se pone el abrigo y sale.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:7,start:56.105,end:63.839,es:"Los niños se visten solos.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:8,start:63.839,end:72.553,es:"Mi madre se peina antes de salir.",group:"se ducha, se levanta",group_index:0,level:"A1"},{i:9,start:74.053,end:81.616,es:"Mi jefe se va a las cinco.",group:"se va, se queda",group_index:1,level:"A1"},{i:10,start:81.616,end:88.667,es:"Hoy se queda en casa.",group:"se va, se queda",group_index:1,level:"A1"},{i:11,start:88.667,end:96.656,es:"Se sienta junto a la ventana.",group:"se va, se queda",group_index:1,level:"A1"},{i:12,start:96.656,end:104.837,es:"Mi hijo se enoja fácilmente.",group:"se va, se queda",group_index:1,level:"A1"},{i:13,start:104.837,end:113.445,es:"Se preocupa mucho por su familia.",group:"se va, se queda",group_index:1,level:"A1"},{i:14,start:113.445,end:121.221,es:"Mi amigo se casa en junio.",group:"se va, se queda",group_index:1,level:"A1"},{i:15,start:121.221,end:129.083,es:"Ana se fue sin decir nada.",group:"se va, se queda",group_index:1,level:"A2"},{i:16,start:129.083,end:137.392,es:"Se quedaron en un hotel pequeño.",group:"se va, se queda",group_index:1,level:"A2"},{i:17,start:137.392,end:145.189,es:"Se acordó de mi cumpleaños.",group:"se va, se queda",group_index:1,level:"A2"},{i:18,start:146.689,end:154.444,es:"Mis padres se quieren mucho.",group:"se quieren",group_index:2,level:"A1"},{i:19,start:154.444,end:162.711,es:"Se conocieron en la universidad.",group:"se quieren",group_index:2,level:"A2"},{i:20,start:162.711,end:170.423,es:"Los vecinos no se hablan.",group:"se quieren",group_index:2,level:"A2"},{i:21,start:170.423,end:178.433,es:"Se escriben todas las semanas.",group:"se quieren",group_index:2,level:"A2"},{i:22,start:178.433,end:186.615,es:"Se abrazaron en el aeropuerto.",group:"se quieren",group_index:2,level:"A2"},{i:23,start:186.615,end:195.201,es:"Ana y Luis se ven todos los días.",group:"se quieren",group_index:2,level:"A2"},{i:24,start:195.201,end:203.873,es:"Los dos hermanos se parecen mucho.",group:"se quieren",group_index:2,level:"A2"},{i:25,start:203.873,end:212.439,es:"Se ayudan con las tareas de la casa.",group:"se quieren",group_index:2,level:"A2"},{i:26,start:213.939,end:220.861,es:"Aquí se vive bien.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:27,start:220.861,end:229.789,es:"Se come muy bien en este restaurante.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:28,start:229.789,end:237.736,es:"¿Cómo se dice esto en español?",group:"se vive bien aquí",group_index:3,level:"A2"},{i:29,start:237.736,end:246.003,es:"En esta tienda se habla español.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:30,start:246.003,end:253.416,es:"No se puede fumar aquí.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:31,start:253.416,end:260.979,es:"¿Por dónde se va al centro?",group:"se vive bien aquí",group_index:3,level:"A2"},{i:32,start:260.979,end:269.693,es:"Se trabaja mucho en esta empresa.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:33,start:269.693,end:277.149,es:"Desde aquí se ve el mar.",group:"se vive bien aquí",group_index:3,level:"A2"},{i:34,start:277.149,end:284.456,es:"¿Cómo se escribe tu nombre?",group:"se vive bien aquí",group_index:3,level:"A2"},{i:35,start:285.956,end:294.308,es:"En esta calle se venden casas.",group:"se venden casas",group_index:4,level:"A2"},{i:36,start:294.308,end:303.791,es:"Se alquila un apartamento cerca del parque.",group:"se venden casas",group_index:4,level:"A2"},{i:37,start:303.791,end:312.313,es:"Se necesita ayuda en la cocina.",group:"se venden casas",group_index:4,level:"A2"},{i:38,start:312.313,end:320.431,es:"Aquí se arreglan computadoras.",group:"se venden casas",group_index:4,level:"A2"},{i:39,start:320.431,end:328.057,es:"Aquí se aceptan tarjetas.",group:"se venden casas",group_index:4,level:"A2"},{i:40,start:328.057,end:336.516,es:"Se vendieron todas las entradas.",group:"se venden casas",group_index:4,level:"A2"},{i:41,start:336.516,end:344.804,es:"Este plato se prepara con arroz.",group:"se venden casas",group_index:4,level:"A2"},{i:42,start:344.804,end:354.329,es:"Se construyó un puente nuevo el año pasado.",group:"se venden casas",group_index:4,level:"A2"},{i:43,start:355.829,end:362.517,es:"Se lo doy mañana.",group:"se lo, se la",group_index:5,level:"A2"},{i:44,start:362.517,end:370.571,es:"¿El libro? Se lo presté a Marta.",group:"se lo, se la",group_index:5,level:"A2"},{i:45,start:370.571,end:377.259,es:"Se lo dije ayer.",group:"se lo, se la",group_index:5,level:"A2"},{i:46,start:377.259,end:385.312,es:"¿Le diste la carta? Sí, se la di.",group:"se lo, se la",group_index:5,level:"A2"},{i:47,start:385.312,end:394.389,es:"Mi hijo quería un perro y se lo compramos.",group:"se lo, se la",group_index:5,level:"A2"},{i:48,start:394.389,end:403.68,es:"Si tienes la foto, mándasela a tu madre.",group:"se lo, se la",group_index:5,level:"A2"},{i:49,start:403.68,end:411.819,es:"Se lo explico otra vez, señora.",group:"se lo, se la",group_index:5,level:"A2"},{i:50,start:411.819,end:419.552,es:"Se los regalé a mis sobrinos.",group:"se lo, se la",group_index:5,level:"A2"},{i:51,start:419.552,end:427.093,es:"No se lo digas a nadie.",group:"se lo, se la",group_index:5,level:"B1"},{i:52,start:428.593,end:435.985,es:"Se me olvidó tu nombre.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:53,start:435.985,end:442.908,es:"Se le cayó el vaso.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:54,start:442.908,end:450.108,es:"Se nos acabó la leche.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:55,start:450.108,end:457.628,es:"Se me rompió el teléfono.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:56,start:457.628,end:465.361,es:"Se te olvidaron las llaves.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:57,start:465.361,end:474.46,es:"Se le perdió la tarjeta en el autobús.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:58,start:474.46,end:481.383,es:"Se me quemó el arroz.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:59,start:481.383,end:488.177,es:"Se nos hizo tarde.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"},{i:60,start:488.177,end:496.188,es:"Al niño se le cayó un diente.",group:"se me olvidó, se le cayó",group_index:6,level:"B1"}],vs={word:is,slug:ts,kind:us,hash:ds,duration:ps,voice:gs,marks:cs},ms="seguir",_s="seguir",xs="word",As="7fe95acce38ccad7",hs=475.92,bs="alex",qs=[{i:0,start:.5,end:7.231,es:"Sígueme, por favor.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:1,start:7.231,end:15.391,es:"El perro me sigue a todas partes.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:2,start:15.391,end:23.679,es:"Sigue esta calle hasta el final.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:3,start:23.679,end:30.26,es:"¿Por qué me sigues?",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:4,start:30.26,end:38.292,es:"Seguimos al guía por el museo.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:5,start:38.292,end:46.303,es:"Los patitos siguen a su madre.",group:"seguir, ir detrás",group_index:0,level:"A1"},{i:6,start:46.303,end:54.313,es:"Siga a ese taxi, por favor.",group:"seguir, ir detrás",group_index:0,level:"A2"},{i:7,start:54.313,end:62.879,es:"Alguien nos sigue desde hace un rato.",group:"seguir, ir detrás",group_index:0,level:"A2"},{i:8,start:64.379,end:70.021,es:"¿Seguimos?",group:"seguir, continuar",group_index:1,level:"A1"},{i:9,start:70.021,end:77.712,es:"Sigue, por favor, te escucho.",group:"seguir, continuar",group_index:1,level:"A1"},{i:10,start:77.712,end:87.237,es:"La película sigue después de los anuncios.",group:"seguir, continuar",group_index:1,level:"A1"},{i:11,start:87.237,end:94.779,es:"Si quieres, seguimos mañana.",group:"seguir, continuar",group_index:1,level:"A1"},{i:12,start:94.779,end:102.747,es:"El camino sigue por el bosque.",group:"seguir, continuar",group_index:1,level:"A1"},{i:13,start:102.747,end:111.013,es:"La reunión sigue hasta las cinco.",group:"seguir, continuar",group_index:1,level:"A1"},{i:14,start:111.013,end:118.853,es:"Seguimos con la lección de ayer.",group:"seguir, continuar",group_index:1,level:"A1"},{i:15,start:120.353,end:126.764,es:"Sigue lloviendo.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:16,start:126.764,end:135.564,es:"Sigo trabajando en el mismo lugar.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:17,start:135.564,end:143.148,es:"¿Sigues viviendo en el centro?",group:"sigue lloviendo",group_index:2,level:"A2"},{i:18,start:143.148,end:152.972,es:"Mi abuelo sigue manejando a los noventa años.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:19,start:152.972,end:161.153,es:"Seguimos esperando el autobús.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:20,start:161.153,end:168.823,es:"Los niños siguen durmiendo.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:21,start:168.823,end:177.409,es:"Ella siguió hablando toda la noche.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:22,start:177.409,end:186.38,es:"Sigue intentándolo, ya casi lo tienes.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:23,start:186.38,end:195.009,es:"A pesar del frío, seguimos caminando.",group:"sigue lloviendo",group_index:2,level:"A2"},{i:24,start:196.509,end:204.008,es:"Mi hermana sigue enferma.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:25,start:204.008,end:209.949,es:"¿Sigues aquí?",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:26,start:209.949,end:217.235,es:"La tienda sigue cerrada.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:27,start:217.235,end:224.712,es:"El café sigue caliente.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:28,start:224.712,end:232.339,es:"Seguimos en el aeropuerto.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:29,start:232.339,end:243.208,es:"Mis padres siguen casados después de cuarenta años.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:30,start:243.208,end:250.067,es:"Sigo muy cansado.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:31,start:250.067,end:257.224,es:"¿Sigue abierto el banco?",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:32,start:257.224,end:264.829,es:"El problema sigue igual.",group:"sigue enfermo, sigue aquí",group_index:3,level:"A2"},{i:33,start:266.329,end:273.359,es:"Sigue las instrucciones.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:34,start:273.359,end:281.369,es:"Seguí tu consejo y funcionó.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:35,start:281.369,end:288.697,es:"Hay que seguir las reglas.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:36,start:288.697,end:296.857,es:"No seguiste la receta, ¿verdad?",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:37,start:296.857,end:305.615,es:"Siempre sigo los consejos de mi madre.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:38,start:305.615,end:314.308,es:"Sigue el mapa y no te vas a perder.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:39,start:314.308,end:323.108,es:"Seguimos las señales hasta la salida.",group:"seguir instrucciones y consejos",group_index:4,level:"A2"},{i:40,start:323.108,end:332.42,es:"El médico me dijo que siguiera una dieta.",group:"seguir instrucciones y consejos",group_index:4,level:"B1"},{i:41,start:333.92,end:340.672,es:"Sigo sin entender.",group:"seguir sin",group_index:5,level:"B1"},{i:42,start:340.672,end:348.597,es:"Seguimos sin noticias de él.",group:"seguir sin",group_index:5,level:"B1"},{i:43,start:348.597,end:357.611,es:"El vecino sigue sin pagar el alquiler.",group:"seguir sin",group_index:5,level:"B1"},{i:44,start:357.611,end:365.621,es:"Sigo sin encontrar mis llaves.",group:"seguir sin",group_index:5,level:"B1"},{i:45,start:365.621,end:375.68,es:"Llevo una hora en la cama y sigo sin poder dormir.",group:"seguir sin",group_index:5,level:"B1"},{i:46,start:375.68,end:384.331,es:"La computadora sigue sin funcionar.",group:"seguir sin",group_index:5,level:"B1"},{i:47,start:384.331,end:392.875,es:"Siguen sin contestar el teléfono.",group:"seguir sin",group_index:5,level:"B1"},{i:48,start:392.875,end:401.184,es:"Mi hijo sigue sin saber nadar.",group:"seguir sin",group_index:5,level:"B1"},{i:49,start:402.684,end:409.905,es:"Espero que sigas bien.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:50,start:409.905,end:418.492,es:"Ojalá siga haciendo buen tiempo.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:51,start:418.492,end:427.057,es:"Si sigues así, vas a llegar lejos.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:52,start:427.057,end:433.895,es:"¡Que siga la fiesta!",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:53,start:433.895,end:442.417,es:"No creo que siga lloviendo mañana.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:54,start:442.417,end:451.687,es:"Seguiría estudiando si tuviera más tiempo.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:55,start:451.687,end:460.615,es:"Sigue así, lo estás haciendo muy bien.",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:56,start:460.615,end:467.729,es:"¿Cómo sigue tu madre?",group:"sigue así, que sigas bien",group_index:6,level:"B1"},{i:57,start:467.729,end:475.868,es:"Me pidió que siguiera adelante.",group:"sigue así, que sigas bien",group_index:6,level:"B1"}],fs={word:ms,slug:_s,kind:xs,hash:As,duration:hs,voice:bs,marks:qs},ys="soler",js="soler",Bs="word",zs="76bcef0368cde217",Ms=526.416,Es="alex",$s=[{i:0,start:.5,end:8.255,es:"Suelo desayunar a las siete.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:1,start:8.255,end:16.649,es:"Mi padre suele leer el periódico.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:2,start:16.649,end:23.913,es:"Solemos comer en casa.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:3,start:23.913,end:31.647,es:"Ella suele llegar temprano.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:4,start:31.647,end:39.209,es:"Suelo caminar al trabajo.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:5,start:39.209,end:47.903,es:"Los niños suelen dormir la siesta.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:6,start:47.903,end:56.553,es:"Mis abuelos suelen cenar temprano.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:7,start:56.553,end:64.671,es:"Suelo beber agua con la comida.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:8,start:64.671,end:73.151,es:"Los sábados solemos ir al mercado.",group:"suelo, sueles, suele",group_index:0,level:"A1"},{i:9,start:74.651,end:82.149,es:"¿Sueles cocinar en casa?",group:"preguntas",group_index:1,level:"A1"},{i:10,start:82.149,end:90.011,es:"¿A qué hora sueles levantarte?",group:"preguntas",group_index:1,level:"A1"},{i:11,start:90.011,end:97.936,es:"¿Dónde suelen comer ustedes?",group:"preguntas",group_index:1,level:"A1"},{i:12,start:97.936,end:105.947,es:"¿Qué sueles hacer los domingos?",group:"preguntas",group_index:1,level:"A1"},{i:13,start:105.947,end:113.339,es:"¿Sueles viajar en verano?",group:"preguntas",group_index:1,level:"A1"},{i:14,start:113.339,end:121.243,es:"¿Cómo sueles ir al trabajo?",group:"preguntas",group_index:1,level:"A1"},{i:15,start:121.243,end:130.725,es:"¿Tu hermana suele llamar los fines de semana?",group:"preguntas",group_index:1,level:"A1"},{i:16,start:130.725,end:138.395,es:"¿Qué suele cenar tu familia?",group:"preguntas",group_index:1,level:"A1"},{i:17,start:139.895,end:147.713,es:"No suelo ver la televisión.",group:"no suelo",group_index:2,level:"A2"},{i:18,start:147.713,end:156.663,es:"Mi madre no suele cocinar los lunes.",group:"no suelo",group_index:2,level:"A2"},{i:19,start:156.663,end:164.332,es:"No solemos salir de noche.",group:"no suelo",group_index:2,level:"A2"},{i:20,start:164.332,end:171.937,es:"Él no suele llegar tarde.",group:"no suelo",group_index:2,level:"A2"},{i:21,start:171.937,end:179.905,es:"No suelo comer carne roja.",group:"no suelo",group_index:2,level:"A2"},{i:22,start:179.905,end:189.281,es:"Los domingos no suelen abrir las tiendas.",group:"no suelo",group_index:2,level:"A2"},{i:23,start:189.281,end:197.911,es:"No suelo dormir bien en los aviones.",group:"no suelo",group_index:2,level:"A2"},{i:24,start:197.911,end:208.908,es:"Mis amigos no suelen contestar los mensajes rápido.",group:"no suelo",group_index:2,level:"A2"},{i:25,start:210.408,end:219.08,es:"En agosto suele hacer mucho calor.",group:"lo normal",group_index:3,level:"A2"},{i:26,start:219.08,end:227.795,es:"En esta ciudad suele llover en abril.",group:"lo normal",group_index:3,level:"A2"},{i:27,start:227.795,end:235.763,es:"El tren suele llegar puntual.",group:"lo normal",group_index:3,level:"A2"},{i:28,start:235.763,end:244.563,es:"Los lunes suele haber mucho tráfico.",group:"lo normal",group_index:3,level:"A2"},{i:29,start:244.563,end:253.171,es:"Este restaurante suele estar lleno.",group:"lo normal",group_index:3,level:"A2"},{i:30,start:253.171,end:262.163,es:"La primera clase suele ser fácil.",group:"lo normal",group_index:3,level:"A2"},{i:31,start:262.163,end:271.496,es:"En invierno suele nevar en las montañas.",group:"lo normal",group_index:3,level:"A2"},{i:32,start:271.496,end:281.235,es:"Las entradas del museo suelen costar poco.",group:"lo normal",group_index:3,level:"A2"},{i:33,start:282.735,end:291.129,es:"De niño, solía jugar en la calle.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:34,start:291.129,end:300.228,es:"Mi abuela solía hacer pan los domingos.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:35,start:300.228,end:308.687,es:"Solíamos ir a la playa en verano.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:36,start:308.687,end:317.508,es:"¿Qué solías hacer después de clase?",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:37,start:317.508,end:325.583,es:"Mi padre solía fumar mucho.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:38,start:325.583,end:334.724,es:"En la universidad, solía estudiar de noche.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:39,start:334.724,end:344.143,es:"Mis primos solían visitarnos en Navidad.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:40,start:344.143,end:352.964,es:"Solía tomar el autobús a las siete.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:41,start:352.964,end:361.828,es:"Ella solía escribir cartas a mano.",group:"solía: hábitos del pasado",group_index:4,level:"A2"},{i:42,start:363.328,end:373.067,es:"Antes solía correr, pero ahora prefiero nadar.",group:"antes y ahora",group_index:5,level:"A2"},{i:43,start:373.067,end:382.763,es:"Solía tomar tres cafés al día, pero ya no.",group:"antes y ahora",group_index:5,level:"A2"},{i:44,start:382.763,end:394.357,es:"Antes solíamos
